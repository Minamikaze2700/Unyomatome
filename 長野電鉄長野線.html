<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長野電鉄 列車運用記録システム</title>
<style>
:root{
  --primary:#e91419;
  --primary-dark:#d90f14;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}

/* 日別・時刻フィルター */
.control-bar{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.day-btn,.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.day-btn.active,.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}

/* 路線図 */
:root{--row-height:130px}
.line-container{
  position:relative;width:min(1100px,100%);margin:0 auto;
  padding:20px 0 80px;display:flex;flex-direction:column;align-items:center;
}
.rail-line{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:8px;background:var(--primary);z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}
.station-badge{
  position:relative;width:min(290px,calc(100% - 190px));height:72px;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  height:44px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;line-height:1;font-weight:500;
  letter-spacing:.12em;padding-left:.12em;
}
.station-name-en{
  height:24px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:top .15s,transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 245px))}
.train-icon.right{right:max(6px,calc(50% - 245px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:48px;height:38px;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-label{
  margin-top:2px;max-width:66px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:8px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#808080}
.train-label.b-express{background:#2e7d32}
.train-label.a-express{background:#e91419}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:101;
  max-width:620px;margin:0 auto;max-height:88vh;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
}
.bottom-sheet.active{bottom:0}
.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px}
.train-card{
  background:#fff;border-radius:8px;padding:12px;display:flex;
  align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.train-card-img{width:66px;height:54px;object-fit:contain}
.train-info-main{flex:1}
.type-badge{background:#616161;color:#fff;padding:3px 8px;border-radius:4px;font-size:.85rem;display:inline-block}
.train-title{font-size:1.1rem;font-weight:700;margin-left:6px}
.train-number{color:#1b6e27;font-weight:800;float:right}
.formation-id{font-size:1.2rem;font-weight:800;color:#1b6e27;margin-top:4px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}
.input-trigger-btn{
  background:var(--primary);color:#fff;padding:4px 8px;border-radius:4px;
  font-size:.75rem;margin-top:4px;display:inline-block;
}
.timetable-list{background:#fff;border-radius:8px;padding:12px 20px}
.timetable-item{display:flex;align-items:center;padding:8px 0;position:relative}
.timetable-item::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;
  background:var(--primary);z-index:1;
}
.timetable-item:first-child::before{top:50%}
.timetable-item:last-child::before{bottom:50%}
.time-dot{width:18px;height:18px;background:var(--primary);border-radius:50%;z-index:2;margin-right:16px}
.time-text{width:50px;font-weight:700}
.station-text{font-weight:700;font-size:1.05rem}
.select-box-container{position:relative;width:100%;margin:12px 0}
.custom-select-trigger{
  background:#fff;border:2px solid #ccc;border-radius:8px;padding:10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:1.05rem;color:#1b6e27;
}
.custom-select-options{
  position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;
  border-radius:8px;max-height:250px;overflow-y:auto;z-index:200;display:none;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.custom-select-options.open{display:block}
.option-header{
  background:#f0f0f0;padding:8px 12px;font-weight:700;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid #e0e0e0;
}
.option-item{
  padding:8px 12px 8px 32px;display:flex;align-items:center;gap:10px;
  cursor:pointer;border-bottom:1px solid #f0f0f0;
}
.option-item:hover{background:#e8f5e9}
.option-img{width:36px;height:30px;object-fit:contain}
.report-btn{
  width:100%;background:var(--primary);color:#fff;border:none;padding:14px;
  border-radius:8px;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:20px;
}
.data-note{text-align:center;color:#777;font-size:12px;padding:0 16px 30px}

@media(max-width:800px){
  :root{--row-height:120px}
  .station-badge{width:min(290px,calc(100% - 150px));height:72px}
  .station-name-ja{height:44px;font-size:30px}
  .station-name-en{height:24px;font-size:16px}
  .train-icon{width:64px}
  .train-icon.left{left:10px}
  .train-icon.right{right:10px}
  .train-icon img{width:48px;height:38px}
  .train-label{max-width:64px;font-size:8px}
  .train-no{font-size:10px}
}
@media(max-width:560px){
  :root{--row-height:105px}
  .station-badge{width:calc(100% - 100px);height:66px}
  .station-name-ja{height:40px;font-size:26px}
  .station-name-en{height:22px;font-size:14px}
  .train-icon{width:54px}
  .train-icon.left{left:2px}
  .train-icon.right{right:2px}
  .train-icon img{width:40px;height:32px}
  .train-label{max-width:54px;font-size:7px}
  .control-bar{gap:5px;padding:8px 5px}
  .time-label{font-size:12px}
  .time-input{width:92px}
  .day-btn,.time-now-btn{padding:6px 10px;font-size:12px}
}
</style>
</head>

</div>

<div class="line-container" id="lineContainer">

</div>

</div>

let currentTrainNo=null;
let isEditMode=false;
let currentDay=(new Date().getDay()===0||new Date().getDay()===6)?'休日':'平日';
let followNow=true;

function getVisibleTrains(){
  return TRAINS.filter(t=>t.days.includes(currentDay));
}
function setDay(day){
  currentDay=day;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===day));
  renderLine();
}
function formationById(id){
  if(!id) return null;
  for(const group of FORMATIONS){
    const f=group.items.find(i=>i.id===id);
    if(f) return f;
  }
  return null;
}
function imageForTrain(t){
  const f=formationById(t.formation);
  return f ? f.img : 'images/Nagano_noimage.png';
}
function stationIndex(name){
  return STATIONS.findIndex(s=>s.nameJa===name);
}
function timeToMinutes(value){
  const [h,m]=value.split(':').map(Number);
  return h*60+m;
}
function currentMinutes(){
  const input=document.getElementById('timeInput');
  const v=input&&input.value;
  if(v) return timeToMinutes(v);
  const d=new Date();
  return d.getHours()*60+d.getMinutes();
}
function formatTimeNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function setNowTime(){
  followNow=true;
  const input=document.getElementById('timeInput');
  if(input) input.value=formatTimeNow();
  const btn=document.getElementById('nowBtn');
  if(btn) btn.classList.add('active');
  renderTrainPositions();
}
function setManualTime(){
  followNow=false;
  const btn=document.getElementById('nowBtn');
  if(btn) btn.classList.remove('active');
  renderTrainPositions();
}
function initTimeControl(){
  const input=document.getElementById('timeInput');
  if(!input) return;
  input.value=formatTimeNow();
  input.addEventListener('input',setManualTime);
}
function trainVisualKind(t){
  if(/B$/.test(String(t.no))) return 'b-express';
  if(/A$/.test(String(t.no))) return 'a-express';
  return 'normal';
}
function trainLabelText(t){
  return `${displayType(t.type)} ${t.dest}`;
}
function renderLine(){
  const container=document.getElementById('lineContainer');
  container.innerHTML='<div class="rail-line"></div><div class="moving-train-layer" id="movingTrainLayer"></div>';

  STATIONS.forEach(st=>{
    const row=document.createElement('div');
    row.className='station-row';
    const badge=document.createElement('div');
    badge.className='station-badge';
    badge.innerHTML=`
      <div class="station-name-ja">${st.nameJa}</div>
      <div class="station-name-en">${st.nameEn}</div>
    `;
    row.appendChild(badge);
    container.appendChild(row);
  });
  renderTrainPositions();
}
function positionAtTime(t, minutes){
  const stops=t.stops;
  if(!stops||stops.length===0) return null;
  const first=timeToMinutes(stops[0].time);
  const last=timeToMinutes(stops[stops.length-1].time);
  if(minutes<first||minutes>last) return null;
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    const ta=timeToMinutes(a.time),tb=timeToMinutes(b.time);
    if(minutes>=ta && minutes<=tb){
      const ia=stationIndex(a.station), ib=stationIndex(b.station);
      const ratio=tb===ta?0:(minutes-ta)/(tb-ta);
      return ia+(ib-ia)*ratio;
    }
  }
  return stationIndex(stops[stops.length-1].station);
}
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  layer.innerHTML='';
  const visible=getVisibleTrains();
  const occupied={left:[],right:[]};
  visible.forEach(t=>{
    const pos=positionAtTime(t,minutes);
    if(pos===null) return;
    const side=t.direction==='down'?'right':'left';
    occupied[side].push({t,pos});
  });
  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24 && u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});
      const el=document.createElement('div');
      el.className=`train-icon ${side}`;
      const laneShift=lane*78*(side==='left'?-1:1);
      const rowHeight=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-height'))||175;
      const linePaddingTop=20;
      el.style.top=`${linePaddingTop + item.pos*rowHeight + rowHeight/2 - 38}px`;
      el.style.setProperty('--lane-shift',`${laneShift}px`);
      el.style.transform=`translateX(${laneShift}px)`;
      el.innerHTML=`
        <span class="train-no">${item.t.no}</span>
        <img src="${imageForTrain(item.t)}" alt="${item.t.no}">
        <span class="train-label ${trainVisualKind(item.t)}">${trainLabelText(item.t)}</span>
      `;
      el.onclick=()=>openSheet(item.t.no);
      layer.appendChild(el);
    });
  });
}
function openSheet(trainNo){
  currentTrainNo=trainNo;
  isEditMode=false;
  updateSheetContent();
  document.getElementById('overlay').style.display='block';
  document.getElementById('bottomSheet').classList.add('active');
}
function closeSheet(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('bottomSheet').classList.remove('active');
}
function updateSheetContent(){
  const train=TRAINS.find(t=>t.no===currentTrainNo);
  if(!train) return;
  const formObj=formationById(train.formation);
  const content=document.getElementById('sheetContent');
  const imgSrc=formObj?formObj.img:'images/Nagano_noimage.png';

  if(!isEditMode){
    content.innerHTML=`
      <div class="train-card" onclick="switchToEditMode()">
        <img src="${imgSrc}" class="train-card-img">
        <div class="train-info-main">
          <div>
            <span class="type-badge">${displayType(train.type)}</span>
            <span class="train-title">${train.dest}</span>
            <span class="train-number">${train.no}</span>
          </div>
          ${formObj
            ? `<div class="formation-id">${formObj.id}</div>`
            : `<div class="input-trigger-btn">ここから編成を入力</div>`}
          <div class="capacity-info">所定:${train.defaultCars}　運転日:${train.days.join('・')}</div>
        </div>
      </div>
      <div class="timetable-list">
        ${train.stops.map(s=>`
          <div class="timetable-item">
            <div class="time-dot"></div>
            <div class="time-text">${s.time}</div>
            <div class="station-text">${s.station}</div>
          </div>
        `).join('')}
      </div>
    `;
  }else{
    const selectedForm=formObj||FORMATIONS[0].items[2];
    content.innerHTML=`
      <div class="train-card">
        <img src="images/Nagano_noimage.png" class="train-card-img">
        <div class="train-info-main">
          <div>
            <span class="type-badge">${displayType(train.type)}</span>
            <span class="train-title">${train.dest}</span>
            <span class="train-number">${train.no}</span>
          </div>
          <div class="input-trigger-btn" style="background:#b71c1c;">編成を入力中</div>
          <div class="capacity-info">所定:${train.defaultCars}</div>
        </div>
      </div>
      <div style="text-align:center;font-weight:700;margin:16px 0;font-size:1.2rem;">編 成 入 力 欄</div>
      <div class="select-box-container">
        <div class="custom-select-trigger" onclick="toggleDropdown()">
          <div style="display:flex;align-items:center;gap:10px">
            <img src="${selectedForm.img}" id="selectedOptionImg" style="width:35px;height:30px;object-fit:contain">
            <span id="selectedOptionText">${selectedForm.name}</span>
          </div>▼
        </div>
        <div class="custom-select-options" id="dropdownOptions">
          ${FORMATIONS.map(group=>`
            <div class="option-header">
              <img src="${group.typeImg}" class="option-img"><span>${group.type}</span>
            </div>
            ${group.items.map(item=>`
              <div class="option-item" onclick="selectFormation('${item.id}')">
                <img src="${item.img}" class="option-img"><span>${item.name}</span>
              </div>
            `).join('')}
          `).join('')}
        </div>
      </div>
      <button class="report-btn" onclick="sendReport()">投稿ミスを報告</button>
    `;
  }
}
function switchToEditMode(){
  isEditMode=true;
  updateSheetContent();
}
function toggleDropdown(){
  const el=document.getElementById('dropdownOptions');
  if(el) el.classList.toggle('open');
}
function selectFormation(formId){
  const train=TRAINS.find(t=>t.no===currentTrainNo);
  if(train) train.formation=formId;
  renderLine();
  isEditMode=false;
  updateSheetContent();
}
function sendReport(){
  const email='minamikaze2700@gmail.com';
  const subject=encodeURIComponent(`長野電鉄 投稿ミス報告 ${currentTrainNo}列車`);
  window.location.href=`mailto:${email}?subject=${subject}`;
}
window.addEventListener('load',()=>{ document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===currentDay)); initTimeControl(); setNowTime(); renderLine(); setInterval(()=>{ if(followNow){ setNowTime(); } },1000); });
</script>
