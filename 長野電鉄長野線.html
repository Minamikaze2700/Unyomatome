
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi&family=Kosugi+Maru&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運用まとめ - 長野電鉄長野線</title>
<style>
:root{
  --primary:#e91419;
  --primary-dark:#d90f14;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Kosugi",sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}

/* 日別・時刻フィルター */
#title{
    height: 50px;
    color: #fff;
    font-weight: 500;
    display: flex;
    background: #e91419;
    width: 100%;
    position: fixed;
    justify-content: center;
    align-items: center;
    border-bottom: 8px solid #000;
    z-index: 100;
}
.control-bar{
  position:sticky;top:50px;z-index:20;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.day-btn,.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.day-btn.active,.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}
.sync-btn{border:1px solid #bbb;background:#fff;color:#555;border-radius:999px;padding:5px 10px;cursor:pointer;font-weight:700}


/* 路線図 */
:root{--row-height:325px}
.line-container{
  position:relative;width:100%;max-width:none;margin:0 auto;
  padding:20px 0 80px;display:flex;flex-direction:column;align-items:center;
}
.rail-line{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:12px;background:var(--primary);z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}
.station-badge{
  position:relative;width:290px;min-width:290px;height:auto;aspect-ratio:290 / 72;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  font-family:"Kosugi Maru",sans-serif;
  height:61.1111%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;line-height:1;font-weight:500;
  letter-spacing:.12em;padding-left:.12em;
}
.station-name-en{
  font-family:"Kosugi Maru",sans-serif;
  height:33.3333%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 245px))}
.train-icon.right{right:max(6px,calc(50% - 245px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:60px;height:auto;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-label{
  margin-top:2px;max-width:100px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:12px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#808080}
.train-label.b-express{background:#2e7d32}
.train-label.a-express{background:#e91419}
.train-label.deadhead{background:#fff;color:#111;border:1px solid #bbb}



/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:101;
  max-width:620px;margin:0 auto;max-height:75vh;min-height:0;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
}
.bottom-sheet.active{bottom:0}
.bottom-sheet.editing{height:75vh;max-height:75vh;min-height:75vh}
.bottom-sheet.editing .sheet-content{min-height:calc(75vh - 58px)}
.bottom-sheet.editing .custom-select-options{max-height:min(22vh,720px)}
.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.sheet-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sheet-back-btn{
  display:none;width:28px;height:28px;border:0;background:transparent;color:#fff;
  padding:0;cursor:pointer;position:relative;flex:0 0 28px;
}
.sheet-back-btn::before{
  content:'';position:absolute;left:7px;top:6px;width:13px;height:13px;
  border-left:4px solid currentColor;border-bottom:4px solid currentColor;
  transform:rotate(45deg);
  box-sizing:border-box;
}
.sheet-back-btn.visible{display:inline-block;}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px;position:relative;overflow:hidden}
.timetable-list{position:relative;overflow:hidden;z-index:1}
.train-card{
  background:#fff;border-radius:8px;padding:12px 12px 30px;display:flex;
  align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.station-info-card{cursor:default;}
.station-info-card:hover{border-color:transparent;}
.station-placeholder{margin-top:12px;min-height:140px;}
.station-badge{cursor:pointer;}
.station-timetable-title{
  font-family:"Kosugi",sans-serif;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px;
}
.station-timetable-direction-tabs{display:flex;gap:8px;margin:0 0 12px;justify-content:flex-start;}
.station-timetable-direction-tab{
  flex:0 0 50%;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);
  font-family:"Kosugi",sans-serif;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer;
}
.station-timetable-direction-tab.active{background:var(--primary);color:#fff;}
.station-timetable-direction-tab:hover{background:#fff1f1;}
.station-timetable-direction-tab.active:hover{background:var(--primary-dark);}
.station-timetable-wrap{margin-top:4px;background:#fff;overflow:hidden;}
.station-timetable-direction{margin-top:0;}
.station-timetable-grid{display:flex;flex-direction:column;gap:0;align-items:flex-start;}
.station-timetable-hour-row{display:flex;align-items:stretch;justify-content:flex-start;}
.station-timetable-cell{width:80px;height:80px;min-width:80px;display:flex;align-items:center;justify-content:center;border:0;padding:0;line-height:1;}
.station-timetable-hour{color:#fff;background:var(--primary);font-family:"Kosugi Maru",sans-serif;font-size:40px;font-weight:500;}
.station-timetable-hour.hour-alt{background:#ea7e83;}
.station-timetable-time{background:#fff;color:#000;cursor:pointer;font-family:"Kosugi Maru",sans-serif;font-size:34px;font-weight:500;}
.station-timetable-time.minute-alt{background:#c8c8c8;}
.station-timetable-time:hover{filter:brightness(.95);}
.station-timetable-empty{background:#fff;}
.station-timetable-meta{
  padding:8px 10px;text-align:left;color:#666;font-family:"Kosugi",sans-serif;font-size:.78rem;
}
@media (max-width:959.98px){
  .station-timetable-cell{width:80px;height:80px;min-width:80px;}
  .station-timetable-hour{font-size:40px;}
  .station-timetable-time{font-size:34px;}
}
.station-badge:focus{outline:3px solid rgba(0,0,0,.35);outline-offset:4px;}

/* 駅情報：最初の項目 */
.station-overview-card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  margin-bottom:16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-overview-main{
  text-align:center;padding:8px 10px 9px;background:#fff;
}
.station-overview-name-ja{
  font-family:"Kosugi Maru",sans-serif;
  font-size:52px;line-height:.95;font-weight:500;letter-spacing:.08em;padding-left:.08em;color:#000;
}
.station-overview-name-en{
  font-family:"Kosugi Maru",sans-serif;
  font-size:29px;line-height:1.02;font-weight:500;letter-spacing:.015em;color:#000;
  margin-top:2px;
}
.station-direction-bar-wrap{width:100%;}
.station-direction-bar{
  width:100%;height:18px;background:var(--primary);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
}
.station-direction-bar.no-prev{clip-path:polygon(0 0,97% 0,100% 100%,0 100%);}
.station-direction-bar.no-next{clip-path:polygon(3% 0,100% 0,100% 100%,0 100%);}
.station-direction-bar.no-prev.no-next{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.station-neighbor-row{display:flex;width:100%;min-height:54px;background:#fff;}
.station-neighbor{
  width:50%;display:flex;flex-direction:column;justify-content:flex-start;
  padding:2px 8px 8px;min-width:0;
}
.station-neighbor.left{text-align:left;align-items:flex-start;}
.station-neighbor.right{text-align:right;align-items:flex-end;}
.station-neighbor-name-ja{
  font-family:"Kosugi Maru",sans-serif;font-size:27px;line-height:1.05;font-weight:700;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.station-neighbor-name-en{
  font-family:"Kosugi Maru",sans-serif;font-size:14px;line-height:1.1;font-weight:500;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px;
}
.station-neighbor.empty{visibility:hidden;}

.train-card-img{width:75px;height:auto;object-fit:contain}
.train-info-main{flex:1}
.type-badge{background:#616161;color:#fff;padding:3px 8px;border-radius:4px;font-size:.78rem;display:inline-block}
.type-badge.a-express{background:#e91419}
.type-badge.b-express{background:#2e7d32}
.train-title{font-size:0.95rem;font-weight:700;margin-left:6px}
.train-number{color:#1b6e27;font-weight:800;float:right}
.formation-id{font-size:1.2rem;font-weight:800;color:#1b6e27;margin-top:4px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}

.formation-updated-at{position:absolute;right:12px;bottom:8px;font-size:.78rem;color:#777;text-align:right;} 
.input-trigger-btn{
  background:var(--primary);color:#fff;padding:4px 8px;border-radius:4px;
  font-size:.75rem;margin-top:4px;display:inline-block;
}
.timetable-list{background:#fff;border-radius:8px;padding:12px 20px}
.timetable-item{display:flex;align-items:center;padding:8px 0;position:relative;height:56px;min-height:56px}
.timetable-item::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;
  background:var(--primary);z-index:1;
}
.timetable-item:first-child::before{top:50%}
.timetable-item:last-child::before{bottom:50%}
.time-dot{width:18px;height:18px;background:var(--primary);border-radius:50%;z-index:2;margin-right:16px}
.time-text{width:50px;font-weight:700;display:flex;flex-direction:column;line-height:1.15;gap:2px}
.station-text{font-weight:700;font-size:1.05rem;line-height:1.2;display:flex;align-items:center;min-height:40px}
.select-box-container{position:relative;width:100%;margin:12px 0}
.custom-select-trigger{
  background:#fff;border:2px solid #ccc;border-radius:8px;padding:10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:1.25rem;color:#1b6e27;
}
.custom-select-options{
  position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;
  border-radius:8px;max-height:250px;overflow-y:auto;z-index:200;display:none;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.custom-select-options.open{display:block}
.option-header{
  background:#f0f0f0;padding-left:16px;font-weight:700;font-size:1.25rem;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid #e0e0e0;cursor:pointer;
}
.option-header:hover{background:#e8f5e9}
.option-item{
  padding-left:16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:1.25rem;
}
.option-item:hover{background:#e8f5e9}
.option-item.type-option,.option-item.initial-option{background:#e0e0e0}
.option-item.type-option:hover,.option-item.initial-option:hover{background:#d0d0d0}
.option-img{width:auto;height:60px;object-fit:contain}

/* スマホ版：1920pxの元レイアウトから中央960px（左右480pxずつをカット）を
   そのまま100vwへ縮小表示する。960px以上はデスクトップ表示を変更しない。 */
@media (max-width:959.98px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  #viewportCanvas{
    width:1920px;
    min-width:1920px;
    max-width:none;
    margin-left:-480px;
    zoom:calc(100vw / 960px);
  }
  #viewportCanvas #title,
  #viewportCanvas .control-bar,
  #viewportCanvas .line-container{
    width:1920px;
    max-width:none;
    min-width:0;
  }
}

</style>
</head>
<body>

<div id="viewportCanvas">
<h1 id="title">長野電鉄長野線</h1>
<div class="control-bar">
  <div class="day-filter">
    <button class="day-btn" data-day="平日" onclick="setDay('平日')">平日</button>
    <button class="day-btn" data-day="休日" onclick="setDay('休日')">休日</button>
  </div>
  <div class="time-control">
    <span class="time-label">表示時刻</span>
    <input id="timeInput" class="time-input" type="time" step="60">
    <button id="nowBtn" class="time-now-btn active" onclick="setNowTime()">現在時刻</button>
  </div>
</div>

<div class="line-container" id="lineContainer">
  <div class="rail-line"></div>
  <div class="moving-train-layer" id="movingTrainLayer"></div>
</div>
</div><!-- /#viewportCanvas -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-header">
    <div class="sheet-header-left">
      <button id="sheetBackBtn" class="sheet-back-btn" type="button" aria-label="駅情報に戻る" onclick="sheetBack()"></button>
      <span>列車情報</span>
    </div>
    <span class="close-btn" onclick="closeSheet()">✖</span>
  </div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

function buildTimetableRows(stops){
  const rows=[];
  for(let i=0;i<(stops||[]).length;){
    const station=stops[i].station;
    const times=[stops[i].time];
    let j=i+1;
    while(j<stops.length && stops[j].station===station){
      times.push(stops[j].time);
      j++;
    }
    rows.push({station,times});
    i=j;
  }
  return rows;
}

function todayKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');

}
function operationDateKey(d=new Date()){
  const base=new Date(d);
  if(base.getHours()<RESET_HOUR) base.setDate(base.getDate()-1);
  return todayKey(base);
}
function resetTimeForDate(dateKey){ return dateKey+'T03:00:00'; }
function normalizeTrainNo(v){
  if(v===null||v===undefined) return '';
  const s=String(v);
  return /^\d+\.0$/.test(s)?s.slice(0,-2):s;
}
function cloneState(obj){ return JSON.parse(JSON.stringify(obj||{})); }
function historyEntries(){ return Object.values(remoteRoot.history||{}).sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''))); }
function syncStatus(text){
  const el=document.getElementById('syncStatus');
  if(el) el.textContent='共有同期：'+text;
}
function stateFingerprint(root=remoteRoot){
  try{
    return JSON.stringify({
      operationDate:root?.operationDate||null,
      stateByDay:root?.stateByDay||{平日:{},休日:{}},
      formationUpdatedAtByDay:root?.formationUpdatedAtByDay||{平日:{},休日:{}},
      history:root?.history||{}
    });
  }catch(e){ return ''; }
}
function saveLocalState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      operationDate:currentOperationDate,
      stateByDay:remoteRoot.stateByDay,
      formationUpdatedAtByDay:remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}},
      history:remoteRoot.history,
      updatedAt:new Date().toISOString()
    }));
  }catch(e){ console.warn('local save failed',e); }
}
function loadLocalState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const obj=JSON.parse(raw);
    remoteRoot.operationDate=obj.operationDate||null;
    remoteRoot.stateByDay=obj.stateByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay=obj.formationUpdatedAtByDay||{平日:{},休日:{}};
    remoteRoot.history=obj.history||{};
    currentOperationDate=remoteRoot.operationDate;
    operationHistory=historyEntries();
    registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
    applyRegistrationState();
  }catch(e){ console.warn('local load failed',e); }
}
function applyRegistrationState(){
  TRAINS.forEach(t=>{
    const key=String(t.no);
    if(Object.prototype.hasOwnProperty.call(pendingFormationState,key)){
      t.formation=pendingFormationState[key]||null;
    }else{
      t.formation=registrationState[key]||null;
    }
  });
}
function broadcastState(){
  if(!channel) return;
  // 送信はローカルで変更を確定した側だけが行う。
  // 受信側からの再送は絶対に行わない。
  channel.postMessage({source:'train-app',type:'state',root:cloneState(remoteRoot),ts:Date.now()});
}
function hydrateFromRoot(data){
  const next=data||{version:0,operationDate:null,stateByDay:{平日:{},休日:{}},formationUpdatedAtByDay:{平日:{},休日:{}},history:{}};
  const normalized={
    ...next,
    stateByDay:{平日:cloneState(next.stateByDay?.平日||{}),休日:cloneState(next.stateByDay?.休日||{})},
    formationUpdatedAtByDay:{平日:cloneState(next.formationUpdatedAtByDay?.平日||{}),休日:cloneState(next.formationUpdatedAtByDay?.休日||{})},
    history:cloneState(next.history||{})
  };
  if(stateFingerprint(normalized)===stateFingerprint(remoteRoot)) return false;
  remoteRoot=normalized;
  currentOperationDate=remoteRoot.operationDate||currentOperationDate||operationDateKey();
  operationHistory=historyEntries();
  registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
  applyRegistrationState();
  // 受信した状態を再保存・再送しない。これが同期ループ防止の重要点。
  return true;
}
function firebaseOperationRef(){ return firebase.database().ref('運用'); }
function firebaseHistoryRef(){ return firebase.database().ref('履歴'); }

// 列車データは詳細画面の開閉状態に関係なく常時同期・更新する。
// Firebaseから取得した編成状態を各列車へ即時反映し、メイン画面と詳細画面の
// 両方が同じインメモリキャッシュを参照する。
const LIVE_TRAIN_CACHE = new Map();
function refreshAllTrainDataCache(){
  LIVE_TRAIN_CACHE.clear();
  for(const t of TRAINS){
    const key=String(t.no);
    const cached={...t, stops:(t.stops||[]).map(s=>({...s}))};
    cached.defaultCars=prescribedFormationName(cached);
    // Firebase確定値が一瞬空になっても、入力処理中の編成を優先して表示を維持する。
    const effectiveFormation=Object.prototype.hasOwnProperty.call(pendingFormationState,key)
      ? pendingFormationState[key]
      : registrationState[key];
    cached.formation=effectiveFormation||null;
    LIVE_TRAIN_CACHE.set(key,cached);
    TRAIN_DATA_CACHE.set(key,cached);
  }
}
function liveTrain(trainNo){
  const key=String(trainNo);
  return LIVE_TRAIN_CACHE.get(key)||TRAIN_DATA_CACHE.get(key)||TRAIN_INDEX[key]||null;
}
function refreshVisibleUI(){
  // 編成入力中は、Firebase等からの列車データ更新による再描画を停止。
  // 入力完了後のselectFormation()でまとめて最新状態を反映する。
  if(isEditMode) return;
  refreshAllTrainDataCache();
  renderLine();
  if(currentTrainNo) updateSheetContent();
}

function subscribeAllOperationState(){
  if(!firebaseReady) return;
  if(firebaseDayListenerCallback){
    firebaseOperationRef().child('stateByDay').off('value',firebaseDayListenerCallback);
  }
  firebaseDayListenerDay='__ALL__';
  firebaseDayListenerCallback=(snap)=>{
    const all=snap.val();
    if(!all || typeof all!=='object') return;
    const nextRoot={
      ...remoteRoot,
      stateByDay:{
        平日:Object.prototype.hasOwnProperty.call(all,'平日')?cloneState(all.平日||{}):cloneState(remoteRoot.stateByDay?.平日||{}),
        休日:Object.prototype.hasOwnProperty.call(all,'休日')?cloneState(all.休日||{}):cloneState(remoteRoot.stateByDay?.休日||{})
      }
    };
    if(stateFingerprint(nextRoot)===stateFingerprint(remoteRoot)) return;
    remoteRoot.stateByDay=nextRoot.stateByDay;
    if(isEditMode){
      syncStatus('編成入力中：更新を一時停止');
      return;
    }
    registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
    Object.entries(pendingFormationState).forEach(([no,formId])=>{ registrationState[no]=formId; });
    applyRegistrationState();
    saveLocalState();
    refreshVisibleUI();
    syncStatus('Firebase同期済み');
  };
  firebaseOperationRef().child('stateByDay').on('value',firebaseDayListenerCallback,err=>{
    console.error('Firebase運用読込失敗',err);
    syncStatus('Firebase読込失敗');
  });
}

function prefetchTrainImages(){
  const urls=new Set(['images/Nagano_noimage.png']);
  for(const group of FORMATIONS){
    if(group.typeImg) urls.add(group.typeImg);
    for(const item of group.items||[]) if(item.img) urls.add(item.img);
  }
  for(const url of urls){
    const img=new Image();
    img.decoding='async';
    img.src=url;
  }
}

async function preloadFirebaseState(){
  if(!firebaseReady) return;
  try{
    const [stateSnap,timestampSnap,historySnap]=await Promise.all([
      firebaseOperationRef().child('stateByDay').once('value'),
      firebaseOperationRef().child('formationUpdatedAtByDay').once('value'),
      firebaseHistoryRef().once('value')
    ]);
    const all=stateSnap.val()||{};
    remoteRoot.stateByDay={
      平日:cloneState(all.平日||{}),
      休日:cloneState(all.休日||{})
    };
    remoteRoot.formationUpdatedAtByDay={
      平日:cloneState(timestampSnap.val()?.平日||{}),
      休日:cloneState(timestampSnap.val()?.休日||{})
    };
    registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
    remoteRoot.history=historySnap.val()||{};
    operationHistory=historyEntries();
    applyRegistrationState();
    saveLocalState();
    refreshVisibleUI();
  }catch(e){
    console.warn('Firebase事前取得失敗',e);
  }
}

function warmAllTrainData(){
  for(const t of TRAINS){ TRAIN_DATA_CACHE.set(String(t.no),t); }
  prefetchTrainImages();
}

async function initFirebase(){
  if(!FIREBASE_ENABLED){ syncStatus('ローカル（Firebase設定待ち）'); return false; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebaseReady=true;
    syncStatus('Firebase接続中');

    // 起動直後に平日・休日の全編成登録と履歴をまとめて取得。
    // 列車をクリックするまで待たず、画面表示前にキャッシュへ載せる。
    await preloadFirebaseState();

    // 以後は曜日ごとではなく stateByDay 全体を監視するので、
    // 別端末の変更も曜日切替の都度再購読せず即時反映できる。
    subscribeAllOperationState();

    firebaseOperationRef().child('formationUpdatedAtByDay').on('value',snap=>{
      const raw=snap.val()||{};
      const next={平日:cloneState(raw.平日||{}),休日:cloneState(raw.休日||{})};
      if(JSON.stringify(next)===JSON.stringify(remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}})) return;
      remoteRoot.formationUpdatedAtByDay=next;
      saveLocalState();
      if(currentTrainNo && !isEditMode) updateSheetContent();
    },err=>{
      console.error('Firebase編成入力時刻読込失敗',err);
    });

    firebaseHistoryRef().on('value',snap=>{
      const nextHistory=snap.val()||{};
      if(stateFingerprint({...remoteRoot,history:nextHistory})===stateFingerprint(remoteRoot)) return;
      remoteRoot.history=nextHistory;
      operationHistory=historyEntries();
      saveLocalState();
      if(currentTrainNo && !isEditMode) updateSheetContent();
    },err=>{
      console.error('Firebase履歴読込失敗',err);
    });

    // /運用 がまだ無ければ初期構造だけ作る。
    const opSnap=await firebaseOperationRef().once('value');
    if(!opSnap.exists()){
      await firebaseOperationRef().set({
        operationDate:operationDateKey(),
        stateByDay:{平日:{},休日:{}},
        formationUpdatedAtByDay:{平日:{},休日:{}},
        version:0,
        updatedAt:firebase.database.ServerValue.TIMESTAMP
      });
    }else{
      const data=opSnap.val()||{};
      remoteRoot=data;
      remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
      remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
      remoteRoot.history=remoteRoot.history||{};
      currentOperationDate=remoteRoot.operationDate||operationDateKey();
      registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshVisibleUI();
    }
    warmAllTrainData();
    return true;
  }catch(e){
    console.error('Firebase init failed',e);
    syncStatus('Firebase接続失敗');
    firebaseReady=false;
    return false;
  }
}
async function syncRegistrationToRemote(){
  if(!firebaseReady){
    syncStatus('Firebase未接続');
    return false;
  }
  try{
    // 日別状態だけをトランザクション更新する。
    // ルート全体を書き換えないので、別端末の登録を巻き戻さない。
    const dayRef=firebaseOperationRef().child('stateByDay').child(currentDay);
    const desired=cloneState(registrationState);
    const result=await dayRef.transaction(current=>{
      const next=(current && typeof current==='object')?current:{};
      Object.keys(next).forEach(no=>{
        if(!(no in desired)) delete next[no];
      });
      Object.entries(desired).forEach(([no,formId])=>{
        if(formId) next[String(no)]=formId;
        else delete next[String(no)];
      });
      return next;
    });
    if(!result.committed) throw new Error('Firebase transaction not committed');
    const committed=result.snapshot.val()||{};
    registrationState=cloneState(committed);
    remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
    remoteRoot.stateByDay[currentDay]=cloneState(committed);
    remoteRoot.formationUpdatedAtByDay[currentDay]={
      ...cloneState(remoteRoot.formationUpdatedAtByDay[currentDay]||{}),
      ...cloneState(pendingFormationTimestamps[currentDay]||{})
    };
    if(firebaseReady && Object.keys(pendingFormationTimestamps[currentDay]||{}).length){
      await firebaseOperationRef().child('formationUpdatedAtByDay').child(currentDay).update(cloneState(pendingFormationTimestamps[currentDay]));
    }
    Object.keys(pendingFormationState).forEach(no=>{
      if(String(registrationState[no]||'')===String(pendingFormationState[no]||'')) delete pendingFormationState[no];
    });
    pendingFormationTimestamps[currentDay]={};
    applyRegistrationState();
    saveLocalState();
    refreshAllTrainDataCache();
    broadcastState();
    syncStatus('Firebase同期済み');
    return true;
  }catch(e){
    console.error('Firebase書込失敗',e);
    syncStatus('Firebase書込失敗');
    return false;
  }
}

function findChain(day,trainNo){ return CHAIN_INDEX[day]?.[normalizeTrainNo(trainNo)]||null; }
function chainEntries(day,trainNo){
  const idx=findChain(day,trainNo);
  return idx?OPERATION_CHAINS[day][idx.chainIndex]:null;
}
async function recordSelection(train,formId){
  const chain=chainEntries(currentDay,train.no);
  const assigned=[];
  if(chain){
    chain.forEach(e=>{
      const no=normalizeTrainNo(e.no);
      if(TRAIN_INDEX[no]){ registrationState[no]=formId; assigned.push(no); }
    });
  }else{
    registrationState[String(train.no)]=formId;
    assigned.push(String(train.no));
  }
  const registeredAt=new Date().toISOString();
  pendingFormationTimestamps[currentDay]=pendingFormationTimestamps[currentDay]||{};
  remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
  remoteRoot.formationUpdatedAtByDay[currentDay]=remoteRoot.formationUpdatedAtByDay[currentDay]||{};
  assigned.forEach(no=>{
    pendingFormationState[no]=formId;
    pendingFormationTimestamps[currentDay][no]=registeredAt;
    remoteRoot.formationUpdatedAtByDay[currentDay][no]=registeredAt;
  });
  applyRegistrationState();
  refreshAllTrainDataCache();
  saveLocalState();
  const ok=await syncRegistrationToRemote();
  if(!ok){
    saveLocalState();
    syncStatus('同期失敗（再試行待ち）');
  }
  return assigned;
}

function snapshotForCurrentRegistrations(day, state, dateKey){
  const ops=[];
  const chainsForDay=OPERATION_CHAINS[day]||[];
  for(let i=0;i<chainsForDay.length;i++){
    const chain=chainsForDay[i];
    const shown=chain.map(e=>normalizeTrainNo(e.no)).filter(no=>TRAIN_INDEX[no]);
    if(!shown.length) continue;
    const byFormation={};
    shown.forEach(no=>{
      const f=state?.[no];
      if(!f) return;
      (byFormation[f]??=[]).push(no);
    });
    for(const [formationId,trainNumbers] of Object.entries(byFormation)){
      ops.push({
        operationId:`${day}-${String(i+1).padStart(2,'0')}`,
        day,
        firstTrainNo:String(chain[0].no),
        trainNumbers,
        formationId
      });
    }
  }
  return {date:dateKey,id:`${dateKey}_reset`,resetAt:resetTimeForDate(dateKey),operations:ops,loggedAt:new Date().toISOString()};
}

function snapshotFromStateRoot(oldRoot,dateKey){
  const days=[];
  for(const day of ['平日','休日']){
    const snap=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey);
    if(snap.operations.length) days.push(snap);
  }
  return {id:dateKey,date:dateKey,resetAt:resetTimeForDate(dateKey),days,loggedAt:new Date().toISOString()};
}

async function maybeResetForNewOperationDay(remoteCheck=false){
  const opDate=operationDateKey();
  if(!currentOperationDate) currentOperationDate=remoteRoot.operationDate||opDate;

  if(firebaseReady){
    try{
      await firebaseOperationRef().transaction(current=>{
        const cur=current||{stateByDay:{平日:{},休日:{}},operationDate:opDate,version:0};
        cur.stateByDay=cur.stateByDay||{平日:{},休日:{}};
        const oldDate=cur.operationDate;
        if(oldDate && oldDate!==opDate){
          const snapshot=snapshotFromStateRoot(cur,oldDate);
          if(snapshot.days.length){
            // transaction内では履歴書込みを行わず、後段で候補として保持
            window.__pendingResetSnapshot=snapshot;
          }
          cur.stateByDay={平日:{},休日:{}};
          cur.operationDate=opDate;
          cur.version=(cur.version||0)+1;
          cur.updatedAt=firebase.database.ServerValue.TIMESTAMP;
        }
        return cur;
      });
      if(window.__pendingResetSnapshot){
        const snapshot=window.__pendingResetSnapshot;
        window.__pendingResetSnapshot=null;
        try{
          // 日付固定キーで保存するため、複数端末が同時に3:00を検出しても同一履歴へ収束
          await firebaseHistoryRef().child(snapshot.id).set(snapshot);
          operationHistory=historyEntries();
          saveLocalState();
        }catch(e){
          // 既に他端末が登録済みの場合はルールにより書込失敗するが、これは正常な競合
          console.warn('履歴追加競合または失敗',e);
        }
      }
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.stateByDay={平日:{},休日:{}};
      registrationState={};
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }catch(e){ console.error('remote reset failed',e); }
  }else{
    if(currentOperationDate!==opDate){
      const snapshot=snapshotFromStateRoot(remoteRoot,currentOperationDate);
      remoteRoot.stateByDay={平日:{},休日:{}};
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.history=remoteRoot.history||{};
      if(snapshot.days.length) remoteRoot.history[snapshot.id]=snapshot;
      registrationState={};
      operationHistory=historyEntries();
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }else{
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      saveLocalState();
    }
  }
}

function historyToJsonl(){
  return historyEntries().map(x=>JSON.stringify(x)).join('\n')+(operationHistory.length?'\n':'');
}

function initSharedState(){
  loadLocalState();
  if('BroadcastChannel' in window){
    channel=new BroadcastChannel(CHANNEL_NAME);
    channel.onmessage=e=>{
      if(!e.data||e.data.source!=='train-app'||!e.data.root) return;
      const changed=hydrateFromRoot(e.data.root);
      if(!changed) return;
      saveLocalState();
      refreshAllTrainDataCache();
      if(isEditMode){
        syncStatus('編成入力中：更新を一時停止');
        return;
      }
      renderLine();
      if(currentTrainNo) updateSheetContent();
    };
  }
  window.addEventListener('storage',e=>{
    if(e.key!==STORAGE_KEY || !e.newValue) return;
    try{
      const obj=JSON.parse(e.newValue);
      const nextRoot={...remoteRoot,operationDate:obj.operationDate||remoteRoot.operationDate,stateByDay:obj.stateByDay||remoteRoot.stateByDay,history:obj.history||remoteRoot.history};
      const changed=hydrateFromRoot(nextRoot);
      if(!changed) return;
      refreshAllTrainDataCache();
      if(isEditMode) return;
      renderLine();
      if(currentTrainNo) updateSheetContent();
    }catch(err){ console.warn('storage sync failed',err); }
  });
}
function getVisibleTrains(){ return TRAINS.filter(t=>t.days.includes(currentDay)).map(t=>liveTrain(t.no)||t); }
function getShortType(type, trainNo=''){
  const value=String(type||'');
  if(value.includes('ゆけむり') && value.includes('のんびり')) return 'ゆの';
  if(value.includes('特急')){
    const no=String(trainNo||'');
    if(/A$/i.test(no)) return 'A特';
    if(/B$/i.test(no)) return 'B特';
    if(value.includes('ゆけむり')) return 'A特';
    if(value.includes('スノーモンキー')) return 'B特';
  }
  return value==='普通' ? '普通' : value==='回送' ? '回送' : value;
}
function getShortDest(dest){
  const map={'信州中野':'中野','湯田中':'湯田','長野':'長野','須坂':'須坂'};
  return map[dest]||String(dest||'');
}
function getDetailType(type){ return String(type||''); }
function getDetailDest(dest){ return String(dest||''); }
function getMainLabelClass(type){ return type==='回送' ? 'deadhead' : ''; }

function setDay(day){

function formationById(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return null;
  for(const group of FORMATIONS){
    const f=group.items.find(i=>i.id===id);
    if(f) return f;
  }
  return TYPE_SELECTIONS.find(i=>i.id===id)||null;
}
function selectionDisplayObject(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return INITIAL_FORMATION_SELECTION;
  return formationById(id)||INITIAL_FORMATION_SELECTION;
}
function prescribedFormationName(t){
  const type=String(t?.type||'');
  if(type.includes('スノーモンキー')) return '2100系';
  if(type.includes('ゆけむり')) return '1000系';
  if(type==='普通') return has100or300OperationNo(t) ? '3000系' : '普通3両';
  if(type==='回送' && has100or300OperationNo(t)) return '3000系';
  return String(t?.defaultCars||'');
}
function has100or300OperationNo(t){
  const noPattern=/^(?:1\d{2}|3\d{2})(?:[A-Za-z])?$/;
  const key=String(t?.no||'');
  if(noPattern.test(key)) return true;
  const info=findChain(currentDay,key);
  if(!info) return false;
  const chain=OPERATION_CHAINS[currentDay]?.[info.chainIndex]||[];
  return chain.some(entry=>noPattern.test(String(entry?.no||'')));
}
function imageForTrain(t){
  const f=selectionDisplayObject(t.formation);
  return f?.img||'images/Nagano_noimage.png';
}
function stationIndex(name){
  return STATIONS.findIndex(s=>s.nameJa===name);
}
function formatTimeNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function currentMinutes(){
  if(followNow){
    const d=new Date();
    return d.getHours()*60+d.getMinutes();
  }
  const input=document.getElementById('timeInput');
  const value=input?.value || formatTimeNow();
  const [h,m]=String(value).split(':').map(Number);
  if(Number.isFinite(h) && Number.isFinite(m)) return h*60+m;
  return new Date().getHours()*60+new Date().getMinutes();
}
function setNowTime(){

function initTimeControl(){

function displayType(type){ return getShortType(type); }
function expressClassForTrain(t){
  const type=String(t?.type||'');
  const no=String(t?.no||'');
  if(type.includes('特急')){
    if(/A$/i.test(no)) return 'a-express';
    if(/B$/i.test(no)) return 'b-express';
    if(type.includes('ゆけむり') && !type.includes('のんびり')) return 'a-express';
    if(type.includes('スノーモンキー')) return 'b-express';
  }
  return '';
}

}

function timeToMinutes(value){ const [h,m]=String(value).split(':').map(Number); return h*60+m; }
function inferDirectionFromStations(a,b){
  const ia=stationIndex(a),ib=stationIndex(b);
  return ia<ib?'up':'down';
}
function linkedEntries(t){
  const info=findChain(currentDay,t.no);
  if(!info) return {prev:null,next:null,chain:null,index:-1};
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  return {prev:chain[info.entryIndex-1]||null,next:chain[info.entryIndex+1]||null,chain,index:info.entryIndex};
}
function trainEntryNo(entry){ return entry?normalizeTrainNo(entry.no):''; }
function connectionPrev(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const prev=chain[info.entryIndex-1];
  if(!prev || String(prev.dest)!==String(t.start)) return null;
  if(timeToMinutes(prev.endTime)>timeToMinutes(t.stops[0].time)) return null;
  return prev;
}
function connectionNext(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const next=chain[info.entryIndex+1];
  if(!next || String(t.dest)!==String(next.start)) return null;
  if(timeToMinutes(t.stops[t.stops.length-1].time)>timeToMinutes(next.startTime)) return null;
  return next;
}
function positionForTrain(t,minutes){
  const stops=t.stops||[];
  if(!stops.length) return null;
  const firstStation=stops[0].station, lastStation=stops[stops.length-1].station;
  const first=timeToMinutes(stops[0].time), last=timeToMinutes(stops[stops.length-1].time);
  const chainInfo=findChain(currentDay,t.no);
  const chain=chainInfo ? OPERATION_CHAINS[currentDay][chainInfo.chainIndex] : null;
  const isChainFirst=!!chain && chainInfo.entryIndex===0;
  const isChainLast=!!chain && chainInfo.entryIndex===chain.length-1;
  const prev=connectionPrev(t), next=connectionNext(t);
  const prevEnd=prev?timeToMinutes(prev.endTime):null;
  const nextStart=next?timeToMinutes(next.startTime):null;

  // 1日の一連の運用の最初の列車だけ、始発駅で発車2分前から待機。
  // 中間の列車にはこの2分追加を適用しない。
  if(isChainFirst && minutes>=first-RESET_DWELL_MIN && minutes<first){
    return {pos:stationIndex(firstStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'start'};
  }
  // 中間列車の始発駅側の待機は、前の列車の描画側で一度だけ表現する。
  // ここで同じ列車をもう一度描画すると、折り返し駅で列車が2本並ぶため、
  // 中間列車側では表示しない。
  // Running leg.
  if(minutes>=first && minutes<=last){
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i],b=stops[i+1];
      const ta=timeToMinutes(a.time),tb=timeToMinutes(b.time);
      if(minutes>=ta && minutes<=tb){
        const ia=stationIndex(a.station),ib=stationIndex(b.station);
        const ratio=tb===ta?0:(minutes-ta)/(tb-ta);
        return {pos:ia+(ib-ia)*ratio,side:t.direction==='down'?'right':'left',visualTrain:t,mode:'run'};
      }
    }
  }
  // 中間列車の到着駅では、次列車が続くなら到着+1分で反対側へ移動。
  if(next && !isChainLast && minutes>last && minutes<nextStart){
    if(minutes<=last+TURNBACK_SWITCH_MIN){
      return {pos:stationIndex(lastStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'turn-arrival'};
    }
    // 折り返し後は「次の列車」の最新の編成状態を使う。
    // TRAIN_INDEX は初期データ（formation:null）のため、ここを直接参照すると
    // noimage が表示されることがある。必ず liveTrain() から取得する。
    const nextNo=trainEntryNo(next);
    const nextTrain=liveTrain(nextNo)||TRAIN_INDEX[nextNo]||null;
    const nextSide=nextTrain?(nextTrain.direction==='down'?'right':'left'): (inferDirectionFromStations(next.start,next.dest)==='down'?'right':'left');
    return {pos:stationIndex(lastStation),side:nextSide,visualTrain:nextTrain||t,mode:'turn-wait'};
  }
  // 一日の一連の運用の最後の列車だけ、終着後2分を終着駅で表示。
  // A→B→C なら AとCだけに適用し、Bには適用しない。
  if(isChainLast && minutes>=last && minutes<=last+RESET_DWELL_MIN){
    return {pos:stationIndex(lastStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'end'};
  }
  return null;
}
function trainLabelText(t){ return `<span>${getShortType(t.type,t.no)} ${getShortDest(t.dest)}</span>`; }
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  layer.innerHTML='';
  const visible=getVisibleTrains();
  const occupied={left:[],right:[]};
  visible.forEach(t=>{
    const info=positionForTrain(t,minutes);
    if(!info || !info.visualTrain) return;
    occupied[info.side].push({t:info.visualTrain,pos:info.pos,baseTrain:t,mode:info.mode});
  });

  const rows=Array.from(document.querySelectorAll('.station-row'));
  const layerRect=layer.getBoundingClientRect();
  const uiScale=1;
  const trainWidth=66*uiScale;
  const imageWidth=60*uiScale;
  const laneGap=20*uiScale;

  const rowRectAt=(pos)=>{
    if(!rows.length) return null;
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p), i1=Math.min(rows.length-1,Math.ceil(p));
    const r0=rows[i0].getBoundingClientRect();
    const r1=rows[i1].getBoundingClientRect();
    const f=p-i0;
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24 && u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});

      const el=document.createElement('div');
      el.className=`train-icon ${side}`;
      el.style.visibility='hidden';
      el.style.transition='none';

      const rr=rowRectAt(item.pos) || {
        left:layerRect.left,right:layerRect.right,centerY:layerRect.top+layerRect.height/2
      };

      /*
       * 横位置は従来版と同じ「中央の縦線からの距離」を基準にする。
       * 元の基準は .train-icon.left = 50% - 245px、
       * .train-icon.right = 50% - 245px（right指定）だったため、
       * train-icon の左端は左=中心-245px、右=中心+245px-66px。
       * スマホ版は1920pxキャンバスを中央960pxだけ表示しているので、
       * その仮想座標上の中心960pxをそのまま使用する。
       * 複数本は20px間隔で中心から外側へ並べる。
       */
      const layoutWidth=window.innerWidth < 960 ? 1920 : layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'
        ? centerX-245-laneOffset
        : centerX+245-trainWidth+laneOffset;

      const t=item.t;
      const cls=trainVisualKind(t);
      el.innerHTML=`
        <span class="train-no">${t.no}</span>
        <img src="${imageForTrain(t)}" alt="${t.no}">
        <span class="train-label ${cls} ${getMainLabelClass(t.type)}">${trainLabelText(t)}</span>
      `;
      el.addEventListener('click',ev=>{
        ev.preventDefault();
        ev.stopPropagation();
        openSheet(t.no);
      });
      layer.appendChild(el);

      const img=el.querySelector('img');
      const noEl=el.querySelector('.train-no');

      const applyFinalPosition=()=>{
        if(!img) return;
        /*
         * スマホ版は #viewportCanvas を zoom で縮小しているため、
         * getBoundingClientRect() は「画面上の縮小後px」を返す。
         * その値をそのまま style.top に戻すと zoom が二重に掛かって
         * 縦位置が上へ詰まっていくため、ここで元のCSS座標へ戻す。
         */
        const mobileZoom=window.innerWidth < 960 ? window.innerWidth/960 : 1;
        const imgRect=img.getBoundingClientRect();
        const noRect=noEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom) || imageWidth;
        const imgHeight=(imgRect.height/mobileZoom) || actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom) || 12*uiScale*1.05;
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-noHeight-imgHeight/2;

        el.style.top=`${finalTop}px`;
        el.style.left=`${trainLeft}px`;
        el.style.right='auto';
        el.style.setProperty('--lane-shift','0px');
        el.style.transform='none';
        el.style.visibility='visible';
      };

      if(img.complete && img.naturalWidth){
        applyFinalPosition();
      }else{
        img.addEventListener('load',applyFinalPosition,{once:true});
      }
    });
  });
}

function stationTimetableHTML(station, selectedDirection='up'){
  const stationName=String(station?.nameJa||'');
  const directionData={up:{label:'長野方面',entries:[]},down:{label:'湯田中方面',entries:[]}};
  const byTrain=new Map();

  getVisibleTrains().forEach(train=>{
    if(String(train?.dest||'')===stationName) return; // 当駅止まりは除外
    const stops=(train.stops||[]).filter(stop=>String(stop?.station||'')===stationName);
    if(!stops.length) return;
    const stop=stops[stops.length-1]; // 同一駅が2回ある場合は発車側の時刻
    const time=String(stop?.time||'');
    const m=time.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return;
    const hour=Number(m[1]), minute=Number(m[2]);
    if(!Number.isFinite(hour)||!Number.isFinite(minute)) return;
    const bucket=String(train?.direction||'up')==='down'?'down':'up';
    byTrain.set(`${bucket}:${String(train.no)}`,{train,hour,minute,time,bucket});
  });

  Array.from(byTrain.values())
    .sort((a,b)=>a.hour-b.hour||a.minute-b.minute||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}))
    .forEach(entry=>directionData[entry.bucket].entries.push(entry));

  const escapeAttr=value=>String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeJs=value=>String(value).replace(/\\/g,"\\'");

  const renderDirection=(key)=>{
    const data=directionData[key];
    if(!data.entries.length) return '';

    const hourGroups=[];
    let currentHour=null;
    for(const item of data.entries){
      if(currentHour===null || currentHour.hour!==item.hour){
        currentHour={hour:item.hour,entries:[]};
        hourGroups.push(currentHour);
      }
      currentHour.entries.push(item);
    }

    const rows=hourGroups.map((group,rowIndex)=>{
      const hourClass=(rowIndex%2===0)?'':' hour-alt';
      const cells=[`<div class="station-timetable-cell station-timetable-hour${hourClass}">${group.hour}</div>`];
      group.entries.forEach((item,colIndex)=>{
        const checker=(rowIndex+colIndex)%2===0;
        const minuteClass=checker?'':' minute-alt';
        cells.push(`<button class="station-timetable-cell station-timetable-time${minuteClass}" type="button" title="列車 ${escapeAttr(item.train.no)} / ${escapeAttr(item.time)}" onclick="openSheet('${escapeJs(item.train.no)}',true)">${String(item.minute).padStart(2,'0')}</button>`);
      });
      return `<div class="station-timetable-hour-row">${cells.join('')}</div>`;
    });

    return `<section class="station-timetable-direction">${rows.join('')}</section>`;
  };

  const html=renderDirection(selectedDirection);
  if(!html) return `<div class="station-timetable-meta">この方面の時刻表はありません。</div>`;
  return `<div class="station-timetable-wrap">${html}</div><div class="station-timetable-meta">発時刻のみ表示・時刻をクリックすると列車情報を表示します。</div>`;
}

async function selectFormation(formId){

  const dropdown=document.getElementById('dropdownOptions');
  if(dropdown) dropdown.classList.remove('open');

  // 状態変更はrecordSelection()の1か所だけで行う。二重更新を防止。
  selectionSyncInProgress=true;
  isEditMode=false;
  const sheet=document.getElementById('bottomSheet');
  if(sheet) sheet.classList.remove('editing');
  try{
    await recordSelection(train,normalizedId);
    refreshAllTrainDataCache();
    updateSheetContent();
    renderTrainPositions();
  }catch(e){
    console.error('編成登録同期失敗',e);
    syncStatus('同期失敗（再試行待ち）');
    updateSheetContent();
  }finally{
    selectionSyncInProgress=false;
  }
}
window.addEventListener('load',async ()=>{
  warmAllTrainData();
  refreshAllTrainDataCache();
  initSharedState();
  currentOperationDate=operationDateKey();
  await initFirebase();
  await maybeResetForNewOperationDay();
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===currentDay));
  initTimeControl();
  setNowTime();
  renderLine();
  setInterval(async ()=>{
    await maybeResetForNewOperationDay();
    if(isEditMode) return;
    if(followNow) setNowTime(); else renderTrainPositions();
  },5000);
});
</script>
</body>
</html>
