<!-- 列車情報：停車駅／今日の運用／編成情報／運用履歴を同一タブ領域で表示 -->
<script id="train-info-design-update">
(function(){
  let currentTrainInfoTab='stops';
  let currentTrainHistoryView='operation';
  let formationInputHistoryListenerRef=null;
  let formationInputHistoryListenerCallback=null;
  let formationInputHistoryListenerKey='';
  let formationInputHistoryContext=null;
  let formationInputHistoryRecords=[];

  function formationInputHistoryTimestamp(post,dateFallback=''){
    const direct=Number(post?.at??post?.createdAt)||0;
    if(direct>0) return direct;
    const compact=String(post?.t||post?.time||'').match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
    if(compact){
      const yy=Number(compact[1]),mm=Number(compact[2]),dd=Number(compact[3]),hh=Number(compact[4]),mi=Number(compact[5]);
      if(mm>=1&&mm<=12&&dd>=1&&dd<=31&&hh<=23&&mi<=59) return new Date(2000+yy,mm-1,dd,hh,mi,0,0).getTime();
    }
    return 0;
  }

  function formationInputHistoryLatestFirebaseRecord(context,posts){
    if(!context?.family||!context?.date||!context?.historyNo) return null;
    if(window.wasFirebaseFormationInputHistoryCleared?.(context.family,context.date,context.historyNo)) return null;
    const normalizeNo=value=>typeof normalizeTrainNo==='function'?normalizeTrainNo(value):String(value||'').trim();
    const todayPosts=(posts||[]).filter(post=>String(post?._historyDate||'')===String(context.date)
      && normalizeNo(post?._historyTrainNo)===normalizeNo(context.historyNo))
      .sort((a,b)=>(formationInputHistoryTimestamp(b,context.date)-formationInputHistoryTimestamp(a,context.date))||String(b.key).localeCompare(String(a.key)));
    const areaState=formationRemoteByFamily?.[context.family]?.areaStateByDate?.[context.date]?.[context.area]||{};
    const saved=areaState?.[String(context.historyNo)]||null;
    const rawFormation=String(saved?.f||saved?.formation||'').trim();
    const formation=String(window.normalizeStoredFormationId?.(rawFormation)||'').trim();
    if(!formation) return null;
    const newestPost=todayPosts[0]||null;
    if(newestPost){
      const newestFormation=String(newestPost.f||'').trim();
      if(!newestPost.unselected && newestFormation===formation) return null;
      const stateAt=Number(window.storedFormationTimestampMs?.(saved))||0;
      const postAt=formationInputHistoryTimestamp(newestPost,context.date);
      if(newestPost.unselected){
        if(!stateAt||!postAt||Math.floor(stateAt/60000)<=Math.floor(postAt/60000)) return null;
      }else if(!stateAt||!postAt||Math.floor(stateAt/60000)<Math.floor(postAt/60000)){
        return null;
      }
    }
    const meta=window.parseStoredMeta?.(saved?.t??saved?.time??'')||{};
    const at=Number(window.storedFormationTimestampMs?.(saved))||0;
    return {
      key:`__firebase_current__${context.date}_${context.historyNo}`,
      f:formation,at,t:String(saved?.t??saved?.time??''),
      author:String(meta.author||saved?.author||saved?.userName||'登録者不明'),
      uid:String(saved?.uid||''),userId:String(saved?.userId||''),r:String(saved?.r||''),
      _historyDate:context.date,_historyTrainNo:String(context.historyNo),
      isFirebaseCurrentSnapshot:true
    };
  }

  function historyScheduleDayForDate(date){
    const key=String(date||'').trim();
    const d=/^\d{4}-\d{2}-\d{2}$/.test(key)?new Date(`${key}T12:00:00`):new Date();
    return typeof getScheduleDayForDate==='function'?getScheduleDayForDate(d):currentDay;
  }

  function historyChainNumbersForDate(trainNo,date){
    const day=historyScheduleDayForDate(date);
    const numbers=new Set();
    const base=String(trainNo||'').trim();
    if(base) numbers.add(base);
    const info=typeof findChain==='function'?findChain(day,base):null;
    const chain=info?(OPERATION_CHAINS?.[day]?.[info.chainIndex]||[]):[];
    for(const entry of chain){
      const no=String(entry?.no||entry||'').trim();
      if(no) numbers.add(no);
    }
    return {day,numbers};
  }

  function formationInputHistorySourceNoFor(train,date){
    const displayedNo=String(train?.no||currentTrainNo||'').trim();
    if(!displayedNo||!train) return displayedNo;
    try{
      const family=typeof formationFamilyForTrain==='function' ? formationFamilyForTrain(train) : '';
      const area=typeof window.storageAreaForFamily==='function' ? String(window.storageAreaForFamily(family)||'__ROOT__') : '__ROOT__';
      const day=String(date||operationDateKey()).trim();
      const stored=formationRemoteByFamily?.[family]?.areaStateByDate?.[day]?.[area]||{};
      const {day:scheduleDay,numbers}=historyChainNumbersForDate(displayedNo,day);
      const getSavedValue=(trainNo)=>{
        const key=String(trainNo||'').trim();
        if(!key) return '';
        const direct=String(stored?.[key]?.f||'').trim();
        if(direct) return direct;
        const normalized=normalizeTrainNo(key);
        if(!normalized) return '';
        for(const [savedNo,entry] of Object.entries(stored)){
          if(normalizeTrainNo(savedNo)===normalized){
            const value=String(entry?.f||'').trim();
            if(value) return value;
          }
        }
        return '';
      };
      for(const linkedNo of numbers){
        if(window.hasFirebaseFormationInputHistoryForTrainNo?.(family,day,linkedNo)
            || String(window.latestFirebaseFormationForTrainNo?.(family,day,linkedNo)||'').trim()) return linkedNo;
      }
      for(const linkedNo of numbers) if(getSavedValue(linkedNo)) return linkedNo;
    }catch(e){ console.warn('編成入力履歴の対象列番判定に失敗しました',e); }
    return displayedNo;
  }

  function formationInputHistoryContextFor(train){
    // 履歴の表示対象日は表示中の日付ではなく、現在の日付に固定する。
    const date=String(operationDateKey(new Date())||operationDateKey()).trim();
    const no=String(train?.no||currentTrainNo||'').trim();
    const family=typeof formationFamilyForTrain==='function' ? formationFamilyForTrain(train) : '';
    const area=typeof window.storageAreaForFamily==='function' ? String(window.storageAreaForFamily(family)||'__ROOT__') : '__ROOT__';
    const route=String(activeRouteName||'');
    const historyNo=formationInputHistorySourceNoFor(train,date);
    const key=[family,area,date,no,historyNo,route].join('|');
    const ref=typeof window.formationInputHistoryRootRefForTrain==='function' ? window.formationInputHistoryRootRefForTrain(train) : null;
    return {key,date,no,historyNo,family,area,route,train,ref};
  }

  function historyRecordToken(date,trainNo,postKey){
    return encodeURIComponent(JSON.stringify([String(date||''),String(trainNo||''),String(postKey||'')]));
  }

  function attachFormationInputHistoryListener(train){
    const context=formationInputHistoryContextFor(train);
    if(context.key===formationInputHistoryListenerKey && formationInputHistoryListenerRef) return;
    if(formationInputHistoryListenerRef && formationInputHistoryListenerCallback){
      try{formationInputHistoryListenerRef.off('value',formationInputHistoryListenerCallback);}catch(e){}
    }
    formationInputHistoryListenerRef=null;
    formationInputHistoryListenerCallback=null;
    formationInputHistoryListenerKey=context.key;
    formationInputHistoryContext=context;
    formationInputHistoryRecords=[];
    if(!context.ref) return;
    formationInputHistoryListenerRef=context.ref;
    formationInputHistoryListenerCallback=function(snapshot){
      if(context.key!==formationInputHistoryListenerKey) return;
      const raw=snapshot?.val()||{};
      const records=[];
      const today=String(context.date||operationDateKey()).trim();
      const normalizeNo=value=>typeof normalizeTrainNo==='function'?normalizeTrainNo(value):String(value||'').trim();
      for(const [date,dateValue] of Object.entries(raw)){
        const dateKey=String(date||'');
        if(!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)||dateKey>today||!dateValue||typeof dateValue!=='object') continue;
        const {numbers}=historyChainNumbersForDate(context.no,dateKey);
        // 同じ運用チェーン内で日付により列番が変わっている場合も、その日の全ての列番を照合する。
        const normalizedNumbers=new Set([...numbers].map(normalizeNo).filter(Boolean));
        if(context.historyNo){numbers.add(context.historyNo);const normalized=normalizeNo(context.historyNo);if(normalized)normalizedNumbers.add(normalized);}
        for(const [sourceNo,postsValue] of Object.entries(dateValue)){
          const normalizedSourceNo=normalizeNo(sourceNo);
          if(!numbers.has(String(sourceNo))&&(!normalizedSourceNo||!normalizedNumbers.has(normalizedSourceNo))) continue;
          if(!postsValue||typeof postsValue!=='object') continue;
          for(const [postKey,post] of Object.entries(postsValue)){
            if(!postKey||!post||typeof post!=='object') continue;
            const hasFormationField=Object.prototype.hasOwnProperty.call(post,'f')||Object.prototype.hasOwnProperty.call(post,'formation');
            const rawFormation=post.f??post.formation??'';
            if(!(String(rawFormation).trim()||window.isUnselectedFormationId?.(rawFormation)||(hasFormationField&&String(rawFormation).trim()===''))) continue;
            const unselected=!!window.isUnselectedFormationId?.(rawFormation)||(hasFormationField&&String(rawFormation).trim()==='');
            const normalized=unselected?'':String(window.normalizeStoredFormationId?.(rawFormation)||rawFormation||'').trim();
            records.push({...post,key:String(postKey),f:normalized,unselected:unselected&&!normalized,_historyDate:dateKey,_historyTrainNo:String(sourceNo),_recordId:historyRecordToken(dateKey,sourceNo,postKey)});
          }
        }
      }
      formationInputHistoryRecords=records.sort((a,b)=>(formationInputHistoryTimestamp(b,b._historyDate)-formationInputHistoryTimestamp(a,a._historyDate)) || String(b.key).localeCompare(String(a.key)));
      const openNo=String(currentTrainSnapshot?.no||currentTrainNo||'').trim();
      if(openNo===context.no && (currentTrainInfoTab==='operation' || (currentTrainInfoTab==='history' && currentTrainHistoryView==='formation')) && !isEditMode && typeof updateSheetContent==='function'){
        updateSheetContent();
      }
    };
    context.ref.on('value',formationInputHistoryListenerCallback);
  }

  // 投稿キーなどの保存用識別子だけを除き、記録された情報が完全一致する履歴をまとめる。
  // 形成ID・時刻・登録者・UID・路線・権限その他の保存フィールドが1つでも異なれば別グループにする。
  function stableFormationHistoryValue(value){
    if(Array.isArray(value)) return value.map(stableFormationHistoryValue);
    if(value && typeof value==='object'){
      const normalized={};
      for(const key of Object.keys(value).sort()) normalized[key]=stableFormationHistoryValue(value[key]);
      return normalized;
    }
    return value;
  }
  function formationInputHistoryIdentity(post){
    const data={};
    for(const key of Object.keys(post||{}).sort()){
      if(key==='key'||key==='isFirebaseCurrentSnapshot'||key==='_historyDate'||key==='_historyTrainNo'||key==='_recordId') continue;
      // false は選択済みを示す派生値なので省略して同じ情報として比較し、true（未選択）は区別する。
      if(key==='unselected'&&!post[key]) continue;
      data[key]=stableFormationHistoryValue(post[key]);
    }
    return JSON.stringify(data);
  }
  function groupFormationInputHistoryPosts(posts){
    const groups=new Map();
    for(const post of posts||[]){
      const identity=formationInputHistoryIdentity(post);
      if(!groups.has(identity)) groups.set(identity,{post,posts:[]});
      groups.get(identity).posts.push(post);
    }
    return Array.from(groups.values());
  }

  function formatFormationInputHistoryDateTime(post,dateFallback){
    let date=null;
    const numeric=Number(post?.at??post?.createdAt);
    if(Number.isFinite(numeric)&&numeric>0) date=new Date(numeric);
    if(!date || Number.isNaN(date.getTime())){
      const raw=String(post?.t||'');
      const match=raw.match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
      if(match){
        const yy=Number(match[1]),mm=Number(match[2]),dd=Number(match[3]),hh=Number(match[4]),mi=Number(match[5]);
        if(mm>=1&&mm<=12&&dd>=1&&dd<=31&&hh<=23&&mi<=59) date=new Date(2000+yy,mm-1,dd,hh,mi);
      }
    }
    if(!date || Number.isNaN(date.getTime())){
      const fallback=String(dateFallback||'');
      return fallback ? `${fallback.replaceAll('-','/')} --:--` : '--/--/-- --:--';
    }
    return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
  }

  function renderFormationInputHistory(train, heading='編成入力履歴', includeAllDates=false){
    attachFormationInputHistoryListener(train);
    const context=formationInputHistoryContext;
    const allPosts=formationInputHistoryRecords.slice();
    const displayDate=String(selectedDateKey||operationDateKey()).trim();
    const posts=includeAllDates?allPosts:allPosts.filter(post=>String(post?._historyDate||'')===displayDate);
    const firebaseCurrent=(includeAllDates||displayDate===String(context?.date||''))?formationInputHistoryLatestFirebaseRecord(context,includeAllDates?allPosts:posts):null;
    const displayPosts=firebaseCurrent?[firebaseCurrent,...posts]:posts;
    // 入力履歴は登録イベントごとに1件ずつ追加表示する。
    // 同じ組み合わせ（A+B+C）をもう一度登録しても、過去の記録とまとめない。
    const displayEntries=displayPosts.map(post=>({post,posts:[post]}));
    const rows=displayEntries.map(group=>{
      const post=group.post;
      const isUnselected=!!post.unselected||!!window.isUnselectedFormationId?.(post.f||post.formation||'');
      const ids=isUnselected?[]:String(post.f||post.formation||'').split('+').map(v=>v.trim()).filter(Boolean);
      const displayObjects=ids.map(id=>{
        try{return selectionDisplayObjectForTrain(train,id)||selectionDisplayObject(id)||formationById(id)||{};}
        catch(e){return selectionDisplayObject(id)||formationById(id)||{};}
      });
      const names=ids.length?ids.map((id,index)=>String(displayObjects[index]?.name||formationById(id)?.name||id)):['編成未選択'];
      const first=displayObjects[0]||{};
      const image=String(first.img||first.image||jsonNoImageUrl()||'');
      const author=String(post.author||post.userName||post.userId||'登録者不明');
      const datetime=formatFormationInputHistoryDateTime(post,post?._historyDate||context?.date);
      // Firebaseの現在状態を補完表示した行には削除対象の投稿キーがないため、
      // 実際に保存された入力履歴の行だけ削除ボタンを表示する。
      // 権限判定は削除処理側でも必ず再確認する。
      const deletableKeys=[...new Set(group.posts
        .filter(item=>!item.isFirebaseCurrentSnapshot)
        .map(item=>String(item._recordId||'').trim()).filter(Boolean))];
      const deleteButton=deletableKeys.length
        ? `<button type="button" class="formation-input-history-delete" aria-label="この編成入力履歴を削除" onclick="window.deleteFormationInputHistoryRecord('${escapeJs(deletableKeys.join('|'))}')">削除</button>`
        : '';
      return `<div class="formation-input-history-item" data-history-key="${escapeAttr(post._recordId||post.key)}" data-history-duplicates="${group.posts.length}">
        <img class="formation-input-history-image" src="${escapeAttr(image)}" alt="${escapeAttr(names.join('・'))}" onerror="this.onerror=null;this.src=jsonNoImageUrl()">
        <div class="formation-input-history-formation" title="${escapeAttr(names.join(' + '))}">${escapeAttr(names.join(' + '))}</div>
        <div class="formation-input-history-meta"><span class="formation-input-history-datetime">${escapeAttr(datetime)}</span><span class="formation-input-history-author">${escapeAttr(author)}</span></div>
        ${deleteButton}
      </div>`;
    }).join('');
    return `<section class="formation-input-history-section">
      <div class="formation-input-history-heading">${escapeAttr(heading)}</div>
      <div class="formation-input-history-list">${rows||'<div class="formation-input-history-empty">該当する編成入力履歴はありません。</div>'}</div>
    </section>`;
  }

  window.deleteFormationInputHistoryRecord=async function(recordKey){
    const requestedTokens=[...new Set(String(recordKey||'').split('|').map(key=>key.trim()).filter(Boolean))];
    const targetPosts=requestedTokens.map(token=>formationInputHistoryRecords.find(item=>String(item._recordId||'')===token)).filter(Boolean);
    const context=formationInputHistoryContext;
    if(!requestedTokens.length||!targetPosts.length||!context?.ref||typeof window.canDeleteFormationInputHistoryRecord!=='function') return false;
    const deletable=targetPosts.filter(post=>!post.isFirebaseCurrentSnapshot&&window.canDeleteFormationInputHistoryRecord(post));
    if(!deletable.length){
      if(typeof syncStatus==='function') syncStatus('この編成入力履歴を削除する権限がありません');
      return false;
    }
    const unique=new Map();
    for(const post of deletable) unique.set(String(post._recordId||''),post);
    const groups=new Map();
    for(const post of unique.values()){
      const date=String(post._historyDate||'');
      const no=String(post._historyTrainNo||'');
      const groupKey=`${date}\u0000${no}`;
      if(!groups.has(groupKey)) groups.set(groupKey,{date,no,posts:[]});
      groups.get(groupKey).posts.push(post);
    }
    try{
      const db=typeof firebaseDatabaseForFamily==='function'?firebaseDatabaseForFamily(context.family):null;
      const root=typeof storageRootForFamily==='function'?storageRootForFamily(context.family):'';
      if(!db||!root) return false;
      for(const group of groups.values()){
        const {date,no,posts}=group;
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>String(context.date)||!no) continue;
        const nodeRef=context.ref.child(date).child(no);
        await Promise.all(posts.map(post=>nodeRef.child(String(post.key)).remove()));
        const remainingSnapshot=await nodeRef.once('value');
        const remaining=remainingSnapshot?.val()||{};
        const remainingPosts=Object.entries(remaining)
          .filter(([postKey,item])=>!!postKey&&item&&typeof item==='object'&&(Object.prototype.hasOwnProperty.call(item,'f')||Object.prototype.hasOwnProperty.call(item,'formation')))
          .map(([postKey,item])=>{
            const rawF=item.f??item.formation??'';
            const unselected=!!window.isUnselectedFormationId?.(rawF)||String(rawF).trim()==='';
            return {key:String(postKey),...item,f:unselected?'':String(window.normalizeStoredFormationId?.(rawF)||rawF||'').trim(),unselected};
          })
          .sort((a,b)=>(formationInputHistoryTimestamp(b,date)-formationInputHistoryTimestamp(a,date))||String(b.key).localeCompare(String(a.key)));
        let clearedRef=db.ref(root).child('__formationInputHistoryCleared');
        if(context.area!=='__ROOT__') clearedRef=clearedRef.child(context.area);
        const clearNode=clearedRef.child(date).child(no);
        const savedRef=context.area==='__ROOT__'
          ? db.ref(root).child(date).child(no)
          : db.ref(root).child(context.area).child(date).child(no);
        const latest=remainingPosts[0]||null;
        const latestFormation=String(latest?.f||'').trim();
        if(latest&&latestFormation){
          const at=formationInputHistoryTimestamp(latest,date)||Date.now();
          const d=new Date(at);
          const stamp=`${String(d.getFullYear()%100).padStart(2,'0')}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
          const author=String(latest.author||latest.userName||'').trim();
          const payload={f:latestFormation,t:`${stamp}${author?`@${author}`:''}`};
          if(latest.r) payload.r=String(latest.r);
          await savedRef.set(payload);
          await clearNode.remove();
        }else if(!remainingPosts.length){
          await clearNode.set(true);
          await savedRef.remove();
        }else{
          await savedRef.remove();
          await clearNode.remove();
        }
      }
      await loadFormationFamilyFromFirebase(context.family);
      if(typeof mergeFormationRemoteIntoLegacyState==='function') mergeFormationRemoteIntoLegacyState();
      if(typeof applyRegistrationState==='function') applyRegistrationState();
      if(typeof saveLocalState==='function') saveLocalState();
      if(typeof refreshAllTrainDataCache==='function') refreshAllTrainDataCache();
      if(typeof refreshCurrentTrainSnapshotFromCache==='function') refreshCurrentTrainSnapshotFromCache();
      if(typeof syncStatus==='function') syncStatus('編成入力履歴を削除しました');
      if(typeof updateSheetContent==='function'&&(currentTrainInfoTab==='operation'||(currentTrainInfoTab==='history'&&currentTrainHistoryView==='formation'))&&!isEditMode) updateSheetContent();
      return true;
    }catch(error){
      console.error('編成入力履歴の削除に失敗しました',error);
      if(typeof syncStatus==='function') syncStatus('編成入力履歴の削除に失敗しました');
      return false;
    }
  };

  function rawFormationDefinitionById(id){
    const canonical=String(id||'').trim().replace(/F$/i,'');
    if(!canonical || !activeJson) return null;
    const groups=Array.isArray(activeJson?.formations)?activeJson.formations:[];
    // 広島地区などの旧形式JSONは formations[] に編成データを直接並べる。
    // ネストした items / variants だけを検索すると車番・形式・号車タグが取得できない。
    const flat=groups.find(item=>{
      if(!item || typeof item!=='object' || Array.isArray(item.items) || Array.isArray(item.variants)) return false;
      const itemId=String(item.formation||item.id||item.name||'').trim().replace(/F$/i,'');
      return itemId===canonical;
    });
    if(flat){
      return {...flat,id:canonical,name:String(flat.name||canonical),type:String(flat.formationType||flat.type||'227系'),_groupType:String(flat.type||'227系')};
    }
    const visitItems=(items,groupType)=>{
      for(const item of (Array.isArray(items)?items:[])){
        const iid=String(item?.id||item?.formation||item?.name||'').trim().replace(/F$/i,'');
        const iname=String(item?.name||'').trim().replace(/F$/i,'');
        if(iid===canonical || iname===canonical) return {...item,type:String(item?.type||groupType||''),_groupType:String(groupType||'')};
      }
      return null;
    };
    for(const g of groups){
      let hit=visitItems(g?.items,g?.type); if(hit) return hit;
      for(const v of (Array.isArray(g?.variants)?g.variants:[])){
        hit=visitItems(v?.items,g?.type); if(hit) return hit;
      }
      // 形式そのものが選択された場合は、JSONの形式グループに設定された
      // 製造年・製造所の集計情報を編成情報タブへ渡す。
      const groupId=String(g?.selectableId||g?.type||'').trim().replace(/F$/i,'');
      if(groupId===canonical && (g?.manufacturingYear || g?.manufacturer)){
        return {...g,type:String(g?.formationType||g?.type||''),_groupType:String(g?.type||''),_isFormationGroup:true};
      }
    }
    return null;
  }

  function reverseVehicleNumbersForFormation(id){
    const canonical=String(id||'').trim().replace(/F$/i,'');
    const map=activeJson?.vehicleToFormation||{};
    const arr=[];
    for(const [vehicle,formation] of Object.entries(map)){
      const f=String(formation||'').trim().replace(/F$/i,'');
      if(f===canonical) arr.push(String(vehicle||'').trim());
    }
    return [...new Set(arr.filter(Boolean))].sort((a,b)=>{
      const na=Number(String(a).match(/\d+/)?.[0]||Infinity);
      const nb=Number(String(b).match(/\d+/)?.[0]||Infinity);
      return na-nb || a.localeCompare(b,'ja');
    });
  }

  function formationRawValue(raw, keys){
    for(const key of keys){
      const v=raw?.[key];
      if(v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();
    }
    return '';

  function formationCarNames(raw,id){
    const direct=Array.isArray(raw?.carNames)
      ? raw.carNames.map(x=>String(x||'').trim()).filter(Boolean)
      : (Array.isArray(raw?.cars) ? raw.cars.map(x=>String(x||'').trim()).filter(Boolean) : []);
    if(direct.length) return direct;
    const reversed=reverseVehicleNumbersForFormation(id);
    if(reversed.length) return reversed;
    const count=Number(raw?.carCount ?? raw?.cars);
    if(Number.isFinite(count) && count>0) return Array.from({length:count},()=> '');
    return [];
  }

  // 区間の表示端点は、指定範囲内に実際の時刻が入っている停車情報から取得する。
  // JSONには他路線の通過後の駅や停車時刻のない駅も同じ列車に含まれることがあるため、
  // 単純に stops[to] を終着にすると、列番変更後の終着駅が先の駅へずれる。
  function operationTimedBounds(stops,from,to){
    if(!Array.isArray(stops)||!stops.length) return null;
    const lo=Math.max(0,Math.min(stops.length-1,Number(from)||0));
    const hi=Math.max(lo,Math.min(stops.length-1,Number(to)||0));
    const hasTime=st=>!!String(st?.arrival||'').trim()||!!String(st?.departure||'').trim()||!!String(st?.time||'').trim();
    const timed=[];
    for(let i=lo;i<=hi;i++) if(hasTime(stops[i])) timed.push(i);
    if(!timed.length) return null;
    return {from:timed[0],to:timed[timed.length-1]};
  }

  // 列番変更による行分割専用。呼び出し元は「今日の運用」と「過去の運用」だけに限定する。
  // train-card、列車アイコン、停車駅案内、駅時刻表では列車データ自体を分割しない。
  function operationNumberSegments(sourceTrain,hasRealNumber=true){
    const stops=Array.isArray(sourceTrain?.stops)?sourceTrain.stops:[];
    if(!hasRealNumber||!stops.length) return [];
    const numberSegments=sourceTrain?.numberSegments&&typeof sourceTrain.numberSegments==='object'
      ? sourceTrain.numberSegments:{};
    const edgeCount=Math.max(0,stops.length-1);
    let routeByEdge=Array.isArray(sourceTrain?.segmentLineNames)&&sourceTrain.segmentLineNames.length===edgeCount
      ? sourceTrain.segmentLineNames.map(x=>String(x||'')) : [];
    if(routeByEdge.length!==edgeCount){
      routeByEdge=[];
      for(let i=0;i<edgeCount;i++){
        const a=String(stops[i]?.station||''),b=String(stops[i+1]?.station||'');
        routeByEdge.push(String(preferredTrainServiceLine(a,b,sourceTrain)?.name||''));
      }
    }
    const routeRuns=new Map();
    for(let i=0;i<routeByEdge.length;){
      const lineName=routeByEdge[i];
      if(!lineName){i++;continue;}
      let j=i;
      while(j+1<routeByEdge.length&&routeByEdge[j+1]===lineName) j++;
      if(!routeRuns.has(lineName)) routeRuns.set(lineName,[]);
      routeRuns.get(lineName).push({from:i,to:j+1});
      i=j+1;
    }
    const hasRouteRuns=routeRuns.size>0;
    const candidates=[];
    for(const [lineName,list] of Object.entries(numberSegments)){
      if(!Array.isArray(list)) continue;
      const runs=routeRuns.get(lineName)||[];
      for(const segment of list){
        const no=normalizeTrainNo(segment?.no);
        const from=Number(segment?.from),to=Number(segment?.to);
        if(!no||!Number.isFinite(from)||!Number.isFinite(to)||from>to) continue;
        if(runs.length){
          // 各路線の列番区間を、その列車が実際に当該路線を走る範囲だけに限定。
          // これにより別路線の全区間列番が、途中の番号変更を覆い隠さない。
          for(const run of runs){
            const clippedFrom=Math.max(0,from,run.from);
            const clippedTo=Math.min(stops.length-1,to,run.to);
            if(clippedFrom<=clippedTo) candidates.push({no,from:clippedFrom,to:clippedTo});
          }
        }else if(!hasRouteRuns){
          candidates.push({no,from:Math.max(0,from),to:Math.min(stops.length-1,to)});
        }
      }
    }
    // 路線名が未定義の旧データは従来どおり番号区間を直接読む。
    if(!candidates.length){
      for(const list of Object.values(numberSegments)) if(Array.isArray(list)) for(const segment of list){
        const no=normalizeTrainNo(segment?.no),from=Number(segment?.from),to=Number(segment?.to);
        if(no&&Number.isFinite(from)&&Number.isFinite(to)&&from<=to) candidates.push({no,from:Math.max(0,from),to:Math.min(stops.length-1,to)});
      }
    }
    if(!candidates.length){
      const fallback=normalizeTrainNo(sourceTrain?.noSequence?.[0]||sourceTrain?.no);
      if(fallback) candidates.push({no:fallback,from:0,to:stops.length-1});
    }
    candidates.sort((a,b)=>a.from-b.from||a.to-b.to||a.no.localeCompare(b.no));
    const unique=[];const seen=new Set();
    for(const segment of candidates){
      const key=`${segment.no}|${segment.from}|${segment.to}`;
      if(seen.has(key)) continue;seen.add(key);unique.push(segment);
    }
    const merged=[];
    for(const segment of unique){
      const last=merged[merged.length-1];
      if(last&&last.no===segment.no&&segment.from<=last.to+1){last.to=Math.max(last.to,segment.to);}
      else merged.push({...segment});
    }
    return merged;
  }

  function operationChainForCurrentTrain(train){
    const day=currentDay;
    const info=findChain(day,String(train?.no||''));
    let chain=null;
    if(info){
      const candidate=OPERATION_CHAINS?.[day]?.[info.chainIndex];
      if(Array.isArray(candidate) && candidate.length) chain=candidate;
    }
    if(!chain){
      // このJSONに運用連結表がない場合も、実際の列車番号と番号変更区間を表示する。
      // 番号を持たない路線の内部IDは列番として表示しない。
      const firstNo=normalizeTrainNo(train?.noSequence?.[0]||train?.no||'');
      const displayNo=isDisplayableOperationTrainNumber(firstNo,train)?firstNo:'';
      chain=[{
        no:displayNo,
        type:String(train?.type||''),
        start:String(train?.start||train?.stops?.[0]?.station||''),
        startTime:String(train?.startTime||train?.stops?.[0]?.departure||train?.stops?.[0]?.time||''),
        dest:String(train?.dest||train?.stops?.[train.stops.length-1]?.station||''),
        endTime:String(train?.endTime||train?.stops?.[train.stops.length-1]?.arrival||train?.stops?.[train.stops.length-1]?.time||''),
        _sourceTrain:train,
        _fromIndex:0,
        _toIndex:Math.max(0,(train?.stops?.length||1)-1)
      }];
    }

    const expanded=[];
    for(const entry of chain){
      const entryNo=normalizeTrainNo(entry?.no||entry||'');
      const sameTrainNumbers=[train?.no,...(Array.isArray(train?.noSequence)?train.noSequence:[])].map(normalizeTrainNo).filter(Boolean);
      const sourceTrain=entry?._sourceTrain || (entryNo ? findOperationTrainRecord(entryNo,day) : null)
        || (train && entryNo && sameTrainNumbers.includes(entryNo) ? train : null)
        || (train && !entryNo ? train : null);
      const hasRealNumber=isDisplayableOperationTrainNumber(entryNo,sourceTrain);
      const stops=Array.isArray(sourceTrain?.stops)?sourceTrain.stops:[];
      // 列番区間を実際の走行路線の範囲へ切り詰めてから、番号変更駅で分割する。
      const mergedSegments=operationNumberSegments(sourceTrain,hasRealNumber);

      // numberChanges による番号変更駅を境界に、今日の運用欄だけで別行にする。
      if(stops.length && mergedSegments.length>1){
        for(const seg of mergedSegments){
          const from=Math.max(0,Math.min(stops.length-1,seg.from));
          const to=Math.max(from,Math.min(stops.length-1,seg.to));
          const timedBounds=operationTimedBounds(stops,from,to);
          if(!timedBounds) continue;
          const displayFrom=timedBounds.from,displayTo=timedBounds.to;
          const first=stops[displayFrom]||{};
          const last=stops[displayTo]||{};
          const start=String(first?.station||'');
          const dest=String(last?.station||'');
          const startTime=String(first?.departure||first?.time||first?.arrival||'');
          const endTime=String(last?.arrival||last?.time||last?.departure||'');
          if(!start && !dest) continue;
          expanded.push({
            no:isDisplayableOperationTrainNumber(seg.no,sourceTrain)?seg.no:'',
            type:String(entry?.type||sourceTrain?.type||''),
            start,startTime,dest,endTime,
            _sourceTrain:sourceTrain,
            _fromIndex:displayFrom,
            _toIndex:displayTo
          });
        }
        continue;
      }

      const from=0;
      const to=stops.length?stops.length-1:0;
      const bestNo=mergedSegments[0]?.no||entryNo||trainDisplayNoAtPosition(sourceTrain,from)||'';
      expanded.push({
        no:isDisplayableOperationTrainNumber(bestNo,sourceTrain)?bestNo:'',
        type:String(entry?.type||sourceTrain?.type||''),
        start:String(entry?.start||sourceTrain?.start||stops[from]?.station||''),
        startTime:String(entry?.startTime||sourceTrain?.startTime||stops[from]?.departure||stops[from]?.time||stops[from]?.arrival||''),
        dest:String(entry?.dest||sourceTrain?.dest||stops[to]?.station||''),
        endTime:String(entry?.endTime||sourceTrain?.endTime||stops[to]?.arrival||stops[to]?.time||stops[to]?.departure||''),
        _sourceTrain:sourceTrain,
        _fromIndex:from,
        _toIndex:to
      });
    }
    return expanded.length ? expanded : [{no:'',type:String(train?.type||''),start:String(train?.start||''),dest:String(train?.dest||''),startTime:String(train?.startTime||''),endTime:String(train?.endTime||''),_sourceTrain:train}];
  }

  /* 今日の運用だけで使用する駅名略称。停車駅案内・駅時刻表などには適用しない。
     JSON/路線設定に存在する代表的なキーを順に参照し、指定がなければ正式駅名をそのまま表示する。 */
  function operationStationLabel(name){
    const value=String(name||'').trim();
    if(!value) return '';

    // 駅名略称はJSONに集約。destinationAliasesを標準キーとして使う。
    const maps=[
      activeRouteMeta?.destinationAliases,
      activeRouteMeta?.stationAliases,
      activeRouteMeta?.stationShortMap,
      activeRouteMeta?.stationAbbreviations,
      activeJson?.destinationAliases,
      activeJson?.stationAliases,
      activeJson?.stationShortMap,
      activeJson?.stationAbbreviations
    ];
    for(const map of maps){
      if(map && typeof map==='object' && !Array.isArray(map) && Object.prototype.hasOwnProperty.call(map,value)){
        const short=String(map[value]??'').trim();
        if(short) return short;
      }
      if(Array.isArray(map)){
        const match=map.find(item=>String(item?.name??item?.station??'').trim()===value);
        const short=String(match?.value??match?.abbr??match?.short??'').trim();
        if(short) return short;
      }
    }

    const dbStations=Array.isArray(activeJson?.stations)?activeJson.stations:[];
    const dbStation=dbStations.find(st=>String(st?.name||'').trim()===value);
    const directAbbr=String(dbStation?.abbr||'').trim();
    if(directAbbr) return directAbbr;
    const dbAbbrs=activeJson?.route?.abbreviations?.stations;
    if(Array.isArray(dbAbbrs)){
      const hit=dbAbbrs.find(a=>String(a?.targetId||'')===String(dbStation?.id||''));
      const short=String(hit?.value||'').trim();
      if(short) return short;
    }
    const lineStations=Array.isArray(activeJson?.lines)
      ? activeJson.lines.flatMap(line=>Array.isArray(line?.stations)?line.stations:[])
      : [];
    const lineStation=lineStations.find(st=>String(st?.name||'').trim()===value);
    const lineAbbr=String(lineStation?.abbr||'').trim();
    if(lineAbbr) return lineAbbr;

    const rules=[
      ...(Array.isArray(activeRouteMeta?.stationShortRules)?activeRouteMeta.stationShortRules:[]),
      ...(Array.isArray(activeJson?.stationShortRules)?activeJson.stationShortRules:[])
    ];
    for(const rule of rules){
      const target=String(rule?.station??rule?.name??'').trim();
      if(target && target===value && rule?.result!==undefined) return String(rule.result);
    }
    return value;
  }

  /* 03:00境界の運用時刻へそろえる。 */
  function operationServiceMinutes(value){
    const raw=String(value||'').trim();
    if(!raw) return NaN;
    const m=timeToMinutes(raw);
    if(!Number.isFinite(m)) return NaN;
    return m<RESET_HOUR*60 ? m+1440 : m;
  }

  function operationEntryState(entry,index,train){
    // 過去日・未来日では「現在運用」の強調を出さない。
    const isToday=!isNonCurrentSelectedDate(selectedDateKey) && String(selectedDateKey||'')===operationDateKey(new Date());
    if(!isToday) return {current:false,next:false};
    const now=currentMinutes();
    const start=operationServiceMinutes(entry?.startTime);
    const end=operationServiceMinutes(entry?.endTime);
    if(!Number.isFinite(now)) return {current:false,next:false};
    if(Number.isFinite(start) && Number.isFinite(end)){
      const current=now>=start && now<=end;
      if(current) return {current:true,next:false};
      if(now<start) return {current:false,next:true};
    }
    return {current:false,next:false};
  }

  function refreshTrainInfoOperationState(){
    const root=document.querySelector('#sheetContent .train-info-tabs');
    if(!root) return;
    const wrap=document.querySelector('#sheetContent .train-operation-wrap');
    if(!wrap) return;
    const today=(!isNonCurrentSelectedDate(selectedDateKey) && String(selectedDateKey||'')===operationDateKey(new Date()));
    const now=currentMinutes();
    wrap.querySelectorAll('.train-operation-row').forEach(row=>{
      const start=operationServiceMinutes(row.dataset.operationStart||'');
      const end=operationServiceMinutes(row.dataset.operationEnd||'');
      let current=false,next=false;
      if(today && Number.isFinite(now) && Number.isFinite(start) && Number.isFinite(end)){
        current=now>=start && now<=end;
        next=!current && now<start;
      }
      row.classList.toggle('current-operation',current);
      row.classList.toggle('next-operation',next);
    });
  }
  window.refreshTrainInfoOperationState=refreshTrainInfoOperationState;

  function expandHistoryEntriesByTrainNumber(chain, day){
    const out=[];
    const visitedParents=new Set();
    for(const entry of (Array.isArray(chain)?chain:[])){
      const entryNo=normalizeTrainNo(entry?.no||entry);
      const sourceTrain=entryNo?findOperationTrainRecord(entryNo,day):null;
      if(!sourceTrain){
        if(entry && typeof entry==='object') out.push({...entry,no:entryNo||String(entry?.no||'')});
        continue;
      }
      const stops=Array.isArray(sourceTrain.stops)?sourceTrain.stops:[];
      const parentKey=[String(sourceTrain.no||''),String(sourceTrain.startTime||''),String(sourceTrain.endTime||'')].join('|');
      if(visitedParents.has(parentKey)) continue;
      visitedParents.add(parentKey);
      const hasRealNumber=isDisplayableOperationTrainNumber(entryNo,sourceTrain);
      const merged=operationNumberSegments(sourceTrain,hasRealNumber);
      if(stops.length&&merged.length>1){
        for(const seg of merged){
          const from=Math.max(0,Math.min(stops.length-1,seg.from));
          const to=Math.max(from,Math.min(stops.length-1,seg.to));
          const timedBounds=operationTimedBounds(stops,from,to);
          if(!timedBounds) continue;
          const displayFrom=timedBounds.from,displayTo=timedBounds.to;
          const first=stops[displayFrom]||{},last=stops[displayTo]||{};
          const start=String(first.station||''),dest=String(last.station||'');
          if(!start&&!dest) continue;
          out.push({
            no:seg.no,type:String(entry?.type||sourceTrain.type||''),start,
            startTime:String(first.departure||first.time||first.arrival||''),dest,
            endTime:String(last.arrival||last.time||last.departure||''),
            _sourceTrain:sourceTrain,_fromIndex:displayFrom,_toIndex:displayTo
          });
        }
      }else{
        out.push({
          ...(entry&&typeof entry==='object'?entry:{}),
          no:isDisplayableOperationTrainNumber(merged[0]?.no||entryNo,sourceTrain)?(merged[0]?.no||entryNo||''):'',
          type:String(entry?.type||sourceTrain.type||''),
          start:String(entry?.start||sourceTrain.start||stops[0]?.station||''),
          startTime:String(entry?.startTime||sourceTrain.startTime||stops[0]?.departure||stops[0]?.time||stops[0]?.arrival||''),
          dest:String(entry?.dest||sourceTrain.dest||stops[stops.length-1]?.station||''),
          endTime:String(entry?.endTime||sourceTrain.endTime||stops[stops.length-1]?.arrival||stops[stops.length-1]?.time||stops[stops.length-1]?.departure||''),
          _sourceTrain:sourceTrain,_fromIndex:0,_toIndex:Math.max(0,stops.length-1)
        });
      }
    }
    return out;
  }

  function registeredFormationForHistoryDate(train,date){
    const family=typeof formationFamilyForTrain==='function'?formationFamilyForTrain(train):'';
    const area=typeof window.storageAreaForFamily==='function'?String(window.storageAreaForFamily(family)||'__ROOT__'):'__ROOT__';
    const no=String(train?.no||'').trim();
    if(!family||!no) return '';
    const day=historyScheduleDayForDate(date);
    const assignments=formationRemoteByFamily?.[family]?.areaStateByDate?.[date]?.[area]||{};
    const chainInfo=typeof findChain==='function'?findChain(day,no):null;
    const chain=chainInfo?(OPERATION_CHAINS?.[day]?.[chainInfo.chainIndex]||[]):[];
    const chainNos=[no];
    for(const entry of chain){const linkedNo=String(entry?.no||entry||'').trim();if(linkedNo&&!chainNos.includes(linkedNo))chainNos.push(linkedNo);}
    const getSavedValue=trainNo=>{
      const key=String(trainNo||'').trim();
      const direct=String(assignments?.[key]?.f||'').trim();
      if(direct) return direct;
      const normalized=normalizeTrainNo(key);
      for(const [savedNo,entry] of Object.entries(assignments)) if(normalizeTrainNo(savedNo)===normalized&&String(entry?.f||'').trim()) return String(entry.f).trim();
      return '';
    };
    for(const candidateNo of chainNos){
      const value=getSavedValue(candidateNo);
      if(value) return value;
    }
    return '';
  }

  function latestRegisteredFormationForHistory(train,currentDate){
    const family=typeof formationFamilyForTrain==='function'?formationFamilyForTrain(train):'';
    const dates=Object.keys(formationRemoteByFamily?.[family]?.areaStateByDate||{})
      .filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(String(date))&&String(date)<=String(currentDate))
      .sort((a,b)=>String(b).localeCompare(String(a)));
    for(const date of dates){
      const value=registeredFormationForHistoryDate(train,date);
      if(value) return value;
    }
    return '';
  }

  function historyOperationNumberAliases(entry,day){
    const aliases=new Set();
    const add=value=>{
      if(value&&typeof value==='object'){
        add(value.no??value.number??value.trainNo??value.trainNumber);
        return;
      }
      const normalized=normalizeTrainNo(value);
      if(normalized) aliases.add(normalized);
    };
    const entryNo=String(entry?.no||entry||'').trim();
    add(entryNo);
    const source=entryNo?findOperationTrainRecord(entryNo,day):null;
    for(const field of ['numberSegments','numbersByLine','trainNumbers']){
      for(const list of Object.values(source?.[field]||{})){
        if(Array.isArray(list)) list.forEach(add);
      }
    }
    return aliases;
  }

  function historyChainsForTrainNumber(trainNo,day){
    const target=normalizeTrainNo(trainNo);
    if(!target) return [];
    const chains=Array.isArray(OPERATION_CHAINS?.[day])?OPERATION_CHAINS[day]:[];
    const exact=[],canonical=[];
    const targetCanonical=target.replace(/A$/i,'');
    chains.forEach((entries,chainIndex)=>{
      if(!Array.isArray(entries)||!entries.length) return;
      const aliases=new Set();
      entries.forEach(entry=>historyOperationNumberAliases(entry,day).forEach(no=>aliases.add(no)));
      if(aliases.has(target)){
        exact.push({chainIndex,entries});
        return;
      }
      if([...aliases].some(no=>no.replace(/A$/i,'')===targetCanonical)) canonical.push({chainIndex,entries});
    });
    // A付き／Aなしの別列車がある場合は、完全一致する運用だけを優先する。
    return exact.length?exact:canonical;
  }

  function renderTrainNumberFormationHistory(train){
    const currentDate=String(operationDateKey(new Date())||operationDateKey()).trim();
    const trainNo=String(trainDisplayNoAtTime(train,currentMinutes())||train?.no||currentTrainNo||'').trim();
    const targetNo=normalizeTrainNo(trainNo);
    const targetCanonical=targetNo.replace(/A$/i,'');
    const family=typeof formationFamilyForTrain==='function'?formationFamilyForTrain(train):'';
    const area=typeof window.storageAreaForFamily==='function'?String(window.storageAreaForFamily(family)||'__ROOT__'):'__ROOT__';
    const allDates=formationRemoteByFamily?.[family]?.areaStateByDate||{};
    const records=[];
    const seenRecords=new Set();
    const emptyText='この列車番号に該当する編成履歴はありません。';
    const empty=`<div class="station-timetable-frame train-history-frame"><div class="train-history-wrap"><div class="formation-input-history-list train-number-history-list"><div class="formation-input-history-empty">${emptyText}</div></div></div></div>`;
    if(!family||!targetNo) return empty;

    const canonicalNo=value=>normalizeTrainNo(value).replace(/A$/i,'');
    const formationValueOf=stored=>String(stored?.f??stored?.formation??'').trim();
    const formationIdentity=value=>String(window.normalizeStoredFormationId?.(value)||value||'').split('+').map(id=>id.trim().replace(/F$/i,'')).filter(Boolean).join('+');
    const historyPostFor=function(date,savedNo,stored){
      let post=null;
      try{post=latestFormationInputHistoryEntry(family,date,savedNo);}catch(e){}
      if(!post||post.unselected) return null;
      const postValue=formationValueOf(post);
      return postValue&&formationIdentity(postValue)===formationIdentity(formationValueOf(stored))?post:null;
    };
    const assignmentForNumber=function(assignments,number,date){
      const normalized=normalizeTrainNo(number);
      if(!normalized) return null;
      const entries=Object.entries(assignments||{}).filter(([savedNo,stored])=>normalizeTrainNo(savedNo)&&stored&&typeof stored==='object')
        .map(([savedNo,stored])=>({savedNo:String(savedNo),normalizedNo:normalizeTrainNo(savedNo),stored}));
      // 完全一致の保存番号があればそちらを優先する。明示的な未選択も別番号へフォールバックしない。
      let matches=entries.filter(item=>item.normalizedNo===normalized);
      if(!matches.length) matches=entries.filter(item=>canonicalNo(item.normalizedNo)===canonicalNo(normalized));
      if(!matches.length) return null;
      matches.sort((a,b)=>{
        const aExact=a.normalizedNo===normalized?1:0,bExact=b.normalizedNo===normalized?1:0;
        if(aExact!==bExact) return bExact-aExact;
        return String(a.savedNo).localeCompare(String(b.savedNo),'ja',{numeric:true});
      });
      const item=matches[0];
      const rawFormation=formationValueOf(item.stored);
      if(!rawFormation||window.isUnselectedFormationId?.(rawFormation)||window.wasFirebaseFormationInputHistoryCleared?.(family,date,item.savedNo)) return null;
      const value=String(window.normalizeStoredFormationId?.(rawFormation)||rawFormation).trim();
      const ids=value.split('+').map(id=>id.trim()).filter(id=>id&&!window.isUnselectedFormationId?.(id));
      if(!ids.length) return null;
      const post=historyPostFor(date,item.savedNo,item.stored);
      return {savedNo:item.savedNo,normalizedNo:item.normalizedNo,stored:item.stored,value,ids,identity:formationIdentity(value),post};
    };
    const assignmentTime=function(assignment,date){
      const source=assignment?.post||{};
      const direct=Number(source.at??source.createdAt)||0;
      if(direct>0) return direct;
      const raw=String(source.t||assignment?.stored?.t||'');
      const match=raw.match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
      if(match){
        const stamp=new Date(2000+Number(match[1]),Number(match[2])-1,Number(match[3]),Number(match[4]),Number(match[5])).getTime();
        if(Number.isFinite(stamp)) return stamp;
      }
      const meta=typeof parseStoredMeta==='function'?parseStoredMeta(raw):null;
      const mins=Number(meta?.time);
      if(Number.isFinite(mins)&&mins>=0&&mins<1440){
        const [year,month,dayNum]=String(date).split('-').map(Number);
        return new Date(year,month-1,dayNum,Math.floor(mins/60),mins%60).getTime();
      }
      return new Date(`${date}T00:00:00`).getTime();
    };

    const dates=Object.keys(allDates)
      .filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(String(date))&&String(date)<=currentDate)
      .sort((a,b)=>String(b).localeCompare(String(a)));

    for(const date of dates){
      const dateObj=new Date(`${date}T12:00:00`);
      if(Number.isNaN(dateObj.getTime())) continue;
      const day=getScheduleDayForDate(dateObj);
      const relevantChains=historyChainsForTrainNumber(trainNo,day);
      if(!relevantChains.length) continue;
      const assignments=allDates?.[date]?.[area]||{};

      for(const chainRecord of relevantChains){
        // 運用の接続順に列車番号を展開し、選択中の列車番号がある位置を特定する。
        const expanded=expandHistoryEntriesByTrainNumber(chainRecord.entries,day);
        let orderedNumbers=(expanded.length?expanded:chainRecord.entries).map(entry=>normalizeTrainNo(entry?.no||entry)).filter(Boolean);
        orderedNumbers=orderedNumbers.filter((number,index)=>index===0||number!==orderedNumbers[index-1]);
        let targetIndex=orderedNumbers.findIndex(number=>number===targetNo);
        if(targetIndex<0) targetIndex=orderedNumbers.findIndex(number=>canonicalNo(number)===targetCanonical);
        if(targetIndex<0){
          const sourceIndex=chainRecord.entries.findIndex(entry=>historyOperationNumberAliases(entry,day).has(targetNo));
          if(sourceIndex>=0){
            const sourceNo=normalizeTrainNo(chainRecord.entries[sourceIndex]?.no||chainRecord.entries[sourceIndex]);
            targetIndex=orderedNumbers.findIndex(number=>number===sourceNo||canonicalNo(number)===canonicalNo(sourceNo));
          }
        }
        if(targetIndex<0) continue;

        const assignedByIndex=orderedNumbers.map(number=>assignmentForNumber(assignments,number,date));
        // まず選択中の列車までに最後に登録された編成を採用。
        let chosen=null;
        for(let i=0;i<=targetIndex;i++) if(assignedByIndex[i]) chosen=assignedByIndex[i];
        // 後続列車にも登録がある場合、異なる編成が現れたらその直前の編成で止める。
        // 同じ編成の登録が続く間は、より後ろの登録を採用して時刻・登録者も最新にする。
        for(let i=targetIndex+1;i<assignedByIndex.length;i++){
          const next=assignedByIndex[i];
          if(!next) continue;
          if(!chosen){chosen=next;continue;}
          if(next.identity!==chosen.identity) break;
          chosen=next;
        }
        // 選択中の列車から先にも登録がなく、前にもなければ、運用中で最後に登録された編成を使う。
        if(!chosen){
          for(let i=assignedByIndex.length-1;i>=0;i--){if(assignedByIndex[i]){chosen=assignedByIndex[i];break;}}
        }
        if(!chosen) continue;
        const recordKey=[date,chainRecord.chainIndex,chosen.savedNo,chosen.identity].join('|');
        if(seenRecords.has(recordKey)) continue;
        seenRecords.add(recordKey);
        records.push({date,day,assignment:chosen});
      }
    }

    if(!records.length) return empty;
    records.sort((a,b)=>String(b.date).localeCompare(String(a.date))||assignmentTime(b.assignment,b.date)-assignmentTime(a.assignment,a.date));
    const rows=records.map(record=>{
      const assignment=record.assignment;
      const displayObjects=assignment.ids.map(id=>{
        try{return selectionDisplayObjectForTrain(train,id)||selectionDisplayObject(id)||formationById(id)||{};}
        catch(e){return selectionDisplayObject(id)||formationById(id)||{};}
      });
      const names=assignment.ids.map((id,index)=>String(displayObjects[index]?.name||formationById(id)?.name||id));
      const image=String(displayObjects[0]?.img||displayObjects[0]?.image||jsonNoImageUrl()||fallbackTrainImageUrl());
      const historyPost=assignment.post||{};
      const metaRaw=String(historyPost.t||assignment.stored?.t||'');
      const datetime=formatFormationInputHistoryDateTime({at:historyPost.at??historyPost.createdAt,t:metaRaw},record.date);
      const storedMeta=typeof parseStoredMeta==='function'?parseStoredMeta(metaRaw):{};
      const author=String(historyPost.author||historyPost.userName||historyPost.userId||storedMeta?.author||'登録者不明');
      const dateLabel=String(record.date||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1/$2/$3');
      return `<div class="formation-input-history-item train-number-history-item" title="${escapeAttr(record.date)}">
        <div class="train-number-history-date">${escapeAttr(dateLabel)}</div>
        <img class="formation-input-history-image" src="${escapeAttr(image)}" alt="${escapeAttr(names.join('・'))}" onerror="this.onerror=null;this.src=jsonNoImageUrl()">
        <div class="formation-input-history-formation" title="${escapeAttr(names.join(' + '))}">${escapeAttr(names.join(' + '))}</div>
        <div class="formation-input-history-meta"><span class="formation-input-history-datetime">${escapeAttr(datetime)}</span><span class="formation-input-history-author">${escapeAttr(author)}</span></div>
      </div>`;
    }).join('');
    return `<div class="station-timetable-frame train-history-frame"><div class="train-history-wrap"><div class="formation-input-history-list train-number-history-list">${rows||'<div class="formation-input-history-empty">'+emptyText+'</div>'}</div></div></div>`;
  }

  function renderFormationOperationHistory(train, visibility={}){
    // 現在表示中の列番時点で登録されている編成だけを、登録された順序のまま表示する。
    // A+B+Cで登録されていれば、A・B・Cそれぞれの見出しと運用履歴を縦に並べる。
    // 路線内の未登録編成を一覧に混ぜない。
    const assignedValue=String(effectiveFormationIdForTrain(train)||'').trim();
    const ids=assignedValue.split('+')
      .map(value=>String(value||'').trim().replace(/F$/i,''))
      .filter((id,index,all)=>id && all.indexOf(id)===index && id!==INITIAL_FORMATION_SELECTION.id && !window.isUnselectedFormationId?.(id));
    const entries=[];
    for(const id of ids){
      const obj=typeof formationById==='function'?formationById(id):null;
      if(!obj || obj.kind==='type' || obj.kind==='variant' || obj.generic===true || obj.selectableType===true) continue;
      entries.push({id,name:String(obj.name||id),img:String(obj.img||obj.image||fallbackTrainImageUrl())});
    }
    if(!entries.length){
      return '<div class="train-info-empty">現在表示中の列番に登録されている編成がありません。</div>';
    }
    const items=entries.map(entry=>{
      const historyHtml=renderSingleFormationOperationHistory(train,visibility,entry.id);
      return `<details class="formation-history-single-item">
        <summary class="formation-history-single-heading">
          <img src="${escapeAttr(entry.img)}" alt="" onerror="this.onerror=null;this.src=jsonNoImageUrl()">
          <strong>${escapeAttr(entry.name)}</strong><span class="formation-history-single-chevron" aria-hidden="true"></span>
        </summary>
        <div class="formation-history-single-content">${historyHtml}</div>
      </details>`;
    }).join('');
    return `<div class="formation-history-all-items">${items}</div>`;
  }

function renderSingleFormationOperationHistory(train, visibility={}, targetFormationOverride=''){
    // 「今日の運用」で列全体が非表示になる条件をそのまま履歴にも適用する。
    const hideHistoryNumber=visibility.hideNumber===true;
    const hideHistoryType=visibility.hideType===true;
    const currentDate=operationDateKey(new Date());
    // 表示中の日付ではなく、今日までの最新登録編成を基準に全期間の運用履歴を表示する。
    const assignedValue=String(targetFormationOverride||latestRegisteredFormationForHistory(train,currentDate)||'').trim();
    const emptyHistoryFrame='<div class="station-timetable-frame train-history-frame"><div class="train-history-wrap"></div></div>';
    if(!assignedValue){
      return emptyHistoryFrame;
    }

    // 運用履歴の対象は個別編成のみ。形式全体（○○系・○○型）、個体差（○両・更新／未更新等）、
    // 未選択値や解決できないIDは履歴の照合対象から除外する。
    const isIndividualFormationId=(value)=>{
      const id=String(value||'').trim().replace(/F$/i,'');
      if(!id || id===INITIAL_FORMATION_SELECTION.id) return false;
      const obj=typeof formationById==='function' ? formationById(id) : null;
      return !!obj && obj.kind!=='type' && obj.kind!=='variant' && obj.generic!==true && obj.selectableType!==true;
    };
    const targetIds=assignedValue.split('+')
      .map(id=>String(id||'').trim().replace(/F$/i,''))
      .filter(isIndividualFormationId);
    if(!targetIds.length){
      return emptyHistoryFrame;
    }
    const family=typeof formationFamilyForTrain==='function'
      ? formationFamilyForTrain(train)
      : String(formationStorageContext(train)?.family||'').trim();
    const area=typeof window.storageAreaForFamily==='function'
      ? String(window.storageAreaForFamily(family)||'__ROOT__')
      : String(formationStorageContext(train)?.area||'__ROOT__');
    const allDates=formationRemoteByFamily?.[family]?.areaStateByDate||{};
    const records=[];

    for(const [date,areaMap] of Object.entries(allDates)){
      // 当日分も含め、未来の日付だけを除外する。
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date)) || String(date)>currentDate) continue;
      const assignments=areaMap?.[area]||{};
      const dateObj=new Date(`${date}T12:00:00`);
      if(Number.isNaN(dateObj.getTime())) continue;
      const day=getScheduleDayForDate(dateObj);
      const dayChains=Array.isArray(OPERATION_CHAINS?.[day])?OPERATION_CHAINS[day]:[];
      const matchedChains=new Map();
      const unchained=[];

      // 編成が登録されている列車を起点として、その列車が属する運用チェーン全体を収集。
      for(const [assignedNoRaw,stored] of Object.entries(assignments)){
        const assignedIds=String(stored?.f||'').split('+')
          .map(id=>String(id||'').trim().replace(/F$/i,''))
          .filter(isIndividualFormationId);
        if(!assignedIds.length || !targetIds.some(id=>assignedIds.includes(id))) continue;
        const assignedNo=normalizeTrainNo(assignedNoRaw);
        if(!assignedNo) continue;
        // 同じ列車番号が複数の運用チェーンに含まれる場合も、該当するチェーンをすべて表示する。
        // A付き列番などが別列車として存在するときは、まず完全一致を優先する。
        const exactChainIndexes=[];
        const canonicalChainIndexes=[];
        dayChains.forEach((chain,chainIndex)=>{
          if(!Array.isArray(chain)||!chain.length) return;
          const belongsToNumber=entry=>{
            const entryNo=normalizeTrainNo(entry?.no||entry);
            if(entryNo===assignedNo) return true;
            const source=entryNo?findOperationTrainRecord(entryNo,day):null;
            if(!source) return false;
            const all=[];
            for(const list of Object.values(source.numberSegments||{})) if(Array.isArray(list)) list.forEach(seg=>all.push(normalizeTrainNo(seg?.no)));
            for(const list of Object.values(source.numbersByLine||{})) if(Array.isArray(list)) list.forEach(n=>all.push(normalizeTrainNo(n)));
            for(const list of Object.values(source.trainNumbers||{})) if(Array.isArray(list)) list.forEach(n=>all.push(normalizeTrainNo(n)));
            return all.includes(assignedNo);
          };
          const hasExact=chain.some(belongsToNumber);
          if(hasExact) exactChainIndexes.push(chainIndex);
          else if(chain.some(entry=>{
            const entryNo=normalizeTrainNo(entry?.no||entry);
            if(entryNo.replace(/A$/i,'')===assignedNo.replace(/A$/i,'')) return true;
            const source=entryNo?findOperationTrainRecord(entryNo,day):null;
            const values=[];
            for(const list of Object.values(source?.numberSegments||{})) if(Array.isArray(list)) list.forEach(seg=>values.push(normalizeTrainNo(seg?.no)));
            for(const list of Object.values(source?.numbersByLine||{})) if(Array.isArray(list)) list.forEach(n=>values.push(normalizeTrainNo(n)));
            return values.some(n=>n.replace(/A$/i,'')===assignedNo.replace(/A$/i,''));
          })) canonicalChainIndexes.push(chainIndex);
        });
        const chainIndexes=exactChainIndexes.length?exactChainIndexes:canonicalChainIndexes;
        if(chainIndexes.length){
          for(const chainIndex of chainIndexes){
            const chain=dayChains[chainIndex];
            const chainKey=String(chainIndex);
            if(!matchedChains.has(chainKey)) matchedChains.set(chainKey,{chainIndex,entries:chain,registeredNumbers:[]});
            matchedChains.get(chainKey).registeredNumbers.push(assignedNo);
          }
        }else{
          unchained.push({trainNo:assignedNo,assignedValue:String(stored?.f||'')});
        }
      }

      if(matchedChains.size || unchained.length){
        records.push({date,day,chains:[...matchedChains.values()].sort((a,b)=>a.chainIndex-b.chainIndex),unchained});
      }
    }

    records.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(!records.length){
      return '<div class="train-info-empty">今日までの登録編成に該当する運用履歴はありません。</div>';
    }

    const weekdayNames=['日','月','火','水','木','金','土'];
    const renderRun=(entry,day,registerNo='')=>{
      const entryNo=normalizeTrainNo(entry?.no||entry||registerNo);
      const sourceTrain=entryNo?findOperationTrainRecord(entryNo,day):null;
      if(!entry && !sourceTrain){
        return `<div class="train-history-run train-history-run-message">この日付の時刻表データでは運用を特定できません（登録列車番号：${escapeAttr(registerNo||entryNo)}）</div>`;
      }
      const displayNo=isDisplayableOperationTrainNumber(entryNo,sourceTrain)?entryNo:'';
      const rawType=String(entry?.type||sourceTrain?.type||'').trim();
      const typeLabel=rawType?getOperationalTypeLabel(rawType,entryNo||registerNo,sourceTrain):'';
      const start=String(entry?.start||sourceTrain?.start||sourceTrain?.stops?.[0]?.station||'').trim();
      const badgeStyle=rawType?typeBadgeInlineStyle(sourceTrain||{type:rawType},null,null,start):'';
      const dest=String(entry?.dest||sourceTrain?.dest||sourceTrain?.stops?.[sourceTrain?.stops?.length-1]?.station||'').trim();
      const startTime=String(entry?.startTime||sourceTrain?.startTime||sourceTrain?.stops?.[0]?.departure||sourceTrain?.stops?.[0]?.time||'').trim();
      const endTime=String(entry?.endTime||sourceTrain?.endTime||sourceTrain?.stops?.[sourceTrain?.stops?.length-1]?.arrival||sourceTrain?.stops?.[sourceTrain?.stops?.length-1]?.time||'').trim();
      const historyRowClasses=[
        'train-operation-row','train-history-run',
        hideHistoryNumber?'hide-operation-number':'',
        hideHistoryType?'hide-operation-type':''
      ].filter(Boolean).join(' ');
      return `<div class="${historyRowClasses}">
        ${hideHistoryNumber?'':`<span class="train-operation-number">${escapeAttr(displayNo)}</span>`}
        ${hideHistoryType?'':`<span class="station-timetable-type train-operation-type${typeLabel?' '+getTrainTypeDisplayClass(sourceTrain):' empty-operation-field'}"${rawType?` style="${badgeStyle}"`:''}>${escapeAttr(typeLabel)}</span>`}
        <span class="train-operation-time">${escapeAttr(formatRailwayDisplayTime(startTime))}</span>
        <span class="train-operation-station start-station" title="${escapeAttr(start)}">${escapeAttr(start)}</span>
        <span class="train-operation-arrow" aria-hidden="true">→</span>
        <span class="train-operation-time">${escapeAttr(formatRailwayDisplayTime(endTime))}</span>
        <span class="train-operation-station end-station" title="${escapeAttr(dest)}">${escapeAttr(dest)}</span>
      </div>`;
    };

    const historyCards=records.map(record=>{
      const d=new Date(`${record.date}T12:00:00`);
      const dateLabel=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${weekdayNames[d.getDay()]}）`;
      const runs=[];
      const seenRows=new Set();
      // 同じ運用チェーンが複数の登録列車から見つかった場合は一度だけ表示する。
      for(const chainRecord of record.chains){
        // 同じ運用内でも列番が変わる駅を境界にし、別の列車行として表示する。
        const expandedEntries=expandHistoryEntriesByTrainNumber(chainRecord.entries,record.day);
        for(const entry of expandedEntries){
          const no=normalizeTrainNo(entry?.no||entry);
          const rowKey=[no,entry?.startTime||'',entry?.endTime||'',entry?.start||'',entry?.dest||''].join('|');
          if(seenRows.has(rowKey)) continue;
          seenRows.add(rowKey);
          runs.push(renderRun(entry,record.day));
        }
      }
      for(const item of record.unchained){
        const sourceTrain=findOperationTrainRecord(item.trainNo,record.day);
        if(sourceTrain){
          const entry={
            no:item.trainNo,type:sourceTrain.type,start:sourceTrain.start||sourceTrain.stops?.[0]?.station,
            startTime:sourceTrain.startTime||sourceTrain.stops?.[0]?.departure||sourceTrain.stops?.[0]?.time,
            dest:sourceTrain.dest||sourceTrain.stops?.[sourceTrain.stops?.length-1]?.station,
            endTime:sourceTrain.endTime||sourceTrain.stops?.[sourceTrain.stops.length-1]?.arrival||sourceTrain.stops?.[sourceTrain.stops.length-1]?.time
          };
          const expandedEntries=expandHistoryEntriesByTrainNumber([entry],record.day);
          for(const expandedEntry of expandedEntries){
            const rowKey=[expandedEntry.no,expandedEntry.startTime||'',expandedEntry.endTime||'',expandedEntry.start||'',expandedEntry.dest||''].join('|');
            if(!seenRows.has(rowKey)){seenRows.add(rowKey);runs.push(renderRun(expandedEntry,record.day,item.trainNo));}
          }
        }else{
          runs.push(renderRun(null,record.day,item.trainNo));
        }
      }
      if(!runs.length){
        runs.push('<div class="train-history-run train-history-run-message">この日付の時刻表データでは運用を特定できません。</div>');
      }
      return `<details class="train-history-card">
        <summary class="train-history-card-header"><span class="train-history-date">${escapeAttr(dateLabel)}</span><span class="train-history-day">${escapeAttr(record.day)}ダイヤ</span><span class="train-history-chevron" aria-hidden="true"></span></summary>
        <div class="train-history-runs">${runs.join('')}</div>
      </details>`;
    }).join('');

    return `<div class="station-timetable-frame train-history-frame"><div class="train-history-wrap">${historyCards}</div></div>`;
  }

  function renderFormationInfo(train){
    const formationValue=String(effectiveFormationIdForTrain(train)||'').trim();
    const ids=formationValue.split('+').map(x=>x.trim()).filter(Boolean);
    const color=primaryTrainInfoColor();
    if(!ids.length){
      return `<div class="train-info-empty">現在登録されている編成はありません。</div>`;
    }
    return `<div class="train-formation-details">${ids.map(id=>{
      const obj=selectionDisplayObject(id)||formationById(id)||{};
      const raw=rawFormationDefinitionById(id)||{};
      const name=String(obj?.name||raw?.name||id).trim();
      const type=String(raw?.formationType||raw?.type||obj?.type||raw?._groupType||'').trim();
      const storedManufacturingYear=formationRawValue(raw,['manufacturingYear','manufactureYear','製造年']);
      const legacyCompletionDate=formationRawValue(raw,['completionDate','formationDate','completedAt','落成日']);
      const legacyYears=[...new Set((legacyCompletionDate.match(/(?:19|20)\d{2}年/g)||[]))];
      const manufacturingYear=storedManufacturingYear || legacyYears.join('・');
      const maker=formationRawValue(raw,['manufacturer','manufacturerName','maker','製造メーカー']);
      const comment=formationRawValue(raw,['comment','comments','remarks','note','コメント']);
      const cars=formationCarNames({...raw,carNames:Array.isArray(raw?.carNames)&&raw.carNames.length?raw.carNames:obj?.carNames},id);
      const carsHtml=raw?._isFormationGroup ? '' : `<div class="train-formation-detail-row train-formation-cars-row"><span>車番</span><div class="train-formation-cars">${cars.length?cars.map((car,i)=>{
          const featuresRaw=raw?.carFeatures?.[String(car)] ?? raw?.carFeatures?.[String(car).trim()];
          const features=(Array.isArray(featuresRaw)?featuresRaw:[featuresRaw]).map(item=>{
            if(item && typeof item==='object'){
              const label=String(item.name ?? item.label ?? item.value ?? item.feature ?? '').trim();
              const type=String(item.type ?? item.category ?? item.kind ?? '').trim();
              return label?{label,type}:null;
            }
            const label=String(item||'').trim();
            if(!label) return null;
            // 文字列形式の旧データも読み取れるようにし、既知の名称は分類する。
            const type=/行先表示|表示器|機器|制御|モーター|空調|VVVF|ATO|ATS/i.test(label)?'機器類':
              /座席|シート|内装|車内|つり革|床材|化粧板|照明/i.test(label)?'内装':
              /外観|塗装|ラッピング|前面|車体|帯色|ロゴ|スカート/i.test(label)?'外観':'';
            return {label,type};
          }).filter(Boolean);
          const featureTypeClass=type=>type==='外観'?'car-feature-type-appearance':type==='内装'?'car-feature-type-interior':type==='機器類'?'car-feature-type-equipment':'';
          const carPosition=i+1;
          const womenOnlyCars=Array.isArray(raw?.womenOnlyCars)?raw.womenOnlyCars:[];
          const weakCoolingCars=Array.isArray(raw?.weakCoolingCars)?raw.weakCoolingCars:[];
          const isWomenOnly=womenOnlyCars.some(n=>Number(n)===carPosition);
          const isWeakCooling=weakCoolingCars.some(n=>Number(n)===carPosition);
          const carServiceClass=[isWomenOnly?'women-only-car':'',isWeakCooling?'weak-cooling-car':''].filter(Boolean).join(' ');
          const serviceTags=[
            isWeakCooling?'<span class="permission-tag car-feature-tag car-service-tag weak-cooling-tag">弱冷房車</span>':'',
            isWomenOnly?'<span class="permission-tag car-feature-tag car-service-tag women-only-tag">女性専用車</span>':''
          ].filter(Boolean).join('');
          return `<div class="train-formation-car-row${carServiceClass?' '+carServiceClass:''}"><b>${i+1}号車</b><span class="train-formation-car-number">${escapeAttr(car)}</span><div class="train-formation-car-feature-viewport">${features.length?`<div class="train-formation-car-feature-track"><div class="train-formation-car-feature-group">${features.map(feature=>`<span class="permission-tag car-feature-tag ${featureTypeClass(feature.type)}"${feature.type?` data-feature-type="${escapeAttr(feature.type)}"`:''}>${escapeAttr(feature.label)}</span>`).join('')}</div></div>`:''}</div><div class="train-formation-car-service-tags">${serviceTags}</div></div>`;
        }).join(''):'<div class="train-formation-car-row"><b>—</b><span class="train-formation-car-number"></span><div class="train-formation-car-feature-viewport"></div><div class="train-formation-car-service-tags"></div></div>'}</div></div>`;
      return `<section class="train-formation-card" style="--train-info-color:${color}">
        <div class="train-formation-card-title">${escapeAttr(name)}</div>
        <div class="train-formation-detail-row train-formation-type-row"><span>形式</span><strong>${escapeAttr(type)}</strong></div>
        <div class="train-formation-detail-row"><span>製造年</span><strong>${escapeAttr(manufacturingYear)}</strong></div>
        <div class="train-formation-detail-row"><span>${raw?._isFormationGroup?'製造所':'製造メーカー'}</span><strong>${escapeAttr(maker)}</strong></div>
        ${carsHtml}
        ${comment?`<div class="train-formation-comment">${escapeAttr(comment)}</div>`:''}
      </section>`;
    }).join('')}</div>`;
  }

  function initCarFeatureMarquees(root){
    const schedule=typeof requestAnimationFrame==='function'?requestAnimationFrame:(fn)=>setTimeout(fn,0);
    schedule(()=>{
      if(!root || !root.isConnected) return;
      root.querySelectorAll('.train-formation-car-feature-viewport').forEach(viewport=>{
        const track=viewport.querySelector('.train-formation-car-feature-track');
        const group=track?.querySelector('.train-formation-car-feature-group');
        if(!track || !group) return;
        track.classList.remove('is-scrolling');
        track.style.removeProperty('--feature-marquee-duration');
        const clone=track.querySelector('.train-formation-car-feature-group[aria-hidden="true"]');
        if(clone) clone.remove();
        const viewportWidth=viewport.clientWidth;
        const groupWidth=group.scrollWidth;
        if(viewportWidth>0 && groupWidth>viewportWidth+1){
          const duplicate=group.cloneNode(true);
          duplicate.setAttribute('aria-hidden','true');
          track.appendChild(duplicate);
          const seconds=Math.max(8,Math.min(30,groupWidth/24));
          track.style.setProperty('--feature-marquee-duration',`${seconds}s`);
          track.classList.add('is-scrolling');
        }
      });
    });
  }

      .train-history-run .train-operation-number{font-size:12px;}
      .train-history-run .train-operation-type{min-height:21px;height:21px;padding:0 2px;font-size:10px;}
      .train-history-run .train-operation-time{font-size:11px;}
      .train-history-run .train-operation-station{font-size:11px;line-height:1.05;max-height:2.1em;}
      .train-history-run .train-operation-arrow{font-size:13px;}
      .train-history-run-message{min-height:28px;padding:4px 6px;font-size:11px;}
    }

    /* 運用履歴も「今日の運用」で非表示になる列を省き、残りのグリッドを詰める。 */
    .train-history-run.train-operation-row.hide-operation-number{grid-template-columns:66px 62px minmax(0,1fr) 20px 62px minmax(0,1fr)!important;}
    .train-history-run.train-operation-row.hide-operation-type{grid-template-columns:72px 62px minmax(0,1fr) 20px 62px minmax(0,1fr)!important;}
    .train-history-run.train-operation-row.hide-operation-number.hide-operation-type{grid-template-columns:62px minmax(0,1fr) 20px 62px minmax(0,1fr)!important;}
    @media(max-width:520px){
      .train-history-run.train-operation-row.hide-operation-number{grid-template-columns:50px 49px minmax(0,1fr) 13px 49px minmax(0,1fr)!important;}
      .train-history-run.train-operation-row.hide-operation-type{grid-template-columns:45px 49px minmax(0,1fr) 13px 49px minmax(0,1fr)!important;}
      .train-history-run.train-operation-row.hide-operation-number.hide-operation-type{grid-template-columns:49px minmax(0,1fr) 13px 49px minmax(0,1fr)!important;}
    }

    /* 今日の運用の各列車も運用履歴と同じ縦幅・文字サイズに揃える。 */
    #sheetContent .train-operation-wrap .train-operation-row{
      min-height:46px!important;height:46px!important;padding:3px 8px!important;column-gap:6px!important;
    }
    #sheetContent .train-operation-wrap .train-operation-number{font-size:16px!important;}
    #sheetContent .train-operation-wrap .train-operation-type{min-height:24px!important;height:24px!important;padding:2px 3px!important;font-size:12px!important;line-height:1.05!important;}
    #sheetContent .train-operation-wrap .train-operation-time{font-size:14px!important;}
    #sheetContent .train-operation-wrap .train-operation-station{font-size:14px!important;line-height:1.1!important;white-space:normal!important;max-height:2.2em;overflow:hidden;overflow-wrap:anywhere;word-break:normal;}
    #sheetContent .train-operation-wrap .train-operation-arrow{font-size:16px!important;}

    /* 編成入力履歴は1投稿1行。運用履歴と同じ46px（スマホ42px）で揃える。 */
    .formation-input-history-section{margin:0 0 10px;width:100%;min-width:0;background:#fff;border-radius:8px;overflow:hidden;}
    .formation-input-history-heading{font-size:15px;line-height:1.2;font-weight:800;padding:7px 9px;background:#f1f1f1;border-bottom:1px solid #ccc;}
    .formation-input-history-list{width:100%;min-width:0;}
    .formation-input-history-item{display:grid;grid-template-columns:52px minmax(90px,1.05fr) minmax(145px,1.2fr) auto;align-items:center;column-gap:8px;width:100%;height:46px;min-height:46px;box-sizing:border-box;padding:3px 8px;border-bottom:1px solid #bbb;background:#fff;}
    .formation-input-history-item:nth-child(even){background:#cfcfcf;}
    .formation-input-history-image{display:block;width:48px;height:38px;object-fit:contain;justify-self:center;background:transparent;}
    .formation-input-history-formation{min-width:0;font-size:14px;line-height:1.1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .formation-input-history-meta{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;font-size:11px;line-height:1.1;}
    .formation-input-history-datetime,.formation-input-history-author{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .formation-input-history-author{color:#555;}
    .formation-input-history-delete{justify-self:end;align-self:center;border:0;border-radius:5px;padding:5px 8px;background:#b3261e;color:#fff;font:700 12px/1 inherit;white-space:nowrap;cursor:pointer;}
    .formation-input-history-delete:hover{filter:brightness(.92);}
    .formation-input-history-empty{height:46px;min-height:46px;display:flex;align-items:center;padding:0 9px;font-size:12px;color:#666;background:#fff;}
    /* 列車番号の履歴は日付を列車アイコンの左側に置き、行高を約1.25倍にする。 */
    .train-number-history-list .formation-input-history-item{grid-template-columns:76px 52px minmax(90px,1.05fr) minmax(145px,1.2fr);height:58px;min-height:58px;column-gap:8px;}
    .train-number-history-list .train-number-history-date{font-size:12px;line-height:1.1;font-weight:800;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;}
    .train-number-history-list .formation-input-history-image{height:46px;}

    @media(max-width:520px){
      #sheetContent .train-operation-wrap .train-operation-row{min-height:42px!important;height:42px!important;padding:2px 4px!important;column-gap:3px!important;}
      #sheetContent .train-operation-wrap .train-operation-number{font-size:12px!important;}
      #sheetContent .train-operation-wrap .train-operation-type{min-height:21px!important;height:21px!important;padding:0 2px!important;font-size:10px!important;}
      #sheetContent .train-operation-wrap .train-operation-time{font-size:11px!important;}
      #sheetContent .train-operation-wrap .train-operation-station{font-size:11px!important;line-height:1.05!important;max-height:2.1em;}
      #sheetContent .train-operation-wrap .train-operation-arrow{font-size:13px!important;}
      .formation-input-history-heading{font-size:12px;padding:5px 6px;}
      .formation-input-history-item{grid-template-columns:38px minmax(72px,.9fr) minmax(85px,1.15fr) auto;column-gap:4px;height:42px;min-height:42px;padding:2px 4px;}
      .formation-input-history-image{width:36px;height:30px;}
      .formation-input-history-formation{font-size:11px;}
      .formation-input-history-meta{font-size:9px;gap:1px;}
      .formation-input-history-delete{padding:4px 5px;font-size:10px;}
      .formation-input-history-empty{height:42px;min-height:42px;font-size:10px;padding:0 6px;}
      .train-number-history-list .formation-input-history-item{grid-template-columns:62px 38px minmax(55px,.9fr) minmax(78px,1.15fr);height:53px;min-height:53px;column-gap:3px;padding:2px 4px;}
      .train-number-history-list .train-number-history-date{font-size:10px;}
      .train-number-history-list .formation-input-history-image{height:38px;width:36px;}
    }

    /* 今日の運用の時刻は端末幅によらず同じ文字サイズに固定。 */
    .train-operation-row:not(.train-history-run) .train-operation-time{font-size:18px!important;}
    #sheetContent .train-operation-wrap .train-operation-row:not(.train-history-run) .train-operation-time{font-size:18px!important;}

    /* 現在の運用は内側の枠線で強調し、通常行と各パーツの位置を揃える。 */
    .train-operation-row.current-operation{
      border:0!important;
      box-shadow:inset 0 0 0 3px var(--train-info-color,var(--primary))!important;
    }
    /* 次の運用には装飾の影を付けない。 */
    .train-operation-row.next-operation{box-shadow:none!important;}
  `;
  document.head.appendChild(style);
})();
</script>
