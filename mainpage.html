  loadFormationFamilyFromFirebase=async function(family){
    if(!routeMetaForFamily(family)) return false;
    const ref=formationOperationRef(family);
    if(!ref) return false;
    const snap=await ref.once('value');
    formationRemoteByFamily[family].areaStateByDate=normalizeStorageRoot(snap.val()||{},family);
    syncDerivedStateForFamily(family);
    return true;
  };

  mergeFormationRemoteIntoLegacyState=function(){
    syncDerivedStateForFamily(storageFamilyForActiveRoute());
    registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
  };

  preloadAllFormationFamilies=async function(){
    const results=await Promise.allSettled(FORMATION_FAMILIES.map(loadFormationFamilyFromFirebase));
    formationFirebaseReady=results.some(r=>r.status==='fulfilled'&&r.value===true);
    mergeFormationRemoteIntoLegacyState();
    registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
    applyRegistrationState();
    return formationFirebaseReady;
  };

  const firebaseFormationListenerRefs={};
  subscribeAllOperationState=function(){
    for(const family of FORMATION_FAMILIES){
      const ref=formationOperationRef(family);
      if(!ref) continue;
      try{firebaseFormationListenerRefs[family]?.off();}catch(e){}
      const handler=snap=>{
        formationRemoteByFamily[family].areaStateByDate=normalizeStorageRoot(snap.val()||{},family);
        syncDerivedStateForFamily(family);
        if(family===storageFamilyForActiveRoute()){
          registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
          applyRegistrationState();
          saveLocalState();
          refreshAllTrainDataCache();
          if(!isEditMode){renderTrainPositions();if(currentTrainNo)updateSheetContent();}
        }
      };
      ref.on('value',handler);
      firebaseFormationListenerRefs[family]=ref;
    }
  };

  saveLocalState=function(){
    try{
      const formationStateByFamily={},formationUpdatedAtByFamily={};
      for(const family of FORMATION_FAMILIES){
        formationStateByFamily[family]=formationRemoteByFamily[family]?.areaStateByDate||{};
        formationUpdatedAtByFamily[family]=formationRemoteByFamily[family]?.formationUpdatedAtByDay||{};
      }
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        operationDate:currentOperationDate,
        formationStateByFamily,
        formationUpdatedAtByFamily,
        history:remoteRoot.history||{}
      }));
    }catch(e){console.warn('local save failed',e);}
  };

  loadLocalState=function(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;
      const obj=JSON.parse(raw)||{};
      const saved=obj.formationStateByFamily;
      if(saved&&typeof saved==='object'){
        for(const family of FORMATION_FAMILIES){
          formationRemoteByFamily[family].areaStateByDate=normalizeStorageRoot(saved[family]||{},family);
          const ts=obj.formationUpdatedAtByFamily?.[family]||{};
          formationRemoteByFamily[family].formationUpdatedAtByDay={平日:cloneState(ts.平日||{}),休日:cloneState(ts.休日||{})};
          syncDerivedStateForFamily(family);
        }
      }
      remoteRoot.history=obj.history||{};
      currentOperationDate=obj.operationDate||currentOperationDate;
      operationHistory=historyEntries();
      registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
    }catch(e){console.warn('local load failed',e);}
  };

  initFirebase=async function(){
    loadLocalState();
    if(!FIREBASE_ENABLED||!window.firebase?.initializeApp) return false;
    try{
      const appName=FIREBASE_APP_NAME;
      let app=firebase.apps.find(a=>a.name===appName);
      if(!app) app=firebase.initializeApp(FIREBASE_CONFIG,appName);
      firebaseApp=app;
      firebaseDb=firebase.database(app);
      for(const family of FORMATION_FAMILIES){
        formationFirebaseApps[family]=app;
        formationFirebaseDbs[family]=firebaseDb;
      }
      if(typeof window.initFirebaseAuth==='function') window.initFirebaseAuth(app);
      firebaseReady=true;
      syncStatus('Firebase接続中');
      const ok=await preloadAllFormationFamilies();
      if(!ok){syncStatus('Firebase接続失敗（ローカル動作）');return false;}
      subscribeAllOperationState();
      return true;
    }catch(e){
      console.warn('Firebase初期化失敗',e);
      firebaseReady=false;firebaseDb=null;formationFirebaseReady=false;
      syncStatus('Firebase接続失敗（ローカル動作）');
      return false;
    }
  };

  async function syncRegistrationToRemoteByFamily(changesByFamily){
    const families=Object.keys(changesByFamily||{}).filter(f=>Object.keys(changesByFamily[f]||{}).length);
    if(!families.length) return true;
    if(!firebaseReady||!firebaseDb){syncStatus('Firebase未接続');return false;}
    try{
      const date=formationDateKey();
      const roleCode=typeof window.currentPermissionCodeForRoute==='function' ? window.currentPermissionCodeForRoute(activeRouteName) : '';
      for(const family of families){
        const db=firebaseDatabaseForFamily(family);
        const root=storageRootForFamily(family),area=storageAreaForFamily(family);
        if(!db||!root) continue;
        const updates=changesByFamily[family]||{};
        const stamp=makeStoredMeta();
        for(const [no,formId] of Object.entries(updates)){
          const ref=area==='__ROOT__'
            ? db.ref(root).child(date).child(String(no))
            : db.ref(root).child(area).child(date).child(String(no));
          const normalized=normalizeStoredFormationId(formId);
          if(normalized){
            const payload={f:normalized,t:stamp};
            if(roleCode) payload.r=roleCode;
            await ref.set(payload);
          }else await ref.remove();
        }
        await loadFormationFamilyFromFirebase(family);
      }
      mergeFormationRemoteIntoLegacyState();
      registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshAllTrainDataCache();
      syncStatus('Firebase同期済み');
      return true;
    }catch(e){
      console.error('編成登録Firebase同期失敗',e);
      syncStatus('Firebase書込失敗');
      return false;
    }
  }
  window.syncRegistrationToRemoteByFamily=syncRegistrationToRemoteByFamily;

  syncRegistrationToRemote=async function(changes={}){
    const grouped={};
    for(const [no,formId] of Object.entries(changes||{})){
      const train=findOperationTrainRecord(no,currentDay);
      if(!train) continue;
      const family=formationFamilyForTrain(train);
      grouped[family]??={};
      grouped[family][String(no)]=formId;
    }
    return syncRegistrationToRemoteByFamily(grouped);
  };

  recordSelection=async function(train,formId){
    if(isNonCurrentSelectedDate(selectedDateKey)||!train) return [];
    const selectedNo=String(train.no||'').trim();
    if(!selectedNo) return [];

    // 1日の運用チェーン単位で編成を管理する。
    // DBへ保存するキーは、必ずそのチェーンの一番最初の列車番号だけにする。
    const firstNo=operationChainFirstNo(currentDay,selectedNo);
    const firstTrain=findOperationTrainRecord(firstNo,currentDay) || train;
    const value=(formId&&formId!==INITIAL_FORMATION_SELECTION.id)?normalizeStoredFormationId(formId):null;
    if(value && !formationAllowedForTrain(firstTrain,value)) return [];

    const family=formationFamilyForTrain(firstTrain);
    const date=formationDateKey();
    const area=storageAreaForFamily(family);
    formationRemoteByFamily[family].areaStateByDate[date]??={};
    formationRemoteByFamily[family].areaStateByDate[date][area]??={};
    const areaState=formationRemoteByFamily[family].areaStateByDate[date];

    if(value){
      areaState[firstNo]={f:value,t:makeStoredMeta()};
      const roleCode=typeof window.currentPermissionCodeForRoute==='function' ? window.currentPermissionCodeForRoute(activeRouteName) : '';
      if(roleCode) areaState[firstNo].r=roleCode;
    }else{
      delete areaState[firstNo];
    }

    if(!Object.keys(areaState).length) delete formationRemoteByFamily[family].areaStateByDate[date][area];
    if(!Object.keys(formationRemoteByFamily[family].areaStateByDate[date]).length) delete formationRemoteByFamily[family].areaStateByDate[date];

    const changes={[firstNo]:value};
    pendingFormationState[firstNo]=value;
    pendingFormationTimestamps[currentDay]??={};
    if(value) pendingFormationTimestamps[currentDay][firstNo]=new Date().toISOString();
    else delete pendingFormationTimestamps[currentDay][firstNo];
    syncDerivedStateForFamily(family);

    mergeFormationRemoteIntoLegacyState();
    applyRegistrationState();
    refreshAllTrainDataCache();
    saveLocalState();
    const ok=await syncRegistrationToRemote(changes);
    if(ok) delete pendingFormationState[firstNo];

    if(currentTrainSnapshot&&String(currentTrainSnapshot.no||'')===selectedNo){
      currentTrainSnapshot={...currentTrainSnapshot,formation:value};
    }
    return [firstNo];
  };
})();

</script>

<script>
/* ===== 最大6編成・3列車併結対応 =====
   +区切りの前寄り→後寄り保存方式を
   全路線共通処理としてJSONの formationCount が省略された場合は1編成、2以上だけ個別指定する。
*/
(function(){
  const MAX_FORMATION_SLOTS=6;
  const DEFAULT_FORMATION_COUNT=3;
  let formationDropdownState=null;

  function clampFormationCount(v){
    const n=Number(v);
    if(!Number.isFinite(n)) return DEFAULT_FORMATION_COUNT;
    return Math.max(1,Math.min(MAX_FORMATION_SLOTS,Math.trunc(n)));
  }

  function formationCountForTrain(train){
    const routeDefault=activeJson?.formationCountDefault ?? activeRouteMeta?.formationCountDefault ?? train?.formationCount ?? DEFAULT_FORMATION_COUNT;
    return clampFormationCount(routeDefault);
  }
  window.formationCountForTrain=formationCountForTrain;

  function formationIds(value){
    return String(value??'').split('+').map(x=>String(x).trim()).filter(Boolean).slice(0,MAX_FORMATION_SLOTS);
  }

  /* 複数編成IDを1本の保存値として扱えるよう既存正規化を拡張。順序は変更しない。 */
  const oldNormalizeStoredFormationId=normalizeStoredFormationId;
  normalizeStoredFormationId=function(value){
    if(value===null||value===undefined||String(value).trim()==='') return null;
    const raw=String(value).trim();
    const ids=raw.split('+').map(x=>x.trim()).filter(Boolean);
    const normalized=ids.map(one=>{
      const v=oldNormalizeStoredFormationId(one);
      return v==null?'':String(v).replace(/F$/i,'');
    }).filter(Boolean);
    return normalized.length?normalized.join('+'):null;
  };

  /* 複数編成を許可。各編成は必ず実在する227系編成。 */
  formationAllowedForTrain=function(train,id){
    if(!id || id===INITIAL_FORMATION_SELECTION.id) return true;
    const ids=formationIds(id);
    if(!ids.length || ids.length>MAX_FORMATION_SLOTS) return false;
    return ids.every(one=>one===INITIAL_FORMATION_SELECTION.id || !!formationById(one));
  };

  selectionDisplayObject=function(id){
    if(!id || id===INITIAL_FORMATION_SELECTION.id) return INITIAL_FORMATION_SELECTION;
    const first=formationIds(id)[0];
    if(!first) return INITIAL_FORMATION_SELECTION;
    const known=formationById(first);
    return known||INITIAL_FORMATION_SELECTION;
  };
  selectionDisplayObjectForTrain=function(train,id){
    if(!id || id===INITIAL_FORMATION_SELECTION.id) return INITIAL_FORMATION_SELECTION;
    if(!formationAllowedForTrain(train,id)) return INITIAL_FORMATION_SELECTION;
    return selectionDisplayObject(id);
  };

  formationDisplayParts=function(id){
    const ids=formationIds(id);
    const parts=[];
    for(const one of ids){
      const obj=selectionDisplayObject(one);
      if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) continue;
      const type=String(obj.type||'').trim();
      const name=String(obj.name||'').trim();
      if(!name) continue;
      if(obj.displayAsFullName){
        parts.push(name);
      }else if(type && name.startsWith(type) && name!==type){
        const rest=name.slice(type.length).trim();
        parts.push(rest||type);
      }else parts.push(name);
    }
    return parts;
  };
  formationDisplayHTML=function(id){
    return formationDisplayParts(id).map(x=>`<span>${esc(x)}</span>`).join('');
  };

  /* 表示画像は常に前寄りの編成を代表画像にする。 */
  imageForTrain=function(t){
    const registeredId=registeredFormationForTrain(t);
    const first=formationIds(registeredId)[0];
    if(first){
      const f=formationById(first);
      if(f?.img) return f.img;
    }
    return defaultTrainImage(t);
  };

  function selectedIdsForTrain(train){
    const current=formationIds(train?.formation||registeredFormationForTrain(train)||'');
    const out=[];
    for(let i=0;i<MAX_FORMATION_SLOTS;i++) out.push(current[i]||'');
    return out;
  }

  function formationLabel(slot,count){
    if(count<=1) return '編成';
    if(slot===0) return '前寄り';
    if(slot===count-1) return '後寄り';
    return `${slot+1}編成目`;
  }

  function uchiboFormationImageUrl(id){
    if(String(activeRouteName||'')!=='内房線') return '';
    const key=String(id||'').replace(/F$/i,'').trim();
    let imageName='';
    if(/^F\d{2}$/i.test(key)) imageName=`E235_${key.toUpperCase()}`;
    else if(/^J\d{2}$/i.test(key)) imageName=`E235_${key.toUpperCase()}`;
    else if(/^R\d{2}$/i.test(key)) imageName=`E131_${key.toUpperCase()}`;
    else if(/^C(?:1|2|3|9)$/i.test(key)) imageName=`E233_${key.toUpperCase()}`;
    else if(key==='C401'||key==='C602') imageName=`209_${key}`;
    return imageName ? `https://minamikaze2700.github.io/Unyomatome/images/${imageName}.png` : '';
  }

  function formationOptionImage(item){
    const forced=uchiboFormationImageUrl(item?.id);
    return forced || String(item?.img||LINE_TRAIN_IMG);
  }

  function renderFormationOptions(slot,currentIds,count){
    const current=currentIds[slot]||'';
    const groups=formationDisplayGroups(formationsForTrain(currentTrainSnapshot||{}));
    const initial=`<div class="option-item initial-option" onclick="selectFormationAtSlot(${slot},'${INITIAL_FORMATION_SELECTION.id}')"><img src="${esc(syncInitialFormationImage())}" class="option-img"><span>${esc(INITIAL_FORMATION_SELECTION.name)}</span></div>`;
    const chunks=[];
    for(const group of groups){
      const groupType=String(group.type||'');
      const declaredType=activeFormationVisualValue(activeJson,activeRouteMeta,'formationType');
      const isGenericDeclared=!!declaredType && groupType===declaredType;
      const selectableCategory=!!group.selectableType || isGenericDeclared;
      const genericId=selectableCategory ? String(group.selectableId||declaredType||groupType) : '';
      chunks.push(selectableCategory
        ? `<div class="option-header option-category-header option-selectable-category" role="button" tabindex="0" onclick="selectFormationAtSlot(${slot},'${escapeJs(genericId)}')"><img src="${esc(group.typeImg||LINE_TRAIN_IMG)}" class="option-img" onerror="this.onerror=null;this.src=jsonNoImageUrl()"><span>${esc(genericId)}</span></div>`
        : `<div class="option-header option-category-header"><img src="${esc(group.typeImg||LINE_TRAIN_IMG)}" class="option-img" onerror="this.onerror=null;this.src=jsonNoImageUrl()"><span>${esc(groupType)}</span></div>`);

      // 個体差をすべて先に並べ、その後に形式全体の個別編成をまとめて表示。
      for(const variant of (group.variants||[])){
        chunks.push(`<div class="option-header option-subheader option-selectable-category" role="button" tabindex="0" onclick="selectFormationAtSlot(${slot},'${escapeJs(variant.id)}')"><img src="${esc(variant.img||LINE_TRAIN_IMG)}" class="option-img" onerror="this.onerror=null;this.src=jsonNoImageUrl()"><span>${esc(variant.name||variant.id)}</span></div>`);
      }

      // すべての個体差に属する個別編成をまとめて表示。
      const variantItems=(group.variants||[]).flatMap(variant=>Array.isArray(variant.items)?variant.items:[]);
      for(const item of [...variantItems,...(group.items||[])]){
        const id=String(item.id||'').replace(/F$/i,'');
        if(!id) continue;
        const disabled=!!item.disabled || UNAVAILABLE_FORMATIONS.has(id);
        const selectedElsewhere=currentIds.some((v,i)=>{
          if(i===slot || !v) return false;
          const other=String(v).replace(/F$/i,'');
          return other===id && !/^([AS]編成)$/.test(other);
        });
        if(selectedElsewhere) continue;
        const clickAttr=disabled ? '' : `onclick="selectFormationAtSlot(${slot},'${escapeJs(id)}')"`;
        chunks.push(`<div class="option-item ${disabled?'option-disabled':''}" ${disabled?'aria-disabled="true"':''} ${clickAttr}><img src="${esc(formationOptionImage(item))}" class="option-img" onerror="this.onerror=null;this.src=jsonNoImageUrl()"><span>${esc(item.name||id)}</span></div>`);
      }
    }
    return initial+chunks.join('');
  }
  function restoreHiroDropdown(){
    if(!formationDropdownState) return;
    const {el,parent,nextSibling}=formationDropdownState;
    if(parent?.isConnected){
      if(nextSibling && nextSibling.parentNode===parent) parent.insertBefore(el,nextSibling);
      else parent.appendChild(el);
    }
    el.classList.remove('hiro-formation-dropdown-portal','open');
    el.style.display='';el.style.position='';el.style.left='';el.style.top='';el.style.width='';el.style.maxHeight='';el.style.zIndex='';
    formationDropdownState=null;
  }

  function positionHiroDropdown(el,trigger){
    const r=trigger.getBoundingClientRect();
    const vv=window.visualViewport;
    const vw=Number(vv?.width||window.innerWidth);
    const vh=Number(vv?.height||window.innerHeight);
    const ox=Number(vv?.offsetLeft||0), oy=Number(vv?.offsetTop||0);
    const nav=document.getElementById('regionNav');
    const navRect=nav?.getBoundingClientRect();
    const viewportTop=oy;
    const viewportBottom=oy+vh;
    // スマホでは「地域メニューの上端から10px手前」をプルダウン下端の基準にする。
    const menuTop=Number.isFinite(Number(navRect?.top)) ? Number(navRect.top) : viewportBottom;
    const bottomLimit=Math.max(viewportTop,Math.min(viewportBottom,menuTop-10));
    const topBound=viewportTop+4;
    const width=Math.min(Math.max(r.width,250),Math.max(120,vw-12));
    const leftMin=ox+6;
    const leftMax=ox+vw-width-6;
    const left=Math.min(Math.max(leftMin,r.left),Math.max(leftMin,leftMax));
    const gap=4;
    const desiredTop=r.bottom+gap;
    const belowSpace=Math.max(0,bottomLimit-desiredTop);

    let top=desiredTop;
    let maxH=Math.min(300,belowSpace);
    // 下側に40px以上確保できない場合は上側へ開く。
    if(belowSpace<40){
      const aboveSpace=Math.max(0,r.top-gap-topBound);
      maxH=Math.min(300,aboveSpace);
      top=Math.max(topBound,r.top-gap-maxH);
    }
    maxH=Math.max(1,Math.min(maxH,Math.max(1,bottomLimit-top)));

    el.style.position='fixed';
    el.style.left=`${Math.round(left)}px`;
    el.style.top=`${Math.round(top)}px`;
    el.style.width=`${Math.round(width)}px`;
    el.style.maxHeight=`${Math.round(maxH)}px`;
  }

  function toggleFormationSlot(slot,event){
    if(!formationInputAllowed()) return;
    event?.preventDefault?.(); event?.stopPropagation?.();
    const el=document.getElementById(`hiroFormationOptions${slot}`);
    const trigger=document.getElementById(`hiroFormationTrigger${slot}`);
    if(!el||!trigger) return;
    if(el.classList.contains('open')){restoreHiroDropdown();return;}
    restoreHiroDropdown();
    formationDropdownState={el,parent:el.parentNode,nextSibling:el.nextSibling,trigger,slot};
    document.body.appendChild(el);
    el.classList.add('hiro-formation-dropdown-portal','open');
    el.style.display='block';el.style.pointerEvents='auto';el.style.zIndex='110';
    positionHiroDropdown(el,trigger);
  }
  window.toggleFormationSlot=toggleFormationSlot;

  // プルダウンをbody直下へ移動しているため、ページ・シート・VisualViewportの
  // スクロールでもトリガー位置へ追従させる。地域メニュー自体の処理は変更しない。
  const syncHiroDropdownPosition=()=>{
    const st=formationDropdownState;
    if(st?.el?.classList.contains('open') && st.trigger) positionHiroDropdown(st.el,st.trigger);
  };
  window.addEventListener('scroll',syncHiroDropdownPosition,true);
  if(window.visualViewport){
    window.visualViewport.addEventListener('scroll',syncHiroDropdownPosition,{passive:true});
    window.visualViewport.addEventListener('resize',syncHiroDropdownPosition,{passive:true});
  }

  function buildCompositeSelectors(train){
    const count=formationCountForTrain(train);
    const ids=selectedIdsForTrain(train);
    const fields=[];
    for(let slot=0;slot<count;slot++){
      const val=ids[slot]||'';
      const obj=selectionDisplayObject(val||INITIAL_FORMATION_SELECTION.id);
      const label=formationLabel(slot,count);
      fields.push(`
        <div class="hiro-formation-slot" data-slot="${slot}">
          <div class="custom-select-trigger hiro-formation-trigger" id="hiroFormationTrigger${slot}" onclick="toggleFormationSlot(${slot},event)">
            <div class="hiro-formation-trigger-inner"><img src="${esc(obj.img||LINE_TRAIN_IMG)}" class="option-img"><span>${esc(val?`${label}：${obj.name}`:`${label}：編成未選択`)}</span></div><span>▼</span>
          </div>
          <div class="custom-select-options hiro-formation-options" id="hiroFormationOptions${slot}">
            ${renderFormationOptions(slot,ids,count)}
          </div>
        </div>`);
    }
    return `<div class="hiro-formation-grid count-${count}">${fields.join('')}</div>`;
  }

  function updateCompositeEditUI(){
    if(!isEditMode || !formationInputAllowed() || !currentTrainSnapshot) return false;
    const container=document.querySelector('#sheetContent .select-box-container');
    if(!container) return false;
    container.innerHTML=buildCompositeSelectors(currentTrainSnapshot);
    const count=formationCountForTrain(currentTrainSnapshot);
    if(count>1){
      const input=document.getElementById('formationManualInput');
      if(input){ input.placeholder=formationInputPlaceholderForTrain(currentTrainSnapshot); input.value=formationIds(currentTrainSnapshot.formation||'').map(id=>selectionDisplayObject(id)?.name||id).join('+'); }
    }
    return true;
  }

  /* 既存updateSheetContentの描画結果を利用し、複数編成部分だけ差し替える。 */
  const oldUpdateSheetContent=updateSheetContent;
  updateSheetContent=function(){
    oldUpdateSheetContent();
    if(currentStationId) return;
    const train=currentTrainSnapshot || trainForCurrentDay(currentTrainNo);
    if(!train) return;
    const ids=formationIds(train.formation||registeredFormationForTrain(train)||'');
    const display=document.querySelector('#sheetContent .formation-id');
    if(display){
      const parts=formationDisplayParts(train.formation||registeredFormationForTrain(train)||'');
      display.innerHTML=parts.map(x=>`<span class="hiro-formation-display-line">${esc(x)}</span>`).join(' ＋ ');
      display.style.whiteSpace='normal';
    }
    if(isEditMode) updateCompositeEditUI();
  };

  /* 手入力も + 区切りで count 個まで受け付ける。 */
  registerFormationFromInput=async function(){
    if(!formationInputAllowed()) return;
    const input=document.getElementById('formationManualInput');
    const err=document.getElementById('formationInputError');
    if(err) err.textContent='';
    const train=liveTrain(currentTrainNo,currentTrainSnapshot?.direction||null)||currentTrainSnapshot;
    if(!train) return;
    const count=formationCountForTrain(train);
    const raw=String(input?.value||'').trim();
    if(!raw){ if(err) err.textContent='編成番号を入力してください。'; input?.focus(); return; }
    const pieces=raw.split('+').map(x=>x.trim()).filter(Boolean);
    if(pieces.length!==count){
      if(err) err.textContent=`この列車は${count}編成です。${count}個の編成を「+」で区切って入力してください。`;
      input?.focus();return;
    }
    const ids=[];
    for(const piece of pieces){
      const r=formationIdFromInput(piece,train);
      if(!r.ok){if(err)err.textContent=r.error;input?.focus();return;}
      const id=normalizeStoredFormationId(r.id);
      if(!id){if(err)err.textContent='編成を特定できません。';input?.focus();return;}
      ids.push(id);
    }
    // A編成/S編成は共通選択肢なので重複可。A01/S01などの個別編成だけ重複禁止。
    const realIds=ids.filter(id=>!/^([AS]編成)$/.test(String(id).replace(/F$/i,'')));
    if(new Set(realIds).size!==realIds.length){
      if(err)err.textContent='同じ実編成を重複して登録することはできません。';
      input?.focus();
      return;
    }
    currentTrainSnapshot={...currentTrainSnapshot,formation:ids.join('+')};
    train.formation=ids.join('+');
    await recordSelection(train,ids.join('+'));
    isEditMode=false;document.getElementById('bottomSheet')?.classList.remove('editing');
    closeFormationDropdown();
    updateSheetContent();renderTrainPositions();
  };

  async function saveFormationAtSlot(slot,id){
    if(!formationInputAllowed()) return;
    const train=liveTrain(currentTrainNo,currentTrainSnapshot?.direction||null)||currentTrainSnapshot;
    if(!train) return;
    const count=formationCountForTrain(train);
    if(slot<0||slot>=count)return;
    const ids=selectedIdsForTrain(train);
    const normalized=(id===INITIAL_FORMATION_SELECTION.id)?'':String(normalizeStoredFormationId(id)||'');
    if(normalized && UNAVAILABLE_FORMATIONS.has(normalized)){
      const err=document.getElementById('formationInputError'); if(err)err.textContent='この編成は入力できません。';
      return;
    }
    if(normalized && !formationById(normalized)){
      const err=document.getElementById('formationInputError'); if(err)err.textContent='選択した編成を特定できません。'; return;
    }
    if(normalized && !(formationById(normalized)?.generic)){
      const duplicate=ids.some((v,i)=>{
        if(i===slot || !v) return false;
        const other=String(v).replace(/F$/i,'');
        return other===normalized && !(formationById(other)?.generic);
      });
      if(duplicate){
        const err=document.getElementById('formationInputError');
        if(err) err.textContent='';
        return;
      }
    }
    if(normalized && slot>0 && !ids.slice(0,slot).every(Boolean)){
      const err=document.getElementById('formationInputError'); if(err)err.textContent='前寄りの編成から順番に選択してください。'; return;
    }
    ids[slot]=normalized;
    const saved=ids.slice(0,count).filter(Boolean).join('+');
    currentTrainSnapshot={...currentTrainSnapshot,formation:saved||null};
    train.formation=saved||null;
    await recordSelection(train,saved||null);
    restoreHiroDropdown();
    const complete=ids.slice(0,count).every(Boolean);
    if(complete){
      isEditMode=false;document.getElementById('bottomSheet')?.classList.remove('editing');
    }else{
      isEditMode=true;document.getElementById('bottomSheet')?.classList.add('editing');
    }
    updateSheetContent();renderTrainPositions();
  }
  window.selectFormationAtSlot=saveFormationAtSlot;


  /* Firebase Authentication + ユーザープロフィール */
  const USER_PROFILE_ROOT='運用/ユーザー';
  const USER_ID_INDEX_ROOT='運用/ユーザーIDIndex';
  const USER_NAME_INDEX_ROOT='運用/ユーザー名Index';

  function safeUserKey(value){
    const bytes=new TextEncoder().encode(String(value||''));
    let bin='';
    for(const b of bytes) bin+=String.fromCharCode(b);
    return 'k_'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function authErrorMessage(error){
    const code=String(error?.code||'');
    if(code==='auth/popup-closed-by-user') return 'ログイン画面が閉じられました。';
    if(code==='auth/popup-blocked') return 'ポップアップがブロックされました。ブラウザのポップアップを許可してください。';
    if(code==='auth/cancelled-popup-request') return '別のログイン処理が実行中です。';
    if(code==='auth/account-exists-with-different-credential') return 'このアカウントは別のログイン方法です。最初に登録した方法でログインしてください。';
    if(code==='auth/operation-not-allowed') return 'このログイン方法がFirebase側で有効になっていません。Firebase Consoleでメール/パスワード認証を有効にしてください。';
    if(code==='auth/invalid-email') return 'メールアドレスの形式を確認してください。';
    if(code==='auth/missing-password') return 'パスワードを入力してください。';
    if(code==='auth/weak-password') return 'パスワードは6文字以上で設定してください。';
    if(code==='auth/email-already-in-use') return 'このメールアドレスは登録済みです。ログインをお試しください。';
    if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found') return 'メールアドレスまたはパスワードが正しくありません。';
    if(code==='auth/too-many-requests') return '試行回数が多すぎます。しばらく待ってから再度お試しください。';
    return '認証に失敗しました。入力内容とFirebaseの認証設定を確認してください。';
  }
  function setAuthError(text){
    const a=document.getElementById('authError'); if(a) a.textContent=text||'';
    const b=document.getElementById('profileSaveError'); if(b) b.textContent=text||'';
  }
  function openSiteMenu(){
    const panel=document.getElementById('siteMenuPanel'),back=document.getElementById('siteMenuBackdrop'),btn=document.getElementById('siteMenuBtn');
    if(!panel||!back)return;
    panel.classList.add('active'); back.classList.add('active'); if(btn) btn.setAttribute('aria-expanded','true');
    updateSiteAccountButton();
  }
  function closeSiteMenu(){
    document.getElementById('siteMenuPanel')?.classList.remove('active');
    document.getElementById('siteMenuBackdrop')?.classList.remove('active');
    document.getElementById('siteMenuBtn')?.setAttribute('aria-expanded','false');
  }
  function toggleSiteMenu(event){
    event?.stopPropagation();
    const panel=document.getElementById('siteMenuPanel');
    if(panel?.classList.contains('active')) closeSiteMenu(); else openSiteMenu();
  }
  function updateSiteAccountButton(){
    const btn=document.getElementById('siteAccountBtn'); if(!btn)return;
    if(currentAuthUser){
      const name=String(currentUserProfile?.name||currentAuthUser.displayName||'ユーザー').trim();
      btn.textContent=`ユーザー情報（${name}）`;
    }else btn.textContent='ログイン';
  }
  function openAccountFromMenu(){
    closeSiteMenu();
    openAuthPanel();
  }
  function openAuthPanel(){
    const p=document.getElementById('authPanel'),b=document.getElementById('authBackdrop');
    if(!p||!b)return;
    setAuthError('');
    p.classList.add('active'); b.classList.add('active');
    renderAuthPanel();
  }
  function closeAuthPanel(){
    document.getElementById('authPanel')?.classList.remove('active');
    document.getElementById('authBackdrop')?.classList.remove('active');
  }
  function renderAuthPanel(){
    const title=document.getElementById('authPanelTitle'),login=document.getElementById('loginChoices'),form=document.getElementById('userProfileForm');
    if(currentAuthUser){
      if(title) title.textContent='ユーザー情報';
      if(login) login.hidden=true;
      if(form){
        form.hidden=false;
        const name=String(currentUserProfile?.name||currentAuthUser.displayName||'');
        const id=String(currentUserProfile?.id||'');
        const ni=document.getElementById('profileNameInput'),ii=document.getElementById('profileIdInput');
        if(ni && document.activeElement!==ni) ni.value=name;
        if(ii && document.activeElement!==ii) ii.value=id;
        const account=document.getElementById('userProfileAccount');
        if(account){const provider=currentAuthUser.providerData?.[0]?.providerId||'';const label=provider==='password'?'メールアドレス':provider==='twitter.com'?'Twitter':'Google';account.textContent=`${label}でログイン中${currentAuthUser.email?'（'+currentAuthUser.email+'）':''}`;}
      }
    }else{
      if(title) title.textContent='ログイン';
      if(login) login.hidden=false;
      if(form) form.hidden=true;
    }
  }
  async function loadUserProfile(user){
    if(!user || !firebaseAuth) return null;
    try{
      const db=firebaseDatabase();
      if(!db) return null;
      const snap=await db.ref(USER_PROFILE_ROOT).child(user.uid).once('value');
      const raw=snap.val();
      if(raw&&typeof raw==='object') return {uid:user.uid,name:String(raw.n??raw.name??'').trim(),id:String(raw.i??raw.id??'').trim()};
    }catch(e){ console.warn('ユーザー情報読込失敗',e); }
    return null;
  }
  function makeDefaultUserId(user){
    const tail=String(user?.uid||'').replace(/[^A-Za-z0-9]/g,'').slice(-8) || Math.random().toString(36).slice(2,10);
    return tail;
  }
  async function ensureUserProfile(user){
    if(!user){ profileRegistered=false; return null; }
    const existing=await loadUserProfile(user);
    if(existing?.name && existing?.id){ profileRegistered=true; currentUserProfile=existing; return existing; }
    profileRegistered=false;
    currentUserProfile={uid:user.uid,name:existing?.name||String(user.displayName||'').trim()||'',id:existing?.id||makeDefaultUserId(user)};
    return currentUserProfile;
  }
  async function claimUniqueUserKey(ref,uid){
    let conflict=false;
    const result=await ref.transaction(current=>{
      if(current===null || current===uid) return uid;
      conflict=true; return;
    });
    return {ok:result.committed&&!conflict};
  }
  async function releaseUserKey(ref,uid){
    try{
      await ref.transaction(current=>current===uid?null:current);
    }catch(e){ console.warn('ユーザー索引解除失敗',e); }
  }
  async function saveUserProfile(){
    const user=currentAuthUser, db=firebaseDatabase();
    const err=document.getElementById('profileSaveError'); if(err) err.textContent='';
    if(!user||!db){ if(err)err.textContent='ログイン情報またはFirebase接続が確認できません。'; return; }
    const name=String(document.getElementById('profileNameInput')?.value||'').trim();
    const id=String(document.getElementById('profileIdInput')?.value||'').trim();
    if(!name){if(err)err.textContent='登録名を入力してください。';return;}
    if(!id){if(err)err.textContent='IDを入力してください。';return;}
    if(name.length>30||id.length>30){if(err)err.textContent='登録名とIDは30文字以内で入力してください。';return;}
    if(/[\u0000-\u001F\u007F]/.test(name+id)){if(err)err.textContent='登録名・IDに使用できない文字が含まれています。';return;}
    const oldName=String(currentUserProfile?.name||'').trim();
    const oldId=String(currentUserProfile?.id||'').trim();
    const nameChanged=safeUserKey(name)!==safeUserKey(oldName);
    const idChanged=safeUserKey(id)!==safeUserKey(oldId);
    const claimed=[];
    try{
      if(nameChanged){
        const r=await claimUniqueUserKey(db.ref(USER_NAME_INDEX_ROOT).child(safeUserKey(name)),user.uid);
        if(!r.ok){if(err)err.textContent='その登録名はすでに使用されています。';return;}
        claimed.push({type:'name',key:name});
      }
      if(idChanged){
        const r=await claimUniqueUserKey(db.ref(USER_ID_INDEX_ROOT).child(safeUserKey(id)),user.uid);
        if(!r.ok){
          if(nameChanged) await releaseUserKey(db.ref(USER_NAME_INDEX_ROOT).child(safeUserKey(name)),user.uid);
          if(err)err.textContent='そのIDはすでに使用されています。';
          return;
        }
        claimed.push({type:'id',key:id});
      }
      // プロフィール本体は必要な2項目だけを保存して容量を抑える。UIDは親キーで保持。
      const profile={uid:user.uid,name,id};
      const compactProfile={n:name,i:id};
      const updates={};
      updates[`${USER_PROFILE_ROOT}/${user.uid}`]=compactProfile;
      if(nameChanged && oldName) updates[`${USER_NAME_INDEX_ROOT}/${safeUserKey(oldName)}`]=null;
      updates[`${USER_NAME_INDEX_ROOT}/${safeUserKey(name)}`]=user.uid;
      if(idChanged && oldId) updates[`${USER_ID_INDEX_ROOT}/${safeUserKey(oldId)}`]=null;
      updates[`${USER_ID_INDEX_ROOT}/${safeUserKey(id)}`]=user.uid;
      await db.ref().update(updates);
      currentUserProfile=profile;
      profileRegistered=true;
      updateSiteAccountButton();
      renderAuthPanel();
      if(currentTrainNo&&!isEditMode) updateSheetContent();
      syncStatus('ユーザー情報を保存しました');
    }catch(e){
      console.error('ユーザー情報保存失敗',e);
      if(nameChanged) await releaseUserKey(db.ref(USER_NAME_INDEX_ROOT).child(safeUserKey(name)),user.uid);
      if(idChanged) await releaseUserKey(db.ref(USER_ID_INDEX_ROOT).child(safeUserKey(id)),user.uid);
      if(err)err.textContent='ユーザー情報の保存に失敗しました。';
    }
  }
  async function signInWithGoogle(){
    if(!firebaseAuth){setAuthError('Firebase Authenticationが初期化されていません。ページを再読み込みしてください。');return;}
    const protocol=String(window.location?.protocol||'');
    if(!['http:','https:','chrome-extension:'].includes(protocol)){
      setAuthError('GoogleログインはWeb公開したページ（http/https）で利用できます。HTMLファイルを直接開いた状態（file://）では利用できません。');
      return;
    }
    try{
      window.localStorage?.setItem('__firebase_auth_check','1');
      window.localStorage?.removeItem('__firebase_auth_check');
    }catch(e){
      setAuthError('ブラウザのWebストレージが無効になっています。Cookie・サイトデータを許可してから再度お試しください。');
      return;
    }
    setAuthError('');
    try{ await firebaseAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ console.error('Googleログイン失敗',e); setAuthError(authErrorMessage(e)); }
  }
  function emailAuthInputs(){
    const email=String(document.getElementById('authEmailInput')?.value||'').trim();
    const password=String(document.getElementById('authPasswordInput')?.value||'');
    if(!email){setAuthError('メールアドレスを入力してください。');return null;}
    if(!password){setAuthError('パスワードを入力してください。');return null;}
    if(password.length<6){setAuthError('パスワードは6文字以上で入力してください。');return null;}
    if(!firebaseAuth){setAuthError('Firebase Authenticationが初期化されていません。ページを再読み込みしてください。');return null;}
    return {email,password};
  }
  async function signInWithEmail(){
    const values=emailAuthInputs();if(!values)return;
    setAuthError('');
    try{await firebaseAuth.signInWithEmailAndPassword(values.email,values.password);}
    catch(e){console.error('メールログイン失敗',e);setAuthError(authErrorMessage(e));}
  }
  async function createEmailAccount(){
    const values=emailAuthInputs();if(!values)return;
    setAuthError('');
    try{await firebaseAuth.createUserWithEmailAndPassword(values.email,values.password);}
    catch(e){console.error('メールアカウント登録失敗',e);setAuthError(authErrorMessage(e));}
  }
  async function sendPasswordReset(){
    const email=String(document.getElementById('authEmailInput')?.value||'').trim();
    if(!email){setAuthError('パスワード再設定メールを送るメールアドレスを入力してください。');return;}
    if(!firebaseAuth){setAuthError('Firebase Authenticationが初期化されていません。');return;}
    setAuthError('');
    try{await firebaseAuth.sendPasswordResetEmail(email);setAuthError('パスワード再設定メールを送信しました。受信トレイをご確認ください。');}
    catch(e){console.error('パスワード再設定メール送信失敗',e);setAuthError(authErrorMessage(e));}
  }

  async function logoutUser(){
    if(!firebaseAuth)return;
    try{ await firebaseAuth.signOut(); closeAuthPanel(); updateSiteAccountButton(); }
    catch(e){ setAuthError('ログアウトに失敗しました。'); }
  }
  window.initFirebaseAuth=function(app){
    if(!window.firebase?.auth || !app) return;
    try{
      if(firebaseAuth && firebaseAuth.app===app){ return; }
      firebaseAuth=firebase.auth(app);
      firebaseAuth.onAuthStateChanged(async user=>{
        currentAuthUser=user||null;
        authStateReady=true;
        if(user){
          currentUserProfile=await ensureUserProfile(user);
        }else{
          currentUserProfile=null;
          profileRegistered=false;
          // ログアウト直後に編成入力中だった場合は強制的に閲覧モードへ戻す。
          if(isEditMode){
            isEditMode=false;
            document.getElementById('bottomSheet')?.classList.remove('editing');
          }
        }
        updateSiteAccountButton();
        if(user && !profileRegistered){
          setTimeout(()=>openAuthPanel(),0);
        }
        if(document.getElementById('authPanel')?.classList.contains('active')) renderAuthPanel();
        if(currentTrainNo&&!isEditMode) updateSheetContent();
      });
    }catch(e){ console.warn('Firebase Authentication初期化失敗',e); }
  };
  window.toggleSiteMenu=toggleSiteMenu;
  window.closeSiteMenu=closeSiteMenu;
  window.openAccountFromMenu=openAccountFromMenu;
  window.openAuthPanel=openAuthPanel;
  window.closeAuthPanel=closeAuthPanel;
  window.signInWithGoogle=signInWithGoogle;
  window.signInWithEmail=signInWithEmail;
  window.createEmailAccount=createEmailAccount;
  window.sendPasswordReset=sendPasswordReset;
  window.saveUserProfile=saveUserProfile;
  window.logoutUser=logoutUser;

  // ページ起動時のinitFirebase()がこのIIFEより前に実行されても、
  // Authenticationの初期化を取りこぼさないよう、定義直後に既存appへ接続する。
  try{
    if(typeof firebaseApp!=='undefined' && firebaseApp && window.firebase?.auth){
      window.initFirebaseAuth(firebaseApp);
    }
  }catch(e){
    console.warn('Firebase Authentication自動初期化失敗',e);
  }

  /* recordSelection は上のコンパクト保存版を使用する。 */

  /* 単一編成選択APIも3スロット方式と共通の保存処理に統一。 */
  selectFormation=async function(formId){
    return saveFormationAtSlot(0,formId);
  };

  /* 駅時刻表の編成欄も + 順をそのまま前寄り→後寄りで表示。 */
  stationTimetableFormationHTML=function(train){
    const ids=formationIds(registeredFormationForTrain(train)||train?.formation||'');
    if(!ids.length) return '<span class="station-timetable-formation">—</span>';
    return `<span class="station-timetable-formation">${ids.map(id=>`<span class="station-timetable-formation-line">${esc(selectionDisplayObject(id)?.name||id)}</span>`).join('')}</span>`;
  };

  /* 全列車画像取得系の旧呼び出しを複数編成の前寄り画像へ寄せる。 */
  trainImageFor= imageForTrain;

  window.addEventListener('resize',()=>{
    const st=formationDropdownState;
    if(st?.el?.classList.contains('open') && st.trigger) positionHiroDropdown(st.el,st.trigger);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      const st=formationDropdownState;
      if(st?.el?.classList.contains('open') && st.trigger) positionHiroDropdown(st.el,st.trigger);
    });
  }
  document.addEventListener('pointerdown',event=>{
    const st=formationDropdownState;
    if(!st) return;
    if(st.el.contains(event.target) || st.trigger?.contains(event.target)) return;
    restoreHiroDropdown();
  });

  const style=document.createElement('style');
  style.textContent=`
    .hiro-formation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;}
    .hiro-formation-grid.count-1{grid-template-columns:minmax(0,1fr);}.hiro-formation-grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr));}
    .hiro-formation-slot{position:relative;min-width:0;}
    .hiro-formation-trigger{width:100%;min-width:0;color:#444 !important;border-color:var(--corporate-title-color,#808080) !important;}
    .hiro-formation-trigger-inner{display:flex;align-items:center;gap:10px;min-width:0;}
    .hiro-formation-trigger-inner .option-img{width:auto;height:70px;flex:0 0 auto;}
    .hiro-formation-trigger-inner span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#444 !important;}
    .hiro-formation-options{display:none;position:fixed !important;right:auto !important;bottom:auto !important;margin:0 !important;z-index:110 !important;pointer-events:auto !important;}
    .hiro-formation-options.open{display:block !important;}
    .hiro-formation-display-line{display:inline-block;}
    .formation-login-required{font-size:.9rem;color:#666;font-weight:700;}
    @media(max-width:700px){.hiro-formation-grid{grid-template-columns:1fr;}}
  `;
  document.head.appendChild(style);
})();
</script>

<script>
/* ===== 権限・公開路線・管理人タグ =====
   公開/非公開と路線管理人は各路線の ROUTE_REGISTRY.<route>.access に記載。
   例: access:{public:false,routeAdmins:['UserID1','UserID2']}
*/
(function(){
  const ADMIN_ID='Minamikaze';
  const USER_ROOT='運用/ユーザー';

  function normalizeId(v){ return String(v||'').trim(); }
  function routeAccess(routeName){
    return ROUTE_REGISTRY?.[normalizeId(routeName)]?.access || {public:false,routeAdmins:[]};
  }
  function routeManagerIds(routeName){
    const ids=routeAccess(routeName).routeAdmins;
    return Array.isArray(ids)?ids.map(normalizeId).filter(Boolean):[];
  }
  function isAdminUser(){ return normalizeId(currentUserProfile?.id)===ADMIN_ID; }
  function isRouteAdminFor(routeName){
    const id=normalizeId(currentUserProfile?.id);
    return !!id && routeManagerIds(routeName).includes(id);
  }
  function canViewRoute(routeName){
    const route=typeof routeNameFromId==='function' ? routeNameFromId(routeName) : normalizeId(routeName);
    if(!route || !ROUTE_REGISTRY?.[route]) return false;
    if(isAdminUser()) return true;
    const access=routeAccess(route);
    if(!!access.public) return true;
    if(!authStateReady || !currentAuthUser) return false;
    return isRouteAdminFor(route);
  }
  window.appCanViewRoute=canViewRoute;
  window.currentPermissionCodeForRoute=function(routeName){
    const route=typeof routeNameFromId==='function' ? routeNameFromId(routeName) : normalizeId(routeName);
    if(isAdminUser()) return 'a';
    return isRouteAdminFor(route)?'l':'';
  };

  function roleLabel(code){ return code==='a'?'管理人':code==='l'?'路線管理人':''; }
  function roleTag(code){
    const label=roleLabel(code);
    return label?`<span class="permission-tag permission-${code}">${escapeAttr(label)}</span>`:'';
  }
  window.routeRoleTagForCurrentUser=function(routeName=activeRouteName){
    return roleTag(window.currentPermissionCodeForRoute?.(routeName)||'');
  };

  function updateProfileRoleTag(){
    const tag=document.getElementById('profileRoleTag');
    const code=window.currentPermissionCodeForRoute?.(activeRouteName)||'';
    if(tag){ tag.outerHTML=`<span id="profileRoleTag" class="permission-tag permission-${code}"${code?'':' style="display:none"'}>${escapeAttr(roleLabel(code))}</span>`; }
    const info=document.getElementById('profilePermissionInfo');
    if(info){
      if(isAdminUser()) info.textContent='権限：管理人（全路線）';
      else if(isRouteAdminFor(activeRouteName)) info.textContent=`権限：路線管理人（${normalizeId(activeRouteName)}）`;
      else if(ROUTE_REGISTRY?.[activeRouteName]) info.textContent='権限：一般利用者';
      else info.textContent='';
    }
  }

  function ensureProfileRoleUI(){
    const input=document.getElementById('profileNameInput');
    if(input&&!document.getElementById('profileRoleTag')){
      const row=document.createElement('div'); row.className='profile-name-input-row';
      input.parentNode.insertBefore(row,input); row.appendChild(input);
      const tag=document.createElement('span'); tag.id='profileRoleTag'; tag.className='permission-tag'; tag.style.display='none';
      row.appendChild(tag);
    }
    const form=document.getElementById('userProfileForm');
    if(form&&!document.getElementById('profilePermissionInfo')){
      const info=document.createElement('div'); info.id='profilePermissionInfo'; info.className='profile-permission-info';
      const idInput=document.getElementById('profileIdInput');
      (idInput?.closest('.user-profile-field')||form).insertAdjacentElement('afterend',info);
    }
    updateProfileRoleTag();
  }

  function updateRegionNavAccess(){
    // 下部の地域ボタン自体は残す。地域を開いた時に非公開路線だけを除外する。
    document.querySelectorAll('#regionNav button[data-region]').forEach(btn=>{ btn.hidden=false; });
    syncRegionNavLayout();
  }
  window.updateRegionNavAccess=updateRegionNavAccess;

  const originalOpenRegionSheet=window.openRegionSheet;
  if(originalOpenRegionSheet){
    window.openRegionSheet=function(region){
      if(String(region)==='利用規約') return originalOpenRegionSheet(region);
      const defs=REGION_DEFINITIONS[String(region)]||[];
      const saved=defs.slice();
      defs.splice(0,defs.length,...saved.map(c=>({...c,routes:(c.routes||[]).filter(r=>canViewRoute(r.name))})).filter(c=>c.routes.length));
      try{ return originalOpenRegionSheet(region); }
      finally{ defs.splice(0,defs.length,...saved); }
    };
  }

  const originalSelectRoute=window.selectRoute;
  if(originalSelectRoute){
    window.selectRoute=async function(routeName){
      if(!canViewRoute(routeName)) return;
      return originalSelectRoute(routeName);
    };
  }

  window.formatFormationUpdatedAtHtml=function(trainNo){
    const text=typeof formatFormationUpdatedAt==='function'?formatFormationUpdatedAt(trainNo):'';
    if(!text) return '';
    const train=(currentTrainSnapshot&&String(currentTrainSnapshot.no||'')===String(trainNo||''))?currentTrainSnapshot:trainForCurrentDay(String(trainNo||''),currentTrainSnapshot?.direction||null);
    const entry=typeof formationStorageEntryForTrain==='function'?formationStorageEntryForTrain(train):null;
    const code=String(entry?.r||'').trim();
    const showCode=(code==='a'||code==='l')?code:'';
    const at=text.indexOf(' @');
    const time=at>=0?text.slice(0,at):text;
    const author=at>=0?text.slice(at+1).replace(/^@+/, '').trim():'';
    return `<span class="formation-updated-time">${escapeAttr(time)}</span>${author?`<br class="formation-updated-author-break"><span class="formation-updated-author">${escapeAttr('@'+author)}</span>`:''}${roleTag(showCode)}`;
  };

  async function loadAccessProfile(user){
    if(!user) return;
    try{
      const db=firebaseDatabase(); if(!db) return;
      const snap=await db.ref(USER_ROOT).child(user.uid).once('value');
      const raw=snap.val()||{};
      currentUserProfile={
        ...(currentUserProfile||{uid:user.uid}),
        uid:user.uid,
        name:String(raw.n??raw.name??currentUserProfile?.name??'').trim(),
        id:String(raw.i??raw.id??currentUserProfile?.id??'').trim()
      };
    }catch(e){}
  }

  function refreshAccessUI(){
    ensureProfileRoleUI();
    // 旧バージョンの路線管理人設定UIが残っていれば除去。権限はプログラム側で設定する。
    document.getElementById('routeAdminManager')?.remove();
    updateProfileRoleTag();
    updateRegionNavAccess();
    if(currentTrainNo && !isEditMode && typeof updateSheetContent==='function') updateSheetContent();
  }

  let accessListenerBound=false;
  function bindAuthListener(){
    if(accessListenerBound||!window.firebase||!firebaseAuth?.onAuthStateChanged) return false;
    accessListenerBound=true;
    firebaseAuth.onAuthStateChanged(async user=>{
      if(user) await loadAccessProfile(user);
      refreshAccessUI();
      if(activeRouteName && !canViewRoute(activeRouteName)){
        const fallback=Object.keys(ROUTE_REGISTRY).find(name=>canViewRoute(name));
        if(fallback){
          try{ await originalSelectRoute(fallback); }catch(e){}
        }else{
          activeRouteName=''; activeRouteMeta=null; activeJson=null;
        }
      }
    });
    return true;
  }
  const timer=setInterval(()=>{ if(bindAuthListener()) clearInterval(timer); },50);
  setTimeout(()=>clearInterval(timer),10000);
  window.addEventListener('load',()=>{ ensureProfileRoleUI(); refreshAccessUI(); bindAuthListener(); });
})();
</script>

<script id="circular-route-script">
(function(){
  const CIRCULAR_LAYOUT_CACHE=new Map();
  function circularLayout(){
    const raw=activeJson?.circularLayout;
    if(!raw||!Array.isArray(raw.left)||!Array.isArray(raw.right)) return null;
    const left=raw.left.map(String), right=raw.right.map(String);
    const key=JSON.stringify([left,right]);
    if(CIRCULAR_LAYOUT_CACHE.has(key)) return CIRCULAR_LAYOUT_CACHE.get(key);
    const info={left,right,leftIndex:new Map(),rightIndex:new Map(),edges:new Map()};
    left.forEach((name,i)=>info.leftIndex.set(name,i));
    right.forEach((name,i)=>info.rightIndex.set(name,i));
    function addEdges(side,arr){
      for(let i=0;i<arr.length-1;i++){
        const a=arr[i],b=arr[i+1];
        info.edges.set(operationInfoUndirectedKey(a,b),{side,indexA:i,indexB:i+1,a,b,bridge:false});
      }
    }
    addEdges('left',left); addEdges('right',right);
    // 上端：大阪⇄天満、下端：新今宮⇄天王寺を横線で接続。
    info.edges.set(operationInfoUndirectedKey(left[0],right[0]),{bridge:true,sideA:'left',sideB:'right',indexA:0,indexB:0,a:left[0],b:right[0]});
    info.edges.set(operationInfoUndirectedKey(left[left.length-1],right[right.length-1]),{bridge:true,sideA:'left',sideB:'right',indexA:left.length-1,indexB:right.length-1,a:left[left.length-1],b:right[right.length-1]});
    CIRCULAR_LAYOUT_CACHE.set(key,info);
    return info;
  }
  function circularStageMetrics(){
    const stage=document.getElementById('circularStage');
    if(!stage) return {stage:null,width:1920,height:3140,leftStep:302,rightStep:302,endPadding:220,topCenter:220,bottomCenter:2920};
    const width=Number(stage.offsetWidth)||1920;
    const height=Number(stage.offsetHeight)||3140;
    const layout=circularLayout();
    const leftCount=Math.max(1,layout?.left?.length||11);
    const rightCount=Math.max(1,layout?.right?.length||10);
    const endPadding=220;
    const topCenter=endPadding;
    const bottomCenter=Math.max(topCenter,height-endPadding);
    const span=Math.max(0,bottomCenter-topCenter);
    const leftStep=leftCount>1?span/(leftCount-1):0;
    const rightStep=rightCount>1?span/(rightCount-1):0;
    return {stage,width,height,leftStep,rightStep,endPadding,topCenter,bottomCenter};
  }
  function circularCenterY(side,index,metrics){
    return metrics.topCenter+(side==='left'?metrics.leftStep:metrics.rightStep)*Number(index||0);
  }
  function circularEdgeColor(a,b){
    const colors=activeSegmentColors(String(a||''),String(b||''));
    return String(colors?.[0]||'#666');
  }
  function applyCircularStationColors(badge,side,index){
    const layout=circularLayout(); if(!layout||!badge) return;
    const arr=layout[side]||[];
    const stationName=String(arr[index]||'');
    // 停車駅案内・方面タブと完全に同じ駅ラベル色を使用する。
    const color=circularStationLabelDisplayColor(stationName)||'#666';
    badge.style.background='#fff';
    badge.style.setProperty('--station-label-bg',color);
    badge.style.setProperty('--station-en-text-color',stationEnglishTextColor(color));
    const en=badge.querySelector('.station-name-en');
    if(en){ en.style.background=color; en.style.color=stationEnglishTextColor(color); }
  }
  function makeCircularStationRow(stationName,side,index,metrics){
    const st=STATIONS.find(x=>String(x.nameJa)===String(stationName));
    if(!st) return null;
    const hiddenMap=activeJson?.circularHiddenStationLabels||{};
    const hidden=Array.isArray(hiddenMap?.[side]) && hiddenMap[side].map(String).includes(String(stationName));
    const row=document.createElement('div');
    row.className='station-row circular-station-row'+(hidden?' circular-hidden-station-label':'');
    if(hidden){
      row.dataset.stationId=st.id;
      row.style.top=`${circularCenterY(side,index,metrics)}px`;
      row.setAttribute('aria-hidden','true');
      return row;
    }
    row.dataset.stationId=st.id;
    row.style.top=`${circularCenterY(side,index,metrics)}px`;
    const badge=document.createElement('div');
    badge.className='station-badge';
    badge.innerHTML=`<div class="station-name-ja">${esc(st.nameJa)}</div><div class="station-name-en">${esc(st.nameEn)}</div>`;
    badge.setAttribute('role','button'); badge.tabIndex=0;
    badge.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();openStationSheet(st.id);});
    badge.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();openStationSheet(st.id);}});
    const ja=badge.querySelector('.station-name-ja');
    if(ja){
      const len=[...ja.textContent.trim()].length; let ls='0';
      if(len<=2)ls='.9em'; else if(len===3)ls='.3em'; else ls='.0em';
      ja.style.letterSpacing=ls; ja.style.paddingLeft=ls;
    }
    applyCircularStationColors(badge,side,index);
    row.appendChild(badge);
    return row;
  }
  function renderCircularLine(){
    // 環状線専用表示の線色はJSON/路線設定の大阪環状線色を使用。
    if(typeof TRAIN_ICON_CACHE!=='undefined') TRAIN_ICON_CACHE.clear();
    if(typeof TRAIN_LAYOUT_CACHE!=='undefined') TRAIN_LAYOUT_CACHE={container:null,rowCenters:null,rowCount:0};
    const container=document.getElementById('lineContainer'); if(!container) return;
    const layout=circularLayout();
    if(!layout) return;
    const leftCount=Math.max(1,layout.left.length), rightCount=Math.max(1,layout.right.length);
    const endPadding=220;
    const stageHeight=270*Math.max(leftCount,rightCount)+endPadding*2;
    container.innerHTML=`<div class="operation-info-layer" id="operationInfoLayer"></div><div class="circular-stage" id="circularStage"><div class="circular-column left" id="circularLeft"></div><div class="circular-column right" id="circularRight"></div><div class="circular-bridge circular-bridge-top"></div><div class="circular-bridge circular-bridge-bottom"></div><div class="rail-line" id="railLine"></div></div><div class="moving-train-layer" id="movingTrainLayer"></div><div class="operation-info-label-layer" id="operationInfoLabelLayer"></div>`;
    const stage=document.getElementById('circularStage');
    stage.style.height=`${stageHeight}px`; stage.style.minHeight=`${stageHeight}px`;
    // 上端は大阪環状線色、下端（新今宮⇄天王寺）は大和路線色を明示。
    // routeColor の上書きで大和路線色が赤へ戻ることを防ぐ。
    const loopLineColor=String(lineDefByName('大阪環状線')?.color||'#ee354f');
    const yamatoLineColor=String(lineDefByName('大和路線')?.color||'#02ad73');
    stage.style.setProperty('--circular-top-color',loopLineColor);
    stage.style.setProperty('--circular-bottom-color',yamatoLineColor);
    const metrics=circularStageMetrics();
    const left=document.getElementById('circularLeft'),right=document.getElementById('circularRight');
    layout.left.forEach((name,i)=>{
      const row=makeCircularStationRow(name,'left',i,metrics);if(row)left.appendChild(row);
    });
    layout.right.forEach((name,i)=>{
      const row=makeCircularStationRow(name,'right',i,metrics);if(row)right.appendChild(row);
    });
    renderCircularRailLineSegments();
    renderCircularTrainPositions();
    renderOperationInfoZones();
  }
  function renderCircularRailLineSegments(){
    const rail=document.getElementById('railLine'),layout=circularLayout(),stage=document.getElementById('circularStage');
    if(!rail||!layout||!stage) return;
    const metrics=circularStageMetrics();
    rail.innerHTML=''; rail.className='rail-line circular-rail-line';
    function drawColumn(side,arr){
      const col=document.createElement('div'); col.className=`circular-column-track ${side}`; col.style.cssText=`position:absolute;inset:0;pointer-events:none;`;
      for(let i=0;i<arr.length-1;i++){
        const seg=document.createElement('div'); seg.className='circular-track-segment';
        const y1=circularCenterY(side,i,metrics),y2=circularCenterY(side,i+1,metrics);
        seg.style.left=side==='left'?'25%':'75%'; seg.style.top=`${y1}px`; seg.style.height=`${Math.max(0,y2-y1)}px`;
        seg.style.background=circularEdgeColor(arr[i],arr[i+1]);
        col.appendChild(seg);
      }
      rail.appendChild(col);
    }
    drawColumn('left',layout.left); drawColumn('right',layout.right);
  }
  function circularEdgeForPair(a,b){
    const layout=circularLayout(); if(!layout) return null;
    return layout.edges.get(operationInfoUndirectedKey(String(a||''),String(b||'')))||null;
  }
  function circularSideAtStation(station,preferredSide){
    const layout=circularLayout(); if(!layout) return preferredSide||'left';
    if(preferredSide && layout[preferredSide]?.includes(station)) return preferredSide;
    if(layout.left.includes(station)) return 'left';
    if(layout.right.includes(station)) return 'right';
    return preferredSide||'left';
  }
  function isSpecialCircularBridgePair(a,b){
    const pair=[String(a||''),String(b||'')].sort().join('|');
    return pair==='大阪|天満' || pair==='新今宮|天王寺';
  }
  function circularTrainPosition(t,minutes){
    const layout=circularLayout(); if(!layout||!t) return null;
    const metrics=circularStageMetrics();
    const stageWidth=Number(metrics?.width)||0;
    const stops=normalizeLineStopTimes(t.stops||[]); if(!stops.length) return null;
    const circularOnly=!!isCircularTrain(t);

    // 大阪⇄天満／新今宮⇄天王寺の2区間だけ、物理的な橋区間として特別扱いする。
    // 列車種別や「環状運転」フラグには依存しない。
    // 始点：発車時刻から1分間だけ始点駅に固定表示。
    // その後：次駅の到着時刻まで完全非表示。
    // 終点：次駅の到着時刻ちょうどに終点駅へ再表示。
    function bridgeStationSide(name,index){
      const prevEdge=index>0 ? circularEdgeForPair(stops[index-1].station,name) : null;
      const nextEdge=index<stops.length-1 ? circularEdgeForPair(name,stops[index+1].station) : null;
      if(nextEdge?.bridge){
        return name===String(nextEdge.a||'') ? nextEdge.sideA : nextEdge.sideB;
      }
      if(prevEdge?.bridge){
        return name===String(prevEdge.a||'') ? prevEdge.sideA : prevEdge.sideB;
      }
      if(layout.left?.includes(name)) return 'left';
      if(layout.right?.includes(name)) return 'right';
      return t.direction==='down'?'right':'left';
    }

    // まず2つの特別橋区間だけを時刻ベースで判定する。
    // これを通常の駅間走行処理より先に置くことで、橋の上をアイコンが移動することを完全に防ぐ。
    for(let i=0;i<stops.length-1;i++){
      const from=String(stops[i]?.station||'');
      const to=String(stops[i+1]?.station||'');
      if(!isSpecialCircularBridgePair(from,to)) continue;
      const departure=Number(stops[i]._departure);
      const arrivalNext=Number(stops[i+1]._arrival);
      if(!Number.isFinite(departure)||!Number.isFinite(arrivalNext)) continue;

      const fromSide=bridgeStationSide(from,i);
      const fromList=layout[fromSide]||[];
      const fromIndex=fromList.indexOf(from);
      const fromY=fromIndex>=0?circularCenterY(fromSide,fromIndex,metrics):null;

      // 発車時刻から1分後になるまでは始点駅に固定。
      if(minutes>=departure && minutes<departure+1 && fromIndex>=0){
        return {
          side:fromSide,
          pos:fromIndex,
          y:fromY,
          visualTrain:t,
          mode:'special-bridge-start',
          baseTrain:t
        };
      }

      // 発車1分後～次駅到着時刻の直前は完全に消す。
      if(minutes>=departure+1 && minutes<arrivalNext){
        return null;
      }

      // 次駅の到着時刻ちょうどから終点駅に再表示。
      if(minutes>=arrivalNext){
        const toSide=bridgeStationSide(to,i+1);
        const toList=layout[toSide]||[];
        const toIndex=toList.indexOf(to);
        if(toIndex>=0){
          // 橋区間の終点駅では「到着時刻から1分間だけ」表示する。
          // 発車時刻まで表示し続けず、到着+1分で必ず消す。
          const showUntil=arrivalNext+1;
          if(minutes<showUntil){
            return {
              side:toSide,
              pos:toIndex,
              y:circularCenterY(toSide,toIndex,metrics),
              visualTrain:t,
              mode:'special-bridge-arrival',
              baseTrain:t
            };
          }
        }
      }
    }

    // 特別橋区間以外は従来どおりの駅間・駅停車処理。
    for(let i=0;i<stops.length;i++){
      const st=stops[i],name=String(st.station||'');
      const prevEdge=i>0 ? circularEdgeForPair(stops[i-1].station,name) : null;
      const nextEdge=i<stops.length-1 ? circularEdgeForPair(name,String(stops[i+1].station||'')) : null;
      const sidePrev=prevEdge?.side||null;
      const sideNext=nextEdge?.side||null;
      const side=sidePrev||sideNext||circularSideAtStation(name,t.direction==='down'?'right':'left');
      const arr=(layout[side]||[]);
      const idx=arr.indexOf(name);
      if(idx<0) continue;
      const stationY=circularCenterY(side,idx,metrics);

      // 特別橋区間を次に渡る場合は、橋上走行処理に入れない。
      if(i<stops.length-1 && isSpecialCircularBridgePair(name,stops[i+1].station)){
        continue;
      }

      // 通常の駅停車表示。
      // 終着駅は「到着時刻ちょうどに表示」し、到着から1分後まで駅上に保持する。
      if(i===stops.length-1){
        const terminalArrival=Number(st._arrival);
        if(Number.isFinite(terminalArrival) && minutes>=terminalArrival && minutes<terminalArrival+1){
          return {
            side,
            pos:idx,
            y:stationY,
            visualTrain:t,
            mode:'end-dwell',
            baseTrain:t
          };
        }
      }else{
        const a=Number(st._arrival)+0.25;
        const b=Number(st._departure)+0.75;
        if(Number.isFinite(a)&&Number.isFinite(b)&&minutes>=a&&minutes<b){
          return {
            side,
            pos:idx,
            y:stationY,
            visualTrain:t,
            mode:'station-dwell',
            baseTrain:t
          };
        }
      }

      if(i<stops.length-1){
        const edge=nextEdge;
        if(!edge||edge.bridge) continue;
        const departure=Number(st._departure);
        const arrivalNext=Number(stops[i+1]._arrival);
        if(!Number.isFinite(departure)||!Number.isFinite(arrivalNext)) continue;
        const na=departure+0.75;
        const isTerminalNext=i===stops.length-2;
        const nb=isTerminalNext?arrivalNext:arrivalNext+0.25;
        if(!Number.isFinite(na)||!Number.isFinite(nb)) continue;
        if(minutes>=na && (isTerminalNext?minutes<nb:minutes<=nb)){
          const fromIsA=String(name||'')===String(edge.a||'');
          const fromIndex=fromIsA?edge.indexA:edge.indexB;
          const toIndex=fromIsA?edge.indexB:edge.indexA;
          const ratio=Math.max(0,Math.min(1,nb===na?0:(minutes-na)/(nb-na)));
          const pos=fromIndex+(toIndex-fromIndex)*ratio;
          const y=circularCenterY(edge.side,pos,metrics);
          return {
            side:edge.side,
            pos,
            y,
            visualTrain:t,
            mode:'run',
            baseTrain:t,
            stageWidth
          };
        }
      }
    }
    return null;
  }
  function getCircularVisibleEntries(){
    const source=getDisplayedTrainSource(); const out=[];
    for(const train of source){
      const stops=normalizeLineStopTimes(train.stops||[]); if(!stops.length) continue;
      const first=stops[0],last=stops[stops.length-1];
      const firstDeparture=Number(first._departure);
      const lastArrival=Number(last._arrival);
      if(!Number.isFinite(firstDeparture)||!Number.isFinite(lastArrival)) continue;
      // 特別橋区間は「終点の到着時刻から1分間」も表示対象に含める。
      // 列車全体の終着がその駅だった場合でも、到着時刻ちょうどで
      // renderCircularTrainPositions() がアイコンを落とさないようにする。
      // 終着駅では到着時刻ちょうどから1分後まで表示対象にする。
      // 特別橋区間の到着駅も同じ扱いにする。
      let visibleUntil=lastArrival+1;
      for(let i=0;i<stops.length-1;i++){
        const from=String(stops[i]?.station||'');
        const to=String(stops[i+1]?.station||'');
        if(!isSpecialCircularBridgePair(from,to)) continue;
        const arrivalNext=Number(stops[i+1]?._arrival);
        if(Number.isFinite(arrivalNext)) visibleUntil=Math.max(visibleUntil,arrivalNext+1);
      }
      out.push({train,visibleFrom:firstDeparture,visibleUntil});
    }
    return out;
  }
  function circularDisplayTrainNo(t){
    if(!t||t.hideTrainNumber) return '';
    if(Array.isArray(t.noSequence)&&t.noSequence.length) return String(t.noSequence[0]);
    return String(t.no||'');
  }
  function renderCircularTrainPositions(){
    const uiScale=1, trainWidth=66*uiScale, imageWidth=60*uiScale;
    const layer=document.getElementById('movingTrainLayer');
    if(!layer) return;
    const now=currentMinutes();
    const metrics=circularStageMetrics();
    const entries=getCircularVisibleEntries();
    const visible=[]; const keep=new Set(); const occupied={left:[],right:[]};
    for(const entry of entries){
      // 次駅の到着時刻ちょうどを含め、特別橋区間の終点駅でその瞬間に再表示する。
      if(now<entry.visibleFrom || now>entry.visibleUntil) continue;
      const p=circularTrainPosition(entry.train,now); if(!p) continue;
      const displayTrain=p.visualTrain||entry.train;
      const signature=`${String(entry.train.no||'')}|${String(entry.train.direction||'')}`;
      visible.push({baseTrain:entry.train,visualTrain:displayTrain,info:p,signature}); keep.add(signature);
      occupied[p.side].push({t:displayTrain,pos:p.pos,baseTrain:entry.train,mode:p.mode,signature});
    }
    for(const [signature,entry] of TRAIN_ICON_CACHE){
      if(!keep.has(signature)){entry.el.remove();TRAIN_ICON_CACHE.delete(signature);}
    }
    const stageRect=metrics.stage?.getBoundingClientRect();
    const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
    const viewportTop=0,viewportBottom=window.innerHeight||document.documentElement.clientHeight||0;
    ['left','right'].forEach(side=>{
      occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
      const used=[];
      occupied[side].forEach(item=>{
        // 内回り・外回りは別の線路位置なので、お互いを「横並び」と判定しない。
        // 同方向・同一箇所で重なる場合だけ2列目以降へ退避する。
        const laneGroup=String(item.t?.direction||'')==='up'?'up':'down';
        let lane=0;
        while(used.some(u=>u.group===laneGroup&&Math.abs(u.pos-item.pos)<0.24&&u.lane===lane)) lane++;
        used.push({pos:item.pos,lane,group:laneGroup});
        const t=item.t; let entry=TRAIN_ICON_CACHE.get(item.signature); let el=entry?.el;
        if(entry) entry.currentTrain=t;
        const cls=trainVisualKind(t); const registeredFormation=registeredFormationForTrain(t);
        const formationId=registeredFormation||t.formation||'';
        const formationParts=formationId&&formationId!==INITIAL_FORMATION_SELECTION.id?formationDisplayParts(formationId):[];
        const imageUrl=imageForTrain(t); const displayNo=circularDisplayTrainNo(t); const labelText=trainLabelText(t);
        const contentKey=[displayNo,imageUrl,formationParts.join('\n'),cls,getMainLabelClass(t.type),labelText].join('|');
        const contentChanged=!entry||entry.contentKey!==contentKey;
        if(!el){
          el=document.createElement('div');el.className=`train-icon ${side}`;el.style.visibility='hidden';el.style.transition='none';layer.appendChild(el);
          entry={el,contentKey:'',layoutHeight:0,ready:false,currentTrain:t};
          el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();const ct=entry.currentTrain||t;openSheet(ct.no,false,ct.direction);});
          TRAIN_ICON_CACHE.set(item.signature,entry);
        }
        if(contentChanged){
          el.innerHTML=`${displayNo?`<span class="train-no">${esc(displayNo)}</span>`:''}<img src="${esc(imageUrl)}" alt="${esc(displayNo)}">${formationParts.length?`<span class="train-no train-formation">${formationParts.map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:''}<span class="train-label ${cls} ${getMainLabelClass(t.type)}" style="${typeBadgeInlineStyle(t,item.pos)}">${labelText}</span>`;
          entry.contentKey=contentKey;entry.layoutHeight=0;entry.ready=false;
        }
        const color=typeColorForTrain(t,item.pos);el.style.setProperty('--train-type-color',color);
        const trainLabelEl=el.querySelector('.train-label');
        if(trainLabelEl&&getMainLabelClass(t.type)==='route-normal'){trainLabelEl.style.background=color;trainLabelEl.style.color='#fff';}
        const stageWidth=metrics.width;
        // 横方向は「内回り／外回り」で線路の内外を決める。
        // 左右どちらの線路でも、線路中心からの距離は常に同じにする。
        // up=内回り / down=外回り。
        const colCenter=side==='left'?stageWidth*0.25:stageWidth*0.75;
        // 元ファイルと同じ横位置基準を使用する。
        // 元ファイルは列車アイコン幅66pxで、アイコン左端を中心線から340px外側に置いていたため、
        // アイコン中心は線路中心から307px離れる。環状線でもこの距離をそのまま使い、
        // 内回り・外回りだけ左右を入れ替えることで、線路からの距離を完全に揃える。
        const originalCenterOffset=340-(trainWidth/2);
        const originalLaneGap=20;
        const isInner=String(t?.direction||'')==='up';
        const lateralSign=side==='left'
          ? (isInner?1:-1)
          : (isInner?-1:1);
        const laneOffset=lateralSign*(originalCenterOffset + lane*(trainWidth+originalLaneGap));
        const trainLeft=Number.isFinite(Number(item.info?.xPercent))
          ? stageWidth*(Number(item.info.xPercent)/100)-(trainWidth/2)
          : colCenter-(trainWidth/2)+laneOffset;
        const y=Number.isFinite(Number(item.info?.y))?Number(item.info.y):circularCenterY(side,item.pos,metrics);
        const applyFinalCircularPosition=()=>{
          const img=el.querySelector('img');
          const noEl=el.querySelector('.train-no');
          const formationEl=el.querySelector('.train-formation');
          if(!img) return;
          const z=window.innerWidth<960?window.innerWidth/960:1;
          const imgRect=img.getBoundingClientRect();
          const noRect=noEl?.getBoundingClientRect();
          const formationRect=formationEl?.getBoundingClientRect();
          const actualImageWidth=(imgRect.width/z)||imageWidth;
          const imgHeight=(imgRect.height/z)||actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
          const noHeight=(noRect?.height/z)||12*uiScale*1.05;
          const formationHeight=(formationRect?.height/z)||0;
          const finalTop=y-(noHeight+imgHeight+formationHeight)/2;
          el.style.left=`${trainLeft}px`;
          el.style.right='auto';
          el.style.top=`${finalTop}px`;
          el.style.transform='none';
          el.style.setProperty('--lane-shift','0px');
          el.style.visibility='visible';
          entry.ready=true;
          entry.layoutHeight=el.getBoundingClientRect().height/z||48;
          if(stageRect){
            const visualY=stageRect.top+y*z;
            el.style.display=(visualY+80>=viewportTop&&visualY-80<=viewportBottom)?'flex':'none';
          }else{ el.style.display='flex'; }
        };
        const img=el.querySelector('img');
        if(img?.complete&&img.naturalWidth){
          applyFinalCircularPosition();
        }else if(img){
          el.style.visibility='hidden';
          img.addEventListener('load',applyFinalCircularPosition,{once:true});
        }else{
          applyFinalCircularPosition();
        }
      });
    });
  }

  window.__circularRouteHelpers={renderCircularLine,renderCircularRailLineSegments,renderCircularTrainPositions,circularTrainPosition,circularLayout};
})();
</script>
