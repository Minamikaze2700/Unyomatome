function getShortType(type, trainNo=''){
  const value=String(type||'');
  if(!value) return '';
  const routeMeta=activeRouteMeta||{};
  const direct=routeMeta.typeShortMap?.[value];
  if(direct!==undefined && direct!==null && String(direct).trim()) return String(direct);
  const jsonMaps=[activeJson?.typeShortMap,activeJson?.typeAbbreviations,activeJson?.route?.abbreviations?.types];
  for(const map of jsonMaps){
    if(!map) continue;
    if(!Array.isArray(map) && typeof map==='object' && Object.prototype.hasOwnProperty.call(map,value)){
      const result=map[value];
      if(result!==undefined && result!==null && String(result).trim()) return String(result);
    }
    if(Array.isArray(map)){
      const match=map.find(item=>String(item?.name??item?.type??item?.targetName??'').trim()===value);
      if(match){const result=match.value??match.abbr??match.short;if(result!==undefined&&result!==null&&String(result).trim())return String(result);}
    }
  }
  const jsonTypes=Array.isArray(activeJson?.types)?activeJson.types:[];
  const typeEntry=jsonTypes.find(item=>String(item?.name??item?.label??'').trim()===value);
  const directAbbr=String(typeEntry?.abbr??typeEntry?.abbreviation??typeEntry?.shortName??'').trim();
  if(directAbbr) return directAbbr;
  const abbreviationEntries=activeJson?.route?.abbreviations?.types;
  if(Array.isArray(abbreviationEntries)){
    const matched=abbreviationEntries.find(item=>String(item?.targetId??'')===String(typeEntry?.id??''));
    const result=String(matched?.value??matched?.abbr??'').trim();
    if(result) return result;
  }
  const rules=[
    ...(Array.isArray(routeMeta.typeShortRules)?routeMeta.typeShortRules:[]),
    ...(Array.isArray(activeJson?.typeShortRules)?activeJson.typeShortRules:[])
  ];
  for(const rule of rules){
    const containsAll=Array.isArray(rule.containsAll)?rule.containsAll:[];
    if(containsAll.length && !containsAll.every(x=>value.includes(String(x)))) continue;
    if(rule.contains && !value.includes(String(rule.contains))) continue;
    if(rule.trainNoSuffix && !String(trainNo||'').toUpperCase().endsWith(String(rule.trainNoSuffix).toUpperCase())) continue;
    if(rule.result!==undefined && String(rule.result).trim()) return String(rule.result);
  }
  if(value==='区間急行') return '区急';
  if(value==='各駅停車') return '各停';
  return value;
}
function getDetailType(type){
  const value=String(type||'');
  const routeMapped=activeRouteMeta?.typeDetailMap?.[value];
  if(routeMapped!==undefined) return String(routeMapped);
  const mapped=activeJson?.typeDetailMap?.[value];
  if(mapped!==undefined) return String(mapped);
  if(value==='各停') return '各駅停車';
  return value;
}
function naganoExpressCategoryFor(train,typeOverride='',trainNoOverride=''){
  const raw=train?.rawTrain||train||{};
  const type=String(typeOverride||train?.type||raw?.type||'').trim();
  if(!type.includes('特急')) return '';
  const isNagano=(activeRouteName==='長野電鉄長野線') || String(train?.lineKind||raw?.lineKind||'')==='nagano';
  if(!isNagano) return '';
  const saved=String(train?.expressCategory||raw?.expressCategory||'').trim();
  if(saved==='A特急'||saved==='B特急') return saved;
  const no=String(trainNoOverride||train?.no||raw?.no||'').trim().toUpperCase();
  if(no.endsWith('A')) return 'A特急';
  if(no.endsWith('B')) return 'B特急';
  if(type.includes('ゆけむりのんびり')) return 'A特急';
  return '';
}
function getOperationalTypeLabel(type,trainNo='',train=null){
  const value=String(type||'').trim();
  if(isShinanoMainRoute()){
    const source=train||{type:value,no:String(trainNo||'')};
    return getTrainTypeDisplayLabel({...source,type:value});
  }
  const category=naganoExpressCategoryFor(train||{type:value,no:String(trainNo||''),lineKind:activeRouteName==='長野電鉄長野線'?'nagano':''},value,trainNo);
  return category||getDetailType(value);
}
function displayTrainNo(train){ return (train && !train.hideTrainNumber) ? normalizeTrainNo(train.no) : ''; }
function getShortDest(dest){
  const value=String(dest||'').trim();
  if(!value) return '';
  // 従来の行先略称処理に戻し、現在の路線設定と読み込み済みJSONの両方を参照する。
  // JSON側に略称がない場合でも、路線設定の destinationAliases を適用できる。
  const aliasMaps=[
    activeRouteMeta?.destinationAliases,
    activeRouteMeta?.stationAliases,
    activeRouteMeta?.stationShortMap,
    activeRouteMeta?.stationAbbreviations,
    activeJson?.destinationAliases,
    activeJson?.stationAliases,
    activeJson?.stationShortMap,
    activeJson?.stationAbbreviations,
    activeJson?.route?.abbreviations?.destinations,
    activeJson?.route?.abbreviations?.stations
  ];
  for(const aliases of aliasMaps){
    if(aliases && typeof aliases==='object' && !Array.isArray(aliases) && Object.prototype.hasOwnProperty.call(aliases,value)){
      const short=String(aliases[value]??'').trim();
      if(short) return short;
    }
    if(Array.isArray(aliases)){
      const match=aliases.find(item=>String(item?.name??item?.station??'').trim()===value);
      const short=String(match?.value??match?.abbr??match?.short??'').trim();
      if(short) return short;
    }
  }
  return value;
}
function nthMondayDateKey(year,month,nth){
  const d=new Date(year,month-1,1);
  const offset=(8-d.getDay())%7;
  d.setDate(1+offset+(nth-1)*7);
  return todayKey(d);
}
function equinoxDateKey(year,isVernal){
  // 日本の春分・秋分日は将来の暦にも対応できるよう近似計算。
  // 1980～2099年程度で実用上十分な精度。
  const y=year-1980;
  const base=isVernal?20.8431:23.2488;
  const drift=0.242194;
  const day=Math.floor(base+drift*y-Math.floor(y/4));
  return `${year}-${isVernal?'03':'09'}-${String(day).padStart(2,'0')}`;
}
function getJapaneseNationalHolidays(year){
  const h=new Set();
  const add=(m,d)=>h.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);
  h.add(nthMondayDateKey(year,1,2));
  add(2,11);
  if(year>=2020) add(2,23);
  h.add(equinoxDateKey(year,true));
  add(4,29); add(5,3); add(5,4); add(5,5);
  h.add(nthMondayDateKey(year,7,3));
  add(8,11);
  h.add(nthMondayDateKey(year,9,3));
  h.add(equinoxDateKey(year,false));
  h.add(nthMondayDateKey(year,10,2));
  add(11,3); add(11,23);

  // 一時的な祝日移動など
  if(year===2019){ add(5,1); add(10,22); }
  if(year===2020){
    h.delete(`${year}-07-20`); add(7,23);
    h.delete(`${year}-10-12`); add(7,24);
  }
  if(year===2021){
    h.delete(`${year}-07-19`); add(7,22); add(7,23);
    h.delete(`${year}-08-11`); add(8,8);
    h.delete(`${year}-10-11`);
  }
  return h;
}
function getJapaneseHolidaySet(year){
  const national=getJapaneseNationalHolidays(year);
  const holidays=new Set(national);
  // 日曜祝日の振替休日
  for(const key of [...national]){
    const d=new Date(`${key}T00:00:00`);
    if(d.getDay()!==0) continue;
    const cursor=new Date(d);
    do{
      cursor.setDate(cursor.getDate()+1);
      const k=todayKey(cursor);
      if(!national.has(k) && !holidays.has(k)){ holidays.add(k); break; }
    }while(cursor.getFullYear()<=year+1);
  }
  // 祝日に挟まれた休日
  const start=new Date(year,0,1), end=new Date(year,11,31);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=todayKey(d);
    if(holidays.has(key)) continue;
    const prev=new Date(d); prev.setDate(prev.getDate()-1);
    const next=new Date(d); next.setDate(next.getDate()+1);
    if(national.has(todayKey(prev)) && national.has(todayKey(next))) holidays.add(key);
  }
  return holidays;
}
function isJapaneseHoliday(dateObj){
  return getJapaneseHolidaySet(dateObj.getFullYear()).has(todayKey(dateObj));
}
function getScheduleDayForDate(dateObj){
  const d=new Date(dateObj);
  const weekend=d.getDay()===0||d.getDay()===6;
  return (weekend||isJapaneseHoliday(d))?'休日':'平日';
}
function isHistoricalSelectedDate(dateKey){
  const currentOperationDate=operationDateKey();
  return String(dateKey||'') < currentOperationDate;
}
function isNonCurrentSelectedDate(dateKey){
  const currentOperationDate=operationDateKey();
  return String(dateKey||'') !== currentOperationDate;
}
function historicalStateForDate(dateKey){
  const root=remoteRoot.history||{};
  const snap=root[String(dateKey)] || Object.values(root).find(x=>String(x?.date||'')===String(dateKey)) || null;
  if(!snap) return {};
  const days=Array.isArray(snap.days)?snap.days:[snap];
  let daySnap=days.find(d=>String(d?.day||'')===String(currentDay)) || null;
  // Older snapshots may have been saved without a day label. In that case the
  // first valid day snapshot is still preferable to returning an empty state.
  if(!daySnap && days.length===1) daySnap=days[0];
  if(!daySnap || !Array.isArray(daySnap.operations)) return {};
  const state={};
  const dayIndex=currentDay==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
  const resolveKey=raw=>{
    const s=String(raw||'');
    if(dayIndex[s]) return s;
    const a=s.replace(/A$/i,'')+'A';
    if(dayIndex[a]) return a;
    const plain=s.replace(/A$/i,'');
    if(dayIndex[plain]) return plain;
    return a;
  };
  daySnap.operations.forEach(op=>{
    const form=op?.formationId;
    (Array.isArray(op?.trainNumbers)?op.trainNumbers:[]).forEach(no=>{
      if(!form) return;
      state[resolveKey(no)]=normalizeStoredFormationId(form) || null;
    });
  });
  return state;
}
function setSelectedDate(dateKey,options={}){
  const value=String(dateKey||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
  const d=new Date(`${value}T00:00:00`);
  if(Number.isNaN(d.getTime())) return;
  const preserveNow=options?.preserveNow===true;
  // 日付を手動で変更した場合は「現在時刻」モードを解除する。
  // 過去日でも実時間で位置計算してしまうと、選択した日付ではなく
  // 今日の時刻に連動した列車が表示されるため、時刻は固定する。
  followNow=preserveNow;
  const nowBtn=document.getElementById('nowBtn');
  if(nowBtn) nowBtn.classList.toggle('active',followNow);
  if(preserveNow){
    const timeInput=document.getElementById('timeInput');
    if(timeInput) timeInput.value=formatTimeNow();
  }
  selectedDateKey=value;
  // 編成入力と同じく、運行情報の操作も当日のみ許可する。
  // 日付を過去・未来へ切り替えた場合、開いている登録画面や詳細も閉じる。
  renderOperationInfoAuthState();
  if(isNonCurrentSelectedDate(value)) closeOperationInfo();
  const nextDay=getScheduleDayForDate(d);
  if(nextDay!==currentDay){
    currentDay=nextDay;
    TRAIN_RENDER_INDEX_CACHE.clear();
    TERMINAL_NEXT_CACHE.clear();
    TERMINAL_DEPARTURE_CACHE.clear();
    TRAIN_RUNTIME_CACHE.clear();
  }else{
    currentDay=nextDay;
  }
  if(currentTrainNo) currentTrainSnapshot=trainForCurrentDay(currentTrainNo,currentTrainSnapshot?.direction||null);
  registrationState=isHistoricalSelectedDate(value)
    ? historicalStateForDate(value)
    : cloneState(remoteRoot.stateByDay?.[currentDay]||{});
  applyRegistrationState();
  const label=document.getElementById('scheduleDayLabel');
  if(label) label.textContent=isHistoricalSelectedDate(value) ? `${currentDay}ダイヤ・過去データ` : `${currentDay}ダイヤ`;
  saveLocalState();
  refreshAllTrainDataCache();
  reloadScheduleForSelectedDateIfNeeded();
  loadOperationInfo();
  renderLine();
  renderOperationInfoList();
  if(currentTrainNo) updateSheetContent();
  if(firebaseReady){
    loadOperationInfoFromFirebase().then(()=>attachOperationInfoFirebaseListener());
  }
}

function formationById(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return null;
  const canonical=String(id).trim().replace(/F$/i,'');
  const base='https://minamikaze2700.github.io/Unyomatome/images/';

  // 共通JSONの「選択可能な形式・個体差・合成選択肢」を同じID体系で解決する。
  const groups=formationDisplayGroups(FORMATIONS);
  for(const group of (groups||[])){
    const gType=String(group?.type||'').trim();
    if(group?.selectableType && [gType,String(group?.selectableId||'')].some(x=>x.replace(/F$/i,'')===canonical)){
      return {id:canonical,name:String(group?.selectableId||gType),img:group.typeImg||fallbackTrainImageUrl(),kind:'type',type:String(group?.selectableId||gType),generic:true,displayAsFullName:true,family:formationFamily(group),routeNames:formationRouteNamesFromConfig(group)};
    }
    for(const variant of (group?.variants||[])){
      const vid=String(variant?.id||'').replace(/F$/i,'');
      if(vid===canonical){
        return {id:vid,name:String(variant?.name||vid),img:variant?.img||group.typeImg||fallbackTrainImageUrl(),kind:'variant',type:gType,family:formationFamily(group),generic:true,displayAsFullName:variant?.displayAsFullName!==false,routeNames:formationRouteNamesFromConfig(variant,formationRouteNamesFromConfig(group))};
      }
      for(const item of (variant?.items||[])){
        const iid=String(item?.id||item?.name||'').replace(/F$/i,'');
        const iname=String(item?.name||iid).replace(/F$/i,'');
        if(iid===canonical || iname===canonical) return {...item,id:iid,type:gType,family:formationFamily(group),routeNames:formationRouteNamesFromConfig(item,formationRouteNamesFromConfig(variant,formationRouteNamesFromConfig(group)))};
      }
    }
    for(const item of (group?.items||[])){
      const iid=String(item?.id||item?.name||'').replace(/F$/i,'');
      const iname=String(item?.name||iid).replace(/F$/i,'');
      if(iid===canonical || iname===canonical) return {...item,id:iid,type:gType,family:formationFamily(group),routeNames:formationRouteNamesFromConfig(item,formationRouteNamesFromConfig(group))};
    }
  }

  // 既存の単一形式JSONで形式名そのものを選択できるようにする。
  const declaredType=activeFormationVisualValue(activeJson,activeRouteMeta,'formationType');
  if(declaredType && canonical===declaredType){
    // 形式そのものを選択した場合も、プルダウン・列車情報・列車アイコンで
    // 同じ「形式画像」を使う。noImageへフォールバックさせない。
    const rawTypeImage=jsonImageValue(activeJson,activeRouteMeta,'formationTypeImage')
      ||jsonImageValue(activeJson,activeRouteMeta,'formationDefaultImage')
      ||jsonImageValue(activeJson,activeRouteMeta,'noImage');
    const img=/^https?:\/\//i.test(rawTypeImage)
      ? rawTypeImage
      : `https://minamikaze2700.github.io/Unyomatome/images/${String(rawTypeImage||'').replace(/\.png$/i,'')}.png`;
    return {id:declaredType,name:declaredType,img:img||jsonNoImageUrl(activeJson),kind:'type',type:declaredType,generic:true,displayAsFullName:true,family:activeRouteMeta?.formationFamily||''};
  }
  return null;
}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase();
  const v=raw.replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!v) return {ok:false,error:'車両番号または編成番号を入力してください。'};

  const train=liveTrain(currentTrainNo,currentTrainSnapshot?.direction||null) || currentTrainSnapshot || trainForCurrentDay(currentTrainNo,currentTrainSnapshot?.direction||null);
  const candidates=[
    v,
    v.endsWith('F')?v.slice(0,-1):v,
    v.endsWith('F')?v:v+'F'
  ];
  for(const c of candidates){
    const exact=formationById(c);
    if(!exact) continue;
    if(!formationAllowedForTrain(train,exact.id)){
      return {ok:false,error:'この路線ではこの編成を入力できません。'};
    }
    if(exact.disabled || UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(exact.id))) {
      return {ok:false,error:`編成「${exact.name||exact.id}」は入力できません。`};
    }
    return {ok:true,id:normalizeStoredFormationId(exact.id)};
  }

  // JSONに登録された車両番号から編成番号を特定する。
  // 海岸線の5101～5410など、路線固有の車両番号もここで直接解決する。
  const formationId=VEHICLE_TO_FORMATION[v] || VEHICLE_TO_FORMATION[v.replace(/F$/i,'')];
  if(formationId){
    const exact=formationById(formationId);
    if(exact){
      if(!formationAllowedForTrain(train,exact.id)) return {ok:false,error:'この路線ではこの編成を入力できません。'};
      if(exact.disabled || UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(exact.id))) {
        return {ok:false,error:`編成「${exact.name||exact.id}」は入力できません。`};
      }
      return {ok:true,id:normalizeStoredFormationId(exact.id)};
    }
  }

  // 227系など従来の車種＋車号表記にも対応。
  const vehicleNoMatch=v.match(/^(?:クハE233|クハE232|モハE233|モハE232|サハE233|サハE232)-([0-9]+)$/i);
  if(vehicleNoMatch){
    const vehicleKey=vehicleNoMatch[1];
    const legacyId=VEHICLE_TO_FORMATION[vehicleKey];
    const exact=legacyId?formationById(legacyId):null;
    if(exact){
      if(!formationAllowedForTrain(train,exact.id)) return {ok:false,error:'この路線ではこの編成を入力できません。'};
      if(exact.disabled || UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(exact.id))) {
        return {ok:false,error:`編成「${exact.name||exact.id}」は入力できません。`};
      }
      return {ok:true,id:normalizeStoredFormationId(exact.id)};
    }
  }

  return {ok:false,error:`車両番号「${raw}」に該当する編成が見つかりません。`};
}

function allowedFormationFamily(train){

function formationDisplayGroups(groups){
  const source=Array.isArray(groups)?groups:[];
  const out=[];
  const byBase=new Map();

  // 形式名に付いた「（個体差）」を取り除き、同じ形式へまとめる。
  // 例：10030型（更新）＋10030型（未更新）→ 10030型
  // 個体差は先にすべて並べ、その後に全個別編成をまとめて並べる。
  for(const g of source){
    const rawType=String(g?.type||'').trim();
    if(!rawType) continue;
    const m=rawType.match(/^(.*?型)（(.+)）$/);
    const baseType=m ? m[1] : rawType;
    let group=byBase.get(baseType);
    if(!group){
      group={
        type:baseType,
        typeImg:g?.typeImg||fallbackTrainImageUrl(),
        family:g?.family||activeRouteMeta?.formationFamily||'',
        selectableType:g?.selectableType!==false,
        showTypeOption:g?.showTypeOption!==false,
        selectableId:baseType,
        routeNames:[],
        variants:[],
        items:[]
      };
      byBase.set(baseType,group);
      out.push(group);
    }
    group.routeNames=[...new Set([
      ...(group.routeNames||[]),
      ...formationRouteNamesFromConfig(g)
    ])];
    // 同じ形式へ統合されるグループのどれかが非表示指定なら、見出しは表示しない。
    group.showTypeOption=group.showTypeOption && g?.showTypeOption!==false;

    if(m){
      const variantName=m[2].trim();
      const variantId=(baseType+variantName).replace(/F$/i,'');
      const items=Array.isArray(g?.items)?g.items:[];
      group.variants.push({
        id:variantId,
        // 選択肢名は形式を省略せず、「60000型5両」「10030型未更新」のように表示する。
        name:baseType+variantName,
        img:g?.typeImg||fallbackTrainImageUrl(),
        items,
        family:g?.family||group.family,
        kind:'variant',
        generic:true,
        displayAsFullName:false,
        routeNames:formationRouteNamesFromConfig(g)
      });
    }else{
      // normalizeFormationGroups() がJSONの variants をFORMATIONSへ展開した場合、
      // ここで個体差選択肢を必ず引き継ぐ。これがないと10030型更新などが消えてしまう。
      for(const rawVariant of (Array.isArray(g?.variants)?g.variants:[])){
        const variantId=String(rawVariant?.id||rawVariant?.name||'').trim().replace(/F$/i,'');
        const variantName=String(rawVariant?.name||variantId).trim();
        if(!variantId || !variantName) continue;
        // 同じ個体差が複数グループから来た場合は重複させない。
        if(group.variants.some(v=>String(v?.id||'').replace(/F$/i,'')===variantId)) continue;
        group.variants.push({
          ...rawVariant,
          id:variantId,
          name:variantName,
          img:rawVariant?.img||g?.typeImg||fallbackTrainImageUrl(),
          items:Array.isArray(rawVariant?.items)?rawVariant.items:[],
          family:rawVariant?.family||g?.family||group.family,
          kind:'variant',
          generic:true,
          displayAsFullName:rawVariant?.displayAsFullName!==false,
          routeNames:formationRouteNamesFromConfig(rawVariant,formationRouteNamesFromConfig(g))
        });
      }
      group.items.push(...(Array.isArray(g?.items)?g.items:[]));
    }
  }

  return out;
}

function formationRouteAllowed(target,train){

  if(!routes.length) return true;

      || String(activeRouteMeta?.formationFamily||'')==='fukuoka-kuko-hakozaki') return true;
  return !!route && routes.includes(route);
}

    && formationRouteAllowed(item,train);

function formationDisplayParts(id){
  const obj=selectionDisplayObject(id);
  if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) return [];
  const type=String(obj.type||'').trim();
  const name=String(obj.name||'').trim();
  if(!name) return [];
  if(type){
    if(name===type) return [type];
    if(name.startsWith(type)){
      const element=name.slice(type.length).trim();
      return element ? [type, element] : [type];
    }
    if(obj.kind==='variant') return [type, name];
  }
  const m=name.match(/^(.*?型)(.+)$/);
  return m ? [m[1],m[2].trim()] : [name];
}

function prescribedFormationName(t){
  const meta=ROUTE_REGISTRY[String(t?.routeName||activeRouteName)]||activeRouteMeta||{};
  if(String(meta?.formationFamily||'')==='mizushima' || String(meta?.prescribedFormationRule||'')==='mizushima'){
    const vehicleClass=String(t?.rawTrain?.class||t?.rawTrain?.vehicleClass||t?.vehicleClass||'').trim().toLowerCase();
    if(vehicleClass==='kiha'){
      const dateKey=String(selectedDateKey||operationDateKey());
      const monthDay=dateKey.slice(5);
      const yearEndException=(monthDay>='12-29' || monthDay<='01-03');
      let holiday=false;
      if(/^\d{4}-\d{2}-\d{2}$/.test(dateKey)){
        holiday=getScheduleDayForDate(new Date(`${dateKey}T00:00:00`))==='休日';
      }else{
        holiday=currentDay==='休日';
      }
      return holiday||yearEndException ? 'MRT300形' : '旧国鉄車両キハ';
    }
    return 'MRT300形';
  }
  const explicit=String(t?.prescribedFormation||t?.rawTrain?.prescribedFormation||t?.rawTrain?.prescribedFormationName||'').trim();
  if(explicit) return explicit;
  const rule=String(meta?.prescribedFormationRule||'');
  if(rule==='nagano'){
    const type=String(t?.type||'');
    if(type.includes('スノーモンキー')) return '2100系';
    if(type.includes('ゆけむり')) return '1000系';
    if(type==='普通' || type==='回送'){
      const key=String(t?.no||'');
      const noPattern=/^(?:1\d{2}|3\d{2})(?:[A-Za-z])?$/;
      if(noPattern.test(key)) return '3000系';
      const info=typeof findChain==='function' ? findChain(currentDay,key) : null;
      if(info){
        const chain=OPERATION_CHAINS[currentDay]?.[info.chainIndex]||[];
        if(chain.some(entry=>noPattern.test(String(entry?.no||entry)))) return '3000系';
      }
      if(type==='普通') return '普通3両';
    }
    return String(t?.defaultCars||t?.rawTrain?.defaultCars||'');
  }
  if(rule==='jre'){
    return Number(t?.cars)===8 ? '普通8両' : '普通10両';
  }
  if(rule==='common'){
    return String(meta?.defaultFormationName||activeJson?.formationDefaultName||'普通共通');
  }
  return String(meta?.defaultFormationName||t?.defaultCars||t?.rawTrain?.defaultCars||activeJson?.formationDefaultName||'普通共通');
}

function formatTimeNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function currentMinutes(){
  // 時刻入力・現在時刻とも、03:00を境とする「運用日」の分数で扱う。
  // 0:00～2:59は1440分台にすることで、前日の23時台から続く列車が
  // 日付変更後もそのまま位置計算へ入れる。
  if(followNow && !isNonCurrentSelectedDate(selectedDateKey)){
    const d=new Date();
    const base=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
    return d.getHours()<RESET_HOUR ? base+1440 : base;
  }
  const input=document.getElementById('timeInput');
  const value=input?.value || formatTimeNow();
  const [h,m]=String(value).split(':').map(Number);
  if(Number.isFinite(h) && Number.isFinite(m)){
    // 任意時刻入力時は、その入力時刻の30秒時点を表示基準とする。
    const base=h*60+m+0.5;
    return h<RESET_HOUR ? base+1440 : base;
  }
  const d=new Date();
  const base=d.getHours()*60+d.getMinutes();
  return d.getHours()<RESET_HOUR ? base+1440 : base;
}

function stationEnglishTextColor(bg){
  const m=String(bg||'').trim().match(/^#([0-9a-fA-F]{6})$/);
  if(!m) return '#fff';
  const n=parseInt(m[1],16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const srgb=[r,g,b].map(v=>v/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  const lum=0.2126*srgb[0]+0.7152*srgb[1]+0.0722*srgb[2];
  return lum>0.45 ? '#000' : '#fff';
}

function buildFukuokaScreenRows(){
  const rows=[];
  const push=(st,routeKey,opt={})=>rows.push({st,routeKey,opt:{...opt}});
  const main=fukuokaMainStationNames(activeJson,activeRouteMeta).map(name=>{
    const master=fukuokaStationMaster(activeJson);
    const m=master.get(name)||{};
    return [name,String(m.nameEn||'')];
  });
  const branch=fukuokaBranchStationNames(activeJson,activeRouteMeta).map(name=>{
    const master=fukuokaStationMaster(activeJson);
    const m=master.get(name)||{};
    return [name,String(m.nameEn||'')];
  });
  const junction=String(fukuokaDiagramConfig(activeJson,activeRouteMeta)?.junctionStation||'中洲川端').trim()||'中洲川端';
  const hakoColor=String(lineDefByName('箱崎線')?.color||'#666');
  const kukoColor=String(lineDefByName('空港線')?.color||'#666');
  const branchOpen=fukuokaHakozakiBranchOpen;

  for(let i=0;i<main.length;i++){
    const st=main[i],next=main[i+1],prev=main[i-1];
    const isJunction=st[0]===junction;

    // 分岐駅（中洲川端）の直前へ枝線を挿入し、祇園から貝塚へ接続する。
    if(isJunction && branchOpen){
      branch.forEach((x,j)=>push(x,'fukuoka-hakozaki',{
        lineTop:hakoColor,
        lineBottom:hakoColor,
        stationColor:hakoColor,
        cutAbove:j===0,
        cutBelow:false
      }));
    }

    const opt={};
    if(i===0) opt.cutAbove=true;
    if(i===main.length-1) opt.cutBelow=true;

    if(isJunction && branchOpen){
      // 上半分は箱崎線、下半分は空港線。駅名標は空港線側。
      opt.lineTop=hakoColor;
      opt.lineBottom=next?kukoColor:'transparent';
      opt.stationColor=kukoColor;
    }else{
      opt.lineTop=prev ? (branchOpen && prev[0]===junction ? hakoColor : kukoColor) : 'transparent';
      opt.lineBottom=next ? (next[0]===junction && branchOpen ? hakoColor : kukoColor) : 'transparent';
      opt.stationColor=next ? (next[0]===junction && branchOpen ? hakoColor : kukoColor) : (prev ? kukoColor : 'transparent');
    }

    // 箱崎線開放時でも、本線側の色と駅名標は空港線側のままにする。
    if(st[0]=== '祇園' && branchOpen){
      opt.lineTop=prev ? kukoColor : 'transparent';
      opt.lineBottom=hakoColor;
      opt.stationColor=kukoColor;
    }

    push(st,'fukuoka-kuko',opt);
  }
  return rows;
}

function timeToMinutes(value){
  const [h,m]=String(value).split(':').map(Number);
  if(!Number.isFinite(h)||!Number.isFinite(m)) return NaN;
  // 運用日は03:00を境にする。0:00～2:59の時刻は翌日扱いとして
  // 1440分台へ持ち上げ、23時台から続く列車を同一運用日で比較できるようにする。
  return h<RESET_HOUR ? h*60+m+1440 : h*60+m;
}
function inferDirectionFromStations(a,b){
  const ia=stationIndex(a),ib=stationIndex(b);
  return ia>ib?'up':'down';
}
function linkedEntries(t){
  const info=findChain(currentDay,t.no);
  if(!info) return {prev:null,next:null,chain:null,index:-1};
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  return {prev:chain[info.entryIndex-1]||null,next:chain[info.entryIndex+1]||null,chain,index:info.entryIndex};
}
function trainEntryNo(entry){ return entry?normalizeTrainNo(entry.no):''; }
function connectionPrev(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const prev=chain[info.entryIndex-1];
  if(!prev || String(prev.dest)!==String(t.start)) return null;
  if(timeToMinutes(prev.endTime)>timeToMinutes(t.stops[0].time)) return null;
  return prev;
}
function connectionNext(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const next=chain[info.entryIndex+1];
  if(!next || String(t.dest)!==String(next.start)) return null;
  if(timeToMinutes(t.stops[t.stops.length-1].time)>timeToMinutes(next.startTime)) return null;
  return next;
}
function normalizeLineStopTimes(stops){
  const out=[];
  let prevDep=null;
  (stops||[]).forEach((stop,index)=>{
    let arrival=timeToMinutes(stop?.arrival||stop?.time||stop?.departure);
    let departure=timeToMinutes(stop?.departure||stop?.time||stop?.arrival);
    if(!Number.isFinite(arrival)||!Number.isFinite(departure)) return;
    if(index>0){
      while(Number.isFinite(prevDep) && arrival < prevDep-720){ arrival+=1440; departure+=1440; }
      while(departure < arrival) departure+=1440;
      while(Number.isFinite(prevDep) && departure < prevDep-720){ arrival+=1440; departure+=1440; }
    }
    prevDep=departure;
    out.push({...stop,_arrival:arrival,_departure:departure});
  });
  return out;
}
function getCurrentTrainSource(){
  return currentDay==='休日'
    ? HOLIDAY_TRAINS
    : TRAINS.filter(x=>!Array.isArray(x.days)||!x.days.length||x.days.includes(currentDay));
}
function findTerminalNextTrain(t,lastArr,terminalStation){
  const next=connectionNext(t);
  if(!next) return null;
  const nextNo=trainEntryNo(next);
  const nextDirection=(next.start&&next.dest)
    ? (stationIndex(next.start)>stationIndex(next.dest)?'up':'down')
    : null;
  const nextTrain=liveTrain(nextNo,nextDirection)
    || baseTrainForDay(nextNo,nextDirection,currentDay)
    || (currentDay==='休日' ? HOLIDAY_TRAIN_INDEX[nextNo] : TRAIN_INDEX[nextNo])
    || null;
  const dep=timeToMinutes(next.startTime)+0.75;
  if(!nextTrain || !Number.isFinite(dep)) return null;
  return {train:nextTrain,dep};
}
function findTerminalNextDeparture(t,lastArr,terminalStation){
  return findTerminalNextTrain(t,lastArr,terminalStation)?.dep ?? null;
}
function isStartDwellMinute(minutes,departureRaw){
  const m=Number(minutes),d=Number(departureRaw);
  if(!Number.isFinite(m)||!Number.isFinite(d)) return false;
  let mm=m;
  while(mm<d-1440) mm+=1440;
  while(mm>=d+1440) mm-=1440;
  // 発車時刻を hh:mm:45 とし、その2分前の hh:mm:30 から表示する。
  const start=d-RESET_DWELL_MIN+0.5;
  return mm>=start && mm<d+0.75;
}
function isEndDwellMinute(minutes,arrivalRaw){
  const m=Number(minutes),d=Number(arrivalRaw);
  if(!Number.isFinite(m)||!Number.isFinite(d)) return false;
  let mm=m;
  while(mm<d-1440) mm+=1440;
  while(mm>=d+1440) mm-=1440;
  // 到着時刻を hh:mm:15 とし、2分後の hh:mm:30 まで表示する。
  return mm>=d+0.25 && mm<=d+RESET_DWELL_MIN+0.5;
}

function positionForTrain(t,minutes){
  const meta=getTrainRuntimeMeta(t);
  if(!meta) return null;
  const {stops,first,last,firstIndex,lastIndex,side,firstDep,lastArr}=meta;
  const rawDirection=String(t?.direction||'').toLowerCase();
  if(!Number.isFinite(firstDep)||!Number.isFinite(lastArr)) return null;

  const chainInfo=findChain(currentDay,t.no);
  const chain=chainInfo ? OPERATION_CHAINS[currentDay][chainInfo.chainIndex] : null;
  const isChainFirst=!!chain && chainInfo.entryIndex===0;
  const isChainLast=!!chain && chainInfo.entryIndex===chain.length-1;
  const next=connectionNext(t);
  const nextStart=next?timeToMinutes(next.startTime)+0.75:null;

    // 連結運用の先頭列車は先頭側の始発停車、末尾列車は末尾側の終着停車を担当する。
  if(!chain){
    if(!isCircularTrain(t) && firstIndex>=0 && isStartDwellMinute(minutes,Number(first._departure))){
      return {pos:firstIndex,side:trainSideForTrainAtStation(t,0),visualTrain:t,mode:'start-dwell'};
    }
    if(!isCircularTrain(t) && lastIndex>=0 && isEndDwellMinute(minutes,Number(last._arrival))){
      return {pos:lastIndex,side:trainSideForTrainAtStation(t,stops.length-1),visualTrain:t,mode:'end-dwell'};
    }
  }

  if(!isCircularTrain(t) && isChainFirst && firstIndex>=0 && isStartDwellMinute(minutes,Number(first._departure))){
    return {pos:firstIndex,side:trainSideForTrainAtStation(t,0),visualTrain:t,mode:'start'};
  }

  // 駅停車中は到着(:15)から発車(:45)まで、その駅に固定表示。
  for(let i=0;i<stops.length;i++){
    const st=stops[i];
    const currentIndex=stationIndex(st.station);
    const arrive=Number(st._arrival)+0.25;
    const depart=Number(st._departure)+0.75;
    if(i>0 && i<stops.length-1 && currentIndex>=0 && minutes>=arrive && minutes<depart){
      return {pos:currentIndex,side:trainSideForTrainAtStation(t,i),visualTrain:t,mode:'station-dwell'};
    }

    if(i<stops.length-1){
      const next=stops[i+1];
      const nextIndex=stationIndex(next.station);
      // 駅間の両端がともにこのページに存在するときだけ走行位置を返す。
      if(currentIndex<0 || nextIndex<0) continue;

      const a=Number(st._departure)+0.75;
      // 終点到着は到着時刻ちょうどに駅中心へ着いた状態とする。
      const isTerminalNext=(i===stops.length-2);
      const b=isTerminalNext ? Number(next._arrival) : Number(next._arrival)+0.25;
      if(Number.isFinite(a)&&Number.isFinite(b)&&minutes>=a&&(isTerminalNext ? minutes<b : minutes<=b)){
        if(isFukuokaCompositeRoute(activeRouteMeta) && fukuokaHakozakiBranchOpen && !fukuokaTrainUsesHakozaki(t)
          && ((String(st.station)==='祇園' && String(next.station)==='中洲川端')
            || (String(st.station)==='中洲川端' && String(next.station)==='祇園'))){
          return null;
        }
        const ratio=b===a?0:(minutes-a)/(b-a);
        return {pos:currentIndex+(nextIndex-currentIndex)*ratio,side:trainSideForStationPair(st.station,next.station,rawDirection),visualTrain:t,mode:'run'};
      }
    }
  }

  if(next && !isChainLast && Number.isFinite(nextStart)){
        // 到着後1分までは到着側、その後は次列車の発車時刻まで反対側で待機表示する。
    // 大船で30分以上空く運用は、OPERATION_CHAINS側で連結自体を分割しているため、
    // この処理には入らず、次列車は発車2分前から通常の始発表示になる。
    if(minutes>lastArr && minutes<nextStart){
      if(minutes<=lastArr+TURNBACK_SWITCH_MIN){
        return {pos:lastIndex,side:trainSideForTrainAtStation(t,stops.length-1),visualTrain:t,mode:'turn-arrival'};
      }
      const nextNo=trainEntryNo(next);
      const nextDirection=(next&&next.start&&next.dest)?(stationIndex(next.start)>stationIndex(next.dest)?'up':'down'):null;
      const nextTrain=liveTrain(nextNo,nextDirection)||baseTrainForDay(nextNo,nextDirection,currentDay)||(currentDay==='休日'?HOLIDAY_TRAIN_INDEX[nextNo]:TRAIN_INDEX[nextNo])||null;
      const nextSide=trainSideForStationPair(next.start,next.dest,nextTrain?.direction||inferDirectionFromStations(next.start,next.dest));
      return {pos:lastIndex,side:nextSide,visualTrain:nextTrain||t,mode:'turn-wait'};
    }
  }

  if(!isCircularTrain(t) && isChainLast && isEndDwellMinute(minutes,Number(last._arrival))){
    return {pos:lastIndex,side:trainSideForTrainAtStation(t,stops.length-1),visualTrain:t,mode:'end'};
  }

  return null;
}

function trainLabelText(t){
  const type=String(t?.type||'').trim();
  const isCircular=isCircularTrain(t);
  // 以前の表示仕様では、列車アイコンの行先はPC・スマホとも略称を使用していた。
  // PC用だけ正式名称へ切り替える処理をなくし、略称設定を両方の表示に反映する。
  const shortDest=isCircular ? '環状' : getShortDest(t?.dest);
  const displayType=getTrainTypeDisplayLabel(t);
  const shortType=isShinanoMainRoute()?displayType:getShortType(type,t?.no);
  const fullLabel=type?`${displayType} ${shortDest}`:shortDest;
  const shortLabel=type?`${shortType} ${shortDest}`:shortDest;
  return `<span class="train-label-full">${escapeAttr(fullLabel)}</span><span class="train-label-short">${escapeAttr(shortLabel)}</span>`;
}
function isCircularTrain(t){
  return activeRouteName==='大阪環状線' && activeJson?.circular===true && (t?.circular===true || t?.rawTrain?.circular===true);
}
function getDisplayDestinationForTrain(t){
  return isCircularTrain(t) ? '環状運転' : getDetailDest(t?.dest);
}
function destinationGoSuffix(t){
  return isCircularTrain(t) ? '' : ' 行';
}
function trainPositionViewportVisible(p,rowCenters,viewportTop,viewportBottom){
  if(!p||!Number.isFinite(Number(p.pos))||!rowCenters.length) return false;
  if(Number(p.pos)<0 || Number(p.pos)>rowCenters.length-1) return false;
  const q=Number(p.pos);
  const i0=Math.floor(q),i1=Math.min(rowCenters.length-1,Math.ceil(q)),f=q-i0;
  const y=rowCenters[i0]+(rowCenters[i1]-rowCenters[i0])*f;
  const iconHalfHeight=48;
  return y+iconHalfHeight>=viewportTop&&y-iconHalfHeight<=viewportBottom;
}
function scheduleViewportTrainRender(){

function getTrainRenderEntries(){
  const key=currentDay;
  const cached=TRAIN_RENDER_INDEX_CACHE.get(key);
  if(cached) return cached;

  const source=getDisplayedTrainSource();
  const entries=[];
  for(const train of source){
    const meta=getTrainRuntimeMeta(train);
    if(!meta || !Number.isFinite(meta.firstDep) || !Number.isFinite(meta.lastArr)) continue;
    const next=findTerminalNextTrain(train,meta.lastArr,meta.last.station);
    const circularOnly=!!isCircularTrain(train);
    const visibleFrom=circularOnly ? meta.firstDep : meta.firstDep-RESET_DWELL_MIN+0.5;
    const visibleUntil=circularOnly ? (next?.dep ?? meta.lastArr) : (next?.dep ?? meta.lastArr+RESET_DWELL_MIN);
    entries.push({train,meta,next,visibleFrom,visibleUntil});
  }
  TRAIN_RENDER_INDEX_CACHE.set(key,entries);
  return entries;
}
function getTrainLayoutMetrics(layer){
  const rows=Array.from(document.querySelectorAll('.station-row'));
  return {rows,rowCenters:rows.map(r=>r.offsetTop+r.offsetHeight/2),layerRect:layer.getBoundingClientRect()};

const TRAIN_ICON_CACHE=new Map();
const TRAIN_RUNTIME_CACHE=new Map();
const TERMINAL_DEPARTURE_CACHE=new Map();
const TERMINAL_NEXT_CACHE=new Map();
const TRAIN_RENDER_INDEX_CACHE=new Map();
let TRAIN_LAYOUT_CACHE={container:null,rowCenters:null,rowCount:0};
function trainRuntimeKey(t){
  return `${currentDay}|${String(t?.no||'')}|${String(t?.direction||'')}`;
}
function isShinanoMainLineForTrainSide(){
  // 駅の画面上の上下位置をそのまま左右位置に反映する。
  // しなの鉄道線も「次駅が上なら左、下なら右」を適用する。
  return false;
}
function stationVisualYForTrainSide(stationName){
  const target=String(stationName||'').replace(/駅$/,'');
  const rows=Array.from(document.querySelectorAll('.station-row'));
  const row=rows.find(r=>String(r.dataset?.stationName||r.querySelector('.station-name-ja')?.textContent||'').trim().replace(/駅$/,'')===target);
  if(row){
    const rect=row.getBoundingClientRect();
    if(Number.isFinite(rect.top)&&rect.height) return rect.top+rect.height/2;
  }
  const idx=stationIndex(stationName);
  return idx>=0?idx:NaN;
}
function trainSideForStationPair(fromStation,toStation,fallbackDirection=null){
  const yFrom=stationVisualYForTrainSide(fromStation);
  const yTo=stationVisualYForTrainSide(toStation);
  let side=Number.isFinite(yFrom)&&Number.isFinite(yTo)&&Math.abs(yTo-yFrom)>0.5
    ? (yTo<yFrom?'left':'right')
    : (String(fallbackDirection||'').toLowerCase()==='up'?'left':'right');
  return side;
}
function trainSideForDirection(direction, fallbackDirection=null){
  const dir=String(direction||fallbackDirection||'').toLowerCase();
  return dir==='up'?'left':dir==='down'?'right':(String(fallbackDirection||'').toLowerCase()==='up'?'left':'right');
}
function trainSideForTrainAtStation(train,stationIndexValue){
  const stops=normalizeLineStopTimes(train?.stops||[]);
  const i=Math.max(0,Math.min(stops.length-1,Number(stationIndexValue)||0));
  if(stops.length>1){
    if(i<stops.length-1) return trainSideForStationPair(stops[i].station,stops[i+1].station,train?.direction);
    return trainSideForStationPair(stops[i-1].station,stops[i].station,train?.direction);
  }
  return trainSideForDirection(train?.direction,train?.direction);
}
function getTrainRuntimeMeta(t){
  const key=trainRuntimeKey(t);
  const cached=TRAIN_RUNTIME_CACHE.get(key);
  if(cached) return cached;
  const stops=normalizeLineStopTimes(t?.stops||[]);
  if(!stops.length) return null;
  const first=stops[0],last=stops[stops.length-1];
  const firstIndex=stationIndex(first.station);
  const lastIndex=stationIndex(last.station);
  const rawDirection=String(t?.direction||'').toLowerCase();
  const side=stops.length>1?trainSideForStationPair(stops[0].station,stops[1].station,rawDirection):trainSideForDirection(rawDirection, firstIndex>lastIndex?'up':'down');
  const meta={stops,first,last,firstIndex,lastIndex,side,firstDep:Number(first._departure),lastArr:Number(last._arrival)};
  TRAIN_RUNTIME_CACHE.set(key,meta);
  return meta;
}
function getTerminalDepartureIndex(){
  const key=String(currentDay);
  const cached=TERMINAL_DEPARTURE_CACHE.get(key);
  if(cached) return cached;
  const source=getDisplayedTrainSource();
  const index=new Map();
  for(const candidate of source){
    if(!candidate) continue;
    const meta=getTrainRuntimeMeta(candidate);
    if(!meta||!meta.stops.length) continue;
    const first=meta.first;
    const dep=Number(first._departure);
    if(!Number.isFinite(dep)) continue;
    const station=String(first.station||'');
    if(!station) continue;
    if(!index.has(station)) index.set(station,[]);
    index.get(station).push({no:normalizeTrainNo(candidate.no),direction:String(candidate.direction||'').toLowerCase(),dep,train:candidate});
  }
  for(const list of index.values()) list.sort((a,b)=>a.dep-b.dep);
  TERMINAL_DEPARTURE_CACHE.set(key,index);
  return index;
}
function renderTrainPositions(){
  if(activeRouteName==='大阪環状線' && activeJson?.circular===true){
    const fn=window.__circularRouteHelpers?.renderCircularTrainPositions;
    if(typeof fn==='function'){ fn(); }
    return;
  }
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  const layout=getTrainLayoutMetrics(layer);
  const {rows,rowCenters,layerRect}=layout;
  if(!rows.length) return;
  const viewportBottom=window.innerHeight||document.documentElement.clientHeight||0;
  const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
  const viewportRowCenters=rowCenters.map(v=>layerRect.top+v*mobileZoom);
  const renderEntries=getTrainRenderEntries();
  const visible=[];
  const visiblePositions=new Map();
  const keep=new Set();
  const terminalHandoffs=new Map();
  const suppress=new Set();

  // 表示時間帯に入っている列車だけを評価する。全ダイヤを毎秒走査する必要をなくす。
  for(const entry of renderEntries){
    if(minutes<entry.visibleFrom || minutes>entry.visibleUntil) continue;
    const {train:base,meta,next:nextInfo}=entry;
    if(!base || !meta || meta.lastIndex<0) continue;
    if(nextInfo?.train){
      const oldSignature=`${String(base.no||'')}|${String(base.direction||'')}`;
      const nextSignature=`${String(nextInfo.train.no||'')}|${String(nextInfo.train.direction||'')}`;
      terminalHandoffs.set(oldSignature,{nextTrain:nextInfo.train,nextSignature,dep:nextInfo.dep,lastArr:meta.lastArr});
    }
  }

  for(const entry of renderEntries){
    if(minutes<entry.visibleFrom || minutes>entry.visibleUntil) continue;
    const base=entry.train;
    if(!base) continue;
    const p=positionForTrain(base,minutes);
    if(!p||(!p.stationA&&!p.stationB&&!Number.isFinite(p.pos))) continue;
    const baseSignature=`${String(base.no||'')}|${String(base.direction||'')}`;
    if(suppress.has(baseSignature)) continue;
    const handoff=terminalHandoffs.get(baseSignature);
    const displayBase=handoff && minutes>=handoff.lastArr+1 && minutes<handoff.dep
      ? (liveTrain(handoff.nextTrain.no,handoff.nextTrain.direction)||handoff.nextTrain)
      : (liveTrain(base.no,base.direction)||base);
    const signature=handoff && minutes>=handoff.lastArr+1 && minutes<handoff.dep ? baseSignature : `${String(displayBase.no||'')}|${String(displayBase.direction||'')}`;
    if(!trainPositionViewportVisible(p,viewportRowCenters,0,viewportBottom)) continue;
    visible.push({baseTrain:base,visualTrain:displayBase,info:p,signature});
    visiblePositions.set(signature,p);
    keep.add(signature);
  }

  // 次列車の発車時刻になったら、直前まで使っていたDOMを次列車へ引き継ぐ。
  for(const [oldSignature,handOff] of terminalHandoffs){
    if(minutes < handOff.dep) continue;
    if(!keep.has(handOff.nextSignature) && !keep.has(oldSignature)) continue;
    const oldEntry=TRAIN_ICON_CACHE.get(oldSignature);
    const nextEntry=TRAIN_ICON_CACHE.get(handOff.nextSignature);
    if(oldEntry && !nextEntry){
      TRAIN_ICON_CACHE.set(handOff.nextSignature,oldEntry);
      TRAIN_ICON_CACHE.delete(oldSignature);
    }
  }

  for(const [signature,entry] of TRAIN_ICON_CACHE){
    if(!keep.has(signature)){
      entry.el.remove();
      TRAIN_ICON_CACHE.delete(signature);
    }
  }

  const occupied={left:[],right:[]};
  visible.forEach(item=>{
    const info=item.info;
    if(!info||!info.visualTrain) return;
    occupied[info.side].push({
      t:info.visualTrain,
      pos:info.pos,
      baseTrain:item.baseTrain,
      mode:info.mode,
      signature:item.signature
    });
  });

  const uiScale=1, trainWidth=66*uiScale, imageWidth=60*uiScale, laneGap=20*uiScale;
  const rowRectAt=pos=>{
    if(!rows.length) return null;
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p),i1=Math.min(rows.length-1,Math.ceil(p)),f=p-i0;
    const r0=rows[i0].getBoundingClientRect();
    const r1=rows[i1].getBoundingClientRect();
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});

      const t=item.t;
      let entry=TRAIN_ICON_CACHE.get(item.signature);
      let el=entry?.el;
      if(entry) entry.currentTrain=t;
      const cls=trainVisualKind(t);
      // 列車アイコン下部の編成表示は、列車オブジェクトの古い値ではなく
      // Firebase／選択中日付から復元した登録状態を正として表示する。
      const registeredFormation=registeredFormationForTrain(t);
      const formationIdForDisplay=registeredFormation||t.formation||'';
      const formationParts=formationIdForDisplay&&formationIdForDisplay!==INITIAL_FORMATION_SELECTION.id
        ?formationDisplayParts(formationIdForDisplay):[];
      const imageUrl=imageForTrain(t);
      const displayNo=trainDisplayNoAtPosition(t,item.pos);
      const labelText=trainLabelText(t);
      const contentKey=[displayNo,imageUrl,formationParts.join('\n'),cls,getMainLabelClass(t.type),labelText].join('|');
      const contentChanged=!entry||entry.contentKey!==contentKey;

      if(!el){
        el=document.createElement('div');
        el.className=`train-icon ${side}`;
        el.style.visibility='hidden';
        el.style.transition='none';
        layer.appendChild(el);
        entry={el,contentKey:'',layoutHeight:0,ready:false,currentTrain:t};
        el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();const ct=entry.currentTrain||t;openSheet(ct.no,false,ct.direction);});
        TRAIN_ICON_CACHE.set(item.signature,entry);
      }

      const tForLayout=t;
      if(contentChanged){
        el.innerHTML=`${displayNo?`<span class="train-no">${displayNo}</span>`:''}<img src="${imageUrl}" alt="${displayNo}">${formationParts.length?`<span class="train-no train-formation">${formationParts.map(x=>`<span>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`).join('')}</span>`:''}<span class="train-label ${cls} ${getMainLabelClass(tForLayout.type)}" style="${typeBadgeInlineStyle(tForLayout,item.pos)}">${labelText}</span>`;
        entry.contentKey=contentKey;
        entry.layoutHeight=0;
        entry.ready=false;
      }

      el.className=`train-icon ${side}`;
      const currentTrainTypeColor=typeColorForTrain(t,item.pos);
      el.style.setProperty('--train-type-color',currentTrainTypeColor);
      // 普通列車の背景色は「現在いる区間」の色に追従させる。
      // innerHTML再生成の有無に関係なく毎フレーム更新することで、
      // 山陽本線の緑→赤の境界通過時などに以前の色が残らないようにする。
      const trainLabelEl=el.querySelector('.train-label');
      if(trainLabelEl){
        trainLabelEl.style.display='block';
        trainLabelEl.style.visibility='visible';
        trainLabelEl.style.opacity='1';
        applyTypeBadgeAppearance(trainLabelEl,t,item.pos);
      }
      el.style.transition='none';
      const rr=rowRectAt(item.pos) || {centerY:layerRect.top+layerRect.height/2};
      const layoutWidth=window.innerWidth<960?1920:layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'?centerX-340-laneOffset:centerX+340-trainWidth+laneOffset;

      const applyFinalPosition=()=>{
        const img=el.querySelector('img');
        const noEl=el.querySelector('.train-no');
        const formationEl=el.querySelector('.train-formation');
        if(!img) return;
        const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
        const imgRect=img.getBoundingClientRect();
        const noRect=noEl?.getBoundingClientRect();
        const formationRect=formationEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom)||imageWidth;
        const imgHeight=(imgRect.height/mobileZoom)||actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom)||12*uiScale*1.05;
        const formationHeight=(formationRect?.height/mobileZoom)||0;
        // 列車画像（列車番号・編成表示を含む）の中心を駅の中心へ合わせる。
        // 行先・種別ラベルはその下に配置するため、位置計算からは除外する。
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-(noHeight+imgHeight+formationHeight)/2;
        el.style.top=`${finalTop}px`;
        el.style.left=`${trainLeft}px`;
        el.style.right='auto';
        el.style.setProperty('--lane-shift','0px');
        el.style.transform='none';
        el.style.visibility='visible';
        entry.ready=true;
        entry.layoutHeight=el.getBoundingClientRect().height/mobileZoom||48;
      };

      const img=el.querySelector('img');
      if(img?.complete&&img.naturalWidth){
        applyFinalPosition();
      }else if(img){
        img.addEventListener('load',applyFinalPosition,{once:true});
        // 画像URLが404・通信失敗だと、以前の処理では load が発生せず、
        // 列車要素を visibility:hidden のまま残してしまう。
        // まず共通の既定画像を試し、それも失敗したら画像なしで列車ラベルを表示する。
        const handleTrainImageError=()=>{
          const currentSrc=String(img.getAttribute('src')||'');
          const commonFallback=String(fallbackTrainImageUrl()||'').trim();
          if(img.dataset.commonFallbackTried!=='1' && commonFallback && currentSrc!==commonFallback){
            img.dataset.commonFallbackTried='1';
            img.setAttribute('src',commonFallback);
            return;
          }
          img.removeEventListener('error',handleTrainImageError);
          img.style.display='none';
          applyFinalPosition();
        };
        img.addEventListener('error',handleTrainImageError);
        el.style.visibility='hidden';
        // キャッシュ済みの失敗画像は error イベントが発火済みの場合があるため、ここでも処理する。
        if(img.complete && !img.naturalWidth) handleTrainImageError();
      }
    });
  });
}

function getStationDirectionLabels(stationName){
  const name=String(stationName||'');
  const stationDefs=activeJson?.stationDirections;
  const direct=stationDefs&&typeof stationDefs==='object' ? stationDefs[name] : null;
  if(direct && typeof direct==='object'){
    const up=String(direct.up||''), down=String(direct.down||'');
    if(activeRouteName==='大阪環状線' && activeJson?.circular===true){
      return {
        up:up.startsWith('内回り')?up:`内回り ${up}`,
        down:down.startsWith('外回り')?down:`外回り ${down}`
      };
    }
    return {up,down};
  }
  const routeKey=String(activeRouteName||'');
  const routeDefs=activeJson?.routeDirections;
  const route=routeDefs&&typeof routeDefs==='object' ? routeDefs[routeKey] : null;
  if(route && typeof route==='object'){
    const up=String(route.up||''), down=String(route.down||'');
    if(activeRouteName==='大阪環状線' && activeJson?.circular===true){
      return {
        up:up.startsWith('内回り')?up:`内回り ${up}`,
        down:down.startsWith('外回り')?down:`外回り ${down}`
      };
    }
    return {up,down};
  }
  const lineNames=getActiveRouteLineNames();
  for(const lineName of lineNames){
    const line=lineDefByName(lineName);
    const d=line?.directions;
    if(d && typeof d==='object'){
      const up=String(d.up||''), down=String(d.down||'');
      if(activeRouteName==='大阪環状線' && activeJson?.circular===true){
        return {up:up.startsWith('内回り')?up:`内回り ${up}`,down:down.startsWith('外回り')?down:`外回り ${down}`};
      }
      return {up,down};
    }
  }
  // デフォルト方面はJSONの定義を使用し、未定義の場合は空欄。
  return {up:'',down:''};
}

function serviceDayMinute(hour,minute){
  const total=Number(hour)*60+Number(minute);
  return total<180 ? total+1440 : total;
}

function stationTimetableHTML(station, selectedDirection='up'){
  // 駅時刻表も選択日付から直接ダイヤ区分を同期。
  syncCurrentScheduleDay();
  const stationName=String(station?.nameJa||'');
  const directionLabels=getStationDirectionLabels(stationName);
  const directionData={up:{label:directionLabels.up,entries:[]},down:{label:directionLabels.down,entries:[]}};
  const byTrain=new Map();

  // 西九条は大阪環状線とゆめ咲線の共通駅。大阪環状線を選択している
  // 場合でも、ゆめ咲線内完結列車（西九条始発→桜島）を駅時刻表へ追加する。
  // 到着のみの列車（桜島→西九条）は、駅時刻表が発車時刻表のため従来通り除外。
  const stationTimetableExtraTrains=[];
  if(activeRouteName==='大阪環状線' && stationName==='西九条'){
    const shared=activeJson?._sharedRoutes;
    const yume=shared&&typeof shared==='object' ? shared['ゆめ咲線'] : null;
    const sourceDay=syncCurrentScheduleDay()==='休日' ? '土休日' : '平日';
    for(const direction of ['上り','下り']){
      const rawList=Array.isArray(yume?.trains?.[sourceDay]?.[direction]) ? yume.trains[sourceDay][direction] : [];
      for(const raw of rawList){
        if(String(raw?.start||'')!=='西九条') continue;
        if(String(raw?.dest||'')==='西九条') continue;
        stationTimetableExtraTrains.push(...normalizeExternalTrain(raw, syncCurrentScheduleDay(), direction, ROUTE_REGISTRY['ゆめ咲線']));
      }
    }
  }

  // 当日の全列車を常に表示し、スクロール位置だけを「次発」に合わせる。
  // 駅時刻表は「その駅から発車する列車」を掲載する。
  // したがって終着が天王寺でも、天王寺始発なら発車時刻を掲載する。
  // 一方、添付時刻表で「環状運転」となっている天王寺始発・天王寺終着の列車は、
  // 実際の終着列車ではないため、この駅時刻表の「天王寺止まり」枠には入れない。
  [...getVisibleTrains(), ...stationTimetableExtraTrains].forEach(train=>{
    const isCircular=isCircularTrain(train);
    const isOrigin=String(train?.start||'')===stationName;
    const isTerminal=getShortDest(train?.dest||'')===stationName;
    if(isTerminal && !isOrigin) return;
    if(isCircular && isOrigin && isTerminal) return;
    // 駅の時刻表には回送列車を掲載しない。
    if(String(train?.type||'')==='回送') return;
    const stops=(train.stops||[]).filter(stop=>String(stop?.station||'')===stationName);
    if(!stops.length) return;
    // 始発駅は最初の停車情報＝発車時刻、終着・途中駅は最後の停車情報を使用。
    const stop=isOrigin ? stops[0] : stops[stops.length-1];
    const time=String(stop?.departure||stop?.time||stop?.arrival||'');
    const m=time.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return;
    const hour=Number(m[1]), minute=Number(m[2]);
    if(!Number.isFinite(hour)||!Number.isFinite(minute)) return;
    const bucket=String(train?.direction||'up')==='down'?'down':'up';
    byTrain.set(`${bucket}:${String(train.no)}`,{train,hour,minute,time,bucket});
  });

  Array.from(byTrain.values())
    .sort((a,b)=>serviceDayMinute(a.hour,a.minute)-serviceDayMinute(b.hour,b.minute)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}))
    .forEach(entry=>directionData[entry.bucket].entries.push(entry));

  const escapeAttr=value=>String(value)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeJs=value=>String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const stationTimetableFormationParts=(train)=>{
    const formationId=effectiveFormationIdForTrain(train);
    const obj=selectionDisplayObjectForTrain(train,formationId);
    if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) return ['—'];
    const type=String(obj.type||'').trim();
    const name=String(obj.name||'').trim();
    if(obj.displayAsFullName) return [name];

    // 形式名を含む選択肢は、形式と個体差を2行で表示する。
    // 形式と要素を分離して2行で表示する。
    if(type && name){
      if(name===type) return [type];
      if(name.startsWith(type)){
        const element=name.slice(type.length).trim();
        return element ? [type, element] : [type];
      }
      // 「10030型 / 未更新」のようにnameが要素だけの場合。
      if(obj.kind==='variant') return [type, name];
    }

    const m=name.match(/^(.*?型)(.+)$/);
    if(m) return [m[1],m[2].trim()];
    return [name];
  };
  const stationTimetableFormationHTML=(train)=>{
    const parts=stationTimetableFormationParts(train);
    // 形式名の「系・形・型」の直後で折り返し、編成表示を読みやすくする。
    const lines=parts.flatMap(value=>{
      const text=String(value??'').trim();
      const match=text.match(/^([\s\S]*?[系形型])\s*(.+)$/);
      return match?[match[1].trim(),match[2].trim()]:[text];
    });
    return `<span class="station-timetable-formation">${lines.map(x=>`<span class="station-timetable-formation-line">${escapeAttr(x)}</span>`).join('')}</span>`;
  };

  const renderDirection=(key)=>{
    const data=directionData[key];
    if(!data.entries.length) return '';

    const now=currentMinutes();
    const nowService=serviceDayMinute(Math.floor(now/60), now%60);
    let nextIndex=data.entries.findIndex(entry=>serviceDayMinute(entry.hour,entry.minute)>=nowService);
    if(nextIndex<0) nextIndex=0;

    const rows=data.entries.map((item,index)=>{
      const train=item.train;
      const effectiveFormationId=effectiveFormationIdForTrain(train);
      const selectedForm=selectionDisplayObjectForTrain(train,effectiveFormationId);
      const imgSrc=imageForTrain(train);
      const destination=`${getDisplayDestinationForTrain(train)}${destinationGoSuffix(train)}`;
      const isNext=index===nextIndex;
      const isOrigin=String(train?.start||'')===stationName;

      return `
        <button
          class="station-timetable-row${isNext?' is-next':''}"
          type="button"
          data-next-train="${isNext?'true':'false'}"
          title="列車 ${escapeAttr(trainDisplayNoAtStation(train,stationName))} / ${escapeAttr(item.time)} / ${escapeAttr(destination)}"
          onclick="openSheet('${escapeJs(train.no)}',true,'${escapeJs(train.direction||stationTimetableDirection)}')"
        >
          ${isOrigin
            ? '<span class="station-timetable-start-label" aria-label="始発">始発</span>'
            : '<span class="station-timetable-start-label placeholder" aria-hidden="true"></span>'}
          <span class="station-timetable-train-cell">
            <img class="station-timetable-train-img" src="${escapeAttr(imgSrc)}" alt="${escapeAttr(trainDisplayNoAtStation(train,stationName))}">
            ${stationTimetableFormationHTML(train)}
          </span>
          <span class="station-timetable-time">${escapeAttr(item.time)}</span>
          ${String(train.type||'').trim()?`<span class="station-timetable-type ${escapeAttr(getTrainTypeDisplayClass(train))}" style="${typeBadgeInlineStyle(train,null,stationDirectionRouteColor(STATIONS.findIndex(st=>String(st?.nameJa||'')===stationName),key),stationName)}">${escapeAttr(getTrainTypeDisplayLabel(train))}</span>`:''}
          <span class="station-timetable-destination">
            <span class="station-timetable-destination-main"><span class="station-timetable-destination-station">${escapeAttr(getDisplayDestinationForTrain(train))}</span>${destinationGoSuffix(train)?'<span class="station-timetable-destination-go">行</span>':''}</span>
          </span>
        </button>
      `;
    }).join('');

    return `<section class="station-timetable-direction" data-direction="${key}">${rows}</section>`;
  };

  const html=renderDirection(selectedDirection);
  if(!html) return `<div class="station-timetable-empty">この方面の時刻表はありません。</div>`;
  return `
    <div class="station-timetable-frame">
      <div class="station-timetable-wrap" id="stationTimetableScroll">
        ${html}
      </div>
    </div>
  `;
}

function formationStorageEntryForTrain(train){
  if(!train) return null;
  const ctx=formationStorageContext(train);
  const area=ctx.area || '__ROOT__';
  const date=String(selectedDateKey||operationDateKey());
  const rawNo=String(train.no||'').trim();
  if(!rawNo) return null;
  const stored=formationRemoteByFamily[ctx.family]?.areaStateByDate?.[date]?.[area]||{};
  const entryForNo=(no)=>{
    const key=String(no||'').trim();
    if(!key) return null;
    if(stored[key]) return stored[key];
    const normalized=normalizeTrainNo(key);
    if(!normalized) return null;
    for(const [savedNo,entry] of Object.entries(stored)){
      if(normalizeTrainNo(savedNo)===normalized) return entry;
    }
    return null;
  };

  // 編成自体は従来どおり列番単位で保存する。
  // 表示用の入力日時・登録者は、同じ運用チェーン内の全列番で共有する。
  // そのチェーン内の登録情報から、最も新しい入力日時・登録者を選ぶ。
  const chainInfo=findChain(currentDay,rawNo);
  const chain=chainInfo?(OPERATION_CHAINS?.[currentDay]?.[chainInfo.chainIndex]||[]):[];
  const linkedNos=[rawNo];
  for(const item of chain){
    const no=String(item?.no||item||'').trim();
    if(no && !linkedNos.some(x=>normalizeTrainNo(x)===normalizeTrainNo(no))) linkedNos.push(no);
  }

  const registered=[];
  for(const no of linkedNos){
    const entry=entryForNo(no);
    if(entry && String(entry.f||'').trim()) registered.push({no,entry});
  }
  if(!registered.length) return entryForNo(rawNo)||null;

  // 表示中の列番自身の編成を優先し、未登録ならチェーン内の登録編成を引き継ぐ。
  const formationSource=registered.find(x=>normalizeTrainNo(x.no)===normalizeTrainNo(rawNo))||registered[0];
  const hasMeta=registered.filter(x=>String(x.entry.t??x.entry.time??'').trim());
  const stampScore=(entry)=>{
    const raw=String(entry?.t??entry?.time??'');
    const parsed=typeof window.parseStoredMeta==='function'?window.parseStoredMeta(raw):null;
    const stamp=String(parsed?.stamp||'');
    if(!/^\d{10}$/.test(stamp)) return -1;
    const yy=Number(stamp.slice(0,2)), mm=Number(stamp.slice(2,4)), dd=Number(stamp.slice(4,6));
    const hh=Number(stamp.slice(6,8)), mi=Number(stamp.slice(8,10));
    return Date.UTC(2000+yy,mm-1,dd,hh,mi);
  };
  let metaSource=null;
  if(hasMeta.length){
    metaSource=hasMeta.slice().sort((a,b)=>stampScore(b.entry)-stampScore(a.entry))[0];
    // 旧形式で実時刻がない場合も、少なくともチェーン内の登録者情報を共有する。
    if(stampScore(metaSource.entry)<0){
      metaSource=hasMeta.find(x=>normalizeTrainNo(x.no)===normalizeTrainNo(rawNo))||hasMeta[0];
    }
  }

  const combined={...formationSource.entry};
  if(metaSource){
    combined.t=metaSource.entry.t??metaSource.entry.time??'';
    if(metaSource.entry.r) combined.r=metaSource.entry.r;
    else delete combined.r;
  }
  return combined;
}
function formationUpdatedAuthorForTrain(trainNo){
  const key=String(trainNo||'');
  const train=(currentTrainSnapshot&&String(currentTrainSnapshot.no||'')===key)?currentTrainSnapshot:trainForCurrentDay(key,currentTrainSnapshot?.direction||null);
  const entry=formationStorageEntryForTrain(train);
  if(!entry) return null;
  const text=String(entry.t||'');
  const at=text.indexOf('@');
  if(at<0) return null;
  const name=text.slice(at+1).trim();
  return name?{name}:null;
}

function formatFormationUpdatedAt(trainNo){
  const key=String(trainNo||'');
  const train=(currentTrainSnapshot&&String(currentTrainSnapshot.no||'')===key)
    ? currentTrainSnapshot
    : trainForCurrentDay(key,currentTrainSnapshot?.direction||null);
  if(!train) return '';
  const entry=formationStorageEntryForTrain(train);
  if(!entry?.f) return '';
  // 新形式 t=「分@登録名」を優先し、将来のaフィールドや旧形式にも対応する。
  const rawMeta=entry.t??entry.time??'';
  const parsed=parseStoredMeta(rawMeta);
  if(parsed){
    const hh=String(Math.floor(Number(parsed.time)/60)).padStart(2,'0');
    const mm=String(Number(parsed.time)%60).padStart(2,'0');
    let datePrefix='';
    // 登録日時が保存されている場合、今日なら時刻のみ、今年の過去日ならMM/DD、
    // 去年以前ならYYYY/MM/DDを時刻の前に表示する。
    if(parsed.stamp && /^\d{10}$/.test(parsed.stamp)){
      const yy=Number(parsed.stamp.slice(0,2));
      const year=2000+yy;
      const month=Number(parsed.stamp.slice(2,4));
      const day=Number(parsed.stamp.slice(4,6));
      const now=new Date();
      const todayYear=now.getFullYear();
      const todayMonth=now.getMonth()+1;
      const todayDay=now.getDate();
      const isBeforeToday=(year<todayYear)||(year===todayYear&&(month<todayMonth||(month===todayMonth&&day<todayDay)));
      if(year<todayYear){
        datePrefix=`${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')} `;
      }else if(year===todayYear && isBeforeToday){
        datePrefix=`${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')} `;
      }
    }
    return `${datePrefix}${hh}:${mm}${parsed.author?` @${parsed.author}`:''}`;
  }
  return formatStoredMeta(rawMeta);
}

async function registerFormationFromInput(){
  if(!formationInputAllowed()) return;
  const input=document.getElementById('formationManualInput');
  const errorEl=document.getElementById('formationInputError');
  const value=String(input?.value||'').trim();
  if(errorEl) errorEl.textContent='';
  if(!value){
    if(errorEl) errorEl.textContent='車両番号または編成番号を入力してください。';
    input?.focus();
    return;
  }
  const result=formationIdFromInput(value);
  if(!result.ok){
    if(errorEl) errorEl.textContent=result.error;
    input?.focus();
    return;
  }
  if(UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(result.id))){
    if(errorEl) errorEl.textContent='この編成は入力できません。';
    input?.focus();
    return;
  }
  await selectFormation(result.id);
}

let formationDropdownPortalState=null;
function closeFormationDropdown(){
  const el=document.getElementById('dropdownOptions');
  if(!el) return;
  el.classList.remove('open');
  el.style.display='';
  el.style.position='';
  el.style.maxHeight='';
  el.style.left='';el.style.top='';el.style.width='';
  el.style.pointerEvents='';
  if(el.classList.contains('dropdown-portal') && formationDropdownPortalState){
    const state=formationDropdownPortalState;
    if(state.parent && state.parent.isConnected){
      if(state.nextSibling && state.nextSibling.parentNode===state.parent) state.parent.insertBefore(el,state.nextSibling);
      else state.parent.appendChild(el);
    }
    formationDropdownPortalState=null;
    el.classList.remove('dropdown-portal');
  }
}
function positionFormationDropdown(el,trigger){
  const rect=trigger.getBoundingClientRect();
  const vv=window.visualViewport;
  const topBound=Number(vv?.offsetTop||0)+6;
  const leftBound=Number(vv?.offsetLeft||0)+6;
  const viewportW=Number(vv?.width||window.innerWidth);
  const viewportH=Number(vv?.height||window.innerHeight);
  const viewportTop=Number(vv?.offsetTop||0);
  const viewportBottom=viewportTop+viewportH;
  // 画面下部に固定される地域メニューと重ならないよう、メニュー上端を下端とする。
  const regionNav=document.getElementById('regionNav');

const OPERATION_INFO_STORAGE_KEY='routeOperationInfo_v2';

function operationInfoNormalizeName(name){return String(name??'').normalize('NFKC').replace(/\u3000/g,' ').trim();}
function operationInfoFindPath(start,end){
  start=operationInfoNormalizeName(start); end=operationInfoNormalizeName(end);
  const a=OPERATION_INFO_STATIONS.indexOf(start), b=OPERATION_INFO_STATIONS.indexOf(end);
  if(a<0||b<0||a===b) return null;
  const step=a<b?1:-1, path=[];
  for(let i=a;;i+=step){ path.push(OPERATION_INFO_STATIONS[i]); if(i===b) break; }
  return path.length>=2?path:null;
}
function operationInfoUndirectedKey(a,b){return [String(a||''),String(b||'')].sort().join('\u0000');}
function operationInfoPathEdges(stations){const set=new Set();for(let i=0;i<stations.length-1;i++)set.add(operationInfoUndirectedKey(stations[i],stations[i+1]));return set;}
function operationInfoSubtractEdges(stations,blocked){
  const parts=[]; let cur=[];
  for(let i=0;i<stations.length-1;i++){
    const a=stations[i],b=stations[i+1];
    if(blocked.has(operationInfoUndirectedKey(a,b))){if(cur.length>=2)parts.push(cur);cur=[];continue;}
    if(!cur.length)cur=[a]; cur.push(b);
  }
  if(cur.length>=2)parts.push(cur);

}
function operationInfoDelayValue(value){if(value===null||value===undefined||String(value)==='')return'unknown';const n=Number(value);return Number.isFinite(n)&&n>0?n:'unknown';}

function normalizeOperationEntry(e){

  if(!stations||stations.length<2) return null;
  return {...e,start:stations[0],end:stations.at(-1),stations,route:String(e?.route||'').trim(),status:e?.status==='suspend'?'suspend':'delay',delay:e?.status==='suspend'?'unknown':operationInfoDelayValue(e?.delay),note:String(e?.note??e?.remarks??'').trim()};

function operationInfoVisibleSegments(){

  });

  const boundaryNames=new Set();
  const rawSegments=[];

      };
      const ar=getRows(a,routeA),br=getRows(b,routeB);
      if(!ar.length||!br.length)continue;

      let best=null;
      for(const x of ar)for(const y of br){
        if(x.index===y.index)continue;
        const lo=Math.min(x.index,y.index),hi=Math.max(x.index,y.index);
        const dist=hi-lo;
        if(!best||dist<best.distance)best={a:x,b:y,lo,hi,distance:dist};
      }
      if(!best)continue;

      rawSegments.push({
        lo:best.lo,hi:best.hi,rowA:best.a,rowB:best.b,
        routeA,routeB,status:e.status==='suspend'?'suspend':'delay',
        delay:operationInfoDelayValue(e.delay),entryId:e.id,createdAt:Number(e.createdAt)||0,
        stationA:a,stationB:b
      });
    }
  }

  const picked=new Map();
  for(const seg of rawSegments){
    const edgeKey=operationInfoUndirectedKey(seg.stationA,seg.stationB);
    const key=`${seg.entryId}\u0000${edgeKey}`;
    const prev=picked.get(key);
    if(!prev||seg.createdAt>=prev.createdAt)picked.set(key,seg);
  }
  return {rows,segments:[...picked.values()]};
}

function renderOperationInfoZones(){
  if(activeJson?.circular===true || activeRouteName==='ゆめ咲線'){
    const layer0=document.getElementById('operationInfoLayer');
    if(layer0) layer0.innerHTML='';
    const labelLayer0=document.getElementById('operationInfoLabelLayer');
    if(labelLayer0) labelLayer0.innerHTML='';
    return;
  }
  const layer=document.getElementById('operationInfoLayer');
  if(!layer)return;
  layer.innerHTML='';
  const labelLayer=document.getElementById('operationInfoLabelLayer');
  if(labelLayer)labelLayer.innerHTML='';
  const {rows,segments}=operationInfoVisibleSegments();
  if(rows.length<2||!segments.length)return;

  const fixedZoneWidth=700;
  const pieces=[];
  const boundaryNames=new Set();

  for(const seg of segments){
    const lo=Math.min(seg.rowA.index,seg.rowB.index),hi=Math.max(seg.rowA.index,seg.rowB.index);
    if(seg.routeA===seg.routeB){
      let runStart=lo;
      for(let i=lo+1;i<=hi;i++){
        const route='keihinTohoku';
        if(route!==seg.routeA){
          if(i-1>=runStart)pieces.push({...seg,lo:runStart,hi:i-1});
          runStart=i+1;
        }
      }
      if(runStart<=hi)pieces.push({...seg,lo:runStart,hi});
    }else{
      pieces.push({...seg,lo,hi});
    }
  }

  const groups=[];
  const orderedPieces=[...pieces]
    .filter(p=>p.lo!==p.hi)
    .sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
  for(const p of orderedPieces){
    const last=groups[groups.length-1];
    // 同じ状態でも「端の駅を共有する区間」だけを統合する。
    // A-B と B-C は B を共有するので1つに連続させるが、
    // A-B と C-D は B-C が空いているため別グループのままにする。
    if(last && last.status===p.status && p.lo<=last.hi){
      last.lo=Math.min(last.lo,p.lo);
      last.hi=Math.max(last.hi,p.hi);
      last.delay=(last.delay==='unknown'?p.delay:(p.delay==='unknown'?last.delay:Math.max(Number(last.delay),Number(p.delay))));
      last.entryIds.add(p.entryId);
      last.stationStart=rows[last.lo]?.querySelector('.station-name-ja')?.textContent||last.stationStart;
      last.stationEnd=rows[last.hi]?.querySelector('.station-name-ja')?.textContent||last.stationEnd;
      if(last.routeA!==p.routeA) last.routeA=p.routeA;
      if(last.routeB!==p.routeB) last.routeB=p.routeB;
    }else{
      groups.push({
        lo:p.lo,hi:p.hi,status:p.status,delay:p.delay,
        routeA:p.routeA,routeB:p.routeB,
        entryIds:new Set([p.entryId]),
        stationStart:p.stationA,stationEnd:p.stationB
      });
    }
  }

  const labeledEntries=new Set();
  for(let gi=0;gi<groups.length;gi++){
    const g=groups[gi];
    const topRow=rows[g.lo],bottomRow=rows[g.hi];
    if(!topRow||!bottomRow)continue;

    if(g.hi-g.lo===1){
      const topName=operationInfoNormalizeName(topRow.querySelector('.station-name-ja')?.textContent||'');
      const bottomName=operationInfoNormalizeName(bottomRow.querySelector('.station-name-ja')?.textContent||'');
      if(boundaryNames.has(topName)||boundaryNames.has(bottomName))continue;
    }

    let top=topRow.offsetTop;
    let bottom=bottomRow.offsetTop+bottomRow.offsetHeight;

    const prev=groups[gi-1],next=groups[gi+1];

    // ここでは「zoom前のレイアウト座標」を使う。
    // スマホ表示では #viewportCanvas 全体が zoom されるため、
    // getBoundingClientRect() の縮小後座標をそのまま zone.style.top に使うと
    // PCとスマホで位置が変わってしまう。station-row の offsetTop/offsetHeight は
    // zoom前の座標なので、zone の top/height と同じ座標系で計算する。
    const stationCenterY=(row)=>row ? row.offsetTop + row.offsetHeight/2 : null;

    // 前後の長方形が「同じ駅を境界に共有」する場合は、その駅の中心を境界にして
    // 上下10pxずつ離す。状態が同じでも別登録として残っている場合はここで処理する。
    if(prev){
      if(prev.hi===g.lo){
        const boundaryRow=rows[g.lo];
        const center=stationCenterY(boundaryRow);
        if(center!=null) top=center+10;
      }else if(prev.hi+1===g.lo){
        // A-B と C-D のように B と C が隣駅で間に未設定区間がある場合は、
        // B と C の駅中心の中間地点を境界にして上下10pxずつ離す。
        const upperCenter=stationCenterY(rows[prev.hi]);
        const lowerCenter=stationCenterY(rows[g.lo]);
        if(upperCenter!=null&&lowerCenter!=null) top=(upperCenter+lowerCenter)/2+10;
      }
    }

    if(next){
      if(next.lo===g.hi){
        const boundaryRow=rows[g.hi];
        const center=stationCenterY(boundaryRow);
        if(center!=null) bottom=center-10;
      }else if(next.lo===g.hi+1){
        // A-B と C-D のように B と C が隣駅で間に未設定区間がある場合は、
        // B と C の駅中心の中間地点を境界にして上下10pxずつ離す。
        const upperCenter=stationCenterY(rows[g.hi]);
        const lowerCenter=stationCenterY(rows[next.lo]);
        if(upperCenter!=null&&lowerCenter!=null) bottom=(upperCenter+lowerCenter)/2-10;
      }
    }

    if(bottom<=top)continue;

    const zone=document.createElement('div');
    zone.className=`operation-info-zone ${g.status==='suspend'?'suspend':''}`;
    zone.style.top=`${top}px`;
    zone.style.height=`${bottom-top}px`;
    zone.style.width=`${fixedZoneWidth}px`;
    zone.style.left=`calc(50% - ${fixedZoneWidth/2}px)`;
    layer.appendChild(zone);

    const id=[...g.entryIds][0];
    if(labelLayer&&id&&!labeledEntries.has(id)){
      labeledEntries.add(id);
      const label=document.createElement('button');
      label.type='button';
      label.className=`operation-info-zone-label ${g.status==='suspend'?'suspend':'delay'}`;
      label.textContent=g.status==='suspend'?'運転見合わせ':operationInfoDelayText(g.delay);
      const currentDate=operationInfoIsCurrentDate();
      label.title=currentDate?'運行情報の詳細を表示':'当日以外の運行情報は操作できません';
      label.setAttribute('aria-label',label.title);
      label.style.top=`${top+36}px`;
      label.style.left=`calc(50% + ${fixedZoneWidth/2-100}px)`;
      label.style.right='auto';
      label.style.transform='translateX(-100%)';
      label.disabled=!currentDate;
      if(currentDate) label.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showOperationInfoDetail(id);});
      labelLayer.appendChild(label);
    }
  }
}

window.addEventListener('resize',renderOperationInfoZones);


(function(){
  function syncControlBarLayout(){
    const title=document.getElementById('title');
    const bar=document.querySelector('.control-bar');
    const line=document.getElementById('lineContainer');
    if(!bar||!line)return;

    // スマホでは #title / .control-bar が960px基準でscaleされ、
    // #viewportCanvas 側も同じ比率でzoomされるため、路線図側の余白は
    // 「表示後の高さ」ではなく「zoom前の高さ」を設定する。
    const scale=(window.innerWidth<=959.98) ? (window.innerWidth/960) : 1;
    const titleRect=title?.getBoundingClientRect();
    const barRect=bar.getBoundingClientRect();
    const titleH=(titleRect?.height || (58*scale))/scale;
    const barH=(barRect.height || 0)/scale;

    line.style.marginTop=`${Math.ceil(titleH+barH)}px`;
    document.documentElement.style.setProperty('--control-bar-height',`${Math.ceil(barH)}px`);
  }
  window.addEventListener('load',syncControlBarLayout);
  window.addEventListener('resize',syncControlBarLayout);
  if(document.fonts?.ready) document.fonts.ready.then(syncControlBarLayout).catch(()=>{});
  setTimeout(syncControlBarLayout,0);
})();
</script>
