<style>
:root{
  /* JSON読み込み前のデフォルト色は灰色。路線読込後にh1色へ更新する。 */
  --primary:#808080;
  --primary-dark:#666666;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
  --control-accent:#808080;
  --control-border-color:#b3b3b3;
  --corporate-title-color:#808080;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0}
body{font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}

/* 日別・時刻フィルター */
#title{
    height: 58px;
    color: #fff;
    font-weight: 500;
    display: flex;
    background: #808080;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    justify-content: center;
    align-items: center;
    border-bottom: 8px solid #d9d9d9;
    z-index: 1000;
}

.control-bar{
  position:fixed;top:58px;left:0;right:0;z-index:999;
  margin-top:0;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.date-input{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;
  cursor:pointer;min-width:160px;
}
.schedule-day-label{font-weight:800;color:#555;white-space:nowrap}
.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}
.sync-btn{border:1px solid #bbb;background:#fff;color:#555;border-radius:999px;padding:5px 10px;cursor:pointer;font-weight:700}


/* 路線図 */
:root{--row-height:270px}
.line-container{
  position:relative;width:100%;max-width:none;margin:0 auto;
  padding:0;display:flex;flex-direction:column;align-items:center;
}

/* 固定コントロールバーの高さ分だけ路線図を下へ配置 */
#lineContainer{margin-top:calc(58px + var(--control-bar-height, 69px));}
.rail-line{
  position:absolute;top:135px;bottom:135px;left:50%;transform:translateX(-50%);
  width:12px;background:var(--rail-background,var(--primary));z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}

.station-row.fukuoka-branch-toggle-row{flex-direction:column;gap:8px;}
/* 分岐ボタンは共通の connection-button を使用。
   駅名標・共通操作など重複する部分は mainpage の既存スタイルを優先する。 */
.station-row.fukuoka-branch-anchor-row{flex-direction:column;gap:0;}
.station-row.fukuoka-branch-anchor-row .connection-buttons{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;max-width:860px;z-index:7;}
.station-row.fukuoka-branch-anchor-row .connection-top{margin-bottom:22px;}
.station-row.fukuoka-branch-anchor-row .connection-button{appearance:none;border:2px solid var(--button-color);border-radius:7px;padding:8px 18px;background:#fff;color:var(--button-color);box-shadow:0 2px 7px rgba(0,0,0,.20);font:700 15px/1.2 inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:150px;transition:filter .12s,transform .12s,background .12s,color .12s;}
.station-row.fukuoka-branch-anchor-row .connection-button:hover{filter:brightness(.96);transform:translateY(-1px);}
.station-row.fukuoka-branch-anchor-row .connection-button.active{background:var(--button-color);color:#fff;}
.station-badge{
  position:relative;width:384px;min-width:384px;height:auto;aspect-ratio:480 / 90;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  font-family:inherit;
  height:61.1111%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:45px;line-height:1;font-weight:500;
  letter-spacing:0;padding-left:0;
}
.station-name-en{
  font-family:inherit;
  height:33.3333%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 292px))}
.train-icon.right{right:max(6px,calc(50% - 292px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:60px;height:auto;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-formation{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;}
.train-formation > span{display:block;font:inherit;color:inherit;line-height:1.05;white-space:nowrap;}
.train-label{
  margin-top:2px;max-width:100px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:12px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#f2c400;color:#111}
.train-label-service-name{display:block;font-size:9.5px;font-weight:900;line-height:1.05;margin-bottom:2px;white-space:normal;overflow-wrap:anywhere;}
/* PCでは行先・種別を正式名称で表示し、スマートフォンでは従来の略称を使う。 */
.train-label-full{display:block;}
.train-label-short{display:none;}
@media(max-width:959.98px){
  .train-label-full{display:none;}
  .train-label-short{display:block;}
}
.train-label.b-express{background:#ffb6c1}
.train-label.a-express{background:#e83e8c}
.train-label.deadhead{background:#fff;color:#111;border:1px solid #bbb;}



/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  container-type:inline-size;
  position:fixed;left:0;right:0;bottom:calc(-100% - var(--sheet-bottom-offset,42px));z-index:101;
  max-width:820px;margin:0 auto;max-height:75vh;min-height:0;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
  visibility:hidden;
}
.bottom-sheet.active{bottom:var(--sheet-bottom-offset,42px);visibility:visible}
.bottom-sheet.editing{height:75vh;max-height:75vh;min-height:75vh;bottom:var(--sheet-bottom-offset,42px);visibility:visible}
.bottom-sheet.editing .sheet-content{min-height:calc(75vh - 58px)}

.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.sheet-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sheet-back-btn{
  display:none;width:28px;height:28px;border:0;background:transparent;color:#fff;
  padding:0;cursor:pointer;position:relative;flex:0 0 28px;
}
.sheet-back-btn::before{
  content:'';position:absolute;left:7px;top:6px;width:13px;height:13px;
  border-left:4px solid currentColor;border-bottom:4px solid currentColor;
  transform:rotate(45deg);
  box-sizing:border-box;
}
.sheet-back-btn.visible{display:inline-block;}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px;position:relative;overflow:hidden;min-height:0}
.timetable-list{margin-top:16px;position:relative;overflow:hidden;z-index:1}
.train-card{
  position:relative;
  background:#fff;border-radius:8px;padding:0;display:flex;
  align-items:center;gap:12px;margin-bottom:0;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.train-card.historical-readonly{cursor:default}
.train-card.historical-readonly:hover{border-color:transparent}
.station-info-card{cursor:default;border-color:var(--station-info-color,transparent);}
.station-placeholder{margin-top:12px;min-height:140px;}
.station-badge{cursor:pointer;}
.station-timetable-title{
  font-family:inherit;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px;
}
.station-timetable-direction-tabs{display:flex;gap:8px;margin:0 0 12px;justify-content:flex-start;}
.station-timetable-direction-tab{
  flex:0 0 50%;
  border:2px solid var(--station-direction-color,var(--primary));
  border-radius:6px;
  background:#fff;
  color:var(--station-direction-color,var(--text));
  font-family:inherit;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer;
}
.station-timetable-direction-tab.active{
  background:var(--station-direction-color,var(--primary));
  color:#fff;
}
.station-timetable-direction-tab:hover{
  background:color-mix(in srgb,var(--station-direction-color,var(--primary)) 10%,#fff);
}
.station-timetable-direction-tab.active:hover{
  background:var(--station-direction-color,var(--primary));
}

.station-timetable-frame{
  position:relative;
  margin-top:4px;
  height:53vh;
  background:#fff;
  border:3px solid #000;
  border-radius:11px;
  overflow:hidden;
  box-sizing:border-box;
}
.station-timetable-wrap{
  /* 530px以上は530px基準の固定サイズ。530px未満だけ幅に応じて縮小する。 */
  position:relative;
  container-type:inline-size;
  margin-top:0;
  background:#fff;
  border:0;
  border-radius:0;
  overflow-y:auto;
  overflow-x:hidden;
  height:100%;
  scroll-behavior:auto;
  box-sizing:border-box;
}
.station-timetable-direction{margin:0;padding:0;}
.station-timetable-empty{
  padding:24px 18px;
  text-align:center;
  font-family:inherit;
  color:#555;
}
.station-timetable-row{
  width:100%;
  min-height:108px;
  display:grid;
  /* 始発ラベル用の列を常に確保し、途中駅の列車も各パーツの位置をそろえる。 */
  grid-template-columns:42px 82px 92px 92px minmax(0,1fr);
  align-items:center;
  column-gap:8px;
  padding:8px 12px;
  border:0;
  color:#000;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
}
.station-timetable-row:nth-child(odd){background:#fff;}
.station-timetable-row:nth-child(even){background:#cfcfcf;}
.station-timetable-row:hover{filter:brightness(.97);}
.station-timetable-row:focus-visible{outline:3px solid rgba(0,0,0,.35);outline-offset:-3px;}
.station-timetable-start-label{
  width:42px;height:28px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;justify-self:center;
  background:var(--station-start-color,var(--primary));color:#fff;
  font-family:inherit;font-size:15px;line-height:1;font-weight:800;
  box-sizing:border-box;flex:none;
}
.station-timetable-start-label.placeholder{visibility:hidden;}
.station-timetable-train-cell{
  width:82px;
  min-width:0;
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  overflow:hidden;
}
.station-timetable-train-img{
  width:64px;
  height:68px;
  object-fit:contain;
  display:block;
  flex:0 0 auto;
  background:transparent;
}
.station-timetable-formation{
  width:100%;
  max-width:100%;
  color:#1b6e27;
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:12px;
  line-height:1.1;
  font-weight:700;
  white-space:nowrap;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  overflow:hidden;
  flex:0 0 auto;
}
.station-timetable-formation-line{
  display:block;
  max-width:100%;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.station-timetable-type{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:78px;height:34px;padding:0 10px;border-radius:7px;
  font-family:inherit;font-size:18px;line-height:1;font-weight:700;
  white-space:nowrap;text-align:center;box-sizing:border-box;
  background:#f2c400;color:#111;
}
.station-timetable-type.section-express{background:#fff;color:#111;}
.station-timetable-type.express{background:#f39800;color:#111;}
.station-timetable-type.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
.station-timetable-time{
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:32px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  letter-spacing:.01em;
}
.station-timetable-destination{
  font-family:inherit;
  font-size:32px;
  line-height:1;
  font-weight:500;
  white-space:nowrap;
  text-align:left;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  gap:.18em;
  height:1em;
}
.station-timetable-destination-main{display:flex;align-items:flex-end;justify-content:flex-start;gap:.18em;white-space:nowrap;}
.station-timetable-destination-station{font-size:1em;line-height:1;}
.station-timetable-destination-go{font-size:.8em;line-height:1;}
/* 530px未満のみ、530pxを100%とした比率で全パーツを縮小 */
@container (max-width:529px){
  .station-timetable-frame{
    border-width:.5660377cqw;
    border-radius:2.0754717cqw;
  }
  .station-timetable-empty{
    padding:4.5283019cqw 3.3962264cqw;
  }
  .station-timetable-row{
    min-height:20.3773585cqw;
    grid-template-columns:6.7924528cqw 12.8301887cqw 15.8490566cqw 15.0943396cqw minmax(0,1fr);
    column-gap:.5660377cqw;
    padding:1.1320755cqw 1.509434cqw;
  }
  .station-timetable-row:focus-visible{
    outline-width:.5660377cqw;
    outline-offset:-.5660377cqw;
  }
  .station-timetable-start-label{
    width:6.7924528cqw;height:5.2830189cqw;border-radius:.9433962cqw;font-size:2.4528302cqw;
  }
  .station-timetable-train-cell{
    width:12.8301887cqw;
    gap:.188679cqw;
  }
  .station-timetable-train-img{
    width:12.0754717cqw;
    height:12.4528302cqw;
  }
  .station-timetable-formation{
    width:100%;
    font-size:2.2641509cqw;
    line-height:1.1;
    gap:0;
  }
  .station-timetable-formation-line{
    line-height:1.1;
  }
  .station-timetable-time,
  .station-timetable-destination{
    font-size:6.0377358cqw;
  }
  .station-timetable-type{
    min-width:14.717cqw;height:6.415cqw;padding:0 .7547cqw;
    border-radius:1.321cqw;font-size:3.0189cqw;
  }
}
.station-badge:focus{outline:3px solid rgba(0,0,0,.35);outline-offset:4px;}

/* 駅情報：最初の項目 */
.station-overview-card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  margin-bottom:16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-overview-main{
  text-align:center;padding:8px 10px 9px;background:#fff;
}
.station-overview-name-ja{
  font-family:inherit;
  font-size:52px;line-height:.95;font-weight:500;letter-spacing:.08em;padding-left:.08em;color:#000;
}
.station-overview-name-en{
  font-family:inherit;
  font-size:29px;line-height:1.02;font-weight:500;letter-spacing:.015em;color:#000;
  margin-top:2px;
}
.station-direction-bar-wrap{width:100%;}
.station-direction-bar{
  width:100%;height:18px;
  background:linear-gradient(90deg,var(--station-prev-route-color,var(--primary)) 0 50%,var(--station-next-route-color,var(--primary)) 50% 100%);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
}
.station-direction-bar.no-prev{clip-path:polygon(0 0,97% 0,100% 100%,0 100%);}
.station-direction-bar.no-next{clip-path:polygon(3% 0,100% 0,100% 100%,0 100%);}
.station-direction-bar.no-prev.no-next{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.station-neighbor-row{display:flex;width:100%;min-height:54px;background:#fff;}
.station-neighbor{
  width:50%;display:flex;flex-direction:column;justify-content:flex-start;
  padding:2px 8px 8px;min-width:0;
}
.station-neighbor.left{text-align:left;align-items:flex-start;}
.station-neighbor.right{text-align:right;align-items:flex-end;}
.station-neighbor-name-ja{
  font-family:inherit;font-size:27px;line-height:1.05;font-weight:400;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.station-neighbor-name-en{
  font-family:inherit;font-size:14px;line-height:1.1;font-weight:500;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px;
}
.station-neighbor.empty{visibility:hidden;}

/* 駅情報の前後駅表示：パソコン時の820px幅を基準に、スマホでも全要素を同じ比率で縮小 */
@container (max-width:819px){
  .station-overview-card{
    margin-bottom:1.9512195cqw;
    border-width:.2439024cqw;
    border-radius:1.2195122cqw;
  }
  .station-overview-main{
    padding:.9756098cqw 1.2195122cqw 1.097561cqw;
  }
  .station-overview-name-ja{
    font-size:6.3414634cqw;
  }
  .station-overview-name-en{
    font-size:3.5365854cqw;
    margin-top:.2439024cqw;
  }
  .station-direction-bar{
    height:2.195122cqw;
  }
  .station-neighbor-row{
    min-height:6.5853659cqw;
  }
  .station-neighbor{
    padding:.2439024cqw .9756098cqw .9756098cqw;
  }
  .station-neighbor-name-ja{
    font-size:3.2926829cqw;
  }
  .station-neighbor-name-en{
    font-size:1.7073171cqw;
    margin-top:.1219512cqw;
  }
}

.train-card-img{width:75px;height:auto;object-fit:contain}
.train-info-main{flex:1;min-width:0}
.type-badge{background:#f2c400;color:#111;padding:3px 8px;border-radius:4px;font-size:.78rem;display:inline-block}
.type-badge.a-express{background:#f39800}
.type-badge.b-express{background:#f39800}
.train-title{font-size:0.95rem;font-weight:700;margin-left:6px}
.train-title.no-type{margin-left:0}
.train-number{color:#1b6e27;font-weight:800;float:right;margin-right:15px}
.formation-id{font-size:1.2rem;font-weight:800;color:#444 !important;margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}

/* スマホ版：1920pxの元レイアウトから中央960px（左右480pxずつをカット）を
   そのまま100vwへ縮小表示する。960px以上はデスクトップ表示を変更しない。 */
@media (max-width:959.98px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  #viewportCanvas{
    width:1920px;
    min-width:1920px;
    max-width:none;
    margin-left:-480px;
    zoom:calc(100vw / 960px);
  }
  #viewportCanvas,
  #viewportCanvas .line-container{
    width:1920px;
    min-width:1920px;
    max-width:none;
  }
}

/* 固定ヘッダー：表示領域を基準に固定。路線図キャンバスとは別レイヤー。 */
#title{position:fixed;top:0;left:0;right:0;width:100vw;height:58px;z-index:1000;display:flex;justify-content:center;align-items:center;}
#title > span:first-child{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;}
.control-bar{position:fixed;top:58px;left:0;right:0;width:100vw;max-width:none;z-index:999;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;}
#lineContainer{margin-top:calc(58px + var(--control-bar-height, 69px));}
/* スマホではh1とcontrol-barも960px基準で縮小表示する。
   画面中央を基準に縮小することで、文字サイズ・入力欄・ボタンの位置関係を維持する。 */
@media(max-width:959.98px){
  #title{
    width:960px;
    max-width:none;
    left:50%;
    right:auto;
    top:0;
    transform:translateX(-50%) scale(calc(100vw / 960px));
    transform-origin:top center;
  }
  .control-bar{
    width:960px;
    max-width:none;
    left:50%;
    right:auto;
    top:calc(58px * (100vw / 960px));
    transform:translateX(-50%) scale(calc(100vw / 960px));
    transform-origin:top center;
  }
}

  }
  const indexable=!routeName || routeMeta?.access?.public===true;
  document.title=title;
  const setMeta=(selector,attribute,value)=>{
    let node=document.querySelector(selector);
    if(!node){
      node=document.createElement('meta');
      const m=selector.match(/meta\[(name|property)="([^"]+)"\]/);
      if(m) node.setAttribute(m[1],m[2]);
      document.head.appendChild(node);
    }
    node.setAttribute(attribute,value);
  };
  setMeta('meta[name="description"]','content',description);
  setMeta('meta[name="robots"]','content',indexable?'index,follow':'noindex,nofollow');
  setMeta('meta[property="og:title"]','content',title);
  setMeta('meta[property="og:description"]','content',description);
  setMeta('meta[property="og:url"]','content',canonical);

  setMeta('meta[name="twitter:description"]','content',description);
  let canonicalNode=document.querySelector('link[rel="canonical"]');
  if(!canonicalNode){ canonicalNode=document.createElement('link'); canonicalNode.rel='canonical'; document.head.appendChild(canonicalNode); }

}

const FUKUOKA_MAIN_FALLBACK=[
  '福岡空港','東比恵','博多','祇園','中洲川端',
  '天神','赤坂','大濠公園','唐人町','西新','藤崎','室見','姪浜'

const FUKUOKA_HAKO_FALLBACK=[

  const names=src.map(x=>String(x||'').trim()).filter(x=>x&&master.has(x));
  return names.length ? names : FUKUOKA_MAIN_FALLBACK.filter(x=>master.has(x));

function fukuokaBranchStationNames(json=activeJson,meta=activeRouteMeta){
  const d=fukuokaDiagramConfig(json,meta);
  const master=fukuokaStationMaster(json);
  const junction=String(d?.junctionStation||'中洲川端').trim()||'中洲川端';
  const hakoLine=(Array.isArray(json?.lines)?json.lines:[]).find(line=>String(line?.name||'')==='箱崎線');
  /* JSONの箱崎線は「中洲川端→呉服町→…→貝塚」。
     路線図では上下を反転して「貝塚→…→呉服町」とし、中洲川端の直前へ差し込む。 */
  if(Array.isArray(hakoLine?.stations)&&hakoLine.stations.length){
    const names=hakoLine.stations
      .map(st=>String(st?.name||'').trim())
      .filter(name=>name&&name!==junction&&master.has(name));
    if(names.length) return names.reverse();
  }
  const configured=Array.isArray(d?.hakosakiInsert)?d.hakosakiInsert:[];
  const configuredSet=new Set(configured.map(x=>String(x||'').trim()).filter(Boolean));
  const src=(configured.length ? FUKUOKA_HAKO_FALLBACK.filter(x=>configuredSet.has(x)&&x!==junction) : FUKUOKA_HAKO_FALLBACK);
  return src.filter(x=>master.has(x)&&x!==junction);

function fukuokaDisplayedStationNames(json=activeJson,meta=activeRouteMeta){
  if(!isFukuokaCompositeRoute(meta)) return [];
  const d=fukuokaDiagramConfig(json,meta);
  const main=fukuokaMainStationNames(json,meta);
  if(!fukuokaHakozakiBranchOpen) return main;

  // 分岐先の駅列を、分岐駅の直前へ差し込む。
  // 福岡では中洲川端がその分岐駅なので、
  // 祇園 → 貝塚 → … → 呉服町 → 中洲川端
  // となる。
  const junction=String(d?.junctionStation||'中洲川端').trim() || '中洲川端';
  const branch=fukuokaBranchStationNames(json,meta);
  const out=[];
  for(const name of main){
    if(name===junction) out.push(...branch);

function fukuokaStationOverviewNeighbors(stationName,json=activeJson,meta=activeRouteMeta){
  if(!isFukuokaCompositeRoute(meta)) return null;
  const name=String(stationName||'').trim();
  if(!name) return null;
  const diagram=fukuokaDiagramConfig(json,meta);
  const main=fukuokaMainStationNames(json,meta);
  const branch=fukuokaBranchStationNames(json,meta); // 路線図上の順：貝塚→…→呉服町
  const junction=String(diagram?.junctionStation||'中洲川端').trim()||'中洲川端';
  let prev=null,next=null;

  if(fukuokaHakozakiBranchOpen && name===junction){
    // 分岐駅では、路線図上の直前は呉服町、直後は空港線側の天神。
    prev=branch[branch.length-1]||null;
    const i=main.indexOf(junction);
    next=i>=0&&i<main.length-1?main[i+1]:null;
  }else if(fukuokaHakozakiBranchOpen && branch.includes(name)){
    const sequence=[...branch,junction];
    const i=sequence.indexOf(name);
    prev=i>0?sequence[i-1]:null;
    next=i>=0&&i<sequence.length-1?sequence[i+1]:null;
  }else{
    // 空港線の駅は、箱崎線を図に差し込んでも空港線本来の前後駅を使う。
    const i=main.indexOf(name);
    if(i<0) return null;
    prev=i>0?main[i-1]:null;
    next=i>=0&&i<main.length-1?main[i+1]:null;
  }

  const colorFor=(a,b)=>a&&b
    ? (activeSegmentColors(a,b)[0]||activeRouteColors()[0]||'#666')
    : null;
  const prevColor=colorFor(prev,name);
  const nextColor=colorFor(name,next);
  const fallback=activeRouteColors()[0]||'#666';
  return {
    prev,next,
    prevColor:prevColor||nextColor||fallback,
    nextColor:nextColor||prevColor||fallback
  };
}

function buildStationsForRoute(json,meta){
  const fukuokaStations=buildFukuokaStationsForRoute(json,meta);
  if(fukuokaStations?.length) return fukuokaStations;
  const seen=new Set(),list=[];

  // 横浜線は東神奈川～大船が京浜東北・根岸線との共用区間。
  // Yokohama_2026.json 側の駅定義が東神奈川で途切れている場合でも、
  // 共有JSONとして読み込んだ京浜東北・根岸線の東神奈川～大船を継ぎ足す。
  // 横浜線側に既に大船まで登録されている場合も、共用区間を組み直すことで
  // 駅の重複や並び順の乱れを防ぐ。
  let stationSources=[];
  if(String(meta?.id||'')==='yokohama'){
    const yokohamaLine=(json?.lines||[]).find(x=>String(x?.name||'')==='横浜線');
    const keihinLine=(json?.lines||[]).find(x=>String(x?.name||'')==='京浜東北・根岸線');
    const yokohamaStations=Array.isArray(yokohamaLine?.stations)?yokohamaLine.stations:[];
    const keihinStations=Array.isArray(keihinLine?.stations)?keihinLine.stations:[];
    const yokohamaJunction=yokohamaStations.findIndex(st=>String(st?.name||'').trim()==='東神奈川');
    const keihinJunction=keihinStations.findIndex(st=>String(st?.name||'').trim()==='東神奈川');
    if(yokohamaJunction>=0 && keihinJunction>=0){
      stationSources=[[
        ...yokohamaStations.slice(0,yokohamaJunction+1),
        ...keihinStations.slice(keihinJunction+1)
      ]];
    }
  }
  if(!stationSources.length){
    stationSources=meta.jsonLines.map(lineName=>{
      const line=(json.lines||[]).find(x=>String(x?.name||'')===lineName);
      return Array.isArray(line?.stations)?line.stations:[];
    });
  }
  for(const stations of stationSources){
    for(const st of stations){
      const name=String(st?.name||'').trim();
      if(!name||seen.has(name)) continue;
      seen.add(name); list.push({id:`st${list.length+1}`,nameJa:name,nameEn:String(st?.nameEn||'')});
    }
  }
  const prepend=Array.isArray(meta?.prependStations)?meta.prependStations:[];
  if(prepend.length){
    const extra=prepend.map(st=>({id:`st${st.nameJa}`,nameJa:String(st.nameJa||''),nameEn:String(st.nameEn||'')})).filter(st=>st.nameJa&& !list.some(x=>x.nameJa===st.nameJa));
    list.unshift(...extra);
    list.forEach((x,i)=>x.id=`st${i+1}`);
  }
  return list;
}

  const own=list.map(x=>String(x||'').trim()).filter(Boolean);

      const directSource=Array.isArray(rawGroup?.items)?rawGroup.items:[];
      if(!rawVariants.length && !directSource.length) continue;

      const groupFamily=String(rawGroup?.family||rawGroup?.formationFamily||dataFamily||'').trim();
      const groupRouteNames=formationRouteNamesFromConfig(rawGroup);
      const type=String(rawGroup?.type||'').trim()||dataFamily||'編成';
      // 画像はJSONのimg/typeImg/imageをそのまま使用する。
      // 未指定時だけ形式デフォルト→noimageへフォールバックする。
      const typeImg=makeImg(rawGroup?.typeImg||rawGroup?.image||rawGroup?.img,
        jsonImageValue(json,activeRouteMeta,'formationDefaultImage')||json?.commonFormationIcon||json?.noImage);

      const normalizeItems=(source)=>{
        const items=[];
        for(const raw of (Array.isArray(source)?source:[])){
          const rawId=String(raw?.formation||raw?.id||raw?.name||'').trim();
          if(!rawId) continue;
          const displayId=rawId.replace(/F$/i,'');
          const carsArr=Array.isArray(raw?.carNames)
            ? raw.carNames.map(x=>String(x||'').trim()).filter(Boolean)
            : (Array.isArray(raw?.cars) ? raw.cars.map(x=>String(x||'').trim()).filter(Boolean) : []);
          const numericCars=Number(raw?.cars);
          const cars=carsArr.length || (Number.isFinite(numericCars)&&numericCars>0 ? numericCars : Number(raw?.carCount)||0);
          const item={
            id:displayId,
            name:String(raw?.name||displayId),
            img:makeImg(raw?.img||raw?.image,typeImg),
            cars,
            carNames:carsArr,
            disabled:!!raw?.disabled,
            family:groupFamily,
            routeNames:formationRouteNamesFromConfig(raw,groupRouteNames)
          };
          items.push(item);
          for(const car of carsArr){
            VEHICLE_TO_FORMATION[car]=item.id;
            const normalized=car.replace(/[^0-9A-Za-z一-龥]+/g,'');
            if(normalized) VEHICLE_TO_FORMATION[normalized]=item.id;
          }
        }
        return items;
      };

      const variants=[];
      for(const rawVariant of rawVariants){
        const variantId=String(rawVariant?.id||rawVariant?.name||'').trim();
        const variantName=String(rawVariant?.name||variantId).trim();
        if(!variantId || !variantName) continue;
        const variantItems=normalizeItems(rawVariant?.items);
        // 空のitemsを持つ個体差も選択肢として表示する（全編成を親カテゴリ直下に並べる構成に対応）。
        variants.push({
          id:variantId.replace(/F$/i,''),
          name:variantName,
          img:makeImg(rawVariant?.img||rawVariant?.image,typeImg),
          items:variantItems,
          family:groupFamily,
          kind:'variant',
          generic:true,
          displayAsFullName:true,
          routeNames:formationRouteNamesFromConfig(rawVariant,groupRouteNames)
        });
      }

      const directItems=normalizeItems(directSource);
      if(variants.length || directItems.length){
        out.push({
          type,
          typeImg,
          family:groupFamily,
          routeNames:groupRouteNames,
          selectableType:rawGroup?.selectableType!==false,
          // showTypeOption=false のグループはカテゴリ見出しを選択肢に表示せず、
          // その配下の個別編成だけを選択肢として並べる。
          showTypeOption:rawGroup?.showTypeOption!==false,
          variants,
          items:directItems
        });
      }
    }
    for(const [vehicle,formation] of Object.entries(json?.vehicleToFormation||{})){
      const c=String(vehicle||'').trim(), f=String(formation||'').replace(/F$/i,'').trim();
      if(c&&f) VEHICLE_TO_FORMATION[c]=f;
    }
    if(out.length) return out;
  }

  // 従来形式：単一の formationType。路線別visualが指定されている場合はそれを優先し、
  // 共有JSON内に別路線の個別編成があっても、現在路線へ誤表示しない。
  const lineVisual=activeLineVisuals(json,activeRouteMeta);
  const baseDeclaredType=String(json?.formationType||'').trim();
  const lineOverridesType=!!String(lineVisual?.formationType||'').trim() && declaredType!==baseDeclaredType;
  const formationSource=lineOverridesType ? [] : rawFormations;
  // 内房線の旧JSONは formationType を持たず、formations[] に
  // {formation, cars, image} を直接並べる形式。これをそのまま編成一覧として扱う。
  const inferredDeclaredType=(String(activeRouteName||'')==='内房線' && rawFormations.length)
    ? '内房線編成'
    : declaredType;
  if(inferredDeclaredType){
    const items=[];
    for(const raw of formationSource){
      const rawId=String(raw?.formation||raw?.id||'').trim();
      if(!rawId) continue;
      const displayId=rawId.replace(/F$/i,'');
      const carsArr=Array.isArray(raw?.cars)?raw.cars.map(x=>String(x||'').trim()).filter(Boolean):[];
      const cars=carsArr.length || Number(raw?.carCount)||2;
      /* 内房線：編成番号に対応する画像名を最終保証する。
         JSON側が旧画像名・noimageになっていても、指定された
         「形式_編成」命名で実画像をsrcへ入れる。
         noImageはonerror側でのみ使用する。 */
      const uchiboImageByFormation={
        ...Object.fromEntries(Array.from({length:12},(_,i)=>{const n=String(i+1).padStart(2,'0');return [`R${n}`,`E131_R${n}`]})),
        ...Object.fromEntries(Array.from({length:12},(_,i)=>{const n=String(i+1).padStart(2,'0');return [`F${n}`,`E235_F${n}`]})),
        ...Object.fromEntries(Array.from({length:4},(_,i)=>{const n=String(i+1);return [`J${n}`,`E235_J${n}`]})),
        C1:'E233_C1',C2:'E233_C2',C3:'E233_C3',C9:'E233_C9',
        C401:'209_C401',C602:'209_C602'
      };
      const rawImage=String(raw?.image||raw?.img||'').trim();
      const forcedImage=(String(activeRouteName||'')==='内房線' && uchiboImageByFormation[displayId])
        ? uchiboImageByFormation[displayId]
        : '';
      const item={
        id:displayId,
        name:String(raw?.name||`${displayId}編成`),
        img:makeImg(forcedImage || rawImage || jsonImageValue(json,activeRouteMeta,'formationDefaultImage')||json?.commonFormationIcon),
        cars,
        carNames:carsArr,
        family:dataFamily,
        routeNames:formationRouteNamesFromConfig(raw,formationRouteNamesFromConfig(lineVisual))
      };
      items.push(item);
      for(const car of carsArr){
        VEHICLE_TO_FORMATION[car]=item.id;
        const normalized=car.replace(/[^0-9A-Za-z一-龥]+/g,'');
        if(normalized) VEHICLE_TO_FORMATION[normalized]=item.id;
      }
    }
    for(const [vehicle,formation] of Object.entries(json?.vehicleToFormation||{})){
      const c=String(vehicle||'').trim(), f=String(formation||'').replace(/F$/i,'').trim();
      if(c&&f) VEHICLE_TO_FORMATION[c]=f;
    }
    const groupRouteNames=formationRouteNamesFromConfig(lineVisual);
    return items.length?[{type:inferredDeclaredType,typeImg:declaredTypeImg,family:dataFamily,routeNames:groupRouteNames,items}]:[];
  }

  // 227系A/S編成の従来データ。
  const groups={A:[],S:[]};
  const commonTypeImg=`${base}227-0.png`;
  for(const raw of rawFormations){
    const id=String(raw?.formation||'').trim(); if(!id) continue;
    const displayId=id.replace(/F$/i,'');
    const prefix=displayId[0]==='S'?'S':'A';
    const img=makeImg(raw?.image,`227_${encodeURIComponent(displayId)}`);
    const cars=Array.isArray(raw?.cars)?raw.cars.length:Number(raw?.cars)||2;
    const item={id:displayId,name:displayId,type:String(raw?.type||raw?.formationType||'227系'),img,cars,carNames:Array.isArray(raw?.cars)?raw.cars.slice():[],family:'hiroshima'};
    for(const car of (Array.isArray(raw?.cars)?raw.cars:[])){
      const c=String(car||''); if(!c) continue;
      VEHICLE_TO_FORMATION[c]=item.id;
      const m=c.match(/(\d+)$/); if(m) VEHICLE_TO_FORMATION[m[1]]=item.id;
    }
    groups[prefix].push(item);
  }
  const out=[];
  if(groups.A.length) out.push({type:'227系 A編成',typeImg:commonTypeImg,family:'hiroshima',items:groups.A});
  if(groups.S.length) out.push({type:'227系 S編成',typeImg:commonTypeImg,family:'hiroshima',items:groups.S});
  return out;
}

function normalizeExternalTrain(raw,day,direction,meta){
  if(!raw||!Array.isArray(raw.stops)||!raw.stops.length) return [];

  // 列車番号が存在する路線は従来どおり線区ごとの番号を使う。
  // 列車番号を持たない路線（例：神戸市営地下鉄 海岸線）は、JSONのidを
  // 内部識別子として使い、画面上では列車番号を非表示にする。
  const allowedLineNames=new Set(Array.isArray(meta?.jsonLines)?meta.jsonLines:[]);
  const rawTrainNumbers=(raw?.trainNumbers&&typeof raw.trainNumbers==='object')?raw.trainNumbers:{};
  const rawNo=normalizeTrainNo(raw?.no??raw?.trainNo??'');
  // 列車番号は「現在表示中の路線」だけでなく、JSONに収録された全線区分を保持する。
  // 可部線・呉線のページでも、山陽本線を走る列車の番号をその列車自身の番号として表示できるようにする。
  const rawNumberEntries=Object.entries(rawTrainNumbers).filter(([,val])=>Array.isArray(val));
  const hasTrainNumberFromObject=rawNumberEntries.some(([,val])=>val.some(n=>String(n??'').trim()));
  const hasTrainNumber=hasTrainNumberFromObject || !!rawNo;
  const numbersByLine={};
  const allNumbers=[];
  if(hasTrainNumber){
    for(const [lineName,arrRaw] of rawNumberEntries){
      const arr=[];
      for(const n of arrRaw){
        const normalized=normalizeTrainNo(n);
        if(!normalized) continue;
        if(!arr.includes(normalized)) arr.push(normalized);
        if(!allNumbers.includes(normalized)) allNumbers.push(normalized);
      }
      if(arr.length) numbersByLine[lineName]=arr;
    }
    if(rawNo && !allNumbers.includes(rawNo)) allNumbers.push(rawNo);
    if(rawNo && !rawNumberEntries.length) numbersByLine[String(raw?.lineKind||meta?.lineKind||'route')]=[rawNo];
    if(!allNumbers.length) return [];
  }

  const stops=raw.stops.map(st=>{
    const hasTime=!!String(st?.arrival||st?.departure||st?.time||'').trim();
    return {
      station:String(st?.station||''),
      arrival:String(st?.arrival||''),
      departure:String(st?.departure||''),
      time:String(st?.time||st?.departure||st?.arrival||''),
      routeColor:String(st?.routeColor||'').trim()||undefined,
      dottedBefore:st?.dottedBefore===true,
      segmentColors:Array.isArray(st?.segmentColors)
        ? st.segmentColors.map(c=>String(c||'').trim()).filter(Boolean)
        : undefined,
      // 色の位置(position)はJSONから読み込まず、表示用の駅間線を作る段階で色数から自動計算する。
      boardingOnly:st?.boardingOnly===true,
      alightingOnly:st?.alightingOnly===true,
      prescribedFormation:String(st?.prescribedFormation||'').trim()||undefined,
      platform:st?.platform||undefined,
      isStop:hasTime
    };
  }).filter(st=>st.station);
  if(!stops.length) return [];

  // 列車が実際に跨っている全線区名を色判定用コンテキストとして保持。
  // 列車番号を持たない単一路線では、現在の路線自体を使用する。
  let servedLineNames=Object.keys(rawTrainNumbers).filter(name=>lineDefByName(name));
  if(!servedLineNames.length){
    servedLineNames=[...allowedLineNames].filter(name=>lineDefByName(name));
  }
  const segmentLineNames=[];
  for(let i=0;i<stops.length-1;i++) segmentLineNames.push(preferredTrainServiceLine(stops[i].station,stops[i+1].station,{servedLineNames})?.name||null);

  const explicitChanges=Array.isArray(raw?.numberChanges)?raw.numberChanges:[];
  const numberSegments={};
  if(rawNo && !rawNumberEntries.length){
    const segmentKey=servedLineNames[0]||String(raw?.lineKind||meta?.lineKind||'route');
    numberSegments[segmentKey]=[{no:rawNo,from:0,to:stops.length-1}];
  }
  if(hasTrainNumber){
    for(const [lineName,nums] of Object.entries(numbersByLine)){
      if(nums.length===1){
        numberSegments[lineName]=[{no:nums[0],from:0,to:stops.length-1}];
        continue;
      }
      const changes=explicitChanges.filter(x=>String(x?.line||lineName)===lineName && String(x?.station||''));
      if(changes.length){
        const pts=[];
        for(const c of changes){
          const idx=stops.findIndex(st=>st.station===String(c.station));
          if(idx>=0) pts.push({index:idx,after:Number(c.afterIndex ?? 1)});
        }
        pts.sort((a,b)=>a.index-b.index);
        const segs=[];
        let from=0,numberIndex=0;
        for(const p of pts){
          const afterIndex=Math.max(1,Math.min(nums.length-1,Number(p.after)||1));
          segs.push({no:nums[Math.min(numberIndex,nums.length-1)],from,to:p.index});
          numberIndex=afterIndex; from=p.index;
        }
        segs.push({no:nums[Math.min(numberIndex,nums.length-1)],from,to:stops.length-1});
        numberSegments[lineName]=segs;
      }else{
        numberSegments[lineName]=[{no:nums[0],from:0,to:stops.length-1}];
      }
    }
  }

  const firstTimed=stops.find(st=>st.isStop) || {};
  const lastTimed=[...stops].reverse().find(st=>st.isStop) || firstTimed;
  const internalNo=hasTrainNumber
    ? (allNumbers[0]||rawNo)
    : String(raw?.id||raw?.uid||`${day}-${direction}-${String(firstTimed.station||'')}-${String(firstTimed.time||'')}`);
  // noTrainTypes=true の路線は、JSON内にtype値が残っていても種別として扱わない。
  // 神戸市営地下鉄と樽見鉄道のような種別表示なしの路線に対応する。
  const suppressTrainTypes=meta?.noTrainTypes===true || activeJson?.noTrainTypes===true;
  const jsonType=suppressTrainTypes?'':String(raw?.type||'').trim();
  const formationFamily=String(meta?.formationFamily||formationStorageContext(meta?.id||activeRouteName).family||'').trim();
  const parsedDefaultCars=Number(raw?.cars);
  const fallbackCars=Number(String(raw?.defaultCars||'').match(/\d+/)?.[0]||0);
  return [{
    no:internalNo,
    hasTrainNumber,
    hideTrainNumber:!hasTrainNumber || meta?.noTrainNumbers===true || activeJson?.noTrainNumbers===true,
    noSequence:allNumbers,
    numbersByLine,
    numberSegments,
    segmentLineNames,
    type:jsonType,
    trainName:String(raw?.trainName||'').trim(),
    expressCategory:String(raw?.expressCategory||'').trim(),
    serviceNumber:raw?.serviceNumber===undefined||raw?.serviceNumber===null?'':String(raw.serviceNumber).trim(),
    lineKind:String(raw?.lineKind||meta?.lineKind||formationFamily),
    lineName:activeRouteName,
    formationFamily,
    direction:direction==='上り'?'up':'down',
    cars:Number.isFinite(parsedDefaultCars)&&parsedDefaultCars>0 ? parsedDefaultCars : fallbackCars,
    days:[day],
    start:String(raw?.start||firstTimed.station||''),
    startTime:String(raw?.startTime||firstTimed.departure||firstTimed.arrival||firstTimed.time||''),
    dest:String(raw?.dest||lastTimed.station||''),
    endTime:String(raw?.endTime||lastTimed.arrival||lastTimed.departure||lastTimed.time||''),
    prescribedFormation:String(raw?.prescribedFormation||raw?.prescribedFormationName||'').trim(),
    circular:raw?.circular===true,
    trainNumbers:(raw?.trainNumbers&&typeof raw.trainNumbers==='object')?raw.trainNumbers:(rawNo?{[String(servedLineNames[0]||raw?.lineKind||meta?.lineKind||'route')]:[rawNo]}:{}),
    servedLineNames,
    sourceTypeColors:(raw?.__sourceTypeColors&&typeof raw.__sourceTypeColors==='object')?{...raw.__sourceTypeColors}:{},
    sourceJsonUrl:String(raw?.__sourceJsonUrl||''),
    stops,
    rawTrain:raw
  }];
}
function trainDisplayNoAtStation(train,stationName){
  if(!train || train.hideTrainNumber) return '';
  const station=String(stationName||'');
  const idx=(train.stops||[]).findIndex(s=>String(s?.station||'')===station);
  return trainDisplayNoAtPosition(train,idx>=0?idx:0);
}
function trainDisplayNoAtPosition(train,pos){
  if(String(activeRouteMeta?.formationFamily||'')==='fukuoka-kuko-hakozaki') return '';
  const segments=train?.numberSegments||{};
  const stationPos=Math.max(0,Number(pos)||0);
  // 現在区間を担当する路線から列番を解決。路線の変更がある場合は、その駅から新列番へ切り替える。
  let best=null;
  for(const lineName of (train?.servedLineNames||[])){
    const lineSegs=segments[lineName]||[];
    for(const s of lineSegs){
      if(stationPos>=Number(s.from||0) && stationPos<=Number(s.to||0)) best=s.no;
    }
  }
  if(best) return best;
  // JSONに列車番号が存在しない列車は、内部IDを画面へ漏らさない。
  if(train?.hasTrainNumber===false || train?.hideTrainNumber) return '';
  return String(train?.noSequence?.[0]||train?.no||'');
}
function displayTrainNoAtTime(train,minutes){
  if(!train) return '';
  const pos=positionForTrain(train,minutes);
  return trainDisplayNoAtPosition(train,pos?.pos);
}
// 列車情報側から参照される共通関数を公開する。
function trainDisplayNoAtTime(train,minutes){
  return displayTrainNoAtTime(train,minutes);
}
async function loadExternalRouteJsons(routeMeta){
  const urls=[String(routeMeta?.json||'').trim(),...(Array.isArray(routeMeta?.relatedJsons)?routeMeta.relatedJsons:[]).map(x=>String(x||'').trim())].filter(Boolean);
  const unique=[...new Set(urls)];
  if(!unique.length) throw new Error('路線JSONの設定がありません');

  async function fetchJson(url){
    // GitHub Pages上の日本語ファイル名も確実に取得できるよう、
    // リクエスト時だけURLをURIエンコードする。
    const requestUrl=/^https?:\/\//i.test(url) ? encodeURI(url) : url;
    let lastError=null;

    // まずGitHub Pagesから取得。キャッシュを避けて、途中で切れたレスポンスを再取得する。
    for(let attempt=0; attempt<2; attempt++){
      try{
        const cacheBusted = requestUrl + (requestUrl.includes('?')?'&':'?') + `_jsonReload=${Date.now()}_${attempt}`;
        const res=await fetch(cacheBusted,{cache:'no-store'});
        const text=await res.text();
        if(!res.ok) throw new Error(`路線JSONの読み込みに失敗しました (${res.status})\n${url}`);
        if(!text.trim()) throw new Error(`路線JSONが空です\n${url}`);
        try{
          return {url,json:JSON.parse(text)};
        }catch(parseErr){
          lastError=new Error(`路線JSONの解析に失敗しました (${text.length} bytes)\n${url}\n${parseErr.message}`);
        }
      }catch(err){
        lastError=err;
      }
    }

    // GitHub Pages側のレスポンスが途中で切れた場合だけ、同じファイルをRaw GitHubから救済取得する。
    const m=/^https?:\/\/minamikaze2700\.github\.io\/Unyomatome\/(.+)$/i.exec(url);
    if(m){
      const rawPath=m[1].split('/').map(part=>decodeURIComponent(part)).join('/');
      const rawUrl=`https://raw.githubusercontent.com/minamikaze2700/Unyomatome/main/${rawPath}`;
      try{
        const res=await fetch(rawUrl+`?_jsonReload=${Date.now()}`,{cache:'no-store'});
        const text=await res.text();
        if(!res.ok) throw new Error(`Raw GitHub取得失敗 (${res.status})`);
        if(!text.trim()) throw new Error('Raw GitHubのJSONが空です');
        return {url,json:JSON.parse(text)};
      }catch(rawErr){
        lastError=new Error(`${lastError?.message||'路線JSONの取得に失敗しました'}\nRaw GitHub fallback: ${rawErr.message}`);
      }
    }
    throw lastError||new Error(`路線JSONの読み込みに失敗しました\n${url}`);
  }

  function selectSharedRouteJson(rawJson){
    // 大阪環状線・ゆめ咲線のように、1つのJSONへ複数路線を収録した場合は
    // 現在表示中の路線のエントリだけを取り出して、既存の共通処理へ渡す。
    if(rawJson && typeof rawJson==='object' && rawJson.routes && typeof rawJson.routes==='object' && !Array.isArray(rawJson.routes)){
      const candidates=[
        String(activeRouteName||'').trim(),
        ...(Array.isArray(routeMeta?.jsonLines)?routeMeta.jsonLines.map(x=>String(x||'').trim()):[])
      ].filter(Boolean);
      for(const key of candidates){
        if(rawJson.routes[key] && typeof rawJson.routes[key]==='object'){
          // 共有JSONの他路線も保持しておく。
          // 現在の路線画面を壊さず、共通駅（西九条など）の駅時刻表や
          // 直通列車の停車駅案内で、共有JSON内の他路線情報を参照できるようにする。
          const selected={...rawJson.routes[key]};
          selected._sharedRoutes=rawJson.routes;
          return selected;
        }
      }
      throw new Error(`共有路線JSONに「${String(activeRouteName||'')}」のデータがありません`);
    }
    return rawJson;
  }

  // fetchJson() は共有JSONなら路線単位へ切り出して返す。
  const sharedFetchJson=async(url)=>{
    const result=await fetchJson(url);
    return {...result,json:selectSharedRouteJson(result.json)};
  };
  const payloads=await Promise.all(unique.map(sharedFetchJson));
  const primary=payloads[0]?.json||{};

  // 各JSONごとの種別色を、そこから読み込んだ列車自身に保持させる。
  // 複数JSONを統合する場合も、種別色までprimaryだけに寄せない。
  // lineVisuals.<路線名>.typeColors がある場合は、そのJSON内の路線別設定を優先する。
  const annotateSourceTypeColors=(rawTrain,json)=>{
    const rawLineNames=[];
    if(rawTrain?.lineKind) rawLineNames.push(String(rawTrain.lineKind));
    if(rawTrain?.lineName) rawLineNames.push(String(rawTrain.lineName));
    if(rawTrain?.line) rawLineNames.push(String(rawTrain.line));
    const lineVisuals=(json?.lineVisuals&&typeof json.lineVisuals==='object')?json.lineVisuals:{};
    let sourceColors=null;
    for(const name of rawLineNames){
      const tc=lineVisuals?.[name]?.typeColors;
      if(tc&&typeof tc==='object'){ sourceColors={...tc}; break; }
    }
    if(!sourceColors){
      const rootColors=(json?.typeColors&&typeof json.typeColors==='object')?json.typeColors:{};
      sourceColors={...rootColors};
    }
    return {...rawTrain,__sourceTypeColors:sourceColors,__sourceJsonUrl:String(json?._sourceJsonUrl||'')};
  };
  for(const payload of payloads){
    try{ if(payload.json) payload.json._sourceJsonUrl=payload.url; }catch(e){}
    const days=payload.json?.trains;
    if(days&&typeof days==='object'){
      for(const dayObj of Object.values(days)){
        if(!dayObj||typeof dayObj!=='object') continue;
        for(const direction of ['上り','下り']){
          const list=Array.isArray(dayObj?.[direction])?dayObj[direction]:[];
          dayObj[direction]=list.map(raw=>annotateSourceTypeColors(raw,payload.json));
        }
      }
    }
  }
  if(payloads.length===1) return primary;

  // 京浜東北・根岸線／横浜線は、共有区間（東神奈川～大船）を相互表示するため、
  // 両方のJSONを列車データと線区定義だけ統合する。編成・種別色・運用連結は
  // 現在選択中の路線（primary）をそのまま使用する。
  const merged={...primary,lines:[],trains:{},stationDirections:{},operationChains:primary?.operationChains||{}};
  // 行先略称はHTMLの路線設定に直書きせず各JSONで管理する。
  // 横浜線ページでは共有区間の京浜東北・根岸線JSONも読み込むため、
  // primary（現在路線）の指定を優先しつつ、関連JSONの略称も統合する。
  merged.destinationAliases={...(primary?.destinationAliases&&typeof primary.destinationAliases==='object'&&!Array.isArray(primary.destinationAliases)?primary.destinationAliases:{})};
  for(const {json:aliasJson} of payloads.slice(1)){
    const aliases=aliasJson?.destinationAliases;
    if(!aliases||typeof aliases!=='object'||Array.isArray(aliases)) continue;
    for(const [destination,shortName] of Object.entries(aliases)){
      if(!Object.prototype.hasOwnProperty.call(merged.destinationAliases,destination)) merged.destinationAliases[destination]=shortName;
    }
  }
  const seenLines=new Set();
  for(const {json} of payloads){
    for(const line of (Array.isArray(json?.lines)?json.lines:[])){
      const key=String(line?.name||'').trim();
      if(!key || seenLines.has(key)) continue;
      seenLines.add(key);
      merged.lines.push(line);
    }
    for(const [k,v] of Object.entries(json?.stationDirections||{})){
      if(!Object.prototype.hasOwnProperty.call(merged.stationDirections,k)) merged.stationDirections[k]=v;
    }
  }
  for(const day of ['平日','休日','土休日']){
    const sourceDays=payloads.map(x=>x.json?.trains?.[day]).filter(Boolean);
    if(!sourceDays.length) continue;
    const out={};
    for(const direction of ['上り','下り']){
      out[direction]=[];
      for(const dayObj of sourceDays){
        const list=Array.isArray(dayObj?.[direction])?dayObj[direction]:[];
        out[direction].push(...list);
      }
    }
    merged.trains[day]=out;
  }
  return merged;
}

async function loadLineTrainData(routeName=activeRouteName,timetableDate=selectedDateKey){
  if(routeName&&ROUTE_REGISTRY[routeName]) activeRouteName=routeName;
  if(activeRouteName&&ROUTE_REGISTRY[activeRouteName]){
    try{ localStorage.setItem(LAST_ROUTE_STORAGE_KEY,activeRouteName); }catch(e){}
  }
  const baseRouteMeta=ROUTE_REGISTRY[activeRouteName];
  if(!baseRouteMeta) throw new Error(`路線設定が見つかりません: ${activeRouteName}`);
  const dateKey=String(timetableDate||selectedDateKey||'');
  const resolvedRouteMeta=routeMetaForScheduleDate(baseRouteMeta,dateKey);
  if(!resolvedRouteMeta) throw new Error(`選択日 ${dateKey} に対応する時刻表ファイルがありません: ${activeRouteName}`);
  activeRouteMeta=resolvedRouteMeta;
  fukuokaHakozakiBranchOpen=false;
  let json=null;
  if(!activeRouteMeta.json) throw new Error(`路線JSONの設定がありません: ${activeRouteName}`);
  json=await loadExternalRouteJsons(activeRouteMeta);
  if(dateKey!==String(selectedDateKey||'')) return;
  activeJson=json;
  STATIONS=buildStationsForRoute(json,activeRouteMeta);
  for(const key of Object.keys(VEHICLE_TO_FORMATION)) delete VEHICLE_TO_FORMATION[key];
  FORMATIONS=buildFormationsForJson(json);
  // 「編成未選択」は必ずJSONのnoImage。形式画像をnoImageとして流用しない。
  INITIAL_FORMATION_SELECTION.img=jsonNoImageUrl(json);
  TYPE_SELECTIONS=FORMATIONS.map(g=>({id:g.type,name:g.type,img:g.typeImg,kind:'type',type:g.type}));
  const built=[];
  // 路線JSONには「平日/土休」の配列形式と「平日/休日→上り/下り」の形式がある。
  // 福岡市地下鉄のように各列車が direction を持つ配列形式もここで共通形式へ変換する。
  for(const day of ['平日','休日']){
    const candidateKeys=day==='休日'?['土休日','土休','休日']:['平日'];
    const sourceDay=candidateKeys.find(k=>Array.isArray(json?.trains?.[k]) || (json?.trains?.[k]&&typeof json.trains[k]==='object'&&(Array.isArray(json.trains[k]?.上り)||Array.isArray(json.trains[k]?.下り))));
    if(!sourceDay) continue;
    const dayData=json.trains[sourceDay];
    if(Array.isArray(dayData)){
      for(const raw of dayData){
        const rawDirection=String(raw?.direction||'');
        const normalizedDirection=rawDirection.trim().toLowerCase();
        const isUpDirection=(normalizedDirection==='上り'||normalizedDirection==='up'||normalizedDirection==='toward_airport'||normalizedDirection==='toward_airport_kaizuka'||normalizedDirection==='toward_kaizuka'||normalizedDirection.startsWith('toward_airport_'));
        let direction=isUpDirection?'上り':'下り';
        const normalizedDay=day==='休日'?'休日':'平日';
        built.push(...normalizeExternalTrain(raw,normalizedDay,direction,activeRouteMeta));
      }
    }else{
      for(const direction of ['上り','下り']){
        const rawList=dayData?.[direction]||[];
        for(const raw of rawList) built.push(...normalizeExternalTrain(raw,day,direction,activeRouteMeta));
      }
    }
  }
  const seen=new Set(); ALL_SCHEDULE_TRAINS=[];
  for(const t of built){const key=`${t.no}|${t.direction}|${(t.days||[]).join(',')}`; if(seen.has(key)) continue; seen.add(key); ALL_SCHEDULE_TRAINS.push(t);}
  TRAINS=ALL_SCHEDULE_TRAINS.filter(t=>t.days.includes('平日'));
  HOLIDAY_TRAINS=ALL_SCHEDULE_TRAINS.filter(t=>t.days.includes('休日'));
  HOLIDAY_UP_TRAINS=HOLIDAY_TRAINS.filter(t=>t.direction==='up');
  TRAIN_INDEX={}; for(const t of TRAINS) if(!TRAIN_INDEX[t.no]) TRAIN_INDEX[t.no]=t;
  HOLIDAY_TRAIN_INDEX={}; for(const t of HOLIDAY_TRAINS) if(!HOLIDAY_TRAIN_INDEX[t.no]) HOLIDAY_TRAIN_INDEX[t.no]=t;
  // JSONに定義した一日分の運用連結を位置計算・編成連動へ反映する。
  loadOperationChainsFromJson(json);
  if(typeof TIMETABLE_HTML_CACHE!=='undefined') TIMETABLE_HTML_CACHE=new Map();
  if(typeof TRAIN_DATA_CACHE!=='undefined') TRAIN_DATA_CACHE.clear();
  if(typeof TRAIN_RUNTIME_CACHE!=='undefined') TRAIN_RUNTIME_CACHE.clear();
  if(typeof TRAIN_RENDER_INDEX_CACHE!=='undefined') TRAIN_RENDER_INDEX_CACHE.clear();
  if(typeof TERMINAL_NEXT_CACHE!=='undefined') TERMINAL_NEXT_CACHE.clear();
  if(typeof TERMINAL_DEPARTURE_CACHE!=='undefined') TERMINAL_DEPARTURE_CACHE.clear();
  if(typeof OPERATION_INFO_STATIONS!=='undefined') OPERATION_INFO_STATIONS=STATIONS.map(x=>x.nameJa);
  if(typeof applyRegistrationState==='function') applyRegistrationState();
  updateRouteVisuals();
  // 路線を切り替えたら、運行情報一覧も現在の路線だけに更新する。
  if(typeof renderOperationInfoList==='function') renderOperationInfoList();
  activeScheduleSignature=routeScheduleSignature(activeRouteName,dateKey);
}

async function reloadScheduleForSelectedDateIfNeeded(){
  const routeName=String(activeRouteName||'');
  if(!routeName||!ROUTE_REGISTRY[routeName]) return;
  const requestedDate=String(selectedDateKey||'');
  const nextSignature=routeScheduleSignature(routeName,requestedDate);
  if(nextSignature==='__NO_SCHEDULE__'){
    const token=++scheduleReloadSequence;
    activeScheduleSignature='__NO_SCHEDULE__';
    STATIONS=[]; TRAINS=[]; HOLIDAY_TRAINS=[]; HOLIDAY_UP_TRAINS=[];
    ALL_SCHEDULE_TRAINS=[]; TRAIN_INDEX={}; HOLIDAY_TRAIN_INDEX={};
    if(currentTrainNo){currentTrainNo=null;currentTrainSnapshot=null;}
    const label=document.getElementById('scheduleDayLabel');
    if(label) label.textContent=`${currentDay}ダイヤ・該当期間の時刻表データなし`;
    renderLine();
    if(typeof renderOperationInfoList==='function') renderOperationInfoList();
    return;
  }
  if(nextSignature===activeScheduleSignature) return;
  const token=++scheduleReloadSequence;
  try{
    await loadLineTrainData(routeName,requestedDate);
    if(token!==scheduleReloadSequence||requestedDate!==String(selectedDateKey||'')) return;
    if(currentTrainNo) currentTrainSnapshot=trainForCurrentDay(currentTrainNo,currentTrainSnapshot?.direction||null);
    renderLine();
    if(currentTrainNo) updateSheetContent();
  }catch(err){
    if(token!==scheduleReloadSequence) return;
    console.error('日付に対応する時刻表JSONの切替失敗',routeName,requestedDate,err);
    const label=document.getElementById('scheduleDayLabel');
    if(label) label.textContent=`${currentDay}ダイヤ・時刻表読込エラー`;
  }
}

function buildTimetableRows(stops){
  const isFukuoka=isFukuokaCompositeRoute(activeRouteMeta);
  const scheduled=(stops||[]).filter(st=>{
    if(!st) return false;
    const hasTime=!!String(st.arrival||st.departure||st.time||'').trim();
    const isExternalTerminal=isFukuoka && (st.terminalOnly===true || String(st.line||'')==='JR筑肥線');
    return hasTime || isExternalTerminal;
  });
  const rows=[];
  for(let i=0;i<scheduled.length;){
    const station=String(scheduled[i]?.station||'');
    const times=[];
    let j=i;
    while(j<scheduled.length && String(scheduled[j]?.station||'')===station){
      const st=scheduled[j]||{};
      const a=st.arrival||st.time||'';
      const d=st.departure||st.time||'';
      if(a && !times.includes(a)) times.push(a);
      if(d && !times.includes(d)) times.push(d);
      j++;
    }
    const grouped=scheduled.slice(i,j);
    const dottedBefore=grouped.some(st=>st?.dottedBefore===true);
    // segmentColors に列挙された色を保持する。重複駅レコードをまとめる際も、配列内の色数と順序は維持する。
    const configuredColors=grouped.find(st=>Array.isArray(st?.segmentColors)&&st.segmentColors.length)?.segmentColors;
    const segmentColors=Array.isArray(configuredColors)
      ? configuredColors.map(c=>String(c||'').trim()).filter(Boolean) : [];
    // 色境界は色数からHTML側で自動計算する。2色なら0/50%、3色なら0/33.333/66.667%。
    // segmentColorsは区間の終点駅に設定し、駅間全体を色数と同じ数に等分する。
    const segmentColorStops=segmentColors.map((color,colorIndex)=>({
      color,
      position:segmentColors.length ? colorIndex*100/segmentColors.length : 0
    }));
    const boardingOnly=grouped.some(st=>st?.boardingOnly===true);
    const alightingOnly=grouped.some(st=>st?.alightingOnly===true);
    rows.push({station,times:times.slice(0,2),dottedBefore,segmentColors,segmentColorStops,boardingOnly,alightingOnly});
    i=j;
  }
  return rows;
}
function formatRailwayDisplayTime(value){
  const raw=String(value??'').trim();
  const m=raw.match(/^(\d{1,3}):(\d{2})$/);
  if(!m) return raw;
  let hour=Number(m[1]);
  // PDFの24:xx/25:xx/26:xx表記は、表示上は00:xx/01:xx/02:xxにする。
  // 内部データも同じ表記へ正規化し、timeToMinutes() の03:00境界処理で順序を維持する。
  if(hour>=24 && hour<27) hour-=24;
  return `${String(hour).padStart(2,'0')}:${m[2]}`;
}
function fukuokaChikuhiStationSet(json=activeJson){
  if(String(activeRouteMeta?.formationFamily||'')!=='fukuoka-kuko-hakozaki') return new Set();
  const lines=Array.isArray(json?.lines)?json.lines:[];
  const chikuhi=lines.filter(line=>/筑肥線/.test(String(line?.name||'')));
  return new Set(chikuhi.flatMap(line=>Array.isArray(line?.stations)?line.stations:[])
    .map(st=>String(st?.name||st?.nameJa||st?.station||'').trim()).filter(Boolean));
}
function timetableRowsHTML(stops,trainContext=null){
  // 停車駅案内は現在の路線外の停車駅も含める。時刻未設定の駅は表示しない。
  const visibleStops=(stops||[]).filter(st=>!!String(st?.arrival||st?.departure||st?.time||'').trim());
  const rows=buildTimetableRows(visibleStops);
  if(!rows.length) return '';
  const stationColor=index=>routeColorForStopIndex(rows,index,trainContext);
  const fallbackSegmentColor=(aIndex,bIndex)=>{
    if(aIndex<0||bIndex<0||aIndex>=rows.length||bIndex>=rows.length) return routeColorForTrainFallback(trainContext);
    return routeColorForStopSegment(rows[aIndex]?.station,rows[bIndex]?.station,trainContext);
  };
  // segmentColors は「区間の終点駅」に登録する。終点駅の直前の線に適用する。
  const colorsForIncomingSegment=(endIndex,startIndex)=>{
    const configured=Array.isArray(rows[endIndex]?.segmentColors)
      ? rows[endIndex].segmentColors.map(c=>String(c||'').trim()).filter(Boolean) : [];
    return configured.length ? configured : [fallbackSegmentColor(startIndex,endIndex)];
  };
  const chikuhiStations=fukuokaChikuhiStationSet();
  const isChikuhiSegment=(a,b)=>chikuhiStations.has(String(a||''))&&chikuhiStations.has(String(b||''))&&String(a||'')!==String(b||'');
  const isDottedRouteSegment=(a,b,arrivalIndex=-1)=>isChikuhiSegment(a,b)||(arrivalIndex>=0&&rows[arrivalIndex]?.dottedBefore===true);
  const globalDotted=!!activeRouteMeta?.dottedTimetableGuide;
  const lineBg=(colors,dotted=false)=>{
    const list=(Array.isArray(colors)?colors:[]).map(c=>String(c||'').trim()).filter(Boolean);
    const safe=list.length?list:['#666'];
    // 複数色は区間の幅を等分する。破線は同じ色帯に縦方向のマスクを適用する。
    const stops=safe.map((color,i)=>{
      const start=(i/safe.length)*100;
      const end=((i+1)/safe.length)*100;
      return `${color} ${start}% ${end}%`;
    }).join(',');
    return {
      images:`linear-gradient(to right,${stops})`,
      sizes:'100% 100%',positions:'0 0',repeat:'no-repeat',
      mask:dotted?'repeating-linear-gradient(to bottom,#000 0 7px,transparent 7px 14px)':'none'
    };
  };
  return rows.map((row,index)=>{
    const rawTimes=rows[index].times.length>=2?rows[index].times.slice(0,2):rows[index].times.slice(0,1);
    const formattedTimes=rawTimes.map(formatRailwayDisplayTime);
    const times=(formattedTimes.length>=2&&formattedTimes[0]===formattedTimes[1])?[formattedTimes[0]]:formattedTimes;
    const twoLine=times.length>=2;
    let prevColors=index>0?colorsForIncomingSegment(index,index-1):[];
    let nextColors=index<rows.length-1?colorsForIncomingSegment(index+1,index):[];
    const dotColor=stationColor(index);
    if(rows.length>1&&index===0) prevColors=nextColors;
    if(rows.length>1&&index===rows.length-1) nextColors=prevColors;
    if(rows.length===1) prevColors=nextColors=[dotColor];
    const prevDotted=index>0&&isDottedRouteSegment(rows[index-1]?.station,row.station,index);
    const nextDotted=index<rows.length-1&&isDottedRouteSegment(row.station,rows[index+1]?.station,index+1);
    const top=lineBg(prevColors,globalDotted||prevDotted);
    const bottom=lineBg(nextColors,globalDotted||nextDotted);
    const classes=['timetable-item',globalDotted?'dotted-route-guide':''].filter(Boolean).join(' ');
    const markerClass=row.boardingOnly?' boarding-only':(row.alightingOnly?' alighting-only':'');
    const markerTitle=row.boardingOnly?'乗車専用駅':(row.alightingOnly?'降車専用駅':'');
    return `<div class="${classes}" style="--route-line-top-bg:${top.images};--route-line-top-size:${top.sizes};--route-line-top-position:${top.positions};--route-line-top-repeat:${top.repeat};--route-line-top-mask:${top.mask};--route-line-bottom-bg:${bottom.images};--route-line-bottom-size:${bottom.sizes};--route-line-bottom-position:${bottom.positions};--route-line-bottom-repeat:${bottom.repeat};--route-line-bottom-mask:${bottom.mask};--station-route-color:${dotColor};--station-route-color-bg:${dotColor}"><div class="time-dot${markerClass}"${markerTitle?` title="${markerTitle}" aria-label="${markerTitle}"`:''}></div><div class="time-text${twoLine?' two-line':''}">${times.map(t=>`<span>${t}</span>`).join('')}</div><div class="station-text">${row.station}</div></div>`;
  }).join('');
}

function findChain(day,trainNo){
  const raw=normalizeTrainNo(trainNo);
  return CHAIN_INDEX[day]?.[raw] || CHAIN_INDEX[day]?.[raw.replace(/A$/i,'')] || null;
}
function chainEntries(day,trainNo){
  const info=findChain(day,trainNo);
  if(!info) return null;
  return OPERATION_CHAINS[day]?.[info.chainIndex] || null;
}

/* 運用連結：同一列車が複数の運用グループに現れる場合も全該当チェーンを走査。
   ただし回送103/111と通常103A/111AのようにA有無で別列車の場合は、
   まず完全一致したチェーンだけを採用する。 */
function formationLinkedTrainNos(day,trainNo,direction=null){
  const start=normalizeTrainNo(trainNo);
  const requestedDirection=String(direction||'');
  const result=new Set([start]);
  const queue=[start];
  const chains=OPERATION_CHAINS[day]||[];

  const entryMatches=(entry,no)=>{
    if(normalizeTrainNo(entry.no)!==no) return false;
    if(!requestedDirection) return true;
    if(!entry.start || !entry.dest) return true;
    const idxA=STATIONS.findIndex(s=>s.nameJa===entry.start);
    const idxB=STATIONS.findIndex(s=>s.nameJa===entry.dest);
    const entryDirection=idxA>idxB?'up':'down';
    return entryDirection===requestedDirection;
  };

  while(queue.length){
    const no=queue.shift();
    for(const chain of chains){
      if(!chain.some(entry=>entryMatches(entry,no))) continue;
      chain.forEach(entry=>{
        const n=normalizeTrainNo(entry.no);
        if(n && !result.has(n)){ result.add(n); queue.push(n); }
      });
    }
  }
  return result;
}
// 運用連結用の列車検索は、表示中の路線データではなく
// 両路線を統合した ALL_SCHEDULE_TRAINS を基準にする。
// 路線間で共有される運用連結は使用しない。
// // 「どの列車まで同じ運用として登録するか」を完全に統一する。
function operationTrainSourceForDay(day=currentDay){
  const source=Array.isArray(ALL_SCHEDULE_TRAINS)&&ALL_SCHEDULE_TRAINS.length
    ? ALL_SCHEDULE_TRAINS
    : [...TRAINS,...HOLIDAY_TRAINS];
  return source.filter(t=>{
    const days=t?.days;
    return !Array.isArray(days)||!days.length||days.includes(day);
  });
}
function findOperationTrainRecord(no,day=currentDay){
  const key=normalizeTrainNo(no);
  if(!key) return null;
  const source=operationTrainSourceForDay(day);
  const canonical=value=>normalizeTrainNo(value).replace(/A$/i,'');
  // 代表番号以外の列番も同じ運行レコードへ戻せるようにする。
  // 広島地区の列車は trainNumbers / noSequence / numberSegments に
  // 列番変更前後の番号が別々に保存されている。
  const numbersOf=t=>{
    const values=[];
    const add=v=>{const n=normalizeTrainNo(v);if(n&&!values.includes(n))values.push(n);};
    add(t?.no);
    (Array.isArray(t?.noSequence)?t.noSequence:[]).forEach(add);
    for(const list of Object.values(t?.numbersByLine||{})) if(Array.isArray(list)) list.forEach(add);
    for(const list of Object.values(t?.trainNumbers||{})) if(Array.isArray(list)) list.forEach(add);
    for(const list of Object.values(t?.numberSegments||{})) if(Array.isArray(list)) list.forEach(seg=>add(seg?.no));
    return values;
  };
  const exact=source.find(t=>normalizeTrainNo(t?.no)===key);
  if(exact) return exact;
  const exactAlias=source.find(t=>numbersOf(t).includes(key));
  if(exactAlias) return exactAlias;
  const loose=source.find(t=>canonical(t?.no)===canonical(key));
  if(loose) return loose;
  return source.find(t=>numbersOf(t).some(n=>canonical(n)===canonical(key)))||null;
}

// 運用表示で使う列番の判定。実データが見つからない場合でも、実列番形式の番号は表示する。
// 一方、列車番号非表示の路線が内部識別子を使っている場合は表示しない。
function isDisplayableOperationTrainNumber(value, sourceTrain=null){
  const no=normalizeTrainNo(value);
  if(!no) return false;
  if(sourceTrain && (sourceTrain.hasTrainNumber===false || sourceTrain.hideTrainNumber===true)) return false;
  if(sourceTrain && sourceTrain.hasTrainNumber===true) return true;
  return /^[A-Z]{0,3}\d{1,6}[A-Z]{0,3}$/i.test(no);
}

function snapshotForCurrentRegistrations(day, state, dateKey, familyFilter=null){
  const ops=[];
  const chainsForDay=OPERATION_CHAINS[day]||[];
  const dayIndex=day==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
  for(let i=0;i<chainsForDay.length;i++){
    const chain=chainsForDay[i];
    const shown=chain.map(e=>normalizeTrainNo(e.no)).filter(no=>dayIndex[no]);
    if(!shown.length) continue;
    const byFormation={};
    shown.forEach(no=>{
      const train=dayIndex[no];
      if(familyFilter && formationFamilyForTrain(train)!==familyFilter) return;
      const f=stateForTrain(state,no);
      if(!f) return;
      (byFormation[f]??=[]).push(no);
    });
    for(const [formationId,trainNumbers] of Object.entries(byFormation)){
      ops.push({
        operationId:`${day}-${String(i+1).padStart(2,'0')}`,
        day,
        firstTrainNo:String(chain[0].no),
        trainNumbers,
        formationId:normalizeStoredFormationId(formationId)
      });
    }
  }
  return {date:dateKey,id:`${dateKey}_reset`,resetAt:resetTimeForDate(dateKey),operations:ops,loggedAt:new Date().toISOString()};
}

function snapshotFromStateRoot(oldRoot,dateKey){
  const days=[];
  for(const day of ['平日','休日']){
    const keihin=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey,'keihin');
    const yokohama=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey,'yokohama');
    const operations=[...(keihin.operations||[]),...(yokohama.operations||[])];
    if(operations.length) days.push({date:dateKey,id:`${dateKey}_${day}`,resetAt:resetTimeForDate(dateKey),operations,loggedAt:new Date().toISOString()});
  }
  return {id:dateKey,date:dateKey,resetAt:resetTimeForDate(dateKey),days,loggedAt:new Date().toISOString()};
}

async function maybeResetForNewOperationDay(remoteCheck=false){
  const opDate=operationDateKey();
  // 「現在時刻」モードでは、3:00を跨いだ時点で表示日付も新しい運用日に切り替える。
  if(followNow && selectedDateKey!==opDate){
    setSelectedDate(opDate,{preserveNow:true});
  }else if(!followNow && isHistoricalSelectedDate(selectedDateKey)){
    // 手動で過去日を選択している場合は、過去データ表示を維持する。
    return;
  }
  if(!currentOperationDate) currentOperationDate=remoteRoot.operationDate||opDate;

  if(firebaseReady){
    try{
      await firebaseOperationRef().transaction(current=>{
        const cur=current||{stateByDay:{平日:{},休日:{}},operationDate:opDate,version:0};
        cur.stateByDay=cur.stateByDay||{平日:{},休日:{}};
        const oldDate=cur.operationDate;
        if(oldDate && oldDate!==opDate){
          const snapshot=snapshotFromStateRoot(cur,oldDate);
          if(snapshot.days.length){
            // transaction内では履歴書込みを行わず、後段で候補として保持
            window.__pendingResetSnapshot=snapshot;
          }
          cur.stateByDay={平日:{},休日:{}};
          cur.operationDate=opDate;
          cur.version=(cur.version||0)+1;
          cur.updatedAt=firebase.database.ServerValue.TIMESTAMP;
        }
        return cur;
      });
      if(window.__pendingResetSnapshot){
        const snapshot=window.__pendingResetSnapshot;
        window.__pendingResetSnapshot=null;
        try{
          // 日付固定キーで保存するため、複数端末が同時に3:00を検出しても同一履歴へ収束
          await firebaseHistoryRef().child(snapshot.id).set(snapshot);
          operationHistory=historyEntries();
          saveLocalState();
        }catch(e){
          // 既に他端末が登録済みの場合はルールにより書込失敗するが、これは正常な競合
          console.warn('履歴追加競合または失敗',e);
        }
      }
      // transaction完了後のFirebase最新状態をそのまま画面へ反映する。
      // 日付が変わっていない場合は、既存のstateByDayを空に戻さない。
      const latestSnap=await firebaseOperationRef().once('value');
      const latestRoot=latestSnap.val()||{};
      remoteRoot.operationDate=latestRoot.operationDate||opDate;
      currentOperationDate=remoteRoot.operationDate;
      const latestStateByDay=latestRoot.stateByDay||{};
      remoteRoot.stateByDay={
        平日:cloneState(latestStateByDay.平日||{}),
        休日:cloneState(latestStateByDay.休日||{})
      };
      registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshAllTrainDataCache();
      renderLine();
    }catch(e){ console.error('remote reset failed',e); }
  }else{
    if(currentOperationDate!==opDate){
      const snapshot=snapshotFromStateRoot(remoteRoot,currentOperationDate);
      remoteRoot.stateByDay={平日:{},休日:{}};
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.history=remoteRoot.history||{};
      if(snapshot.days.length) remoteRoot.history[snapshot.id]=snapshot;
      registrationState={};
      operationHistory=historyEntries();
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }else{
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      saveLocalState();
    }
  }
}

function initSharedState(){

  loadLocalState();
  window.__localStateLoadedAtStartup = true;
}
function syncCurrentScheduleDay(){
  // 選択日付を唯一の基準にして、平日／土休日の状態を常に同期する。
  // currentDay が別処理で古い値になっていても、時刻表が平日固定にならないようにする。
  const d=new Date(`${selectedDateKey}T00:00:00`);
  if(!Number.isNaN(d.getTime())){
    const nextDay=getScheduleDayForDate(d);
    if(nextDay!==currentDay){
      currentDay=nextDay;
      TRAIN_RENDER_INDEX_CACHE.clear();
      TERMINAL_NEXT_CACHE.clear();
      TERMINAL_DEPARTURE_CACHE.clear();
      TRAIN_RUNTIME_CACHE.clear();
    }
  }
  return currentDay;
}
