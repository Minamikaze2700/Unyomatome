function cloneState(value){
  try{return JSON.parse(JSON.stringify(value||{}));}catch(e){return {};}
}
function escapeAttr(value){
  return String(value??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeJs(value){
  return String(value??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function esc(value){ return escapeAttr(value); }

/* 外部JSONに収録された路線定義を返す。
   normalizeExternalTrain() の実行時点では activeJson が読み込み済みなので、
   ここから常に現在選択中のJSONの lines を参照する。 */
function allJsonLines(){
  const out=[];
  const seen=new Set();
  const addLines=lines=>{
    for(const line of (Array.isArray(lines)?lines:[])){
      const key=String(line?.name||'').trim();
      if(!key||seen.has(key)) continue;
      seen.add(key); out.push(line);
    }
  };
  addLines(activeJson?.lines);
  // 大阪環状線・ゆめ咲線のような共有JSONでは、選択中でない路線の
  // 線区定義も色判定に使う。ただし列車データ自体は混ぜない。
  const shared=activeJson?._sharedRoutes;
  if(shared&&typeof shared==='object'){
    for(const [name,route] of Object.entries(shared)){
      if(String(name)===String(activeRouteName)) continue;
      addLines(route?.lines);
    }
  }
  return out;
}

/* 列車が実際に走る路線を基準に停車駅案内の色を決定する。 */
function lineDefByName(name){
  return allJsonLines().find(x=>String(x?.name||'')===String(name||''))||null;
}

/* H1の色は路線JSONに登録された基本色だけを使用する。
   segmentColorRules による特定区間の色はH1には反映しない。 */
function jsonBaseColorForActiveRoute(){
  const routeName=String(activeRouteName||'');
  const exact=lineDefByName(routeName);
  if(exact?.color) return String(exact.color).trim();
  const names=getActiveRouteLineNames();
  for(const name of (Array.isArray(names)?names:[])){
    const line=lineDefByName(name);
    const color=String(line?.color||'').trim();
    if(color) return color;
  }
  const first=allJsonLines().find(line=>String(line?.color||'').trim());
  return String(first?.color||'').trim() || '#808080';
}
function lineAdjacent(line,a,b){
  const aa=String(a||''),bb=String(b||'');
  const stations=Array.isArray(line?.stations)?line.stations:[];
  for(let i=0;i<stations.length-1;i++){
    const x=String(stations[i]?.name||''),y=String(stations[i+1]?.name||'');
    if((x===aa&&y===bb)||(x===bb&&y===aa)) return true;
  }
  const prepended=Array.isArray(activeRouteMeta?.prependStations)?activeRouteMeta.prependStations.map(x=>String(x?.nameJa||'')).filter(Boolean):[];
  const first=stations[0]?.name;
  if(prepended.includes(aa) && first===bb) return true;
  if(prepended.includes(bb) && first===aa) return true;
  return false;
}
function lineContainsOrderedPair(line,a,b){
  const aa=String(a||''),bb=String(b||'');
  const stations=Array.isArray(line?.stations)?line.stations:[];
  const prepended=Array.isArray(activeRouteMeta?.prependStations)?activeRouteMeta.prependStations.map(x=>String(x?.nameJa||'')).filter(Boolean):[];
  const first=stations[0]?.name;
  if((prepended.includes(aa)&&first===bb)||(prepended.includes(bb)&&first===aa)) return true;
  let ia=-1,ib=-1;
  for(let i=0;i<stations.length;i++){
    const n=String(stations[i]?.name||'');
    if(n===aa && ia<0) ia=i;
    if(n===bb && ib<0) ib=i;
  }
  return ia>=0&&ib>=0&&ia!==ib;
}
function routeLineNamesForColor(trainContext=null){
  const served=Array.isArray(trainContext?.servedLineNames)
    ? trainContext.servedLineNames.map(String).filter(Boolean)
    : [];
  const active=getActiveRouteLineNames();
  const all=allJsonLines().map(x=>String(x?.name||'')).filter(Boolean);
  const ordered=[];
  for(const name of active) if(!ordered.includes(name)) ordered.push(name);
  for(const name of served) if(!ordered.includes(name)) ordered.push(name);
  // served/active に無い線区も最後の保険として探索対象にする。
  for(const name of all) if(!ordered.includes(name)) ordered.push(name);
  return ordered;
}
function lineContainsStops(line,a,b){
  const aa=String(a||''),bb=String(b||'');
  if(!aa||!bb||aa===bb) return false;
  if(lineAdjacent(line,aa,bb)) return true;
  // 快速などで途中停車駅を飛ばしていても、両駅が同一線区上にあればその線区色を使用する。
  return lineContainsOrderedPair(line,aa,bb);
}
function trainServiceLineCandidates(a,b,trainContext=null){
  const names=routeLineNamesForColor(trainContext);
  return names.map(lineDefByName).filter(Boolean).filter(line=>lineContainsStops(line,String(a||''),String(b||'')));
}
function preferredTrainServiceLine(a,b,trainContext=null){
  const aa=String(a||''),bb=String(b||'');
  if(!aa||!bb||aa===bb) return null;
  const allCandidates=allJsonLines().filter(line=>lineContainsStops(line,aa,bb));
  if(!allCandidates.length) return null;

  const servedNames=new Set(Array.isArray(trainContext?.servedLineNames)?trainContext.servedLineNames.map(String):[]);
  const servedCandidates=servedNames.size
    ? allCandidates.filter(line=>servedNames.has(String(line?.name||'')))
    : [];
  const candidates=servedCandidates.length?servedCandidates:allCandidates;
  if(candidates.length===1) return candidates[0];

  // 実際の列車が複数線区をまたぐ場合、共有区間だけは「列車の進行方向側に
  // 続いている固有区間」を優先する。これにより呉線→山陽本線の広島～海田市
  // の共有区間は、呉線側／山陽本線側を列車の進行に合わせて正しく判定できる。
  const rows=Array.isArray(trainContext?.stops)?trainContext.stops:[];
  const findPairIndex=()=>{
    for(let i=0;i<rows.length-1;i++){
      const x=String(rows[i]?.station||''),y=String(rows[i+1]?.station||'');
      if((x===aa&&y===bb)||(x===bb&&y===aa)) return i;
    }
    return -1;
  };
  const pairIndex=findPairIndex();
  if(pairIndex>=0){
    const direction=String(trainContext?.direction||'').toLowerCase();
    const searchDirs=direction==='up'?[1,-1]:direction==='down'?[-1,1]:[1,-1];
    for(const delta of searchDirs){
      let i=pairIndex+delta;
      while(i>=0&&i<rows.length-1){
        const x=String(rows[i]?.station||''),y=String(rows[i+1]?.station||'');
        const near=servedNames.size
          ? allJsonLines().filter(line=>servedNames.has(String(line?.name||''))&&lineContainsStops(line,x,y))
          : allJsonLines().filter(line=>lineContainsStops(line,x,y));
        if(near.length===1) return near[0];
        i+=delta;
      }
    }
  }

  // 曖昧さが残る場合だけ現在表示中の路線を優先する（trainContextに実列車
  // の停車駅がない、単なる画面側の色判定コンテキストなど）。
  const activeNames=new Set(getActiveRouteLineNames());
  const activeHit=candidates.find(line=>activeNames.has(String(line?.name||'')));
  if(activeHit) return activeHit;
  return candidates[0];
}
function fallbackTrainServiceColor(trainContext=null){
  const colors=activeRouteColors();
  if(colors.length) return colors[0];
  const served=Array.isArray(trainContext?.servedLineNames)?trainContext.servedLineNames.map(lineDefByName).filter(Boolean):[];
  const servedColor=served.find(line=>String(line?.color||'').trim());
  return String(servedColor?.color||'#666');
}
function jsonSegmentColorForStations(a,b,lineNames=getActiveRouteLineNames()){
  const aa=String(a||''),bb=String(b||'');
  if(!aa||!bb||aa===bb) return null;
  for(const lineName of (Array.isArray(lineNames)?lineNames:[])){
    const line=lineDefByName(lineName);
    if(!line) continue;
    for(const rule of (Array.isArray(line?.segmentColorRules)?line.segmentColorRules:[])){
      const pairs=Array.isArray(rule?.stationPairs)?rule.stationPairs:[];
      if(pairs.some(pair=>Array.isArray(pair)&&pair.length>=2&&((String(pair[0])===aa&&String(pair[1])===bb)||(String(pair[1])===aa&&String(pair[0])===bb)))){
        const color=String(rule?.color||'').trim();
        if(color) return color;
        const useLine=String(rule?.useLine||'').trim();
        if(useLine){
          const target=lineDefByName(useLine);
          const targetColor=String(target?.color||'').trim();
          if(targetColor) return targetColor;
        }
      }
    }
  }
  return null;
}
function trainServiceColorBetweenStations(a,b,trainContext=null){
  const aa=String(a||''),bb=String(b||'');
  if(!aa||!bb||aa===bb) return fallbackTrainServiceColor(trainContext);
  // 路線の表示範囲外にある終点は、列車JSONの終点stop.routeColorで区間色を指定できる。
  const ctxStops=Array.isArray(trainContext?.stops)?trainContext.stops:[];
  for(let i=0;i<ctxStops.length-1;i++){
    const x=String(ctxStops[i]?.station||''),y=String(ctxStops[i+1]?.station||'');
    if((x===aa&&y===bb)||(x===bb&&y===aa)){
      const endpointColor=String(ctxStops[i+1]?.routeColor||ctxStops[i]?.routeColor||'').trim();
      if(endpointColor) return endpointColor;
    }
  }

  // 大阪環状線画面でも、ゆめ咲線区間はゆめ咲線の色を使う。

function trainServiceColorAtStation(trainContext,stationName,indexPos=null){
  const rows=Array.isArray(trainContext?.stops)?trainContext.stops:[];
  const station=String(stationName||'');
  if(!rows.length) return fallbackTrainServiceColor(trainContext);

  let idx=rows.findIndex(x=>String(x?.station||'')===station);
  if(idx<0 && indexPos!=null){
    const n=Math.round(Number(indexPos));
    if(Number.isFinite(n)) idx=Math.max(0,Math.min(rows.length-1,n));
  }
  if(idx<0) return fallbackTrainServiceColor(trainContext);

  // 駅のドット色は「その駅から列車が進む側」の区間色を優先。
  // 下りは次区間、上りは前区間。端駅では存在する側を必ず採用する。
  const dir=String(trainContext?.direction||'').toLowerCase();
  const next=(idx<rows.length-1)
    ? trainServiceColorBetweenStations(rows[idx]?.station,rows[idx+1]?.station,trainContext)
    : null;
  const prev=(idx>0)
    ? trainServiceColorBetweenStations(rows[idx-1]?.station,rows[idx]?.station,trainContext)
    : null;

  if(dir==='up' && prev) return prev;
  if(dir==='down' && next) return next;
  if(next) return next;
  if(prev) return prev;

  return fallbackTrainServiceColor(trainContext);
}

function timetableSegmentColorList(rows,endIndex,startIndex,trainContext=null){

function timetableLineBackground(colors,colorStops=null){
  const list=(Array.isArray(colors)?colors:[]).map(c=>String(c||'').trim()).filter(Boolean);
  const safe=list.length?list:['#666'];
  let ranges=[];
  const positioned=(Array.isArray(colorStops)?colorStops:[])
    .map(item=>({color:String(item?.color||'').trim(),position:Number(item?.position ?? item?.at) }))
    .filter(item=>item.color && Number.isFinite(item.position))
    .map(item=>({...item,position:Math.max(0,Math.min(100,item.position))}))
    .sort((a,b)=>a.position-b.position);
  if(positioned.length){
    // {color, position} はその位置から次の色の位置までを塗る。最初の色は線の始端まで延長。
    const normalized=[];
    for(const item of positioned){
      if(normalized.length && normalized[normalized.length-1].position===item.position) normalized[normalized.length-1]=item;
      else normalized.push(item);
    }
    if(normalized[0].position>0) normalized.unshift({...normalized[0],position:0});
    ranges=normalized.map((item,i)=>{
      const start=item.position;
      const end=i<normalized.length-1?normalized[i+1].position:100;
      return `${item.color} ${start}% ${Math.max(start,end)}%`;
    }).filter((_,i)=>i===normalized.length-1 || normalized[i].position<normalized[i+1].position);

    // 位置情報がない単色・互換データも、色数と同じ個数で駅間を等分する。
    ranges=safe.map((color,i)=>`${color} ${(i/safe.length)*100}% ${((i+1)/safe.length)*100}%`);

function displayedRouteColorForTrainPosition(train,position=null){

  const isInteger=Math.abs(clamped-Math.round(clamped))<1e-6;
  if(isInteger){
    const stationIndex=Math.round(clamped);
    const stationName=String(STATIONS[stationIndex]?.nameJa||'').trim();
    const dir=String(train?.direction||'').toLowerCase();

    // 列車の実際の終点を最後の停車駅から判定。
    let terminalName=getShortDest(train?.dest||'').trim();
    let penultimateName='';
    const trainStops=Array.isArray(train?.stops)?train.stops:[];
    for(let i=trainStops.length-1;i>=0;i--){
      const name=String(trainStops[i]?.station||'').trim();
      if(!name) continue;
      if(!terminalName) terminalName=name;
      if(name===terminalName) continue;
      penultimateName=name;
      break;
    }

    if(stationName && terminalName && stationName===terminalName){
      // 前の停車駅が路線図上で特定できる場合は、実際に入ってきた側から終点の区間を選ぶ。
      // （急行などで途中駅を通過していても、終点駅の左右どちら側から来たかを判定できる。）
      const prevIdx=penultimateName ? STATIONS.findIndex(st=>String(st?.nameJa||'')===penultimateName) : -1;
      if(prevIdx>=0 && prevIdx!==stationIndex){
        segIndex=prevIdx<stationIndex ? stationIndex-1 : stationIndex;
      }else if(dir==='up'){
        // 画面上の駅順は下り方向なので、上り列車の終点は通常「次区間」側から入る。
        segIndex=stationIndex;
      }else if(dir==='down'){
        segIndex=stationIndex-1;
      }else{
        segIndex=Math.min(stationIndex,max-1);
      }
    }else if(dir==='up'){
      segIndex=stationIndex-1;
    }else if(dir==='down'){
      segIndex=stationIndex;
    }else{
      segIndex=Math.min(stationIndex,max-1);
    }
  }
  segIndex=Math.max(0,Math.min(max-1,segIndex));
  const a=STATIONS[segIndex]?.nameJa;
  const b=STATIONS[segIndex+1]?.nameJa;
  if(!a||!b) return null;
  return trainServiceColorBetweenStations(a,b,train)||activeSegmentColors(a,b)?.[0]||null;
}
function typeColorConfigForTrain(train,type){

function routeNameForTrainStation(train,stationName){

  if(idx<0) return '';
  let a='',b='';
  if(idx<rows.length-1){a=String(rows[idx]?.station||'');b=String(rows[idx+1]?.station||'');}
  else if(idx>0){a=String(rows[idx-1]?.station||'');b=String(rows[idx]?.station||'');}
  return a&&b ? String(preferredTrainServiceLine(a,b,train)?.name||'') : '';
}
function routeNameForTrainPosition(train,position){
  if(position===null||position===undefined||!Array.isArray(STATIONS)||STATIONS.length<2) return '';
  const q=Number(position);
  if(!Number.isFinite(q)) return '';
  const max=STATIONS.length-1;
  const clamped=Math.max(0,Math.min(max,q));
  let segIndex=Math.floor(clamped);
  const isInteger=Math.abs(clamped-Math.round(clamped))<1e-6;
  if(isInteger){
    const stationIndex=Math.round(clamped);
    const stationName=String(STATIONS[stationIndex]?.nameJa||'').trim();
    const dir=String(train?.direction||'').toLowerCase();
    let terminalName=getShortDest(train?.dest||'').trim();
    let penultimateName='';
    const trainStops=Array.isArray(train?.stops)?train.stops:[];
    for(let i=trainStops.length-1;i>=0;i--){
      const name=String(trainStops[i]?.station||'').trim();
      if(!name) continue;
      if(!terminalName) terminalName=name;
      if(name===terminalName) continue;
      penultimateName=name;
      break;
    }
    if(stationName&&terminalName&&stationName===terminalName){
      const prevIdx=penultimateName?STATIONS.findIndex(st=>String(st?.nameJa||'')===penultimateName):-1;
      if(prevIdx>=0&&prevIdx!==stationIndex) segIndex=prevIdx<stationIndex?stationIndex-1:stationIndex;
      else if(dir==='up') segIndex=stationIndex;
      else if(dir==='down') segIndex=stationIndex-1;
      else segIndex=Math.min(stationIndex,max-1);
    }else if(dir==='up') segIndex=stationIndex-1;
    else if(dir==='down') segIndex=stationIndex;
    else segIndex=Math.min(stationIndex,max-1);
  }
  segIndex=Math.max(0,Math.min(max-1,segIndex));
  const a=String(STATIONS[segIndex]?.nameJa||'');
  const b=String(STATIONS[segIndex+1]?.nameJa||'');
  return a&&b ? String(preferredTrainServiceLine(a,b,train)?.name||'') : '';
}
function routeLineColorForTypeBadge(train,position=null,stationName=''){
  const rows=Array.isArray(train?.stops)?train.stops:[];
  const station=String(stationName||'').trim();
  if(station && rows.length){
    const idx=rows.findIndex(row=>String(row?.station||'').trim()===station);
    if(idx>=0){
      // 駅ラベルと同じ考え方で、原則として当該駅から次駅への区間色を使用する。
      if(idx<rows.length-1){
        const color=trainServiceColorBetweenStations(rows[idx]?.station,rows[idx+1]?.station,train);
        if(color) return String(color);
      }
      if(idx>0){
        const color=trainServiceColorBetweenStations(rows[idx-1]?.station,rows[idx]?.station,train);
        if(color) return String(color);
      }
    }
  }
  if(position!==null && position!==undefined){
    const color=displayedRouteColorForTrainPosition(train,position);
    if(color) return String(color);
  }
  if(train){
    const currentPos=positionForTrain(train,currentMinutes())?.pos;
    if(Number.isFinite(Number(currentPos))){
      const color=displayedRouteColorForTrainPosition(train,Number(currentPos));
      if(color) return String(color);
    }
  }
  // 停車駅データだけで判定できる場合のフォールバック。
  if(rows.length>1){
    const color=trainServiceColorBetweenStations(rows[0]?.station,rows[1]?.station,train);
    if(color) return String(color);
  }
  const served=Array.isArray(train?.servedLineNames)?train.servedLineNames:[];
  for(const name of served){
    const color=String(lineDefByName(name)?.color||'').trim();
    if(color) return color;
  }
  return '';
}

function typeColorFromByRoute(train,type,position=null,stationName='',stationDirectionColor=null){
  const config=typeColorConfigForTrain(train,type);
  const byRoute=config&&typeof config==='object'&&config.byRoute&&typeof config.byRoute==='object' ? config.byRoute : null;
  if(!byRoute) return '';
  let lineName=routeNameForTrainStation(train,stationName);
  if(!lineName && position!==null && position!==undefined) lineName=routeNameForTrainPosition(train,position);
  if(!lineName && train){
    const nowPos=positionForTrain(train,currentMinutes())?.pos;
    if(Number.isFinite(Number(nowPos))) lineName=routeNameForTrainPosition(train,Number(nowPos));
  }
  if(lineName && String(byRoute[lineName]||'').trim()){
    // 種別バッジ・列車アイコン下部の色はJSONのtypeColors.<種別>.byRouteを使用する。
    // 線路・駅ラベルの路線色(line.color)とは別の設定なので、ここで置き換えない。
    return String(byRoute[lineName]).trim();
  }
  // 1線区だけのページや駅・位置情報を持たない帳票では、所属線区の指定色を使用する。
  const activeNames=getActiveRouteLineNames();
  if(activeNames.length===1 && String(byRoute[activeNames[0]]||'').trim()) return String(byRoute[activeNames[0]]).trim();
  for(const name of (Array.isArray(train?.servedLineNames)?train.servedLineNames:[])){
    if(String(byRoute[name]||'').trim()) return String(byRoute[name]).trim();
  }
  for(const name of activeNames){
    if(String(byRoute[name]||'').trim()) return String(byRoute[name]).trim();
  }
  return String(stationDirectionColor||'').trim();
}
function typeColorForTrain(train,position=null,stationName='',stationDirectionColor=null){
  const type=String(train?.type||'').trim();
  // JSONの通常の文字列色と、広島地区の typeColors.<種別>.byRoute の両方に対応する。
  const sourceColors=(train?.sourceTypeColors&&typeof train.sourceTypeColors==='object')?train.sourceTypeColors:{};
  const colors={...sourceColors,...(activeJson?.typeColors||{}),...(activeRouteMeta?.typeColors||{})};
  if(isShinanoMainRoute()){
    if(type==='快速' && shinanoTrainName(train)) return '#d71920';
    if(type==='普通') return '#1677d2';
    if(type==='快速') return '#f39800';
  }
  const expressCategory=naganoExpressCategoryFor(train,type);
  if(expressCategory){
    const expressColor=colors[expressCategory];
    if(typeof expressColor==='string'&&expressColor.trim()) return expressColor.trim();
    return expressCategory==='A特急'?'#e91419':'#2e7d32';
  }
  const configured=colors[type];
  if(configured && typeof configured==='object' && configured.byRoute && typeof configured.byRoute==='object'){
    // 「普通／各駅停車」は独自に追加されたtypeColors.byRouteではなく、
    // 駅ラベル・区間線に使っているJSONの実際の路線色を使用する。
    if(!type || type==='普通' || type==='各駅停車'){
      const actualRouteColor=routeLineColorForTypeBadge(train,position,stationName);
      return String(actualRouteColor||stationDirectionColor||activeRouteColors()[0]||'#666');
    }
    const routeColor=typeColorFromByRoute(train,type,position,stationName,stationDirectionColor);
    if(routeColor) return routeColor;
  }
  if(Object.prototype.hasOwnProperty.call(sourceColors,type) && typeof sourceColors[type]==='string') return String(sourceColors[type]);
  if(Object.prototype.hasOwnProperty.call(colors,type) && typeof colors[type]==='string') return String(colors[type]);
  if(type==='回送') return String(colors?.回送||'#fff');
  if(type.includes('快速')) return String(colors?.快速||FAST_TYPE_COLOR||'#f39800');
  const currentRouteColor=displayedRouteColorForTrainPosition(train,position);
  if(!type || type==='普通' || type==='各駅停車') return String(currentRouteColor||stationDirectionColor||activeRouteColors()[0]||'#666');
  if(currentRouteColor) return String(currentRouteColor);
  const fallback=String(fallbackTrainServiceColor(train)||activeRouteColors()[0]||'#666');
  return fallback;
}
function typeBadgeAppearance(train,position=null,stationDirectionColor=null,stationName=''){

  const resolvedPosition=position!=null

function shadeColor(hex,amt){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '#444';
  const n=parseInt(h,16); const r=Math.max(0,Math.min(255,(n>>16)+amt)); const g=Math.max(0,Math.min(255,((n>>8)&255)+amt)); const b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function makeLightBorder(hex){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '#ddd';
  const n=parseInt(h,16); const r=Math.round(((n>>16)+255)/2); const g=Math.round((((n>>8)&255)+255)/2); const b=Math.round(((n&255)+255)/2);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function mixColor(a,b,ratio=0.5){
  const pa=String(a||'').replace('#',''), pb=String(b||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(pa)||!/^[0-9a-fA-F]{6}$/.test(pb)) return '#f0f0f0';
  const ra=parseInt(pa.slice(0,2),16), ga=parseInt(pa.slice(2,4),16), ba=parseInt(pa.slice(4,6),16);
  const rb=parseInt(pb.slice(0,2),16), gb=parseInt(pb.slice(2,4),16), bb=parseInt(pb.slice(4,6),16);
  const t=Math.max(0,Math.min(1,Number(ratio)));
  const r=Math.round(ra*(1-t)+rb*t), g=Math.round(ga*(1-t)+gb*t), bl=Math.round(ba*(1-t)+bb*t);
  return '#'+[r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('');
}

<script>
/* ===== mainpage共通：編成・Firebase処理 =====
   路線ごとの差はROUTE_REGISTRY / 外部JSONのデータだけで決定し、
   路線別HTMLから移植した個別保存処理は使用しない。 */
(function(){
  function routeMetaForFamily(family){
    const key=String(family||'').trim();
    return Object.values(ROUTE_REGISTRY).find(meta=>String(meta?.formationFamily||'').trim()===key)||null;
  }

  for(const family of FORMATION_FAMILIES){
    if(!formationRemoteByFamily[family]) formationRemoteByFamily[family]={};
    Object.assign(formationRemoteByFamily[family],{
      stateByDay:formationRemoteByFamily[family].stateByDay||{平日:{},休日:{}},
      formationUpdatedAtByDay:formationRemoteByFamily[family].formationUpdatedAtByDay||{平日:{},休日:{}},
      formationUpdatedByDate:formationRemoteByFamily[family].formationUpdatedByDate||{},
      areaStateByDate:formationRemoteByFamily[family].areaStateByDate||{},
      areaMetaByDate:formationRemoteByFamily[family].areaMetaByDate||{}
    });
  }

  function storageRootForFamily(family){
    return String(routeMetaForFamily(family)?.storageRoot||'').trim();
  }
  function storageAreaForFamily(family){
    const meta=routeMetaForFamily(family);
    return meta?.storageArea===null ? '__ROOT__' : String(meta?.storageArea||'__ROOT__').trim()||'__ROOT__';
  }
  function storageFamilyForActiveRoute(){
    return formationStorageContext(activeRouteName).family;
  }
  window.storageRootForFamily=storageRootForFamily;
  window.storageAreaForFamily=storageAreaForFamily;
  window.storageFamilyForActiveRoute=storageFamilyForActiveRoute;

  function formationDateKey(){
    const key=String(selectedDateKey||'').trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(key)?key:operationDateKey();
  }
  window.formationDateKey=formationDateKey;

  function makeStoredMeta(){
    const now=new Date();
    const stamp=`${String(now.getFullYear()%100).padStart(2,'0')}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
    const name=String(currentUserProfile?.name||currentAuthUser?.displayName||'').trim();
    return name?`${stamp}@${name}`:stamp;
  }
  function parseStoredMeta(raw){
    if(raw===null||raw===undefined||String(raw)==='') return {time:'',stamp:'',author:''};
    const text=String(raw).trim();
    const at=text.indexOf('@');
    const timePart=at>=0?text.slice(0,at):text;
    const author=at>=0?text.slice(at+1).replace(/^@+/,'').trim():'';
    const compact=timePart.match(/^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/);
    if(compact){
      const month=Number(compact[2]),day=Number(compact[3]),hour=Number(compact[4]),minute=Number(compact[5]);
      if(month>=1&&month<=12&&day>=1&&day<=31&&hour>=0&&hour<=23&&minute>=0&&minute<=59){
        return {time:String(hour*60+minute),stamp:timePart,author};
      }
    }
    const minuteValue=Number(timePart);
    if(Number.isFinite(minuteValue)&&minuteValue>=0&&minuteValue<=1439){
      return {time:String(Math.floor(minuteValue)),stamp:'',author};
    }
    const hm=text.match(/^(\d{1,2}):(\d{2})(?:\s*@(.+))?$/);
    if(hm) return {time:String(Number(hm[1])*60+Number(hm[2])),stamp:'',author:String(hm[3]||'').trim()};
    const d=new Date(timePart);
    if(!Number.isNaN(d.getTime())) return {time:String(d.getHours()*60+d.getMinutes()),stamp:'',author};
    return {time:'',stamp:'',author:''};
  }
  function formatStoredMeta(raw){
    const meta=parseStoredMeta(raw);
    if(!meta.time) return '';
    const mins=Math.max(0,Math.min(1439,Number(meta.time)||0));
    return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}${meta.author?` @${meta.author}`:''}`;
  }
  window.parseStoredMeta=parseStoredMeta;
  window.formatStoredMeta=formatStoredMeta;

  formationFamilyFromType=function(group){
    return String(group?.family||group?.formationFamily||activeRouteMeta?.formationFamily||'').trim();
  };
  formationFamily=function(group){
    return formationFamilyFromType(group);
  };
  allowedFormationFamily=function(train){
    return formationStorageContext(train).family;
  };
  formationFamilyForTypeSafe=function(group){
    return formationFamily(group);
  };
  formationFamilyForTrain=function(train){
    return formationStorageContext(train).family;
  };
  formationsForTrain=function(train){
    const target=train||currentTrainSnapshot||{};
    const family=allowedFormationFamily(target);
    // 編成形式名と並び順は路線別の特例で書き換えず、JSON定義をそのまま使用する。
    return (FORMATIONS||[]).filter(group=>formationFamily(group)===family && formationRouteAllowed(group,target));
  };

  function canonicalFormationId(value){
    if(value===null||value===undefined||String(value).trim()==='') return null;
    const raw=String(value).trim();
    const direct=formationById(raw)||formationById(raw.replace(/F$/i,''));
    return direct?.id ? String(direct.id).replace(/F$/i,'') : null;
  }
  window.canonicalFormationId=canonicalFormationId;

  // 履歴に残る「編成未選択」や旧UIのプレースホルダーを、実編成IDとして扱わない。
  function isUnselectedFormationId(value){
    const raw=String(value??'').trim();
    return raw==='__INITIAL__' || raw==='編成未選択' || /^(?:unselected|none|null|undefined)$/i.test(raw);
  }
  window.isUnselectedFormationId=isUnselectedFormationId;
  normalizeStoredFormationId=function(value){
    if(value===null||value===undefined||String(value).trim()==='') return null;
    const ids=String(value).split('+').map(x=>{
      const part=String(x??'').trim();
      if(!part||isUnselectedFormationId(part)) return '';
      return canonicalFormationId(part)||part.replace(/F$/i,'').trim();
    }).filter(Boolean);
    return ids.length?ids.join('+'):null;
  };

  formationAllowedForTrain=function(train,id){
    if(!id||id===INITIAL_FORMATION_SELECTION.id) return true;
    const target=train||{};
    const targetFamily=allowedFormationFamily(target);
    return String(id).split('+').map(x=>x.trim()).filter(Boolean).every(one=>{
      const obj=formationById(one);
      return !!obj && formationFamily(obj)===targetFamily && formationRouteAllowed(obj,target) && !obj.disabled;
    });
  };

  trainBelongsToFamily=function(no,family){
    const key=String(no||'').trim();
    if(!key) return false;
    return operationTrainSourceForDay(currentDay).some(t=>String(t?.no||'').trim()===key&&formationFamilyForTrain(t)===String(family||''));
  };

  function normalizeEntry(entry){
    if(entry===null||entry===undefined) return null;
    const rawValue=typeof entry==='object' ? (entry.f??entry.formation??'') : entry;
    const ids=String(rawValue??'').split('+').map(x=>{
      const part=String(x??'').trim();
      if(!part||isUnselectedFormationId(part)) return '';
      return canonicalFormationId(part)||part.replace(/F$/i,'').trim();
    }).filter(Boolean);
    if(!ids.length) return null;
    const meta=parseStoredMeta(typeof entry==='object' ? (entry.t??entry.time??'') : '');
    const out={f:ids.join('+'),t:meta.time ? (meta.stamp ? `${meta.stamp}${meta.author?`@${meta.author}`:''}` : `${meta.time}${meta.author?`@${meta.author}`:''}`) : ''};
    const role=typeof entry==='object'?String(entry.r||'').trim():'';
    if(role) out.r=role;
    return out;
  }

  function normalizeStorageRoot(raw,family){
    const out={};
    if(!raw||typeof raw!=='object') return out;
    const area=storageAreaForFamily(family);
    if(area==='__ROOT__'){
      const mergeDateTrains=(date,trains)=>{
        if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))||!trains||typeof trains!=='object') return;
        const existing=out[String(date)]?.__ROOT__||{};
        const areaOut={...existing};
        for(const [no,entry] of Object.entries(trains)){
          const normalized=normalizeEntry(entry);
          // すでに新しい直下パスへ保存されている値を旧データで上書きしない。
          if(normalized && !areaOut[String(no)]) areaOut[String(no)]=normalized;
        }
        if(Object.keys(areaOut).length) out[String(date)]={__ROOT__:areaOut};
      };
      for(const [date,value] of Object.entries(raw)){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))) continue;
        const trains=value&&typeof value==='object'&&value.__ROOT__&&typeof value.__ROOT__==='object' ? value.__ROOT__ : value;
        mergeDateTrains(date,trains);
      }
      // 旧構造 広島地区/JR広島/{日付}/{列車番号} も新しい直下構造へ読み替える。
      const legacyHiroshima=family==='hiroshima' ? raw?.['JR広島'] : null;
      if(legacyHiroshima&&typeof legacyHiroshima==='object'){
        for(const [date,trains] of Object.entries(legacyHiroshima)) mergeDateTrains(date,trains);
      }
      return out;
    }
    const areaObj=raw?.[area];
    if(!areaObj||typeof areaObj!=='object') return out;
    for(const [date,trains] of Object.entries(areaObj)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))||!trains||typeof trains!=='object') continue;
      const areaOut={};
      for(const [no,entry] of Object.entries(trains)){

  }

  // 最後の投稿を削除した場合は別ノードに「全削除済み」を記録し、古い状態ノードへ戻らないようにする。
  const formationInputHistoryLatestByFamily={};
  const formationInputHistoryClearedByFamily={};
  function refreshFormationInputHistoryLatestForFamily(family,rawRoot){
    const area=storageAreaForFamily(family);
    const historyRoot=rawRoot?.__formationInputHistory;
    const areaHistory=area==='__ROOT__' ? historyRoot : historyRoot?.[area];
    const next={};
    if(areaHistory && typeof areaHistory==='object'){
      for(const [date,dateValue] of Object.entries(areaHistory)){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date)) || !dateValue || typeof dateValue!=='object') continue;
        const latestByNo={};
        for(const [trainNo,postsValue] of Object.entries(dateValue)){
          if(!postsValue || typeof postsValue!=='object') continue;
          let latest=null;
          for(const [postKey,rawPost] of Object.entries(postsValue)){
            if(!rawPost || typeof rawPost!=='object') continue;
            const hasFormationField=Object.prototype.hasOwnProperty.call(rawPost,'f')||Object.prototype.hasOwnProperty.call(rawPost,'formation');
            const rawFormation=rawPost.f??rawPost.formation??'';
            const explicitlyUnselected=isUnselectedFormationId(rawFormation)||(hasFormationField&&String(rawFormation).trim()==='');
            const formation=explicitlyUnselected?'':String(normalizeStoredFormationId(rawFormation)||'').trim();
            // 編成未選択の投稿も最新イベントとして保持するが、編成IDとしては扱わない。
            if(!formation&&!explicitlyUnselected) continue;
            const candidate={...rawPost,key:String(postKey),f:formation,unselected:!formation&&explicitlyUnselected};
            const candidateTime=Number(candidate.at??candidate.createdAt)||0;
            const latestTime=Number(latest?.at??latest?.createdAt)||0;
            if(!latest || candidateTime>latestTime || (candidateTime===latestTime && String(candidate.key).localeCompare(String(latest.key))>0)) latest=candidate;
          }

        }

    const areaCleared=area==='__ROOT__' ? clearedRoot : clearedRoot?.[area];
    const clearedByDate={};
    if(areaCleared && typeof areaCleared==='object'){
      for(const [date,dateValue] of Object.entries(areaCleared)){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date)) || !dateValue || typeof dateValue!=='object') continue;
        const clearedNos={};
        for(const [trainNo,cleared] of Object.entries(dateValue)) if(cleared) clearedNos[String(trainNo)]=true;
        if(Object.keys(clearedNos).length) clearedByDate[String(date)]=clearedNos;
      }
    }

  function wasFormationInputHistoryCleared(family,date,trainNo){

  function compactFormationTimestampMs(raw){
    const text=String(raw||'').trim();
    const match=text.match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
    if(!match) return 0;
    const yy=Number(match[1]),mm=Number(match[2]),dd=Number(match[3]),hh=Number(match[4]),mi=Number(match[5]);
    if(mm<1||mm>12||dd<1||dd>31||hh>23||mi>59) return 0;
    const value=new Date(2000+yy,mm-1,dd,hh,mi,0,0).getTime();
    return Number.isFinite(value)?value:0;
  }

  function storedFormationIsNewerThanHistory(storedEntry,historyEntry){

    const storedMinute=Math.floor(storedAt/60000);
    const historyMinute=Math.floor(historyAt/60000);
    // 未選択で状態ノードを削除した後に再登録された編成は、時刻が同じ分でも現在状態を優先する。
    // 分単位の保存時刻だけで厳密な「>」比較をすると、同じ分に再登録した編成が未選択履歴に負ける。
    if(historyEntry?.unselected) return storedMinute>=historyMinute;
    return storedMinute>=historyMinute;

    if(!normalized) return null;

      if((typeof normalizeTrainNo==='function' ? normalizeTrainNo(savedNo) : savedNo)===normalized) return entry;

  registeredFormationForTrain=function(train){
    if(!train) return null;
    // 古いtrain.formationへのフォールバックで「編成未選択」が取り消されないよう、
    // 履歴の解決結果が明示的な未選択だったかを列車オブジェクトにも記録する。
    try{ train.__formationExplicitlyUnselected=false; }catch(e){}
    const family=formationFamilyForTrain(train);
    const date=formationDateKey();
    const area=storageAreaForFamily(family);
    const no=String(train.no||'').trim();
    if(!no) return null;

    // Firebaseの現在状態。列番の表記揺れは正規化後の完全一致で補完する。
    const stored=formationRemoteByFamily[family]?.areaStateByDate?.[date]?.[area]||{};
    const getSavedEntry=(trainNo)=>{
      const key=String(trainNo||'').trim();
      if(!key) return null;
      if(stored?.[key] && typeof stored[key]==='object') return stored[key];
      const normalized=normalizeTrainNo(key);
      if(!normalized) return null;
      for(const [savedNo,entry] of Object.entries(stored)){
        if(normalizeTrainNo(savedNo)===normalized && entry && typeof entry==='object') return entry;
      }
      return null;
    };

    // 接続運用は必ず始発側から終着側の順に並べる。
    // 以前は「選択中の列番→チェーン先頭」の順で確認していたため、Cを選ぶと
    // AとBの両方に登録があっても、先に見つかったAの編成が誤って採用されていた。
    const chainInfo=findChain(currentDay,no);
    const chain=chainInfo ? (OPERATION_CHAINS?.[currentDay]?.[chainInfo.chainIndex]||[]) : [];
    let chainNos=[];
    for(const entry of chain){
      const linkedNo=String(entry?.no||entry||'').trim();
      if(linkedNo && !chainNos.some(existing=>normalizeTrainNo(existing)===normalizeTrainNo(linkedNo))) chainNos.push(linkedNo);
    }
    const normalizedNo=normalizeTrainNo(no);
    let targetIndex=chainNos.findIndex(linkedNo=>normalizeTrainNo(linkedNo)===normalizedNo);
    if(targetIndex<0){
      const canonicalNo=normalizedNo.replace(/A$/i,'');
      targetIndex=chainNos.findIndex(linkedNo=>normalizeTrainNo(linkedNo).replace(/A$/i,'')===canonicalNo);
    }
    if(targetIndex<0){
      chainNos=[no];
      targetIndex=0;
    }else if(normalizeTrainNo(chainNos[targetIndex])!==normalizedNo){
      // A付き・Aなしなどの表記揺れに対し、選択中の列番自身の登録も確認する。
      chainNos.splice(targetIndex,0,no);
    }

    const resolveForNo=(candidateNo)=>{
      const saved=getSavedEntry(candidateNo);
      const historyEntry=latestFormationInputHistoryEntry(family,date,candidateNo);
      if(historyEntry){
        const stateValue=String(saved?.f||'').trim();
        if(stateValue && storedFormationIsNewerThanHistory(saved,historyEntry)) return {found:true,value:stateValue};
        if(String(historyEntry.f||'').trim()) return {found:true,value:String(historyEntry.f).trim()};
        if(historyEntry.unselected) return {found:true,value:'',explicitlyUnselected:true};
      }
      // 最後の履歴が削除された列番は、古い状態ノードを再利用しない。
      if(wasFormationInputHistoryCleared(family,date,candidateNo)) return {found:true,value:'',explicitlyUnselected:true};
      const value=String(saved?.f||'').trim();
      if(value) return {found:true,value};
      return {found:false,value:''};
    };

    // 選択中の列車自身、次に直前列車、さらにその前の列車の順で確認する。
    // これにより A→B→C で A・B に登録があり、Cを選択した場合はBの編成になる。
    for(let i=targetIndex;i>=0;i--){
      const result=resolveForNo(chainNos[i]);
      if(result.found){
        try{ train.__formationExplicitlyUnselected=!String(result.value||'').trim(); }catch(e){}
        return result.value||null;
      }
    }
    // 選択位置までに登録がなければ、接続運用内で最後に登録された列車を使う。
    for(let i=chainNos.length-1;i>targetIndex;i--){
      const result=resolveForNo(chainNos[i]);
      if(result.found){
        try{ train.__formationExplicitlyUnselected=!String(result.value||'').trim(); }catch(e){}
        return result.value||null;
      }
    }
    return null;
  };

  loadFormationFamilyFromFirebase=async function(family){
    if(!routeMetaForFamily(family)) return false;
    const ref=formationOperationRef(family);
    if(!ref) return false;
    const snap=await ref.once('value');
    let raw=snap.val()||{};
    // 広島地区の旧パス「広島地区/JR広島/{日付}/{列車番号}」を、
    // 初回読込時に「広島地区/{日付}/{列車番号}」へ統合する。既存の直下値は優先。
    if(family==='hiroshima' && raw?.['JR広島'] && typeof raw['JR広島']==='object'){
      const updates={};
      for(const [date,trains] of Object.entries(raw['JR広島'])){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))||!trains||typeof trains!=='object') continue;
        for(const [no,entry] of Object.entries(trains)){
          const current=raw?.[date]?.[no];
          if(current===undefined || current===null) updates[`${date}/${no}`]=entry;
        }
      }
      updates['JR広島']=null;
      try{
        await ref.update(updates);
        const migrated=await ref.once('value');
        raw=migrated.val()||{};
      }catch(migrationError){
        // 書込権限がない場合も、旧構造をローカルへ読み替えて利用は継続する。
        console.warn('広島地区Firebase旧パスの移行に失敗（旧データを読み替えて利用）',migrationError);
      }
    }
    refreshFormationInputHistoryLatestForFamily(family,raw);
    formationRemoteByFamily[family].areaStateByDate=normalizeStorageRoot(raw,family);
    syncDerivedStateForFamily(family);
    return true;
  };

  async function syncRegistrationToRemoteByFamily(changesByFamily, options={}){
    const families=Object.keys(changesByFamily||{}).filter(f=>Object.keys(changesByFamily[f]||{}).length);
    if(!families.length) return true;
    if(!firebaseReady||!firebaseDb){syncStatus('Firebase未接続');return false;}
    try{
      const date=formationDateKey();
      const roleCode=typeof window.currentPermissionCodeForRoute==='function' ? window.currentPermissionCodeForRoute(activeRouteName) : '';
      for(const family of families){
        const db=firebaseDatabaseForFamily(family);
        const root=storageRootForFamily(family),area=storageAreaForFamily(family);
        if(!db||!root) continue;
        const updates=changesByFamily[family]||{};
        const stamp=makeStoredMeta();
        for(const [no,formId] of Object.entries(updates)){
          const ref=area==='__ROOT__'
            ? db.ref(root).child(date).child(String(no))
            : db.ref(root).child(area).child(date).child(String(no));
          const normalized=normalizeStoredFormationId(formId);
          if(normalized){
            const payload={f:normalized,t:stamp};
            if(roleCode) payload.r=roleCode;
            await ref.set(payload);
          }else{
            // プルダウンで「編成未選択」を選んだときは、現在状態を削除する。
            await ref.remove();
          }
          // 複数編成のスロット選択途中では入力履歴を作らず、全編成の登録完了時に1件だけ記録する。
          // 完了時にも「編成未選択」は最新イベントとして記録し、古い入力履歴の復活を防ぐ。
          if(options?.skipInputHistory!==true) try{
            let historyRef=db.ref(root).child('__formationInputHistory');
            if(area!=='__ROOT__') historyRef=historyRef.child(area);
            historyRef=historyRef.child(date).child(String(no));
            const historyPost={
              f:normalized||INITIAL_FORMATION_SELECTION.id,
              at:Date.now(),
              author:String(currentUserProfile?.name||currentAuthUser?.displayName||currentUserProfile?.id||'ユーザー').trim(),
              uid:String(currentAuthUser?.uid||currentUserProfile?.uid||''),
              userId:String(currentUserProfile?.id||''),
              route:String(activeRouteName||''),
              r:String(roleCode||'')
            };
            await historyRef.push().set(historyPost);
            // 新しい登録・未選択イベントが追加されたら、以前の全削除マーカーを解除する。
            let clearedRef=db.ref(root).child('__formationInputHistoryCleared');
            if(area!=='__ROOT__') clearedRef=clearedRef.child(area);
            await clearedRef.child(date).child(String(no)).remove();
          }catch(historyError){
            // 履歴書き込みに失敗しても、成功した現在状態の更新は成功扱いにする。
            console.warn('編成入力履歴の保存に失敗しました',historyError);
          }
        }
        await loadFormationFamilyFromFirebase(family);
      }
      mergeFormationRemoteIntoLegacyState();
      registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshAllTrainDataCache();
      syncStatus('Firebase同期済み');
      return true;
    }catch(e){
      console.error('編成登録Firebase同期失敗',e);
      syncStatus('Firebase書込失敗');
      return false;
    }
  }
  window.syncRegistrationToRemoteByFamily=syncRegistrationToRemoteByFamily;
