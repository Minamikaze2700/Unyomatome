<!-- 列車情報：停車駅／今日の運用／編成情報を同一タブ領域で表示 -->
<script id="train-info-design-update">
(function(){
  let currentTrainInfoTab='stops';

  function primaryTrainInfoColor(){
    try{
      return String(jsonBaseColorForActiveRoute?.() || activeRouteColors?.()?.[0] || activeJson?.lines?.[0]?.color || '#808080').trim() || '#808080';
    }catch(e){ return '#808080'; }
  }

  function rawFormationDefinitionById(id){
    const canonical=String(id||'').trim().replace(/F$/i,'');
    if(!canonical || !activeJson) return null;
    const groups=Array.isArray(activeJson?.formations)?activeJson.formations:[];
    const visitItems=(items,groupType)=>{
      for(const item of (Array.isArray(items)?items:[])){
        const iid=String(item?.id||item?.formation||item?.name||'').trim().replace(/F$/i,'');
        const iname=String(item?.name||'').trim().replace(/F$/i,'');
        if(iid===canonical || iname===canonical) return {...item,type:String(item?.type||groupType||''),_groupType:String(groupType||'')};
      }
      return null;
    };
    for(const g of groups){
      let hit=visitItems(g?.items,g?.type); if(hit) return hit;
      for(const v of (Array.isArray(g?.variants)?g.variants:[])){
        hit=visitItems(v?.items,g?.type); if(hit) return hit;
      }
    }
    return null;
  }

  function reverseVehicleNumbersForFormation(id){
    const canonical=String(id||'').trim().replace(/F$/i,'');
    const map=activeJson?.vehicleToFormation||{};
    const arr=[];
    for(const [vehicle,formation] of Object.entries(map)){
      const f=String(formation||'').trim().replace(/F$/i,'');
      if(f===canonical) arr.push(String(vehicle||'').trim());
    }
    return [...new Set(arr.filter(Boolean))].sort((a,b)=>{
      const na=Number(String(a).match(/\d+/)?.[0]||Infinity);
      const nb=Number(String(b).match(/\d+/)?.[0]||Infinity);
      return na-nb || a.localeCompare(b,'ja');
    });
  }

  function formationRawValue(raw, keys){
    for(const key of keys){
      const v=raw?.[key];
      if(v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();
    }
    return '';
  }

  function formationCarNames(raw,id){
    const direct=Array.isArray(raw?.carNames)
      ? raw.carNames.map(x=>String(x||'').trim()).filter(Boolean)
      : (Array.isArray(raw?.cars) ? raw.cars.map(x=>String(x||'').trim()).filter(Boolean) : []);
    if(direct.length) return direct;
    const reversed=reverseVehicleNumbersForFormation(id);
    if(reversed.length) return reversed;
    const count=Number(raw?.carCount ?? raw?.cars);
    if(Number.isFinite(count) && count>0) return Array.from({length:count},()=> '');
    return [];
  }

  function operationChainForCurrentTrain(train){
    const day=currentDay;
    const info=findChain(day,String(train?.no||''));
    let chain=null;
    if(info){
      const candidate=OPERATION_CHAINS?.[day]?.[info.chainIndex];
      if(Array.isArray(candidate) && candidate.length) chain=candidate;
    }
    if(!chain){
      // 列車番号を持たない列車では内部識別子を「仮の列番」として表示しない。
      return [{
        no:'',
        type:String(train?.type||''),
        start:String(train?.start||train?.stops?.[0]?.station||''),
        startTime:String(train?.startTime||train?.stops?.[0]?.departure||train?.stops?.[0]?.time||''),
        dest:String(train?.dest||train?.stops?.[train.stops.length-1]?.station||''),
        endTime:String(train?.endTime||train?.stops?.[train.stops.length-1]?.arrival||train?.stops?.[train.stops.length-1]?.time||''),
        _sourceTrain:train,
        _fromIndex:0,
        _toIndex:Math.max(0,(train?.stops?.length||1)-1)
      }];
    }

    const expanded=[];
    for(const entry of chain){
      const entryNo=String(entry?.no||'').trim();
      const sourceTrain=entryNo ? findOperationTrainRecord(entryNo,day) : null;
      // 実際のJSON列車データにある番号だけを使用し、内部ID・仮番号は表示しない。
      const hasRealNumber=!!sourceTrain && sourceTrain.hasTrainNumber!==false && !sourceTrain.hideTrainNumber;
      const stops=Array.isArray(sourceTrain?.stops)?sourceTrain.stops:[];
      const rawSegments=sourceTrain?.numberSegments && typeof sourceTrain.numberSegments==='object'
        ? Object.values(sourceTrain.numberSegments).flatMap(v=>Array.isArray(v)?v:[])
        : [];
      const segments=[];
      const seen=new Set();
      for(const seg of rawSegments){
        const from=Number(seg?.from),to=Number(seg?.to);
        if(!Number.isFinite(from)||!Number.isFinite(to)||from>to) continue;
        const segNo=hasRealNumber?String(seg?.no||'').trim():'';
        if(!segNo) continue;
        const key=`${segNo}|${from}|${to}`;
        if(seen.has(key)) continue;
        seen.add(key);
        segments.push({no:segNo,from,to});
      }
      segments.sort((a,b)=>a.from-b.from||a.to-b.to);
      // 路線境界などで同じ列車番号の区間が複数登録されている場合は1つにまとめる。
      // 番号そのものが切り替わる箇所だけを、運用の表示上の分割境界とする。
      const mergedSegments=[];
      for(const seg of segments){
        const last=mergedSegments[mergedSegments.length-1];
        if(last && last.no===seg.no && seg.from<=last.to+1){
          last.to=Math.max(last.to,seg.to);
        }else{
          mergedSegments.push({...seg});
        }
      }

      // numberChanges により番号が途中で変わる場合は、変更駅を境界として分割する。
      if(stops.length && mergedSegments.length>1){
        for(const seg of mergedSegments){
          const from=Math.max(0,Math.min(stops.length-1,seg.from));
          const to=Math.max(from,Math.min(stops.length-1,seg.to));
          const first=stops[from]||{};
          const last=stops[to]||{};
          const start=String(first?.station||'');
          const dest=String(last?.station||'');
          const startTime=String(first?.departure||first?.time||first?.arrival||'');
          const endTime=String(last?.arrival||last?.time||last?.departure||'');
          if(!start && !dest) continue;
          expanded.push({
            no:seg.no,
            type:String(entry?.type||sourceTrain?.type||''),
            start,
            startTime,
            dest,
            endTime,
            _sourceTrain:sourceTrain,
            _fromIndex:from,
            _toIndex:to
          });
        }
        continue;
      }

      const from=stops.length?0:0;
      const to=stops.length?stops.length-1:0;
      expanded.push({
        no:hasRealNumber ? (mergedSegments[0]?.no||entryNo||trainDisplayNoAtPosition(sourceTrain,from)||'') : '',
        type:String(entry?.type||sourceTrain?.type||''),
        start:String(entry?.start||sourceTrain?.start||stops[from]?.station||''),
        startTime:String(entry?.startTime||sourceTrain?.startTime||stops[from]?.departure||stops[from]?.time||stops[from]?.arrival||''),
        dest:String(entry?.dest||sourceTrain?.dest||stops[to]?.station||''),
        endTime:String(entry?.endTime||sourceTrain?.endTime||stops[to]?.arrival||stops[to]?.time||stops[to]?.departure||''),
        _sourceTrain:sourceTrain,
        _fromIndex:from,
        _toIndex:to
      });
    }
    return expanded.length ? expanded : [{...chain[0],no:'',_sourceTrain:train}];
  }

  /* 今日の運用だけで使用する駅名略称。停車駅案内・駅時刻表などには適用しない。
     JSON/路線設定に存在する代表的なキーを順に参照し、指定がなければ正式駅名をそのまま表示する。 */
  function operationStationLabel(name){
    const value=String(name||'').trim();
    if(!value) return '';

    // 路線設定・JSONに直接用意された駅名→略称マップ。
    const registryMeta=(typeof ROUTE_REGISTRY==='object' && ROUTE_REGISTRY && activeRouteName && ROUTE_REGISTRY[activeRouteName]) ? ROUTE_REGISTRY[activeRouteName] : null;
    const maps=[
      registryMeta?.stationShortMap,
      registryMeta?.stationAbbreviations,
      activeRouteMeta?.stationShortMap,
      activeRouteMeta?.stationAbbreviations,
      activeRouteMeta?.stationAliases,
      activeJson?.stationShortMap,
      activeJson?.stationAbbreviations,
      activeJson?.stationAliases,
      activeRouteMeta?.destinationAliases
    ];
    for(const map of maps){
      if(map && typeof map==='object' && Object.prototype.hasOwnProperty.call(map,value)){
        const short=String(map[value]??'').trim();
        if(short) return short;
      }
    }

    // データベース作成HTMLの駅名略称形式
    // { route:{ abbreviations:{ stations:[{targetId,value}] } }, stations:[{id,name,abbr}] }
    const dbStations=Array.isArray(activeJson?.stations)?activeJson.stations:[];
    const dbStation=dbStations.find(st=>String(st?.name||'').trim()===value);
    const directAbbr=String(dbStation?.abbr||'').trim();
    if(directAbbr) return directAbbr;
    const dbAbbrs=activeJson?.route?.abbreviations?.stations;
    if(Array.isArray(dbAbbrs)){
      const hit=dbAbbrs.find(a=>String(a?.targetId||'')===String(dbStation?.id||''));
      const short=String(hit?.value||'').trim();
      if(short) return short;
    }

    // 通常の路線JSONの lines[].stations[].abbr にも対応
    const lineStations=Array.isArray(activeJson?.lines)
      ? activeJson.lines.flatMap(line=>Array.isArray(line?.stations)?line.stations:[])
      : [];
    const lineStation=lineStations.find(st=>String(st?.name||'').trim()===value);
    const lineAbbr=String(lineStation?.abbr||'').trim();
    if(lineAbbr) return lineAbbr;

    const rules=[
      ...(Array.isArray(activeRouteMeta?.stationShortRules)?activeRouteMeta.stationShortRules:[]),
      ...(Array.isArray(activeJson?.stationShortRules)?activeJson.stationShortRules:[])
    ];
    for(const rule of rules){
      const target=String(rule?.station??rule?.name??'').trim();
      if(target && target===value && rule?.result!==undefined) return String(rule.result);
    }
    return value;
  }

  /* 03:00境界の運用時刻へそろえる。 */
  function operationServiceMinutes(value){
    const raw=String(value||'').trim();
    if(!raw) return NaN;
    const m=timeToMinutes(raw);
    if(!Number.isFinite(m)) return NaN;
    return m<RESET_HOUR*60 ? m+1440 : m;
  }

  function operationEntryState(entry,index,train){
    // 過去日・未来日では「現在運用」の強調を出さない。
    const isToday=!isNonCurrentSelectedDate(selectedDateKey) && String(selectedDateKey||'')===operationDateKey(new Date());
    if(!isToday) return {current:false,next:false};
    const now=currentMinutes();
    const start=operationServiceMinutes(entry?.startTime);
    const end=operationServiceMinutes(entry?.endTime);
    if(!Number.isFinite(now)) return {current:false,next:false};
    if(Number.isFinite(start) && Number.isFinite(end)){
      const current=now>=start && now<=end;
      if(current) return {current:true,next:false};
      if(now<start) return {current:false,next:true};
    }
    return {current:false,next:false};
  }

  function operationItemHTML(entry,index,count){
    const sourceTrain=entry?._sourceTrain || findOperationTrainRecord(String(entry?.no||''),currentDay);
    const hasRealNumber=!!sourceTrain && sourceTrain.hasTrainNumber!==false && !sourceTrain.hideTrainNumber;
    const no=hasRealNumber ? String(entry?.no||'').trim() : '';
    const rawType=String(entry?.type||'').trim();
    const type=rawType ? getShortType(rawType,no) : '';
    const start=String(entry?.start||'').trim();
    const shortStart=operationStationLabel(start);
    const startTime=String(entry?.startTime||'');
    const dest=String(entry?.dest||'').trim();
    const shortDest=operationStationLabel(dest);
    const endTime=String(entry?.endTime||'');
    const state=operationEntryState(entry,index,sourceTrain);
    const typeBadgeStyle=rawType ? typeBadgeInlineStyle(sourceTrain || {type:rawType},null,null) : '';
    const openNo=no;
    const clickAttr=openNo ? `onclick="openSheet('${escapeJs(openNo)}',false,'${escapeJs(inferDirectionFromStations(entry?.start,entry?.dest))}')"` : '';
    const rowClass=[
      'station-timetable-row','train-operation-row',
      state.current?'current-operation':'',
      state.next?'next-operation':''
    ].filter(Boolean).join(' ');
    return `<button type="button" class="${rowClass}" data-operation-start="${escapeAttr(startTime)}" data-operation-end="${escapeAttr(endTime)}" ${clickAttr}>
      <span class="train-operation-number">${escapeAttr(no)}</span>
      <span class="station-timetable-type train-operation-type${rawType?'':' empty-operation-field'}"${rawType?` style="${typeBadgeStyle}"`:''}><span class="operation-full">${escapeAttr(rawType)}</span><span class="operation-short">${escapeAttr(type)}</span></span>
      <span class="train-operation-time start-time">${escapeAttr(startTime)}</span>
      <span class="train-operation-station start-station" title="${escapeAttr(start)}"><span class="operation-full">${escapeAttr(start)}</span><span class="operation-short">${escapeAttr(shortStart)}</span></span>
      <span class="train-operation-arrow" aria-hidden="true">→</span>
      <span class="train-operation-time end-time">${escapeAttr(endTime)}</span>
      <span class="train-operation-station end-station" title="${escapeAttr(dest)}"><span class="operation-full">${escapeAttr(dest)}</span><span class="operation-short">${escapeAttr(shortDest)}</span></span>
      
    </button>`;
  }

  function refreshTrainInfoOperationState(){
    const root=document.querySelector('#sheetContent .train-info-tabs');
    if(!root) return;
    const wrap=document.querySelector('#sheetContent .train-operation-wrap');
    if(!wrap) return;
    const today=(!isNonCurrentSelectedDate(selectedDateKey) && String(selectedDateKey||'')===operationDateKey(new Date()));
    const now=currentMinutes();
    wrap.querySelectorAll('.train-operation-row').forEach(row=>{
      const start=operationServiceMinutes(row.dataset.operationStart||'');
      const end=operationServiceMinutes(row.dataset.operationEnd||'');
      let current=false,next=false;
      if(today && Number.isFinite(now) && Number.isFinite(start) && Number.isFinite(end)){
        current=now>=start && now<=end;
        next=!current && now<start;
      }
      row.classList.toggle('current-operation',current);
      row.classList.toggle('next-operation',next);
    });
  }
  window.refreshTrainInfoOperationState=refreshTrainInfoOperationState;

  function renderFormationInfo(train){
    const formationValue=String(registeredFormationForTrain(train)||train?.formation||'').trim();
    const ids=formationValue.split('+').map(x=>x.trim()).filter(Boolean);
    const color=primaryTrainInfoColor();
    if(!ids.length){
      return `<div class="train-info-empty">現在登録されている編成はありません。</div>`;
    }
    return `<div class="train-formation-details">${ids.map(id=>{
      const obj=selectionDisplayObject(id)||formationById(id)||{};
      const raw=rawFormationDefinitionById(id)||{};
      const name=String(obj?.name||raw?.name||id).trim();
      const type=String(raw?.type||obj?.type||raw?._groupType||'').trim();
      const completion=formationRawValue(raw,['completionDate','formationDate','completedAt','落成日']);
      const maker=formationRawValue(raw,['manufacturer','manufacturerName','maker','製造メーカー']);
      const comment=formationRawValue(raw,['comment','comments','remarks','note','コメント']);
      const cars=formationCarNames({...raw,carNames:Array.isArray(raw?.carNames)&&raw.carNames.length?raw.carNames:obj?.carNames},id);
      return `<section class="train-formation-card" style="--train-info-color:${color}">
        <div class="train-formation-card-title">${escapeAttr(name)}</div>
        <div class="train-formation-detail-row train-formation-type-row"><span>形式</span><strong>${escapeAttr(type)}</strong></div>
        <div class="train-formation-detail-row"><span>落成日</span><strong>${escapeAttr(completion)}</strong></div>
        <div class="train-formation-detail-row"><span>製造メーカー</span><strong>${escapeAttr(maker)}</strong></div>
        <div class="train-formation-detail-row train-formation-cars-row"><span>車番</span><div class="train-formation-cars">${cars.length?cars.map((car,i)=>`<div><b>${i+1}号車</b><span>${escapeAttr(car)}</span></div>`).join(''):'<div><b>—</b><span></span></div>'}</div></div>
        ${comment?`<div class="train-formation-comment">${escapeAttr(comment)}</div>`:''}
      </section>`;
    }).join('')}</div>`;
  }

  function updateTrainInfoDesign(){
    if(typeof currentStationId!=='undefined' && currentStationId){
      return updateStationSheetContent();
    }
    const train=currentTrainSnapshot || trainForCurrentDay(currentTrainNo,currentTrainSnapshot?.direction||null);
    if(!train) return;
    closeFormationDropdown();
    const content=document.getElementById('sheetContent');
    if(!content) return;
    const effectiveFormationId=registeredFormationForTrain(train)||train.formation||'';
    const selectedForm=selectionDisplayObjectForTrain(train,effectiveFormationId);
    const imgSrc=imageForTrain(train);
    const readonly=!formationInputAllowed();
    const cardClass=readonly?' historical-readonly':'';
    const cardClick=readonly?'':'onclick="switchToEditMode()"';
    const noFormationText=currentAuthUser?'ここから編成を入力':'編成を入力するにはログインしてください';
    const tabColor=primaryTrainInfoColor();
    const operation=operationChainForCurrentTrain(train);
    const hasOperationNumber=operation.some(entry=>String(entry?.no||'').trim()!=='');
    const hasOperationType=operation.some(entry=>String(entry?.type||'').trim()!=='');
    const operationWrapClasses=[
      'station-timetable-wrap',
      'train-operation-wrap',
      !hasOperationNumber?'hide-operation-number':'',
      !hasOperationType?'hide-operation-type':''
    ].filter(Boolean).join(' ');
    const opHtml=operation.map((entry,i)=>operationItemHTML(entry,i,operation.length)).join('');
    const activeStops=currentTrainInfoTab==='stops';
    const activeOp=currentTrainInfoTab==='operation';
    const activeForm=currentTrainInfoTab==='formation';

    if(isEditMode && !readonly){
      /* 編成入力時は既存の編集画面をそのまま使用。 */
      const originalSelected=selectionDisplayObjectForTrain(train,train.formation);
      content.innerHTML=`
        <div class="train-card">
          <img src="${(train.formation&&train.formation!==INITIAL_FORMATION_SELECTION.id)?originalSelected.img:defaultTrainImage(train)}" class="train-card-img">
          <div class="train-info-main">
            <div>${String(train.type||'').trim()?`<span class="type-badge ${getExpressClass(train)}" style="${typeBadgeInlineStyle(train)}">${getDetailType(train.type)}</span>`:''}<span class="train-title${String(train.type||'').trim()?'':' no-type'}">${getDisplayDestinationForTrain(train)}${destinationGoSuffix(train)}</span>${!train.hideTrainNumber&&trainDisplayNoAtTime(train,currentMinutes())?`<span class="train-number">${trainDisplayNoAtTime(train,currentMinutes())}</span>`:''}</div>
            <div class="input-trigger-btn">編成を入力中</div>
            ${prescribedFormationName(train)?`<div class="capacity-info">所定:${prescribedFormationName(train)}</div>`:''}
          </div>
        </div>
        <div style="text-align:left;font-weight:700;margin:6px 0 4px;font-size:1.1rem;">編成入力</div>
        <div class="formation-manual-input"><input id="formationManualInput" type="text" inputmode="text" autocomplete="off" value="${originalSelected.id===INITIAL_FORMATION_SELECTION.id?'':originalSelected.name}" placeholder="${esc(formationInputPlaceholderForTrain(train))}" onkeydown="if(event.key==='Enter'){event.preventDefault();registerFormationFromInput();}"><button type="button" onclick="registerFormationFromInput()">登録</button></div>
        <div id="formationInputError" class="formation-input-error"></div>
        <div class="select-box-container">
          <div class="custom-select-trigger" onclick="toggleDropdown(event)"><div style="display:flex;align-items:center;gap:10px"><img src="${originalSelected.img}" id="selectedOptionImg" style="width:auto;height:70px;object-fit:contain"><span id="selectedOptionText">${originalSelected.name}</span></div>▼</div>
          <div class="custom-select-options" id="dropdownOptions">
            <div class="option-item initial-option" onclick="selectFormation('${INITIAL_FORMATION_SELECTION.id}')"><img src="${syncInitialFormationImage()}" class="option-img" onerror="this.onerror=null;this.src=jsonNoImageUrl()"><span>${INITIAL_FORMATION_SELECTION.name}</span></div>
            ${formationDropdownHTML(train)}
          </div>
        </div>`;
      return;
    }

    content.innerHTML=`
      <div class="train-card${cardClass}" ${cardClick}>
        <img src="${imgSrc}" class="train-card-img">
        <div class="train-info-main"><div>${String(train.type||'').trim()?`<span class="type-badge ${getExpressClass(train)}" style="${typeBadgeInlineStyle(train)}">${getDetailType(train.type)}</span>`:''}<span class="train-title${String(train.type||'').trim()?'':' no-type'}">${getDisplayDestinationForTrain(train)}${destinationGoSuffix(train)}</span>${!train.hideTrainNumber&&trainDisplayNoAtTime(train,currentMinutes())?`<span class="train-number">${trainDisplayNoAtTime(train,currentMinutes())}</span>`:''}</div>${train.formation&&train.formation!==INITIAL_FORMATION_SELECTION.id?`<div class="formation-id">${selectedForm.name}</div>`:`<div class="input-trigger-btn">${noFormationText}</div>`}${prescribedFormationName(train)?`<div class="capacity-info">所定:${prescribedFormationName(train)}</div>`:''}</div>${train.formation&&train.formation!==INITIAL_FORMATION_SELECTION.id&&formatFormationUpdatedAt(train.no)?`<div class="formation-updated-at">編成入力：${formatFormationUpdatedAtHtml(train.no)}</div>`:''}
      </div>

      <div class="train-info-tabs" style="--train-info-color:${tabColor}">
        <button type="button" class="train-info-tab ${activeStops?'active':''}" onclick="window.__selectTrainInfoTab('stops')">停車駅</button>
        <button type="button" class="train-info-tab ${activeOp?'active':''}" onclick="window.__selectTrainInfoTab('operation')">今日の運用</button>
        <button type="button" class="train-info-tab ${activeForm?'active':''}" onclick="window.__selectTrainInfoTab('formation')">編成情報</button>
      </div>

      <div class="train-info-content-panel">
        ${activeStops?`<div class="timetable-list train-stop-guide-list">${timetableHTMLForCurrentDay(train)}</div>`:''}
        ${activeOp?`<div class="station-timetable-frame train-operation-frame"><div class="${operationWrapClasses}">${opHtml || '<div class="train-info-empty">この列車の運用情報はありません。</div>'}</div></div>`:''}
        ${activeForm?`<div class="train-info-formation-wrap">${renderFormationInfo(train)}</div>`:''}
      </div>
    `;
    refreshTrainInfoOperationState();
  }

  window.__selectTrainInfoTab=function(tab){
    currentTrainInfoTab=(tab==='operation'||tab==='formation'||tab==='stops')?tab:'stops';
    if(typeof updateSheetContent==='function') updateSheetContent();
  };

  updateSheetContent=updateTrainInfoDesign;
  window.updateSheetContent=updateTrainInfoDesign;

      grid-template-columns:78px minmax(0,1fr) 36px 78px minmax(0,1fr);
    }
    /* 列そのものを非表示にするときはグリッドの子要素も消し、
       implicit column が生成されてレイアウトが崩れるのを防ぐ。 */
    .train-operation-wrap.hide-operation-number .train-operation-number{display:none;}
    .train-operation-wrap.hide-operation-type .train-operation-type{display:none;}
    .train-operation-wrap .empty-operation-field{
      visibility:hidden;

      color:#1b6e27;

      white-space:nowrap;

      text-overflow:clip;
      overflow-wrap:normal;
    }
    .train-operation-time{
      font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;

    .train-formation-cars{display:flex;flex-direction:column;gap:3px;}
    .train-formation-cars>div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;}
    .train-formation-cars b{font-weight:700;}
font-size:17px;line-height:1.35;padding:8px 12px 10px;white-space:pre-wrap;word-break:break-word;}
    .train-info-empty{padding:22px 14px;text-align:center;color:#555;font-weight:700;}

    @media(max-width:520px){

        min-height:66px;height:66px;

    .train-operation-wrap .empty-operation-field{

    }
      .train-formation-detail-row{grid-template-columns:100px minmax(0,1fr);font-size:15px;gap:8px;padding:6px 9px;}

  `;
  document.head.appendChild(style);
})();
