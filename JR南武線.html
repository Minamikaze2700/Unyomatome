<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f2c400;
  --primary-dark:#d0aa00;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0}
body{font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}

/* 日別・時刻フィルター */
#title{
    height: 58px;
    color: #fff;
    font-weight: 500;
    display: flex;
    background: #f2c400;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    justify-content: center;
    align-items: center;
    border-bottom: 8px solid #fff1a8;
    z-index: 1000;
}

.control-bar{
  position:fixed;top:58px;left:0;right:0;z-index:999;
  margin-top:0;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.date-input{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;
  cursor:pointer;min-width:160px;
}
.schedule-day-label{font-weight:800;color:#555;white-space:nowrap}
.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}
.sync-btn{border:1px solid #bbb;background:#fff;color:#555;border-radius:999px;padding:5px 10px;cursor:pointer;font-weight:700}


/* 路線図 */
:root{--row-height:270px}
.line-container{
  position:relative;width:100%;max-width:none;margin:0 auto;
  padding:0;display:flex;flex-direction:column;align-items:center;
}

/* 固定コントロールバーの高さ分だけ路線図を下へ配置 */
#lineContainer{margin-top:calc(58px + var(--control-bar-height, 69px));}
.rail-line{
  position:absolute;top:135px;bottom:135px;left:50%;transform:translateX(-50%);
  width:12px;background:var(--primary);z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}
.station-badge{
  position:relative;width:384px;min-width:384px;height:auto;aspect-ratio:480 / 90;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  font-family:inherit;
  height:61.1111%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:45px;line-height:1;font-weight:500;
  letter-spacing:0;padding-left:0;
}
.station-name-en{
  font-family:inherit;
  height:33.3333%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 292px))}
.train-icon.right{right:max(6px,calc(50% - 292px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:60px;height:auto;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-formation{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;}
.train-formation > span{display:block;font:inherit;color:inherit;line-height:1.05;white-space:nowrap;}
.train-label{
  margin-top:2px;max-width:100px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:12px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#f2c400;color:#111}
.train-label.b-express{background:#ffb6c1}
.train-label.a-express{background:#e83e8c}
.train-label.deadhead{background:#fff;color:#111;border:1px solid #bbb;}



/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:101;
  max-width:620px;margin:0 auto;max-height:75vh;min-height:0;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
}
.bottom-sheet.active{bottom:0}
.bottom-sheet.editing{height:75vh;max-height:75vh;min-height:75vh}
.bottom-sheet.editing .sheet-content{min-height:calc(75vh - 58px)}

.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.sheet-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sheet-back-btn{
  display:none;width:28px;height:28px;border:0;background:transparent;color:#fff;
  padding:0;cursor:pointer;position:relative;flex:0 0 28px;
}
.sheet-back-btn::before{
  content:'';position:absolute;left:7px;top:6px;width:13px;height:13px;
  border-left:4px solid currentColor;border-bottom:4px solid currentColor;
  transform:rotate(45deg);
  box-sizing:border-box;
}
.sheet-back-btn.visible{display:inline-block;}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px;position:relative;overflow:hidden;min-height:0}
.timetable-list{margin-top:16px;position:relative;overflow:hidden;z-index:1}
.train-card{
  position:relative;
  background:#fff;border-radius:8px;padding:0;display:flex;
  align-items:center;gap:12px;margin-bottom:0;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.train-card.historical-readonly{cursor:default}
.train-card.historical-readonly:hover{border-color:transparent}
.station-info-card{cursor:default;}
.station-info-card:hover{border-color:transparent;}
.station-placeholder{margin-top:12px;min-height:140px;}
.station-badge{cursor:pointer;}
.station-timetable-title{
  font-family:inherit;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px;
}
.station-timetable-direction-tabs{display:flex;gap:8px;margin:0 0 12px;justify-content:flex-start;}
.station-timetable-direction-tab{
  flex:0 0 50%;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);
  font-family:inherit;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer;
}
.station-timetable-direction-tab.active{background:var(--primary);color:#fff;}
.station-timetable-direction-tab:hover{background:#fff1f1;}
.station-timetable-direction-tab.active:hover{background:var(--primary-dark);}

.station-timetable-frame{
  position:relative;
  margin-top:4px;
  height:53vh;
  background:#fff;
  border:3px solid #000;
  border-radius:11px;
  overflow:hidden;
  box-sizing:border-box;
}
.station-timetable-wrap{
  /* 530px以上は530px基準の固定サイズ。530px未満だけ幅に応じて縮小する。 */
  position:relative;
  container-type:inline-size;
  margin-top:0;
  background:#fff;
  border:0;
  border-radius:0;
  overflow-y:auto;
  overflow-x:hidden;
  height:100%;
  scroll-behavior:auto;
  box-sizing:border-box;
}
.station-timetable-direction{margin:0;padding:0;}
.station-timetable-empty{
  padding:24px 18px;
  text-align:center;
  font-family:inherit;
  color:#555;
}
.station-timetable-row{
  width:100%;
  min-height:108px;
  display:grid;
  grid-template-columns:68px 82px 92px 92px minmax(0,1fr);
  align-items:center;
  column-gap:8px;
  padding:8px 12px;
  border:0;
  color:#000;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
}
.station-timetable-row:nth-child(odd){background:#fff;}
.station-timetable-row:nth-child(even){background:#cfcfcf;}
.station-timetable-row:hover{filter:brightness(.97);}
.station-timetable-row:focus-visible{outline:3px solid rgba(0,0,0,.35);outline-offset:-3px;}
.station-timetable-train-img{
  width:68px;
  height:86px;
  object-fit:contain;
  display:block;
  justify-self:center;
  background:transparent;
}
.station-timetable-formation{
  color:#1b6e27;
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:24px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.station-timetable-formation-line{
  display:block;
  line-height:1;
}
.station-timetable-type{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:78px;height:34px;padding:0 10px;border-radius:7px;
  font-family:inherit;font-size:18px;line-height:1;font-weight:700;
  white-space:nowrap;text-align:center;box-sizing:border-box;
  background:#f2c400;color:#111;
}
.station-timetable-type.section-express{background:#e83e8c;color:#fff;}
.station-timetable-type.express{background:#e83e8c;color:#fff;}
.station-timetable-type.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
.station-timetable-time{
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:32px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  letter-spacing:.01em;
}
.station-timetable-destination{
  font-family:inherit;
  font-size:32px;
  line-height:1;
  font-weight:500;
  white-space:nowrap;
  text-align:left;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  gap:.18em;
  height:1em;
}
.station-timetable-destination-station{font-size:1em;line-height:1;}
.station-timetable-destination-go{font-size:.8em;line-height:1;}
/* 530px未満のみ、530pxを100%とした比率で全パーツを縮小 */
@container (max-width:529px){
  .station-timetable-frame{
    border-width:.5660377cqw;
    border-radius:2.0754717cqw;
  }
  .station-timetable-empty{
    padding:4.5283019cqw 3.3962264cqw;
  }
  .station-timetable-row{
    min-height:20.3773585cqw;
    grid-template-columns:12.8301887cqw 15.4716981cqw 17.3584906cqw 17.3584906cqw minmax(0,1fr);
    column-gap:1.509434cqw;
    padding:1.509434cqw 2.264151cqw;
  }
  .station-timetable-row:focus-visible{
    outline-width:.5660377cqw;
    outline-offset:-.5660377cqw;
  }
  .station-timetable-train-img{
    width:12.8301887cqw;
    height:16.2264151cqw;
  }
  .station-timetable-formation{
    font-size:4.5283019cqw;
  }
  .station-timetable-time,
  .station-timetable-destination{
    font-size:6.0377358cqw;
  }
  .station-timetable-type{
    min-width:14.717cqw;height:6.415cqw;padding:0 1.887cqw;
    border-radius:1.321cqw;font-size:3.396cqw;
  }
}
.station-badge:focus{outline:3px solid rgba(0,0,0,.35);outline-offset:4px;}

/* 駅情報：最初の項目 */
.station-overview-card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  margin-bottom:16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-overview-main{
  text-align:center;padding:8px 10px 9px;background:#fff;
}
.station-overview-name-ja{
  font-family:inherit;
  font-size:52px;line-height:.95;font-weight:500;letter-spacing:.08em;padding-left:.08em;color:#000;
}
.station-overview-name-en{
  font-family:inherit;
  font-size:29px;line-height:1.02;font-weight:500;letter-spacing:.015em;color:#000;
  margin-top:2px;
}
.station-direction-bar-wrap{width:100%;}
.station-direction-bar{
  width:100%;height:18px;background:var(--primary);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
}
.station-direction-bar.no-prev{clip-path:polygon(0 0,97% 0,100% 100%,0 100%);}
.station-direction-bar.no-next{clip-path:polygon(3% 0,100% 0,100% 100%,0 100%);}
.station-direction-bar.no-prev.no-next{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.station-neighbor-row{display:flex;width:100%;min-height:54px;background:#fff;}
.station-neighbor{
  width:50%;display:flex;flex-direction:column;justify-content:flex-start;
  padding:2px 8px 8px;min-width:0;
}
.station-neighbor.left{text-align:left;align-items:flex-start;}
.station-neighbor.right{text-align:right;align-items:flex-end;}
.station-neighbor-name-ja{
  font-family:inherit;font-size:27px;line-height:1.05;font-weight:400;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.station-neighbor-name-en{
  font-family:inherit;font-size:14px;line-height:1.1;font-weight:500;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px;
}
.station-neighbor.empty{visibility:hidden;}

.train-card-img{width:75px;height:auto;object-fit:contain}
.train-info-main{flex:1}
.type-badge{background:#f2c400;color:#111;padding:3px 8px;border-radius:4px;font-size:.78rem;display:inline-block}
.type-badge.a-express{background:#e83e8c}
.type-badge.b-express{background:#ffb6c1}
.train-title{font-size:0.95rem;font-weight:700;margin-left:6px}
.train-number{color:#1b6e27;font-weight:800;float:right;margin-right:15px}
.formation-id{font-size:1.2rem;font-weight:800;color:#1b6e27;margin-top:4px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}

.formation-updated-at{position:absolute;right:12px;bottom:8px;font-size:.78rem;color:#777;text-align:right;} 
.input-trigger-btn{
  background:#c62828;color:#fff;padding:4px 8px;border-radius:4px;
  font-size:.75rem;margin-top:4px;display:inline-block;
}
.formation-manual-input{display:flex;gap:8px;margin:6px 0;align-items:stretch;}
.formation-manual-input input{flex:1;min-width:0;border:2px solid #ccc;border-radius:8px;padding:10px;font:inherit;font-weight:700;}
.formation-manual-input button{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:0 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;}
.formation-manual-input button:hover{background:var(--primary-dark);}
.formation-input-error{min-height:0;color:#c62828;font-size:.8rem;font-weight:700;margin:2px 0 4px;}
.timetable-list{background:#fff;border-radius:8px;padding:12px 20px}
.timetable-item{display:flex;align-items:center;padding:8px 0;position:relative;height:56px;min-height:56px;box-sizing:border-box}
.timetable-item::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;
  background:var(--primary);z-index:1;
}
.timetable-item:first-child::before{top:50%}
.timetable-item:last-child::before{bottom:50%}
.time-dot{width:18px;height:18px;background:var(--primary);border-radius:50%;z-index:2;margin-right:16px}
.time-text{width:58px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.05;gap:0;height:40px;flex:none}.time-text span{display:block;height:20px;line-height:20px;white-space:nowrap}.time-text.two-line span:first-child{font-size:1rem}.time-text.two-line span:last-child{font-size:1rem}
.station-text{font-weight:700;font-size:1.05rem;line-height:1.2;display:flex;align-items:center;min-height:40px}
.select-box-container{position:relative;width:100%;margin:12px 0}
.custom-select-trigger{
  background:#fff;border:2px solid #ccc;border-radius:8px;padding:10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:1.25rem;color:#1b6e27;
}
.custom-select-options{
  position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;
  border-radius:8px;max-height:250px;overflow-y:auto;z-index:200;display:none;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.custom-select-options.open{display:block}
.option-header{
  background:#f0f0f0;padding-left:16px;font-weight:700;font-size:1.25rem;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid #e0e0e0;cursor:pointer;
}
.option-header:hover{background:#e8f5e9}
.option-item{
  padding-left:16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:1.25rem;
}
.option-item:hover{background:#e8f5e9}
.option-item.type-option,.option-item.initial-option{background:#e0e0e0}
.option-item.type-option:hover,.option-item.initial-option:hover{background:#d0d0d0}
.option-img{width:auto;height:60px;object-fit:contain}

/* スマホ版：1920pxの元レイアウトから中央960px（左右480pxずつをカット）を
   そのまま100vwへ縮小表示する。960px以上はデスクトップ表示を変更しない。 */
@media (max-width:959.98px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  #viewportCanvas{
    width:1920px;
    min-width:1920px;
    max-width:none;
    margin-left:-480px;
    zoom:calc(100vw / 960px);
  }
  #viewportCanvas,
  #viewportCanvas .line-container{
    width:1920px;
    min-width:1920px;
    max-width:none;
  }
}

/* 固定ヘッダー：表示領域を基準に固定。路線図キャンバスとは別レイヤー。 */
#title{position:fixed;top:0;left:0;right:0;width:100vw;height:58px;z-index:1000;display:flex;justify-content:center;align-items:center;}
#title > span:first-child{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;}
.control-bar{position:fixed;top:58px;left:0;right:0;width:100vw;max-width:none;z-index:999;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;}
#lineContainer{margin-top:calc(58px + var(--control-bar-height, 69px));}

/* JR南武線用デザイン */
body{font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;}
#title{height:58px;gap:12px;font-size:31px;letter-spacing:.03em;background:#f2c400;border-bottom:8px solid #fff1a8;z-index:1000;}
#operationInfoBtn{background:#fff;color:#7a6200;}
.input-trigger-btn{background:#c62828 !important;color:#fff;}

.station-badge{width:384px;min-width:384px;height:72px;background:#f2c400;border:0;border-radius:0;overflow:hidden;box-shadow:0 7px 14px rgba(0,0,0,.26);padding:4px 8px;}
.station-badge::before{content:'';position:absolute;inset:4px 8px;z-index:0;background:#fff;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);}
.station-name-ja,.station-name-en{position:relative;z-index:1;background:transparent;font-family:inherit;color:#000;}
.station-name-ja{height:61%;font-size:36px;font-weight:400;}
.station-name-en{height:33%;font-size:15.2px;font-weight:400;}
.rail-line{width:12px;background:#f2c400;}
.train-label.section-express{background:#e83e8c;color:#fff;}
.train-label.express{background:#e83e8c;color:#fff;}
.type-badge.section-express{background:#e83e8c;color:#fff;}
.type-badge.express{background:#e83e8c;color:#fff;}
.type-badge.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
#operationInfoBtn{background:#fff;color:#7a6200;}

#operationInfoBtn{position:fixed;right:20px;top:10px;appearance:none;border:0;border-radius:999px;background:#fff;color:#7a6200;padding:8px 17px;font:700 16px/1 inherit;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;z-index:1001}

.operation-info-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1200;display:none}.operation-info-backdrop.active{display:block}
.operation-info-panel{position:fixed;left:50%;top:72px;transform:translateX(-50%);width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 96px);overflow:auto;background:#eee;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:1201;display:none}.operation-info-panel.active{display:block}
.operation-info-header{position:sticky;top:0;z-index:3;background:#c8a600;color:#111;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:800;border-radius:16px 16px 0 0}.operation-info-header button{border:0;background:transparent;color:#111;font-size:20px;cursor:pointer}
.operation-info-body{padding:14px}.operation-info-form{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}.operation-info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.operation-info-field{display:flex;flex-direction:column;gap:5px}.operation-info-field.full{grid-column:1/-1}.operation-info-field label{font-weight:800;font-size:.9rem;color:#444}.operation-info-field select{width:100%;border:2px solid #ccc;border-radius:8px;padding:9px;font:inherit;background:#fff;color:#111}
.operation-info-status{display:flex;gap:8px}.operation-info-status label{flex:1;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:10px;cursor:pointer;font-weight:800;background:#eee;color:#333;transition:background .12s,color .12s}.operation-info-status input{display:none}.operation-info-status label:has(input[value="delay"]:checked){background:#f2c94c;color:#111}.operation-info-status label:has(input[value="suspend"]:checked){background:#ef5350;color:#fff}

.operation-info-layer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}.operation-info-label-layer{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:visible}.operation-info-zone{position:absolute;box-sizing:border-box;border:3px solid #f2c94c;background:repeating-linear-gradient(135deg,rgba(255,205,55,.42) 0 7px,rgba(255,205,55,.10) 7px 14px);pointer-events:none}.operation-info-zone.suspend{border-color:#ef5350;background:repeating-linear-gradient(135deg,rgba(239,83,80,.40) 0 7px,rgba(239,83,80,.10) 7px 14px)}.operation-info-zone-label{position:absolute;width:100px;box-sizing:border-box;background:rgba(255,255,255,.94);border-radius:5px;padding:3px 7px;font:800 12px/1.2 inherit;color:#8a7200;box-shadow:0 1px 3px rgba(0,0,0,.14);pointer-events:auto;cursor:pointer;border:0}.operation-info-zone-label.suspend{color:#d32f2f}.operation-info-detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20000;display:none}.operation-info-detail-backdrop.active{display:block}.operation-info-detail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));background:#fff;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.28);z-index:20001;display:none;overflow:hidden}.operation-info-detail.active{display:block}.operation-info-detail-header{padding:12px 16px;background:#c8a600;color:#111;font-weight:800;display:flex;justify-content:space-between;align-items:center}.operation-info-detail-header button{border:0;background:transparent;color:#111;font-size:20px;cursor:pointer}.operation-info-detail-body{padding:16px;line-height:1.8}.operation-info-detail-status{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:800;margin-bottom:8px}.operation-info-detail-status.delay{background:#f2c94c;color:#111}.operation-info-detail-status.suspend{background:#ef5350;color:#fff}

<body>

<h1 id="title"><span>JR南武線</span><button id="operationInfoBtn" type="button" onclick="openOperationInfo()">運行情報</button></h1>
<div class="control-bar">
  <div class="day-filter">
    <input id="dateInput" class="date-input" type="date">
    <span id="scheduleDayLabel" class="schedule-day-label">平日ダイヤ</span>
  </div>
  <div class="time-control">
    <span class="time-label">表示時刻</span>
    <input id="timeInput" class="time-input" type="time" step="60">
    <button id="nowBtn" class="time-now-btn active" onclick="setNowTime()">現在時刻</button>
  </div>
</div>

<div id="viewportCanvas">
<div class="line-container" id="lineContainer">
  <div class="operation-info-layer" id="operationInfoLayer"></div>
  <div class="rail-line"></div>
  <div class="moving-train-layer" id="movingTrainLayer"></div>
  <div class="operation-info-label-layer" id="operationInfoLabelLayer"></div>
</div>
</div><!-- /#viewportCanvas -->

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-header">
    <div class="sheet-header-left">
      <button id="sheetBackBtn" class="sheet-back-btn" type="button" aria-label="駅情報に戻る" onclick="sheetBack()"></button>
      <span>列車情報</span>
    </div>
    <span class="close-btn" onclick="closeSheet()">✖</span>
  </div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<div class="operation-info-backdrop" id="operationInfoBackdrop" onclick="closeOperationInfo()"></div>
<div class="operation-info-panel" id="operationInfoPanel" role="dialog" aria-modal="true" aria-label="運行情報">
  <div class="operation-info-header"><span>運行情報の登録</span><button type="button" onclick="closeOperationInfo()" aria-label="閉じる">✖</button></div>
  <div class="operation-info-body">
    <div class="operation-info-form">
      <div class="operation-info-grid">
        <div class="operation-info-field full"><label>状態</label><div class="operation-info-status" id="operationInfoStatus"><label><input type="radio" name="operationStatus" value="delay" checked><span>遅延</span></label><label><input type="radio" name="operationStatus" value="suspend"><span>運転見合わせ</span></label></div></div>
        <div class="operation-info-field full"><label>区間</label><div class="operation-info-range"><select id="operationInfoStart" aria-label="区間始点"></select><div class="operation-info-range-arrow">→</div><select id="operationInfoEnd" aria-label="区間終点"></select></div></div>
        <div class="operation-info-field"><label for="operationInfoDelay">遅延時間</label><select id="operationInfoDelay"><option value="unknown">遅延時間不明</option><option value="5">5分</option><option value="10">10分</option><option value="15">15分</option><option value="20">20分</option><option value="25">25分</option><option value="30">30分</option><option value="35">35分</option><option value="40">40分</option><option value="45">45分</option><option value="50">50分</option><option value="55">55分</option><option value="60">60分</option><option value="65">65分</option><option value="70">70分</option><option value="75">75分</option><option value="80">80分</option><option value="85">85分</option><option value="90">90分</option><option value="95">95分</option><option value="100">100分</option><option value="105">105分</option><option value="110">110分</option><option value="115">115分</option><option value="120">120分</option></select></div>
        <div class="operation-info-field"><label for="operationInfoReason">理由</label><select id="operationInfoReason"></select></div>
      </div>
      <div class="operation-info-actions"><button class="operation-info-cancel" type="button" onclick="resetOperationInfoForm()">入力クリア</button><button class="operation-info-add" type="button" onclick="addOperationInfo()">運行情報を登録</button></div>
    </div>
    <div class="operation-info-list" id="operationInfoList"></div>
  </div>
</div>
<div class="operation-info-detail-backdrop" id="operationInfoDetailBackdrop" onclick="hideOperationInfoDetail()"></div>
<div class="operation-info-detail" id="operationInfoDetail" role="dialog" aria-modal="true"><div class="operation-info-detail-header"><span>運行情報の詳細</span><button type="button" onclick="hideOperationInfoDetail()">✖</button></div><div class="operation-info-detail-body" id="operationInfoDetailBody"></div></div>

function buildTimetableRows(stops){
  const rows=[];
  for(let i=0;i<(stops||[]).length;){
    const station=String(stops[i]?.station||'');
    const times=[];
    let j=i;
    while(j<stops.length && String(stops[j]?.station||'')===station){
      const st=stops[j]||{};
      const a=st.arrival||st.time||'';
      const d=st.departure||st.time||'';
      if(a && !times.includes(a)) times.push(a);
      if(d && !times.includes(d)) times.push(d);
      j++;
    }
    rows.push({station,times:times.slice(0,2)});
    i=j;
  }
  return rows;
}
function timetableRowsHTML(stops){
  return buildTimetableRows(stops).map(row=>{
    // 同一駅に時刻が2つある場合、時刻表の1つ目を到着、2つ目を発車として2段表示。
    // 駅ごとの行の高さは常に56pxのままにする。
    const hasTwoTimes=row.times.length>=2;
    const rawTimes=hasTwoTimes ? row.times.slice(0,2) : row.times.slice(0,1);
    // 到着時刻と発車時刻が同一なら1つにまとめる。
    const times=(rawTimes.length>=2 && rawTimes[0]===rawTimes[1]) ? [rawTimes[0]] : rawTimes;
    const twoLine=times.length>=2;
    return `<div class="timetable-item"><div class="time-dot"></div><div class="time-text${twoLine?' two-line':''}">${times.map((t,i)=>`<span>${t}</span>`).join('')}</div><div class="station-text">${row.station}</div></div>`;
  }).join('');
}

function stateForTrain(state,no){

  if(Object.prototype.hasOwnProperty.call(obj,key)) return obj[key];
  const canonical=key.replace(/A$/i,'');

}

function applyRegistrationState(){
  const seen=new Set();
  [...TRAINS,...HOLIDAY_TRAINS].forEach(t=>{
    const key=String(t.no);
    const signature=`${key}|${String(t.direction||'')}`;
    if(seen.has(signature)) return;
    seen.add(signature);
    if(Object.prototype.hasOwnProperty.call(pendingFormationState,key)){
      t.formation=pendingFormationState[key]||null;
    }else{
      t.formation=stateForTrain(registrationState,key)||null;
    }
  });
}

function hydrateFromRoot(data){
  const next=data||{version:0,operationDate:null,stateByDay:{平日:{},休日:{}},formationUpdatedAtByDay:{平日:{},休日:{}},history:{}};
  const normalized={
    ...next,
    stateByDay:{平日:cloneState(next.stateByDay?.平日||{}),休日:cloneState(next.stateByDay?.休日||{})},
    formationUpdatedAtByDay:{平日:cloneState(next.formationUpdatedAtByDay?.平日||{}),休日:cloneState(next.formationUpdatedAtByDay?.休日||{})},
    history:cloneState(next.history||{})
  };
  if(stateFingerprint(normalized)===stateFingerprint(remoteRoot)) return false;
  remoteRoot=normalized;
  currentOperationDate=remoteRoot.operationDate||currentOperationDate||operationDateKey();
  operationHistory=historyEntries();
  registrationState=isHistoricalSelectedDate(selectedDateKey)
    ? historicalStateForDate(selectedDateKey)

}

function liveTrain(no,direction=null){
  const key=String(no??'');
  const dir=String(direction||'');
  if(dir){
    const cached=LIVE_TRAIN_CACHE.get(trainCacheKey(currentDay,key,dir));
    if(cached) return cached;
    const base=baseTrainForDay(key,dir,currentDay);
    if(base) return base;
  }
  const cached=LIVE_TRAIN_CACHE.get(trainCacheKey(currentDay,key,''));
  if(cached) return cached;
  if(currentDay==='休日') return baseTrainForDay(key,null,currentDay);
  return TRAIN_DATA_CACHE.get(trainCacheKey(currentDay,key,''))||baseTrainForDay(key,null,currentDay)||TRAIN_INDEX[key]||null;
}

async function preloadFirebaseState(){
  if(!firebaseReady||!firebaseDb) return false;
  try{
    const operationRef=firebaseOperationRef(), historyRef=firebaseHistoryRef();
    const [stateSnap,timestampSnap,historySnap]=await Promise.all([
      operationRef.child('stateByDay').once('value'),
      operationRef.child('formationUpdatedAtByDay').once('value'),
      historyRef.once('value')
    ]);
    const all=stateSnap.val()||{};
    remoteRoot.stateByDay={
      平日:cloneState(all.平日||{}),
      休日:cloneState(all.休日||{})
    };
    const ts=timestampSnap.val()||{};
    remoteRoot.formationUpdatedAtByDay={
      平日:cloneState(ts.平日||{}),
      休日:cloneState(ts.休日||{})
    };
    const historyRaw=historySnap.val()||{};
    remoteRoot.history=historyRaw?.履歴||historyRaw?.history||historyRaw;
    registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
    operationHistory=historyEntries();
    applyRegistrationState();
    saveLocalState();
    refreshVisibleUI();
    return true;
  }catch(e){
    console.warn('Firebase初期データ取得失敗',e);
    firebaseReady=false;
    return false;
  }
}

async function initFirebase(){
  loadLocalState();
  if(!FIREBASE_ENABLED||!window.firebase?.initializeApp) return false;
  try{
    firebaseApp=firebase.apps.find(a=>a.name===FIREBASE_APP_NAME);
    if(!firebaseApp) firebaseApp=firebase.initializeApp(FIREBASE_CONFIG,FIREBASE_APP_NAME);
    firebaseDb=firebase.database(firebaseApp);
    firebaseReady=true;
    syncStatus('Firebase接続中');

    // スカイツリーライン版と同じ方式：名前付きアプリでFirebaseを初期化し、
    // Realtime Databaseの /運用 を最初に読み込んでから監視を開始する。
    const preloadOk=await preloadFirebaseState();
    if(!preloadOk){
      firebaseReady=false;
      firebaseDb=null;
      syncStatus('Firebase接続失敗（ローカル動作）');
      warmAllTrainData();
      return false;
    }

    // 運行情報もスカイツリーライン版と同じく、初期読込→リアルタイム監視を行う。
    await loadOperationInfoFromFirebase();
    attachOperationInfoFirebaseListener();

    subscribeAllOperationState();
    const operationRef=firebaseOperationRef();
    if(operationRef){
      operationRef.child('formationUpdatedAtByDay').on('value',snap=>{
        const raw=snap.val()||{};
        remoteRoot.formationUpdatedAtByDay={平日:cloneState(raw.平日||{}),休日:cloneState(raw.休日||{})};
        saveLocalState();
        if(currentTrainNo&&!isEditMode) updateSheetContent();
      },err=>console.warn('Firebase編成入力時刻読込失敗',err));
    }
    const historyRef=firebaseHistoryRef();
    if(historyRef){
      historyRef.on('value',snap=>{
        const raw=snap.val()||{};
        remoteRoot.history=raw?.履歴||raw?.history||raw;
        operationHistory=historyEntries();
        if(isHistoricalSelectedDate(selectedDateKey)){
          registrationState=historicalStateForDate(selectedDateKey);
          applyRegistrationState();
          refreshVisibleUI();
        }
        saveLocalState();
        if(currentTrainNo&&!isEditMode) updateSheetContent();
      },err=>console.warn('Firebase履歴読込失敗',err));
    }
    warmAllTrainData();
    return true;
  }catch(e){
    console.warn('Firebase初期化失敗：ローカル動作に切り替えます',e);
    syncStatus('Firebase接続失敗（ローカル動作）');
    firebaseReady=false;
    firebaseDb=null;
    return false;
  }
}

async function syncRegistrationToRemote(changes={}){
  if(!firebaseReady||!firebaseDb){syncStatus('Firebase未接続');return false;}
  const entries=Object.entries(changes||{});
  if(!entries.length){syncStatus('Firebase同期済み');return true;}
  try{
    const dayRef=firebaseOperationRef().child('stateByDay').child(currentDay);
    const updates={};
    entries.forEach(([no,formId])=>{updates[String(no)]=(formId&&formId!==INITIAL_FORMATION_SELECTION.id)?String(formId):null;});
    await dayRef.update(updates);
    const committed=await dayRef.once('value');
    registrationState=cloneState(committed.val()||{});
    remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
    remoteRoot.stateByDay[currentDay]=cloneState(registrationState);
    const timestampRef=firebaseOperationRef().child('formationUpdatedAtByDay').child(currentDay);
    const timestampUpdates={};
    entries.forEach(([no,formId])=>{const key=String(no);timestampUpdates[key]=formId&&formId!==INITIAL_FORMATION_SELECTION.id?(pendingFormationTimestamps[currentDay]?.[key]||new Date().toISOString()):null;});
    await timestampRef.update(timestampUpdates);
    const tsSnap=await timestampRef.once('value');
    remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay[currentDay]=cloneState(tsSnap.val()||{});
    applyRegistrationState();
    saveLocalState();
    refreshAllTrainDataCache();
    broadcastState();
    syncStatus('Firebase同期済み');
    return true;
  }catch(e){
    console.error('Firebase書込失敗',e);
    syncStatus('Firebase書込失敗');
    return false;
  }
}

function findChain(day,trainNo){

function chainEntries(day,trainNo){
  const info=findChain(day,trainNo);
  if(!info) return null;
  return OPERATION_CHAINS[day]?.[info.chainIndex] || null;

/* 運用連結：同一列車が複数の運用グループに現れる場合も全該当チェーンを走査。
   ただし回送103/111と通常103A/111AのようにA有無で別列車の場合は、
   まず完全一致したチェーンだけを採用する。 */
function formationLinkedTrainNos(day,trainNo,direction=null){
  const no=normalizeTrainNo(trainNo);
  return no ? new Set([no]) : new Set();
}

async function recordSelection(train,formId){
  if(isNonCurrentSelectedDate(selectedDateKey)) return [];
  const linkedTrainNos=formationLinkedTrainNos(currentDay,train.no);
  const assigned=[];
  const changes={};

  linkedTrainNos.forEach(requested=>{
    const dayIndex=currentDay==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
    const actual=dayIndex[requested]
      ? requested
      : Object.keys(dayIndex).find(k=>k.replace(/A$/i,'')===String(requested).replace(/A$/i,'')) || null;
    if(!actual || assigned.includes(actual)) return;

    const value=(formId && formId!==INITIAL_FORMATION_SELECTION.id) ? String(formId) : null;
    if(value) registrationState[actual]=value;
    else delete registrationState[actual];
    assigned.push(actual);
    changes[actual]=value;

    pendingFormationState[actual]=value;
    pendingFormationTimestamps[currentDay]=pendingFormationTimestamps[currentDay]||{};
    if(value) pendingFormationTimestamps[currentDay][actual]=new Date().toISOString();
    else delete pendingFormationTimestamps[currentDay][actual];
  });

  applyRegistrationState();
  refreshAllTrainDataCache();
  saveLocalState();

  const ok=await syncRegistrationToRemote(changes);
  if(!ok){
    saveLocalState();
    syncStatus('同期失敗（再試行待ち）');
  }
  return assigned;
}
function snapshotForCurrentRegistrations(day, state, dateKey){
  const source=day==='休日'?HOLIDAY_TRAINS:TRAINS;
  const operations=[];
  source.forEach(t=>{
    const no=String(t?.no||'');
    const formation=stateForTrain(state,no);
    if(!no||!formation) return;
    operations.push({operationId:`${day}-${no}`,day,firstTrainNo:no,trainNumbers:[no],formationId:String(formation)});
  });
  return {date:dateKey,id:`${dateKey}_reset`,resetAt:resetTimeForDate(dateKey),operations,loggedAt:new Date().toISOString()};
}

function snapshotFromStateRoot(oldRoot,dateKey){
  const days=[];
  for(const day of ['平日','休日']){
    const snap=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey);
    if(snap.operations.length) days.push(snap);
  }
  return {id:dateKey,date:dateKey,resetAt:resetTimeForDate(dateKey),days,loggedAt:new Date().toISOString()};
}

async function maybeResetForNewOperationDay(remoteCheck=false){
  const opDate=operationDateKey();
  // 「現在時刻」モードでは、3:00を跨いだ時点で表示日付も新しい運用日に切り替える。
  if(followNow && selectedDateKey!==opDate){
    setSelectedDate(opDate);
  }else if(!followNow && isHistoricalSelectedDate(selectedDateKey)){
    // 手動で過去日を選択している場合は、過去データ表示を維持する。
    return;
  }
  if(!currentOperationDate) currentOperationDate=remoteRoot.operationDate||opDate;

  if(firebaseReady){
    try{
      await firebaseOperationRef().transaction(current=>{
        const cur=current||{stateByDay:{平日:{},休日:{}},operationDate:opDate,version:0};
        cur.stateByDay=cur.stateByDay||{平日:{},休日:{}};
        const oldDate=cur.operationDate;
        if(oldDate && oldDate!==opDate){
          const snapshot=snapshotFromStateRoot(cur,oldDate);
          if(snapshot.days.length){
            // transaction内では履歴書込みを行わず、後段で候補として保持
            window.__pendingResetSnapshot=snapshot;
          }
          cur.stateByDay={平日:{},休日:{}};
          cur.operationDate=opDate;
          cur.version=(cur.version||0)+1;
          cur.updatedAt=firebase.database.ServerValue.TIMESTAMP;
        }
        return cur;
      });
      if(window.__pendingResetSnapshot){
        const snapshot=window.__pendingResetSnapshot;
        window.__pendingResetSnapshot=null;
        try{
          // 日付固定キーで保存するため、複数端末が同時に3:00を検出しても同一履歴へ収束
          await firebaseHistoryRef().child(snapshot.id).set(snapshot);
          operationHistory=historyEntries();
          saveLocalState();
        }catch(e){
          // 既に他端末が登録済みの場合はルールにより書込失敗するが、これは正常な競合
          console.warn('履歴追加競合または失敗',e);
        }
      }
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.stateByDay={平日:{},休日:{}};
      registrationState={};
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }catch(e){ console.error('remote reset failed',e); }
  }else{
    if(currentOperationDate!==opDate){
      const snapshot=snapshotFromStateRoot(remoteRoot,currentOperationDate);
      remoteRoot.stateByDay={平日:{},休日:{}};
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.history=remoteRoot.history||{};
      if(snapshot.days.length) remoteRoot.history[snapshot.id]=snapshot;
      registrationState={};
      operationHistory=historyEntries();
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }else{
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      saveLocalState();
    }
  }
}

function nthMondayDateKey(year,month,nth){
  const d=new Date(year,month-1,1);
  const offset=(8-d.getDay())%7;
  d.setDate(1+offset+(nth-1)*7);
  return todayKey(d);
}
function equinoxDateKey(year,isVernal){
  // 日本の春分・秋分日は将来の暦にも対応できるよう近似計算。
  // 1980～2099年程度で実用上十分な精度。
  const y=year-1980;
  const base=isVernal?20.8431:23.2488;
  const drift=0.242194;
  const day=Math.floor(base+drift*y-Math.floor(y/4));
  return `${year}-${isVernal?'03':'09'}-${String(day).padStart(2,'0')}`;
}
function getJapaneseNationalHolidays(year){
  const h=new Set();
  const add=(m,d)=>h.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);
  h.add(nthMondayDateKey(year,1,2));
  add(2,11);
  if(year>=2020) add(2,23);
  h.add(equinoxDateKey(year,true));
  add(4,29); add(5,3); add(5,4); add(5,5);
  h.add(nthMondayDateKey(year,7,3));
  add(8,11);
  h.add(nthMondayDateKey(year,9,3));
  h.add(equinoxDateKey(year,false));
  h.add(nthMondayDateKey(year,10,2));
  add(11,3); add(11,23);

  // 一時的な祝日移動など
  if(year===2019){ add(5,1); add(10,22); }
  if(year===2020){
    h.delete(`${year}-07-20`); add(7,23);
    h.delete(`${year}-10-12`); add(7,24);
  }
  if(year===2021){
    h.delete(`${year}-07-19`); add(7,22); add(7,23);
    h.delete(`${year}-08-11`); add(8,8);
    h.delete(`${year}-10-11`);
  }
  return h;
}
function getJapaneseHolidaySet(year){
  const national=getJapaneseNationalHolidays(year);
  const holidays=new Set(national);
  // 日曜祝日の振替休日
  for(const key of [...national]){
    const d=new Date(`${key}T00:00:00`);
    if(d.getDay()!==0) continue;
    const cursor=new Date(d);
    do{
      cursor.setDate(cursor.getDate()+1);
      const k=todayKey(cursor);
      if(!national.has(k) && !holidays.has(k)){ holidays.add(k); break; }
    }while(cursor.getFullYear()<=year+1);
  }
  // 祝日に挟まれた休日
  const start=new Date(year,0,1), end=new Date(year,11,31);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=todayKey(d);
    if(holidays.has(key)) continue;
    const prev=new Date(d); prev.setDate(prev.getDate()-1);
    const next=new Date(d); next.setDate(next.getDate()+1);
    if(national.has(todayKey(prev)) && national.has(todayKey(next))) holidays.add(key);
  }
  return holidays;
}
function isJapaneseHoliday(dateObj){
  return getJapaneseHolidaySet(dateObj.getFullYear()).has(todayKey(dateObj));
}
function getScheduleDayForDate(dateObj){
  const d=new Date(dateObj);
  const weekend=d.getDay()===0||d.getDay()===6;
  return (weekend||isJapaneseHoliday(d))?'休日':'平日';
}
function isHistoricalSelectedDate(dateKey){
  const currentOperationDate=operationDateKey();
  return String(dateKey||'') < currentOperationDate;
}
function isNonCurrentSelectedDate(dateKey){
  const currentOperationDate=operationDateKey();
  return String(dateKey||'') !== currentOperationDate;
}
function historicalStateForDate(dateKey){
  const root=remoteRoot.history||{};
  const snap=root[String(dateKey)] || Object.values(root).find(x=>String(x?.date||'')===String(dateKey)) || null;
  if(!snap) return {};
  const days=Array.isArray(snap.days)?snap.days:[snap];
  let daySnap=days.find(d=>String(d?.day||'')===String(currentDay)) || null;
  // Older snapshots may have been saved without a day label. In that case the
  // first valid day snapshot is still preferable to returning an empty state.
  if(!daySnap && days.length===1) daySnap=days[0];
  if(!daySnap || !Array.isArray(daySnap.operations)) return {};
  const state={};
  const dayIndex=currentDay==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
  const resolveKey=raw=>{
    const s=String(raw||'');
    if(dayIndex[s]) return s;
    const a=s.replace(/A$/i,'')+'A';
    if(dayIndex[a]) return a;
    const plain=s.replace(/A$/i,'');
    if(dayIndex[plain]) return plain;
    return a;
  };
  daySnap.operations.forEach(op=>{
    const form=op?.formationId;
    (Array.isArray(op?.trainNumbers)?op.trainNumbers:[]).forEach(no=>{
      if(!form) return;
      state[resolveKey(no)]=String(form);
    });
  });
  return state;
}

}

function formationById(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return null;
  for(const group of FORMATIONS){
    if(group.type===id) return {id:group.type,name:group.type,img:group.typeImg,kind:'type',type:group.type};
    const direct=(group.items||[]).find(i=>i.id===id);
    if(direct) return direct;
    for(const variant of (group.variants||[])){
      if(variant.id===id) return {...variant,kind:'variant',type:group.type};
      const found=(variant.items||[]).find(i=>i.id===id);
      if(found) return found;
    }
  }
  return null;
}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase();
  const v=raw.replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!v) return {ok:false,error:'車両番号または編成番号を入力してください。'};

  // 編成番号を直接入力した場合（Fあり/なし両対応）。
  const nMatch=v.match(/^N0*(\d+)F?$/i);
  const nDirect=nMatch?`N${Number(nMatch[1])}`:v;
  const candidates=[nDirect, nDirect.endsWith('F')?nDirect.slice(0,-1):nDirect, nDirect+'F', v, v.endsWith('F')?v.slice(0,-1):v, v+'F'];
  for(const c of candidates){
    const exact=formationById(c);
    if(exact){
      if(UNAVAILABLE_FORMATIONS.has(String(exact.id))) return {ok:false,error:`編成「${exact.name}」は入力できません。`};
      return {ok:true,id:exact.id};
    }
  }

  // 車両番号から編成番号を特定する。
  // 車両番号は「クハE233-8001」のように、車種 + E233 + ハイフン + 4桁で入力する。
  // E233-8001 や 8001 のような省略入力は受け付けない。
  const vehicleNoMatch=v.match(/^(?:クハE233|クハE232|モハE233|モハE232)-(\d{4})$/i);
  let formationId=null;
  if(vehicleNoMatch){
    const vehicleNo=vehicleNoMatch[1];
    formationId=VEHICLE_TO_FORMATION[vehicleNo];
  }
  if(formationId && formationById(formationId)){
    if(UNAVAILABLE_FORMATIONS.has(String(formationId))) return {ok:false,error:`編成「${formationById(formationId)?.name||formationId}」は入力できません。`};
    return {ok:true,id:formationId};
  }

  return {ok:false,error:`車両番号「${raw}」に該当する編成が見つかりません。`};
}
function selectionDisplayObject(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return INITIAL_FORMATION_SELECTION;
  const known=formationById(id);
  return known || INITIAL_FORMATION_SELECTION;
}

// 編成表示を「形式 + 要素」の2行に分解する。
// 例: 60000型6両 → [60000型, 6両] / 10030型+未更新 → [10030型, 未更新]
function formationDisplayParts(id){
  const obj=selectionDisplayObject(id);
  if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) return [];
  const type=String(obj.type||'').trim();
  const name=String(obj.name||'').trim();
  if(!name) return [];
  if(type){
    if(name===type) return [type];
    if(name.startsWith(type)){
      const element=name.slice(type.length).trim();
      return element ? [type, element] : [type];
    }
    if(obj.kind==='variant') return [type, name];
  }
  const m=name.match(/^(.*?型)(.+)$/);
  return m ? [m[1],m[2].trim()] : [name];
}

}

function formatTimeNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function currentMinutes(){
  // 時刻入力・現在時刻とも、03:00を境とする「運用日」の分数で扱う。
  // 0:00～2:59は1440分台にすることで、前日の23時台から続く列車が
  // 日付変更後もそのまま位置計算へ入れる。
  if(followNow){
    const d=new Date();
    const base=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
    return d.getHours()<RESET_HOUR ? base+1440 : base;
  }
  const input=document.getElementById('timeInput');
  const value=input?.value || formatTimeNow();
  const [h,m]=String(value).split(':').map(Number);
  if(Number.isFinite(h) && Number.isFinite(m)){
    // 任意時刻入力時は、その入力時刻の30秒時点を表示基準とする。
    const base=h*60+m+0.5;
    return h<RESET_HOUR ? base+1440 : base;
  }
  const d=new Date();
  const base=d.getHours()*60+d.getMinutes();
  return d.getHours()<RESET_HOUR ? base+1440 : base;
}

function timeToMinutes(value){
  const [h,m]=String(value).split(':').map(Number);
  if(!Number.isFinite(h)||!Number.isFinite(m)) return NaN;
  // 運用日は03:00を境にする。0:00～2:59の時刻は翌日扱いとして
  // 1440分台へ持ち上げ、23時台から続く列車を同一運用日で比較できるようにする。
  return h<RESET_HOUR ? h*60+m+1440 : h*60+m;
}
function inferDirectionFromStations(a,b){
  const ia=stationIndex(a),ib=stationIndex(b);
  return ia>ib?'up':'down';
}
function linkedEntries(t){
  const info=findChain(currentDay,t.no);
  if(!info) return {prev:null,next:null,chain:null,index:-1};
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  return {prev:chain[info.entryIndex-1]||null,next:chain[info.entryIndex+1]||null,chain,index:info.entryIndex};
}
function trainEntryNo(entry){ return entry?normalizeTrainNo(entry.no):''; }
function connectionPrev(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const prev=chain[info.entryIndex-1];
  if(!prev || String(prev.dest)!==String(t.start)) return null;
  if(timeToMinutes(prev.endTime)>timeToMinutes(t.stops[0].time)) return null;
  return prev;
}
function connectionNext(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const next=chain[info.entryIndex+1];
  if(!next || String(t.dest)!==String(next.start)) return null;
  if(timeToMinutes(t.stops[t.stops.length-1].time)>timeToMinutes(next.startTime)) return null;
  return next;
}
function normalizeNambuStopTimes(stops){
  const out=[];
  let prevDep=null;
  (stops||[]).forEach((stop,index)=>{
    let arrival=timeToMinutes(stop?.arrival||stop?.time||stop?.departure);
    let departure=timeToMinutes(stop?.departure||stop?.time||stop?.arrival);
    if(!Number.isFinite(arrival)||!Number.isFinite(departure)) return;
    if(index>0){
      while(Number.isFinite(prevDep) && arrival < prevDep-720){ arrival+=1440; departure+=1440; }
      while(departure < arrival) departure+=1440;
      while(Number.isFinite(prevDep) && departure < prevDep-720){ arrival+=1440; departure+=1440; }
    }
    prevDep=departure;
    out.push({...stop,_arrival:arrival,_departure:departure});
  });
  return out;
}
function positionForTrain(t,minutes){
  const stops=normalizeNambuStopTimes(t?.stops||[]);
  if(!stops.length) return null;
  const first=stops[0], last=stops[stops.length-1];
  const side=String(t?.direction||'').toLowerCase()==='up'?'left':'right';
  const firstDep=Number(first._departure), lastArr=Number(last._arrival);
  if(!Number.isFinite(firstDep)||!Number.isFinite(lastArr)) return null;

  const start=firstDep-RESET_DWELL_MIN+0.5;
  if(minutes>=start && minutes<firstDep+0.75){
    return {pos:stationIndex(first.station),side,visualTrain:t,mode:'start-dwell'};
  }

  for(let i=0;i<stops.length;i++){
    const st=stops[i];
    const arrive=Number(st._arrival)+0.25;
    const depart=Number(st._departure)+0.75;
    if(i>0 && i<stops.length-1 && minutes>=arrive && minutes<depart){
      return {pos:stationIndex(st.station),side,visualTrain:t,mode:'station-dwell'};
    }
    if(stationIndex(st.station)<0) continue;
    if(i<stops.length-1){
      const next=stops[i+1];
      const a=Number(st._departure)+0.75;
      const b=Number(next._arrival)+0.25;
      if(Number.isFinite(a)&&Number.isFinite(b)&&minutes>=a&&minutes<=b){
        const ia=stationIndex(st.station),ib=stationIndex(next.station);
        const ratio=b===a?0:(minutes-a)/(b-a);
        return {pos:ia+(ib-ia)*ratio,side,visualTrain:t,mode:'run'};
      }
    }
  }

  const endDwell=lastArr+RESET_DWELL_MIN+0.5;
  if(minutes>=lastArr+0.25 && minutes<=endDwell){
    return {pos:stationIndex(last.station),side,visualTrain:t,mode:'end-dwell'};
  }
  return null;
}
function trainLabelText(t){ return `<span>${getShortType(t.type,t.no)} ${getShortDest(t.dest)}</span>`; }
function trainPositionViewportVisible(p,rows,viewportTop,viewportBottom){
  if(!p||!Number.isFinite(Number(p.pos))||!rows.length) return false;
  const q=Math.max(0,Math.min(rows.length-1,Number(p.pos)));
  const i0=Math.floor(q),i1=Math.min(rows.length-1,Math.ceil(q)),f=q-i0;
  const r0=rows[i0]?.getBoundingClientRect(),r1=rows[i1]?.getBoundingClientRect();
  if(!r0||!r1) return false;
  const y=r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f;
  const iconHalfHeight=48;
  return y+iconHalfHeight>=viewportTop&&y-iconHalfHeight<=viewportBottom;
}

function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  layer.innerHTML='';
  const rows=Array.from(document.querySelectorAll('.station-row'));
  if(!rows.length) return;
  const viewportTop=0;
  const viewportBottom=window.innerHeight||document.documentElement.clientHeight||0;
  const source=(currentDay==='休日'?HOLIDAY_TRAINS:TRAINS.filter(t=>!Array.isArray(t.days)||!t.days.length||t.days.includes(currentDay)));
  const visible=[];
  const visiblePositions=new Map();
  for(const base of source){
    const p=positionForTrain(base,minutes);
    if(!p||(!p.stationA&&!p.stationB && !Number.isFinite(p.pos))) continue;
    if(!trainPositionViewportVisible(p,rows,viewportTop,viewportBottom)) continue;
    const hydrated=liveTrain(base.no,base.direction)||base;
    const signature=`${String(base.no||'')}|${String(base.direction||'')}`;
    visible.push(hydrated);
    visiblePositions.set(signature,p);
  }
  const occupied={left:[],right:[]};
  visible.forEach(t=>{
    const signature=`${String(t.no||'')}|${String(t.direction||'')}`;
    const info=visiblePositions.get(signature)||positionForTrain(t,minutes);
    if(!info||!info.visualTrain) return;
    occupied[info.side].push({t:info.visualTrain,pos:info.pos,baseTrain:t,mode:info.mode});
  });

  const layerRect=layer.getBoundingClientRect();
  const uiScale=1, trainWidth=66*uiScale, imageWidth=60*uiScale, laneGap=20*uiScale;
  const rowRectAt=(pos)=>{
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p), i1=Math.min(rows.length-1,Math.ceil(p));
    const r0=rows[i0].getBoundingClientRect(), r1=rows[i1].getBoundingClientRect(), f=p-i0;
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});
      const el=document.createElement('div');
      el.className=`train-icon ${side}`;
      el.style.visibility='hidden'; el.style.transition='none';
      const rr=rowRectAt(item.pos)||{left:layerRect.left,right:layerRect.right,centerY:layerRect.top+layerRect.height/2};
      const layoutWidth=window.innerWidth<960?1920:layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'?centerX-340-laneOffset:centerX+340-trainWidth+laneOffset;
      const t=item.t;
      const cls=trainVisualKind(t);
      const formationParts=t.formation&&t.formation!==INITIAL_FORMATION_SELECTION.id?formationDisplayParts(t.formation):[];
      el.innerHTML=`<span class="train-no">${displayTrainNo(t)}</span><img src="${imageForTrain(t)}" alt="${displayTrainNo(t)}">${formationParts.length?`<span class="train-no train-formation">${formationParts.map(x=>`<span>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`).join('')}</span>`:''}<span class="train-label ${cls} ${getMainLabelClass(t.type)}">${trainLabelText(t)}</span>`;
      el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();openSheet(t.no,false,t.direction);});
      layer.appendChild(el);
      const img=el.querySelector('img'), noEl=el.querySelector('.train-no'), formationEl=el.querySelector('.train-formation');
      const applyFinalPosition=()=>{
        if(!img) return;
        const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
        const imgRect=img.getBoundingClientRect(), noRect=noEl?.getBoundingClientRect(), formationRect=formationEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom)||imageWidth;
        const imgHeight=(imgRect.height/mobileZoom)||actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom)||12*uiScale*1.05;
        const formationHeight=(formationRect?.height/mobileZoom)||0;
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-(noHeight+imgHeight+formationHeight)/2;
        el.style.top=`${finalTop}px`; el.style.left=`${trainLeft}px`; el.style.right='auto'; el.style.setProperty('--lane-shift','0px'); el.style.transform='none'; el.style.visibility='visible';
      };
      if(img.complete&&img.naturalWidth) applyFinalPosition(); else img.addEventListener('load',applyFinalPosition,{once:true});
    });
  });
}

function serviceDayMinute(hour,minute){
  const total=Number(hour)*60+Number(minute);
  return total<180 ? total+1440 : total;
}

function stationTimetableHTML(station, selectedDirection='up'){
  // 駅時刻表も選択日付から直接ダイヤ区分を同期。
  syncCurrentScheduleDay();
  const stationName=String(station?.nameJa||'');
  const directionData={up:{label:'川崎方面',entries:[]},down:{label:'立川方面',entries:[]}};
  const byTrain=new Map();

  // 当日の全列車を常に表示し、スクロール位置だけを「次発」に合わせる。
  getVisibleTrains().forEach(train=>{
    if(String(train?.dest||'')===stationName) return; // 当駅止まりは除外
    // 駅の時刻表には回送列車を掲載しない。
    if(String(train?.type||'')==='回送') return;
    const stops=(train.stops||[]).filter(stop=>String(stop?.station||'')===stationName);
    if(!stops.length) return;
    const stop=stops[stops.length-1]; // 同一駅が2回ある場合は発車側の時刻
    const time=String(stop?.time||'');
    const m=time.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return;
    const hour=Number(m[1]), minute=Number(m[2]);
    if(!Number.isFinite(hour)||!Number.isFinite(minute)) return;
    const bucket=String(train?.direction||'up')==='down'?'down':'up';
    byTrain.set(`${bucket}:${String(train.no)}`,{train,hour,minute,time,bucket});
  });

  Array.from(byTrain.values())
    .sort((a,b)=>serviceDayMinute(a.hour,a.minute)-serviceDayMinute(b.hour,b.minute)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}))
    .forEach(entry=>directionData[entry.bucket].entries.push(entry));

  const escapeAttr=value=>String(value)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeJs=value=>String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const stationTimetableFormationParts=(train)=>{
    const obj=selectionDisplayObject(train?.formation);
    if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) return ['—'];
    const type=String(obj.type||'').trim();
    const name=String(obj.name||'').trim();

    // 「60000型6両」のようにnameにも形式が入っている場合は、
    // 形式と要素を分離して2行で表示する。
    if(type && name){
      if(name===type) return [type];
      if(name.startsWith(type)){
        const element=name.slice(type.length).trim();
        return element ? [type, element] : [type];
      }
      // 「10030型 / 未更新」のようにnameが要素だけの場合。
      if(obj.kind==='variant') return [type, name];
    }

    const m=name.match(/^(.*?型)(.+)$/);
    if(m) return [m[1],m[2].trim()];
    return [name];
  };
  const stationTimetableFormationHTML=(train)=>{
    const parts=stationTimetableFormationParts(train);
    return `<span class="station-timetable-formation">${parts.map(x=>`<span class="station-timetable-formation-line">${escapeAttr(x)}</span>`).join('')}</span>`;
  };

  const renderDirection=(key)=>{
    const data=directionData[key];
    if(!data.entries.length) return '';

    const now=currentMinutes();
    const nowService=serviceDayMinute(Math.floor(now/60), now%60);
    let nextIndex=data.entries.findIndex(entry=>serviceDayMinute(entry.hour,entry.minute)>=nowService);
    if(nextIndex<0) nextIndex=0;

    const rows=data.entries.map((item,index)=>{
      const train=item.train;
      const selectedForm=selectionDisplayObject(train.formation);
      const imgSrc=selectedForm?.img||NAMBU_TRAIN_IMG;
      const destination=`${getDetailDest(train.dest)} 行`;
      const isNext=index===nextIndex;

      return `
        <button
          class="station-timetable-row${isNext?' is-next':''}"
          type="button"
          data-next-train="${isNext?'true':'false'}"
          title="列車 ${escapeAttr(displayTrainNo(train))} / ${escapeAttr(item.time)} / ${escapeAttr(destination)}"
          onclick="openSheet('${escapeJs(train.no)}',true,'${escapeJs(train.direction||stationTimetableDirection)}')"
        >
          <img class="station-timetable-train-img" src="${escapeAttr(imgSrc)}" alt="${escapeAttr(displayTrainNo(train))}">
          ${stationTimetableFormationHTML(train)}
          <span class="station-timetable-time">${escapeAttr(item.time)}</span>
          <span class="station-timetable-type ${escapeAttr(getExpressClass(train))}">${escapeAttr(getDetailType(train.type))}</span>
          <span class="station-timetable-destination"><span class="station-timetable-destination-station">${escapeAttr(getDetailDest(train.dest))}</span><span class="station-timetable-destination-go">行</span></span>
        </button>
      `;
    }).join('');

    return `<section class="station-timetable-direction" data-direction="${key}">${rows}</section>`;
  };

  const html=renderDirection(selectedDirection);
  if(!html) return `<div class="station-timetable-empty">この方面の時刻表はありません。</div>`;
  return `
    <div class="station-timetable-frame">
      <div class="station-timetable-wrap" id="stationTimetableScroll">
        ${html}
      </div>
    </div>
  `;
}

function formatFormationUpdatedAt(trainNo){
  const key=String(trainNo);
  // 編成未入力の列車には入力時刻を絶対に表示しない。
  const formation = Object.prototype.hasOwnProperty.call(pendingFormationState,key)
    ? pendingFormationState[key]
    : registrationState[key];
  if(!formation || formation===INITIAL_FORMATION_SELECTION.id) return '';

}

  if(errorEl) errorEl.textContent='';

/* JR南武線・運行情報 */
const OPERATION_INFO_STORAGE_KEY='jreNambuOperationInfo_v1';
const OPERATION_INFO_REASONS=['人身事故','車両故障・点検','信号・電気設備トラブル','線路内立入り・支障物','踏切・安全確認','天候（大雨・強風・雷・雪）','地震・災害','急病人救護','混雑・その他'];
const OPERATION_INFO_STATIONS=STATIONS.map(s=>s.nameJa);
let operationInfoEntries=[];
let operationInfoFirebaseListenerRef=null;
let operationInfoFirebaseSaving=false;
function operationInfoNormalizeName(name){return String(name??'').normalize('NFKC').replace(/\u3000/g,' ').trim();}
function operationInfoFindPath(start,end){
  start=operationInfoNormalizeName(start); end=operationInfoNormalizeName(end);
  const a=OPERATION_INFO_STATIONS.indexOf(start), b=OPERATION_INFO_STATIONS.indexOf(end);
  if(a<0||b<0||a===b) return null;
  const step=a<b?1:-1, path=[];
  for(let i=a;;i+=step){ path.push(OPERATION_INFO_STATIONS[i]); if(i===b) break; }
  return path.length>=2?path:null;
}
function operationInfoUndirectedKey(a,b){return [String(a||''),String(b||'')].sort().join('\u0000');}
function operationInfoPathEdges(stations){const set=new Set();for(let i=0;i<stations.length-1;i++)set.add(operationInfoUndirectedKey(stations[i],stations[i+1]));return set;}
function operationInfoSubtractEdges(stations,blocked){
  const parts=[]; let cur=[];
  for(let i=0;i<stations.length-1;i++){
    const a=stations[i],b=stations[i+1];
    if(blocked.has(operationInfoUndirectedKey(a,b))){if(cur.length>=2)parts.push(cur);cur=[];continue;}
    if(!cur.length)cur=[a]; cur.push(b);
  }
  if(cur.length>=2)parts.push(cur);
  return parts;
}
function operationInfoDelayValue(value){if(value===null||value===undefined||String(value)==='')return'unknown';const n=Number(value);return Number.isFinite(n)&&n>0?n:'unknown';}
function operationInfoDelayText(value){const d=operationInfoDelayValue(value);return d==='unknown'?'遅延時間不明':`遅延 ${d}分`;}
function normalizeOperationEntry(e){
  const stations=Array.isArray(e?.stations)&&e.stations.length>=2?e.stations.map(operationInfoNormalizeName):operationInfoFindPath(e?.start,e?.end);
  if(!stations||stations.length<2) return null;
  return {...e,start:stations[0],end:stations.at(-1),stations,status:e?.status==='suspend'?'suspend':'delay',delay:e?.status==='suspend'?'unknown':operationInfoDelayValue(e?.delay)};
}
function operationInfoDateKey(){return String(selectedDateKey||operationDateKey());}
function loadOperationInfo(){try{const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');operationInfoEntries=(Array.isArray(all?.[operationInfoDateKey()])?all[operationInfoDateKey()]:[]).map(normalizeOperationEntry).filter(Boolean);}catch(e){operationInfoEntries=[];}}
function saveOperationInfo(){try{const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');all[operationInfoDateKey()]=operationInfoEntries;localStorage.setItem(OPERATION_INFO_STORAGE_KEY,JSON.stringify(all));}catch(e){}}
function operationInfoFirebasePayload(entry){return{id:String(entry.id),start:operationInfoNormalizeName(entry.start),end:operationInfoNormalizeName(entry.end),stations:Array.isArray(entry.stations)?entry.stations.map(operationInfoNormalizeName):[],status:entry.status==='suspend'?'suspend':'delay',delay:operationInfoDelayValue(entry.delay),reason:String(entry.reason||OPERATION_INFO_REASONS[0]),createdAt:Number(entry.createdAt)||Date.now(),operationDate:operationInfoDateKey()};}
function operationInfoFirebaseFlatten(v){const root=v&&typeof v==='object'?v:{};return Object.entries(root).map(([id,p])=>normalizeOperationEntry({...p,id:String(p?.id||id)})).filter(Boolean);}
async function saveOperationInfoToFirebase(){
  if(!firebaseReady||operationInfoFirebaseSaving) return false;
  operationInfoFirebaseSaving=true;
  try{
    const db=firebaseDatabase(); if(!db) return false; const ref=db.ref('運行情報').child(operationInfoDateKey());
    const tree={};
    operationInfoEntries.map(normalizeOperationEntry).filter(Boolean).forEach(e=>{tree[String(e.id)]=operationInfoFirebasePayload(e);});
    await ref.set(tree);
    return true;
  }catch(e){console.warn('運行情報Firebase保存失敗',e);return false;}
  finally{operationInfoFirebaseSaving=false;}
}
async function loadOperationInfoFromFirebase(){
  if(!firebaseReady) return false;
  try{
    const db=firebaseDatabase(); if(!db) return false; const ref=db.ref('運行情報').child(operationInfoDateKey());
    const snap=await ref.once('value');
    if(snap.exists()){
      const remote=operationInfoFirebaseFlatten(snap.val());
      const merged=new Map();
      [...operationInfoEntries,...remote].forEach(e=>{if(!e?.id)return;const id=String(e.id),prev=merged.get(id);if(!prev||Number(e.createdAt||0)>=Number(prev.createdAt||0))merged.set(id,e);});
      operationInfoEntries=[...merged.values()];
    }
    saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();
    return true;
  }catch(e){console.warn('運行情報Firebase読込失敗',e);return false;}
}
function attachOperationInfoFirebaseListener(){
  if(!firebaseReady) return;
  try{if(operationInfoFirebaseListenerRef)operationInfoFirebaseListenerRef.off();}catch(e){}
  const db=firebaseDatabase(); if(!db) return; const ref=db.ref('運行情報').child(operationInfoDateKey());
  const handler=snap=>{
    if(operationInfoFirebaseSaving)return;
    operationInfoEntries=operationInfoFirebaseFlatten(snap.val()||{});
    saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();
  };
  ref.on('value',handler);operationInfoFirebaseListenerRef=ref;
}
function updateOperationInfoStationOptions(){
  const a=document.getElementById('operationInfoStart'),b=document.getElementById('operationInfoEnd');if(!a||!b)return;
  const html=OPERATION_INFO_STATIONS.map(st=>`<option value="${esc(st)}">${esc(st)}</option>`).join('');
  const pa=operationInfoNormalizeName(a.value),pb=operationInfoNormalizeName(b.value);a.innerHTML=html;b.innerHTML=html;
  if(OPERATION_INFO_STATIONS.includes(pa))a.value=pa; else a.selectedIndex=0;
  if(OPERATION_INFO_STATIONS.includes(pb))b.value=pb; else b.selectedIndex=Math.min(1,OPERATION_INFO_STATIONS.length-1);
}
function updateOperationInfoReasonOptions(){const r=document.getElementById('operationInfoReason');if(!r)return;const prev=r.value||OPERATION_INFO_REASONS[0];r.innerHTML=OPERATION_INFO_REASONS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(OPERATION_INFO_REASONS.includes(prev))r.value=prev;}
function initOperationInfoUI(){
  updateOperationInfoStationOptions();updateOperationInfoReasonOptions();
  const delay=document.getElementById('operationInfoDelay');
  document.querySelectorAll('input[name="operationStatus"]').forEach(x=>{if(x.dataset.bound==='1')return;x.dataset.bound='1';x.addEventListener('change',()=>{if(delay)delay.disabled=x.value==='suspend'&&x.checked;});});
  const checked=document.querySelector('input[name="operationStatus"]:checked');if(checked&&delay)delay.disabled=checked.value==='suspend';renderOperationInfoList();
}
function openOperationInfo(){initOperationInfoUI();document.getElementById('operationInfoBackdrop')?.classList.add('active');document.getElementById('operationInfoPanel')?.classList.add('active');renderOperationInfoList();}
function closeOperationInfo(){document.getElementById('operationInfoBackdrop')?.classList.remove('active');document.getElementById('operationInfoPanel')?.classList.remove('active');hideOperationInfoDetail();}
function resetOperationInfoForm(){updateOperationInfoStationOptions();updateOperationInfoReasonOptions();const d=document.getElementById('operationInfoDelay');if(d){d.disabled=false;d.value='unknown';}const r=document.getElementById('operationInfoReason');if(r)r.value=OPERATION_INFO_REASONS[0];const first=document.querySelector('input[name="operationStatus"][value="delay"]');if(first){first.checked=true;first.dispatchEvent(new Event('change'));}}
function addOperationInfo(){
  const start=operationInfoNormalizeName(document.getElementById('operationInfoStart')?.value||''),end=operationInfoNormalizeName(document.getElementById('operationInfoEnd')?.value||''),status=document.querySelector('input[name="operationStatus"]:checked')?.value||'delay',reason=document.getElementById('operationInfoReason')?.value||OPERATION_INFO_REASONS[0],delay=(document.getElementById('operationInfoDelay')?.value==='unknown'?'unknown':Number(document.getElementById('operationInfoDelay')?.value||0)||0),path=operationInfoFindPath(start,end);
  if(!path){alert('選択した2駅を結ぶ区間が見つかりません。');return;}
  if(status==='delay'&&delay!=='unknown'&&(!Number.isFinite(delay)||delay<5||delay%5!==0)){alert('遅延時間は5分単位で選択してください。');return;}
  const newEdges=operationInfoPathEdges(path),next=[];
  for(const raw of operationInfoEntries){const old=normalizeOperationEntry(raw);if(!old)continue;for(const part of operationInfoSubtractEdges(old.stations,newEdges)){next.push({...old,id:`${old.id}_${Math.random().toString(36).slice(2,7)}`,start:part[0],end:part.at(-1),stations:part});}}
  next.push({id:`${Date.now()}_${Math.random().toString(36).slice(2,8)}`,start,end,stations:path,status,delay:status==='delay'?delay:'unknown',reason,createdAt:Date.now()});
  operationInfoEntries=next.map(normalizeOperationEntry).filter(Boolean);saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();resetOperationInfoForm();saveOperationInfoToFirebase();
}
function deleteOperationInfo(id){operationInfoEntries=operationInfoEntries.filter(x=>String(x.id)!==String(id));saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();saveOperationInfoToFirebase();}
function showOperationInfoDetail(id){const e=operationInfoEntries.find(x=>String(x.id)===String(id));if(!e)return;const body=document.getElementById('operationInfoDetailBody');if(!body)return;const txt=e.status==='suspend'?'運転見合わせ':operationInfoDelayText(e.delay);const posted=e.createdAt?new Date(Number(e.createdAt)).toLocaleString('ja-JP',{hour12:false}):'';body.innerHTML=`<div class="operation-info-detail-status ${e.status==='suspend'?'suspend':'delay'}">${esc(txt)}</div><div><strong>区間：</strong>${esc(`${e.start} ⇄ ${e.end}`)}</div><div><strong>理由：</strong>${esc(e.reason||OPERATION_INFO_REASONS[0])}</div><div><strong>投稿時刻：</strong>${esc(posted)}</div>`;document.getElementById('operationInfoDetailBackdrop')?.classList.add('active');document.getElementById('operationInfoDetail')?.classList.add('active');}
function hideOperationInfoDetail(){document.getElementById('operationInfoDetailBackdrop')?.classList.remove('active');document.getElementById('operationInfoDetail')?.classList.remove('active');}
function renderOperationInfoList(){const box=document.getElementById('operationInfoList');if(!box)return;if(!operationInfoEntries.length){box.innerHTML='<div class="operation-info-empty">登録されている運行情報はありません。</div>';return;}box.innerHTML=operationInfoEntries.map(x=>{const txt=x.status==='suspend'?'運転見合わせ':operationInfoDelayText(x.delay);return `<div class="operation-info-card ${x.status==='suspend'?'suspend':'delay'}"><button type="button" class="operation-info-card-main" onclick="showOperationInfoDetail('${esc(x.id)}')"><div class="operation-info-card-title">${esc(x.start)} ⇄ ${esc(x.end)}</div><div class="operation-info-card-meta">${esc(txt)}</div><div class="operation-info-card-reason">${esc(x.reason||OPERATION_INFO_REASONS[0])}</div></button><button class="operation-info-card-delete" type="button" onclick="deleteOperationInfo('${esc(x.id)}')">削除</button></div>`;}).join('');}
function renderOperationInfoZones(){
  const layer=document.getElementById('operationInfoLayer'); if(!layer)return; layer.innerHTML='';
  const labels=document.getElementById('operationInfoLabelLayer'); if(labels)labels.innerHTML='';
  const rows=[...document.querySelectorAll('.station-row')]; if(rows.length<2||!operationInfoEntries.length)return;
  const rowMap=new Map(rows.map((r,i)=>[operationInfoNormalizeName(r.querySelector('.station-name-ja')?.textContent||''),{row:r,index:i}]));
  const fixedZoneWidth=700;
  for(const e of operationInfoEntries.map(normalizeOperationEntry).filter(Boolean)){
    const a=rowMap.get(e.start), b=rowMap.get(e.end); if(!a||!b||a.index===b.index)continue;
    const lo=Math.min(a.index,b.index), hi=Math.max(a.index,b.index); const topRow=rows[lo], bottomRow=rows[hi]; if(!topRow||!bottomRow)continue;
    const top=topRow.offsetTop, bottom=bottomRow.offsetTop+bottomRow.offsetHeight; if(bottom<=top)continue;
    const zone=document.createElement('div'); zone.className=`operation-info-zone ${e.status==='suspend'?'suspend':''}`; zone.style.top=`${top}px`;zone.style.height=`${bottom-top}px`;zone.style.width=`${fixedZoneWidth}px`;zone.style.left=`calc(50% - ${fixedZoneWidth/2}px)`;layer.appendChild(zone);
    if(labels){const label=document.createElement('button');label.type='button';label.className=`operation-info-zone-label ${e.status==='suspend'?'suspend':'delay'}`;label.textContent=e.status==='suspend'?'運転見合わせ':operationInfoDelayText(e.delay);label.style.top=`${top+30}px`;label.style.left=`calc(50% + ${fixedZoneWidth/2-100}px)`;label.style.transform='translateX(-100%)';label.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();showOperationInfoDetail(e.id);});labels.appendChild(label);}
  }
}
window.addEventListener('resize',renderOperationInfoZones);
