function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function formationById(id){
if(!id||id===INITIAL_FORMATION_SELECTION.id)return null;
for(const g of FORMATIONS){
if(g.type===id)return {id:g.type,name:g.type,img:g.typeImg,kind:'type',type:g.type};
for(const v of g.variants||[]){
if(v.id===String(id))return {...v,kind:'variant',type:g.type};
const f=(v.items||[]).find(x=>x.id===String(id));
if(f)return {...f,type:g.type,variantId:v.id,variantName:v.name};
}
const f=(g.items||[]).find(x=>x.id===String(id));
if(f)return {...f,type:g.type};
}
return null;
}
function formationCarsById(id){
if(String(id)==='500系+500系') return 6;
const f=formationById(id);
if(!f)return null;
if(Number.isFinite(Number(f.cars)))return Number(f.cars);
if(f.kind==='variant') {
const cars=(f.items||[]).map(x=>Number(x.cars)).filter(Number.isFinite);
const uniq=[...new Set(cars)];
return uniq.length===1?uniq[0]:null;
}
return null;
}
function isAllowedCompositePair(carsA,carsB){
const a=Number(carsA), b=Number(carsB);
if(!Number.isFinite(a) || !Number.isFinite(b)) return true;
return (a===6&&b===2)||(a===2&&b===6)||(a===4&&b===4)||(a===4&&b===2)||(a===2&&b===4);
}
function allowedRearCarsForFront(cars){
const c=Number(cars);
if(c===8) return new Set();
if(c===6) return new Set([2]);
if(c===4) return new Set([4,2]);
if(c===2) return new Set([6,4]);
return null; // 前寄りの両数未指定：後ろ寄りは両数で絞らない
}
function formationHasPossibleCompositePartner(cars){
const c=Number(cars);
return c===2||c===4||c===6;
}
function isAllowedSingleFormation(cars){
const c=Number(cars);
return c===8||c===6;
}
function selectionDisplayObject(id){
const known=formationById(id);
if(known)return known;
const raw=String(id??'').trim();
if(raw && /^[A-Z]?\d{4,6}F$/i.test(raw)) return {id:raw,name:raw.toUpperCase(),img:INITIAL_FORMATION_SELECTION.img,kind:'manual',type:'manual'};
return INITIAL_FORMATION_SELECTION;
}
function allowedFormationGroupsForTrain(t){
if(!t)return FORMATIONS;
return FORMATIONS.filter(g=>formationCategoryAllowedForTrain(t,g.type));
}
function allowedFormationEntriesForTrain(t){
const groups=allowedFormationGroupsForTrain(t);
const entries=[];
for(const g of groups){
entries.push({id:g.type,name:g.type,img:g.typeImg,kind:'type',type:g.type,group:g});
for(const v of g.variants||[]){
entries.push({...v,kind:'variant',type:g.type,group:g,variantId:v.id});
for(const f of v.items||[]) entries.push({...f,type:g.type,group:g,variantId:v.id,variantName:v.name});
}
for(const f of g.items||[]) entries.push({...f,type:g.type,group:g});
}
return entries;
}
function formationIdFromInput(value, trainOverride=null){
let raw=String(value??'').trim().toUpperCase().replace(/[Ｆ]/g,'F');
if(!raw)return {ok:false,error:'形式・車両番号または編成番号を入力してください。'};
const train=trainOverride||liveTrain(currentTrainNo,currentTrainSnapshot?.direction,currentSelectedService())||currentTrainSnapshot||null;
const allowed=allowedFormationEntriesForTrain(train);
if(!allowed.length)return {ok:false,error:'この列車では入力可能な編成がありません。'};

const parts=raw.split(/[|:：\s]+/).map(x=>x.trim()).filter(Boolean);
let specifiedType='';
if(parts.length>=2){
specifiedType=parts[0];

tokkyu: `${TRAIN_DATA_BASE}tokkyu.json`,
chijou: `${TRAIN_DATA_BASE}tschijo.json`,
hanzomon: `${TRAIN_DATA_BASE}hanzomon.json`,
hibiya: `${TRAIN_DATA_BASE}hibiya.json`
};

async function loadTrainData(){
const entries = Object.entries(TRAIN_DATA_FILES);
const loaded = await Promise.all(entries.map(async ([service,file])=>{
try{
const res = await fetch(file, {cache:'no-store'});
if(!res.ok) throw new Error(`${file} の読み込みに失敗しました (${res.status})`);
const json = await res.json();
if(!Array.isArray(json)) throw new Error(`${file} の形式が配列ではありません。`);
const normalized = json.map(t=>({
...t,
service,
operationNo: t?.operationNo || t?.no || '',
trainNumbers: t?.trainNumbers || t?.trainNoByRoute || null,
dest: stationNameKey(t?.dest),
stops: Array.isArray(t?.stops) ? t.stops
.filter(x=>stationNameKey(x?.station)!=='着番線')
.map(x=>{const arrival=x?.arrival||null,departure=x?.departure||null;return {...x,station:stationNameKey(x?.station),arrival,departure,time:departure||x?.time||arrival||null};}) : []
}));
const merged=new Map();
for(const t of normalized){
if(!t?.no) continue;
const rawDays=Array.isArray(t.days)&&t.days.length?t.days:['平日'];
for(const day of rawDays){
if(day!=='平日'&&day!=='休日') continue;
const identity=service==='hanzomon' ? String(t.operationNo||t.no||'') : String(t.no);
const k=`${service}|${identity}|${String(t.direction||'').toLowerCase()}|${day}`;
const item={...t,days:[day]};
const prev=merged.get(k);
if(!prev){
merged.set(k,item);
continue;
}
if((item.stops||[]).length>(prev.stops||[]).length) prev.stops=item.stops;
if(!prev.dest&&item.dest)prev.dest=item.dest;
if(!prev.type&&item.type)prev.type=item.type;
if(!prev.typeByRoute&&item.typeByRoute)prev.typeByRoute=item.typeByRoute;
else if(item.typeByRoute){ prev.typeByRoute={...(prev.typeByRoute||{}),...item.typeByRoute}; }
if(!prev.limitedName&&item.limitedName)prev.limitedName=item.limitedName;
if(item.hasTHLinerOperation===true)prev.hasTHLinerOperation=true;
if(item.splitLiberty===true)prev.splitLiberty=true;
}
}
return [service,[...merged.values()]];
}catch(err){
console.warn(`${service} の時刻表JSON読み込みに失敗しました`,err);
return [service,[]];
}
}));
TRAINS = loaded.flatMap(([,list])=>list);
if(!TRAINS.length) throw new Error('時刻表データが0件です。');
}

function currentMinutes(){
if(followNow){
const d=new Date();
const base=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
return d.getHours()<RESET_HOUR?base+1440:base;
}

const hh=Number.isFinite(h)?h:0, mm=Number.isFinite(m)?m:0;
const base=hh*60+mm+0.5;
return hh<RESET_HOUR?base+1440:base;
}
function isStartDwellMinute(minutes,departureRaw){
const m=Number(minutes),d=Number(departureRaw);
if(!Number.isFinite(m)||!Number.isFinite(d)) return false;
let mm=m;
while(mm<d-RESET_DWELL_MIN) mm+=1440;
while(mm>=d+1440) mm-=1440;
const start=d-RESET_DWELL_MIN+0.5;
return mm>=start && mm<d+0.75;
}
function isEndDwellMinute(minutes,arrivalRaw){
const m=Number(minutes),d=Number(arrivalRaw);
if(!Number.isFinite(m)||!Number.isFinite(d)) return false;
let mm=m;
while(mm<d-1440) mm+=1440;
while(mm>=d+1440) mm-=1440;
return mm>=d+0.25 && mm<=d+RESET_DWELL_MIN+0.5;
}

function trainRunsAtMinute(t,minutes){
const stops=Array.isArray(t?.stops)?t.stops.filter(x=>String(x?.station||'')!=='着番線'):[];
if(stops.length<2) return false;
const first=serviceDayMinuteFromTime(stops[0]?.time);
let last=serviceDayMinuteFromTime(stops[stops.length-1]?.time);
if(!Number.isFinite(first)||!Number.isFinite(last)) return false;
if(last<first) last+=1440;
let m=Number(minutes);
if(!Number.isFinite(m)) return false;
while(m<first) m+=1440;
return m>=first+0.75 && m<=last+0.25;
}

}
function trainStateKey(no,service){

function liveTrain(no,direction=null,service=null){

const candidates=TRAINS.filter(t=>String(t?.no)===key && (!scopedService || String(t?.service||'')===scopedService) && (!Array.isArray(t?.days) || !t.days.length || t.days.includes(currentDay||'平日')));

},err=>{
console.error(info.label+' Firebase監視失敗',err);

function formationLinkedTrainNos(day,trainNo,service=null){
const start=normalizeChainTrainNo(trainNo);
const svc=String(service||'chijou');
const result=new Set();
const queue=[start];
if(svc!=='chijou') return start?[start]:[];
const chains=OPERATION_CHAINS[day]||[];
while(queue.length){
const no=queue.shift();
if(!no||result.has(no)) continue;
result.add(no);
for(const chain of chains){
if(!chain.some(e=>normalizeChainTrainNo(e?.no)===no)) continue;
for(const e of chain){
const n=normalizeChainTrainNo(e?.no);
if(n&&!result.has(n)) queue.push(n);
}
}
}
return result;
}

async function recordSelection(train,formId){
if(!selectedIsCurrentOperation())return [];
const day=currentDay;
const value=formId&&formId!==INITIAL_FORMATION_SELECTION.id?String(formId):null;
registrationState[day]=registrationState[day]||{};
formationUpdatedAt[day]=formationUpdatedAt[day]||{};

const service=trainGroupKey(train);
const changes={};
const projectUpdates={};
const stamp=new Date().toISOString();

if(service!=='chijou'){
const actual=String(train.no);
const stateKey=trainStateKey(actual,service);
if(value){
registrationState[day][stateKey]=value;
formationUpdatedAt[day][stateKey]=stamp;
}else{
delete registrationState[day][stateKey];
delete formationUpdatedAt[day][stateKey];
}
changes[stateKey]=value;
projectUpdates[service]={[actual]:value};
}else{
const linked=formationLinkedTrainNos(day,train.no,service);
for(const requested of linked){
const actualBase=(TRAINS||[]).find(t=>
normalizeChainTrainNo(t?.no)===requested && trainGroupKey(t)===service &&
(!Array.isArray(t?.days)||!t.days.length||t.days.includes(day))
);
if(!actualBase) continue;
const actual=String(actualBase.no);
const stateKey=trainStateKey(actual,service);
if(value){
registrationState[day][stateKey]=value;
formationUpdatedAt[day][stateKey]=stamp;
}else{
delete registrationState[day][stateKey];
delete formationUpdatedAt[day][stateKey];
}
changes[stateKey]=value;
projectUpdates[service]=projectUpdates[service]||{};
projectUpdates[service][actual]=value;
}
}

saveLocal();
renderTrainPositions();
updateSheetContent();

if(firebaseReady){
try{
for(const [group,updates] of Object.entries(projectUpdates)){
const db=firebaseDbs[group];
if(!db) continue;
await db.ref('運用').child('stateByDay').child(day).update(updates);
const tsUpdates={};
Object.keys(updates).forEach(no=>{
const stateKey=trainStateKey(no,group);
tsUpdates[no]=updates[no]?formationUpdatedAt[day][stateKey]:null;
});
await db.ref('運用').child('formationUpdatedAtByDay').child(day).update(tsUpdates);
}
}catch(e){
console.error('編成連結同期失敗',e);
}
}else{
}
return Object.keys(changes);
}

function operationInfoFindPath(start,end){

const ar=getRows(a,routeA),br=getRows(b,routeB);

let best=null;
for(const x of ar)for(const y of br){
if(x.index===y.index)continue;
const lo=Math.min(x.index,y.index),hi=Math.max(x.index,y.index);
const dist=hi-lo;

rawSegments.push({
lo:best.lo,hi:best.hi,rowA:best.a,rowB:best.b,

function renderOperationInfoZones(){
const layer=document.getElementById('operationInfoLayer');
if(!layer)return;
layer.innerHTML='';

if(labelLayer)labelLayer.innerHTML='';
const {rows,segments}=operationInfoVisibleSegments();
if(rows.length<2||!segments.length)return;

const fixedZoneWidth=700;
const pieces=[];
const boundaryNames=new Set(['東武動物公園','北千住','押上','渋谷']);

for(const seg of segments){
const lo=Math.min(seg.rowA.index,seg.rowB.index),hi=Math.max(seg.rowA.index,seg.rowB.index);
if(seg.routeA===seg.routeB){
let runStart=lo;
for(let i=lo+1;i<=hi;i++){
const route=rows[i]?.dataset?.routeKey||'';
if(route!==seg.routeA){
if(i-1>=runStart)pieces.push({...seg,lo:runStart,hi:i-1});
runStart=i+1;
}
}
if(runStart<=hi)pieces.push({...seg,lo:runStart,hi});
}else{
pieces.push({...seg,lo,hi});
}
}

const groups=[];
const orderedPieces=[...pieces]
.filter(p=>p.lo!==p.hi)
.sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
for(const p of orderedPieces){
const last=groups[groups.length-1];
if(last && last.status===p.status && p.lo<=last.hi+1){
last.lo=Math.min(last.lo,p.lo);
last.hi=Math.max(last.hi,p.hi);
last.delay=(last.delay==='unknown'?p.delay:(p.delay==='unknown'?last.delay:Math.max(Number(last.delay),Number(p.delay))));
last.entryIds.add(p.entryId);
last.stationStart=rows[last.lo]?.querySelector('.station-name-ja')?.textContent||last.stationStart;

if(last.routeB!==p.routeB) last.routeB=p.routeB;

groups.push({
lo:p.lo,hi:p.hi,status:p.status,delay:p.delay,
routeA:p.routeA,routeB:p.routeB,

if(!topRow||!bottomRow)continue;

const boundaryStationNames=new Set(['東武動物公園','北千住','押上','渋谷']);

}

let top=topRow.offsetTop;
let bottom=bottomRow.offsetTop+bottomRow.offsetHeight;

const prev=groups[gi-1],next=groups[gi+1];

if(prev && prev.status!==g.status){
if(prev.hi===g.lo){
const boundaryRow=rows[g.lo];
if(boundaryRow){
const badge=boundaryRow.querySelector('.station-badge');
const layerRect=layer.getBoundingClientRect();
if(badge){
const badgeRect=badge.getBoundingClientRect();
const center=badgeRect.top-layerRect.top+badgeRect.height/2;
top=center+10;
}else{
const rowRect=boundaryRow.getBoundingClientRect();
const center=rowRect.top-layerRect.top+rowRect.height/2;
top=center+10;
}
}
}else if(prev.hi+1===g.lo){
const upperRow=rows[prev.hi];
const lowerRow=rows[g.lo];
if(upperRow && lowerRow){
const boundary=Math.max(
upperRow.offsetTop+upperRow.offsetHeight,
lowerRow.offsetTop
);
top=boundary+10;
}
}
}

if(next && next.status!==g.status){
if(next.lo===g.hi){
const boundaryRow=rows[g.hi];
if(boundaryRow){
const badge=boundaryRow.querySelector('.station-badge');
const layerRect=layer.getBoundingClientRect();
if(badge){
const badgeRect=badge.getBoundingClientRect();
const center=badgeRect.top-layerRect.top+badgeRect.height/2;
bottom=center-10;
}else{
const rowRect=boundaryRow.getBoundingClientRect();
const center=rowRect.top-layerRect.top+rowRect.height/2;
bottom=center-10;
}
}
}else if(next.lo===g.hi+1){
const upperRow=rows[g.hi];
const lowerRow=rows[next.lo];
if(upperRow && lowerRow){
const boundary=Math.min(
upperRow.offsetTop+upperRow.offsetHeight,
lowerRow.offsetTop

bottom=boundary-10;
}
}
}

if(bottom<=top)continue;

const zone=document.createElement('div');
zone.className=`operation-info-zone ${g.status==='suspend'?'suspend':''}`;

zone.style.left=`calc(50% - ${fixedZoneWidth/2}px)`;

const label=document.createElement('button');

}
}
}

}

function trainFromChainEntry(entry, preferredService=''){

const wanted=normalizeChainTrainNo(entry.no);
const si=MAIN_NAMES.findIndex(x=>stationNameKey(x)===stationNameKey(entry.start));
const di=MAIN_NAMES.findIndex(x=>stationNameKey(x)===stationNameKey(entry.dest));

(!Array.isArray(t?.days) || !t.days.length || t.days.includes(currentDay||'平日')));

}
function connectionNextSky(t){

const next=info.chain[info.entryIndex+1];

const end=serviceDayMinuteFromTime(t?.stops?.filter(s=>String(s?.station||'')!=='着番線').at(-1)?.time);
const start=serviceDayMinuteFromTime(next.startTime);
if(!Number.isFinite(end)||!Number.isFinite(start)||start<end) return null;

}
function startDwellPositionSky(t,minutes){
const stops=Array.isArray(t?.stops)?t.stops.filter(s=>String(s?.station||'')!=='着番線'):[];
if(!stops.length) return null;
const departureRaw=serviceDayMinuteFromTime(stops[0]?.time);
if(!Number.isFinite(departureRaw) || !isStartDwellMinute(minutes,departureRaw)) return null;
const station=String(stops[0]?.station||'');

stationA:station,
stationB:station,

visualTrain:t,

function operationChainPosition(t,minutes){

const base=trainPosition(t,minutes);
const info=chainEntryForTrain(currentDay,t?.no);
if(!info?.chain) return base;
const chain=info.chain;
const idx=info.entryIndex;
const entry=chain[idx];
if(!entry) return base;

const stops=Array.isArray(t?.stops)?t.stops.filter(s=>String(s?.station||'')!=='着番線'):[];
const first=serviceDayMinuteFromTime(stops[0]?.time);
const last=serviceDayMinuteFromTime(stops.at(-1)?.time);
if(!Number.isFinite(first)||!Number.isFinite(last)) return base;
const firstDeparture=first+0.75;

const isChainFirst=idx===0;
const isChainLast=idx===chain.length-1;
const next=connectionNextSky(t);
const nextStartRaw=next?serviceDayMinuteFromTime(next.startTime):null;
const arrivalTime=last+0.25;
const nextStart=Number.isFinite(nextStartRaw)?nextStartRaw+0.75:null;

if(next && !isChainLast && Number.isFinite(nextStart)){
const lastStation=String(entry.dest);
const ai=visualStationRowIndexForTrain(t,lastStation);
if(ai>=0 && minutes>arrivalTime && minutes<nextStart){
if(minutes<arrivalTime+TURNBACK_SWITCH_MIN){
return {
pos:ai,
stationA:lastStation,
stationB:lastStation,
side:t.direction==='down'?'left':'right',
visualTrain:t,
mode:'turn-arrival',
terminal:true,
terminalTime:arrivalTime,
terminalStation:lastStation,

terminalArrivalOrder:last
};
}

const nextTrain=trainFromChainEntry(next, t?.service || '');
const nextDirection=String(nextTrain?.direction||'').toLowerCase() ||
(stationIndex(next.start)>stationIndex(next.dest)?'up':'down');
const nextSide=nextDirection==='down'?'left':'right';
return {
pos:ai,
stationA:lastStation,
stationB:lastStation,
side:nextSide,
visualTrain:nextTrain||t,
mode:'turn-wait',
terminal:true,
terminalTime:nextStart,
terminalStation:lastStation,
terminalEntryIndex:idx
};
}
}

if(isChainLast && isEndDwellMinute(minutes,last)){
const ai=visualStationRowIndexForTrain(t,entry.dest);
if(ai>=0){
return {
pos:ai,
stationA:entry.dest,
stationB:entry.dest,
side:t.direction==='down'?'right':'left',
visualTrain:t,
mode:'end',
terminal:true,
terminalTime:arrivalTime,
terminalStation:entry.dest,
terminalEntryIndex:idx,
terminalArrivalOrder:last
};
}
}

return base;
}

function trainTimeAtMainStation(t,stationName){
const stops=Array.isArray(t?.stops)?t.stops:[];
const target=stationNameKey(stationName);
if(!stops.length||!target)return null;

for(const s of stops){
if(stationNameKey(s?.station)===target && s?.time) return serviceDayMinuteFromTime(s.time);
}

const targetIndex=MAIN_NAMES.findIndex(x=>stationNameKey(x)===target);
if(targetIndex<0)return null;
for(let i=0;i<stops.length-1;i++){
const a=stops[i],b=stops[i+1];
const ai=MAIN_NAMES.indexOf(String(a?.station||''));
const bi=MAIN_NAMES.indexOf(String(b?.station||''));
if(ai<0||bi<0)continue;
const lo=Math.min(ai,bi),hi=Math.max(ai,bi);
if(targetIndex<lo||targetIndex>hi||ai===bi)continue;
let t0=serviceDayMinuteFromTime(a.time),t1=serviceDayMinuteFromTime(b.time);
if(t1<t0)t1+=1440;
const q=(targetIndex-ai)/(bi-ai);
return t0+(t1-t0)*q;
}
return null;
}

function branchHiddenWindow(t){
if(!activeBranches || !(activeBranches instanceof Set) || !activeBranches.size) return null;
if(String(t?.service||'')==='tokkyu') return null;

const candidates=[];
if(activeBranches.has('nikko')) candidates.push(['姫宮','東武動物公園']);

for(const [from,to] of candidates){
const start=trainTimeAtMainStation(t,from);
const end=trainTimeAtMainStation(t,to);
if(!Number.isFinite(start)||!Number.isFinite(end))continue;
let endAbs=end;
if(endAbs<start)endAbs+=1440;
return {start,end:endAbs,from,to};
}
return null;
}

function branchHiddenAtTime(t,minutes){
const w=branchHiddenWindow(t);
if(!w)return false;
let m=Number(minutes);
if(m<w.start)m+=1440;
return m>=w.start && m<w.end;
}

}

for(let i=0;i<stops.length;i++){
const s=stops[i];
const rawStop=serviceDayMinuteFromTime(s.time);
if(!Number.isFinite(rawStop) || s?.timingOnly===true) continue;
let sm=rawStop;
if(m<sm) sm+=1440;

const ai=visualStationRowIndexForTrain(t,station);

return {
pos:ai,

stationB:station,

stationDwell:true,

return null;
}
const q=(t1-t0)?(mm-t0)/(t1-t0):0;
const clampedQ=Math.max(0,Math.min(1,q));
const visualGap=pair.r1-pair.r0;
let visualPos;
const mainlineService = (t.service==='chijou');
if(mainlineService){
const lo=Math.min(pair.r0,pair.r1), hi=Math.max(pair.r0,pair.r1);

for(let ri=lo+1;ri<hi;ri++){

}
if(branchRows.length){
const firstBranch=branchRows[0];
const lastBranch=branchRows[branchRows.length-1];
let safeStart,safeEnd;
if(pair.r0<pair.r1){
safeStart=pair.r0+(firstBranch-pair.r0)/2;
safeEnd=lastBranch+(pair.r1-lastBranch)/2;
}else{
safeStart=pair.r0-(pair.r0-lastBranch)/2;

const firstLeg=Math.abs(safeStart-pair.r0);
const secondLeg=Math.abs(pair.r1-safeEnd);
const totalLeg=firstLeg+secondLeg;
const split=totalLeg>0?firstLeg/totalLeg:0.5;

visualPos=safeEnd+(pair.r1-safeEnd)*q;
}
}else{

}
}else{
visualPos=pair.r0+(pair.r1-pair.r0)*clampedQ;
}

const d=Math.abs(ri-visualPos);

}
if(service==='hanzomon'){
if(pair==='とうきょうスカイツリー|曳舟') return ['main','main'];
if(pair==='押上|曳舟' || pair==='曳舟|押上') return ['main','hanzomon'];
if(pair==='押上|錦糸町') return ['hanzomon','hanzomon'];
if(a==='錦糸町'||b==='錦糸町'||(HANZOMON_NAMES.includes(a)&&HANZOMON_NAMES.includes(b))) return ['hanzomon','hanzomon'];
if(pair==='渋谷|池尻大橋') return ['hanzomon','denentoshi'];
if(DENENTOSHI_NAMES.includes(a)&&DENENTOSHI_NAMES.includes(b)) return ['denentoshi','denentoshi'];
}
if(service==='nikko'){
if(NIKKO_NAMES.includes(a)&&NIKKO_NAMES.includes(b)) return ['nikko','nikko'];
if(pair==='東武動物公園|杉戸高野台') return ['nikko','main'];
}
return null;
}
function findVisualRowPair(aName,bName,t=null){
const rows=[...document.querySelectorAll('.station-row')];
if(!segmentServiceAllowed(t,aName,bName)) return null;
const forced=visualRouteKeysForSegment(t,aName,bName);
const mainOnly=(t?.service==='chijou');
const routeA=mainOnly?'main':(forced?forced[0]:routeKeyForTrainStation(t,aName));
const routeB=mainOnly?'main':(forced?forced[1]:routeKeyForTrainStation(t,bName));
const A=[],B=[];
const keyA=stationNameKey(aName),keyB=stationNameKey(bName);
rows.forEach((r,i)=>{
const n=stationNameKey(r.querySelector('.station-name-ja')?.textContent||'');
const rk=r.dataset.routeKey||'main';
if(n===keyA && (!routeA || rk===routeA)) A.push(i);
if(n===keyB && (!routeB || rk===routeB)) B.push(i);
});
if(!A.length||!B.length)return null;
let best=null,bestGap=Infinity;
for(const a of A)for(const b of B){
const gap=Math.abs(b-a);
if(gap<bestGap){bestGap=gap;best={r0:a,r1:b};}
}
return best;
}
function segmentTouchesMainRange(t){
const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住');
const lo=Math.min(k,n),hi=Math.max(k,n);
return (t.stops||[]).some(s=>{const x=MAIN_NAMES.indexOf(s.station);return x>=lo&&x<=hi;});
}
function trainServiceRank(t){
const type=String(t?.type||'');
if(type==='特急')return 4;
if(type==='THライナー')return 4;
if(type==='急行')return 3;
if(type==='区間急行')return 2;
return 1;
}
function isPassingOvertake(t,p,minutes){
if(t.type==='THライナー'||t.service==='hibiya'||t.service==='hanzomon')return false;
if(!['特急','急行','区間急行'].includes(String(t.type||'')))return false;
const myRank=trainServiceRank(t);
const myPos=p?.pos;
if(!Number.isFinite(myPos))return false;
const myDir=String(t.direction||'');
const myStart=myPos;
for(const otherBase of TRAINS){
if(otherBase===t)continue;
if(String(otherBase.direction||'')!==myDir)continue;
if(trainServiceRank(otherBase)>=myRank)continue;
if(!['普通','区間急行'].includes(String(otherBase.type||'')))continue;
const other=liveTrain(otherBase.no,otherBase.direction,otherBase.service)||otherBase;
const op=trainPosition(other,minutes);
if(!op)continue;
if(!(op.stationA===p.stationA||op.stationA===p.stationB||op.stationB===p.stationA||op.stationB===p.stationB))continue;
const gap=Math.abs(op.pos-myStart);
if(gap<=1.25)return true;
}
return false;
}
function laneForStationDwell(t,p,minutes){
const stops=Array.isArray(t?.stops)?t.stops:[];
const station=stationNameKey(p?.stationA||p?.stationB||'');
let idx=-1;
for(let i=stops.length-1;i>=0;i--){
if(stationNameKey(stops[i]?.station||'')===station){idx=i;break;}
}
if(idx<0) return 0;
if(idx<stops.length-1){
const next=stops[idx+1];
if(next?.station){
const probe={stationA:stops[idx].station,stationB:next.station};
return laneForTrain(t,probe,minutes);
}
}
if(idx>0){
const prev=stops[idx-1];
if(prev?.station){
const probe={stationA:prev.station,stationB:stops[idx].station};
return laneForTrain(t,probe,minutes);
}
}
return 0;
}
function laneForTrain(t,p,minutes){
const a=MAIN_NAMES.indexOf(p.stationA),b=MAIN_NAMES.indexOf(p.stationB);
const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住'),x=MAIN_NAMES.indexOf('西新井');
const lo=Math.min(k,n),hi=Math.max(k,n);
const touches=a>=0&&b>=0&&Math.min(a,b)<=hi&&Math.max(a,b)>=lo;
if(!touches)return 0;
if(t.service==='hibiya')return 0;
if(t.type==='THライナー'){
const ns=Math.max(x,n),ss=Math.min(x,n);
const mid=(a+b)/2;
return mid>=ss&&mid<=ns?0:1;
}
if(isPassingOvertake(t,p,minutes))return 2;
return 1;
}
function trainLabelClass(t){
const x=String(t?.type||'');
if(x==='各停'||x==='各駅停車') return 'hanzomon-local';
return getExpressClass(t)+(x==='THライナー'?' th-liner':'');
}
function trainAllowedOnRouteStation(t,routeKey,stationName){
const stops=Array.isArray(t?.stops)?t.stops:[];
if(!stops.some(s=>stationNamesEqual(s?.station,stationName))) return false;
const service=String(t?.service||'');
if(routeKey==='denentoshi') return service==='hanzomon';
if(routeKey==='hanzomon') return service==='hanzomon';
if(routeKey==='hibiya') return service==='hibiya';
if(routeKey==='nikko') return trainUsesNikkoBranch(t);
return true;
}
function serviceTopologyValid(t){
const service=String(t?.service||'');
const stops=(t?.stops||[]).map(s=>stationNameKey(s?.station));
const hasHanzomon=stops.some(n=>HANZOMON_NAMES.includes(n) && n!=='押上');
const hasDenentoshi=stops.some(n=>DENENTOSHI_NAMES.includes(n) && n!=='渋谷');
const hasHibiya=stops.some(n=>HIBIYA_NAMES.includes(n) && n!=='北千住');
const hasNikko=stops.some(n=>NIKKO_NAMES.includes(n) && n!=='東武動物公園');
if((hasHanzomon||hasDenentoshi) && service!=='hanzomon') return false;
if(hasHibiya && service!=='hibiya') return false;
if(hasNikko && !(service==='nikko' || service==='tokkyu')) return false;
if(service==='hanzomon' || service==='hibiya') return true;
if(service==='nikko' && !hasNikko) return false;
return true;
}
function trainAllowedOnVisibleBranch(t,stationName){
const stops=Array.isArray(t?.stops)?t.stops:[];
const hasStation=stops.some(s=>stationNamesEqual(s?.station,stationName));
if(!hasStation) return false;
if(DENENTOSHI_NAMES.some(x=>stationNamesEqual(x,stationName)) || HANZOMON_NAMES.some(x=>stationNamesEqual(x,stationName))) return t.service==='hanzomon';
if(HIBIYA_NAMES.some(x=>stationNamesEqual(x,stationName)) && stationNameKey(stationName)!=='北千住') return t.service==='hibiya';
if(NIKKO_NAMES.some(x=>stationNamesEqual(x,stationName)) && stationNameKey(stationName)!=='東武動物公園') return trainUsesNikkoBranch(t);
return true;
}
function currentRowIndexForStation(name){const rows=[...document.querySelectorAll('.station-row')];return rows.findIndex(r=>r.querySelector('.station-name-ja')?.textContent===name);}

function visualStationRowIndexForTrain(t,name){
const key=stationNameKey(name);
const routeKey=routeKeyForTrainStation(t,name);
const rows=[...document.querySelectorAll('.station-row')];

const exact=rows.findIndex(r=>
stationNameKey(r.querySelector('.station-name-ja')?.textContent||'')===key &&
(r.dataset.routeKey||'main')===routeKey
);
if(exact>=0)return exact;

if(t?.service==='chijou' || t?.service==='tokkyu') return -1;

return rows.findIndex(r=>
stationNameKey(r.querySelector('.station-name-ja')?.textContent||'')===key
);
}

function renderTrainPositions(){
const layer=document.getElementById('movingTrainLayer');if(!layer)return;layer.innerHTML='';
const rows=[...document.querySelectorAll('.station-row')];if(!rows.length)return;
const minutes=currentMinutes();
const visible=[];
const seen=new Set();

const suppressedTurnbackKeys=new Set();
for(const base of TRAINS){
if(!base || !Array.isArray(base.days) || !base.days.includes(currentDay)) continue;
const next=connectionNextSky(base);
if(!next) continue;
const stops=Array.isArray(base.stops)?base.stops.filter(x=>String(x?.station||'')!=='着番線'):[];
const last=serviceDayMinuteFromTime(stops.at(-1)?.time);
const nextStart=serviceDayMinuteFromTime(next.startTime);
const arrivalTime=Number.isFinite(last)?last+0.25:NaN;
const departureTime=Number.isFinite(nextStart)?nextStart+0.75:NaN;
if(Number.isFinite(arrivalTime) && Number.isFinite(departureTime) && minutes>=arrivalTime+TURNBACK_SWITCH_MIN && minutes<departureTime){
const nt=trainFromChainEntry(next, base?.service || '');
if(nt){
suppressedTurnbackKeys.add(`${String(nt.no||'')}|${String(nt.direction||'')}`);
}
}
}

for(const base of TRAINS){
if(!base || !Array.isArray(base.days) || !base.days.includes(currentDay)) continue;
const no=String(base.no||'');
const signature=`${String(base.service||'')}|${no}|${String(base.direction||'')}`;
if(!no || seen.has(signature)) continue;
seen.add(signature);
visible.push(liveTrain(no,base.direction,base.service)||base);
}
const occupied={left:[],right:[]};
for(const t of visible){
if(!serviceTopologyValid(t)) continue;
const p=operationChainPosition(t,minutes);if(!p||(!p.stationA&&!p.stationB))continue;

const libertyShared=libertySharedAtNames(t,p.stationA,p.stationB,p.terminalStation||p.stationA||'');
const libertyPair=libertyShared?pairedTrainFor(t):null;
if(libertyShared && libertyPair && Number(String(t.no).replace(/\D/g,''))>Number(String(libertyPair.no).replace(/\D/g,''))) continue;
const libertyDisplay=libertyDisplayTrainAt(t,p.stationA,p.stationB,p.terminalStation||p.stationA||'');

let pair=null,pairRows=[];
if(!p.terminal){
if(!segmentServiceAllowed(t,p.stationA,p.stationB))continue;
pair=findVisualRowPair(p.stationA,p.stationB,t);
if(!pair)continue;
pairRows=[rows[pair.r0],rows[pair.r1]];
if(pairRows.some(r=>r?.dataset?.routeKey && r.dataset.routeKey!=='main')){
const allowed=pairRows.every(r=>trainAllowedOnRouteStation(t,r.dataset.routeKey,pairRows[0]===r?p.stationA:p.stationB));
if(!allowed) continue;
}
if(t.service==='chijou' && pairRows.some(r=>(r?.dataset?.routeKey||'main')!=='main')) continue;
if(t.service==='chijou' &&
(!MAIN_NAMES.some(x=>stationNamesEqual(x,p.stationA)) || !MAIN_NAMES.some(x=>stationNamesEqual(x,p.stationB)))) continue;
if(!trainAllowedOnVisibleBranch(t,p.stationA)||!trainAllowedOnVisibleBranch(t,p.stationB))continue;
}else{
const terminalName=p.terminalStation||p.stationA||p.stationB;
const terminalIndex=visualStationRowIndexForTrain(t,terminalName);
if(terminalIndex<0)continue;
p.pos=terminalIndex;
}
const laneBase=p.terminal?laneForStationDwell(t,p,minutes):laneForTrain(t,p,minutes);
const ai=MAIN_NAMES.indexOf(p.stationA), bi=MAIN_NAMES.indexOf(p.stationB);
let side=p.side||null;
if(!side){
if(ai>=0 && bi>=0 && ai!==bi){
side=bi<ai ? 'left' : 'right';
}else{
const dir=String(t.direction||'').toLowerCase();
side=dir==='down' ? 'left' : dir==='up' ? 'right' : null;
}
}
if(!side) continue;
const displayTrain=p.visualTrain||libertyDisplay||t;
occupied[side].push({
t:displayTrain,
pos:p.pos,
stationA:p.stationA||'',
stationB:p.stationB||'',
baseLane:laneBase,
mode:p.mode||'',
terminalStation:p.terminalStation||'',
terminalArrivalOrder:Number.isFinite(p.terminalArrivalOrder)?p.terminalArrivalOrder:Infinity,
terminalSwitch:!!p.terminalSwitch
});
}
const layerRect=layer.getBoundingClientRect(),layoutWidth=window.innerWidth<960?1920:layerRect.width||1920;
const centerX=layoutWidth/2,trainWidth=66,laneGap=20;
const rowRectAt=pos=>{const p=Math.max(0,Math.min(rows.length-1,pos)),i0=Math.floor(p),i1=Math.min(rows.length-1,Math.ceil(p));const r0=rows[i0].getBoundingClientRect(),r1=rows[i1].getBoundingClientRect(),f=p-i0;return {centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f};};
['left','right'].forEach(side=>{
occupied[side].sort((a,b)=>{
const dp=a.pos-b.pos;
if(Math.abs(dp)>0.24) return dp;
const at=String(a.terminalStation||'');
const bt=String(b.terminalStation||'');
if(at!==bt) return at.localeCompare(bt,'ja');
const aa=Number.isFinite(a.terminalArrivalOrder)?a.terminalArrivalOrder:Infinity;
const bb=Number.isFinite(b.terminalArrivalOrder)?b.terminalArrivalOrder:Infinity;
const hasTurn=a.terminalSwitch||b.terminalSwitch||a.mode==='chain-wait'||b.mode==='chain-wait';
if(hasTurn && aa!==bb) return bb-aa;
if(!hasTurn && aa!==bb) return aa-bb;
return String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true});
});
const used=[];
occupied[side].forEach(item=>{
let lane=item.baseLane;
while(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane)){
lane++;
}
used.push({pos:item.pos,lane});
const rr=rowRectAt(item.pos);if(!rr)return;
const t=item.t,el=document.createElement('div');el.className=`train-icon ${side}`;el.style.visibility='hidden';el.style.transition='none';
const formParts=formationDisplayParts(t.formation,t.direction);
const displayType=trainTypeAtPosition(t,item);
const displayTrain={...t,type:displayType};
const displayLabelClass=getExpressClass(displayTrain);
const iconTrainNo=trainNumberAtPosition(t,item)||String(t?.no||'');
el.innerHTML=`<span class="train-no">${esc(iconTrainNo)}</span><img src="${esc(trainImageFor(t))}" alt="${esc(iconTrainNo)}" onerror="this.onerror=null;this.src='${NOIMAGE_IMG}'">${formParts.length?`<span class="train-no train-formation">${formParts.map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:''}<span class="train-label ${displayLabelClass}"><span>${esc(mainShortType(displayTrain))} ${esc(mainShortDest(t.dest))}</span></span>`;
const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
const img=el.querySelector('img'),noEl=el.querySelector('.train-no'),formationEl=el.querySelector('.train-formation');
const laneOffset=lane*(trainWidth+laneGap);
const leftPos=side==='left'?centerX-340-laneOffset:centerX+340-trainWidth+laneOffset;
el.style.left=`${leftPos}px`;el.style.right='auto';el.style.setProperty('--lane-shift','0px');
el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openTrainSheet(t.no,{type:'moving',stationName:item.stationA||'',displayType:displayType},t.service||trainGroupKey(t));});
layer.appendChild(el);
const apply=()=>{
const ir=img?.getBoundingClientRect(),nr=noEl?.getBoundingClientRect(),fr=formationEl?.getBoundingClientRect();
const ih=(ir?.height||60)/mobileZoom,nh=(nr?.height||12)/mobileZoom,fh=(fr?.height||0)/mobileZoom;
const desired=(rr.centerY-layerRect.top)/mobileZoom;
el.style.top=`${desired-nh-ih/2}px`;el.style.visibility='visible';
};
if(img?.complete&&img.naturalWidth)apply();else img?.addEventListener('load',apply,{once:true});
});
});
}

function initStationSheetEvents(){
document.getElementById('closeBtn').addEventListener('click',closeSheet);
document.getElementById('overlay').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
}
async function init(){
loadOperationInfo();
initDateTimeControls();
loadLocal();
try{
await loadTrainData();
}catch(e){
console.error('時刻表JSON読込失敗',e);
const layer=document.getElementById('lineContainer');
if(layer) layer.innerHTML=`<div style="padding:40px;text-align:center;font-weight:700;color:#c62828;">時刻表データを読み込めませんでした。<br>${esc(e?.message||e)}</div>`;
return;
}
render();
initStationSheetEvents();
await initFirebase();
currentOperationDate=currentOperationDate||operationDateKey();
await maybeResetForNewOperationDay();
render();
renderTrainPositions();
initOperationInfoUI();
setInterval(()=>{if(followNow){const input=document.getElementById('timeInput');if(input)input.value=formatTimeNow();}renderTrainPositions();},1000);
setInterval(()=>{maybeResetForNewOperationDay();},1000);
}
init();</script>
