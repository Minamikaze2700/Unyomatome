.timetable-list{background:#fff;border-radius:8px;padding:12px 20px;margin-top:12px}.station-timetable-title{font-family:inherit;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px}.station-timetable-direction-tabs{display:flex;gap:10px;width:100%;margin:0 0 12px;justify-content:flex-start}.station-timetable-direction-tab{flex:1 1 0;min-width:0;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);font-family:inherit;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer}.station-timetable-direction-tab.active{background:var(--primary);color:#fff}.station-timetable-direction-tab:hover{background:#fff1f1}.station-timetable-direction-tab.active:hover{background:var(--primary-dark)}

/* 野田線と同じ日付・時刻コントロール */
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}
.control-bar{position:sticky;top:50px;z-index:20;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #ddd}

.date-input{border:2px solid var(--primary);background:#fff;color:var(--primary);padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;min-width:160px}
.schedule-day-label{font-weight:800;color:#555;white-space:nowrap}

.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}

.train-icon.left,.train-icon.right{right:auto}

.train-icon img{width:60px;height:auto;object-fit:contain;display:block}

.train-label.express{background:#e5007f;color:#fff}.train-label.section-express{background:#f3b6c2;color:#111}.train-label.th-liner{background:#d5007f;color:#fff}

.train-card{cursor:pointer;position:relative}.train-card.historical-readonly{cursor:default}.formation-updated-at{position:absolute;right:12px;bottom:8px;font-size:.78rem;color:#777}

<script>

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function formationById(id){
  if(!id||id===INITIAL_FORMATION_SELECTION.id)return null;
  for(const g of FORMATIONS){
    if(g.type===id)return {id:g.type,name:g.type,img:g.typeImg,kind:'type',type:g.type};
    const f=(g.items||[]).find(x=>x.id===String(id));
    if(f)return {...f,type:g.type};
  }
  return null;
}
function selectionDisplayObject(id){
  const known=formationById(id);
  if(known)return known;
  const raw=String(id??'').trim();
  if(raw && /^[A-Z]?\d{4,6}F$/i.test(raw)) return {id:raw,name:raw.toUpperCase(),img:INITIAL_FORMATION_SELECTION.img,kind:'manual',type:'manual'};
  return INITIAL_FORMATION_SELECTION;
}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase().replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!raw)return {ok:false,error:'車両番号または編成番号を入力してください。'};
  const candidates=[raw,raw.endsWith('F')?raw.slice(0,-1):raw,raw+'F'];
  for(const c of candidates){const f=formationById(c);if(f&&f.kind!=='type')return {ok:true,id:f.id};}
  const normalized=raw.replace(/[^A-Z0-9]/g,'').replace(/F$/,'');
  for(const g of FORMATIONS) for(const f of g.items||[]){
    /* 7両編成の各車両番号を許容（例 71701～77701） */
    const base=String(f.id);
    for(let k=0;k<7;k++) if(String(Number(base)+k*1000)===normalized) return {ok:true,id:f.id};
  }
  if(/^[A-Z]?\d{4,6}F$/i.test(raw)) return {ok:true,id:raw.toUpperCase()};
  return {ok:false,error:`車両番号・編成番号「${raw}」に該当する編成が見つかりません。`};
}
function formationDisplayParts(id){
  if(!id)return [];
  const ids=String(id).split('+').map(x=>x.trim()).filter(Boolean);
  return ids.flatMap(one=>{
    const f=selectionDisplayObject(one);
    if(!f||f.id===INITIAL_FORMATION_SELECTION.id)return [];
    if(f.kind==='manual')return [f.name];
    return f.type&&f.name.startsWith(f.type)?[f.type,f.name.slice(f.type.length).trim()].filter(Boolean):[f.name];
  });
}
function formationDisplayHTML(id){return formationDisplayParts(id).map(x=>`<span>${esc(x)}</span>`).join('');}

function timeToMinutes(s){
  const [h,m]=String(s).split(':').map(Number);
  return (h||0)*60+(m||0);
}
function fmtMinutes(v){
  v=((v%1440)+1440)%1440;
  return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.round(v%60)).padStart(2,'0');
}
function travelStops(names,start,rapid=false){
  const out=[]; let cur=start;
  names.forEach((station,i)=>{if(i===0)out.push({station,time:fmtMinutes(cur)});else{cur+=(rapid?2:3);out.push({station,time:fmtMinutes(cur)});}});
  return out;
}
function mainBetween(a,b){
  const ia=MAIN_NAMES.indexOf(a),ib=MAIN_NAMES.indexOf(b); if(ia<0||ib<0)return [];
  const step=ia<=ib?1:-1,r=[];for(let i=ia;;i+=step){r.push(MAIN_NAMES[i]);if(i===ib)break;}return r;
}

const DEPARTURES_PER_SYSTEM=200;
function fmtMinutes(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.round(v%60)).padStart(2,'0');}
function addGeneratedTrain(no,type,direction,stops,service,defaultCars='7両',opts={}){
  TRAINS.push({no,type,direction,days:['平日','休日'],start:stops[0].station,dest:stops[stops.length-1].station,stops,defaultCars,formation:opts.formation||null,service});
}
function mainRange(a,b){
  const ia=MAIN_NAMES.indexOf(a),ib=MAIN_NAMES.indexOf(b);if(ia<0||ib<0)return [];
  const step=ia<=ib?1:-1,out=[];for(let i=ia;;i+=step){out.push(MAIN_NAMES[i]);if(i===ib)break;}return out;
}
function buildTimedStops(names,startMin,increment){
  let t=startMin;
  return names.map((station,i)=>{if(i>0)t+=increment;return {station,time:fmtMinutes(t)};});
}
function depTime(i,span){return Math.round(OP_START+5+(span-5)*(i/(DEPARTURES_PER_SYSTEM-1)));}
const SYSTEM_STARTS={chijou:0,hibiya:0,hanzomon:0,tokkyu:0};
function makeChijou(i,dir){
  const up=dir==='up';
  const pattern=i%4;
  let type,names;
  if(pattern===0){
    type='普通';
    names=up?mainRange('館林','浅草'):mainRange('浅草','館林');
  }else if(pattern===1){
    type='区間準急';
    const seq=['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','東向島','鐘ヶ淵','堀切','牛田','北千住','西新井','草加','新越谷','越谷','北越谷','大袋','せんげん台','武里','一ノ割','春日部','北春日部','姫宮','東武動物公園','和戸','久喜'];
    names=up?seq.slice():seq.slice().reverse();
  }else if(pattern===2){
    type='急行';
    const seq=['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','北千住','西新井','草加','新越谷','越谷','せんげん台','春日部','東武動物公園','和戸','久喜'];
    names=up?seq.slice():seq.slice().reverse();
  }else{
    type='準急';
    const seq=['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','北千住','西新井','草加','新越谷','越谷','北越谷','大袋','せんげん台','武里','一ノ割','春日部','北春日部','姫宮','東武動物公園','和戸','久喜'];
    names=up?seq.slice():seq.slice().reverse();
  }
  const step=type==='普通'?3.1:type==='区間準急'?3.0:type==='準急'?3.0:2.8;
  return [type,buildTimedStops(names,0,step),type==='普通'?'地上普通共通':'地上運用'];
}
function makeTokkyu(i,dir){
  const kind=i%10<3?'liberty':i%10<5?'n100':i%10<8?'ryomo':'kinu';
  const base=kind==='ryomo'
    ? ['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','北千住','東武動物公園','久喜','館林']
    : kind==='liberty'
      ? ['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','北千住','春日部','東武動物公園','栃木','新鹿沼','下今市','東武日光']
      : ['浅草','とうきょうｽｶｲﾂﾘｰ','曳舟','北千住','春日部','東武動物公園','栃木','新鹿沼','下今市','東武日光'];
  const names=dir==='up'?base:base.slice().reverse();
  return ['特急',buildTimedStops(names,0,5.2),'特急共通',{limitedKind:kind}];
}
function makeHibiya(i,dir){
  const isTH=(i%20===0)||(i%20===1);
  if(isTH){
    const seq=['久喜','東武動物公園','春日部','せんげん台','新越谷','上野','秋葉原','茅場町','銀座','霞ケ関','虎ノ門ヒルズ','神谷町','六本木','広尾','恵比寿'];
    const names=dir==='up'?seq:seq.slice().reverse();
    return ['THライナー',buildTimedStops(names,0,3.0),'THライナー共通'];
  }
  const seq=[...mainRange('北越谷','北千住'),...HIBIYA_NAMES.slice(1)];
  const names=dir==='up'?seq:seq.slice().reverse();
  return ['普通',buildTimedStops(names,0,2.8),'日比直共通'];
}
function makeHanzomon(i,dir){
  // 半蔵門線直通は押上・曳舟から渋谷を経て田園都市線へ継続。
  const seq=['久喜','和戸','東武動物公園','春日部','せんげん台','越谷','新越谷','草加','西新井','北千住','押上','錦糸町','住吉','清澄白河','水天宮前','三越前','大手町','神保町','九段下','半蔵門','永田町','青山一丁目','表参道','渋谷',...DENENTOSHI_NAMES.slice(1)];
  const names=dir==='up'?seq:seq.slice().reverse();
  return ['急行',buildTimedStops(names,0,2.8),'半直共通'];
}
const MAKERS={
  chijou:{maker:makeChijou,safeSpan:18*60-60},
  hibiya:{maker:makeHibiya,safeSpan:18*60-70},
  hanzomon:{maker:makeHanzomon,safeSpan:18*60-80},
  tokkyu:{maker:makeTokkyu,safeSpan:18*60-30}
};
for(const service of ['chijou','hibiya','hanzomon','tokkyu']){
  const {maker,safeSpan}=MAKERS[service];
  for(let i=0;i<DEPARTURES_PER_SYSTEM;i++){
    const dir=i%2===0?'up':'down';
    const [type,templateStops,cars,opts={}]=maker(i,dir);
    const step=type==='特急'?5.2:type==='THライナー'?3.0:service==='hanzomon'?2.8:service==='hibiya'?2.8:(type==='急行'?2.7:3.1);
    const maxStart=OP_END-(templateStops.length-1)*step-1;
    const start=OP_START+5+(maxStart-(OP_START+5))*(i/(DEPARTURES_PER_SYSTEM-1));
    const stops=buildTimedStops(templateStops.map(x=>x.station),start,step);
    const prefix=service==='tokkyu'?'L':service==='chijou'?'G':service==='hibiya'?'H':'Z';
    let no=`${prefix}${String(i+1).padStart(3,'0')}`;
    if(service==='hibiya'||service==='hanzomon'){
      const ends=['T','S','K'];
      no+=ends[i%3];
    }
    addGeneratedTrain(no,type,dir,stops,service,cars,opts);
  }
}

function formatTimeNow(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function setNowTime(){followNow=true;setSelectedDate(operationDateKey());const input=document.getElementById('timeInput');if(input)input.value=formatTimeNow();document.getElementById('nowBtn')?.classList.add('active');}
function setManualTime(){followNow=false;document.getElementById('nowBtn')?.classList.remove('active');}
function currentMinutes(){
  if(followNow){const d=new Date();const base=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;return d.getHours()<RESET_HOUR?base+1440:base;}
  const input=document.getElementById('timeInput'),value=input?.value||formatTimeNow();const [h,m]=String(value).split(':').map(Number);const base=(h||0)*60+(m||0);return h<RESET_HOUR?base+1440:base;
}
function initDateTimeControls(){
  setSelectedDate(operationDateKey());
  document.getElementById('dateInput')?.addEventListener('change',e=>setSelectedDate(e.target.value));
  const ti=document.getElementById('timeInput');if(ti){ti.value=formatTimeNow();ti.addEventListener('input',setManualTime);}
}

function trainGroupKey(t){
  if(t.service==='hibiya')return 'hibiya';
  if(t.service==='hanzomon')return 'hanzomon';
  if(t.type==='特急')return 'tokkyu';
  return 'chijou';
}
function liveTrain(no){
  const base=TRAINS.find(t=>String(t.no)===String(no)); if(!base)return null;
  const form=registrationState[currentDay]?.[String(no)]||null;
  return {...base,formation:form};
}
function formationTimestamp(no){return formationUpdatedAt[currentDay]?.[String(no)]||'';}
function syncStatus(text){document.querySelectorAll('#syncStatus').forEach(e=>e.textContent='共有同期：'+text);}

function firebaseRefForTrain(train){
  const key=trainGroupKey(train),db=firebaseDbs[key];
  return db?db.ref('運用'):null;
}
async function initFirebase(){
  loadLocal();
  if(!window.firebase?.initializeApp){syncStatus('Firebaseライブラリ未接続');return;}
  try{
    for(const [key,info] of Object.entries(FIREBASE_PROJECTS)){
      const app=firebase.apps.find(a=>a.name===info.appName)||firebase.initializeApp(info.config,info.appName);
      firebaseApps[key]=app;firebaseDbs[key]=firebase.database(app);
      const ref=firebaseDbs[key].ref('運用');
      ref.on('value',snap=>{
        const root=snap.val()||{};
        remoteByProject[key]=root;
        const states=root.stateByDay||root;
        for(const day of ['平日','休日']){
          if(states?.[day]&&typeof states[day]==='object') registrationState[day]={...(registrationState[day]||{}),...states[day]};
        }
        const ts=root.formationUpdatedAtByDay||{};
        for(const day of ['平日','休日']){
          if(ts?.[day]&&typeof ts[day]==='object') formationUpdatedAt[day]={...(formationUpdatedAt[day]||{}),...ts[day]};
        }
        saveLocal();renderTrainPositions();if(currentTrainNo&&!isEditMode)updateSheetContent();syncStatus('Firebase同期済み');
      },err=>{
        // RTDB未作成・URL不一致・権限拒否でもアプリ本体はローカルで利用可能にする。
        console.warn(info.label+' Firebase読込失敗',err);
        syncStatus('Firebase読込失敗（ローカル保存は継続）');
      });
    }
    firebaseReady=true;syncStatus('Firebase接続済み');
  }catch(e){console.error(e);syncStatus('Firebase初期化失敗');}
}
async function recordSelection(train,formId){
  if(!selectedIsCurrentOperation())return;
  const day=currentDay,key=String(train.no);
  registrationState[day]=registrationState[day]||{};
  formationUpdatedAt[day]=formationUpdatedAt[day]||{};
  const value=formId&&formId!==INITIAL_FORMATION_SELECTION.id?String(formId):null;
  if(value){registrationState[day][key]=value;formationUpdatedAt[day][key]=new Date().toISOString();}
  else{delete registrationState[day][key];delete formationUpdatedAt[day][key];}
  saveLocal();renderTrainPositions();updateSheetContent();
  const ref=firebaseRefForTrain(train);
  if(firebaseReady&&ref){
    try{
      await ref.child('stateByDay').child(day).update({[key]:value});
      await ref.child('formationUpdatedAtByDay').child(day).update({[key]:value?formationUpdatedAt[day][key]:null});
      syncStatus('Firebase同期済み');
    }catch(e){console.error(e);syncStatus('Firebase書込失敗（ローカル保存済み）');}
  }else syncStatus('ローカル保存済み');
}

/* 路線図 */
let activeBranches=new Set();
function stationId(routeKey,station){return routeKey+'::'+station[0];}
function lineColorFor(routeKey){return ROUTES[routeKey]?.color||COLORS.sky;}
function stationById(id){const [routeKey,name]=String(id).split('::');const route=ROUTES[routeKey];if(!route)return null;const st=route.stations.find(x=>x[0]===name);return st?{routeKey,st}:null;}
function stationBadge(st,routeKey,optStationColor=null){
  const badge=document.createElement('div');badge.className='station-badge';badge.tabIndex=0;badge.setAttribute('role','button');
  badge.style.setProperty('--station-color',optStationColor||lineColorFor(routeKey));
  badge.innerHTML=`<div class="station-name-ja">${esc(st[0])}</div><div class="station-name-en">${esc(st[1])}</div>`;
  const len=[...st[0].trim()].length;let ls='0';if(len<=2)ls='.9em';else if(len===3)ls='.3em';badge.querySelector('.station-name-ja').style.letterSpacing=ls;badge.querySelector('.station-name-ja').style.paddingLeft=ls;
  const open=()=>openStationSheet(st,routeKey);badge.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open()});badge.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});return badge;
}
function connectionButton(label,color,action,isActive=false){const b=document.createElement('button');b.type='button';b.className='connection-button'+(isActive?' active':'');b.style.setProperty('--button-color',color);b.textContent='▼ '+label;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();action()});return b;}
function createRow(st,routeKey,opt={}){
  const row=document.createElement('div');row.className='station-row';row.dataset.routeKey=routeKey;row.style.setProperty('--line-top',opt.lineTop??lineColorFor(routeKey));row.style.setProperty('--line-bottom',opt.lineBottom??lineColorFor(routeKey));
  if(opt.fadeDown){row.style.setProperty('--line-bottom-fade',opt.fadeColor||row.style.getPropertyValue('--line-bottom'));row.classList.add('fade-down')}
  if(opt.fadeUp){row.style.setProperty('--line-top-fade',opt.fadeColor||row.style.getPropertyValue('--line-top'));row.classList.add('fade-up')}
  if(opt.wadoNikkoInsert)row.classList.add('wado-nikko-insert');
  if(opt.cutAbove)row.classList.add('cut-above');if(opt.cutBelow)row.classList.add('cut-below');if(opt.noLine)row.classList.add('no-line');
  if(opt.above){const w=document.createElement('div');w.className='connection-buttons connection-top';w.appendChild(connectionButton(opt.above.label,opt.above.color,opt.above.action,opt.above.active));row.appendChild(w);}
  row.appendChild(stationBadge(st,routeKey,opt.stationColor));
  if(opt.buttons?.length){const w=document.createElement('div');w.className='connection-buttons connection-bottom';opt.buttons.forEach(x=>w.appendChild(connectionButton(x.label,x.color,x.action,x.active)));row.appendChild(w);}
  return row;
}
function edgeColor(routeKey,a,b){
  const A=a?.[0]||'',B=b?.[0]||'';
  if(routeKey==='main'){const ia=MAIN_NAMES.indexOf(A),ib=MAIN_NAMES.indexOf(B),z=MAIN_NAMES.indexOf('東武動物公園');return Math.min(ia,ib)<z?COLORS.isesaki:COLORS.sky;}
  return lineColorFor(routeKey);
}
function buttonSpecForMain(st){
  const n=st[0];
  if(n==='東武動物公園')return {above:{label:'日光線',color:COLORS.nikko,action:()=>toggleBranch('nikko'),active:activeBranches.has('nikko')}};
  if(n==='北千住')return {buttons:[{label:'日比谷線',color:COLORS.hibiya,action:()=>toggleBranch('hibiya'),active:activeBranches.has('hibiya')}]};
  if(n==='曳舟')return {buttons:[{label:'押上・半蔵門線・田園都市線',color:COLORS.hanzomon,action:()=>toggleBranch('hanzomon'),active:activeBranches.has('hanzomon')}]};
  return {};
}
function screenEdgeColor(a,b){
  if(a.routeKey===b.routeKey)return edgeColor(a.routeKey,a.st,b.st);
  const pair=[a.st[0],b.st[0]].sort().join('|');
  const map={
    ['北千住|南千住']:COLORS.hibiya,['曳舟|押上']:COLORS.sky,['渋谷|表参道']:COLORS.hanzomon,
    ['渋谷|池尻大橋']:COLORS.denentoshi,['東武動物公園|姫宮']:COLORS.sky,['杉戸高野台|東武動物公園']:COLORS.nikko
  };
  return map[pair]||null;
}
function buildScreenRows(){
  const rows=[],push=(st,routeKey,opt={})=>rows.push({st,routeKey,opt:{...opt}});
  const main=ROUTES.main.stations;
  for(let i=0;i<main.length;i++){
    const st=main[i],next=main[i+1],prev=main[i-1],opt=buttonSpecForMain(st);
    if(i===0)opt.cutAbove=true;if(i===main.length-1)opt.cutBelow=true;
    // 日光線は東武動物公園の上側へ挿入。
    if(st[0]==='東武動物公園'&&activeBranches.has('nikko')){
      ROUTES.nikko.stations.slice(0,-1).forEach((x,j)=>push(x,'nikko',{
        lineTop:COLORS.nikko,lineBottom:COLORS.nikko,stationColor:COLORS.nikko,
        cutAbove:j===0,cutBelow:false
      }));
      opt.lineTop=COLORS.nikko;opt.lineBottom=COLORS.sky;opt.stationColor=COLORS.sky;
    }else{
      opt.lineTop=prev?edgeColor('main',prev,st):'transparent';
      opt.lineBottom=next?edgeColor('main',st,next):'transparent';
      opt.stationColor=next?edgeColor('main',st,next):edgeColor('main',prev,st);
    }
    if(st[0]==='北千住'&&activeBranches.has('hibiya')){opt.lineTop=COLORS.sky;opt.lineBottom=COLORS.hibiya;opt.stationColor=COLORS.hibiya;}
    if(st[0]==='曳舟'&&activeBranches.has('hanzomon')){opt.lineTop=COLORS.sky;opt.lineBottom=COLORS.sky;opt.stationColor=COLORS.sky;}
    if(st[0]==='和戸'){
      // 日光線を表示していない通常時は伊勢崎線の赤線をそのまま表示。
      // 日光線表示時だけ和戸の下側を赤→透明へフェード。
      if(activeBranches.has('nikko')){
        opt.wadoNikkoInsert=true;
        opt.lineTop=COLORS.isesaki;
        opt.lineBottom='transparent';
      }else{
        opt.wadoNikkoInsert=false;
        opt.lineTop=COLORS.isesaki;
        opt.lineBottom=COLORS.isesaki;
        opt.stationColor=COLORS.isesaki;
      }
    }
    push(st,'main',opt);
    if(st[0]==='北千住'&&activeBranches.has('hibiya')){
      ROUTES.hibiya.stations.slice(1).forEach((x,j)=>push(x,'hibiya',{lineTop:COLORS.hibiya,lineBottom:COLORS.hibiya,stationColor:COLORS.hibiya,cutBelow:j===ROUTES.hibiya.stations.length-2,breakAfter:j===ROUTES.hibiya.stations.length-2}));
      if(next){const no=buttonSpecForMain(next);no.fadeUp=true;no.fadeColor=COLORS.sky;no.breakBefore=true;push(next,'main',no);i++;}
    }
    if(st[0]==='曳舟'&&activeBranches.has('hanzomon')){
      ROUTES.hanzomon.stations.forEach((x,j)=>push(x,'hanzomon',{lineTop:j===0?COLORS.sky:COLORS.hanzomon,lineBottom:COLORS.hanzomon,stationColor:COLORS.hanzomon}));
      ROUTES.denentoshi.stations.slice(1).forEach((x,j)=>push(x,'denentoshi',{lineTop:COLORS.denentoshi,lineBottom:COLORS.denentoshi,stationColor:COLORS.denentoshi,cutBelow:j===ROUTES.denentoshi.stations.length-2,breakAfter:j===ROUTES.denentoshi.stations.length-2}));
      if(next){const no=buttonSpecForMain(next);no.fadeUp=true;no.fadeColor=COLORS.sky;no.breakBefore=true;no.branchReturn=true;push(next,'main',no);i++;}
    }
  }
  for(let i=0;i<rows.length;i++){
    const r=rows[i],p=rows[i-1],n=rows[i+1],pb=!!r.opt.breakBefore||!!p?.opt?.breakAfter,nb=!!r.opt.breakAfter||!!n?.opt?.breakBefore;
    if(!pb&&p)r.opt.lineTop=screenEdgeColor(p,r);else if(pb||!p)r.opt.lineTop='transparent';
    if(!nb&&n)r.opt.lineBottom=screenEdgeColor(r,n);else if(nb||!n)r.opt.lineBottom='transparent';
    if(r.st[0]==='和戸'){
      if(activeBranches.has('nikko')){
        r.opt.wadoNikkoInsert=true;
        r.opt.lineTop=COLORS.isesaki;
        r.opt.lineBottom='transparent';
        r.opt.stationColor=COLORS.isesaki;
      }else{
        r.opt.wadoNikkoInsert=false;
        r.opt.lineTop=COLORS.isesaki;
        r.opt.lineBottom=COLORS.isesaki;
        r.opt.stationColor=COLORS.isesaki;
      }
    }
    if(r.st[0]==='曳舟'&&activeBranches.has('hanzomon')){r.opt.lineBottom=COLORS.sky;r.opt.stationColor=COLORS.sky;}
    if(r.st[0]==='押上'&&activeBranches.has('hanzomon')){r.opt.lineTop=COLORS.sky;}
    if(r.st[0]==='渋谷'&&activeBranches.has('hanzomon')){r.opt.lineTop=COLORS.hanzomon;r.opt.lineBottom=COLORS.denentoshi;r.opt.stationColor=COLORS.denentoshi;}
    if(r.st[0]==='池尻大橋'&&activeBranches.has('hanzomon')){r.opt.lineTop=COLORS.denentoshi;r.opt.lineBottom=COLORS.denentoshi;r.opt.stationColor=COLORS.denentoshi;}
  }
  return rows;
}
function render(){
  const lc=document.getElementById('lineContainer');lc.innerHTML='<div class="moving-train-layer" id="movingTrainLayer"></div>';
  buildScreenRows().forEach(r=>lc.appendChild(createRow(r.st,r.routeKey,r.opt)));
  renderTrainPositions();
}
function toggleBranch(key){if(activeBranches.has(key))activeBranches.delete(key);else activeBranches.add(key);const y=scrollY;render();requestAnimationFrame(()=>scrollTo({top:y,behavior:'auto'}));}

/* 駅情報 */
function routeDirectionLabels(routeKey,st){
  // 左タブ=上り（浅草・都心方面）、右タブ=下り（館林方面）を固定。
  if(routeKey==='hibiya')return ['中目黒方面','北千住方面'];
  if(routeKey==='hanzomon')return st[0]==='押上'?['渋谷方面','館林・南栗橋方面']:st[0]==='渋谷'?['中央林間方面','押上方面']:['渋谷方面','押上方面'];
  if(routeKey==='denentoshi')return ['中央林間方面','渋谷方面'];
  if(routeKey==='nikko')return ['浅草・押上方面','南栗橋方面'];
  const i=MAIN_NAMES.indexOf(st[0]);
  const z=MAIN_NAMES.indexOf('東武動物公園');
  const k=MAIN_NAMES.indexOf('北千住');
  if(i>=0&&i<z)return ['浅草・押上方面','館林方面'];
  if(i===z)return ['浅草・押上方面','館林・南栗橋方面'];
  if(i>z&&i<=k)return ['浅草・押上・中目黒方面','館林・南栗橋方面'];
  if(st[0]==='曳舟')return ['浅草・押上方面','館林・南栗橋方面'];
  return ['浅草方面','館林・南栗橋方面'];
}
function stationScreenNeighbors(st,routeKey){
  const rows=buildScreenRows(),idx=rows.findIndex(r=>r.routeKey===routeKey&&r.st[0]===st[0]);if(idx<0)return {prev:null,next:null,prevColor:null,nextColor:null};
  const cur=rows[idx],p=rows[idx-1],n=rows[idx+1],prevBreak=cur.opt.breakBefore||p?.opt?.breakAfter,nextBreak=cur.opt.breakAfter||n?.opt?.breakBefore;
  return {prev:(!prevBreak?p:null),next:(!nextBreak?n:null),prevColor:(!prevBreak&&p)?screenEdgeColor(p,cur):null,nextColor:(!nextBreak&&n)?screenEdgeColor(cur,n):null};
}
function getVisibleTrains(){
  // 野田線版と同様、現在の運転日に有効な列車だけを共通の集合として返す。
  // 念のため列番単位で重複除去し、同じ列車が複数回表示されないようにする。
  const day=currentDay||'平日';
  const seen=new Set(),out=[];
  for(const base of TRAINS){
    if(!base || !Array.isArray(base.stops) || base.stops.length<2) continue;
    if(Array.isArray(base.days) && base.days.length && !base.days.includes(day)) continue;
    const no=String(base.no||'');
    const signature=`${String(base.service||'')}|${no}|${String(base.direction||'')}`;
    if(!no || seen.has(signature)) continue;
    seen.add(signature);
    out.push(liveTrain(no)||base);
  }
  return out;
}
function stationTimetableEntries(st,routeKey,direction){
  const name=String(st?.[0]||''),dir=direction==='down'?'down':'up';
  const byTrain=new Map();
  for(const train of getVisibleTrains()){
    if(String(train?.direction||'')!==dir) continue;
    if(!trainAllowedOnVisibleBranch(train,name)) continue;
    if(String(train?.dest||'')===name) continue;
    if(String(train?.type||'')==='回送') continue;
    const stops=(train.stops||[]).filter(x=>String(x?.station||'')===name);
    if(!stops.length) continue;
    const stop=stops[stops.length-1];
    if(!stop?.time) continue;
    const key=String(train.no||'');
    if(byTrain.has(key)) continue;
    byTrain.set(key,{train,stop});
  }
  return [...byTrain.values()].sort((a,b)=>serviceDayMinuteFromTime(a.stop.time)-serviceDayMinuteFromTime(b.stop.time)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}));
}
function destinationScaleClass(dest){ return ''; }
function trainRowHTML(train,st){
  const stop=((train.stops||[]).filter(s=>String(s?.station||'')===String(st[0]))).pop();
  const form=selectionDisplayObject(train.formation);
  const cls=getExpressClass(train);
  return `<button class="station-timetable-row" type="button" title="列車 ${esc(displayTrainNo(train))} / ${esc(stop?.time||'')} / ${esc(train.dest||'')} 行" onclick="openTrainSheet('${esc(train.no)}')"><img class="station-timetable-train-img" src="${esc(form?.img||INITIAL_FORMATION_SELECTION.img)}" alt="${esc(displayTrainNo(train))}"><span class="station-timetable-formation">${formationDisplayHTML(train.formation)||'—'}</span><span class="station-timetable-type ${cls}">${esc(train.type||'')}</span><span class="station-timetable-time">${esc(stop?.time||'')}</span><span class="station-timetable-destination"><span class="station-timetable-destination-station${destinationScaleClass(train.dest)}">${esc(train.dest||'')}</span><span class="station-timetable-destination-go">行</span></span></button>`;
}
function stationTimetableHTML(st,routeKey,direction){
  const entries=stationTimetableEntries(st,routeKey,direction);
  if(!entries.length)return '<div class="station-timetable-empty">この方面の時刻表はありません。</div>';
  const now=currentMinutes();
  const nextIndex=entries.findIndex(x=>serviceDayMinuteFromTime(x.stop.time)>=now);
  const rows=entries.map((x,i)=>{
    const html=trainRowHTML(x.train,st);
    return i===nextIndex?html.replace('class="station-timetable-row"','class="station-timetable-row is-next" data-next-train="true"'):html;
  }).join('');
  return `<div class="station-timetable-frame"><div class="station-timetable-wrap" id="stationTimetableScroll">${rows}</div></div>`;
}
function serviceDayMinuteFromTime(time){const m=String(time||'').match(/^(\d+):(\d{2})$/);if(!m)return Infinity;const h=Number(m[1]),mi=Number(m[2]);return h<RESET_HOUR? h*60+mi+1440:h*60+mi;}
function scrollStationTimetableToNext(){const wrap=document.getElementById('stationTimetableScroll');if(!wrap)return;const next=wrap.querySelector('[data-next-train="true"]')||wrap.querySelector('.station-timetable-row');if(!next)return;requestAnimationFrame(()=>{wrap.scrollTop=Math.max(0,next.offsetTop);});}
function setStationTimetableDirection(direction){
  stationTimetableDirection = direction === 'down' ? 'down' : 'up';
  updateStationSheetContent();
  scrollStationTimetableToNext();
}
function updateStationSheetContent(){
  const found=stationById(currentStationId),content=document.getElementById('sheetContent');if(!found||!content)return;
  const {routeKey,st}=found,{prev,next,prevColor,nextColor}=stationScreenNeighbors(st,routeKey),labels=routeDirectionLabels(routeKey,st);
  content.style.setProperty('--primary',nextColor||lineColorFor(routeKey));content.style.setProperty('--primary-dark',nextColor||lineColorFor(routeKey));
  const split=prevColor&&nextColor&&prevColor!==nextColor?' split':'';
  const bar=`<div class="station-direction-bar${!prev?' no-prev':''}${!next?' no-next':''}${split}" style="--bar-left:${prevColor||nextColor||lineColorFor(routeKey)};--bar-right:${nextColor||prevColor||lineColorFor(routeKey)}"></div>`;
  const entries=stationTimetableEntries(st,routeKey,stationTimetableDirection);
  const now=currentMinutes();
  let nextIndex=entries.findIndex(x=>serviceDayMinuteFromTime(x.stop.time)>=now);
  if(nextIndex<0 && entries.length) nextIndex=0;
  const rows=entries.map((x,i)=>{
    const html=trainRowHTML(x.train,st);
    return i===nextIndex?html.replace('class="station-timetable-row"','class="station-timetable-row is-next" data-next-train="true"'):html;
  }).join('');
  content.innerHTML=`<div class="station-overview-card station-info-card"><div class="station-overview-main"><div class="station-overview-name-ja">${esc(st[0])}</div><div class="station-overview-name-en">${esc(st[1])}</div></div><div class="station-direction-bar-wrap">${bar}</div><div class="station-neighbor-row"><div class="station-neighbor left${prev?'':' empty'}"><div class="station-neighbor-name-ja">${esc(prev?.st?.[0]||'')}</div><div class="station-neighbor-name-en">${esc(prev?.st?.[1]||'')}</div></div><div class="station-neighbor right${next?'':' empty'}"><div class="station-neighbor-name-ja">${esc(next?.st?.[0]||'')}</div><div class="station-neighbor-name-en">${esc(next?.st?.[1]||'')}</div></div></div></div><div class="timetable-list"><div class="station-timetable-title">時刻表</div><div class="station-timetable-direction-tabs"><button class="station-timetable-direction-tab ${stationTimetableDirection==='up'?'active':''}" type="button" onclick="setStationTimetableDirection('up')">${esc(labels[0])}</button><button class="station-timetable-direction-tab ${stationTimetableDirection==='down'?'active':''}" type="button" onclick="setStationTimetableDirection('down')">${esc(labels[1])}</button></div>${entries.length?`<div class="station-timetable-frame"><div class="station-timetable-wrap" id="stationTimetableScroll">${rows}</div></div>`:'<div class="station-timetable-empty">該当する列車はありません</div>'}</div>`;
  scrollStationTimetableToNext();

/* 列車位置・レーン */
function trainTimeAtMainStation(t,stationName){
  const stops=Array.isArray(t?.stops)?t.stops:[];
  const target=String(stationName||'');
  if(!stops.length||!target)return null;

  // まず実停車時刻を優先。
  for(const s of stops){
    if(String(s?.station||'')===target && s?.time) return timeToMinutes(s.time);
  }

  // 通過駅なら、直前・直後の停車駅から本線上の駅間距離で時刻を補間する。
  const targetIndex=MAIN_NAMES.indexOf(target);
  if(targetIndex<0)return null;
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    const ai=MAIN_NAMES.indexOf(String(a?.station||''));
    const bi=MAIN_NAMES.indexOf(String(b?.station||''));
    if(ai<0||bi<0)continue;
    const lo=Math.min(ai,bi),hi=Math.max(ai,bi);
    if(targetIndex<lo||targetIndex>hi||ai===bi)continue;
    let t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
    if(t1<t0)t1+=1440;
    const q=(targetIndex-ai)/(bi-ai);
    return t0+(t1-t0)*q;
  }
  return null;
}

function branchHiddenWindow(t){
  if(!activeBranches || !(activeBranches instanceof Set) || !activeBranches.size) return null;

  // 画面上、分岐線を本線へ差し込んでいる「前駅→後駅」を基準にする。
  // 後駅が通過駅でも、その列車が本線上で通過する予定時刻までを非表示区間とする。
  const candidates=[];
  if(activeBranches.has('hibiya')) candidates.push(['北千住','西新井']);
  if(activeBranches.has('hanzomon')) candidates.push(['曳舟','東向島']);
  if(activeBranches.has('nikko')) candidates.push(['和戸','東武動物公園']);

  for(const [from,to] of candidates){
    const start=trainTimeAtMainStation(t,from);
    const end=trainTimeAtMainStation(t,to);
    if(!Number.isFinite(start)||!Number.isFinite(end))continue;
    let endAbs=end;
    if(endAbs<start)endAbs+=1440;
    return {start,end:endAbs,from,to};
  }
  return null;
}

function branchHiddenAtTime(t,minutes){
  const w=branchHiddenWindow(t);
  if(!w)return false;
  let m=Number(minutes);
  if(m<w.start)m+=1440;
  return m>=w.start && m<w.end;
}

function trainPosition(t,minutes){
  const stops=t.stops||[];if(stops.length<2)return null;
  // 通過駅を含む列車は、通過予定時刻を補間して分岐線表示中の非表示区間を判定する。
  // そのため「前駅→後駅」の停車駅ペアが存在しなくても、適切な時刻に表示へ復帰する。
  if(branchHiddenAtTime(t,minutes)) return null;
  let m=minutes;
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];let t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
    if(t1<t0)t1+=1440;
    let mm=m;if(mm<t0)mm+=1440;
    if(mm>=t0&&mm<=t1){
      const pair=findVisualRowPair(a.station,b.station,t);
      if(!pair)return null;
      const q=(t1-t0)?(mm-t0)/(t1-t0):0;
      const clampedQ=Math.max(0,Math.min(1,q));
      // 枝線表示中は、本線の隣接駅の間に枝線の駅行が多数挿入される。
      // そのままDOM行番号を線形補間すると、本線列車が半蔵門線・田園都市線・日比谷線の
      // 表示領域を横切ってしまうため、枝線が挿入された大きな空白区間を跨ぐ本線列車は
      // 「本線側の入口→本線側の出口」だけを使って描画する。
      const visualGap=pair.r1-pair.r0;
      let visualPos;
      if(t.service==='chijou'||t.service==='tokkyu'){
        if(visualGap>2){
          // 本線駅の間に分岐線の駅が大量に挿入される区間では、
          // DOM上の駅番号をそのまま補間すると本線列車が分岐線の駅列の上に表示される。
          // 本線側の駅の直後／直前だけを走行表示領域として使い、中央の分岐線ブロックは飛ばす。
          // 0.45行以内に収めることで、隣接する分岐線駅の中央位置へ入らないようにする。
          const safeOffset=0.45;
          if(clampedQ<0.5){
            const q=clampedQ/0.5;
            visualPos=pair.r0+q*safeOffset;
          }else{
            const q=(clampedQ-0.5)/0.5;
            visualPos=(pair.r1-safeOffset)+(q*safeOffset);
          }
        }else{
          visualPos=pair.r0+(pair.r1-pair.r0)*clampedQ;
        }
      }else{
        visualPos=pair.r0+(pair.r1-pair.r0)*clampedQ;
      }
      return {pos:visualPos,a:pair.r0,b:pair.r1,stationA:a.station,stationB:b.station};
    }
  }
  return null;
}
function findVisualRowIndex(name,after=-1){
  const rows=[...document.querySelectorAll('.station-row')];
  for(let i=Math.max(0,after+1);i<rows.length;i++)if(rows[i].querySelector('.station-name-ja')?.textContent===name)return i;
  return -1;
}
function routeKeyForTrainStation(t,name){
  const service=String(t?.service||'');
  if(service==='hanzomon'){
    if(DENENTOSHI_NAMES.includes(name) && name!=='渋谷') return 'denentoshi';
    if(HANZOMON_NAMES.includes(name) && name!=='押上') return 'hanzomon';
    return 'main';
  }
  if(service==='hibiya'){
    if(HIBIYA_NAMES.includes(name) && name!=='北千住') return 'hibiya';
    return 'main';
  }
  if(service==='nikko'){
    if(NIKKO_NAMES.includes(name) && name!=='東武動物公園') return 'nikko';
    return 'main';
  }
  return 'main';
}

// 枝線の区間に入れる列車をサービス単位で厳密に制限する。
// 共有駅を含む境界区間（北千住→南千住、曳舟→押上、渋谷→池尻大橋）もここで判定する。
function segmentServiceAllowed(t,aName,bName){
  const service=String(t?.service||'');
  const a=String(aName||''), b=String(bName||'');
  const pair=[a,b].sort().join('|');

  // 本線と枝線の境界を含め、枝線側へ入れるサービスを明示する。
  // 北千住は日比谷線にも半蔵門線側にも現れる共有駅なので、
  // 「北千住が含まれる」だけでは日比谷線扱いにしない。
  const hibiyaOnly =
    (HIBIYA_NAMES.includes(a) && a!=='北千住') ||
    (HIBIYA_NAMES.includes(b) && b!=='北千住') ||
    pair==='北千住|南千住';

  const hanzomonOnly =
    (HANZOMON_NAMES.includes(a) && a!=='押上') ||
    (HANZOMON_NAMES.includes(b) && b!=='押上') ||
    pair==='北千住|押上' || pair==='押上|錦糸町';

  const denentoshiOnly =
    (DENENTOSHI_NAMES.includes(a) && a!=='渋谷') ||
    (DENENTOSHI_NAMES.includes(b) && b!=='渋谷') ||
    pair==='渋谷|池尻大橋';

  if(hibiyaOnly) return service==='hibiya';
  if(hanzomonOnly || denentoshiOnly) return service==='hanzomon';
  return true;
}
function visualRouteKeysForSegment(t,aName,bName){
  const service=String(t?.service||'');
  const a=String(aName||''), b=String(bName||'');
  const pair=[a,b].sort().join('|');
  if(service==='hibiya'){
    if(pair==='北千住|南千住') return ['main','hibiya'];
    if(HIBIYA_NAMES.includes(a)&&HIBIYA_NAMES.includes(b)) return ['hibiya','hibiya'];
  }
  if(service==='hanzomon'){
    if(pair==='曳舟|押上') return ['main','hanzomon'];
    if(pair==='押上|錦糸町') return ['hanzomon','hanzomon'];
    if(a==='錦糸町'||b==='錦糸町'||(HANZOMON_NAMES.includes(a)&&HANZOMON_NAMES.includes(b))) return ['hanzomon','hanzomon'];
    if(pair==='渋谷|池尻大橋') return ['hanzomon','denentoshi'];
    if(DENENTOSHI_NAMES.includes(a)&&DENENTOSHI_NAMES.includes(b)) return ['denentoshi','denentoshi'];
  }
  if(service==='nikko'){
    if(NIKKO_NAMES.includes(a)&&NIKKO_NAMES.includes(b)) return ['nikko','nikko'];
    if(pair==='東武動物公園|杉戸高野台') return ['nikko','main'];
  }
  return null;
}
function findVisualRowPair(aName,bName,t=null){
  const rows=[...document.querySelectorAll('.station-row')];
  if(!segmentServiceAllowed(t,aName,bName)) return null;
  const forced=visualRouteKeysForSegment(t,aName,bName);
  // 地上運用・特急は本線上の駅間だけを使用する。
  // 同名駅の分岐線側DOMを誤って拾わないよう、本線系統は常に main/main を固定する。
  const mainOnly=(t?.service==='chijou'||t?.service==='tokkyu');
  const routeA=mainOnly?'main':(forced?forced[0]:routeKeyForTrainStation(t,aName));
  const routeB=mainOnly?'main':(forced?forced[1]:routeKeyForTrainStation(t,bName));
  const A=[],B=[];
  rows.forEach((r,i)=>{
    const n=r.querySelector('.station-name-ja')?.textContent||'';
    const rk=r.dataset.routeKey||'main';
    if(n===aName && (!routeA || rk===routeA)) A.push(i);
    if(n===bName && (!routeB || rk===routeB)) B.push(i);
  });
  if(!A.length||!B.length)return null;
  let best=null,bestGap=Infinity;
  for(const a of A)for(const b of B){
    const gap=Math.abs(b-a);
    if(gap<bestGap){bestGap=gap;best={r0:a,r1:b};}
  }
  return best;
}
function segmentTouchesMainRange(t){
  const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住');
  const lo=Math.min(k,n),hi=Math.max(k,n);
  return (t.stops||[]).some(s=>{const x=MAIN_NAMES.indexOf(s.station);return x>=lo&&x<=hi;});
}
function trainServiceRank(t){
  const type=String(t?.type||'');
  if(type==='特急')return 4;
  if(type==='THライナー')return 4;
  if(type==='急行')return 3;
  if(type==='区間急行')return 2;
  return 1;
}
function isPassingOvertake(t,p,minutes){
  if(t.type==='THライナー'||t.service==='hibiya'||t.service==='hanzomon')return false;
  if(!['特急','急行','区間急行'].includes(String(t.type||'')))return false;
  const myRank=trainServiceRank(t);
  const myPos=p?.pos;
  if(!Number.isFinite(myPos))return false;
  const myDir=String(t.direction||'');
  const myStart=myPos;
  // 同方向・同じ区間を走る下位種別列車が近接しているときだけ追越しレーンへ。
  for(const otherBase of TRAINS){
    if(otherBase===t)continue;
    if(String(otherBase.direction||'')!==myDir)continue;
    if(trainServiceRank(otherBase)>=myRank)continue;
    if(!['普通','区間急行'].includes(String(otherBase.type||'')))continue;
    const other=liveTrain(otherBase.no)||otherBase;
    const op=trainPosition(other,minutes);
    if(!op)continue;
    if(!(op.stationA===p.stationA||op.stationA===p.stationB||op.stationB===p.stationA||op.stationB===p.stationB))continue;
    const gap=Math.abs(op.pos-myStart);
    if(gap<=1.25)return true;
  }
  return false;
}
function laneForTrain(t,p,minutes){
  const a=MAIN_NAMES.indexOf(p.stationA),b=MAIN_NAMES.indexOf(p.stationB);
  const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住'),x=MAIN_NAMES.indexOf('西新井');
  const lo=Math.min(k,n),hi=Math.max(k,n);
  const touches=a>=0&&b>=0&&Math.min(a,b)<=hi&&Math.max(a,b)>=lo;
  if(!touches)return 0;
  // 日比谷線直通は北越谷～北千住で常に基準位置。
  if(t.service==='hibiya')return 0;
  // THライナー：北千住～西新井は内側、西新井～北越谷は外側。
  if(t.type==='THライナー'){
    const ns=Math.max(x,n),ss=Math.min(x,n);
    const mid=(a+b)/2;
    return mid>=ss&&mid<=ns?0:1;
  }
  // まず通常の外側レーン。実際に追越し中だけ、さらに外側へ。
  if(isPassingOvertake(t,p,minutes))return 2;
  return 1;
}
function trainLabelClass(t){return getExpressClass(t)+(t.type==='THライナー'?' th-liner':'');}
function trainAllowedOnRouteStation(t,routeKey,stationName){
  const stops=Array.isArray(t?.stops)?t.stops:[];
  if(!stops.some(s=>String(s?.station||'')===String(stationName))) return false;
  const service=String(t?.service||'');
  if(routeKey==='denentoshi') return service==='hanzomon';
  if(routeKey==='hanzomon') return service==='hanzomon';
  if(routeKey==='hibiya') return service==='hibiya';
  if(routeKey==='nikko') return service==='nikko';
  return true;
}
function serviceTopologyValid(t){
  const service=String(t?.service||'');
  const stops=(t?.stops||[]).map(s=>String(s?.station||''));
  // 北千住・押上・東武動物公園は本線との境界共有駅なので、
  // これらだけでは枝線直通列車とは判定しない。
  const hasHanzomon=stops.some(n=>HANZOMON_NAMES.includes(n) && n!=='押上');
  const hasDenentoshi=stops.some(n=>DENENTOSHI_NAMES.includes(n) && n!=='渋谷');
  const hasHibiya=stops.some(n=>HIBIYA_NAMES.includes(n) && n!=='北千住');
  const hasNikko=stops.some(n=>NIKKO_NAMES.includes(n) && n!=='東武動物公園');
  if((hasHanzomon||hasDenentoshi) && service!=='hanzomon') return false;
  if(hasHibiya && service!=='hibiya') return false;
  if(hasNikko && service!=='nikko') return false;
  // 半蔵門線直通列車は押上を境に田園都市線へ連続して入れる。
  if(service==='hanzomon' && !hasHanzomon && !hasDenentoshi) return false;
  if(service==='hibiya' && !hasHibiya) return false;
  if(service==='nikko' && !hasNikko) return false;
  return true;
}
function trainAllowedOnVisibleBranch(t,stationName){
  const stops=Array.isArray(t?.stops)?t.stops:[];
  const actuallyStops=stops.some(s=>String(s?.station||'')===String(stationName));
  if(!actuallyStops) return false;
  if(DENENTOSHI_NAMES.includes(stationName) || HANZOMON_NAMES.includes(stationName)) return t.service==='hanzomon';
  if(HIBIYA_NAMES.includes(stationName) && stationName!=='北千住') return t.service==='hibiya';
  if(NIKKO_NAMES.includes(stationName) && stationName!=='東武動物公園') return t.service==='nikko';
  return true;
}
function currentRowIndexForStation(name){const rows=[...document.querySelectorAll('.station-row')];return rows.findIndex(r=>r.querySelector('.station-name-ja')?.textContent===name);}
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');if(!layer)return;layer.innerHTML='';
  const rows=[...document.querySelectorAll('.station-row')];if(!rows.length)return;
  const minutes=currentMinutes();
  const visible=[];
  const seen=new Set();
  for(const base of TRAINS){
    if(!base || !Array.isArray(base.days) || !base.days.includes(currentDay)) continue;
    const no=String(base.no||'');
    const signature=`${String(base.service||'')}|${no}|${String(base.direction||'')}`;
    if(!no || seen.has(signature)) continue;
    seen.add(signature);
    visible.push(liveTrain(no)||base);
  }
  const occupied={left:[],right:[]};
  for(const t of visible){
    // 路線系統の停車駅構成を先に検証する。これで本線列車が半蔵門線・田園都市線・日比谷線へ混入することを防ぐ。
    if(!serviceTopologyValid(t)) continue;
    const p=trainPosition(t,minutes);if(!p||!p.stationA||!p.stationB)continue;
    if(!segmentServiceAllowed(t,p.stationA,p.stationB))continue;
    const pair=findVisualRowPair(p.stationA,p.stationB,t);
    if(!pair)continue;
    const pairRows=[rows[pair.r0],rows[pair.r1]];
      if(pairRows.some(r=>r?.dataset?.routeKey && r.dataset.routeKey!=='main')){
      const allowed=pairRows.every(r=>trainAllowedOnRouteStation(t,r.dataset.routeKey,pairRows[0]===r?p.stationA:p.stationB));
      if(!allowed) continue;
    }
    // 本線系統（地上・特急）は枝線行を絶対に走行しない。
    if((t.service==='chijou'||t.service==='tokkyu') && pairRows.some(r=>r?.dataset?.routeKey!=='main')) continue;
    if(!trainAllowedOnVisibleBranch(t,p.stationA)||!trainAllowedOnVisibleBranch(t,p.stationB))continue;
    const laneBase=laneForTrain(t,p,minutes);
    // 列車アイコンの表示側は野田線版と同じく列車の進行方向で固定。
    // 左＝館林方面（下り）、右＝浅草方面（上り）。
    // 駅名・行先の順序から再判定すると、枝線直通列車や途中駅始発で
    // 反転することがあるため、ダミー列車の direction を唯一の基準にする。
    // メイン線上では、実際に走っている駅間の順序から左右を決定する。
    // MAIN_NAMES は 館林→浅草 の順なので、駅番号が減る方向＝館林方面(左)、
    // 増える方向＝浅草方面(右)。これにより direction 値が誤っていても、
    // 浅草方面列車が館林側へ混入するのを防ぐ。枝線区間では direction を使用する。
    const ai=MAIN_NAMES.indexOf(p.stationA), bi=MAIN_NAMES.indexOf(p.stationB);
    let side=null;
    if(ai>=0 && bi>=0 && ai!==bi){
      side=bi<ai ? 'left' : 'right';
    }else{
      const dir=String(t.direction||'').toLowerCase();
      side=dir==='down' ? 'left' : dir==='up' ? 'right' : null;
    }
    if(!side) continue;
    occupied[side].push({t,pos:p.pos,baseLane:laneBase});
  }
  const layerRect=layer.getBoundingClientRect(),layoutWidth=window.innerWidth<960?1920:layerRect.width||1920;
  const centerX=layoutWidth/2,trainWidth=66,laneGap=20;
  const rowRectAt=pos=>{const p=Math.max(0,Math.min(rows.length-1,pos)),i0=Math.floor(p),i1=Math.min(rows.length-1,Math.ceil(p));const r0=rows[i0].getBoundingClientRect(),r1=rows[i1].getBoundingClientRect(),f=p-i0;return {centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f};};
  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      // 3本目(lane 2)は追越し専用。単なる列車同士の重なり回避では使用しない。
      const canUsePassingLane=item.baseLane===1 && isPassingOvertake(item.t,trainPosition(item.t,minutes),minutes);
      let lane=item.baseLane;
      if(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane) && canUsePassingLane){
        lane=2;
        // 追越し列車同士が重なっても3本目を4本目へ拡張しない。
        if(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===2)) lane=1;
      }
      used.push({pos:item.pos,lane});
      const rr=rowRectAt(item.pos);if(!rr)return;
      const t=item.t,el=document.createElement('div');el.className=`train-icon ${side}`;el.style.visibility='hidden';el.style.transition='none';
      const formParts=formationDisplayParts(t.formation);
      el.innerHTML=`<span class="train-no">${esc(displayTrainNo(t))}</span><img src="${esc(trainImageFor(t))}" alt="${esc(displayTrainNo(t))}">${formParts.length?`<span class="train-no train-formation">${formParts.map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:''}<span class="train-label ${trainLabelClass(t)}"><span>${esc(mainShortType(t))} ${esc(mainShortDest(t.dest))}</span></span>`;
      const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
      const img=el.querySelector('img'),noEl=el.querySelector('.train-no'),formationEl=el.querySelector('.train-formation');
      const laneOffset=lane*(trainWidth+laneGap);
      const leftPos=side==='left'?centerX-340-laneOffset:centerX+340-trainWidth+laneOffset;
      el.style.left=`${leftPos}px`;el.style.right='auto';el.style.setProperty('--lane-shift','0px');
      el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openTrainSheet(t.no);});
      layer.appendChild(el);
      const apply=()=>{
        const ir=img?.getBoundingClientRect(),nr=noEl?.getBoundingClientRect(),fr=formationEl?.getBoundingClientRect();
        const ih=(ir?.height||60)/mobileZoom,nh=(nr?.height||12)/mobileZoom,fh=(fr?.height||0)/mobileZoom;
        const desired=(rr.centerY-layerRect.top)/mobileZoom;
        el.style.top=`${desired-(nh+ih+fh)/2}px`;el.style.visibility='visible';
      };
      if(img?.complete&&img.naturalWidth)apply();else img?.addEventListener('load',apply,{once:true});
    });
  });
}

/* 初期化 */
function initStationSheetEvents(){
  document.getElementById('closeBtn').addEventListener('click',closeSheet);
  document.getElementById('overlay').addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
}
async function init(){
  initDateTimeControls();loadLocal();render();initStationSheetEvents();await initFirebase();render();renderTrainPositions();
  setInterval(()=>{if(followNow){const input=document.getElementById('timeInput');if(input)input.value=formatTimeNow();const op=operationDateKey();if(selectedDateKey!==op)setSelectedDate(op);}renderTrainPositions();},1000);
}
init();
