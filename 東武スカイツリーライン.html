function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function formationById(id){
  if(!id||id===INITIAL_FORMATION_SELECTION.id)return null;
  for(const g of FORMATIONS){
    if(g.type===id)return {id:g.type,name:g.type,img:g.typeImg,kind:'type',type:g.type};
    const f=(g.items||[]).find(x=>x.id===String(id));
    if(f)return {...f,type:g.type};
  }
  return null;
}
function selectionDisplayObject(id){return formationById(id)||INITIAL_FORMATION_SELECTION;}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase().replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!raw)return {ok:false,error:'車両番号または編成番号を入力してください。'};
  const candidates=[raw,raw.endsWith('F')?raw.slice(0,-1):raw,raw+'F'];
  for(const c of candidates){const f=formationById(c);if(f&&f.kind!=='type')return {ok:true,id:f.id};}
  const normalized=raw.replace(/[^A-Z0-9]/g,'').replace(/F$/,'');
  for(const g of FORMATIONS) for(const f of g.items||[]){
    /* 7両編成の各車両番号を許容（例 71701～77701） */
    const base=String(f.id);
    for(let k=0;k<7;k++) if(String(Number(base)+k*1000)===normalized) return {ok:true,id:f.id};
  }
  return {ok:false,error:`車両番号・編成番号「${raw}」に該当する編成が見つかりません。`};
}
function formationDisplayParts(id){
  const f=selectionDisplayObject(id); if(!f||f.id===INITIAL_FORMATION_SELECTION.id)return [];
  return f.type && f.name.startsWith(f.type) ? [f.type,f.name.slice(f.type.length).trim()].filter(Boolean) : [f.name];
}
function formationDisplayHTML(id){return formationDisplayParts(id).map(x=>`<span>${esc(x)}</span>`).join('');}
function trainImageFor(t){return selectionDisplayObject(t?.formation).img||INITIAL_FORMATION_SELECTION.img;}

/* ダミー時刻 */
function timeToMinutes(s){
  const [h,m]=String(s).split(':').map(Number);
  return (h||0)*60+(m||0);
}
function fmtMinutes(v){
  v=((v%1440)+1440)%1440;
  return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.round(v%60)).padStart(2,'0');
}
function travelStops(names,start,rapid=false){
  const out=[]; let cur=start;
  names.forEach((station,i)=>{if(i===0)out.push({station,time:fmtMinutes(cur)});else{cur+=(rapid?2:3);out.push({station,time:fmtMinutes(cur)});}});
  return out;
}
function mainBetween(a,b){
  const ia=MAIN_NAMES.indexOf(a),ib=MAIN_NAMES.indexOf(b); if(ia<0||ib<0)return [];
  const step=ia<=ib?1:-1,r=[];for(let i=ia;;i+=step){r.push(MAIN_NAMES[i]);if(i===ib)break;}return r;
}
const TRAINS=[];
const OP_START=3*60;
const OP_END=27*60;
const DEPARTURES_PER_SYSTEM=200;
function fmtMinutes(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.round(v%60)).padStart(2,'0');}
function addGeneratedTrain(no,type,direction,stops,service,defaultCars='7両',opts={}){
  TRAINS.push({no,type,direction,days:['平日','休日'],start:stops[0].station,dest:stops[stops.length-1].station,stops,defaultCars,formation:opts.formation||null,service});
}
function mainRange(a,b){
  const ia=MAIN_NAMES.indexOf(a),ib=MAIN_NAMES.indexOf(b);if(ia<0||ib<0)return [];
  const step=ia<=ib?1:-1,out=[];for(let i=ia;;i+=step){out.push(MAIN_NAMES[i]);if(i===ib)break;}return out;
}
function buildTimedStops(names,startMin,increment){
  let t=startMin;
  return names.map((station,i)=>{if(i>0)t+=increment;return {station,time:fmtMinutes(t)};});
}
function depTime(i,span){return Math.round(OP_START+5+(span-5)*(i/(DEPARTURES_PER_SYSTEM-1)));}
const SYSTEM_STARTS={chijou:0,hibiya:0,hanzomon:0,tokkyu:0};
function makeChijou(i,dir){
  const up=dir==='up';
  const names=up?mainRange('久喜','浅草'):mainRange('浅草','久喜');
  const express=(i%4===1)||(i%13===0);
  const stopNames=express?names.filter(x=>['久喜','東武動物公園','春日部','北千住','草加','新越谷','越谷','北越谷','浅草'].includes(x)):names;
  const step=express?2.7:3.1;
  return [express?'急行':'普通',buildTimedStops(stopNames,0,step),express?'急行共通':'地上普通共通'];
}
function makeTokkyu(i,dir){
  const names=dir==='up'?['館林','久喜','東武動物公園','春日部','北千住','浅草']:['浅草','北千住','春日部','東武動物公園','久喜','館林'];
  return ['特急',buildTimedStops(names,0,5.2),'特急共通'];
}
function makeHibiya(i,dir){
  const regularUp=[...mainRange('北越谷','北千住'),...HIBIYA_NAMES.slice(1)];
  const regularNames=dir==='up'?regularUp:regularUp.slice().reverse();
  const isTH=(i%20===0)||(i%20===1);
  if(isTH){
    const thUp=[...mainRange('久喜','北千住'),...HIBIYA_NAMES.slice(1,19)];
    const thNames=dir==='up'?thUp:thUp.slice().reverse();
    return ['THライナー',buildTimedStops(thNames,0,3.0),'THライナー共通'];
  }
  return ['普通',buildTimedStops(regularNames,0,2.8),'日比直共通'];
}
function makeHanzomon(i,dir){
  const upNames=[...mainRange('久喜','曳舟'),...HANZOMON_NAMES,...DENENTOSHI_NAMES.slice(1)];
  const names=dir==='up'?upNames:upNames.slice().reverse();
  return ['急行',buildTimedStops(names,0,2.8),'半直共通'];
}
const MAKERS={
  chijou:{maker:makeChijou,safeSpan:18*60-60},
  hibiya:{maker:makeHibiya,safeSpan:18*60-70},
  hanzomon:{maker:makeHanzomon,safeSpan:18*60-80},
  tokkyu:{maker:makeTokkyu,safeSpan:18*60-30}
};
for(const service of ['chijou','hibiya','hanzomon','tokkyu']){
  const {maker,safeSpan}=MAKERS[service];
  for(let i=0;i<DEPARTURES_PER_SYSTEM;i++){
    const dir=i%2===0?'up':'down';
    const [type,templateStops,cars]=maker(i,dir);
    const step=type==='特急'?5.2:type==='THライナー'?3.0:service==='hanzomon'?2.8:service==='hibiya'?2.8:(type==='急行'?2.7:3.1);
    const maxStart=OP_END-(templateStops.length-1)*step-1;
    const start=OP_START+5+(maxStart-(OP_START+5))*(i/(DEPARTURES_PER_SYSTEM-1));
    const stops=buildTimedStops(templateStops.map(x=>x.station),start,step);
    const prefix=service==='tokkyu'?'L':service==='chijou'?'G':service==='hibiya'?'H':'Z';
    const no=`${prefix}${String(i+1).padStart(3,'0')}`;
    addGeneratedTrain(no,type,dir,stops,service,cars);
  }
}

function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function operationDateKey(d=new Date()){const x=new Date(d);if(x.getHours()<RESET_HOUR)x.setDate(x.getDate()-1);return todayKey(x);}
function scheduleDayForKey(key){const d=new Date(`${key}T00:00:00`);return [0,6].includes(d.getDay())?'休日':'平日';}

function liveTrain(no){
  const base=TRAINS.find(t=>String(t.no)===String(no)); if(!base)return null;
  const form=registrationState[currentDay]?.[String(no)]||null;
  return {...base,formation:form};
}

function syncStatus(text){document.querySelectorAll('#syncStatus').forEach(e=>e.textContent='共有同期：'+text);}

function firebaseRefForTrain(train){
  const key=trainGroupKey(train),db=firebaseDbs[key];
  return db?db.ref('運用'):null;
}
async function initFirebase(){
  loadLocal();
  if(!window.firebase?.initializeApp){syncStatus('Firebaseライブラリ未接続');return;}
  try{
    for(const [key,info] of Object.entries(FIREBASE_PROJECTS)){
      const app=firebase.apps.find(a=>a.name===info.appName)||firebase.initializeApp(info.config,info.appName);
      firebaseApps[key]=app;firebaseDbs[key]=firebase.database(app);
      const ref=firebaseDbs[key].ref('運用');
      ref.on('value',snap=>{
        const root=snap.val()||{};
        remoteByProject[key]=root;
        const states=root.stateByDay||root;
        for(const day of ['平日','休日']){
          if(states?.[day]&&typeof states[day]==='object') registrationState[day]={...(registrationState[day]||{}),...states[day]};
        }
        const ts=root.formationUpdatedAtByDay||{};
        for(const day of ['平日','休日']){
          if(ts?.[day]&&typeof ts[day]==='object') formationUpdatedAt[day]={...(formationUpdatedAt[day]||{}),...ts[day]};
        }
        saveLocal();renderTrainPositions();if(currentTrainNo&&!isEditMode)updateSheetContent();syncStatus('Firebase同期済み');
      },()=>syncStatus('Firebase読込失敗'));
    }
    firebaseReady=true;syncStatus('Firebase接続済み');
  }catch(e){console.error(e);syncStatus('Firebase初期化失敗');}
}
async function recordSelection(train,formId){
  if(!selectedIsCurrentOperation())return;
  const day=currentDay,key=String(train.no);
  registrationState[day]=registrationState[day]||{};
  formationUpdatedAt[day]=formationUpdatedAt[day]||{};
  const value=formId&&formId!==INITIAL_FORMATION_SELECTION.id?String(formId):null;
  if(value){registrationState[day][key]=value;formationUpdatedAt[day][key]=new Date().toISOString();}
  else{delete registrationState[day][key];delete formationUpdatedAt[day][key];}
  saveLocal();renderTrainPositions();updateSheetContent();
  const ref=firebaseRefForTrain(train);
  if(firebaseReady&&ref){
    try{
      await ref.child('stateByDay').child(day).update({[key]:value});
      await ref.child('formationUpdatedAtByDay').child(day).update({[key]:value?formationUpdatedAt[day][key]:null});
      syncStatus('Firebase同期済み');
    }catch(e){console.error(e);syncStatus('Firebase書込失敗（ローカル保存済み）');}
  }else syncStatus('ローカル保存済み');
}

function buildScreenRows(){
  const rows=[],push=(st,routeKey,opt={})=>rows.push({st,routeKey,opt:{...opt}});
  const main=ROUTES.main.stations;
  for(let i=0;i<main.length;i++){
    const st=main[i],next=main[i+1],prev=main[i-1],opt=buttonSpecForMain(st);

    opt.lineTop=prev?edgeColor('main',prev,st):'transparent';opt.lineBottom=next?edgeColor('main',st,next):'transparent';opt.stationColor=next?edgeColor('main',st,next):edgeColor('main',prev,st);

    push(st,'main',opt);
    if(st[0]==='北千住'&&activeBranches.has('hibiya')){
      ROUTES.hibiya.stations.slice(1).forEach((x,j)=>push(x,'hibiya',{lineTop:COLORS.hibiya,lineBottom:COLORS.hibiya,stationColor:COLORS.hibiya,cutBelow:j===ROUTES.hibiya.stations.length-2}));
      if(next){const no=buttonSpecForMain(next);no.fadeUp=true;no.fadeColor=COLORS.sky;no.breakBefore=true;push(next,'main',no);i++;}
    }
    if(st[0]==='曳舟'&&activeBranches.has('hanzomon')){
      ROUTES.hanzomon.stations.forEach((x,j)=>push(x,'hanzomon',{lineTop:j===0?COLORS.sky:COLORS.hanzomon,lineBottom:COLORS.hanzomon,stationColor:COLORS.hanzomon}));
      ROUTES.denentoshi.stations.slice(1).forEach((x,j)=>push(x,'denentoshi',{lineTop:COLORS.denentoshi,lineBottom:COLORS.denentoshi,stationColor:COLORS.denentoshi,cutBelow:j===ROUTES.denentoshi.stations.length-2}));
      if(next){const no=buttonSpecForMain(next);no.fadeUp=true;no.fadeColor=COLORS.sky;no.breakBefore=true;no.branchReturn=true;push(next,'main',no);i++;}
    }
  }
  for(let i=0;i<rows.length;i++){
    const r=rows[i],p=rows[i-1],n=rows[i+1],pb=r.opt.breakBefore||p?.opt?.breakAfter,nb=r.opt.breakAfter||n?.opt?.breakBefore;
    if(!pb&&p)r.opt.lineTop=screenEdgeColor(p,r);else if(pb||!p)r.opt.lineTop='transparent';
    if(!nb&&n)r.opt.lineBottom=screenEdgeColor(r,n);else if(nb||!n)r.opt.lineBottom='transparent';
  }
  return rows;
}
function render(){
  const lc=document.getElementById('lineContainer');lc.innerHTML='<div class="moving-train-layer" id="movingTrainLayer"></div>';
  buildScreenRows().forEach(r=>lc.appendChild(createRow(r.st,r.routeKey,r.opt)));
  renderTrainPositions();
}
function toggleBranch(key){if(activeBranches.has(key))activeBranches.delete(key);else activeBranches.add(key);const y=scrollY;render();requestAnimationFrame(()=>scrollTo({top:y,behavior:'auto'}));}

/* 駅情報 */
function routeDirectionLabels(routeKey,st){
  if(routeKey==='hibiya')return ['中目黒方面','北千住方面'];
  if(routeKey==='hanzomon')return st[0]==='押上'?['渋谷方面','久喜・南栗橋方面']:st[0]==='渋谷'?['中央林間方面','押上方面']:['渋谷方面','押上方面'];
  if(routeKey==='denentoshi')return ['中央林間方面','渋谷方面'];
  if(routeKey==='nikko')return ['浅草・押上方面','南栗橋方面'];
  const i=MAIN_NAMES.indexOf(st[0]);const z=MAIN_NAMES.indexOf('東武動物公園'),k=MAIN_NAMES.indexOf('北千住');
  if(i>=0&&i<z)return ['浅草・押上方面','久喜方面'];
  if(i===z)return ['浅草・押上方面','久喜・南栗橋方面'];
  if(i>z&&i<=k)return ['浅草・押上・中目黒方面','久喜・南栗橋方面'];
  if(st[0]==='曳舟')return ['浅草・押上方面','久喜・南栗橋方面'];
  return ['浅草方面','久喜・南栗橋方面'];
}
function stationScreenNeighbors(st,routeKey){
  const rows=buildScreenRows(),idx=rows.findIndex(r=>r.routeKey===routeKey&&r.st[0]===st[0]);if(idx<0)return {prev:null,next:null,prevColor:null,nextColor:null};
  const cur=rows[idx],p=rows[idx-1],n=rows[idx+1],prevBreak=cur.opt.breakBefore||p?.opt?.breakAfter,nextBreak=cur.opt.breakAfter||n?.opt?.breakBefore;
  return {prev:(!prevBreak?p:null),next:(!nextBreak?n:null),prevColor:(!prevBreak&&p)?screenEdgeColor(p,cur):null,nextColor:(!nextBreak&&n)?screenEdgeColor(cur,n):null};
}
function stationTimetableEntries(st,routeKey,direction){
  const name=st[0],dir=direction==='down'?'down':'up';
  return TRAINS.filter(t=>t.days.includes(currentDay)&&t.direction===dir&&(t.stops||[]).some(s=>s.station===name))
    .sort((a,b)=>timeToMinutes(a.stops.find(s=>s.station===name)?.time)-timeToMinutes(b.stops.find(s=>s.station===name)?.time));
}
function trainRowHTML(t,st){
  const s=t.stops.find(x=>x.station===st[0]),form=selectionDisplayObject(registrationState[currentDay]?.[String(t.no)]),parts=formationDisplayParts(form.id);
  return `<div class="station-timetable-row" tabindex="0" onclick="openTrainSheet('${esc(t.no)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTrainSheet('${esc(t.no)}')}"><img class="station-timetable-train-img" src="${esc(form.img)}"><div class="station-timetable-formation">${formationDisplayHTML(form.id)}</div><div class="station-timetable-type ${getExpressClass(t)}">${esc(t.type)}</div><div class="station-timetable-time">${esc(s?.time||'')}</div><div class="station-timetable-destination"><span class="station-timetable-destination-station">${esc(t.dest)}</span></div></div>`;
}
function updateStationSheetContent(){
  const found=stationById(currentStationId),content=document.getElementById('sheetContent');if(!found||!content)return;
  const {routeKey,st}=found,{prev,next,prevColor,nextColor}=stationScreenNeighbors(st,routeKey),labels=routeDirectionLabels(routeKey,st);
  content.style.setProperty('--primary',nextColor||lineColorFor(routeKey));content.style.setProperty('--primary-dark',nextColor||lineColorFor(routeKey));
  const split=prevColor&&nextColor&&prevColor!==nextColor?' split':'';
  const bar=`<div class="station-direction-bar${!prev?' no-prev':''}${!next?' no-next':''}${split}" style="--bar-left:${prevColor||nextColor||lineColorFor(routeKey)};--bar-right:${nextColor||prevColor||lineColorFor(routeKey)}"></div>`;
  const entries=stationTimetableEntries(st,routeKey,stationTimetableDirection);
  content.innerHTML=`<div class="station-overview-card station-info-card"><div class="station-overview-main"><div class="station-overview-name-ja">${esc(st[0])}</div><div class="station-overview-name-en">${esc(st[1])}</div></div><div class="station-direction-bar-wrap">${bar}</div><div class="station-neighbor-row"><div class="station-neighbor left${prev?'':' empty'}"><div class="station-neighbor-name-ja">${esc(prev?.st?.[0]||'')}</div><div class="station-neighbor-name-en">${esc(prev?.st?.[1]||'')}</div></div><div class="station-neighbor right${next?'':' empty'}"><div class="station-neighbor-name-ja">${esc(next?.st?.[0]||'')}</div><div class="station-neighbor-name-en">${esc(next?.st?.[1]||'')}</div></div></div></div><div class="timetable-list"><div class="station-timetable-title">時刻表</div><div class="station-timetable-direction-tabs"><button class="station-timetable-direction-tab ${stationTimetableDirection==='up'?'active':''}" onclick="setStationTimetableDirection('up')">${esc(labels[0])}</button><button class="station-timetable-direction-tab ${stationTimetableDirection==='down'?'active':''}" onclick="setStationTimetableDirection('down')">${esc(labels[1])}</button></div>${entries.length?`<div class="station-timetable-frame"><div class="station-timetable-wrap">${entries.map(t=>trainRowHTML(t,st)).join('')}</div></div>`:'<div class="station-timetable-empty">該当する列車はありません</div>'}</div>`;
}
function setStationTimetableDirection(d){stationTimetableDirection=d==='down'?'down':'up';updateStationSheetContent();}
function openStationSheet(st,routeKey){currentStationId=stationId(routeKey,st);stationTimetableDirection='up';isEditMode=false;document.getElementById('sheetHeaderTitle').textContent='駅情報';updateStationSheetContent();document.getElementById('overlay').style.display='block';document.getElementById('bottomSheet').classList.add('active');}
function closeSheet(){document.getElementById('overlay').style.display='none';document.getElementById('bottomSheet').classList.remove('active','editing');currentStationId=null;currentTrainNo=null;isEditMode=false;}

/* 列車詳細・編成入力 */
function timetableRowsHTML(stops){
  let html='';
  for(let i=0;i<stops.length;){
    const station=stops[i].station;const times=[stops[i].time];let j=i+1;
    while(j<stops.length&&stops[j].station===station){times.push(stops[j].time);j++;}
    const shown=(times.length>1&&times[0]!==times[1])?times.slice(0,2):[times[0]];
    html+=`<div class="timetable-item"><div class="time-dot"></div><div class="time-text${shown.length>1?' two-line':''}">${shown.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="station-text">${esc(station)}</div></div>`;i=j;
  }
  return html;
}
function formatFormationUpdatedAt(no){const ts=formationTimestamp(no);if(!ts)return '';const d=new Date(ts);return Number.isNaN(d.getTime())?'':`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function updateSheetContent(){
  if(currentStationId){updateStationSheetContent();return;}
  const train=liveTrain(currentTrainNo);if(!train)return;
  const selected=selectionDisplayObject(train.formation),content=document.getElementById('sheetContent');
  if(!isEditMode){
    content.innerHTML=`<div class="train-card${selectedDateKey===operationDateKey()?'':' historical-readonly'}" ${selectedDateKey===operationDateKey()?'onclick="switchToEditMode()"':''}><img src="${esc(selected.img)}" class="train-card-img"><div class="train-info-main"><div><span class="type-badge ${getExpressClass(train)}">${esc(train.type)}</span><span class="train-title">${esc(train.dest)} 行</span><span class="train-number">${esc(train.no)}</span></div>${train.formation?`<div class="formation-id">${esc(selected.name)}</div>`:`<div class="input-trigger-btn">ここから編成を入力</div>`}<div class="capacity-info">所定:${esc(prescribedFormationName(train))}</div></div>${formatFormationUpdatedAt(train.no)?`<div class="formation-updated-at">編成入力：${esc(formatFormationUpdatedAt(train.no))}</div>`:''}</div><div class="timetable-list">${timetableRowsHTML(train.stops)}</div><div class="sync-status" id="syncStatus"></div>`;
  }else{
    const value=train.formation||'';
    const options=`<div class="option-item initial-option" onclick="selectFormation('${INITIAL_FORMATION_SELECTION.id}')"><img src="${INITIAL_FORMATION_SELECTION.img}" class="option-img"><span>${INITIAL_FORMATION_SELECTION.name}</span></div>`+FORMATIONS.map(g=>`<div class="option-header option-category-header" onclick="selectFormation('${g.type}')"><img src="${g.typeImg}" class="option-img"><span>${g.type}</span></div>${g.items.map(f=>`<div class="option-item" onclick="selectFormation('${f.id}')"><img src="${f.img}" class="option-img"><span>${f.name}</span></div>`).join('')}`).join('');
    content.innerHTML=`<div class="train-card"><img src="${esc(selected.img)}" class="train-card-img"><div class="train-info-main"><div><span class="type-badge ${getExpressClass(train)}">${esc(train.type)}</span><span class="train-title">${esc(train.dest)} 行</span><span class="train-number">${esc(train.no)}</span></div><div class="input-trigger-btn" style="background:#b71c1c;">編成を入力中</div><div class="capacity-info">所定:${esc(prescribedFormationName(train))}</div></div></div><div style="text-align:left;font-weight:700;margin:6px 0 4px;font-size:1.1rem;">編成入力</div><div class="formation-manual-input"><input id="formationManualInput" type="text" inputmode="text" autocomplete="off" value="${esc(value)}" placeholder="車両番号または編成番号を入力" onkeydown="if(event.key==='Enter'){event.preventDefault();registerFormationFromInput();}"><button type="button" onclick="registerFormationFromInput()">登録</button></div><div id="formationInputError" class="formation-input-error"></div><div class="select-box-container"><div class="custom-select-trigger" onclick="toggleDropdown()"><div style="display:flex;align-items:center;gap:10px"><img src="${esc(selected.img)}" style="width:auto;height:70px;object-fit:contain"><span>${esc(selected.name)}</span></div>▼</div><div class="custom-select-options" id="dropdownOptions">${options}</div></div><div class="sync-status" id="syncStatus"></div>`;
  }
}
function switchToEditMode(){if(!selectedIsCurrentOperation())return;if(!liveTrain(currentTrainNo))return;isEditMode=true;document.getElementById('bottomSheet')?.classList.add('editing');updateSheetContent();}
function registerFormationFromInput(){
  const input=document.getElementById('formationManualInput'),err=document.getElementById('formationInputError');if(err)err.textContent='';
  const result=formationIdFromInput(input?.value||'');if(!result.ok){if(err)err.textContent=result.error;input?.focus();return;}selectFormation(result.id);
}
function toggleDropdown(){const el=document.getElementById('dropdownOptions');if(!el)return;const open=!el.classList.contains('open');el.classList.toggle('open',open);if(open)requestAnimationFrame(()=>{const r=el.getBoundingClientRect();el.style.maxHeight=Math.max(100,window.innerHeight-r.top-10)+'px';});else el.style.maxHeight='';}
async function selectFormation(id){
  if(!selectedIsCurrentOperation())return;
  const train=liveTrain(currentTrainNo);if(!train)return;
  await recordSelection(train,id===INITIAL_FORMATION_SELECTION.id?null:String(id));
  document.getElementById('dropdownOptions')?.classList.remove('open');document.getElementById('bottomSheet')?.classList.remove('editing');isEditMode=false;updateSheetContent();renderTrainPositions();
}
function openTrainSheet(no){
  const train=liveTrain(no);if(!train)return;
  currentTrainNo=String(no);currentTrainSnapshot=train;currentStationId=null;isEditMode=false;previousSheetContext=null;
  document.getElementById('sheetHeaderTitle').textContent='列車情報';updateSheetContent();document.getElementById('overlay').style.display='block';document.getElementById('bottomSheet').classList.add('active');
}

/* 列車位置・レーン */
function trainPosition(t,minutes){
  const stops=t.stops||[];if(stops.length<2)return null;
  let m=minutes;
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];let t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
    if(t1<t0)t1+=1440;
    let mm=m;if(mm<t0)mm+=1440;
    if(mm>=t0&&mm<=t1){const r0=findVisualRowIndex(a.station),r1=findVisualRowIndex(b.station,r0);if(r0<0||r1<0)return null;const q=(t1-t0)?(mm-t0)/(t1-t0):0;return {pos:r0+(r1-r0)*Math.max(0,Math.min(1,q)),a:r0,b:r1,stationA:a.station,stationB:b.station};}
  }
  return null;
}
function findVisualRowIndex(name,after=-1){
  const rows=[...document.querySelectorAll('.station-row')];
  for(let i=Math.max(0,after+1);i<rows.length;i++)if(rows[i].querySelector('.station-name-ja')?.textContent===name)return i;
  return -1;
}
function segmentTouchesMainRange(t){
  const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住');
  const lo=Math.min(k,n),hi=Math.max(k,n);
  return (t.stops||[]).some(s=>{const x=MAIN_NAMES.indexOf(s.station);return x>=lo&&x<=hi;});
}
function isPassingOvertake(t){
  if(t.type==='THライナー'||t.service==='hibiya'||t.service==='hanzomon')return false;
  return ['急行','区間急行','特急'].includes(t.type);
}
function laneForTrain(t,p){
  const a=MAIN_NAMES.indexOf(p.stationA),b=MAIN_NAMES.indexOf(p.stationB);
  const k=MAIN_NAMES.indexOf('北越谷'),n=MAIN_NAMES.indexOf('北千住'),x=MAIN_NAMES.indexOf('西新井');
  const lo=Math.min(k,n),hi=Math.max(k,n);
  const touches=a>=0&&b>=0&&Math.min(a,b)<=hi&&Math.max(a,b)>=lo;
  if(!touches)return 0;
  // 日比谷線直通は北越谷～北千住で常に基準位置。
  if(t.service==='hibiya')return 0;
  // THライナー：北千住～西新井は内側、西新井～北越谷は外側。
  if(t.type==='THライナー'){
    const ns=Math.max(x,n),ss=Math.min(x,n);
    const mid=(a+b)/2;
    return mid>=ss&&mid<=ns?0:1;
  }
  // 通過追越し列車はさらに外側。
  if(isPassingOvertake(t))return 2;
  // その他の列車は1本分外側。
  return 1;
}
function trainLabelClass(t){return getExpressClass(t)+(t.type==='THライナー'?' th-liner':'');}
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');if(!layer)return;layer.innerHTML='';
  const rows=[...document.querySelectorAll('.station-row')];if(!rows.length)return;
  const minutes=currentMinutes(),layoutWidth=window.innerWidth<960?1920:layer.clientWidth||1920,centerX=layoutWidth/2,trainW=66,lanePitch=86;
  const trains=TRAINS.filter(t=>t.days.includes(currentDay)).map(t=>liveTrain(t.no)||t);
  for(const t of trains){
    const p=trainPosition(t,minutes);if(!p)continue;
    const lane=laneForTrain(t,p),side=t.direction==='down'?'left':'right';
    const idx0=Math.max(0,Math.floor(p.pos)),idx1=Math.min(rows.length-1,Math.ceil(p.pos)),r0=rows[idx0],r1=rows[idx1];
    if(!r0||!r1)continue;
    const f=p.pos-idx0,centerY=(r0.offsetTop+r0.offsetHeight/2)+((r1.offsetTop+r1.offsetHeight/2)-(r0.offsetTop+r0.offsetHeight/2))*f;
    const el=document.createElement('div');el.className='train-icon '+side;
    const formParts=formationDisplayParts(t.formation);
    el.innerHTML=`<span class="train-no">${esc(t.no)}</span><img src="${esc(trainImageFor(t))}" alt="${esc(t.no)}">${formParts.length?`<span class="train-no train-formation">${formParts.map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:''}<span class="train-label ${trainLabelClass(t)}"><span>${esc(getShortType(t))} ${esc(getShortDest(t.dest))}</span></span>`;
    const x=side==='left'?centerX-340-lane*lanePitch:centerX+274+lane*lanePitch;el.style.left=x+'px';el.style.top=(centerY-48)+'px';
    el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openTrainSheet(t.no);});
    layer.appendChild(el);
  }
}

/* 初期化 */
function initStationSheetEvents(){
  document.getElementById('closeBtn').addEventListener('click',closeSheet);
  document.getElementById('overlay').addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
}
async function init(){
  initDateTimeControls();loadLocal();render();initStationSheetEvents();await initFirebase();render();renderTrainPositions();
  setInterval(()=>{if(followNow){const input=document.getElementById('timeInput');if(input)input.value=formatTimeNow();const op=operationDateKey();if(selectedDateKey!==op)setSelectedDate(op);}renderTrainPositions();},1000);
}
init();
</script>
