<!DOCTYPE html>
<html lang="ja">
<head>
<meta property="og:title" content="東武野田線 - 運用まとめ">
<meta property="og:description" content="東武野田線の運用を記録しよう">
<meta property="og:image" content="https://minamikaze2700.github.io/Unyomatome/https://minamikaze2700.github.io/Unyomatome/images/TobuNoda_ogp.png">
<meta property="og:url" content="https://minamikaze2700.github.io/Unyomatome/%E6%9D%B1%E6%AD%A6%E9%87%8E%E7%94%B0%E7%B7%9A.html">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運用まとめ - 東武野田線</title>
<style>
:root{
  --primary:#00aeef;
  --primary-dark:#009bd6;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0}
body{font-family:sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}

/* 日別・時刻フィルター */
#title{
    height: 50px;
    color: #fff;
    font-weight: 500;
    display: flex;
    background: #00aeef;
    width: 100%;
    position: fixed;
    justify-content: center;
    align-items: center;
    border-bottom: 8px solid #1ff020;
    z-index: 100;
}

/* 普通列車の5両・6両を運用単位で切り替えるための手入力欄 */
.five-car-control{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:360px;max-width:720px;flex:1 1 520px;}
.five-car-label{font-size:.85rem;font-weight:800;color:#555;}
.five-car-input{width:100%;min-height:58px;resize:vertical;border:2px solid #ccc;border-radius:8px;padding:7px 10px;font:inherit;font-size:.85rem;line-height:1.35;background:#fff;color:#111;}
.five-car-input:focus{border-color:var(--primary);outline:none;}
.five-car-help{font-size:.72rem;color:#777;}

.control-bar{
  position:sticky;top:50px;z-index:20;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.date-input{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;
  cursor:pointer;min-width:160px;
}
.schedule-day-label{font-weight:800;color:#555;white-space:nowrap}
.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}
.sync-btn{border:1px solid #bbb;background:#fff;color:#555;border-radius:999px;padding:5px 10px;cursor:pointer;font-weight:700}


/* 路線図 */
:root{--row-height:270px}
.line-container{
  position:relative;width:100%;max-width:none;margin:0 auto;
  padding:0;display:flex;flex-direction:column;align-items:center;
}
.rail-line{
  position:absolute;top:135px;bottom:135px;left:50%;transform:translateX(-50%);
  width:12px;background:var(--primary);z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}
.station-badge{
  position:relative;width:384px;min-width:384px;height:auto;aspect-ratio:480 / 90;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  font-family:inherit;
  height:61.1111%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:45px;line-height:1;font-weight:500;
  letter-spacing:.12em;padding-left:.12em;
}
.station-name-en{
  font-family:inherit;
  height:33.3333%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 292px))}
.train-icon.right{right:max(6px,calc(50% - 292px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:60px;height:auto;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-label{
  margin-top:2px;max-width:100px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:12px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#808080}
.train-label.b-express{background:#ffb6c1}
.train-label.a-express{background:#e83e8c}
.train-label.deadhead{background:#fff;color:#111;border:1px solid #bbb;}



/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:101;
  max-width:620px;margin:0 auto;max-height:75vh;min-height:0;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
}
.bottom-sheet.active{bottom:0}
.bottom-sheet.editing{height:75vh;max-height:75vh;min-height:75vh}
.bottom-sheet.editing .sheet-content{min-height:calc(75vh - 58px)}

.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.sheet-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sheet-back-btn{
  display:none;width:28px;height:28px;border:0;background:transparent;color:#fff;
  padding:0;cursor:pointer;position:relative;flex:0 0 28px;
}
.sheet-back-btn::before{
  content:'';position:absolute;left:7px;top:6px;width:13px;height:13px;
  border-left:4px solid currentColor;border-bottom:4px solid currentColor;
  transform:rotate(45deg);
  box-sizing:border-box;
}
.sheet-back-btn.visible{display:inline-block;}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px;position:relative;overflow:hidden;min-height:0}
.timetable-list{margin-top:16px;position:relative;overflow:hidden;z-index:1}
.train-card{
  position:relative;
  background:#fff;border-radius:8px;padding:0;display:flex;
  align-items:center;gap:12px;margin-bottom:0;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.train-card.historical-readonly{cursor:default}
.train-card.historical-readonly:hover{border-color:transparent}
.station-info-card{cursor:default;}
.station-info-card:hover{border-color:transparent;}
.station-placeholder{margin-top:12px;min-height:140px;}
.station-badge{cursor:pointer;}
.station-timetable-title{
  font-family:inherit;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px;
}
.station-timetable-direction-tabs{display:flex;gap:8px;margin:0 0 12px;justify-content:flex-start;}
.station-timetable-direction-tab{
  flex:0 0 50%;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);
  font-family:inherit;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer;
}
.station-timetable-direction-tab.active{background:var(--primary);color:#fff;}
.station-timetable-direction-tab:hover{background:#fff1f1;}
.station-timetable-direction-tab.active:hover{background:var(--primary-dark);}

.station-timetable-frame{
  position:relative;
  margin-top:4px;
  height:53vh;
  background:#fff;
  border:3px solid #000;
  border-radius:11px;
  overflow:hidden;
  box-sizing:border-box;
}
.station-timetable-wrap{
  /* 530px以上は530px基準の固定サイズ。530px未満だけ幅に応じて縮小する。 */
  position:relative;
  container-type:inline-size;
  margin-top:0;
  background:#fff;
  border:0;
  border-radius:0;
  overflow-y:auto;
  overflow-x:hidden;
  height:100%;
  scroll-behavior:auto;
  box-sizing:border-box;
}
.station-timetable-direction{margin:0;padding:0;}
.station-timetable-empty{
  padding:24px 18px;
  text-align:center;
  font-family:inherit;
  color:#555;
}
.station-timetable-row{
  width:100%;
  min-height:108px;
  display:grid;
  grid-template-columns:68px 82px 92px 92px minmax(0,1fr);
  align-items:center;
  column-gap:8px;
  padding:8px 12px;
  border:0;
  color:#000;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
}
.station-timetable-row:nth-child(odd){background:#fff;}
.station-timetable-row:nth-child(even){background:#cfcfcf;}
.station-timetable-row:hover{filter:brightness(.97);}
.station-timetable-row:focus-visible{outline:3px solid rgba(0,0,0,.35);outline-offset:-3px;}
.station-timetable-train-img{
  width:68px;
  height:86px;
  object-fit:contain;
  display:block;
  justify-self:center;
  background:transparent;
}
.station-timetable-formation{
  color:#1b6e27;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:24px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
}
.station-timetable-type{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:78px;height:34px;padding:0 10px;border-radius:7px;
  font-family:inherit;font-size:18px;line-height:1;font-weight:700;
  white-space:nowrap;text-align:center;box-sizing:border-box;
  background:#808080;color:#fff;
}
.station-timetable-type.section-express{background:#f3b6c2;color:#111;}
.station-timetable-type.express{background:#e5007f;color:#fff;}
.station-timetable-type.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
.station-timetable-time{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:32px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  letter-spacing:.01em;
}
.station-timetable-destination{
  font-family:inherit;
  font-size:32px;
  line-height:1;
  font-weight:500;
  white-space:nowrap;
  text-align:left;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  gap:.18em;
  height:1em;
}
.station-timetable-destination-station{font-size:1em;line-height:1;}
.station-timetable-destination-go{font-size:.8em;line-height:1;}
/* 530px未満のみ、530pxを100%とした比率で全パーツを縮小 */
@container (max-width:529px){
  .station-timetable-frame{
    border-width:.5660377cqw;
    border-radius:2.0754717cqw;
  }
  .station-timetable-empty{
    padding:4.5283019cqw 3.3962264cqw;
  }
  .station-timetable-row{
    min-height:20.3773585cqw;
    grid-template-columns:12.8301887cqw 15.4716981cqw 17.3584906cqw 17.3584906cqw minmax(0,1fr);
    column-gap:1.509434cqw;
    padding:1.509434cqw 2.264151cqw;
  }
  .station-timetable-row:focus-visible{
    outline-width:.5660377cqw;
    outline-offset:-.5660377cqw;
  }
  .station-timetable-train-img{
    width:12.8301887cqw;
    height:16.2264151cqw;
  }
  .station-timetable-formation{
    font-size:4.5283019cqw;
  }
  .station-timetable-time,
  .station-timetable-destination{
    font-size:6.0377358cqw;
  }
  .station-timetable-type{
    min-width:14.717cqw;height:6.415cqw;padding:0 1.887cqw;
    border-radius:1.321cqw;font-size:3.396cqw;
  }
}
.station-badge:focus{outline:3px solid rgba(0,0,0,.35);outline-offset:4px;}

/* 駅情報：最初の項目 */
.station-overview-card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  margin-bottom:16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-overview-main{
  text-align:center;padding:8px 10px 9px;background:#fff;
}
.station-overview-name-ja{
  font-family:inherit;
  font-size:52px;line-height:.95;font-weight:500;letter-spacing:.08em;padding-left:.08em;color:#000;
}
.station-overview-name-en{
  font-family:inherit;
  font-size:29px;line-height:1.02;font-weight:500;letter-spacing:.015em;color:#000;
  margin-top:2px;
}
.station-direction-bar-wrap{width:100%;}
.station-direction-bar{
  width:100%;height:18px;background:var(--primary);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
}
.station-direction-bar.no-prev{clip-path:polygon(0 0,97% 0,100% 100%,0 100%);}
.station-direction-bar.no-next{clip-path:polygon(3% 0,100% 0,100% 100%,0 100%);}
.station-direction-bar.no-prev.no-next{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.station-neighbor-row{display:flex;width:100%;min-height:54px;background:#fff;}
.station-neighbor{
  width:50%;display:flex;flex-direction:column;justify-content:flex-start;
  padding:2px 8px 8px;min-width:0;
}
.station-neighbor.left{text-align:left;align-items:flex-start;}
.station-neighbor.right{text-align:right;align-items:flex-end;}
.station-neighbor-name-ja{
  font-family:inherit;font-size:27px;line-height:1.05;font-weight:400;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.station-neighbor-name-en{
  font-family:inherit;font-size:14px;line-height:1.1;font-weight:500;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px;
}
.station-neighbor.empty{visibility:hidden;}

.train-card-img{width:75px;height:auto;object-fit:contain}
.train-info-main{flex:1}
.type-badge{background:#616161;color:#fff;padding:3px 8px;border-radius:4px;font-size:.78rem;display:inline-block}
.type-badge.a-express{background:#e83e8c}
.type-badge.b-express{background:#ffb6c1}
.train-title{font-size:0.95rem;font-weight:700;margin-left:6px}
.train-number{color:#1b6e27;font-weight:800;float:right;margin-right:15px}
.formation-id{font-size:1.2rem;font-weight:800;color:#1b6e27;margin-top:4px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}

.formation-updated-at{position:absolute;right:12px;bottom:8px;font-size:.78rem;color:#777;text-align:right;} 
.input-trigger-btn{
  background:var(--primary);color:#fff;padding:4px 8px;border-radius:4px;
  font-size:.75rem;margin-top:4px;display:inline-block;
}
.formation-manual-input{display:flex;gap:8px;margin:6px 0;align-items:stretch;}
.formation-manual-input input{flex:1;min-width:0;border:2px solid #ccc;border-radius:8px;padding:10px;font:inherit;font-weight:700;}
.formation-manual-input button{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:0 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;}
.formation-manual-input button:hover{background:var(--primary-dark);}
.formation-input-error{min-height:0;color:#c62828;font-size:.8rem;font-weight:700;margin:2px 0 4px;}
.timetable-list{background:#fff;border-radius:8px;padding:12px 20px}
.timetable-item{display:flex;align-items:center;padding:8px 0;position:relative;height:56px;min-height:56px;box-sizing:border-box}
.timetable-item::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;
  background:var(--primary);z-index:1;
}
.timetable-item:first-child::before{top:50%}
.timetable-item:last-child::before{bottom:50%}
.time-dot{width:18px;height:18px;background:var(--primary);border-radius:50%;z-index:2;margin-right:16px}
.time-text{width:58px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.05;gap:0;height:40px;flex:none}.time-text span{display:block;height:20px;line-height:20px;white-space:nowrap}.time-text.two-line span:first-child{font-size:.82rem}.time-text.two-line span:last-child{font-size:1rem}
.station-text{font-weight:700;font-size:1.05rem;line-height:1.2;display:flex;align-items:center;min-height:40px}
.select-box-container{position:relative;width:100%;margin:12px 0}
.custom-select-trigger{
  background:#fff;border:2px solid #ccc;border-radius:8px;padding:10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:1.25rem;color:#1b6e27;
}
.custom-select-options{
  position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;
  border-radius:8px;max-height:250px;overflow-y:auto;z-index:200;display:none;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.custom-select-options.open{display:block}
.option-header{
  background:#f0f0f0;padding-left:16px;font-weight:700;font-size:1.25rem;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid #e0e0e0;cursor:pointer;
}
.option-header:hover{background:#e8f5e9}
.option-item{
  padding-left:16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:1.25rem;
}
.option-item:hover{background:#e8f5e9}
.option-item.type-option,.option-item.initial-option{background:#e0e0e0}
.option-item.type-option:hover,.option-item.initial-option:hover{background:#d0d0d0}
.option-img{width:auto;height:60px;object-fit:contain}

/* スマホ版：1920pxの元レイアウトから中央960px（左右480pxずつをカット）を
   そのまま100vwへ縮小表示する。960px以上はデスクトップ表示を変更しない。 */
@media (max-width:959.98px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  #viewportCanvas{
    width:1920px;
    min-width:1920px;
    max-width:none;
    margin-left:-480px;
    zoom:calc(100vw / 960px);
  }
  #viewportCanvas #title,
  #viewportCanvas .control-bar,
  #viewportCanvas .line-container{
    width:1920px;
    max-width:none;
    min-width:0;
  }
}

/* 東武アーバンパークライン用デザイン */
body{font-family:sans-serif;}
#title{height:58px;gap:12px;font-size:31px;letter-spacing:.03em;}
.title-logo{width:42px;height:42px;object-fit:contain;display:block;flex:0 0 auto;}
.station-badge{
  width:384px;min-width:384px;height:72px;background:#00aeef;
  border:0;border-radius:0;overflow:hidden;box-shadow:0 7px 14px rgba(0,0,0,.26);
  padding:4px 8px;
}
.station-badge::before{
  content:'';position:absolute;inset:4px 8px;z-index:0;background:#fff;
  clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);
}
.station-name-ja,.station-name-en{position:relative;z-index:1;background:transparent;font-family:inherit;color:#000;}
.station-name-ja{height:61%;font-size:36px;font-weight:400;}
.station-name-en{height:33%;font-size:15.2px;font-weight:400;}
.rail-line{width:12px;background:#00aeef;}
.train-label.section-express{background:#f3b6c2;color:#111;}
.train-label.express{background:#e5007f;color:#fff;}
.type-badge.section-express{background:#f3b6c2;color:#111;}
.type-badge.express{background:#e5007f;color:#fff;}
.type-badge.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
.option-category-header{cursor:pointer!important;pointer-events:auto;background:#f0f0f0;}
.option-subheader{background:#e8f7ff!important;padding-left:16px!important;font-size:1.15rem!important;cursor:pointer!important;pointer-events:auto;}
.option-subheader:hover{background:#d3efff!important;}
.option-subitem{padding-left:16px!important;}

.option-disabled{opacity:.42;cursor:not-allowed!important;}
.option-disabled:hover{background:#fff!important;}

 #title{background:#00aeef;border-bottom:8px solid #1ff020;}
</style>
</head>
<body>

<div id="viewportCanvas">
<h1 id="title"><img class="title-logo" src="https://static.tobuspapp.jp/html/operation_tobupo/img/xxxhdpi/pos_icon_nodaline.png" alt="TD"><span>東武野田線</span></h1>
<div class="control-bar">

function buildTimetableRows(stops){
  const rows=[];
  for(let i=0;i<(stops||[]).length;){
    const station=stops[i].station;
    const times=[stops[i].time];
    let j=i+1;
    while(j<stops.length && stops[j].station===station){
      times.push(stops[j].time);
      j++;
    }
    rows.push({station,times});
    i=j;
  }
  return rows;
}
function timetableRowsHTML(stops){
  return buildTimetableRows(stops).map(row=>{
    // 同一駅に時刻が2つある場合、時刻表の1つ目を到着、2つ目を発車として2段表示。
    // 駅ごとの行の高さは常に56pxのままにする。
    const twoLine=row.times.length>=2;
    const times=twoLine ? row.times.slice(0,2) : row.times.slice(0,1);
    return `<div class="timetable-item"><div class="time-dot"></div><div class="time-text${twoLine?' two-line':''}">${times.map((t,i)=>`<span>${t}</span>`).join('')}</div><div class="station-text">${row.station}</div></div>`;
  }).join('');
}
const TIMETABLE_HTML_CACHE = new Map(TRAINS.map(t=>[String(t.no),timetableRowsHTML(t.stops)]));
function timetableHTMLForCurrentDay(t){ return timetableRowsHTML((t||{}).stops||[]); }


function todayKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function operationDateKey(d=new Date()){
  const base=new Date(d);
  if(base.getHours()<RESET_HOUR) base.setDate(base.getDate()-1);
  return todayKey(base);
}
function resetTimeForDate(dateKey){ return dateKey+'T03:00:00'; }
function normalizeTrainNo(v){
  if(v===null||v===undefined) return '';
  const s=String(v);
  return /^\d+\.0$/.test(s)?s.slice(0,-2):s;
}
function cloneState(obj){ return JSON.parse(JSON.stringify(obj||{})); }
function stateForTrain(state,no){
  const obj=state||{}; const key=String(no);
  if(Object.prototype.hasOwnProperty.call(obj,key)) return obj[key];
  const canonical=key.replace(/A$/i,'');
  for(const [k,v] of Object.entries(obj)){
    if(String(k).replace(/A$/i,'')===canonical) return v;
  }
  return null;
}
function historyEntries(){ return Object.values(remoteRoot.history||{}).sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''))); }
function syncStatus(text){
  const el=document.getElementById('syncStatus');
  if(el) el.textContent='共有同期：'+text;
}
function stateFingerprint(root=remoteRoot){
  try{
    return JSON.stringify({
      operationDate:root?.operationDate||null,
      stateByDay:root?.stateByDay||{平日:{},休日:{}},
      formationUpdatedAtByDay:root?.formationUpdatedAtByDay||{平日:{},休日:{}},
      history:root?.history||{}
    });
  }catch(e){ return ''; }
}
function saveLocalState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      operationDate:currentOperationDate,
      stateByDay:remoteRoot.stateByDay,
      formationUpdatedAtByDay:remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}},
      history:remoteRoot.history,
      updatedAt:new Date().toISOString()
    }));
  }catch(e){ console.warn('local save failed',e); }
}
function loadLocalState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const obj=JSON.parse(raw);
    remoteRoot.operationDate=obj.operationDate||null;
    remoteRoot.stateByDay=obj.stateByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay=obj.formationUpdatedAtByDay||{平日:{},休日:{}};
    remoteRoot.history=obj.history||{};
    currentOperationDate=remoteRoot.operationDate;
    operationHistory=historyEntries();
    registrationState=isHistoricalSelectedDate(selectedDateKey)
      ? historicalStateForDate(selectedDateKey)
      : cloneState(remoteRoot.stateByDay[currentDay]||{});
    applyRegistrationState();
  }catch(e){ console.warn('local load failed',e); }
}
function applyRegistrationState(){
  TRAINS.forEach(t=>{
    const key=String(t.no);
    if(Object.prototype.hasOwnProperty.call(pendingFormationState,key)){
      t.formation=pendingFormationState[key]||null;
    }else{
      t.formation=stateForTrain(registrationState,key)||null;
    }
  });
}
function broadcastState(){
  if(!channel) return;
  // 送信はローカルで変更を確定した側だけが行う。
  // 受信側からの再送は絶対に行わない。
  channel.postMessage({source:'train-app',type:'state',root:cloneState(remoteRoot),ts:Date.now()});
}
function hydrateFromRoot(data){
  const next=data||{version:0,operationDate:null,stateByDay:{平日:{},休日:{}},formationUpdatedAtByDay:{平日:{},休日:{}},history:{}};
  const normalized={
    ...next,
    stateByDay:{平日:cloneState(next.stateByDay?.平日||{}),休日:cloneState(next.stateByDay?.休日||{})},
    formationUpdatedAtByDay:{平日:cloneState(next.formationUpdatedAtByDay?.平日||{}),休日:cloneState(next.formationUpdatedAtByDay?.休日||{})},
    history:cloneState(next.history||{})
  };
  if(stateFingerprint(normalized)===stateFingerprint(remoteRoot)) return false;
  remoteRoot=normalized;
  currentOperationDate=remoteRoot.operationDate||currentOperationDate||operationDateKey();
  operationHistory=historyEntries();
  registrationState=isHistoricalSelectedDate(selectedDateKey)
    ? historicalStateForDate(selectedDateKey)
    : cloneState(remoteRoot.stateByDay[currentDay]||{});
  applyRegistrationState();
  // 受信した状態を再保存・再送しない。これが同期ループ防止の重要点。
  return true;
}
function firebaseOperationRef(){ return firebase.database().ref('運用'); }
function firebaseHistoryRef(){ return firebase.database().ref('履歴'); }

// 列車データは詳細画面の開閉状態に関係なく常時同期・更新する。
// Firebaseから取得した編成状態を各列車へ即時反映し、メイン画面と詳細画面の
// 両方が同じインメモリキャッシュを参照する。
const LIVE_TRAIN_CACHE = new Map();
function liveTrainCacheKey(trainNo){ return `${currentDay}:${String(trainNo)}`; }
function refreshAllTrainDataCache(){
  LIVE_TRAIN_CACHE.clear();
  const sourceTrains = currentDay==='休日' ? HOLIDAY_DOWN_TRAINS : TRAINS;
  for(const t of sourceTrains){
    const key=String(t.no);
    const cached={...t, stops:(t.stops||[]).map(s=>({...s}))};
    cached.defaultCars=prescribedFormationName(cached);
    const effectiveFormation=Object.prototype.hasOwnProperty.call(pendingFormationState,key)
      ? pendingFormationState[key]
      : registrationState[key];
    cached.formation=effectiveFormation||null;
    LIVE_TRAIN_CACHE.set(liveTrainCacheKey(key),cached);
    if(currentDay!=='休日') TRAIN_DATA_CACHE.set(key,cached);
  }
}
function liveTrain(trainNo){
  const key=String(trainNo);
  const cached=LIVE_TRAIN_CACHE.get(liveTrainCacheKey(key));
  if(cached) return cached;
  if(currentDay==='休日') return HOLIDAY_DOWN_TRAIN_INDEX[key] || null;
  return TRAIN_DATA_CACHE.get(key)||TRAIN_INDEX[key]||null;
}
function trainForCurrentDay(trainNo){
  const key=String(trainNo??'');
  const source=currentDay==='休日' ? HOLIDAY_DOWN_TRAINS : TRAINS;
  const hit=source.find(t=>String(t.no)===key);
  if(hit) return liveTrain(hit.no)||hit;
  return liveTrain(key);
}
function refreshVisibleUI(){
  // 編成入力中は、Firebase等からの列車データ更新による再描画を停止。
  // 入力完了後のselectFormation()でまとめて最新状態を反映する。
  if(isEditMode) return;
  refreshAllTrainDataCache();
  renderLine();
  if(currentTrainNo) updateSheetContent();
}

function subscribeAllOperationState(){
  if(!firebaseReady) return;
  if(firebaseDayListenerCallback){
    firebaseOperationRef().child('stateByDay').off('value',firebaseDayListenerCallback);
  }
  firebaseDayListenerDay='__ALL__';
  firebaseDayListenerCallback=(snap)=>{
    const all=snap.val();
    if(!all || typeof all!=='object') return;
    const nextRoot={
      ...remoteRoot,
      stateByDay:{
        平日:Object.prototype.hasOwnProperty.call(all,'平日')?cloneState(all.平日||{}):cloneState(remoteRoot.stateByDay?.平日||{}),
        休日:Object.prototype.hasOwnProperty.call(all,'休日')?cloneState(all.休日||{}):cloneState(remoteRoot.stateByDay?.休日||{})
      }
    };
    if(stateFingerprint(nextRoot)===stateFingerprint(remoteRoot)) return;
    remoteRoot.stateByDay=nextRoot.stateByDay;
    if(isEditMode){
      syncStatus('編成入力中：更新を一時停止');
      return;
    }
    registrationState=isHistoricalSelectedDate(selectedDateKey)
      ? historicalStateForDate(selectedDateKey)
      : cloneState(remoteRoot.stateByDay[currentDay]||{});
    if(!isHistoricalSelectedDate(selectedDateKey)) {
      Object.entries(pendingFormationState).forEach(([no,formId])=>{ registrationState[no]=formId; });
    }
    applyRegistrationState();
    saveLocalState();
    refreshVisibleUI();
    syncStatus('Firebase同期済み');
  };
  firebaseOperationRef().child('stateByDay').on('value',firebaseDayListenerCallback,err=>{
    console.error('Firebase運用読込失敗',err);
    syncStatus('Firebase読込失敗');
  });
}

function prefetchTrainImages(){
  const urls=new Set(['https://minamikaze2700.github.io/Unyomatome/images/TD_noimage.png']);
  for(const group of FORMATIONS){
    if(group.typeImg) urls.add(group.typeImg);
    for(const item of (group.items||[])) if(item.img) urls.add(item.img);
    for(const variant of (group.variants||[])){
      if(variant.img) urls.add(variant.img);
      for(const item of (variant.items||[])) if(item.img) urls.add(item.img);
    }
  }
  for(const url of urls){ const img=new Image(); img.decoding='async'; img.src=url; }
}

async function preloadFirebaseState(){
  if(!firebaseReady) return;
  try{
    const [stateSnap,timestampSnap,historySnap]=await Promise.all([
      firebaseOperationRef().child('stateByDay').once('value'),
      firebaseOperationRef().child('formationUpdatedAtByDay').once('value'),
      firebaseHistoryRef().once('value')
    ]);
    const all=stateSnap.val()||{};
    remoteRoot.stateByDay={
      平日:cloneState(all.平日||{}),
      休日:cloneState(all.休日||{})
    };
    remoteRoot.formationUpdatedAtByDay={
      平日:cloneState(timestampSnap.val()?.平日||{}),
      休日:cloneState(timestampSnap.val()?.休日||{})
    };
    remoteRoot.history=historySnap.val()||{};
    registrationState=isHistoricalSelectedDate(selectedDateKey)
      ? historicalStateForDate(selectedDateKey)
      : cloneState(remoteRoot.stateByDay[currentDay]||{});
    operationHistory=historyEntries();
    applyRegistrationState();
    saveLocalState();
    refreshVisibleUI();
  }catch(e){
    console.warn('Firebase事前取得失敗',e);
  }
}

function warmAllTrainData(){

async function initFirebase(){
  if(!FIREBASE_ENABLED){ syncStatus('ローカル（Firebase設定待ち）'); return false; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebaseReady=true;
    syncStatus('Firebase接続中');

    // 起動直後に平日・休日の全編成登録と履歴をまとめて取得。
    // 列車をクリックするまで待たず、画面表示前にキャッシュへ載せる。
    await preloadFirebaseState();

    // 以後は曜日ごとではなく stateByDay 全体を監視するので、
    // 別端末の変更も曜日切替の都度再購読せず即時反映できる。
    subscribeAllOperationState();

    firebaseOperationRef().child('formationUpdatedAtByDay').on('value',snap=>{
      const raw=snap.val()||{};
      const next={平日:cloneState(raw.平日||{}),休日:cloneState(raw.休日||{})};
      if(JSON.stringify(next)===JSON.stringify(remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}})) return;
      remoteRoot.formationUpdatedAtByDay=next;
      saveLocalState();
      if(currentTrainNo && !isEditMode) updateSheetContent();
    },err=>{
      console.error('Firebase編成入力時刻読込失敗',err);
    });

    firebaseHistoryRef().on('value',snap=>{
      const nextHistory=snap.val()||{};
      if(stateFingerprint({...remoteRoot,history:nextHistory})===stateFingerprint(remoteRoot)) return;
      remoteRoot.history=nextHistory;
      operationHistory=historyEntries();
      if(isHistoricalSelectedDate(selectedDateKey)){
        registrationState=historicalStateForDate(selectedDateKey);
        applyRegistrationState();
        refreshAllTrainDataCache();
        if(!isEditMode) renderLine();
      }
      saveLocalState();
      if(currentTrainNo && !isEditMode) updateSheetContent();
    },err=>{
      console.error('Firebase履歴読込失敗',err);
    });

    // /運用 がまだ無ければ初期構造だけ作る。
    const opSnap=await firebaseOperationRef().once('value');
    if(!opSnap.exists()){
      await firebaseOperationRef().set({
        operationDate:operationDateKey(),
        stateByDay:{平日:{},休日:{}},
        formationUpdatedAtByDay:{平日:{},休日:{}},
        version:0,
        updatedAt:firebase.database.ServerValue.TIMESTAMP
      });
    }else{
      const data=opSnap.val()||{};
      remoteRoot=data;
      remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
      remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
      remoteRoot.history=remoteRoot.history||{};
      currentOperationDate=remoteRoot.operationDate||operationDateKey();
      registrationState=isHistoricalSelectedDate(selectedDateKey)
      ? historicalStateForDate(selectedDateKey)
      : cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshVisibleUI();
    }
    warmAllTrainData();
    return true;
  }catch(e){
    console.error('Firebase init failed',e);
    syncStatus('Firebase接続失敗');
    firebaseReady=false;
    return false;
  }
}
async function syncRegistrationToRemote(changes={}){
  if(!firebaseReady){
    syncStatus('Firebase未接続');
    return false;
  }
  const entries=Object.entries(changes||{});
  if(!entries.length){
    syncStatus('Firebase同期済み');
    return true;
  }
  try{
    // 今回変更した列車だけをupdate()する。日別state全体の書き戻しは禁止。
    // これにより、複数列車へ順番に編成を入力しても先行入力を消さない。
    const dayRef=firebaseOperationRef().child('stateByDay').child(currentDay);
    const stateUpdates={};
    entries.forEach(([no,formId])=>{
      stateUpdates[String(no)]=(formId && formId!==INITIAL_FORMATION_SELECTION.id) ? String(formId) : null;
    });
    await dayRef.update(stateUpdates);

    const committedSnap=await dayRef.once('value');
    const committed=committedSnap.val()||{};
    registrationState=cloneState(committed);

    remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
    remoteRoot.stateByDay[currentDay]=cloneState(committed);

    // 入力時刻も変更対象だけ更新する。
    const timestampRef=firebaseOperationRef().child('formationUpdatedAtByDay').child(currentDay);
    const timestampUpdates={};
    entries.forEach(([no,formId])=>{
      if(formId && formId!==INITIAL_FORMATION_SELECTION.id){
        timestampUpdates[String(no)] =
          pendingFormationTimestamps[currentDay]?.[String(no)] || new Date().toISOString();
      }else{
        timestampUpdates[String(no)]=null;
      }
    });
    await timestampRef.update(timestampUpdates);

    const tsSnap=await timestampRef.once('value');
    remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay[currentDay]=cloneState(tsSnap.val()||{});

    entries.forEach(([no,formId])=>{
      const key=String(no);
      if(String(registrationState[key]||'')===String(formId||'')) delete pendingFormationState[key];
      if(pendingFormationTimestamps[currentDay]) delete pendingFormationTimestamps[currentDay][key];
    });

    applyRegistrationState();
    saveLocalState();
    refreshAllTrainDataCache();
    broadcastState();
    syncStatus('Firebase同期済み');
    return true;
  }catch(e){
    console.error('Firebase書込失敗',e);
    syncStatus('Firebase書込失敗');
    return false;
  }
}
function findChain(day,trainNo){
  const raw=normalizeTrainNo(trainNo);
  return CHAIN_INDEX[day]?.[raw] || CHAIN_INDEX[day]?.[raw.replace(/A$/i,'')] || null;
}
function chainEntries(day,trainNo){
  const info=findChain(day,trainNo);
  if(!info) return null;
  return OPERATION_CHAINS[day]?.[info.chainIndex] || null;
}

/* 運用連結：同一列車が複数の運用グループに現れる場合も全該当チェーンを走査。
   ただし回送103/111と通常103A/111AのようにA有無で別列車の場合は、
   まず完全一致したチェーンだけを採用する。 */
function formationLinkedTrainNos(day,trainNo){
  const start=normalizeTrainNo(trainNo);
  const result=new Set([start]);
  const queue=[start];

  while(queue.length){
    const no=queue.shift();
    const chains=OPERATION_CHAINS[day]||[];
    let exactFound=false;

    for(const chain of chains){
      if(!chain.some(entry=>normalizeTrainNo(entry.no)===no)) continue;
      exactFound=true;
      chain.forEach(entry=>{
        const n=normalizeTrainNo(entry.no);
        if(n && !result.has(n)){ result.add(n); queue.push(n); }
      });
    }

    /* TRAINS側が802、運用側が802AのようなケースだけAを除いた照合を行う。 */
    if(!exactFound){
      const canonical=no.replace(/A$/i,'');
      for(const chain of chains){
        if(!chain.some(entry=>normalizeTrainNo(entry.no).replace(/A$/i,'')===canonical)) continue;
        chain.forEach(entry=>{
          const n=normalizeTrainNo(entry.no);
          if(n && !result.has(n)){ result.add(n); queue.push(n); }
        });
      }
    }
  }
  return result;
}

async function recordSelection(train,formId){
  if(isNonCurrentSelectedDate(selectedDateKey)) return [];
  const linkedTrainNos=formationLinkedTrainNos(currentDay,train.no);
  const assigned=[];
  const changes={};

  linkedTrainNos.forEach(requested=>{
    const dayIndex=currentDay==='休日' ? HOLIDAY_DOWN_TRAIN_INDEX : TRAIN_INDEX;
    const actual=dayIndex[requested]
      ? requested
      : Object.keys(dayIndex).find(k=>k.replace(/A$/i,'')===String(requested).replace(/A$/i,'')) || null;
    if(!actual || assigned.includes(actual)) return;

    const value=(formId && formId!==INITIAL_FORMATION_SELECTION.id) ? String(formId) : null;
    if(value) registrationState[actual]=value;
    else delete registrationState[actual];
    assigned.push(actual);
    changes[actual]=value;

    pendingFormationState[actual]=value;
    pendingFormationTimestamps[currentDay]=pendingFormationTimestamps[currentDay]||{};
    if(value) pendingFormationTimestamps[currentDay][actual]=new Date().toISOString();
    else delete pendingFormationTimestamps[currentDay][actual];
  });

  applyRegistrationState();
  refreshAllTrainDataCache();
  saveLocalState();

  const ok=await syncRegistrationToRemote(changes);
  if(!ok){
    saveLocalState();
    syncStatus('同期失敗（再試行待ち）');
  }
  return assigned;
}
function snapshotForCurrentRegistrations(day, state, dateKey){
  const ops=[];
  const chainsForDay=OPERATION_CHAINS[day]||[];
  for(let i=0;i<chainsForDay.length;i++){
    const chain=chainsForDay[i];
    const shown=chain.map(e=>normalizeTrainNo(e.no)).filter(no=>TRAIN_INDEX[no]);
    if(!shown.length) continue;
    const byFormation={};
    shown.forEach(no=>{
      const f=stateForTrain(state,no);
      if(!f) return;
      (byFormation[f]??=[]).push(no);
    });
    for(const [formationId,trainNumbers] of Object.entries(byFormation)){
      ops.push({
        operationId:`${day}-${String(i+1).padStart(2,'0')}`,
        day,
        firstTrainNo:String(chain[0].no),
        trainNumbers,
        formationId
      });
    }
  }
  return {date:dateKey,id:`${dateKey}_reset`,resetAt:resetTimeForDate(dateKey),operations:ops,loggedAt:new Date().toISOString()};
}

function snapshotFromStateRoot(oldRoot,dateKey){
  const days=[];
  for(const day of ['平日','休日']){
    const snap=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey);
    if(snap.operations.length) days.push(snap);
  }
  return {id:dateKey,date:dateKey,resetAt:resetTimeForDate(dateKey),days,loggedAt:new Date().toISOString()};
}

async function maybeResetForNewOperationDay(remoteCheck=false){
  // 日付選択中の過去データ表示は、日次リセット処理で今日の状態に戻さない。
  if(isHistoricalSelectedDate(selectedDateKey)) return;
  const opDate=operationDateKey();
  if(!currentOperationDate) currentOperationDate=remoteRoot.operationDate||opDate;

  if(firebaseReady){
    try{
      await firebaseOperationRef().transaction(current=>{
        const cur=current||{stateByDay:{平日:{},休日:{}},operationDate:opDate,version:0};
        cur.stateByDay=cur.stateByDay||{平日:{},休日:{}};
        const oldDate=cur.operationDate;
        if(oldDate && oldDate!==opDate){
          const snapshot=snapshotFromStateRoot(cur,oldDate);
          if(snapshot.days.length){
            // transaction内では履歴書込みを行わず、後段で候補として保持
            window.__pendingResetSnapshot=snapshot;
          }
          cur.stateByDay={平日:{},休日:{}};
          cur.operationDate=opDate;
          cur.version=(cur.version||0)+1;
          cur.updatedAt=firebase.database.ServerValue.TIMESTAMP;
        }
        return cur;
      });
      if(window.__pendingResetSnapshot){
        const snapshot=window.__pendingResetSnapshot;
        window.__pendingResetSnapshot=null;
        try{
          // 日付固定キーで保存するため、複数端末が同時に3:00を検出しても同一履歴へ収束
          await firebaseHistoryRef().child(snapshot.id).set(snapshot);
          operationHistory=historyEntries();
          saveLocalState();
        }catch(e){
          // 既に他端末が登録済みの場合はルールにより書込失敗するが、これは正常な競合
          console.warn('履歴追加競合または失敗',e);
        }
      }
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.stateByDay={平日:{},休日:{}};
      registrationState={};
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }catch(e){ console.error('remote reset failed',e); }
  }else{
    if(currentOperationDate!==opDate){
      const snapshot=snapshotFromStateRoot(remoteRoot,currentOperationDate);
      remoteRoot.stateByDay={平日:{},休日:{}};
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.history=remoteRoot.history||{};
      if(snapshot.days.length) remoteRoot.history[snapshot.id]=snapshot;
      registrationState={};
      operationHistory=historyEntries();
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }else{
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      saveLocalState();
    }
  }
}

function historyToJsonl(){
  return historyEntries().map(x=>JSON.stringify(x)).join('\n')+(operationHistory.length?'\n':'');
}

function initSharedState(){
  loadLocalState();
  if('BroadcastChannel' in window){
    channel=new BroadcastChannel(CHANNEL_NAME);
    channel.onmessage=e=>{
      if(!e.data||e.data.source!=='train-app'||!e.data.root) return;
      const changed=hydrateFromRoot(e.data.root);
      if(!changed) return;
      saveLocalState();
      refreshAllTrainDataCache();
      if(isEditMode){
        syncStatus('編成入力中：更新を一時停止');
        return;
      }
      renderLine();
      if(currentTrainNo) updateSheetContent();
    };
  }
  window.addEventListener('storage',e=>{
    if(e.key!==STORAGE_KEY || !e.newValue) return;
    try{
      const obj=JSON.parse(e.newValue);
      const nextRoot={...remoteRoot,operationDate:obj.operationDate||remoteRoot.operationDate,stateByDay:obj.stateByDay||remoteRoot.stateByDay,history:obj.history||remoteRoot.history};
      const changed=hydrateFromRoot(nextRoot);
      if(!changed) return;
      refreshAllTrainDataCache();
      if(isEditMode) return;
      renderLine();
      if(currentTrainNo) updateSheetContent();
    }catch(err){ console.warn('storage sync failed',err); }
  });
}

  if(currentDay==='休日'){
    return HOLIDAY_DOWN_TRAINS.map(t=>liveTrain(t.no)||t);
  }
  return TRAINS.filter(t=>t.days.includes(currentDay)).map(t=>liveTrain(t.no)||t);
}
function getShortType(type, trainNo=''){
  const value=String(type||'');
  if(value==='区間急行') return '区急';
  return value;
}
function getDetailType(type){ return String(type||''); }
// 列車番号は上下列車とも末尾Aを付けて表示する。
function displayTrainNo(train){
  if(!train) return '';
  let no=normalizeTrainNo(train.no);
  // 回送列車は列番末尾にAを付けない。
  if(String(train.type||'')!=='回送' && !/A$/i.test(no)) no += 'A';
  return no;
}

  const map={
    '春日部':'春日',
    '七光台':'七光',

  };

}
function nthMondayDateKey(year,month,nth){
  const d=new Date(year,month-1,1);
  const offset=(8-d.getDay())%7;
  d.setDate(1+offset+(nth-1)*7);
  return todayKey(d);
}
function equinoxDateKey(year,isVernal){
  // 日本の春分・秋分日は将来の暦にも対応できるよう近似計算。
  // 1980～2099年程度で実用上十分な精度。
  const y=year-1980;
  const base=isVernal?20.8431:23.2488;
  const drift=0.242194;
  const day=Math.floor(base+drift*y-Math.floor(y/4));
  return `${year}-${isVernal?'03':'09'}-${String(day).padStart(2,'0')}`;
}
function getJapaneseNationalHolidays(year){
  const h=new Set();
  const add=(m,d)=>h.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);
  h.add(nthMondayDateKey(year,1,2));
  add(2,11);
  if(year>=2020) add(2,23);
  h.add(equinoxDateKey(year,true));
  add(4,29); add(5,3); add(5,4); add(5,5);
  h.add(nthMondayDateKey(year,7,3));
  add(8,11);
  h.add(nthMondayDateKey(year,9,3));
  h.add(equinoxDateKey(year,false));
  h.add(nthMondayDateKey(year,10,2));
  add(11,3); add(11,23);

  // 一時的な祝日移動など
  if(year===2019){ add(5,1); add(10,22); }
  if(year===2020){
    h.delete(`${year}-07-20`); add(7,23);
    h.delete(`${year}-10-12`); add(7,24);
  }
  if(year===2021){
    h.delete(`${year}-07-19`); add(7,22); add(7,23);
    h.delete(`${year}-08-11`); add(8,8);
    h.delete(`${year}-10-11`);
  }
  return h;
}
function getJapaneseHolidaySet(year){
  const national=getJapaneseNationalHolidays(year);
  const holidays=new Set(national);
  // 日曜祝日の振替休日
  for(const key of [...national]){
    const d=new Date(`${key}T00:00:00`);
    if(d.getDay()!==0) continue;
    const cursor=new Date(d);
    do{
      cursor.setDate(cursor.getDate()+1);
      const k=todayKey(cursor);
      if(!national.has(k) && !holidays.has(k)){ holidays.add(k); break; }
    }while(cursor.getFullYear()<=year+1);
  }
  // 祝日に挟まれた休日
  const start=new Date(year,0,1), end=new Date(year,11,31);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=todayKey(d);
    if(holidays.has(key)) continue;
    const prev=new Date(d); prev.setDate(prev.getDate()-1);
    const next=new Date(d); next.setDate(next.getDate()+1);
    if(national.has(todayKey(prev)) && national.has(todayKey(next))) holidays.add(key);
  }
  return holidays;
}
function isJapaneseHoliday(dateObj){
  return getJapaneseHolidaySet(dateObj.getFullYear()).has(todayKey(dateObj));
}
function getScheduleDayForDate(dateObj){
  const d=new Date(dateObj);
  const weekend=d.getDay()===0||d.getDay()===6;
  return (weekend||isJapaneseHoliday(d))?'休日':'平日';
}
function isHistoricalSelectedDate(dateKey){
  const today=todayKey(new Date());
  return String(dateKey||'') < today;
}
function isNonCurrentSelectedDate(dateKey){
  const today=todayKey(new Date());
  return String(dateKey||'') !== today;
}
function historicalStateForDate(dateKey){
  const root=remoteRoot.history||{};
  const snap=root[String(dateKey)] || Object.values(root).find(x=>String(x?.date||'')===String(dateKey)) || null;
  if(!snap) return {};
  const days=Array.isArray(snap.days)?snap.days:[snap];
  let daySnap=days.find(d=>String(d?.day||'')===String(currentDay)) || null;
  // Older snapshots may have been saved without a day label. In that case the
  // first valid day snapshot is still preferable to returning an empty state.
  if(!daySnap && days.length===1) daySnap=days[0];
  if(!daySnap || !Array.isArray(daySnap.operations)) return {};
  const state={};
  const resolveKey=raw=>{
    const s=String(raw||'');
    if(s==='103'||s==='111') return s;
    if(TRAIN_INDEX[s]) return s;
    const a=s.replace(/A$/i,'')+'A';
    if(TRAIN_INDEX[a]) return a;
    const plain=s.replace(/A$/i,'');
    if(TRAIN_INDEX[plain]) return plain;
    return a;
  };
  daySnap.operations.forEach(op=>{
    const form=op?.formationId;
    (Array.isArray(op?.trainNumbers)?op.trainNumbers:[]).forEach(no=>{
      if(!form) return;
      state[resolveKey(no)]=String(form);
    });
  });
  return state;
}
function setSelectedDate(dateKey){
  const value=String(dateKey||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
  const d=new Date(`${value}T00:00:00`);
  if(Number.isNaN(d.getTime())) return;
  selectedDateKey=value;
  currentDay=getScheduleDayForDate(d);
  if(currentTrainNo) currentTrainSnapshot=trainForCurrentDay(currentTrainNo);
  registrationState=isHistoricalSelectedDate(value)
    ? historicalStateForDate(value)
    : cloneState(remoteRoot.stateByDay?.[currentDay]||{});
  applyRegistrationState();
  const label=document.getElementById('scheduleDayLabel');
  if(label) label.textContent=isHistoricalSelectedDate(value) ? `${currentDay}ダイヤ・過去データ` : `${currentDay}ダイヤ`;
  saveLocalState();
  refreshAllTrainDataCache();
  renderLine();
  if(currentTrainNo) updateSheetContent();
}

function formationById(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return null;
  for(const group of FORMATIONS){
    if(group.type===id) return {id:group.type,name:group.type,img:group.typeImg,kind:'type',type:group.type};
    const direct=(group.items||[]).find(i=>i.id===id);
    if(direct) return direct;
    for(const variant of (group.variants||[])){
      if(variant.id===id) return {...variant,kind:'variant',type:group.type};
      const found=(variant.items||[]).find(i=>i.id===id);
      if(found) return found;
    }
  }
  return null;
}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase();
  const v=raw.replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!v) return {ok:false,error:'車両番号または編成番号を入力してください。'};

  // 編成番号を直接入力した場合（Fあり/なし両対応）。
  const candidates=[v, v.endsWith('F')?v.slice(0,-1):v, v+'F'];
  for(const c of candidates){
    const exact=formationById(c);
    if(exact){
      if(UNAVAILABLE_FORMATIONS.has(String(exact.id))) return {ok:false,error:`編成「${exact.name}」は入力できません。`};
      return {ok:true,id:exact.id};
    }
  }

  // 車両番号から編成番号を特定する。
  const normalized=v.replace(/[^A-Z0-9]/g,'');
  const formationId=VEHICLE_TO_FORMATION[normalized] || VEHICLE_TO_FORMATION[normalized.replace(/F$/,'')];
  if(formationId && formationById(formationId)){
    if(UNAVAILABLE_FORMATIONS.has(String(formationId))) return {ok:false,error:`編成「${formationById(formationId)?.name||formationId}」は入力できません。`};
    return {ok:true,id:formationId};
  }

  return {ok:false,error:`車両番号「${raw}」に該当する編成が見つかりません。`};
}
function selectionDisplayObject(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return INITIAL_FORMATION_SELECTION;
  const known=formationById(id);
  return known || INITIAL_FORMATION_SELECTION;
}

function normalizeFiveCarInputNo(v){
  const raw=String(v??'').trim().toUpperCase().replace(/[Ａ]/g,'A').replace(/[Ｆ]/g,'F');
  if(!raw) return '';
  const core=raw.replace(/F$/i,'');
  if(/^\d+$/.test(core)) return core+'A';
  return core;
}
function getFiveCarTrainNumbersFromInput(){
  return new Set(String(TODAY_FIVE_CAR_TRAIN_NUMBERS||'')
    .split(/[\s,、，]+/)
    .map(normalizeFiveCarInputNo)
    .filter(Boolean));
}
function operationContainsFiveCarNo(t){
  const five=getFiveCarTrainNumbersFromInput();
  if(!five.size) return null;
  if(currentDay==='休日'){
    const target=normalizeTrainNo(t.no);
    return five.has(normalizeFiveCarInputNo(t.no));
  }
  const chains=OPERATION_CHAINS[currentDay]||[];
  const target=normalizeTrainNo(t.no);
  const targetCore=target.replace(/A$/i,'');
  let foundTargetChain=false;
  for(const chain of chains){
    const hasTarget=chain.some(e=>{
      const n=normalizeTrainNo(e.no);
      return n===target || n.replace(/A$/i,'')===targetCore;
    });
    if(!hasTarget) continue;
    foundTargetChain=true;
    if(chain.some(e=>five.has(normalizeFiveCarInputNo(e.no)))) return true;
  }
  return foundTargetChain ? false : false;
}
function prescribedFormationName(t){
  if(t?.type!=='普通') return t?.defaultCars || '普通共通';
  // 当日の普通列車は必ず5両または6両。5両運用に含まれない列車は6両とする。
  // 過去・未来の日付については従来どおり普通共通を表示する。
  if(String(selectedDateKey)!==todayKey()) return '普通共通';
  return operationContainsFiveCarNo(t) === true ? '普通5両' : '普通6両';
}

  if(followNow){
    const d=new Date();
    // 現在時刻は秒まで使い、列車位置を1秒単位で連続的に更新する。
    return d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
  }
  const input=document.getElementById('timeInput');
  const value=input?.value || formatTimeNow();
  const [h,m]=String(value).split(':').map(Number);
  if(Number.isFinite(h) && Number.isFinite(m)) return h*60+m;
  return new Date().getHours()*60+new Date().getMinutes();
}

function timeToMinutes(value){ const [h,m]=String(value).split(':').map(Number); return h*60+m; }

function linkedEntries(t){
  const info=findChain(currentDay,t.no);
  if(!info) return {prev:null,next:null,chain:null,index:-1};
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  return {prev:chain[info.entryIndex-1]||null,next:chain[info.entryIndex+1]||null,chain,index:info.entryIndex};
}
function trainEntryNo(entry){ return entry?normalizeTrainNo(entry.no):''; }
function connectionPrev(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const prev=chain[info.entryIndex-1];
  if(!prev || String(prev.dest)!==String(t.start)) return null;
  if(timeToMinutes(prev.endTime)>timeToMinutes(t.stops[0].time)) return null;
  return prev;
}
function connectionNext(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const next=chain[info.entryIndex+1];
  if(!next || String(t.dest)!==String(next.start)) return null;
  if(timeToMinutes(t.stops[t.stops.length-1].time)>timeToMinutes(next.startTime)) return null;
  return next;
}
function typicalTakayanagiRunMinutes(direction){
  // 高柳とその直前駅の通常走行時間を、時刻表上の普通列車から推定。
  // 急行待避などで長くなっている区間は除外し、5分以内の最頻値を採用する。
  const gaps=[];
  for(const other of TRAINS){
    if(other.direction!==direction || other.type!=='普通') continue;
    const ids=(other.stops||[]).map(s=>s.station);
    const ti=ids.indexOf('高柳');
    if(ti<=0) continue;
    const prev=other.stops[ti-1], curr=other.stops[ti];
    const gap=timeToMinutes(curr.time)-timeToMinutes(prev.time);
    if(gap>=1 && gap<=5) gaps.push(gap);
  }
  if(!gaps.length) return 3;
  const counts=new Map();
  gaps.forEach(g=>counts.set(g,(counts.get(g)||0)+1));
  return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0];
}

const TYPICAL_TAKAYANAGI_RUN = {
  up: typicalTakayanagiRunMinutes('up'),
  down: typicalTakayanagiRunMinutes('down')
};

function apparentTakayanagiArrival(t){
  // メイン画面の列車アイコンだけに使う「見かけ上の高柳着時刻」。
  // 柏～船橋間で急行に追い越される普通列車のうち、
  // 高柳手前の区間だけ不自然に長いものを補正する。
  if(!t || t.type!=='普通' || !['up','down'].includes(t.direction)) return null;
  const stops=t.stops||[];
  const ids=stops.map(s=>s.station);
  const hi=ids.indexOf('高柳');
  if(hi<=0) return null;
  const prev=stops[hi-1], taka=stops[hi];
  if(!['柏','船橋'].every(name=>ids.includes(name))) return null;

  const actualGap=timeToMinutes(taka.time)-timeToMinutes(prev.time);
  const typical=TYPICAL_TAKAYANAGI_RUN[t.direction]||3;
  if(actualGap<=typical+1) return null;

  const endpointA=t.direction==='up'?'船橋':'柏';
  const endpointB=t.direction==='up'?'柏':'船橋';
  const aStop=stops.find(x=>x.station===endpointA);
  const bStop=stops.find(x=>x.station===endpointB);
  if(!aStop || !bStop) return null;
  const a=timeToMinutes(aStop.time), b=timeToMinutes(bStop.time);

  const hasOvertakeScenario=TRAINS.some(e=>{
    if(e===t || e.type!=='急行' || e.direction!==t.direction) return false;
    const es=e.stops||[];
    const ea=es.find(x=>x.station===endpointA);
    const eb=es.find(x=>x.station===endpointB);
    if(!ea || !eb) return false;
    const exA=timeToMinutes(ea.time), exB=timeToMinutes(eb.time);
    return a<exA && b>exB;
  });
  if(!hasOvertakeScenario) return null;

  return timeToMinutes(prev.time)+typical;
}

function positionForTrain(t,minutes){
  const stops=t.stops||[];
  if(!stops.length) return null;
  const firstStation=stops[0].station, lastStation=stops[stops.length-1].station;
  const first=timeToMinutes(stops[0].time), last=timeToMinutes(stops[stops.length-1].time);
  const chainInfo=findChain(currentDay,t.no);
  const chain=chainInfo ? OPERATION_CHAINS[currentDay][chainInfo.chainIndex] : null;
  const isChainFirst=!!chain && chainInfo.entryIndex===0;
  const isChainLast=!!chain && chainInfo.entryIndex===chain.length-1;
  const next=connectionNext(t);
  const nextStart=next?timeToMinutes(next.startTime):null;

  if(isChainFirst && minutes>=first-RESET_DWELL_MIN && minutes<first){
    return {pos:stationIndex(firstStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'start'};
  }

  // メイン画面専用の高柳見かけ着時刻補正。
  // 実際の時刻表や駅時刻表の表示値は変更しない。
  // 土休日下り：高柳・岩槻で急行（区間急行を含む）を退避する普通列車は、
  // 退避なしの標準走行時間から算出した仮の到着時刻で位置を補正する。
  const holidayProv=HOLIDAY_DOWN_PROVISIONAL_ARRIVALS[String(t.no)]||null;
  if(currentDay==='休日' && t.direction==='down' && holidayProv && minutes>=first && minutes<=last){
    const ids=stops.map(s=>s.station);
    for(const station of Object.keys(holidayProv)){
      const si=ids.indexOf(station);
      if(si<=0) continue;
      const prevStop=stops[si-1], targetStop=stops[si];
      const prevTime=timeToMinutes(prevStop.time);
      const realTime=timeToMinutes(targetStop.time);
      const apparentTime=holidayProv[station];
      if(minutes>=prevTime && minutes<=apparentTime){
        const ia=stationIndex(prevStop.station), ib=stationIndex(station);
        const ratio=apparentTime===prevTime?0:(minutes-prevTime)/(apparentTime-prevTime);
        return {pos:ia+(ib-ia)*ratio,side:'right',visualTrain:t,mode:'run-apparent-holiday'};
      }
      if(minutes>apparentTime && minutes<realTime){
        return {pos:stationIndex(station),side:'right',visualTrain:t,mode:'apparent-dwell-holiday'};
      }
      if(minutes>=realTime){
        for(let i=si;i<stops.length-1;i++){
          const a=stops[i],b=stops[i+1];
          const t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
          if(minutes>=t0 && minutes<=t1){
            const ia=stationIndex(a.station),ib=stationIndex(b.station);
            const ratio=t1===t0?0:(minutes-t0)/(t1-t0);
            return {pos:ia+(ib-ia)*ratio,side:'right',visualTrain:t,mode:'run'};
          }
        }
      }
      for(let i=0;i<si-1;i++){
        const a=stops[i],b=stops[i+1];
        const t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
        if(minutes>=t0 && minutes<=t1){
          const ia=stationIndex(a.station),ib=stationIndex(b.station);
          const ratio=t1===t0?0:(minutes-t0)/(t1-t0);
          return {pos:ia+(ib-ia)*ratio,side:'right',visualTrain:t,mode:'run'};
        }
      }
    }
  }

  const apparentArrival=currentDay==='休日' ? null : apparentTakayanagiArrival(t);
  if(apparentArrival!==null && minutes>=first && minutes<=last){
    const ids=stops.map(s=>s.station);
    const hi=ids.indexOf('高柳');
    const prevStop=stops[hi-1];
    const takaStop=stops[hi];
    const ta=timeToMinutes(prevStop.time);
    const apparentTd=apparentArrival;
    const realTd=timeToMinutes(takaStop.time);

    // 高柳手前は推定した着時刻まで通常より速く移動。
    if(minutes>=ta && minutes<=apparentTd){
      const ia=stationIndex(prevStop.station), ib=stationIndex('高柳');
      const ratio=apparentTd===ta?0:(minutes-ta)/(apparentTd-ta);
      return {pos:ia+(ib-ia)*ratio,side:t.direction==='down'?'right':'left',visualTrain:t,mode:'run-apparent'};
    }
    // 推定着～所定発は高柳で停車しているように見せる。
    if(minutes>apparentTd && minutes<realTd){
      return {pos:stationIndex('高柳'),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'apparent-dwell'};
    }

    // 高柳発以降は所定時刻で通常走行。
    if(minutes>=realTd){
      for(let i=hi;i<stops.length-1;i++){
        const a=stops[i],b=stops[i+1];
        const t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
        if(minutes>=t0 && minutes<=t1){
          const ia=stationIndex(a.station),ib=stationIndex(b.station);
          const ratio=t1===t0?0:(minutes-t0)/(t1-t0);
          return {pos:ia+(ib-ia)*ratio,side:t.direction==='down'?'right':'left',visualTrain:t,mode:'run'};
        }
      }
    }

    // 高柳より前の区間は通常時刻で走行。
    for(let i=0;i<hi-1;i++){
      const a=stops[i],b=stops[i+1];
      const t0=timeToMinutes(a.time),t1=timeToMinutes(b.time);
      if(minutes>=t0 && minutes<=t1){
        const ia=stationIndex(a.station),ib=stationIndex(b.station);
        const ratio=t1===t0?0:(minutes-t0)/(t1-t0);
        return {pos:ia+(ib-ia)*ratio,side:t.direction==='down'?'right':'left',visualTrain:t,mode:'run'};
      }
    }
  }else if(minutes>=first && minutes<=last){
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i],b=stops[i+1];
      const ta=timeToMinutes(a.time),tb=timeToMinutes(b.time);
      if(minutes>=ta && minutes<=tb){
        const ia=stationIndex(a.station),ib=stationIndex(b.station);
        const ratio=tb===ta?0:(minutes-ta)/(tb-ta);
        return {pos:ia+(ib-ia)*ratio,side:t.direction==='down'?'right':'left',visualTrain:t,mode:'run'};
      }
    }
  }

  if(next && !isChainLast && minutes>last && minutes<nextStart){
    if(minutes<=last+TURNBACK_SWITCH_MIN){
      return {pos:stationIndex(lastStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'turn-arrival'};
    }
    const nextNo=trainEntryNo(next);
    const nextTrain=liveTrain(nextNo)||TRAIN_INDEX[nextNo]||null;
    const nextSide=nextTrain?(nextTrain.direction==='down'?'right':'left'): (inferDirectionFromStations(next.start,next.dest)==='down'?'right':'left');
    return {pos:stationIndex(lastStation),side:nextSide,visualTrain:nextTrain||t,mode:'turn-wait'};
  }

  if(isChainLast && minutes>=last && minutes<=last+RESET_DWELL_MIN){
    return {pos:stationIndex(lastStation),side:t.direction==='down'?'right':'left',visualTrain:t,mode:'end'};
  }
  return null;
}
function trainLabelText(t){ return `<span>${getShortType(t.type,t.no)} ${getShortDest(t.dest)}</span>`; }
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  layer.innerHTML='';
  const visible=getVisibleTrains();
  const occupied={left:[],right:[]};
  visible.forEach(t=>{
    const info=positionForTrain(t,minutes);
    if(!info || !info.visualTrain) return;
    occupied[info.side].push({t:info.visualTrain,pos:info.pos,baseTrain:t,mode:info.mode});
  });

  const rows=Array.from(document.querySelectorAll('.station-row'));
  const layerRect=layer.getBoundingClientRect();
  const uiScale=1;
  const trainWidth=66*uiScale;
  const imageWidth=60*uiScale;
  const laneGap=20*uiScale;

  const rowRectAt=(pos)=>{
    if(!rows.length) return null;
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p), i1=Math.min(rows.length-1,Math.ceil(p));
    const r0=rows[i0].getBoundingClientRect();
    const r1=rows[i1].getBoundingClientRect();
    const f=p-i0;
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24 && u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});

      const el=document.createElement('div');
      el.className=`train-icon ${side}`;
      el.style.visibility='hidden';
      el.style.transition='none';

      const rr=rowRectAt(item.pos) || {
        left:layerRect.left,right:layerRect.right,centerY:layerRect.top+layerRect.height/2
      };

      /*
       * 横位置は従来版と同じ「中央の縦線からの距離」を基準にする。
       * 今回の基準は .train-icon.left = 50% - 292px、
       * .train-icon.right = 50% - 292px（right指定）としている。
       * train-icon の左端は左=中心-292px、右=中心+292px-66px。
       * スマホ版は1920pxキャンバスを中央960pxだけ表示しているので、
       * その仮想座標上の中心960pxをそのまま使用する。
       * 複数本は20px間隔で中心から外側へ並べる。
       */
      const layoutWidth=window.innerWidth < 960 ? 1920 : layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'
        ? centerX-340-laneOffset
        : centerX+340-trainWidth+laneOffset;

      const t=item.t;
      const cls=trainVisualKind(t);
      el.innerHTML=`
        <span class="train-no">${displayTrainNo(t)}</span>
        <img src="${imageForTrain(t)}" alt="${displayTrainNo(t)}">
        <span class="train-label ${cls} ${getMainLabelClass(t.type)}">${trainLabelText(t)}</span>
      `;
      el.addEventListener('click',ev=>{
        ev.preventDefault();
        ev.stopPropagation();
        openSheet(t.no);
      });
      layer.appendChild(el);

      const img=el.querySelector('img');
      const noEl=el.querySelector('.train-no');

      const applyFinalPosition=()=>{
        if(!img) return;
        /*
         * スマホ版は #viewportCanvas を zoom で縮小しているため、
         * getBoundingClientRect() は「画面上の縮小後px」を返す。
         * その値をそのまま style.top に戻すと zoom が二重に掛かって
         * 縦位置が上へ詰まっていくため、ここで元のCSS座標へ戻す。
         */
        const mobileZoom=window.innerWidth < 960 ? window.innerWidth/960 : 1;
        const imgRect=img.getBoundingClientRect();
        const noRect=noEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom) || imageWidth;
        const imgHeight=(imgRect.height/mobileZoom) || actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom) || 12*uiScale*1.05;
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-noHeight-imgHeight/2;

        el.style.top=`${finalTop}px`;
        el.style.left=`${trainLeft}px`;
        el.style.right='auto';
        el.style.setProperty('--lane-shift','0px');
        el.style.transform='none';
        el.style.visibility='visible';
      };

      if(img.complete && img.naturalWidth){
        applyFinalPosition();
      }else{
        img.addEventListener('load',applyFinalPosition,{once:true});
      }
    });
  });
}

function openSheet(trainNo,fromStationTimetable=false){
  const key=String(trainNo ?? '');
  const train=trainForCurrentDay(key);
  if(!train) return;
  if(fromStationTimetable && currentStationId){
    previousSheetContext={type:'station-timetable',stationId:String(currentStationId),direction:stationTimetableDirection};
  }else{
    previousSheetContext=null;
  }
  currentStationId=null;
  currentTrainNo=key;
  currentTrainSnapshot={...train,stops:(train.stops||[]).map(x=>({...x}))};
  stationTimetableDirection='up';
  isEditMode=false;
  const sheet=document.getElementById('bottomSheet');
  const overlay=document.getElementById('overlay');
  if(!sheet || !overlay) return;
  sheet.classList.remove('editing');

function serviceDayMinute(hour,minute){
  const total=Number(hour)*60+Number(minute);
  return total<180 ? total+1440 : total;
}

function stationTimetableHTML(station, selectedDirection='up'){
  const stationName=String(station?.nameJa||'');
  const directionData={up:{label:'長野方面',entries:[]},down:{label:'湯田中方面',entries:[]}};
  const byTrain=new Map();

  // 当日の全列車を常に表示し、スクロール位置だけを「次発」に合わせる。
  getVisibleTrains().forEach(train=>{
    if(String(train?.dest||'')===stationName) return; // 当駅止まりは除外
    const stops=(train.stops||[]).filter(stop=>String(stop?.station||'')===stationName);
    if(!stops.length) return;
    const stop=stops[stops.length-1]; // 同一駅が2回ある場合は発車側の時刻
    const time=String(stop?.time||'');
    const m=time.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return;
    const hour=Number(m[1]), minute=Number(m[2]);
    if(!Number.isFinite(hour)||!Number.isFinite(minute)) return;
    const bucket=String(train?.direction||'up')==='down'?'down':'up';
    byTrain.set(`${bucket}:${String(train.no)}`,{train,hour,minute,time,bucket});
  });

  Array.from(byTrain.values())
    .sort((a,b)=>serviceDayMinute(a.hour,a.minute)-serviceDayMinute(b.hour,b.minute)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}))
    .forEach(entry=>directionData[entry.bucket].entries.push(entry));

  const escapeAttr=value=>String(value)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeJs=value=>String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const renderDirection=(key)=>{
    const data=directionData[key];
    if(!data.entries.length) return '';

    const now=currentMinutes();
    const nowService=serviceDayMinute(Math.floor(now/60), now%60);
    let nextIndex=data.entries.findIndex(entry=>serviceDayMinute(entry.hour,entry.minute)>=nowService);
    if(nextIndex<0) nextIndex=0;

    const rows=data.entries.map((item,index)=>{
      const train=item.train;
      const selectedForm=selectionDisplayObject(train.formation);
      const formationName=(selectedForm && selectedForm.id!==INITIAL_FORMATION_SELECTION.id)
        ? selectedForm.name
        : '—';
      const imgSrc=selectedForm?.img||'https://minamikaze2700.github.io/Unyomatome/images/TD_noimage.png';
      const destination=`${getDetailDest(train.dest)} 行`;
      const isNext=index===nextIndex;

      return `
        <button
          class="station-timetable-row${isNext?' is-next':''}"
          type="button"
          data-next-train="${isNext?'true':'false'}"
          title="列車 ${escapeAttr(displayTrainNo(train))} / ${escapeAttr(item.time)} / ${escapeAttr(destination)}"
          onclick="openSheet('${escapeJs(train.no)}',true)"
        >
          <img class="station-timetable-train-img" src="${escapeAttr(imgSrc)}" alt="${escapeAttr(displayTrainNo(train))}">
          <span class="station-timetable-formation">${escapeAttr(formationName)}</span>
          <span class="station-timetable-time">${escapeAttr(item.time)}</span>
          <span class="station-timetable-type ${escapeAttr(getExpressClass(train))}">${escapeAttr(String(train.type||""))}</span>
          <span class="station-timetable-destination"><span class="station-timetable-destination-station">${escapeAttr(getDetailDest(train.dest))}</span><span class="station-timetable-destination-go">行</span></span>
        </button>
      `;
    }).join('');

    return `<section class="station-timetable-direction" data-direction="${key}">${rows}</section>`;
  };

  const html=renderDirection(selectedDirection);
  if(!html) return `<div class="station-timetable-empty">この方面の時刻表はありません。</div>`;
  return `
    <div class="station-timetable-frame">
      <div class="station-timetable-wrap" id="stationTimetableScroll">
        ${html}
      </div>
    </div>
  `;
}

function formatFormationUpdatedAt(trainNo){
  const key=String(trainNo);
  // 編成未入力の列車には入力時刻を絶対に表示しない。
  const formation = Object.prototype.hasOwnProperty.call(pendingFormationState,key)
    ? pendingFormationState[key]
    : registrationState[key];
  if(!formation || formation===INITIAL_FORMATION_SELECTION.id) return '';
  const ts=remoteRoot.formationUpdatedAtByDay?.[currentDay]?.[key] || pendingFormationTimestamps?.[currentDay]?.[key];
  if(!ts) return '';
  const d=new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function registerFormationFromInput(){
  if(isNonCurrentSelectedDate(selectedDateKey)) return;
  const input=document.getElementById('formationManualInput');
  const errorEl=document.getElementById('formationInputError');
  const value=String(input?.value||'').trim();
  if(errorEl) errorEl.textContent='';
  if(!value){
    if(errorEl) errorEl.textContent='車両番号または編成番号を入力してください。';
    input?.focus();
    return;
  }
  const result=formationIdFromInput(value);
  if(!result.ok){
    if(errorEl) errorEl.textContent=result.error;
    input?.focus();
    return;
  }
  if(UNAVAILABLE_FORMATIONS.has(String(result.id))){
    if(errorEl) errorEl.textContent='この編成は入力できません。';
    input?.focus();
    return;
  }
  await selectFormation(result.id);
}

function toggleDropdown(){
  const el=document.getElementById('dropdownOptions');
  if(!el) return;
  const willOpen=!el.classList.contains('open');
  if(!willOpen){
    el.classList.remove('open');
    el.style.maxHeight='';
    return;
  }
  el.classList.add('open');
  requestAnimationFrame(()=>{
    const rect=el.getBoundingClientRect();
    const maxH=Math.max(80,Math.floor(window.innerHeight-10-rect.top));
    el.style.maxHeight=maxH+'px';
  });
}
let selectionSyncInProgress=false;
let pendingFormationTimestamps={平日:{},休日:{}};
async function selectFormation(formId){
  if(UNAVAILABLE_FORMATIONS.has(String(formId))) {
    syncStatus('この編成は入力できません');
    return;
  }
  if(isHistoricalSelectedDate(selectedDateKey)) return;
  const train=liveTrain(currentTrainNo);
  if(!train || selectionSyncInProgress) return;
  const normalizedId=String(formId ?? INITIAL_FORMATION_SELECTION.id);
  const dropdown=document.getElementById('dropdownOptions');
  if(dropdown) dropdown.classList.remove('open');

  // 状態変更はrecordSelection()の1か所だけで行う。二重更新を防止。
  selectionSyncInProgress=true;
  isEditMode=false;
  const sheet=document.getElementById('bottomSheet');
  if(sheet) sheet.classList.remove('editing');
  try{
    await recordSelection(train,normalizedId);
    refreshAllTrainDataCache();
    updateSheetContent();
    renderTrainPositions();
  }catch(e){
    console.error('編成登録同期失敗',e);
    syncStatus('同期失敗（再試行待ち）');
    updateSheetContent();
  }finally{
    selectionSyncInProgress=false;
  }
}
window.addEventListener('load',async ()=>{
  warmAllTrainData();
  refreshAllTrainDataCache();
  initSharedState();
  initDateControl();
  currentOperationDate=operationDateKey();
  await initFirebase();
  await maybeResetForNewOperationDay();
  initTimeControl();
  setNowTime();
  renderLine();
  setInterval(async ()=>{
    if(isEditMode) return;
    if(followNow){
      // 現在時刻モードでは1秒ごとに時刻・列車位置だけを更新。
      // 選択した日付は自動では今日へ戻さない。
      updateCurrentTimeOnly();
    }else{
      renderTrainPositions();
    }
  },1000);
  // 日付切替などの日次処理は毎分1回だけ実行する。
  setInterval(async ()=>{
    if(isEditMode) return;
    await maybeResetForNewOperationDay();
  },60000);
});
</script>
