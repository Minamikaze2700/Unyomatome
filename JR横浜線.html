function serviceDayMinute(hour,minute){
  const total=Number(hour)*60+Number(minute);
  return total<180 ? total+1440 : total;
}

function stationTimetableHTML(station, selectedDirection='up'){
  // 駅時刻表も選択日付から直接ダイヤ区分を同期。
  syncCurrentScheduleDay();
  const stationName=String(station?.nameJa||'');
  const directionLabels=getStationDirectionLabels(stationName);
  const directionData={up:{label:directionLabels.up,entries:[]},down:{label:directionLabels.down,entries:[]}};
  const byTrain=new Map();

  // 当日の全列車を常に表示し、スクロール位置だけを「次発」に合わせる。
  getVisibleTrains().forEach(train=>{
    if(String(train?.dest||'')===stationName) return; // 当駅止まりは除外
    // 駅の時刻表には回送列車を掲載しない。
    if(String(train?.type||'')==='回送') return;
    const stops=(train.stops||[]).filter(stop=>String(stop?.station||'')===stationName);
    if(!stops.length) return;
    const stop=stops[stops.length-1]; // 同一駅が2回ある場合は発車側の時刻
    const time=String(stop?.time||'');
    const m=time.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return;
    const hour=Number(m[1]), minute=Number(m[2]);
    if(!Number.isFinite(hour)||!Number.isFinite(minute)) return;
    const bucket=String(train?.direction||'up')==='down'?'down':'up';
    byTrain.set(`${bucket}:${String(train.no)}`,{train,hour,minute,time,bucket});
  });

  Array.from(byTrain.values())
    .sort((a,b)=>serviceDayMinute(a.hour,a.minute)-serviceDayMinute(b.hour,b.minute)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}))
    .forEach(entry=>directionData[entry.bucket].entries.push(entry));

  const escapeAttr=value=>String(value)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeJs=value=>String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const stationTimetableFormationParts=(train)=>{
    const obj=selectionDisplayObjectForTrain(train,train?.formation);
    if(!obj || obj.id===INITIAL_FORMATION_SELECTION.id) return ['—'];
    const type=String(obj.type||'').trim();
    const name=String(obj.name||'').trim();

    // 「60000型6両」のようにnameにも形式が入っている場合は、
    // 形式と要素を分離して2行で表示する。
    if(type && name){
      if(name===type) return [type];
      if(name.startsWith(type)){
        const element=name.slice(type.length).trim();
        return element ? [type, element] : [type];
      }
      // 「10030型 / 未更新」のようにnameが要素だけの場合。
      if(obj.kind==='variant') return [type, name];
    }

    const m=name.match(/^(.*?型)(.+)$/);
    if(m) return [m[1],m[2].trim()];
    return [name];
  };
  const stationTimetableFormationHTML=(train)=>{
    const parts=stationTimetableFormationParts(train);
    return `<span class="station-timetable-formation">${parts.map(x=>`<span class="station-timetable-formation-line">${escapeAttr(x)}</span>`).join('')}</span>`;
  };

  const renderDirection=(key)=>{
    const data=directionData[key];
    if(!data.entries.length) return '';

    const now=currentMinutes();
    const nowService=serviceDayMinute(Math.floor(now/60), now%60);
    let nextIndex=data.entries.findIndex(entry=>serviceDayMinute(entry.hour,entry.minute)>=nowService);
    if(nextIndex<0) nextIndex=0;

    const rows=data.entries.map((item,index)=>{
      const train=item.train;
      const selectedForm=selectionDisplayObjectForTrain(train,train.formation);
      const imgSrc=(train.formation&&train.formation!==INITIAL_FORMATION_SELECTION.id)?selectedForm.img:defaultTrainImage(train);
      const destination=`${getDetailDest(train.dest)} 行`;
      const isNext=index===nextIndex;

      return `
        <button
          class="station-timetable-row${isNext?' is-next':''}"
          type="button"
          data-next-train="${isNext?'true':'false'}"
          title="列車 ${escapeAttr(displayTrainNo(train))} / ${escapeAttr(item.time)} / ${escapeAttr(destination)}"
          onclick="openSheet('${escapeJs(train.no)}',true,'${escapeJs(train.direction||stationTimetableDirection)}')"
        >
          <img class="station-timetable-train-img" src="${escapeAttr(imgSrc)}" alt="${escapeAttr(displayTrainNo(train))}">
          ${stationTimetableFormationHTML(train)}
          <span class="station-timetable-time">${escapeAttr(item.time)}</span>
          <span class="station-timetable-type ${escapeAttr(getExpressClass(train))}">${escapeAttr(getDetailType(train.type))}</span>
          <span class="station-timetable-destination"><span class="station-timetable-destination-station">${escapeAttr(getDetailDest(train.dest))}</span><span class="station-timetable-destination-go">行</span></span>
        </button>
      `;
    }).join('');

    return `<section class="station-timetable-direction" data-direction="${key}">${rows}</section>`;
  };

  const html=renderDirection(selectedDirection);
  if(!html) return `<div class="station-timetable-empty">この方面の時刻表はありません。</div>`;
  return `
    <div class="station-timetable-frame">
      <div class="station-timetable-wrap" id="stationTimetableScroll">
        ${html}
      </div>
    </div>
  `;
}

function formatFormationUpdatedAt(trainNo){
  const key=String(trainNo);
  // 編成未入力の列車には入力時刻を絶対に表示しない。
  const direction=currentTrainSnapshot?.direction||null;
  const train=(currentTrainSnapshot&&String(currentTrainSnapshot.no||'')===key)
    ? currentTrainSnapshot
    : trainForCurrentDay(key,direction);
  const formation = registeredFormationForTrain(train);
  if(!formation || formation===INITIAL_FORMATION_SELECTION.id) return '';
  const family=train?formationFamilyForTrain(train):PRIMARY_FORMATION_FAMILY;
  const ts=formationRemoteByFamily[family]?.formationUpdatedAtByDay?.[currentDay]?.[key] || remoteRoot.formationUpdatedAtByDay?.[currentDay]?.[key] || pendingFormationTimestamps?.[currentDay]?.[key];
  if(!ts) return '';
  const d=new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

  const input=document.getElementById('formationManualInput');

  const value=String(input?.value||'').trim();
  if(errorEl) errorEl.textContent='';

    input?.focus();

  const result=formationIdFromInput(value);

    syncStatus('この編成は入力できません');

    await recordSelection(train,normalizedId);
    refreshAllTrainDataCache();

    // 最新の列車データを現在のスナップショットにも反映する。
    currentTrainSnapshot = liveTrain(train.no,train.direction||null) || trainForCurrentDay(train.no,train.direction||null) || train;

/* 横浜線・運行情報 */
const OPERATION_INFO_STORAGE_KEY='jreYokohamaOperationInfo_v1';
const OPERATION_INFO_REASONS=['人身事故','車両故障・点検','信号・電気設備トラブル','線路内立入り・支障物','踏切・安全確認','天候（大雨・強風・雷・雪）','地震・災害','急病人救護','混雑・その他'];
const OPERATION_INFO_STATIONS=STATIONS.map(s=>s.nameJa);
let operationInfoEntries=[];
let operationInfoFirebaseListenerRef=null;
let operationInfoFirebaseSaving=false;
function operationInfoNormalizeName(name){return String(name??'').normalize('NFKC').replace(/\u3000/g,' ').trim();}
function operationInfoFindPath(start,end){
  start=operationInfoNormalizeName(start); end=operationInfoNormalizeName(end);
  const a=OPERATION_INFO_STATIONS.indexOf(start), b=OPERATION_INFO_STATIONS.indexOf(end);
  if(a<0||b<0||a===b) return null;
  const step=a<b?1:-1, path=[];
  for(let i=a;;i+=step){ path.push(OPERATION_INFO_STATIONS[i]); if(i===b) break; }
  return path.length>=2?path:null;
}
function operationInfoUndirectedKey(a,b){return [String(a||''),String(b||'')].sort().join('\u0000');}
function operationInfoPathEdges(stations){const set=new Set();for(let i=0;i<stations.length-1;i++)set.add(operationInfoUndirectedKey(stations[i],stations[i+1]));return set;}
function operationInfoSubtractEdges(stations,blocked){
  const parts=[]; let cur=[];
  for(let i=0;i<stations.length-1;i++){
    const a=stations[i],b=stations[i+1];
    if(blocked.has(operationInfoUndirectedKey(a,b))){if(cur.length>=2)parts.push(cur);cur=[];continue;}
    if(!cur.length)cur=[a]; cur.push(b);
  }
  if(cur.length>=2)parts.push(cur);
  return parts;
}
function operationInfoDelayValue(value){if(value===null||value===undefined||String(value)==='')return'unknown';const n=Number(value);return Number.isFinite(n)&&n>0?n:'unknown';}
function operationInfoDelayText(value){const d=operationInfoDelayValue(value);return d==='unknown'?'遅延時間不明':`遅延 ${d}分`;}
function normalizeOperationEntry(e){
  const stations=Array.isArray(e?.stations)&&e.stations.length>=2?e.stations.map(operationInfoNormalizeName):operationInfoFindPath(e?.start,e?.end);
  if(!stations||stations.length<2) return null;
  return {...e,start:stations[0],end:stations.at(-1),stations,status:e?.status==='suspend'?'suspend':'delay',delay:e?.status==='suspend'?'unknown':operationInfoDelayValue(e?.delay)};
}
function operationInfoDateKey(){return String(selectedDateKey||operationDateKey());}
function loadOperationInfo(){try{const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');operationInfoEntries=(Array.isArray(all?.[operationInfoDateKey()])?all[operationInfoDateKey()]:[]).map(normalizeOperationEntry).filter(Boolean);}catch(e){operationInfoEntries=[];}}
function saveOperationInfo(){try{const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');all[operationInfoDateKey()]=operationInfoEntries;localStorage.setItem(OPERATION_INFO_STORAGE_KEY,JSON.stringify(all));}catch(e){}}
function formatTimestampShort(ts){if(!ts)return '';const d=new Date(Number(ts));if(Number.isNaN(d.getTime()))return '';const now=new Date();const hhmm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()?hhmm:`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${hhmm}`;}
function operationInfoFirebasePayload(entry){return{id:String(entry.id),start:operationInfoNormalizeName(entry.start),end:operationInfoNormalizeName(entry.end),stations:Array.isArray(entry.stations)?entry.stations.map(operationInfoNormalizeName):[],status:entry.status==='suspend'?'suspend':'delay',delay:operationInfoDelayValue(entry.delay),reason:String(entry.reason||OPERATION_INFO_REASONS[0]),createdAt:Number(entry.createdAt)||Date.now(),operationDate:operationInfoDateKey()};}
function operationInfoFirebaseFlatten(v){const root=v&&typeof v==='object'?v:{};return Object.entries(root).map(([id,p])=>normalizeOperationEntry({...p,id:String(p?.id||id)})).filter(Boolean);}
async function saveOperationInfoToFirebase(){
  if(!firebaseReady||operationInfoFirebaseSaving) return false;
  operationInfoFirebaseSaving=true;
  try{
    const db=firebaseDatabase(); if(!db) return false; const ref=db.ref('運行情報').child(operationInfoDateKey());
    const tree={};
    operationInfoEntries.map(normalizeOperationEntry).filter(Boolean).forEach(e=>{tree[String(e.id)]=operationInfoFirebasePayload(e);});
    await ref.set(tree);
    return true;
  }catch(e){console.warn('運行情報Firebase保存失敗',e);return false;}
  finally{operationInfoFirebaseSaving=false;}
}
async function loadOperationInfoFromFirebase(){
  if(!firebaseReady) return false;
  try{
    const db=firebaseDatabase(); if(!db) return false; const ref=db.ref('運行情報').child(operationInfoDateKey());
    const snap=await ref.once('value');
    if(snap.exists()){
      const remote=operationInfoFirebaseFlatten(snap.val());
      const merged=new Map();
      [...operationInfoEntries,...remote].forEach(e=>{if(!e?.id)return;const id=String(e.id),prev=merged.get(id);if(!prev||Number(e.createdAt||0)>=Number(prev.createdAt||0))merged.set(id,e);});
      operationInfoEntries=[...merged.values()];
    }
    saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();
    return true;
  }catch(e){console.warn('運行情報Firebase読込失敗',e);return false;}
}
function attachOperationInfoFirebaseListener(){
  if(!firebaseReady) return;
  try{if(operationInfoFirebaseListenerRef)operationInfoFirebaseListenerRef.off();}catch(e){}
  const db=firebaseDatabase(); if(!db) return; const ref=db.ref('運行情報').child(operationInfoDateKey());
  const handler=snap=>{
    if(operationInfoFirebaseSaving)return;
    operationInfoEntries=operationInfoFirebaseFlatten(snap.val()||{});
    saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();
  };
  ref.on('value',handler);operationInfoFirebaseListenerRef=ref;
}
function updateOperationInfoStationOptions(){
  const a=document.getElementById('operationInfoStart'),b=document.getElementById('operationInfoEnd');if(!a||!b)return;
  const html=OPERATION_INFO_STATIONS.map(st=>`<option value="${esc(st)}">${esc(st)}</option>`).join('');
  const pa=operationInfoNormalizeName(a.value),pb=operationInfoNormalizeName(b.value);a.innerHTML=html;b.innerHTML=html;
  if(OPERATION_INFO_STATIONS.includes(pa))a.value=pa; else a.selectedIndex=0;
  if(OPERATION_INFO_STATIONS.includes(pb))b.value=pb; else b.selectedIndex=Math.min(1,OPERATION_INFO_STATIONS.length-1);
}
function updateOperationInfoReasonOptions(){const r=document.getElementById('operationInfoReason');if(!r)return;const prev=r.value||OPERATION_INFO_REASONS[0];r.innerHTML=OPERATION_INFO_REASONS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(OPERATION_INFO_REASONS.includes(prev))r.value=prev;}
function initOperationInfoUI(){
  updateOperationInfoStationOptions();updateOperationInfoReasonOptions();
  const delay=document.getElementById('operationInfoDelay');
  document.querySelectorAll('input[name="operationStatus"]').forEach(x=>{if(x.dataset.bound==='1')return;x.dataset.bound='1';x.addEventListener('change',()=>{if(delay)delay.disabled=x.value==='suspend'&&x.checked;});});
  const checked=document.querySelector('input[name="operationStatus"]:checked');if(checked&&delay)delay.disabled=checked.value==='suspend';renderOperationInfoList();
}
function openOperationInfo(){initOperationInfoUI();document.getElementById('operationInfoBackdrop')?.classList.add('active');document.getElementById('operationInfoPanel')?.classList.add('active');renderOperationInfoList();}
function closeOperationInfo(){document.getElementById('operationInfoBackdrop')?.classList.remove('active');document.getElementById('operationInfoPanel')?.classList.remove('active');hideOperationInfoDetail();}
function resetOperationInfoForm(){updateOperationInfoStationOptions();updateOperationInfoReasonOptions();const d=document.getElementById('operationInfoDelay');if(d){d.disabled=false;d.value='unknown';}const r=document.getElementById('operationInfoReason');if(r)r.value=OPERATION_INFO_REASONS[0];const first=document.querySelector('input[name="operationStatus"][value="delay"]');if(first){first.checked=true;first.dispatchEvent(new Event('change'));}}
function addOperationInfo(){
  const start=operationInfoNormalizeName(document.getElementById('operationInfoStart')?.value||''),end=operationInfoNormalizeName(document.getElementById('operationInfoEnd')?.value||''),status=document.querySelector('input[name="operationStatus"]:checked')?.value||'delay',reason=document.getElementById('operationInfoReason')?.value||OPERATION_INFO_REASONS[0],delay=(document.getElementById('operationInfoDelay')?.value==='unknown'?'unknown':Number(document.getElementById('operationInfoDelay')?.value||0)||0),path=operationInfoFindPath(start,end);
  if(!path){alert('選択した2駅を結ぶ区間が見つかりません。');return;}
  if(status==='delay'&&delay!=='unknown'&&(!Number.isFinite(delay)||delay<5||delay%5!==0)){alert('遅延時間は5分単位で選択してください。');return;}
  const newEdges=operationInfoPathEdges(path),next=[];
  for(const raw of operationInfoEntries){const old=normalizeOperationEntry(raw);if(!old)continue;for(const part of operationInfoSubtractEdges(old.stations,newEdges)){next.push({...old,id:`${old.id}_${Math.random().toString(36).slice(2,7)}`,start:part[0],end:part.at(-1),stations:part});}}
  next.push({id:`${Date.now()}_${Math.random().toString(36).slice(2,8)}`,start,end,stations:path,status,delay:status==='delay'?delay:'unknown',reason,createdAt:Date.now()});
  operationInfoEntries=next.map(normalizeOperationEntry).filter(Boolean);saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();resetOperationInfoForm();saveOperationInfoToFirebase();
}
function deleteOperationInfo(id){operationInfoEntries=operationInfoEntries.filter(x=>String(x.id)!==String(id));saveOperationInfo();renderOperationInfoList();renderOperationInfoZones();saveOperationInfoToFirebase();}
function showOperationInfoDetail(id){const e=operationInfoEntries.find(x=>String(x.id)===String(id));if(!e)return;const body=document.getElementById('operationInfoDetailBody');if(!body)return;const txt=e.status==='suspend'?'運転見合わせ':operationInfoDelayText(e.delay);const posted=formatTimestampShort(e.createdAt);body.innerHTML=`<div class="operation-info-detail-status ${e.status==='suspend'?'suspend':'delay'}">${esc(txt)}</div><div><strong>区間：</strong>${esc(`${e.start} ⇄ ${e.end}`)}</div><div><strong>理由：</strong>${esc(e.reason||OPERATION_INFO_REASONS[0])}</div><div><strong>投稿時刻：</strong>${esc(posted)}</div>`;document.getElementById('operationInfoDetailBackdrop')?.classList.add('active');document.getElementById('operationInfoDetail')?.classList.add('active');}
function hideOperationInfoDetail(){document.getElementById('operationInfoDetailBackdrop')?.classList.remove('active');document.getElementById('operationInfoDetail')?.classList.remove('active');}
function renderOperationInfoList(){const box=document.getElementById('operationInfoList');if(!box)return;if(!operationInfoEntries.length){box.innerHTML='<div class="operation-info-empty">登録されている運行情報はありません。</div>';return;}box.innerHTML=operationInfoEntries.map(x=>{const txt=x.status==='suspend'?'運転見合わせ':operationInfoDelayText(x.delay);return `<div class="operation-info-card ${x.status==='suspend'?'suspend':'delay'}"><button type="button" class="operation-info-card-main" onclick="showOperationInfoDetail('${esc(x.id)}')"><div class="operation-info-card-title">${esc(x.start)} ⇄ ${esc(x.end)}</div><div class="operation-info-card-meta">${esc(txt)}</div><div class="operation-info-card-reason">${esc(x.reason||OPERATION_INFO_REASONS[0])}</div></button><button class="operation-info-card-delete" type="button" onclick="deleteOperationInfo('${esc(x.id)}')">削除</button></div>`;}).join('');}
function operationInfoVisibleSegments(){
  const rows=[...document.querySelectorAll('.station-row')];
  const byRouteName=new Map();
  const byName=new Map();
  rows.forEach((r,index)=>{
    const name=operationInfoNormalizeName(r.querySelector('.station-name-ja')?.textContent||'');
    const routeKey='yokohama';
    if(!name)return;
    const item={row:r,index};
    const key=`${routeKey}\u0000${name}`;
    if(!byRouteName.has(key))byRouteName.set(key,[]);
    byRouteName.get(key).push(item);
    if(!byName.has(name))byName.set(name,[]);
    byName.get(name).push(item);
  });

  const boundaryNames=new Set();
  const rawSegments=[];
  for(const raw of operationInfoEntries){
    const e=normalizeOperationEntry(raw);
    if(!e||!Array.isArray(e.stations)||e.stations.length<2)continue;
    for(let i=0;i<e.stations.length-1;i++){
      const a=operationInfoNormalizeName(e.stations[i]);
      const b=operationInfoNormalizeName(e.stations[i+1]);
      const routeA='yokohama';
      const routeB='yokohama';
      const getRows=(name,route)=>{
        const exact=byRouteName.get(`${route}\u0000${name}`)||[];
        if(exact.length)return exact;
        return boundaryNames.has(name)?(byName.get(name)||[]):[];
      };
      const ar=getRows(a,routeA),br=getRows(b,routeB);
      if(!ar.length||!br.length)continue;

      let best=null;
      for(const x of ar)for(const y of br){
        if(x.index===y.index)continue;
        const lo=Math.min(x.index,y.index),hi=Math.max(x.index,y.index);
        const dist=hi-lo;
        if(!best||dist<best.distance)best={a:x,b:y,lo,hi,distance:dist};
      }
      if(!best)continue;

      rawSegments.push({
        lo:best.lo,hi:best.hi,rowA:best.a,rowB:best.b,
        routeA,routeB,status:e.status==='suspend'?'suspend':'delay',
        delay:operationInfoDelayValue(e.delay),entryId:e.id,createdAt:Number(e.createdAt)||0,
        stationA:a,stationB:b
      });
    }
  }

  const picked=new Map();
  for(const seg of rawSegments){
    const edgeKey=operationInfoUndirectedKey(seg.stationA,seg.stationB);
    const key=`${seg.entryId}\u0000${edgeKey}`;
    const prev=picked.get(key);
    if(!prev||seg.createdAt>=prev.createdAt)picked.set(key,seg);
  }
  return {rows,segments:[...picked.values()]};
}

function renderOperationInfoZones(){
  const layer=document.getElementById('operationInfoLayer');
  if(!layer)return;
  layer.innerHTML='';
  const labelLayer=document.getElementById('operationInfoLabelLayer');
  if(labelLayer)labelLayer.innerHTML='';
  const {rows,segments}=operationInfoVisibleSegments();
  if(rows.length<2||!segments.length)return;

  const fixedZoneWidth=700;
  const pieces=[];
  const boundaryNames=new Set();

  for(const seg of segments){
    const lo=Math.min(seg.rowA.index,seg.rowB.index),hi=Math.max(seg.rowA.index,seg.rowB.index);
    if(seg.routeA===seg.routeB){
      let runStart=lo;
      for(let i=lo+1;i<=hi;i++){
        const route='yokohama';
        if(route!==seg.routeA){
          if(i-1>=runStart)pieces.push({...seg,lo:runStart,hi:i-1});
          runStart=i+1;
        }
      }
      if(runStart<=hi)pieces.push({...seg,lo:runStart,hi});
    }else{
      pieces.push({...seg,lo,hi});
    }
  }

  const groups=[];
  const orderedPieces=[...pieces]
    .filter(p=>p.lo!==p.hi)
    .sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
  for(const p of orderedPieces){
    const last=groups[groups.length-1];
    // 同じ状態でも「端の駅を共有する区間」だけを統合する。
    // A-B と B-C は B を共有するので1つに連続させるが、
    // A-B と C-D は B-C が空いているため別グループのままにする。
    if(last && last.status===p.status && p.lo<=last.hi){
      last.lo=Math.min(last.lo,p.lo);
      last.hi=Math.max(last.hi,p.hi);
      last.delay=(last.delay==='unknown'?p.delay:(p.delay==='unknown'?last.delay:Math.max(Number(last.delay),Number(p.delay))));
      last.entryIds.add(p.entryId);
      last.stationStart=rows[last.lo]?.querySelector('.station-name-ja')?.textContent||last.stationStart;
      last.stationEnd=rows[last.hi]?.querySelector('.station-name-ja')?.textContent||last.stationEnd;
      if(last.routeA!==p.routeA) last.routeA=p.routeA;
      if(last.routeB!==p.routeB) last.routeB=p.routeB;
    }else{
      groups.push({
        lo:p.lo,hi:p.hi,status:p.status,delay:p.delay,
        routeA:p.routeA,routeB:p.routeB,
        entryIds:new Set([p.entryId]),
        stationStart:p.stationA,stationEnd:p.stationB
      });
    }
  }

  const labeledEntries=new Set();
  for(let gi=0;gi<groups.length;gi++){
    const g=groups[gi];
    const topRow=rows[g.lo],bottomRow=rows[g.hi];
    if(!topRow||!bottomRow)continue;

    if(g.hi-g.lo===1){
      const topName=operationInfoNormalizeName(topRow.querySelector('.station-name-ja')?.textContent||'');
      const bottomName=operationInfoNormalizeName(bottomRow.querySelector('.station-name-ja')?.textContent||'');
      if(boundaryNames.has(topName)||boundaryNames.has(bottomName))continue;
    }

    let top=topRow.offsetTop;
    let bottom=bottomRow.offsetTop+bottomRow.offsetHeight;

    const prev=groups[gi-1],next=groups[gi+1];

    // ここでは「zoom前のレイアウト座標」を使う。
    // スマホ表示では #viewportCanvas 全体が zoom されるため、
    // getBoundingClientRect() の縮小後座標をそのまま zone.style.top に使うと
    // PCとスマホで位置が変わってしまう。station-row の offsetTop/offsetHeight は
    // zoom前の座標なので、zone の top/height と同じ座標系で計算する。
    const stationCenterY=(row)=>row ? row.offsetTop + row.offsetHeight/2 : null;

    // 前後の長方形が「同じ駅を境界に共有」する場合は、その駅の中心を境界にして
    // 上下10pxずつ離す。状態が同じでも別登録として残っている場合はここで処理する。
    if(prev){
      if(prev.hi===g.lo){
        const boundaryRow=rows[g.lo];
        const center=stationCenterY(boundaryRow);
        if(center!=null) top=center+10;
      }else if(prev.hi+1===g.lo){
        // A-B と C-D のように B と C が隣駅で間に未設定区間がある場合は、
        // B と C の駅中心の中間地点を境界にして上下10pxずつ離す。
        const upperCenter=stationCenterY(rows[prev.hi]);
        const lowerCenter=stationCenterY(rows[g.lo]);
        if(upperCenter!=null&&lowerCenter!=null) top=(upperCenter+lowerCenter)/2+10;
      }
    }

    if(next){
      if(next.lo===g.hi){
        const boundaryRow=rows[g.hi];
        const center=stationCenterY(boundaryRow);
        if(center!=null) bottom=center-10;
      }else if(next.lo===g.hi+1){
        // A-B と C-D のように B と C が隣駅で間に未設定区間がある場合は、
        // B と C の駅中心の中間地点を境界にして上下10pxずつ離す。
        const upperCenter=stationCenterY(rows[g.hi]);
        const lowerCenter=stationCenterY(rows[next.lo]);
        if(upperCenter!=null&&lowerCenter!=null) bottom=(upperCenter+lowerCenter)/2-10;
      }
    }

    if(bottom<=top)continue;

    const zone=document.createElement('div');
    zone.className=`operation-info-zone ${g.status==='suspend'?'suspend':''}`;
    zone.style.top=`${top}px`;
    zone.style.height=`${bottom-top}px`;
    zone.style.width=`${fixedZoneWidth}px`;
    zone.style.left=`calc(50% - ${fixedZoneWidth/2}px)`;
    layer.appendChild(zone);

    const id=[...g.entryIds][0];
    if(labelLayer&&id&&!labeledEntries.has(id)){
      labeledEntries.add(id);
      const label=document.createElement('button');
      label.type='button';
      label.className=`operation-info-zone-label ${g.status==='suspend'?'suspend':'delay'}`;
      label.textContent=g.status==='suspend'?'運転見合わせ':operationInfoDelayText(g.delay);
      label.title='運行情報の詳細を表示';
      label.setAttribute('aria-label','運行情報の詳細を表示');
      label.style.top=`${top+36}px`;
      label.style.left=`calc(50% + ${fixedZoneWidth/2-100}px)`;
      label.style.right='auto';
      label.style.transform='translateX(-100%)';
      label.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showOperationInfoDetail(id);});
      labelLayer.appendChild(label);
    }
  }
}

window.addEventListener('resize',renderOperationInfoZones);


(function(){
  function syncControlBarLayout(){
    const title=document.getElementById('title');
    const bar=document.querySelector('.control-bar');
    const line=document.getElementById('lineContainer');
    if(!bar||!line)return;

    // スマホでは #title / .control-bar が960px基準でscaleされ、
    // #viewportCanvas 側も同じ比率でzoomされるため、路線図側の余白は
    // 「表示後の高さ」ではなく「zoom前の高さ」を設定する。
    const scale=(window.innerWidth<=959.98) ? (window.innerWidth/960) : 1;
    const titleRect=title?.getBoundingClientRect();
    const barRect=bar.getBoundingClientRect();
    const titleH=(titleRect?.height || (58*scale))/scale;
    const barH=(barRect.height || 0)/scale;

    line.style.marginTop=`${Math.ceil(titleH+barH)}px`;
    document.documentElement.style.setProperty('--control-bar-height',`${Math.ceil(barH)}px`);
  }
  window.addEventListener('load',syncControlBarLayout);
  window.addEventListener('resize',syncControlBarLayout);
  if(document.fonts?.ready) document.fonts.ready.then(syncControlBarLayout).catch(()=>{});
  setTimeout(syncControlBarLayout,0);
})();
</script>
