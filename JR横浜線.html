
<!DOCTYPE html>
<html lang="ja">
<head>
<meta property="og:title" content="横浜線 - 運用まとめ">
<meta property="og:description" content="JR横浜線の運用を記録しよう">

<meta property="og:url" content="https://minamikaze2700.github.io/Unyomatome/JR横浜線.html">
<meta property="og:type" content="website">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運用まとめ - 横浜線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f2c400;
  --primary-dark:#d0aa00;
  --bg:#fff;
  --sheet:#e8e8e8;
  --text:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0}
body{font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
#title,.control-bar,.line-container{box-sizing:border-box;width:100%;max-width:100%;min-width:0}

/* 日別・時刻フィルター */
#title{
    height: 58px;
    color: #fff;
    font-weight: 500;
    display: flex;
    background: #f2c400;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    justify-content: center;
    align-items: center;
    border-bottom: 8px solid #fff1a8;
    z-index: 1000;
}

.control-bar{
  position:fixed;top:58px;left:0;right:0;z-index:999;
  margin-top:0;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;background:#fff;border-bottom:1px solid #ddd;
}
.day-filter,.time-control{display:flex;align-items:center;gap:8px}
.date-input{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;
  cursor:pointer;min-width:160px;
}
.schedule-day-label{font-weight:800;color:#555;white-space:nowrap}
.time-now-btn{
  border:2px solid var(--primary);background:#fff;color:var(--primary);
  padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;
}
.time-now-btn.active{background:var(--primary);color:#fff}
.time-input{
  width:110px;border:2px solid #ccc;border-radius:999px;padding:7px 12px;
  font:inherit;font-weight:700;text-align:center;background:#fff;color:#111;
}
.time-label{font-weight:700;color:#555}
.sync-btn{border:1px solid #bbb;background:#fff;color:#555;border-radius:999px;padding:5px 10px;cursor:pointer;font-weight:700}


/* 路線図 */
:root{--row-height:270px}
.line-container{
  position:relative;width:100%;max-width:none;margin:0 auto;
  padding:0;display:flex;flex-direction:column;align-items:center;
}

/* 固定コントロールバーの高さ分だけ路線図を下へ配置 */
#lineContainer{margin-top:calc(58px + var(--control-bar-height, 69px));}
.rail-line{
  position:absolute;top:135px;bottom:135px;left:50%;transform:translateX(-50%);
  width:12px;background:var(--primary);z-index:1;
}
.station-row{
  position:relative;z-index:2;width:100%;height:var(--row-height);min-height:var(--row-height);
  margin:0;display:flex;align-items:center;justify-content:center;
}
.station-badge{
  position:relative;width:384px;min-width:384px;height:auto;aspect-ratio:480 / 90;
  border:4px solid var(--primary);border-radius:40px;
  overflow:hidden;background:#fff;text-align:center;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-name-ja{
  font-family:inherit;
  height:61.1111%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:45px;line-height:1;font-weight:500;
  letter-spacing:0;padding-left:0;
}
.station-name-en{
  font-family:inherit;
  height:33.3333%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:400;letter-spacing:.01em;
}
.moving-train-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.train-icon{
  position:absolute;top:0;width:66px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .15s;
  pointer-events:auto;
}
.train-icon.left{left:max(6px,calc(50% - 292px))}
.train-icon.right{right:max(6px,calc(50% - 292px))}
.train-icon:hover{transform:translateX(var(--lane-shift,0px)) scale(1.06)}
.train-icon img{width:60px;height:auto;object-fit:contain;display:block}
.train-no{font-size:12px;font-weight:800;color:#1b6e27;line-height:1.05}
.train-formation{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;}
.train-formation > span{display:block;font:inherit;color:inherit;line-height:1.05;white-space:nowrap;}
.train-label{
  margin-top:2px;max-width:100px;padding:3px 5px;border-radius:4px;
  background:#808080;color:#fff;font-size:12px;line-height:1.12;
  text-align:center;white-space:normal;word-break:break-all;
}
.train-label.normal{background:#f2c400;color:#111}
.train-label.b-express{background:#ffb6c1}
.train-label.a-express{background:#e83e8c}
.train-label.deadhead{background:#fff;color:#111;border:1px solid #bbb;}



/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:101;
  max-width:820px;margin:0 auto;max-height:75vh;min-height:0;overflow-y:auto;
  background:var(--sheet);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);transition:bottom .3s ease-out;
}
.bottom-sheet.active{bottom:0}
.bottom-sheet.editing{height:75vh;max-height:75vh;min-height:75vh}
.bottom-sheet.editing .sheet-content{min-height:calc(75vh - 58px)}

.sheet-header{
  position:sticky;top:0;z-index:2;background:#9e9e9e;color:#fff;
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;font-weight:700;border-radius:16px 16px 0 0;
}
.sheet-header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sheet-back-btn{
  display:none;width:28px;height:28px;border:0;background:transparent;color:#fff;
  padding:0;cursor:pointer;position:relative;flex:0 0 28px;
}
.sheet-back-btn::before{
  content:'';position:absolute;left:7px;top:6px;width:13px;height:13px;
  border-left:4px solid currentColor;border-bottom:4px solid currentColor;
  transform:rotate(45deg);
  box-sizing:border-box;
}
.sheet-back-btn.visible{display:inline-block;}
.close-btn{cursor:pointer;font-size:1.2rem}
.sheet-content{padding:16px;position:relative;overflow:hidden;min-height:0}
.timetable-list{margin-top:16px;position:relative;overflow:hidden;z-index:1}
.train-card{
  position:relative;
  background:#fff;border-radius:8px;padding:0;display:flex;
  align-items:center;gap:12px;margin-bottom:0;cursor:pointer;
  border:2px solid transparent;
}
.train-card:hover{border-color:#bbb}
.train-card.historical-readonly{cursor:default}
.train-card.historical-readonly:hover{border-color:transparent}
.station-info-card{cursor:default;}
.station-info-card:hover{border-color:transparent;}
.station-placeholder{margin-top:12px;min-height:140px;}
.station-badge{cursor:pointer;}
.station-timetable-title{
  font-family:inherit;font-size:1.35rem;font-weight:700;text-align:left;padding:8px 0 10px;
}
.station-timetable-direction-tabs{display:flex;gap:8px;margin:0 0 12px;justify-content:flex-start;}
.station-timetable-direction-tab{
  flex:0 0 50%;border:2px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);
  font-family:inherit;font-size:1rem;font-weight:700;padding:10px 8px;cursor:pointer;
}
.station-timetable-direction-tab.active{background:var(--primary);color:#fff;}
.station-timetable-direction-tab:hover{background:#fff1f1;}
.station-timetable-direction-tab.active:hover{background:var(--primary-dark);}
/* 横浜～大船は京浜東北・根岸線側の時刻表カラー */
.station-timetable-direction-tabs.keihin-tabs .station-timetable-direction-tab{border-color:var(--keihin-route);color:var(--keihin-route);}
.station-timetable-direction-tabs.keihin-tabs .station-timetable-direction-tab.active{background:var(--keihin-route);color:#fff;}
.station-timetable-direction-tabs.keihin-tabs .station-timetable-direction-tab:hover{background:#eefaff;}
.station-timetable-direction-tabs.keihin-tabs .station-timetable-direction-tab.active:hover{background:#0089b8;}

.station-timetable-frame{
  position:relative;
  margin-top:4px;
  height:53vh;
  background:#fff;
  border:3px solid #000;
  border-radius:11px;
  overflow:hidden;
  box-sizing:border-box;
}
.station-timetable-wrap{
  /* 530px以上は530px基準の固定サイズ。530px未満だけ幅に応じて縮小する。 */
  position:relative;
  container-type:inline-size;
  margin-top:0;
  background:#fff;
  border:0;
  border-radius:0;
  overflow-y:auto;
  overflow-x:hidden;
  height:100%;
  scroll-behavior:auto;
  box-sizing:border-box;
}
.station-timetable-direction{margin:0;padding:0;}
.station-timetable-empty{
  padding:24px 18px;
  text-align:center;
  font-family:inherit;
  color:#555;
}
.station-timetable-row{
  width:100%;
  min-height:108px;
  display:grid;
  grid-template-columns:68px 82px 92px 92px minmax(0,1fr);
  align-items:center;
  column-gap:8px;
  padding:8px 12px;
  border:0;
  color:#000;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
}
.station-timetable-row:nth-child(odd){background:#fff;}
.station-timetable-row:nth-child(even){background:#cfcfcf;}
.station-timetable-row:hover{filter:brightness(.97);}
.station-timetable-row:focus-visible{outline:3px solid rgba(0,0,0,.35);outline-offset:-3px;}
.station-timetable-train-img{
  width:68px;
  height:86px;
  object-fit:contain;
  display:block;
  justify-self:center;
  background:transparent;
}
.station-timetable-formation{
  color:#1b6e27;
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:24px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.station-timetable-formation-line{
  display:block;
  line-height:1;
}
.station-timetable-type{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:78px;height:34px;padding:0 10px;border-radius:7px;
  font-family:inherit;font-size:18px;line-height:1;font-weight:700;
  white-space:nowrap;text-align:center;box-sizing:border-box;
  background:#f2c400;color:#111;
}
.station-timetable-type.section-express{background:#e83e8c;color:#fff;}
.station-timetable-type.express{background:#e83e8c;color:#fff;}
.station-timetable-type.deadhead{background:#fff;color:#111;border:1px solid #bbb;}
.station-timetable-time{
  font-family:Helvetica,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;
  font-size:32px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  text-align:center;
  letter-spacing:.01em;
}
.station-timetable-destination{
  font-family:inherit;
  font-size:32px;
  line-height:1;
  font-weight:500;
  white-space:nowrap;
  text-align:left;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  gap:.18em;
  height:1em;
}
.station-timetable-destination-station{font-size:1em;line-height:1;}
.station-timetable-destination-go{font-size:.8em;line-height:1;}
/* 530px未満のみ、530pxを100%とした比率で全パーツを縮小 */
@container (max-width:529px){
  .station-timetable-frame{
    border-width:.5660377cqw;
    border-radius:2.0754717cqw;
  }
  .station-timetable-empty{
    padding:4.5283019cqw 3.3962264cqw;
  }
  .station-timetable-row{
    min-height:20.3773585cqw;
    grid-template-columns:12.8301887cqw 15.4716981cqw 17.3584906cqw 17.3584906cqw minmax(0,1fr);
    column-gap:1.509434cqw;
    padding:1.509434cqw 2.264151cqw;
  }
  .station-timetable-row:focus-visible{
    outline-width:.5660377cqw;
    outline-offset:-.5660377cqw;
  }
  .station-timetable-train-img{
    width:12.8301887cqw;
    height:16.2264151cqw;
  }
  .station-timetable-formation{
    font-size:4.5283019cqw;
  }
  .station-timetable-time,
  .station-timetable-destination{
    font-size:6.0377358cqw;
  }
  .station-timetable-type{
    min-width:14.717cqw;height:6.415cqw;padding:0 1.887cqw;
    border-radius:1.321cqw;font-size:3.396cqw;
  }
}
.station-badge:focus{outline:3px solid rgba(0,0,0,.35);outline-offset:4px;}

/* 駅情報：最初の項目 */
.station-overview-card{
  position:relative;background:#fff;border-radius:10px;overflow:hidden;
  margin-bottom:16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.station-overview-main{
  text-align:center;padding:8px 10px 9px;background:#fff;
}
.station-overview-name-ja{
  font-family:inherit;
  font-size:52px;line-height:.95;font-weight:500;letter-spacing:.08em;padding-left:.08em;color:#000;
}
.station-overview-name-en{
  font-family:inherit;
  font-size:29px;line-height:1.02;font-weight:500;letter-spacing:.015em;color:#000;
  margin-top:2px;
}
.station-direction-bar-wrap{width:100%;}
.station-direction-bar{
  width:100%;height:18px;background:var(--primary);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
}
.station-direction-bar.split{
  background:linear-gradient(to right,var(--bar-left,var(--primary)) 0 50%,var(--bar-right,var(--primary)) 50% 100%);
}
.station-direction-bar.no-prev{clip-path:polygon(0 0,97% 0,100% 100%,0 100%);}
.station-direction-bar.no-next{clip-path:polygon(3% 0,100% 0,100% 100%,0 100%);}
.station-direction-bar.no-prev.no-next{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
.station-neighbor-row{display:flex;width:100%;min-height:54px;background:#fff;}
.station-neighbor{
  width:50%;display:flex;flex-direction:column;justify-content:flex-start;
  padding:2px 8px 8px;min-width:0;
}
.station-neighbor.left{text-align:left;align-items:flex-start;}
.station-neighbor.right{text-align:right;align-items:flex-end;}
.station-neighbor-name-ja{
  font-family:inherit;font-size:27px;line-height:1.05;font-weight:400;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.station-neighbor-name-en{
  font-family:inherit;font-size:14px;line-height:1.1;font-weight:500;color:#000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px;
}
.station-neighbor.empty{visibility:hidden;}

.train-card-img{width:75px;height:auto;object-fit:contain}
.train-info-main{flex:1}
.type-badge{background:#f2c400;color:#111;padding:3px 8px;border-radius:4px;font-size:.78rem;display:inline-block}
.type-badge.a-express{background:#e83e8c}
.type-badge.b-express{background:#ffb6c1}
.train-title{font-size:0.95rem;font-weight:700;margin-left:6px}
.train-number{color:#1b6e27;font-weight:800;float:right;margin-right:15px}
.formation-id{font-size:1.2rem;font-weight:800;color:#1b6e27;margin-top:4px}
.capacity-info{color:#666;font-size:.85rem;margin-top:4px}

.formation-updated-at{position:absolute;right:12px;bottom:8px;font-size:.78rem;color:#777;text-align:right;} 
.input-trigger-btn{
  background:#c62828;color:#fff;padding:4px 8px;border-radius:4px;
  font-size:.75rem;margin-top:4px;display:inline-block;
}
.formation-manual-input{display:flex;gap:8px;margin:6px 0;align-items:stretch;}
.formation-manual-input input{flex:1;min-width:0;border:2px solid #ccc;border-radius:8px;padding:10px;font:inherit;font-weight:700;}
.formation-manual-input button{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:0 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;}
.formation-manual-input button:hover{background:var(--primary-dark);}
.formation-input-error{min-height:0;color:#c62828;font-size:.8rem;font-weight:700;margin:2px 0 4px;}
.option-item.disabled{opacity:.45;cursor:not-allowed;background:#f3f3f3;}
.option-disabled{opacity:.42;cursor:not-allowed!important;}
.timetable-list{background:#fff;border-radius:8px;padding:12px 20px}
.timetable-item{display:flex;align-items:center;padding:8px 0;position:relative;height:56px;min-height:56px;box-sizing:border-box}
/* 停車駅案内：路線カラーで区間を表示
   京浜東北・根岸線：#00a3d9
   横浜線：#7fbe3f
   各駅の丸はその駅が属する側の色、丸と丸の間の線は実際の区間の色。 */
:root{--keihin-route:#00a3d9;--yokohama-route:#7fbe3f;}
.timetable-item::before{
  content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;
  background:linear-gradient(to bottom,var(--route-line-top,var(--keihin-route)) 0 50%,var(--route-line-bottom,var(--keihin-route)) 50% 100%);
  z-index:1;
}
.timetable-item:first-child::before{top:50%;background:var(--route-line-bottom,var(--keihin-route));}
.timetable-item:last-child::before{bottom:50%;background:var(--route-line-top,var(--keihin-route));}
.time-dot{width:18px;height:18px;background:var(--station-route-color,var(--keihin-route));border-radius:50%;z-index:2;margin-right:16px}
.time-text{width:58px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.05;gap:0;height:40px;flex:none}.time-text span{display:block;height:20px;line-height:20px;white-space:nowrap}.time-text.two-line span:first-child{font-size:1rem}.time-text.two-line span:last-child{font-size:1rem}
.station-text{font-weight:700;font-size:1.05rem;line-height:1.2;display:flex;align-items:center;min-height:40px}
.select-box-container{position:relative;width:100%;margin:12px 0}
.custom-select-trigger{
  background:#fff;border:2px solid #ccc;border-radius:8px;padding:10px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:1.25rem;color:#1b6e27;
}
.custom-select-options{
  position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;
  border-radius:8px;max-height:250px;overflow-y:auto;z-index:200;display:none;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.custom-select-options.open{display:block}
.option-header{
  background:#f0f0f0;padding-left:16px;font-weight:700;font-size:1.25rem;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid #e0e0e0;cursor:pointer;
}
.option-header:hover{background:#e8f5e9}
.option-item{
  padding-left:16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:1.25rem;
}
.option-item:hover{background:#e8f5e9}
.option-item.type-option,.option-item.initial-option{background:#e0e0e0}
.option-item.type-option:hover,.option-item.initial-option:hover{background:#d0d0d0}
.option-img{width:auto;height:60px;object-fit:contain}

/* スマホ版：1920pxの元レイアウトから中央960px（左右480pxずつをカット）を
   そのまま100vwへ縮小表示する。960px以上はデスクトップ表示を変更しない。 */
@media (max-width:959.98px){
  html,body{
    width:100%;
    min-width:0;
    max-width:100%;
    overflow-x:hidden;
  }
  #viewportCanvas{
    width:1920px;
    min-width:1920px;
    max-width:none;
    margin-left:-480px;
    zoom:calc(100vw / 960px);
  }
  #viewportCanvas,
  #viewportCanvas .line-container{
    width:1920px;
    min-width:1920px;
    max-width:none;
  }
}

/* 固定ヘッダー：表示領域を基準に固定。路線図キャンバスとは別レイヤー。 */
#title{position:fixed;top:0;left:0;right:0;width:100vw;height:58px;z-index:1000;display:flex;justify-content:center;align-items:center;}
#title > span:first-child{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;}
.control-bar{position:fixed;top:58px;left:0;right:0;width:100vw;max-width:none;z-index:999;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;}

/* スマホではh1とcontrol-barも元ファイルと同じ960px基準で縮小表示する。
   画面中央を基準に縮小することで、文字サイズ・入力欄・ボタンの位置関係を維持する。 */
@media(max-width:959.98px){
  #title{
    width:960px;
    max-width:none;
    left:50%;
    right:auto;
    top:0;
    transform:translateX(-50%) scale(calc(100vw / 960px));
    transform-origin:top center;
  }
  .control-bar{
    width:960px;
    max-width:none;
    left:50%;
    right:auto;
    top:calc(58px * (100vw / 960px));
    transform:translateX(-50%) scale(calc(100vw / 960px));
    transform-origin:top center;
  }
}

.rail-line{display:none !important;}
/* 駅間ごとに路線カラーを固定。線は各駅の中心から次駅の中心までだけ描画し、起終点を突き抜けない。 */
.station-row::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:12px;background:linear-gradient(to bottom,var(--line-top,var(--yokohama-route)) 0 50%,var(--line-bottom,var(--yokohama-route)) 50% 100%);z-index:1;pointer-events:none;}
.station-row:first-child::before{top:50%;}
.station-row:last-child::before{bottom:50%;}
.station-row.endpoint-start::before{top:50%;}
.station-row.endpoint-end::before{bottom:50%;}
.station-row.endpoint-start.endpoint-end::before{top:50%;bottom:auto;}

function formationFamilyFromType(type){
  const s=String(type||'').trim();
  if(s.includes('6000')) return 'yokohama';
  if(s.includes('1000')) return 'keihin';
  return null;
}
const VEHICLE_TO_FORMATION = (() => {
  const out = {};
  for (const group of FORMATIONS) {
    const family = formationFamilyFromType(group.type);
    for (const item of (group.items || [])) {
      if (!family) continue;
      if (family === 'keihin') {
        const n = Number(String(item.name || '').replace(/[^0-9]/g,''));
        if (!Number.isFinite(n)) continue;
        const suffix = String(n % 100).padStart(2,'0');
        for (let prefix = 10; prefix <= 19; prefix++) out[String(prefix)+suffix] = item.id;
      } else if (family === 'yokohama') {
        const m = String(item.name || '').match(/^H(\d+)$/i);
        if (!m) continue;
        const suffix = String(Number(m[1])).padStart(2,'0').slice(-2);
        for (let prefix = 60; prefix <= 67; prefix++) out[String(prefix)+suffix] = item.id;
      }
    }
  }
  return out;
})();

const KEIHIN_TOHOKU_TRAIN_DATA_URL = 'https://minamikaze2700.github.io/Unyomatome/timetable/JRKeihinTohoku.json';
async function loadLineTrainData(){
  const [yokoRes,keihinRes]=await Promise.all([
    fetch(YOKOHAMA_TRAIN_DATA_URL,{cache:'no-store'}),
    fetch(KEIHIN_TOHOKU_TRAIN_DATA_URL,{cache:'no-store'})
  ]);
  if(!yokoRes.ok) throw new Error(`JRYokohama.json の読み込みに失敗しました (${yokoRes.status})`);
  if(!keihinRes.ok) throw new Error(`JRKeihinTohoku.json の読み込みに失敗しました (${keihinRes.status})`);
  const [yokoJson,keihinJson]=await Promise.all([yokoRes.json(),keihinRes.json()]);
  const yokoList=Array.isArray(yokoJson)?yokoJson:(Array.isArray(yokoJson?.trains)?yokoJson.trains:null);
  const keihinList=Array.isArray(keihinJson)?keihinJson:(Array.isArray(keihinJson?.trains)?keihinJson.trains:null);
  if(!yokoList || !keihinList) throw new Error('時刻表JSONの形式が配列ではありません。');

  const normalizeList=(list,defaultCars)=>list
    .filter(t=>t&&Array.isArray(t.stops)&&t.stops.length>=1)
    .map(t=>{
      const rawType=String(t.type||'各駅停車');
      const lineKind=String(t.lineKind||'');
      const normalizedType=rawType==='普通'?'各駅停車':rawType;
      return {
        ...t,
        no:normalizeTrainNo(t.no),
        type:normalizedType,
        lineKind,
        direction:String(t.direction||'down').toLowerCase()==='up'?'up':'down',
        cars:Number(t.cars)||defaultCars,
        stops:(t.stops||[]).map(st=>({
          ...st,
          station:String(st.station||''),
          time:st.time||st.departure||st.arrival||'',
          arrival:st.arrival||st.time||st.departure||'',
          departure:st.departure||st.time||st.arrival||''
        }))
      };
    });

  const yokohamaTrains=normalizeList(yokoList,8).map(t=>({...t,lineKind:'yokohama'}));
  const keihinOnlyTrains=normalizeList(keihinList,10).map(t=>({...t,lineKind:'keihin'}));
  const combined=[];
  const seen=new Set();
  for(const t of [...yokohamaTrains,...keihinOnlyTrains]){
    const key=`${String(t.no)}|${String(t.direction)}|${String(t.lineKind)}|${Array.isArray(t.days)?t.days.join(','):''}`;
    if(seen.has(key)) continue;
    seen.add(key);
    combined.push(t);
  }

  TRAINS=combined.filter(t=>!Array.isArray(t.days)||!t.days.length||t.days.includes('平日'));
  HOLIDAY_TRAINS=combined.filter(t=>Array.isArray(t.days)&&t.days.includes('休日'));
  TRAIN_INDEX=Object.fromEntries(TRAINS.map(t=>[String(t.no),t]));
  HOLIDAY_TRAIN_INDEX=Object.fromEntries(HOLIDAY_TRAINS.map(t=>[String(t.no),t]));
  TIMETABLE_HTML_CACHE=new Map([...TRAINS,...HOLIDAY_TRAINS].map(t=>[String(t.days||'')+':'+String(t.no),timetableRowsHTML(t.stops,t)]));
}

function baseTrainForDay(trainNo,direction=null,day=currentDay){
  const source=day==='休日' ? HOLIDAY_TRAINS : TRAINS;
  const key=String(trainNo??'');
  const matches=source.filter(t=>String(t.no)===key);
  if(!matches.length) return null;
  if(direction) return matches.find(t=>String(t.direction||'')===String(direction)) || null;
  return matches[0]||null;
}
function buildTimetableRows(stops){
  const rows=[];
  for(let i=0;i<(stops||[]).length;){
    const station=String(stops[i]?.station||'');
    const times=[];
    let j=i;
    while(j<stops.length && String(stops[j]?.station||'')===station){
      const st=stops[j]||{};
      const a=st.arrival||st.time||'';
      const d=st.departure||st.time||'';
      if(a && !times.includes(a)) times.push(a);
      if(d && !times.includes(d)) times.push(d);
      j++;
    }
    rows.push({station,times:times.slice(0,2)});
    i=j;
  }
  return rows;
}
function timetableRowsHTML(stops,trainContext=null){
  const rows=buildTimetableRows(stops);
  if(!rows.length) return '';

  // 停車駅案内の色は「その駅から次の駅へ進む区間」の路線カラーを基本とする。
  // 東神奈川のような接続駅でも、実際の列車の次区間を見て色を決める。
  const stationColor=index=>routeColorForStopIndex(rows,index,trainContext);
  const segmentColor=(aIndex,bIndex)=>{
    if(aIndex<0 || bIndex<0 || aIndex>=rows.length || bIndex>=rows.length) return routeColorForTrainFallback(trainContext);
    return routeColorForStopSegment(rows[aIndex]?.station,rows[bIndex]?.station,trainContext);
  };

  return rows.map((row,index)=>{
    const hasTwoTimes=row.times.length>=2;
    const rawTimes=hasTwoTimes ? row.times.slice(0,2) : row.times.slice(0,1);
    const times=(rawTimes.length>=2 && rawTimes[0]===rawTimes[1]) ? [rawTimes[0]] : rawTimes;
    const twoLine=times.length>=2;
    const prevColor=segmentColor(index-1,index);
    const nextColor=segmentColor(index,index+1);
    const dotColor=stationColor(index);
    return `<div class="timetable-item" style="--route-line-top:${prevColor};--route-line-bottom:${nextColor};--station-route-color:${dotColor}"><div class="time-dot"></div><div class="time-text${twoLine?' two-line':''}">${times.map(t=>`<span>${t}</span>`).join('')}</div><div class="station-text">${row.station}</div></div>`;
  }).join('');
}

function todayKey(d=new Date()){

}
function operationDateKey(d=new Date()){
  const base=new Date(d);
  if(base.getHours()<RESET_HOUR) base.setDate(base.getDate()-1);

}

function normalizeTrainNo(v){
  if(v===null||v===undefined) return '';
  const s=String(v);
  return /^\d+\.0$/.test(s)?s.slice(0,-2):s;
}
function cloneState(obj){ return JSON.parse(JSON.stringify(obj||{})); }
function stateForTrain(state,no){
  const obj=state||{}; const key=String(no);
  if(Object.prototype.hasOwnProperty.call(obj,key)) return obj[key];
  const canonical=key.replace(/A$/i,'');
  for(const [k,v] of Object.entries(obj)){
    if(String(k).replace(/A$/i,'')===canonical) return v;
  }
  return null;
}

function loadLocalState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const obj=JSON.parse(raw);
    remoteRoot.operationDate=obj.operationDate||null;
    remoteRoot.stateByDay=obj.stateByDay||{平日:{},休日:{}};
    remoteRoot.formationUpdatedAtByDay=obj.formationUpdatedAtByDay||{平日:{},休日:{}};
    pendingFormationTimestamps=obj.pendingFormationTimestamps||{平日:{},休日:{}};
    const savedFamilies=obj.formationStateByFamily||null;
    if(savedFamilies&&typeof savedFamilies==='object'){
      for(const family of ['keihin','yokohama']){
        const src=savedFamilies[family]||{};
        formationRemoteByFamily[family].stateByDay={
          平日:normalizeFormationState(src.平日||src.stateByDay?.平日||{},family),
          休日:normalizeFormationState(src.休日||src.stateByDay?.休日||{},family)
        };
        const savedTs=src.formationUpdatedAtByDay || obj.formationUpdatedAtByFamily?.[family] || {};
        formationRemoteByFamily[family].formationUpdatedAtByDay={
          平日:cloneState(savedTs.平日||{}),
          休日:cloneState(savedTs.休日||{})
        };
      }
    }else{
      // 旧localStorageからの移行。旧stateByDayは系統混在の可能性があるため、
      // 現在の列車JSONのlineKindで正しい系統DBへ振り分ける。
      for(const day of ['平日','休日']){
        const legacy=obj.stateByDay?.[day]||{};
        for(const [no,value] of Object.entries(legacy)){
          const train=[...TRAINS,...HOLIDAY_TRAINS].find(t=>String(t.no||'')===String(no));
          if(!train) continue;
          const family=formationFamilyForTrain(train);
          const normalized=normalizeStoredFormationId(value);
          if(normalized) formationRemoteByFamily[family].stateByDay[day][String(no)]=normalized;
        }
      }
    }
    mergeFormationRemoteIntoLegacyState();
    remoteRoot.history=obj.history||{};
    currentOperationDate=remoteRoot.operationDate;
    operationHistory=historyEntries();
    registrationState=isHistoricalSelectedDate(selectedDateKey)
      ? historicalStateForDate(selectedDateKey)
      : cloneState(remoteRoot.stateByDay[currentDay]||{});
    applyRegistrationState();
  }catch(e){ console.warn('local load failed',e); }
}

function registeredFormationForTrain(train){
  if(!train) return null;
  const family=allowedFormationFamily(train);
  const state=formationRemoteByFamily[family]?.stateByDay?.[currentDay]||{};
  return normalizeStoredFormationId(stateForTrain(state,String(train.no||'')));
}
function mergeFormationRemoteIntoLegacyState(){
  const merged={};
  for(const family of ['keihin','yokohama']){
    const state=formationRemoteByFamily[family]?.stateByDay?.[currentDay]||{};
    for(const [no,value] of Object.entries(state)){
      merged[String(no)]=normalizeStoredFormationId(value)||null;
    }
  }
  remoteRoot.stateByDay=remoteRoot.stateByDay||{平日:{},休日:{}};
  remoteRoot.stateByDay[currentDay]=merged;
  remoteRoot.formationUpdatedAtByDay=remoteRoot.formationUpdatedAtByDay||{平日:{},休日:{}};
  const mergedTs={};
  for(const family of ['keihin','yokohama']){
    const ts=formationRemoteByFamily[family]?.formationUpdatedAtByDay?.[currentDay]||{};
    Object.assign(mergedTs,ts);
  }
  remoteRoot.formationUpdatedAtByDay[currentDay]=mergedTs;
}
function applyRegistrationState(){
  const seen=new Set();
  [...TRAINS,...HOLIDAY_TRAINS].forEach(t=>{
    const key=String(t.no);
    const signature=`${key}|${String(t.direction||'')}`;
    if(seen.has(signature)) return;
    seen.add(signature);
    t.formation=registeredFormationForTrain(t)||null;
  });
}

function broadcastState(){
  if(!channel) return;
  // 送信はローカルで変更を確定した側だけが行う。
  // 受信側からの再送は絶対に行わない。
  channel.postMessage({source:'train-app',type:'state',root:cloneState(remoteRoot),ts:Date.now()});
}
function hydrateFromRoot(data){
  const next=data||{version:0,operationDate:null,stateByDay:{平日:{},休日:{}},formationUpdatedAtByDay:{平日:{},休日:{}},history:{}};
  const normalized={
    ...next,
    stateByDay:{平日:cloneState(next.stateByDay?.平日||{}),休日:cloneState(next.stateByDay?.休日||{})},
    formationUpdatedAtByDay:{平日:cloneState(next.formationUpdatedAtByDay?.平日||{}),休日:cloneState(next.formationUpdatedAtByDay?.休日||{})},
    history:cloneState(next.history||{})
  };
  if(stateFingerprint(normalized)===stateFingerprint(remoteRoot)) return false;
  remoteRoot=normalized;
  currentOperationDate=remoteRoot.operationDate||currentOperationDate||operationDateKey();
  operationHistory=historyEntries();
  registrationState=isHistoricalSelectedDate(selectedDateKey)
    ? historicalStateForDate(selectedDateKey)
    : cloneState(remoteRoot.stateByDay[currentDay]||{});
  applyRegistrationState();
  // 受信した状態を再保存・再送しない。これが同期ループ防止の重要点。
  return true;
}
function firebaseDatabase(){
  if(firebaseDb) return firebaseDb;

function firebaseDatabaseForFamily(family){

function firebaseOperationRef(){ const db=firebaseDatabase(); return db?db.ref('運用'):null; }
function firebaseHistoryRef(){ const db=firebaseDatabase(); return db?db.ref('履歴'):null; }
function formationOperationRef(family){ const db=firebaseDatabaseForFamily(family); return db?db.ref('運用'):null; }
function formationFamilyForTrain(train){ return allowedFormationFamily(train); }
function formationFirebaseConfigForFamily(family){

function normalizeStoredFormationId(value){
  if(value===null||value===undefined||String(value)==='') return null;
  const raw=String(value).trim();
  const obj=formationById(raw) || formationById(raw.replace(/F$/i,''));
  if(obj?.id) return String(obj.id).replace(/F$/i,'');
  return raw.replace(/F$/i,'');
}
function trainBelongsToFamily(no,family){
  const key=String(no||'');
  if(!key) return false;
  return [...TRAINS,...HOLIDAY_TRAINS].some(t=>String(t.no||'')===key && formationFamilyForTrain(t)===family);
}
function normalizeFormationState(raw,family){
  const out={};
  const src=raw&&typeof raw==='object'?raw:{};
  for(const [no,value] of Object.entries(src)){
    if(!trainBelongsToFamily(no,family)) continue;
    const normalized=normalizeStoredFormationId(value);
    if(normalized) out[String(no)]=normalized;
  }
  return out;
}
function normalizeFormationTimestampState(raw,family){
  const out={};
  const src=raw&&typeof raw==='object'?raw:{};
  for(const [no,value] of Object.entries(src)){
    if(!trainBelongsToFamily(no,family)) continue;
    if(value!==null&&value!==undefined&&String(value)!=='') out[String(no)]=value;
  }
  return out;
}
async function loadFormationFamilyFromFirebase(family){

  const [stateSnap,tsSnap]=await Promise.all([
    ref.child('stateByDay').once('value'),
    ref.child('formationUpdatedAtByDay').once('value')
  ]);
  const stateRaw=stateSnap.val()||{}, tsRaw=tsSnap.val()||{};
  formationRemoteByFamily[family].stateByDay={
    平日:normalizeFormationState(stateRaw.平日||{},family),
    休日:normalizeFormationState(stateRaw.休日||{},family)
  };
  formationRemoteByFamily[family].formationUpdatedAtByDay={
    平日:normalizeFormationTimestampState(tsRaw.平日||{},family),
    休日:normalizeFormationTimestampState(tsRaw.休日||{},family)
  };
  return true;
}

const LIVE_TRAIN_CACHE = new Map();
function liveTrainCacheKey(trainNo){ return `${currentDay}:${String(trainNo)}`; }
function refreshAllTrainDataCache(){
  LIVE_TRAIN_CACHE.clear();
  TRAIN_DATA_CACHE.clear();
  const sourceTrains = currentDay==='休日' ? HOLIDAY_TRAINS : TRAINS;
  for(const t of sourceTrains){
    const key=String(t.no);
    const direction=String(t.direction||'');
    const cached={...t, stops:(t.stops||[]).map(s=>({...s}))};
    cached.defaultCars=prescribedFormationName(cached);
    cached.formation=registeredFormationForTrain(t)||null;
    const ckey=trainCacheKey(currentDay,key,direction);
    LIVE_TRAIN_CACHE.set(ckey,cached);
    if(currentDay!=='休日') TRAIN_DATA_CACHE.set(ckey,cached);
  }
}
function liveTrain(no,direction=null){
  const key=String(no??'');
  const dir=String(direction||'');
  if(dir){
    const cached=LIVE_TRAIN_CACHE.get(trainCacheKey(currentDay,key,dir));
    if(cached) return cached;
    const base=baseTrainForDay(key,dir,currentDay);
    if(base) return base;
  }
  const cached=LIVE_TRAIN_CACHE.get(trainCacheKey(currentDay,key,''));
  if(cached) return cached;
  if(currentDay==='休日') return baseTrainForDay(key,null,currentDay);
  return TRAIN_DATA_CACHE.get(trainCacheKey(currentDay,key,''))||baseTrainForDay(key,null,currentDay)||TRAIN_INDEX[key]||null;
}
function trainForCurrentDay(trainNo,direction=null){return liveTrain(String(trainNo??''),direction)||baseTrainForDay(String(trainNo??''),direction,currentDay);}

      formationRemoteByFamily[family].stateByDay={

      };

        mergeFormationRemoteIntoLegacyState();
        registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});

        renderTrainPositions();
        if(currentTrainNo) updateSheetContent();

      syncStatus('Firebaseリアルタイム同期済み');
    },err=>console.warn(`Firebase編成状態読込失敗（${family}）`,err));

    ref.child('formationUpdatedAtByDay').on('value',snap=>{
      const all=snap.val()||{};
      formationRemoteByFamily[family].formationUpdatedAtByDay={

      };

      saveLocalState();
      if(currentTrainNo&&!isEditMode) updateSheetContent();

    operationRef.child('operationDate').on('value',snap=>{
      const value=snap.val();

      remoteRoot.operationDate=String(value);
      currentOperationDate=String(value);

async function syncRegistrationToRemote(changes={},family='keihin'){
  const db=firebaseDatabaseForFamily(family);
  if(!db){syncStatus('Firebase未接続');return false;}
  const entries=Object.entries(changes||{});
  if(!entries.length){syncStatus('Firebase同期済み');return true;}
  try{
    const dayRef=db.ref('運用').child('stateByDay').child(currentDay);
    const updates={};
    entries.forEach(([no,formId])=>{
      const canonical=normalizeStoredFormationId(formId);
      updates[String(no)]=canonical||null;
    });
    await dayRef.update(updates);
    const committed=await dayRef.once('value');
    formationRemoteByFamily[family].stateByDay[currentDay]=normalizeFormationState(committed.val()||{},family);

    const timestampRef=db.ref('運用').child('formationUpdatedAtByDay').child(currentDay);
    const timestampUpdates={};
    entries.forEach(([no,formId])=>{
      const key=String(no);
      timestampUpdates[key]=formId&&formId!==INITIAL_FORMATION_SELECTION.id?(new Date().toISOString()):null;
    });
    await timestampRef.update(timestampUpdates);
    const tsSnap=await timestampRef.once('value');
    formationRemoteByFamily[family].formationUpdatedAtByDay[currentDay]=normalizeFormationTimestampState(tsSnap.val()||{},family);

    mergeFormationRemoteIntoLegacyState();
    registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
    applyRegistrationState();
    saveLocalState();
    refreshAllTrainDataCache();
    syncStatus('Firebase同期済み');
    return true;
  }catch(e){
    console.error('Firebase書込失敗',e);
    syncStatus('Firebase書込失敗');
    return false;
  }
}

function findChain(day,trainNo){
  const raw=normalizeTrainNo(trainNo);
  return CHAIN_INDEX[day]?.[raw] || CHAIN_INDEX[day]?.[raw.replace(/A$/i,'')] || null;
}
function chainEntries(day,trainNo){
  const info=findChain(day,trainNo);
  if(!info) return null;
  return OPERATION_CHAINS[day]?.[info.chainIndex] || null;
}

/* 運用連結：同一列車が複数の運用グループに現れる場合も全該当チェーンを走査。
   ただし回送103/111と通常103A/111AのようにA有無で別列車の場合は、
   まず完全一致したチェーンだけを採用する。 */
function formationLinkedTrainNos(day,trainNo,direction=null){
  const start=normalizeTrainNo(trainNo);
  const requestedDirection=String(direction||'');
  const result=new Set([start]);
  const queue=[start];
  const chains=OPERATION_CHAINS[day]||[];

  const entryMatches=(entry,no)=>{
    if(normalizeTrainNo(entry.no)!==no) return false;
    if(!requestedDirection) return true;
    if(!entry.start || !entry.dest) return true;
    const idxA=STATIONS.findIndex(s=>s.nameJa===entry.start);
    const idxB=STATIONS.findIndex(s=>s.nameJa===entry.dest);
    const entryDirection=idxA>idxB?'up':'down';
    return entryDirection===requestedDirection;
  };

  while(queue.length){
    const no=queue.shift();
    for(const chain of chains){
      if(!chain.some(entry=>entryMatches(entry,no))) continue;
      chain.forEach(entry=>{
        const n=normalizeTrainNo(entry.no);
        if(n && !result.has(n)){ result.add(n); queue.push(n); }
      });
    }
  }
  return result;
}
async function syncRegistrationToRemoteByFamily(changesByFamily){
  const families=['keihin','yokohama'];
  const results=await Promise.all(families.map(async family=>{
    const changes=changesByFamily[family]||{};
    if(!Object.keys(changes).length) return true;
    return syncRegistrationToRemote(changes,family);
  }));
  return results.every(Boolean);
}

async function recordSelection(train,formId){
  if(isNonCurrentSelectedDate(selectedDateKey)) return [];
  const linkedTrainNos=formationLinkedTrainNos(currentDay,train.no,train.direction||null);
  const assigned=[];
  const changesByFamily={keihin:{},yokohama:{}};

  linkedTrainNos.forEach(requested=>{
    const dayIndex=currentDay==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
    const actual=dayIndex[requested]
      ? requested
      : Object.keys(dayIndex).find(k=>k.replace(/A$/i,'')===String(requested).replace(/A$/i,'')) || null;
    if(!actual || assigned.includes(actual)) return;
    const linkedTrain=dayIndex[actual] || Object.values(dayIndex).find(t=>String(t.no).replace(/A$/i,'')===String(actual).replace(/A$/i,''));
    if(!linkedTrain) return;
    const family=formationFamilyForTrain(linkedTrain);
    if(family!=='keihin' && family!=='yokohama') return;

    const value=(formId && formId!==INITIAL_FORMATION_SELECTION.id) ? normalizeStoredFormationId(formId) : null;
    if(value) formationRemoteByFamily[family].stateByDay[currentDay][actual]=value;
    else delete formationRemoteByFamily[family].stateByDay[currentDay][actual];
    assigned.push(actual);
    changesByFamily[family][actual]=value;
  });

  mergeFormationRemoteIntoLegacyState();
  registrationState=cloneState(remoteRoot.stateByDay[currentDay]||{});
  applyRegistrationState();
  refreshAllTrainDataCache();
  saveLocalState();

  const ok=await syncRegistrationToRemoteByFamily(changesByFamily);
  if(!ok){
    saveLocalState();
    syncStatus('同期失敗（再試行待ち）');
  }
  return assigned;
}

function snapshotForCurrentRegistrations(day, state, dateKey, familyFilter=null){
  const source=day==='休日'?HOLIDAY_TRAINS:TRAINS;
  const operations=[];
  source.forEach(t=>{
    const no=String(t?.no||'');
    if(familyFilter && formationFamilyForTrain(t)!==familyFilter) return;
    const formation=stateForTrain(state,no);
    if(!no||!formation) return;
    operations.push({operationId:`${day}-${no}`,day,firstTrainNo:no,trainNumbers:[no],formationId:normalizeStoredFormationId(formation)});
  });
  return {date:dateKey,id:`${dateKey}_reset`,resetAt:resetTimeForDate(dateKey),operations,loggedAt:new Date().toISOString()};
}

function snapshotFromStateRoot(oldRoot,dateKey){
  const days=[];
  for(const day of ['平日','休日']){
    const snap=snapshotForCurrentRegistrations(day,oldRoot.stateByDay?.[day]||{},dateKey,PRIMARY_FORMATION_FAMILY);
    if(snap.operations.length) days.push(snap);
  }
  return {id:dateKey,date:dateKey,resetAt:resetTimeForDate(dateKey),days,loggedAt:new Date().toISOString()};
}

async function maybeResetForNewOperationDay(remoteCheck=false){
  const opDate=operationDateKey();
  // 「現在時刻」モードでは、3:00を跨いだ時点で表示日付も新しい運用日に切り替える。
  if(followNow && selectedDateKey!==opDate){
    setSelectedDate(opDate);
  }else if(!followNow && isHistoricalSelectedDate(selectedDateKey)){
    // 手動で過去日を選択している場合は、過去データ表示を維持する。
    return;
  }
  if(!currentOperationDate) currentOperationDate=remoteRoot.operationDate||opDate;

  if(firebaseReady){
    try{
      await firebaseOperationRef().transaction(current=>{
        const cur=current||{stateByDay:{平日:{},休日:{}},operationDate:opDate,version:0};
        cur.stateByDay=cur.stateByDay||{平日:{},休日:{}};
        const oldDate=cur.operationDate;
        if(oldDate && oldDate!==opDate){
          const snapshot=snapshotFromStateRoot(cur,oldDate);
          if(snapshot.days.length){
            // transaction内では履歴書込みを行わず、後段で候補として保持
            window.__pendingResetSnapshot=snapshot;
          }
          cur.stateByDay={平日:{},休日:{}};
          cur.operationDate=opDate;
          cur.version=(cur.version||0)+1;
          cur.updatedAt=firebase.database.ServerValue.TIMESTAMP;
        }
        return cur;
      });
      if(window.__pendingResetSnapshot){
        const snapshot=window.__pendingResetSnapshot;
        window.__pendingResetSnapshot=null;
        try{
          // 日付固定キーで保存するため、複数端末が同時に3:00を検出しても同一履歴へ収束
          await firebaseHistoryRef().child(snapshot.id).set(snapshot);
          operationHistory=historyEntries();
          saveLocalState();
        }catch(e){
          // 既に他端末が登録済みの場合はルールにより書込失敗するが、これは正常な競合
          console.warn('履歴追加競合または失敗',e);
        }
      }
      // transaction完了後のFirebase最新状態をそのまま画面へ反映する。
      // 日付が変わっていない場合は、既存のstateByDayを空に戻さない。
      const latestSnap=await firebaseOperationRef().once('value');
      const latestRoot=latestSnap.val()||{};
      remoteRoot.operationDate=latestRoot.operationDate||opDate;
      currentOperationDate=remoteRoot.operationDate;
      const latestStateByDay=latestRoot.stateByDay||{};
      remoteRoot.stateByDay={
        平日:cloneState(latestStateByDay.平日||{}),
        休日:cloneState(latestStateByDay.休日||{})
      };
      registrationState=isHistoricalSelectedDate(selectedDateKey)?historicalStateForDate(selectedDateKey):cloneState(remoteRoot.stateByDay[currentDay]||{});
      applyRegistrationState();
      saveLocalState();
      refreshAllTrainDataCache();
      renderLine();
    }catch(e){ console.error('remote reset failed',e); }
  }else{
    if(currentOperationDate!==opDate){
      const snapshot=snapshotFromStateRoot(remoteRoot,currentOperationDate);
      remoteRoot.stateByDay={平日:{},休日:{}};
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      remoteRoot.history=remoteRoot.history||{};
      if(snapshot.days.length) remoteRoot.history[snapshot.id]=snapshot;
      registrationState={};
      operationHistory=historyEntries();
      applyRegistrationState();
      saveLocalState();
      renderLine();
    }else{
      currentOperationDate=opDate;
      remoteRoot.operationDate=opDate;
      saveLocalState();
    }
  }
}

function syncCurrentScheduleDay(){
  // 選択日付を唯一の基準にして、平日／土休日の状態を常に同期する。
  // currentDay が別処理で古い値になっていても、時刻表が平日固定にならないようにする。
  const d=new Date(`${selectedDateKey}T00:00:00`);
  if(!Number.isNaN(d.getTime())) currentDay=getScheduleDayForDate(d);

function nthMondayDateKey(year,month,nth){
  const d=new Date(year,month-1,1);
  const offset=(8-d.getDay())%7;
  d.setDate(1+offset+(nth-1)*7);
  return todayKey(d);
}
function equinoxDateKey(year,isVernal){
  // 日本の春分・秋分日は将来の暦にも対応できるよう近似計算。
  // 1980～2099年程度で実用上十分な精度。
  const y=year-1980;
  const base=isVernal?20.8431:23.2488;
  const drift=0.242194;
  const day=Math.floor(base+drift*y-Math.floor(y/4));
  return `${year}-${isVernal?'03':'09'}-${String(day).padStart(2,'0')}`;
}
function getJapaneseNationalHolidays(year){
  const h=new Set();
  const add=(m,d)=>h.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);
  h.add(nthMondayDateKey(year,1,2));
  add(2,11);
  if(year>=2020) add(2,23);
  h.add(equinoxDateKey(year,true));
  add(4,29); add(5,3); add(5,4); add(5,5);
  h.add(nthMondayDateKey(year,7,3));
  add(8,11);
  h.add(nthMondayDateKey(year,9,3));
  h.add(equinoxDateKey(year,false));
  h.add(nthMondayDateKey(year,10,2));
  add(11,3); add(11,23);

  // 一時的な祝日移動など
  if(year===2019){ add(5,1); add(10,22); }
  if(year===2020){
    h.delete(`${year}-07-20`); add(7,23);
    h.delete(`${year}-10-12`); add(7,24);
  }
  if(year===2021){
    h.delete(`${year}-07-19`); add(7,22); add(7,23);
    h.delete(`${year}-08-11`); add(8,8);
    h.delete(`${year}-10-11`);
  }
  return h;
}
function getJapaneseHolidaySet(year){
  const national=getJapaneseNationalHolidays(year);
  const holidays=new Set(national);
  // 日曜祝日の振替休日
  for(const key of [...national]){
    const d=new Date(`${key}T00:00:00`);
    if(d.getDay()!==0) continue;
    const cursor=new Date(d);
    do{
      cursor.setDate(cursor.getDate()+1);
      const k=todayKey(cursor);
      if(!national.has(k) && !holidays.has(k)){ holidays.add(k); break; }
    }while(cursor.getFullYear()<=year+1);
  }
  // 祝日に挟まれた休日
  const start=new Date(year,0,1), end=new Date(year,11,31);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=todayKey(d);
    if(holidays.has(key)) continue;
    const prev=new Date(d); prev.setDate(prev.getDate()-1);
    const next=new Date(d); next.setDate(next.getDate()+1);
    if(national.has(todayKey(prev)) && national.has(todayKey(next))) holidays.add(key);
  }
  return holidays;
}
function isJapaneseHoliday(dateObj){
  return getJapaneseHolidaySet(dateObj.getFullYear()).has(todayKey(dateObj));
}
function getScheduleDayForDate(dateObj){
  const d=new Date(dateObj);
  const weekend=d.getDay()===0||d.getDay()===6;
  return (weekend||isJapaneseHoliday(d))?'休日':'平日';

function historicalStateForDate(dateKey){
  const root=remoteRoot.history||{};
  const snap=root[String(dateKey)] || Object.values(root).find(x=>String(x?.date||'')===String(dateKey)) || null;
  if(!snap) return {};
  const days=Array.isArray(snap.days)?snap.days:[snap];
  let daySnap=days.find(d=>String(d?.day||'')===String(currentDay)) || null;
  // Older snapshots may have been saved without a day label. In that case the
  // first valid day snapshot is still preferable to returning an empty state.
  if(!daySnap && days.length===1) daySnap=days[0];
  if(!daySnap || !Array.isArray(daySnap.operations)) return {};
  const state={};
  const dayIndex=currentDay==='休日' ? HOLIDAY_TRAIN_INDEX : TRAIN_INDEX;
  const resolveKey=raw=>{
    const s=String(raw||'');
    if(dayIndex[s]) return s;
    const a=s.replace(/A$/i,'')+'A';
    if(dayIndex[a]) return a;
    const plain=s.replace(/A$/i,'');
    if(dayIndex[plain]) return plain;
    return a;
  };
  daySnap.operations.forEach(op=>{
    const form=op?.formationId;
    (Array.isArray(op?.trainNumbers)?op.trainNumbers:[]).forEach(no=>{
      if(!form) return;
      state[resolveKey(no)]=normalizeStoredFormationId(form) || null;
    });
  });
  return state;
}

function formationById(id){
  if(!id || id===INITIAL_FORMATION_SELECTION.id) return null;
  const key=String(id);
  const keyWithF=/F$/i.test(key)?key:key+'F';
  for(const group of FORMATIONS){
    if(group.type===key) return {id:group.type,name:group.type,img:group.typeImg,kind:'type',type:group.type};
    const direct=(group.items||[]).find(i=>String(i.id)===key || String(i.id)===keyWithF || String(i.name)===key || String(i.name)===key.replace(/F$/i,''));
    if(direct) return {...direct,type:group.type};
    for(const variant of (group.variants||[])){
      if(variant.id===key) return {...variant,kind:'variant',type:group.type};
      const found=(variant.items||[]).find(i=>String(i.id)===key || String(i.id)===keyWithF || String(i.name)===key || String(i.name)===key.replace(/F$/i,''));
      if(found) return {...found,type:group.type};
    }
  }
  return null;
}
function formationIdFromInput(value){
  const raw=String(value??'').trim().toUpperCase();
  const v=raw.replace(/[Ｆ]/g,'F').replace(/[　 ]+/g,'');
  if(!v) return {ok:false,error:'車両番号または編成番号を入力してください。'};

  const train=liveTrain(currentTrainNo,currentTrainSnapshot?.direction||null) || currentTrainSnapshot || trainForCurrentDay(currentTrainNo,currentTrainSnapshot?.direction||null);
  const allowedFamily=allowedFormationFamily(train);
  const candidates=[
    v,
    v.endsWith('F')?v.slice(0,-1):v,
    v.endsWith('F')?v:v+'F'
  ];
  for(const c of candidates){
    const exact=formationById(c);
    if(!exact) continue;
    if(formationFamily(exact)!==allowedFamily){
      return {ok:false,error:allowedFamily==='yokohama'?'この列車は横浜線系統の編成のみ入力できます。':'この列車は京浜東北線系統の編成のみ入力できます。'};
    }
    if(exact.disabled || UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(exact.id))) {
      return {ok:false,error:`編成「${exact.name||exact.id}」は入力できません。`};
    }
    return {ok:true,id:normalizeStoredFormationId(exact.id)};
  }

  // 車両番号から編成番号を特定する。
  // 南武線版と同様、車種 + E233 + ハイフン + 4桁の形式を受け付ける。
  const vehicleNoMatch=v.match(/^(?:クハE233|クハE232|モハE233|モハE232|サハE233|サハE232)-(\d{4})$/i);
  if(vehicleNoMatch){
    const formationId=VEHICLE_TO_FORMATION[vehicleNoMatch[1]];
    const exact=formationId?formationById(formationId):null;
    if(exact){
      if(formationFamily(exact)!==allowedFamily){
        return {ok:false,error:allowedFamily==='yokohama'?'この列車は横浜線系統の編成のみ入力できます。':'この列車は京浜東北線系統の編成のみ入力できます。'};
      }
      if(exact.disabled || UNAVAILABLE_FORMATIONS.has(normalizeStoredFormationId(exact.id))) {
        return {ok:false,error:`編成「${exact.name||exact.id}」は入力できません。`};
      }
      return {ok:true,id:normalizeStoredFormationId(exact.id)};
    }
  }

  return {ok:false,error:`車両番号「${raw}」に該当する編成が見つかりません。`};
}

function routeColorBetweenStations(aName,bName){
  const a=String(aName||''), b=String(bName||'');
  if(!a || !b || a===b) return null;
  const yokohamaRoute=['八王子','片倉','八王子みなみ野','相原','橋本','相模原','矢部','淵野辺','古淵','町田','成瀬','長津田','十日市場','中山','鴨居','小机','新横浜','菊名','大口','東神奈川'];
  const keihinRoute=['大宮','さいたま新都心','与野','北浦和','浦和','南浦和','蕨','西川口','川口','赤羽','東十条','王子','上中里','田端','西日暮里','日暮里','鶯谷','上野','御徒町','秋葉原','神田','東京','有楽町','新橋','浜松町','田町','高輪ゲートウェイ','品川','大井町','大森','蒲田','川崎','鶴見','新子安','東神奈川','横浜','桜木町','関内','石川町','山手','根岸','磯子','新杉田','洋光台','港南台','本郷台','大船'];
  const ySet=new Set(yokohamaRoute), kSet=new Set(keihinRoute);
  const aY=ySet.has(a), bY=ySet.has(b), aK=kSet.has(a), bK=kSet.has(b);

  // 通常の同一路線区間。
  if(aY && bY && !(aK || bK)) return 'var(--yokohama-route)';
  if(aK && bK && !(aY || bY)) return 'var(--keihin-route)';

  // 東神奈川などの共有駅を含む区間は、共有駅ではない側の駅で路線を確定する。
  if(a==='東神奈川' && bY && !bK) return 'var(--yokohama-route)';
  if(b==='東神奈川' && aY && !aK) return 'var(--yokohama-route)';
  if(a==='東神奈川' && bK && !bY) return 'var(--keihin-route)';
  if(b==='東神奈川' && aK && !aY) return 'var(--keihin-route)';

  // 停車駅を飛ばして路線境界をまたぐ列車でも、端側の駅の近くが
  // 別路線色になるのを防ぐため、相手側の固有路線カラーを優先する。
  if(bY && !bK) return 'var(--yokohama-route)';
  if(bK && !bY) return 'var(--keihin-route)';
  if(aY && !aK) return 'var(--yokohama-route)';
  if(aK && !aY) return 'var(--keihin-route)';
  return null;
}
function routeColorForStopIndex(rows,index,trainContext=null){
  const current=String(rows[index]?.station||'');
  const next=index<rows.length-1 ? String(rows[index+1]?.station||'') : '';
  const prev=index>0 ? String(rows[index-1]?.station||'') : '';
  // 駅ラベルの丸は、まず「次駅まで」の実在区間色を使用する。
  const nextColor=routeColorBetweenStations(current,next);
  if(nextColor) return nextColor;
  // 終着駅など次駅がない場合は、直前の実在区間色を使用する。
  const prevColor=routeColorBetweenStations(prev,current);
  if(prevColor) return prevColor;

  // 東神奈川のような共有駅で両側情報が取れない場合だけ列車系統にフォールバック。
  const kind=String(trainContext?.lineKind||'').toLowerCase();
  if(current==='東神奈川') return kind==='yokohama' ? 'var(--yokohama-route)' : 'var(--keihin-route)';
  if(kind==='yokohama') return 'var(--yokohama-route)';
  if(kind==='keihin') return 'var(--keihin-route)';
  return null;
}

function formatTimeNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function currentMinutes(){
  // 時刻入力・現在時刻とも、03:00を境とする「運用日」の分数で扱う。
  // 0:00～2:59は1440分台にすることで、前日の23時台から続く列車が
  // 日付変更後もそのまま位置計算へ入れる。
  if(followNow){
    const d=new Date();
    const base=d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
    return d.getHours()<RESET_HOUR ? base+1440 : base;
  }
  const input=document.getElementById('timeInput');
  const value=input?.value || formatTimeNow();
  const [h,m]=String(value).split(':').map(Number);
  if(Number.isFinite(h) && Number.isFinite(m)){
    // 任意時刻入力時は、その入力時刻の30秒時点を表示基準とする。
    const base=h*60+m+0.5;
    return h<RESET_HOUR ? base+1440 : base;
  }
  const d=new Date();
  const base=d.getHours()*60+d.getMinutes();
  return d.getHours()<RESET_HOUR ? base+1440 : base;
}

    `;
    badge.setAttribute('role','button');
    badge.tabIndex=0;
    badge.addEventListener('click',ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      openStationSheet(st.id);
    });
    badge.addEventListener('keydown',ev=>{
      if(ev.key==='Enter' || ev.key===' '){
        ev.preventDefault();

      }
    });
    const ja=badge.querySelector('.station-name-ja');
    if(ja){
      const len=[...ja.textContent.trim()].length;
      let ls='0';
      if(len<=2){ls='.9em';}
      else if(len===3){ls='.3em';}
      else if(len>=4){ls='.0em';}
      ja.style.letterSpacing=ls;
      ja.style.paddingLeft=ls;
    }
    row.appendChild(badge);
    container.appendChild(row);
  });
  renderTrainPositions();
  renderOperationInfoZones();
}
function timeToMinutes(value){
  const [h,m]=String(value).split(':').map(Number);
  if(!Number.isFinite(h)||!Number.isFinite(m)) return NaN;
  // 運用日は03:00を境にする。0:00～2:59の時刻は翌日扱いとして
  // 1440分台へ持ち上げ、23時台から続く列車を同一運用日で比較できるようにする。
  return h<RESET_HOUR ? h*60+m+1440 : h*60+m;
}
function inferDirectionFromStations(a,b){
  const ia=stationIndex(a),ib=stationIndex(b);
  return ia>ib?'up':'down';
}
function linkedEntries(t){
  const info=findChain(currentDay,t.no);
  if(!info) return {prev:null,next:null,chain:null,index:-1};
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  return {prev:chain[info.entryIndex-1]||null,next:chain[info.entryIndex+1]||null,chain,index:info.entryIndex};
}
function trainEntryNo(entry){ return entry?normalizeTrainNo(entry.no):''; }
function connectionPrev(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const prev=chain[info.entryIndex-1];
  if(!prev || String(prev.dest)!==String(t.start)) return null;
  if(timeToMinutes(prev.endTime)>timeToMinutes(t.stops[0].time)) return null;
  return prev;
}
function connectionNext(t){
  const info=findChain(currentDay,t.no);
  if(!info) return null;
  const chain=OPERATION_CHAINS[currentDay][info.chainIndex];
  const next=chain[info.entryIndex+1];
  if(!next || String(t.dest)!==String(next.start)) return null;
  if(timeToMinutes(t.stops[t.stops.length-1].time)>timeToMinutes(next.startTime)) return null;
  return next;
}
function normalizeLineStopTimes(stops){
  const out=[];
  let prevDep=null;
  (stops||[]).forEach((stop,index)=>{
    let arrival=timeToMinutes(stop?.arrival||stop?.time||stop?.departure);
    let departure=timeToMinutes(stop?.departure||stop?.time||stop?.arrival);
    if(!Number.isFinite(arrival)||!Number.isFinite(departure)) return;
    if(index>0){
      while(Number.isFinite(prevDep) && arrival < prevDep-720){ arrival+=1440; departure+=1440; }
      while(departure < arrival) departure+=1440;
      while(Number.isFinite(prevDep) && departure < prevDep-720){ arrival+=1440; departure+=1440; }
    }
    prevDep=departure;
    out.push({...stop,_arrival:arrival,_departure:departure});
  });
  return out;
}
function getCurrentTrainSource(){
  return currentDay==='休日'
    ? HOLIDAY_TRAINS
    : TRAINS.filter(x=>!Array.isArray(x.days)||!x.days.length||x.days.includes(currentDay));
}
function findTerminalNextTrain(t,lastArr,terminalStation){
  // 終点での折り返しは、埋め込んだ運用連結データだけを使用する。
  // 野田線版と同じく、運用連結されていない別列車へは自動で繋がない。
  const linked=connectionNext(t);
  if(!linked) return null;
  const dep=timeToMinutes(linked.startTime);
  if(!Number.isFinite(dep) || !Number.isFinite(lastArr) || dep<lastArr+1) return null;
  const linkedNo=trainEntryNo(linked);
  const direction=linked.direction||inferDirectionFromStations(linked.start,linked.dest)||null;
  const train=liveTrain(linkedNo,direction) ||
    getCurrentTrainSource().find(x=>normalizeTrainNo(x?.no)===linkedNo &&
      (!direction || String(x.direction||'')===String(direction))) || null;
  return train ? {train,dep} : null;
}
function findTerminalNextDeparture(t,lastArr,terminalStation){
  return findTerminalNextTrain(t,lastArr,terminalStation)?.dep ?? null;
}
function positionForTrain(t,minutes){
  const meta=getTrainRuntimeMeta(t);
  if(!meta) return null;
  const {stops,first,last,firstIndex,lastIndex,side,firstDep,lastArr}=meta;
  if(!Number.isFinite(firstDep)||!Number.isFinite(lastArr)) return null;

  // ページ外の駅を位置計算へ入れない。
  // 直通列車がページ外から入ってくる場合は、最初のページ内駅に
  // 到着するまで表示しない。
  const start=firstDep-RESET_DWELL_MIN+0.5;
  if(firstIndex>=0 && minutes>=start && minutes<firstDep+0.75){
    return {pos:firstIndex,side,visualTrain:t,mode:'start-dwell'};
  }

  // 駅停車中は到着(:15)から発車(:45)まで、その駅に固定表示。
  for(let i=0;i<stops.length;i++){
    const st=stops[i];
    const currentIndex=stationIndex(st.station);
    const arrive=Number(st._arrival)+0.25;
    const depart=Number(st._departure)+0.75;
    if(i>0 && i<stops.length-1 && currentIndex>=0 && minutes>=arrive && minutes<depart){
      return {pos:currentIndex,side,visualTrain:t,mode:'station-dwell'};
    }

    if(i<stops.length-1){
      const next=stops[i+1];
      const nextIndex=stationIndex(next.station);
      // 駅間の両端がともにこのページに存在するときだけ走行位置を返す。
      if(currentIndex<0 || nextIndex<0) continue;

      const a=Number(st._departure)+0.75;
      // 終点到着は到着時刻ちょうどに駅中心へ着いた状態とする。
      const isTerminalNext=(i===stops.length-2);
      const b=isTerminalNext ? Number(next._arrival) : Number(next._arrival)+0.25;
      if(Number.isFinite(a)&&Number.isFinite(b)&&minutes>=a&&(isTerminalNext ? minutes<b : minutes<=b)){
        const ratio=b===a?0:(minutes-a)/(b-a);
        return {pos:currentIndex+(nextIndex-currentIndex)*ratio,side,visualTrain:t,mode:'run'};
      }
    }
  }

  // 終点での左右反対側への移動は、野田線版と同じく
  // 「静的に埋め込まれた運用連結」の次列車がある場合だけ行う。
  const chainInfo=findChain(currentDay,t.no);
  const chain=chainInfo ? OPERATION_CHAINS[currentDay][chainInfo.chainIndex] : null;
  const isChainLast=!!chain && chainInfo.entryIndex===chain.length-1;
  const next=connectionNext(t);
  const nextStart=next ? timeToMinutes(next.startTime)+0.75 : null;

  if(next && !isChainLast && Number.isFinite(nextStart) && minutes>lastArr && minutes<nextStart){
    // 到着後1分間は到着側に残し、その後次列車の発車まで反対側へ移す。
    if(minutes<=lastArr+TURNBACK_SWITCH_MIN){
      return {pos:lastIndex,side,visualTrain:t,mode:'turn-arrival'};
    }

    const nextNo=trainEntryNo(next);
    const nextDirection=(next.start&&next.dest)
      ? (stationIndex(next.start)>stationIndex(next.dest)?'up':'down')
      : null;
    const nextTrain=liveTrain(nextNo,nextDirection) ||
      getCurrentTrainSource().find(x=>normalizeTrainNo(x?.no)===nextNo &&
        (!nextDirection || String(x.direction||'')===String(nextDirection))) || null;
    const oppositeSide=side==='left'?'right':'left';
    const nextSide=nextTrain
      ? (String(nextTrain.direction||'').toLowerCase()==='down'?'right':
         String(nextTrain.direction||'').toLowerCase()==='up'?'left':oppositeSide)
      : oppositeSide;
    return {
      pos:lastIndex,
      side:nextSide,
      visualTrain:nextTrain||t,
      mode:'turn-wait'
    };
  }

  // 次列車へ繋がらない列車は、終着駅で到着後2分間だけ表示する。
  if(lastIndex>=0 && minutes>=lastArr && minutes<=lastArr+RESET_DWELL_MIN){
    return {pos:lastIndex,side,visualTrain:t,mode:'end-dwell'};
  }

  return null;
}


function trainLabelText(t){ return `<span>${getShortType(t.type,t.no)} ${getShortDest(t.dest)}</span>`; }
function trainPositionViewportVisible(p,rowCenters,viewportTop,viewportBottom){
  if(!p||!Number.isFinite(Number(p.pos))||!rowCenters.length) return false;
  if(Number(p.pos)<0 || Number(p.pos)>rowCenters.length-1) return false;
  const q=Number(p.pos);
  const i0=Math.floor(q),i1=Math.min(rowCenters.length-1,Math.ceil(q)),f=q-i0;
  const y=rowCenters[i0]+(rowCenters[i1]-rowCenters[i0])*f;
  const iconHalfHeight=48;
  return y+iconHalfHeight>=viewportTop&&y-iconHalfHeight<=viewportBottom;
}
function scheduleViewportTrainRender(){
  if(scheduleViewportTrainRender.pending) return;
  scheduleViewportTrainRender.pending=true;
  requestAnimationFrame(()=>{
    scheduleViewportTrainRender.pending=false;
    renderTrainPositions();
  });
}
scheduleViewportTrainRender.pending=false;
const TRAIN_ICON_CACHE=new Map();
const TRAIN_RUNTIME_CACHE=new Map();
const TERMINAL_DEPARTURE_CACHE=new Map();
function trainRuntimeKey(t){
  return `${currentDay}|${String(t?.no||'')}|${String(t?.direction||'')}`;
}
function getTrainRuntimeMeta(t){
  const key=trainRuntimeKey(t);
  const cached=TRAIN_RUNTIME_CACHE.get(key);
  if(cached) return cached;
  const stops=normalizeLineStopTimes(t?.stops||[]);
  if(!stops.length) return null;
  const first=stops[0],last=stops[stops.length-1];
  const firstIndex=stationIndex(first.station);
  const lastIndex=stationIndex(last.station);
  const rawDirection=String(t?.direction||'').toLowerCase();
  const side=rawDirection==='up'?'left':rawDirection==='down'?'right':(firstIndex>lastIndex?'left':'right');
  const meta={stops,first,last,firstIndex,lastIndex,side,firstDep:Number(first._departure),lastArr:Number(last._arrival)};
  TRAIN_RUNTIME_CACHE.set(key,meta);
  return meta;
}
function getTerminalDepartureIndex(){
  const key=String(currentDay);
  const cached=TERMINAL_DEPARTURE_CACHE.get(key);
  if(cached) return cached;
  const source=currentDay==='休日'
    ? HOLIDAY_TRAINS
    : TRAINS.filter(x=>!Array.isArray(x.days)||!x.days.length||x.days.includes(currentDay));
  const index=new Map();
  for(const candidate of source){
    if(!candidate) continue;
    const meta=getTrainRuntimeMeta(candidate);
    if(!meta||!meta.stops.length) continue;
    const first=meta.first;
    const dep=Number(first._departure);
    if(!Number.isFinite(dep)) continue;
    const station=String(first.station||'');
    if(!station) continue;
    if(!index.has(station)) index.set(station,[]);
    index.get(station).push({no:normalizeTrainNo(candidate.no),direction:String(candidate.direction||'').toLowerCase(),dep,train:candidate});
  }
  for(const list of index.values()) list.sort((a,b)=>a.dep-b.dep);
  TERMINAL_DEPARTURE_CACHE.set(key,index);
  return index;
}
function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer) return;
  const minutes=currentMinutes();
  const rows=Array.from(document.querySelectorAll('.station-row'));
  if(!rows.length) return;
  const viewportTop=0;
  const viewportBottom=window.innerHeight||document.documentElement.clientHeight||0;
  const rowCenters=rows.map(r=>{const rect=r.getBoundingClientRect();return rect.top+rect.height/2;});
  const source=(currentDay==='休日'
    ? HOLIDAY_TRAINS
    : TRAINS.filter(t=>!Array.isArray(t.days)||!t.days.length||t.days.includes(currentDay)));

  const visible=[];
  const keep=new Set();
  const occupied={left:[],right:[]};

  // 次列車が独立して描画されるのを防ぎ、終点にいる既存アイコンを
  // そのまま次列車へ引き継ぐ。これは野田線版と同じ考え方で処理する。
  const suppress=new Set();
  const handoffs=[];

  for(const base of source){
    const meta=getTrainRuntimeMeta(base);
    if(!meta||meta.lastIndex<0||!Number.isFinite(meta.lastArr)) continue;
    const nextInfo=findTerminalNextTrain(base,meta.lastArr,meta.last.station);
    if(!nextInfo||!nextInfo.train||!Number.isFinite(nextInfo.dep)) continue;

    const oldSignature=`${String(base.no||'')}|${String(base.direction||'')}`;
    const nextSignature=`${String(nextInfo.train.no||'')}|${String(nextInfo.train.direction||'')}`;
    handoffs.push({oldSignature,nextSignature,dep:nextInfo.dep,lastArr:meta.lastArr});

    // 旧列車が反対側で次列車の情報を表示している間は、
    // 次列車自身を別アイコンとして描画しない。
    if(minutes>=meta.lastArr+1 && minutes<nextInfo.dep){
      suppress.add(nextSignature);
    }
  }

  // 次列車の発車時刻になったら、待機していた旧アイコンのDOMを
  // 次列車のキーへ移す。新規アイコンは作らない。
  for(const h of handoffs){
    if(minutes<h.dep) continue;
    const oldEntry=TRAIN_ICON_CACHE.get(h.oldSignature);
    const nextEntry=TRAIN_ICON_CACHE.get(h.nextSignature);
    if(oldEntry && !nextEntry){
      TRAIN_ICON_CACHE.set(h.nextSignature,oldEntry);
      TRAIN_ICON_CACHE.delete(h.oldSignature);
    }
  }

  for(const base of source){
    const baseSignature=`${String(base.no||'')}|${String(base.direction||'')}`;
    if(suppress.has(baseSignature)) continue;

    const p=positionForTrain(base,minutes);
    if(!p||!p.visualTrain||!Number.isFinite(p.pos)) continue;
    if(!trainPositionViewportVisible(p,rowCenters,viewportTop,viewportBottom)) continue;

    visible.push({baseTrain:base,visualTrain:p.visualTrain,info:p,signature:baseSignature});
    keep.add(baseSignature);
  }

  // 現在不要なDOMだけ削除。必要なアイコンは毎秒作り直さず再利用する。
  for(const [signature,entry] of TRAIN_ICON_CACHE){
    if(!keep.has(signature)){
      entry.el.remove();
      TRAIN_ICON_CACHE.delete(signature);
    }
  }

  for(const item of visible){
    const info=item.info;
    occupied[info.side].push({
      t:info.visualTrain,
      pos:info.pos,
      baseTrain:item.baseTrain,
      mode:info.mode,
      signature:item.signature
    });
  }

  const layerRect=layer.getBoundingClientRect();
  const uiScale=1;
  const trainWidth=66*uiScale;
  const imageWidth=60*uiScale;
  const laneGap=20*uiScale;

  const rowRectAt=pos=>{
    if(!rows.length) return null;
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p),i1=Math.min(rows.length-1,Math.ceil(p)),f=p-i0;
    const r0=rows[i0].getBoundingClientRect();
    const r1=rows[i1].getBoundingClientRect();
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>
      a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true})
    );
    const used=[];

    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane)) lane++;
      used.push({pos:item.pos,lane});

      const t=item.t;
      let entry=TRAIN_ICON_CACHE.get(item.signature);
      let el=entry?.el;

      if(entry) entry.currentTrain=t;

      const cls=trainVisualKind(t);
      const formationParts=t.formation&&t.formation!==INITIAL_FORMATION_SELECTION.id
        ? formationDisplayParts(t.formation):[];
      const imageUrl=imageForTrain(t);
      const labelText=trainLabelText(t);
      const contentKey=[
        displayTrainNo(t),
        imageUrl,
        formationParts.join('\n'),
        cls,
        getMainLabelClass(t.type),
        labelText
      ].join('|');
      const contentChanged=!entry||entry.contentKey!==contentKey;

      if(!el){
        el=document.createElement('div');
        el.className=`train-icon ${side}`;
        el.style.visibility='hidden';
        el.style.transition='none';
        layer.appendChild(el);

        entry={
          el,
          contentKey:'',
          layoutHeight:0,
          ready:false,
          currentTrain:t
        };

        el.addEventListener('click',ev=>{
          ev.preventDefault();
          ev.stopPropagation();
          const ct=entry.currentTrain||t;
          openSheet(ct.no,false,ct.direction);
        });

        TRAIN_ICON_CACHE.set(item.signature,entry);
      }

      // 終点で次列車へ引き継いだ場合も、同じDOMの内容だけを更新する。
      if(contentChanged){
        el.innerHTML=`
          <span class="train-no">${displayTrainNo(t)}</span>
          <img src="${imageUrl}" alt="${displayTrainNo(t)}">
          ${formationParts.length
            ? `<span class="train-no train-formation">${formationParts.map(x=>
                `<span>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`
              ).join('')}</span>`
            : ''}
          <span class="train-label ${cls} ${getMainLabelClass(t.type)}">${labelText}</span>
        `;
        entry.contentKey=contentKey;
        entry.layoutHeight=0;
        entry.ready=false;
      }

      el.className=`train-icon ${side}`;
      el.style.transition='none';

      const rr=rowRectAt(item.pos) || {
        centerY:layerRect.top+layerRect.height/2
      };
      const layoutWidth=window.innerWidth<960?1920:layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'
        ? centerX-340-laneOffset
        : centerX+340-trainWidth+laneOffset;

      const applyFinalPosition=()=>{
        const img=el.querySelector('img');
        const noEl=el.querySelector('.train-no');
        const formationEl=el.querySelector('.train-formation');
        if(!img) return;

        const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
        const imgRect=img.getBoundingClientRect();
        const noRect=noEl?.getBoundingClientRect();
        const formationRect=formationEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom)||imageWidth;
        const imgHeight=(imgRect.height/mobileZoom)||actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom)||12*uiScale*1.05;
        const formationHeight=(formationRect?.height/mobileZoom)||0;
        // 駅の中心には列車番号＋車両画像＋編成表示を合わせ、
        // 行先・種別ラベルはその下へ配置する。
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-(noHeight+imgHeight+formationHeight)/2;

        el.style.top=`${finalTop}px`;
        el.style.left=`${trainLeft}px`;
        el.style.right='auto';
        el.style.setProperty('--lane-shift','0px');
        el.style.transform='none';
        el.style.visibility='visible';
        entry.ready=true;
        entry.layoutHeight=el.getBoundingClientRect().height/mobileZoom||48;
      };

      const img=el.querySelector('img');
      if(img?.complete&&img.naturalWidth){
        applyFinalPosition();
      }else if(img){
        img.addEventListener('load',applyFinalPosition,{once:true});
        el.style.visibility='hidden';
      }
    });
  });
}

function openSheet(trainNo,fromStationTimetable=false,direction=null){
  const key=String(trainNo ?? '');
  const train=trainForCurrentDay(key,direction || (fromStationTimetable?stationTimetableDirection:null));
  if(!train) return;
  if(fromStationTimetable && currentStationId){
    previousSheetContext={type:'station-timetable',stationId:String(currentStationId),direction:stationTimetableDirection};
  }else{
    previousSheetContext=null;
  }
  currentStationId=null;
  currentTrainNo=key;
  currentTrainSnapshot={...train,stops:(train.stops||[]).map(x=>({...x}))};
  stationTimetableDirection='up';
  isEditMode=false;
  const sheet=document.getElementById('bottomSheet');
  const overlay=document.getElementById('overlay');
  if(!sheet || !overlay) return;
  sheet.classList.remove('editing');
  const header=sheet.querySelector('.sheet-header-left > span');
  if(header) header.textContent='列車情報';
  const backBtn=document.getElementById('sheetBackBtn');
  if(backBtn) backBtn.classList.toggle('visible', !!(fromStationTimetable && previousSheetContext));
  updateSheetContent();
  overlay.style.display='block';
  sheet.classList.add('active');
}
function closeSheet(){
  const sheet=document.getElementById('bottomSheet');
  const overlay=document.getElementById('overlay');
  if(overlay) overlay.style.display='none';
  if(sheet) sheet.classList.remove('active','editing');
  const backBtn=document.getElementById('sheetBackBtn');
  if(backBtn) backBtn.classList.remove('visible');
  currentTrainNo=null;
  currentTrainSnapshot=null;
  currentStationId=null;
  previousSheetContext=null;
  isEditMode=false;
}

function stationInfoRouteColor(index){

  return index>=higashi ? 'var(--keihin-route)' : 'var(--yokohama-route)';
}
function stationInfoSegmentColor(aIndex,bIndex){
  const higashi=STATIONS.findIndex(st=>st.nameJa==='東神奈川');
  // 起終点では存在しない側を固定色にせず、実在する隣接区間の色を使う。
  if(aIndex<0){
    if(bIndex>=0 && bIndex<STATIONS.length-1) return stationInfoSegmentColor(bIndex,bIndex+1);
    return bIndex<=higashi ? 'var(--yokohama-route)' : 'var(--keihin-route)';
  }
  if(bIndex<0){
    if(aIndex>0) return stationInfoSegmentColor(aIndex-1,aIndex);
    return aIndex<=higashi ? 'var(--yokohama-route)' : 'var(--keihin-route)';
  }
  const aName=STATIONS[aIndex]?.nameJa||'';
  const bName=STATIONS[bIndex]?.nameJa||'';
  return routeColorBetweenStations(aName,bName)
    || (Math.max(aIndex,bIndex)<=higashi ? 'var(--yokohama-route)' : 'var(--keihin-route)');
}
function getStationDirectionLabels(stationName){
  const index=STATIONS.findIndex(st=>st.nameJa===String(stationName||''));
  const higashi=STATIONS.findIndex(st=>st.nameJa==='東神奈川');
  const yokohama=STATIONS.findIndex(st=>st.nameJa==='横浜');
  if(index===higashi) return {up:'八王子・大宮方面',down:'大船方面'};
  if(index>=yokohama) return {up:'八王子・大宮方面',down:'大船方面'};
  return {up:'八王子方面',down:'東神奈川方面'};
}
