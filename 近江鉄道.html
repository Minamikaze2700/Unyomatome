function routeForStationName(name){
  const n=normName(name);

  if(YOKAICHI_NAMES.slice(1).some(x=>normName(x)===n))return 'yokaichi';
  return 'main';
}
function routeForPair(a,b){
  const A=normName(a),B=normName(b);
  if((TAGA_NAMES.some(x=>normName(x)===A)&&TAGA_NAMES.some(x=>normName(x)===B)) && (A!==normName('八日市')&&B!==normName('八日市'))) return 'taga';
  if(YOKAICHI_NAMES.some(x=>normName(x)===A)&&YOKAICHI_NAMES.some(x=>normName(x)===B)) return 'yokaichi';
  if((A===normName('高宮')&&TAGA_NAMES.some(x=>normName(x)===B))||(B===normName('高宮')&&TAGA_NAMES.some(x=>normName(x)===A))) return 'taga';
  if((A===normName('八日市')&&YOKAICHI_NAMES.some(x=>normName(x)===B))||(B===normName('八日市')&&YOKAICHI_NAMES.some(x=>normName(x)===A))) return 'yokaichi';

function directionForPair(a,b){

  const ib=names.findIndex(x=>sameStation(x,b));

}

function stopArray(raw){

function daysFor(raw){

function normalizeTrain(raw,dayOverride=null){
  if(!raw||typeof raw!=='object')return null;
  const stops=stopArray(raw); if(!stops.length)return null;
  const no=String(raw.no??raw.trainNo??raw.trainNumber??raw.number??raw.operationNo??'').trim();
  if(!no)return null;

  // その時刻を着発同時として保持する。明示的な着発差はそのまま残す。
  for(let i=0;i<stops.length;i++){
    const st=stops[i];
    if(i>0 && i<stops.length-1){
      if(!st.arrival && st.departure) st.arrival=st.departure;
      if(!st.departure && st.arrival) st.departure=st.arrival;
      if(!st.arrival && !st.departure && st.time){st.arrival=st.time;st.departure=st.time;}

function minuteOfStop(s){return parseMin(s?.time);}
function cloneTrain(t){return JSON.parse(JSON.stringify(t));}
function mergeOmiFragments(list){
  const groups=new Map();
  for(const t of list){
    for(const day of (t.days||['平日'])){
      const d={...t,days:[day],stops:t.stops.map(x=>({...x}))};
      const key=`${day}|${t.no}|${t.direction}`;
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(d);
    }
  }
  const result=[];
  for(const items of groups.values()){
    items.sort((a,b)=>(minuteOfStop(a.stops[0])-minuteOfStop(b.stops[0])));
    const merged=[];
    for(const cur of items){
      let target=merged.at(-1);
      if(target){
        const a=target.stops.at(-1),b=cur.stops[0];
        const ta=minuteOfStop(a),tb=minuteOfStop(b);
        const sameJunction=a&&b&&sameStation(a.station,b.station) && Number.isFinite(ta)&&Number.isFinite(tb) && Math.abs(tb-ta)<=30;
        if(sameJunction){
          const nextStops=cur.stops.slice(1);
          target.stops.push(...nextStops);
          target.dest=cur.dest||target.dest;
          target.formation=target.formation||cur.formation||'';
          continue;
        }
      }
      merged.push(cloneTrain(cur));
    }
    result.push(...merged);
  }
  return result;
}

function getJapaneseHolidaySet(year){const national=getJapaneseNationalHolidays(year),holidays=new Set(national);for(const key of [...national]){const d=new Date(`${key}T00:00:00`);if(d.getDay()!==0)continue;const cursor=new Date(d);do{cursor.setDate(cursor.getDate()+1);const k=todayKey(cursor);if(!national.has(k)&&!holidays.has(k)){holidays.add(k);break;}}while(cursor.getFullYear()<=year+1);}for(let d=new Date(year,0,1),end=new Date(year,11,31);d<=end;d.setDate(d.getDate()+1)){const key=todayKey(d);if(holidays.has(key))continue;const prev=new Date(d),next=new Date(d);prev.setDate(prev.getDate()-1);next.setDate(next.getDate()+1);if(national.has(todayKey(prev))&&national.has(todayKey(next)))holidays.add(key);}return holidays;}

async function initFirebase(){
  loadFormationState();

  try{
    firebaseApp=firebase.apps.find(a=>a.name==='omi');

    firebaseDb=firebase.database(firebaseApp);
    firebaseReady=true;

    // 南武線側と同じく、初期状態の読込に失敗しても画面全体は停止させずローカル動作へ戻す。
    try{
      const root=firebaseDb.ref('運用');
      const snap=await root.child('stateByDay').child(currentDay||'平日').once('value');
      const remote=snap.val();
      if(remote && typeof remote==='object'){
        formationState[currentDay||'平日']={...(formationState[currentDay||'平日']||{}),...remote};
      }
      const tsSnap=await root.child('formationUpdatedAtByDay').child(currentDay||'平日').once('value');
      const remoteTs=tsSnap.val();
      if(remoteTs && typeof remoteTs==='object'){
        formationUpdatedAt[currentDay||'平日']={...(formationUpdatedAt[currentDay||'平日']||{}),...remoteTs};
      }
      saveFormationState();
      applyFormationState();
    }catch(e){
      console.warn('近江鉄道 Firebase 初期データ読込失敗（ローカル動作へ切替）',e);
      firebaseReady=false;
      firebaseDb=null;
      return false;
    }

    // 別端末の編成登録をリアルタイム反映。権限がない場合はその場で監視だけ停止。
    try{
      const ref=firebaseDb.ref('運用').child('stateByDay').child(currentDay||'平日');
      ref.on('value',snap=>{
        const remote=snap.val();
        if(!remote || typeof remote!=='object')return;
        formationState[currentDay||'平日']={...remote};
        saveFormationState();
        if(!isEditMode){
          applyFormationState();
          if(currentTrainNo){
            currentTrainSnapshot=liveTrain(currentTrainNo,currentTrainDirection,currentTrainService)||currentTrainSnapshot;
            updateSheetContent();
          }
          render();
        }
      },err=>{
        console.warn('近江鉄道 Firebase リアルタイム同期失敗',err);
        firebaseReady=false;
        firebaseDb=null;
      });
      const tsRef=firebaseDb.ref('運用').child('formationUpdatedAtByDay').child(currentDay||'平日');
      tsRef.on('value',snap=>{
        const remote=snap.val();
        if(remote && typeof remote==='object'){
          formationUpdatedAt[currentDay||'平日']={...remote};
          saveFormationState();
          if(currentTrainNo&&!isEditMode)updateSheetContent();
        }
      },()=>{});
    }catch(e){}
    return true;
  }catch(e){
    console.warn('近江鉄道 Firebase 初期化失敗（ローカル動作へ切替）',e);
    firebaseReady=false;
    firebaseDb=null;
    return false;
  }
}
async function syncFormationToFirebase(t,value){
  if(!firebaseReady||!firebaseDb||!t)return true;
  try{
    const day=currentDay||'平日';
    const key=firebaseStateKey(t);
    const root=firebaseDb.ref('運用');
    await root.child('stateByDay').child(day).update({[key]:value?String(value):null});
    await root.child('formationUpdatedAtByDay').child(day).update({[key]:value?Date.now():null});
    return true;
  }catch(e){
    const msg=String(e?.message||e||'');
    if(/permission_denied/i.test(msg)){
      console.warn('近江鉄道 Firebase 書込権限がないため、この端末の保存結果を使用します。');
    }else{
      console.warn('近江鉄道 Firebase 編成同期失敗',e);
    }
    firebaseReady=false;
    firebaseDb=null;
    return false;
  }
}

function buildScreenRows(){

    opt.lineTop=prev?COLORS.main:'transparent';
    opt.lineBottom=next?COLORS.main:'transparent';
    opt.stationColor=COLORS.main;

    if(st[0]==='高宮'){
      opt.buttons=[{label:'多賀線',color:COLORS.taga,action:()=>toggleBranch('taga'),active:activeBranches.has('taga')}];
      if(activeBranches.has('taga')){
        opt.lineBottom=COLORS.taga;

      }
    }
    if(st[0]==='八日市'){
      opt.buttons=[{label:'八日市線',color:COLORS.yokaichi,action:()=>toggleBranch('yokaichi'),active:activeBranches.has('yokaichi')}];
      if(activeBranches.has('yokaichi')){

      }
    }

    push(st,'main',opt);

    if(st[0]==='高宮'&&activeBranches.has('taga')){
      const b=ROUTES.taga.stations.slice(1);
      b.forEach((x,j)=>push(x,'taga',{
        lineTop:COLORS.taga,
        lineBottom:COLORS.taga,
        stationColor:COLORS.taga,
        cutBelow:j===b.length-1,
        breakAfter:j===b.length-1
      }));
      if(next){
        const no={lineTop:'transparent',lineBottom:COLORS.main,stationColor:COLORS.main,fadeUp:true,fadeColor:COLORS.main,breakBefore:true};
        push(next,'main',no);i++;
      }
    }

    if(st[0]==='八日市'&&activeBranches.has('yokaichi')){
      const b=ROUTES.yokaichi.stations.slice(1);
      b.forEach((x,j)=>push(x,'yokaichi',{
        lineTop:COLORS.yokaichi,
        lineBottom:COLORS.yokaichi,
        stationColor:COLORS.yokaichi,
        cutBelow:j===b.length-1,
        breakAfter:j===b.length-1

      if(next){

    const nb=!!r.opt.breakAfter||!!n?.opt?.breakBefore;

      r.opt.lineBottom=COLORS.taga;
      r.opt.stationColor=COLORS.taga;
    }
    if(r.st[0]==='八日市'&&activeBranches.has('yokaichi')){
      r.opt.lineBottom=COLORS.yokaichi;
      r.opt.stationColor=COLORS.yokaichi;
    }
  }

}

function renderTrainPositions(){
  const layer=document.getElementById('movingTrainLayer');
  if(!layer)return;
  const minutes=currentMinutes();
  layer.innerHTML='';
  const rows=Array.from(document.querySelectorAll('.station-row'));
  if(!rows.length)return;
  const viewportTop=0;
  const viewportBottom=window.innerHeight||document.documentElement.clientHeight||0;
  const source=TRAINS.filter(t=>!Array.isArray(t.days)||!t.days.length||t.days.includes(currentDay));
  const visible=[];
  const visiblePositions=new Map();
  for(const base of source){
    const p=trainPosition(base,minutes);
    if(!p||(!p.stationA&&!p.stationB&&!Number.isFinite(p.pos)))continue;
    if(!trainPositionViewportVisible(p,rows,viewportTop,viewportBottom))continue;
    const hydrated=liveTrain(base.no,base.direction)||base;
    const signature=`${String(base.no||'')}|${String(base.direction||'')}`;
    visible.push(hydrated);
    visiblePositions.set(signature,p);
  }
  const occupied={left:[],right:[]};
  visible.forEach(t=>{
    const signature=`${String(t.no||'')}|${String(t.direction||'')}`;
    const info=visiblePositions.get(signature)||trainPosition(t,minutes);
    if(!info||!info.visualTrain)return;
    occupied[info.side||'right'].push({t:info.visualTrain,pos:info.pos,baseTrain:t,mode:info.mode});
  });

  const layerRect=layer.getBoundingClientRect();
  const uiScale=1,trainWidth=66*uiScale,imageWidth=60*uiScale,laneGap=20*uiScale;
  const rowRectAt=(pos)=>{
    const p=Math.max(0,Math.min(rows.length-1,pos));
    const i0=Math.floor(p),i1=Math.min(rows.length-1,Math.ceil(p)),f=p-i0;
    const r0=rows[i0].getBoundingClientRect(),r1=rows[i1].getBoundingClientRect();
    return {
      left:r0.left+(r1.left-r0.left)*f,
      right:r0.right+(r1.right-r0.right)*f,
      top:r0.top+(r1.top-r0.top)*f,
      bottom:r0.bottom+(r1.bottom-r0.bottom)*f,
      centerY:r0.top+r0.height/2+(r1.top+r1.height/2-(r0.top+r0.height/2))*f
    };
  };

  ['left','right'].forEach(side=>{
    occupied[side].sort((a,b)=>a.pos-b.pos||String(a.t.no).localeCompare(String(b.t.no),undefined,{numeric:true}));
    const used=[];
    occupied[side].forEach(item=>{
      let lane=0;
      while(used.some(u=>Math.abs(u.pos-item.pos)<0.24&&u.lane===lane))lane++;
      used.push({pos:item.pos,lane});
      const el=document.createElement('div');
      el.className=`train-icon ${side}`;
      el.style.visibility='hidden';
      el.style.transition='none';
      const rr=rowRectAt(item.pos)||{left:layerRect.left,right:layerRect.right,centerY:layerRect.top+layerRect.height/2};
      const layoutWidth=window.innerWidth<960?1920:layerRect.width;
      const centerX=layoutWidth/2;
      const laneOffset=lane*(trainWidth+laneGap);
      const trainLeft=side==='left'?centerX-340-laneOffset:centerX+340-trainWidth+laneOffset;
      const t=item.t;
      const formationParts=t.formation&&t.formation!=='__INITIAL__'?formationDisplayParts(t.formation):[];
      const formationHTML=formationParts.length?`<span class="train-no train-formation">${formationParts.map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:'';
      el.innerHTML=`<span class="train-no">${esc(displayTrainNo(t))}</span><img src="${esc(trainImageFor(t))}" alt="${esc(displayTrainNo(t))}" onerror="this.onerror=null;this.src='${NOIMAGE_IMG}'">${formationHTML}<span class="train-label ${getMainLabelClass(t.type)}"><span>${esc(trainLabelText(t))}</span></span>`;
      el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();openTrainSheet(t);});
      layer.appendChild(el);
      const img=el.querySelector('img'),noEl=el.querySelector('.train-no'),formationEl=el.querySelector('.train-formation');
      const applyFinalPosition=()=>{
        if(!img)return;
        const mobileZoom=window.innerWidth<960?window.innerWidth/960:1;
        const imgRect=img.getBoundingClientRect(),noRect=noEl?.getBoundingClientRect(),formationRect=formationEl?.getBoundingClientRect();
        const actualImageWidth=(imgRect.width/mobileZoom)||imageWidth;
        const imgHeight=(imgRect.height/mobileZoom)||actualImageWidth*((img.naturalHeight||30)/(img.naturalWidth||60));
        const noHeight=(noRect?.height/mobileZoom)||12*uiScale*1.05;
        const formationHeight=(formationRect?.height/mobileZoom)||0;
        const desiredCenterY=(rr.centerY-layerRect.top)/mobileZoom;
        const finalTop=desiredCenterY-(noHeight+imgHeight+formationHeight)/2;
        el.style.top=`${finalTop}px`;
        el.style.left=`${trainLeft}px`;
        el.style.right='auto';
        el.style.setProperty('--lane-shift','0px');
        el.style.transform='none';
        el.style.visibility='visible';
      };
      if(img.complete&&img.naturalWidth)applyFinalPosition();
      else img.addEventListener('load',applyFinalPosition,{once:true});
    });
  });
}

function trainVisualRouteAtStation(t,stationName){
  const n=stationNameKey(stationName); const stops=Array.isArray(t?.stops)?t.stops:[];
  let idx=-1;for(let i=stops.length-1;i>=0;i--){if(stationNameKey(stops[i]?.station)===n){idx=i;break;}}
  if(idx<0)return 'main';
  if(n===stationNameKey('高宮')){
    const p=idx>0?stops[idx-1]?.station:''; const q=idx+1<stops.length?stops[idx+1]?.station:'';
    if(p&&routeForPair(p,stationName)!=='main')return routeForPair(p,stationName);
    if(q&&routeForPair(stationName,q)!=='main')return routeForPair(stationName,q);
  }
  if(n===stationNameKey('八日市')){
    const p=idx>0?stops[idx-1]?.station:''; const q=idx+1<stops.length?stops[idx+1]?.station:'';
    if(p&&routeForPair(p,stationName)!=='main')return routeForPair(p,stationName);

}
function timetableVisualSideAtStation(t,stationName,routeKey){

  let idx=-1;for(let i=stops.length-1;i>=0;i--){if(stationNameKey(stops[i]?.station)===name){idx=i;break;}}

  if(routeKey==='taga' || routeKey==='yokaichi'){
    const next=idx<stops.length-1?stops[idx+1]?.station:null;
    const prev=idx>0?stops[idx-1]?.station:null;
    const d=next?directionForPair(stops[idx].station,next):(prev?directionForPair(prev,stops[idx].station):t.direction);

function stationTimetableEntries(st,routeKey,direction){
  const name=String(st?.[0]||'');
  const nameKey=stationNameKey(name);
  const wantedSide=direction==='down'?'left':'right';
  const byTrain=new Map();
  for(const train of getVisibleTrains()){
    if(!trainAllowedOnVisibleBranch(train,name))continue;
    if(stationNamesEqual(train?.dest,name))continue;
    if(String(train?.type||'')==='回送')continue;
    const stops=Array.isArray(train?.stops)?train.stops:[];
    const stopIndex=[...stops].map(x=>stationNameKey(x?.station)).lastIndexOf(nameKey);
    if(stopIndex<0)continue;
    const stop=stops[stopIndex];
    if(stop?.timingOnly===true)continue;
    if(!stop?.departure&&!stop?.arrival&&!stop?.time)continue;
    const side=timetableVisualSideAtStation(train,name,routeKey);
    if(side!==wantedSide)continue;
    const key=`${trainGroupKey(train)}|${String(train.no||'')}`;
    if(!key||byTrain.has(key))continue;
    byTrain.set(key,{train,stop});
  }
  return [...byTrain.values()].sort((a,b)=>serviceDayMinuteFromTime(a.stop.departure||a.stop.arrival||a.stop.time)-serviceDayMinuteFromTime(b.stop.departure||b.stop.arrival||b.stop.time)||String(a.train.no).localeCompare(String(b.train.no),undefined,{numeric:true}));
}

function timetableSegmentColor(stops,i){

  const r=routeForPair(a,b); return lineColorFor(r);

function timetableStationColor(stops,i){return timetableSegmentColor(stops,i)||timetableSegmentColor(stops,i-1)||COLORS.main;}
function timetableRowsHTML(stops){
  const visibleStops=(Array.isArray(stops)?stops:[]).filter(s=>s?.timingOnly!==true && String(s?.station||'')!=='着番線');
  let html='';
  for(let i=0;i<visibleStops.length;){
    const station=visibleStops[i].station;
    const cur=visibleStops[i];
    const times=[];
    if(cur?.arrival) times.push(cur.arrival);
    if(cur?.departure && cur.departure!==cur.arrival) times.push(cur.departure);
    if(!times.length && cur?.time) times.push(cur.time);
    let j=i+1;
    while(j<visibleStops.length&&sameStation(visibleStops[j].station,station)){
      const q=visibleStops[j];
      if(q?.arrival&&!times.includes(q.arrival))times.push(q.arrival);
      if(q?.departure&&!times.includes(q.departure))times.push(q.departure);
      if(q?.time&&!times.includes(q.time))times.push(q.time);
      j++;
    }
    const shown=times.slice(0,2);
    const dotColor=timetableStationColor(visibleStops,i);
    const topLineColor=i>0?timetableSegmentColor(visibleStops,i-1):null;
    const bottomLineColor=timetableSegmentColor(visibleStops,j-1)||topLineColor||dotColor;
    const lineStyle=`--timetable-line-top:${topLineColor||bottomLineColor};--timetable-line-bottom:${bottomLineColor};--timetable-dot-color:${dotColor};`;
    html+=`<div class="timetable-item" style="${lineStyle}"><div class="time-dot"></div><div class="time-text${shown.length>1?' two-line':''}">${shown.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="station-text">${esc(stopGuideStationName(station))}</div></div>`;
    i=j;
  }

}

function formationIdFromInput(value,trainOverride=null){

  if(typeMatch)return {ok:true,id:String(typeMatch.id)};
  const normalized=raw.replace(/F$/i,'');
  if(!/^\d{3,4}$/.test(normalized))return {ok:false,error:'登録されている編成番号または形式を入力してください。'};
  const known=formationById(normalized);
  if(!known)return {ok:false,error:`編成「${normalized}F」は登録されていません。`};
  const train=trainOverride||currentTrainObjectByNo(currentTrainNo,currentTrainSnapshot?.direction,currentSelectedService());

}

/* 近江鉄道・運行情報（南武線版の処理系を基準に、近江鉄道の3路線へ置換） */
const OPERATION_INFO_STORAGE_KEY='omiOperationInfo_v2';
function operationInfoNormalizeName(name){
return String(name??'').normalize('NFKC').replace(/\u3000/g,' ').trim();
}
const OPERATION_INFO_REASONS=['人身事故','車両故障・点検','信号・電気設備トラブル','線路内立入り・支障物','踏切・安全確認','天候（大雨・強風・雷・雪）','地震・災害','急病人救護','混雑・その他'];
const OPERATION_INFO_LINE_GROUPS=[
{label:'本線',stations:ROUTES.main.stations},
{label:'多賀線',stations:ROUTES.taga.stations},
{label:'八日市線',stations:ROUTES.yokaichi.stations}
];
const OPERATION_INFO_STATIONS=[...new Set(OPERATION_INFO_LINE_GROUPS.flatMap(g=>g.stations.map(x=>operationInfoNormalizeName(x[0]))))];
let operationInfoEntries=[];
function operationInfoGraph(){
const g=new Map(),add=(a,b)=>{a=operationInfoNormalizeName(a);b=operationInfoNormalizeName(b);if(!a||!b||a===b)return;(g.has(a)?g.get(a):g.set(a,new Set()).get(a)).add(b);(g.has(b)?g.get(b):g.set(b,new Set()).get(b)).add(a);};
OPERATION_INFO_LINE_GROUPS.forEach(group=>{const ss=group.stations.map(x=>operationInfoNormalizeName(x[0]));for(let i=0;i<ss.length-1;i++)add(ss[i],ss[i+1]);});
return g;
}
function operationInfoFindPath(start,end){
start=operationInfoNormalizeName(start);end=operationInfoNormalizeName(end);
if(!start||!end||start===end)return null;
const g=operationInfoGraph();if(!g.has(start)||!g.has(end))return null;
const q=[start],prev=new Map([[start,null]]);
while(q.length){
const cur=q.shift();if(cur===end)break;
const nexts=[...(g.get(cur)||[])].sort((a,b)=>OPERATION_INFO_STATIONS.indexOf(a)-OPERATION_INFO_STATIONS.indexOf(b));
for(const n of nexts){if(prev.has(n))continue;prev.set(n,cur);q.push(n);}
}
if(!prev.has(end))return null;
const path=[];for(let x=end;x!=null;x=prev.get(x))path.push(x);path.reverse();
return path.length>=2?path:null;
}
function operationInfoUndirectedKey(a,b){return [String(a||''),String(b||'')].sort().join('\u0000');}
function operationInfoPathEdges(stations){const set=new Set();for(let i=0;i<stations.length-1;i++)set.add(operationInfoUndirectedKey(stations[i],stations[i+1]));return set;}
function normalizeOperationEntry(e){const rawStations=Array.isArray(e?.stations)&&e.stations.length>=2?e.stations.map(operationInfoNormalizeName):operationInfoFindPath(e?.start,e?.end);const stations=rawStations;return stations&&stations.length>=2?{...e,start:stations[0],end:stations.at(-1),stations,delay:e?.status==='suspend'?'unknown':operationInfoDelayValue(e?.delay)}:null;}
let operationInfoFirebaseLoaded=false;
let operationInfoFirebaseSyncing=false;
let operationInfoFirebaseListeners={};
function operationInfoFirebaseDatabases(){return firebaseDb?{omi:firebaseDb}:{};}
function operationInfoFirebaseProjectForRoute(routeKey){
const key=String(routeKey||'');
if(key==='main'||key==='taga'||key==='yokaichi')return 'omi';
return null;
}
function operationInfoFirebaseProjectForStation(stationName){
return operationInfoFirebaseProjectForRoute(operationInfoStationRouteKey(stationName));
}
function operationInfoFirebaseStationKey(stationName){
return encodeURIComponent(operationInfoNormalizeName(stationName));
}
function operationInfoFirebaseFlatten(snapshotValue){
const result=new Map();
const root=snapshotValue&&typeof snapshotValue==='object'?snapshotValue:{};
for(const stationMap of Object.values(root)){
if(!stationMap||typeof stationMap!=='object')continue;
for(const [entryId,payload] of Object.entries(stationMap)){
if(!payload||typeof payload!=='object')continue;
const id=String(payload.id||entryId);
const normalized=normalizeOperationEntry(payload);
if(!normalized)continue;
const prev=result.get(id);
const ts=Number(payload.createdAt)||0;
if(!prev||ts>=Number(prev.createdAt||0))result.set(id,normalized);
}
}
return [...result.values()];
}
function operationInfoDelayValue(value){
if(value===null||value===undefined||String(value)==='') return 'unknown';
const n=Number(value);
return Number.isFinite(n)&&n>0 ? n : 'unknown';
}
function operationInfoDelayText(value){
const d=operationInfoDelayValue(value);
return d==='unknown'?'遅延時間不明':`遅延 ${d}分`;
}
function operationInfoFirebasePayload(entry){
return {
id:String(entry.id),
start:operationInfoNormalizeName(entry.start),
end:operationInfoNormalizeName(entry.end),
stations:Array.isArray(entry.stations)?entry.stations.map(operationInfoNormalizeName):[],
status:entry.status==='suspend'?'suspend':'delay',
delay:operationInfoDelayValue(entry.delay),
reason:String(entry.reason||OPERATION_INFO_REASONS[0]),
createdAt:Number(entry.createdAt)||0,
operationDate:operationDateKey()
};
}
function operationInfoFirebaseDesiredTree(projectKey){
const tree={};
for(const raw of operationInfoEntries){
const entry=normalizeOperationEntry(raw);
if(!entry||!Array.isArray(entry.stations)||entry.stations.length<2)continue;
const payload=operationInfoFirebasePayload(entry);
for(const station of entry.stations){
const project=operationInfoFirebaseProjectForStation(station);
if(project!==projectKey)continue;
const sk=operationInfoFirebaseStationKey(station);
if(!tree[sk])tree[sk]={};
tree[sk][String(entry.id)]=payload;
}
}
return tree;
}
async function saveOperationInfoToFirebase(){
if(!firebaseReady||operationInfoFirebaseSyncing)return;
operationInfoFirebaseSyncing=true;
try{
const dateKey=operationDateKey();
for(const [key,db] of Object.entries(operationInfoFirebaseDatabases())){
if(key!=='omi'||!db)continue;
const ref=db.ref('運行情報').child(dateKey);
const desired=operationInfoFirebaseDesiredTree(key);
await ref.set(desired);
}
}catch(e){
console.warn('運行情報Firebase保存失敗',e);
}finally{
operationInfoFirebaseSyncing=false;
}
}
async function loadOperationInfoFromFirebase(){
if(!firebaseReady)return false;
try{
const dateKey=operationDateKey();
const localBefore=[...operationInfoEntries].map(normalizeOperationEntry).filter(Boolean);
const merged=new Map();
let foundRemote=false;
for(const [key,db] of Object.entries(operationInfoFirebaseDatabases())){
if(key!=='omi'||!db)continue;
try{
const snap=await db.ref('運行情報').child(dateKey).once('value');
if(snap.exists())foundRemote=true;
for(const entry of operationInfoFirebaseFlatten(snap.val())){
const id=String(entry.id);
const prev=merged.get(id);
if(!prev||Number(entry.createdAt||0)>=Number(prev.createdAt||0))merged.set(id,entry);
}
}catch(e){console.warn('運行情報Firebase読込失敗',key,e);}
}
if(foundRemote){
operationInfoEntries=[...merged.values()];
}else{
operationInfoEntries=localBefore;
}
operationInfoFirebaseLoaded=true;
saveOperationInfo();
if(!foundRemote&&operationInfoEntries.length) await saveOperationInfoToFirebase();
renderOperationInfoList();
renderOperationInfoZones();
return true;
}catch(e){
console.warn('運行情報Firebase統合読込失敗',e);
return false;
}
}
function attachOperationInfoFirebaseListeners(){
const dateKey=operationDateKey();
for(const [key,db] of Object.entries(operationInfoFirebaseDatabases())){
if(key!=='omi'||!db)continue;
if(operationInfoFirebaseListeners[key]){
try{operationInfoFirebaseListeners[key].off();}catch(e){}
}
const ref=db.ref('運行情報').child(dateKey);
const handler=snap=>{
if(operationInfoFirebaseSyncing)return;
const incoming=operationInfoFirebaseFlatten(snap.val());
const byId=new Map(incoming.map(e=>[String(e.id),e]));
const others=operationInfoEntries.filter(e=>operationInfoFirebaseProjectForStation(e?.stations?.[0])!==key);
const merged=new Map();
[...others,...incoming].forEach(e=>{if(!e?.id)return;const id=String(e.id),prev=merged.get(id);if(!prev||Number(e.createdAt||0)>=Number(prev.createdAt||0))merged.set(id,e);});
operationInfoEntries=[...merged.values()];
operationInfoFirebaseLoaded=true;
saveOperationInfo();
renderOperationInfoList();
renderOperationInfoZones();
};
ref.on('value',handler);
operationInfoFirebaseListeners[key]=ref;
}
}
function loadOperationInfo(){try{const key=operationDateKey();const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');const raw=Array.isArray(all?.[key])?all[key]:[];operationInfoEntries=raw.map(normalizeOperationEntry).filter(Boolean);}catch(e){operationInfoEntries=[];}}
function saveOperationInfo(){try{const all=JSON.parse(localStorage.getItem(OPERATION_INFO_STORAGE_KEY)||'{}');all[operationDateKey()]=operationInfoEntries;localStorage.setItem(OPERATION_INFO_STORAGE_KEY,JSON.stringify(all));}catch(e){}}

function getContrastTextColor(hex){
const m=String(hex||'').trim().replace('#','');
if(!/^[0-9a-fA-F]{6}$/.test(m)) return '#111';
const r=parseInt(m.slice(0,2),16)/255;
const g=parseInt(m.slice(2,4),16)/255;
const b=parseInt(m.slice(4,6),16)/255;
const lin=v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);
const lum=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
return lum>0.179?'#111':'#fff';
}
const header=document.createElement('div'); header.className='operation-info-custom-group'; header.style.backgroundColor=group.color; header.style.color='#fff'; header.textContent=group.label; menu.appendChild(header);
group.stations.forEach(st=>{

menu.appendChild(opt);
});
});

function addOperationInfo(){const start=operationInfoNormalizeName(document.getElementById('operationInfoStart')?.value||''),end=operationInfoNormalizeName(document.getElementById('operationInfoEnd')?.value||''),status=document.querySelector('input[name="operationStatus"]:checked')?.value||'delay',reason=document.getElementById('operationInfoReason')?.value||OPERATION_INFO_REASONS[0],delay=(document.getElementById('operationInfoDelay')?.value==='unknown'?'unknown':Number(document.getElementById('operationInfoDelay')?.value||0)||0),path=operationInfoFindPath(start,end);if(!path){alert('選択した2駅を結ぶ区間が見つかりません。');return;}if(status==='delay'&&delay!=='unknown'&&(!Number.isFinite(delay)||delay<5||delay%5!==0)){alert('遅延時間は5分単位で選択してください。');return;}const newEdges=operationInfoPathEdges(path),next=[];for(const raw of operationInfoEntries){const old=normalizeOperationEntry(raw);if(!old)continue;for(const part of operationInfoSubtractEdges(old.stations,newEdges)){next.push({...old,id:`${old.id}_${Math.random().toString(36).slice(2,7)}`,start:part[0],end:part.at(-1),stations:part});}}

function operationInfoStationRouteKey(stationName){
const n=operationInfoNormalizeName(stationName);
if(n==='高宮'||n==='八日市')return 'main';
const group=OPERATION_INFO_LINE_GROUPS.find(g=>g.stations.some(x=>operationInfoNormalizeName(x[0])===n));
if(!group)return null;
return ({'本線':'main','多賀線':'taga','八日市線':'yokaichi'})[group.label]||null;
}
function operationInfoVisibleSegments(){
const rows=[...document.querySelectorAll('.station-row')];
const byRouteName=new Map();
const byName=new Map();
rows.forEach((r,index)=>{
const name=operationInfoNormalizeName(r.querySelector('.station-name-ja')?.textContent||'');
const routeKey=r.dataset.routeKey||'';
if(!name)return;
const item={row:r,index};
const key=`${routeKey}\\u0000${name}`;
if(!byRouteName.has(key))byRouteName.set(key,[]);
byRouteName.get(key).push(item);
if(!byName.has(name))byName.set(name,[]);
byName.get(name).push(item);
});

const boundaryNames=new Set(['高宮','八日市']);
const rawSegments=[];
for(const raw of operationInfoEntries){
const e=normalizeOperationEntry(raw);
if(!e||!Array.isArray(e.stations)||e.stations.length<2)continue;
for(let i=0;i<e.stations.length-1;i++){
const a=operationInfoNormalizeName(e.stations[i]);
const b=operationInfoNormalizeName(e.stations[i+1]);
const routeA=operationInfoStationRouteKey(a);
const routeB=operationInfoStationRouteKey(b);
if(!routeA||!routeB)continue;

const getRows=(name,route)=>{
const exact=byRouteName.get(`${route}\\u0000${name}`)||[];
if(exact.length)return exact;
return boundaryNames.has(name)?(byName.get(name)||[]):[];
};
const ar=getRows(a,routeA),br=getRows(b,routeB);
if(!ar.length||!br.length)continue;

let best=null;
for(const x of ar)for(const y of br){
if(x.index===y.index)continue;
const lo=Math.min(x.index,y.index),hi=Math.max(x.index,y.index);
const dist=hi-lo;
if(!best||dist<best.distance)best={a:x,b:y,lo,hi,distance:dist};
}
if(!best)continue;

rawSegments.push({
lo:best.lo,hi:best.hi,rowA:best.a,rowB:best.b,
routeA,routeB,status:e.status==='suspend'?'suspend':'delay',
delay:operationInfoDelayValue(e.delay),entryId:e.id,createdAt:Number(e.createdAt)||0,
stationA:a,stationB:b
});
}
}

const picked=new Map();
for(const seg of rawSegments){
const edgeKey=operationInfoUndirectedKey(seg.stationA,seg.stationB);
const key=`${seg.entryId}\\u0000${edgeKey}`;
const prev=picked.get(key);
if(!prev||seg.createdAt>=prev.createdAt)picked.set(key,seg);
}
return {rows,segments:[...picked.values()]};
}

function renderOperationInfoZones(){
const layer=document.getElementById('operationInfoLayer');
if(!layer)return;
layer.innerHTML='';
const labelLayer=document.getElementById('operationInfoLabelLayer');
if(labelLayer)labelLayer.innerHTML='';
const {rows,segments}=operationInfoVisibleSegments();
if(rows.length<2||!segments.length)return;

const fixedZoneWidth=700;
const pieces=[];
const boundaryNames=new Set(['高宮','八日市']);

for(const seg of segments){
const lo=Math.min(seg.rowA.index,seg.rowB.index),hi=Math.max(seg.rowA.index,seg.rowB.index);
if(seg.routeA===seg.routeB){
let runStart=lo;
for(let i=lo+1;i<=hi;i++){
const route=rows[i]?.dataset?.routeKey||'';
if(route!==seg.routeA){
if(i-1>=runStart)pieces.push({...seg,lo:runStart,hi:i-1});
runStart=i+1;
}
}
if(runStart<=hi)pieces.push({...seg,lo:runStart,hi});
}else{
pieces.push({...seg,lo,hi});
}
}

const groups=[];
const orderedPieces=[...pieces]
.filter(p=>p.lo!==p.hi)
.sort((a,b)=>a.lo-b.lo||a.hi-b.hi);
for(const p of orderedPieces){
const last=groups[groups.length-1];
if(last && last.status===p.status && p.lo<=last.hi+1){
last.lo=Math.min(last.lo,p.lo);
last.hi=Math.max(last.hi,p.hi);
last.delay=(last.delay==='unknown'?p.delay:(p.delay==='unknown'?last.delay:Math.max(Number(last.delay),Number(p.delay))));
last.entryIds.add(p.entryId);
last.stationStart=rows[last.lo]?.querySelector('.station-name-ja')?.textContent||last.stationStart;
last.stationEnd=rows[last.hi]?.querySelector('.station-name-ja')?.textContent||last.stationEnd;
if(last.routeA!==p.routeA) last.routeA=p.routeA;
if(last.routeB!==p.routeB) last.routeB=p.routeB;
}else{
groups.push({
lo:p.lo,hi:p.hi,status:p.status,delay:p.delay,
routeA:p.routeA,routeB:p.routeB,
entryIds:new Set([p.entryId]),
stationStart:p.stationA,stationEnd:p.stationB
});
}
}

const labeledEntries=new Set();
for(let gi=0;gi<groups.length;gi++){
const g=groups[gi];
const topRow=rows[g.lo],bottomRow=rows[g.hi];
if(!topRow||!bottomRow)continue;

const boundaryStationNames=new Set(['高宮','八日市']);
if(g.hi-g.lo===1){
const topName=operationInfoNormalizeName(topRow.querySelector('.station-name-ja')?.textContent||'');
const bottomName=operationInfoNormalizeName(bottomRow.querySelector('.station-name-ja')?.textContent||'');
if(boundaryStationNames.has(topName)||boundaryStationNames.has(bottomName))continue;
}

let top=topRow.offsetTop;
let bottom=bottomRow.offsetTop+bottomRow.offsetHeight;

const prev=groups[gi-1],next=groups[gi+1];

if(prev && prev.status!==g.status){
if(prev.hi===g.lo){
const boundaryRow=rows[g.lo];
if(boundaryRow){
const badge=boundaryRow.querySelector('.station-badge');
const layerRect=layer.getBoundingClientRect();
if(badge){
const badgeRect=badge.getBoundingClientRect();
const center=badgeRect.top-layerRect.top+badgeRect.height/2;
top=center+10;
}else{
const rowRect=boundaryRow.getBoundingClientRect();
const center=rowRect.top-layerRect.top+rowRect.height/2;
top=center+10;
}
}
}else if(prev.hi+1===g.lo){
const upperRow=rows[prev.hi];
const lowerRow=rows[g.lo];
if(upperRow && lowerRow){
const boundary=Math.max(
upperRow.offsetTop+upperRow.offsetHeight,
lowerRow.offsetTop
);
top=boundary+10;
}
}
}

if(next && next.status!==g.status){
if(next.lo===g.hi){
const boundaryRow=rows[g.hi];
if(boundaryRow){
const badge=boundaryRow.querySelector('.station-badge');
const layerRect=layer.getBoundingClientRect();
if(badge){
const badgeRect=badge.getBoundingClientRect();
const center=badgeRect.top-layerRect.top+badgeRect.height/2;
bottom=center-10;
}else{
const rowRect=boundaryRow.getBoundingClientRect();
const center=rowRect.top-layerRect.top+rowRect.height/2;
bottom=center-10;
}
}
}else if(next.lo===g.hi+1){
const upperRow=rows[g.hi];
const lowerRow=rows[next.lo];
if(upperRow && lowerRow){
const boundary=Math.min(
upperRow.offsetTop+upperRow.offsetHeight,
lowerRow.offsetTop
);
bottom=boundary-10;
}
}
}

if(bottom<=top)continue;

const zone=document.createElement('div');
zone.className=`operation-info-zone ${g.status==='suspend'?'suspend':''}`;
zone.style.top=`${top}px`;
zone.style.height=`${bottom-top}px`;
zone.style.width=`${fixedZoneWidth}px`;
zone.style.left=`calc(50% - ${fixedZoneWidth/2}px)`;
layer.appendChild(zone);

const id=[...g.entryIds][0];
if(labelLayer&&id&&!labeledEntries.has(id)){
labeledEntries.add(id);
const label=document.createElement('button');
label.type='button';
label.className=`operation-info-zone-label ${g.status==='suspend'?'suspend':'delay'}`;
label.textContent=g.status==='suspend'?'運転見合わせ':operationInfoDelayText(g.delay);
label.title='運行情報の詳細を表示';
label.setAttribute('aria-label','運行情報の詳細を表示');
label.style.top=`${top+36}px`;
label.style.left=`calc(50% + ${fixedZoneWidth/2-100}px)`;
label.style.right='auto';
label.style.transform='translateX(-100%)';
label.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showOperationInfoDetail(id);});
labelLayer.appendChild(label);
}
}
}
function operationInfoRerender(){renderOperationInfoZones();}
window.addEventListener('resize',operationInfoRerender);
window.addEventListener('scroll',scheduleViewportTrainRender,{passive:true});
window.addEventListener('resize',scheduleViewportTrainRender,{passive:true});

async function init(){
  initControls();
  loadFormationState();
  loadOperationInfo();
  try{
    await loadOmi();
  }catch(e){
    console.error(e);
    document.getElementById('lineContainer').innerHTML=`<div style="padding:40px;text-align:center;font-weight:700;color:#c62828;max-width:900px">時刻表データを読み込めませんでした。<br>${esc(e.message||e)}<br><br>GitHubの <b>Omi.json</b> を読み込めませんでした。</div>`;
    return;
  }
  await initFirebase();
  initOperationInfoUI();
  if(firebaseReady){
    await loadOperationInfoFromFirebase();
    attachOperationInfoFirebaseListeners();
  }
  setNowTime();
  render();
  let lastOperationDate=operationDateKey();
  setInterval(()=>{
    if(isEditMode)return;
    if(followNow)updateCurrentTimeOnly();
    else renderTrainPositions();
  },1000);
  setInterval(()=>{
    const op=operationDateKey();
    if(op===lastOperationDate)return;
    lastOperationDate=op;
    if(followNow)setNowTime();
    else{loadOperationInfo();renderOperationInfoList();renderOperationInfoZones();}
  },1000);
}
init();
(function(){function syncControlBarLayout(){const title=document.getElementById('title'),bar=document.querySelector('.control-bar'),line=document.getElementById('lineContainer');if(!bar||!line)return;const scale=window.innerWidth<=959.98?window.innerWidth/960:1;const tr=title?.getBoundingClientRect(),br=bar.getBoundingClientRect(),titleH=(tr?.height||(58*scale))/scale,barH=(br?.height||0)/scale;line.style.marginTop=`${Math.ceil(titleH+barH)}px`;document.documentElement.style.setProperty('--control-bar-height',`${Math.ceil(barH)}px`);}window.addEventListener('load',syncControlBarLayout);window.addEventListener('resize',syncControlBarLayout);if(document.fonts?.ready)document.fonts.ready.then(syncControlBarLayout).catch(()=>{});setTimeout(syncControlBarLayout,0);})();
</script>
