<script>
'use strict';

const COLORS={main:'#0068b7',yokaichi:'#159447',taga:'#d33b3b'};
const ROUTES={
  main:{color:COLORS.main,stations:[
    ['米原','Maibara'],['フジテック前','Fujitec-mae'],['鳥居本','Toriimoto'],['彦根','Hikone'],['ひこね芹川','Hikone-serikawa'],['彦根口','Hikoneguchi'],['高宮','Takamiya'],['尼子','Amago'],['豊郷','Toyosato'],['愛知川','Echigawa'],['五箇荘','Gokasho'],['河辺の森','Kawabenomori'],['八日市','Yokaichi'],['長谷野','Nagatanino'],['大学前','Daigaku-mae'],['京セラ前','Kyocera-mae'],['桜川','Sakuragawa'],['朝日大塚','Asahi-otsuka'],['朝日野','Asahino'],['日野','Hino'],['水口松尾','Minakuchi-matsuo'],['水口','Minakuchi'],['水口石橋','Minakuchi-ishibashi'],['水口城南','Minakuchi-jōnan'],['貴生川','Kibukawa']
  ]},
  taga:{color:COLORS.taga,stations:[
    ['高宮','Takamiya'],['スクリーン','Screen'],['多賀大社前','Taga-taisha-mae']
  ]},
  yokaichi:{color:COLORS.yokaichi,stations:[
    ['八日市','Yokaichi'],['新八日市','Shin-yokaichi'],['太郎坊宮前','Tarobobo-mae'],['市辺','Ichibe'],['平田','Hirata'],['武佐','Musa'],['近江八幡','Omihachiman']
  ]}
};
const MAIN_NAMES=ROUTES.main.stations.map(x=>x[0]);
const TAGA_NAMES=ROUTES.taga.stations.map(x=>x[0]);
const YOKAICHI_NAMES=ROUTES.yokaichi.stations.map(x=>x[0]);
const BRANCH_NAMES=new Set([...TAGA_NAMES.slice(1),...YOKAICHI_NAMES.slice(1)]);
const OMI_JSON_URL='https://minamikaze2700.github.io/Unyomatome/timetable/Omi.json';
const FORMATION_IMG_BASE='https://minamikaze2700.github.io/Unyomatome/images/';
const OMI_IMG=n=>`${FORMATION_IMG_BASE}Omi${n}.png`;
const NOIMAGE_IMG=`${FORMATION_IMG_BASE}Omi_noimage.png`;

let TRAINS=[];
let activeBranches=new Set();
let currentDay='平日';
let selectedDateKey='';
let followNow=true;
let currentStationId=null;
let currentStationRoute='main';
let stationTimetableDirection='down';
let currentTrainNo=null;
let currentTrainDirection=null;
let previousSheetContext=null;
const FORMATION_STORAGE_KEY='omi_formation_state_v1';
let formationState={平日:{},休日:{}};

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function normName(v){return String(v??'').normalize('NFKC').replace(/\u3000/g,'').replace(/\s+/g,'').trim();}
function sameStation(a,b){return normName(a)===normName(b);}
function stationName(st){return Array.isArray(st)?st[0]:String(st||'');}
function stationObj(routeKey,name){return ROUTES[routeKey]?.stations.find(s=>sameStation(s[0],name))||null;}
function routeForStationName(name){
  const n=normName(name);
  if(TAGA_NAMES.slice(1).some(x=>normName(x)===n))return 'taga';
  if(YOKAICHI_NAMES.slice(1).some(x=>normName(x)===n))return 'yokaichi';
  return 'main';
}
function routeForPair(a,b){
  const A=normName(a),B=normName(b);
  if((TAGA_NAMES.some(x=>normName(x)===A)&&TAGA_NAMES.some(x=>normName(x)===B)) && (A!==normName('八日市')&&B!==normName('八日市'))) return 'taga';
  if(YOKAICHI_NAMES.some(x=>normName(x)===A)&&YOKAICHI_NAMES.some(x=>normName(x)===B)) return 'yokaichi';
  if((A===normName('高宮')&&TAGA_NAMES.some(x=>normName(x)===B))||(B===normName('高宮')&&TAGA_NAMES.some(x=>normName(x)===A))) return 'taga';
  if((A===normName('八日市')&&YOKAICHI_NAMES.some(x=>normName(x)===B))||(B===normName('八日市')&&YOKAICHI_NAMES.some(x=>normName(x)===A))) return 'yokaichi';
  return 'main';
}
function directionForPair(a,b){
  const r=routeForPair(a,b);
  const names=ROUTES[r].stations.map(x=>x[0]);
  const ia=names.findIndex(x=>sameStation(x,a));
  const ib=names.findIndex(x=>sameStation(x,b));
  if(ia<0||ib<0||ia===ib)return null;
  return ib>ia?'down':'up';
}
function inferTrainDirection(stops){
  for(let i=0;i<stops.length-1;i++){
    const d=directionForPair(stops[i].station,stops[i+1].station);
    if(d)return d;
  }
  return 'down';
}
function normalizeDirection(v){
  const s=String(v??'').trim().toLowerCase();
  if(/^(up|上り|上|toward-up)$/.test(s))return 'up';
  if(/^(down|下り|下|toward-down)$/.test(s))return 'down';
  return '';
}
function parseMin(v){
  if(v==null)return NaN;
  let s=String(v).trim().replace(/[：]/g,':');
  if(!s)return NaN;
  const m=s.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(!m)return NaN;
  let h=Number(m[1]),mi=Number(m[2]);
  if(!Number.isFinite(h)||!Number.isFinite(mi))return NaN;
  return h*60+mi;
}
function toTimeText(v){
  const m=parseMin(v); if(!Number.isFinite(m))return '';
  const h=Math.floor(m/60)%24,mi=m%60;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}
function stopArray(raw){
  let arr=raw?.stops??raw?.timetable??raw?.times??[];
  if(!Array.isArray(arr) && arr && typeof arr==='object') arr=Object.entries(arr).map(([station,time])=>({station,time}));
  if(!Array.isArray(arr))return [];
  return arr.map(x=>({
    ...x,
    station:stationName(x?.station??x?.name??x?.StationName),
    time: x?.departure??x?.dep??x?.time??x?.arrival??x?.arr??null,
    departure:x?.departure??x?.dep??null,
    arrival:x?.arrival??x?.arr??null
  })).filter(x=>normName(x.station)&&Number.isFinite(parseMin(x.time)));
}
function daysFor(raw){
  let d=raw?.days??raw?.day??raw?.calendar;
  if(typeof d==='string')d=[d];
  if(!Array.isArray(d)||!d.length)return ['平日','休日'];
  const out=[];
  d.forEach(x=>{const s=String(x); if(/平日|weekday/i.test(s))out.push('平日'); if(/休日|土曜|日曜|holiday|weekend/i.test(s))out.push('休日');});
  return [...new Set(out.length?out:['平日','休日'])];
}
function normalizeTrain(raw,dayOverride=null){
  if(!raw||typeof raw!=='object')return null;
  const stops=stopArray(raw); if(!stops.length)return null;
  const no=String(raw.no??raw.trainNo??raw.trainNumber??raw.number??raw.operationNo??'').trim();
  if(!no)return null;
  const days=dayOverride?[dayOverride]:daysFor(raw);
  const direction=normalizeDirection(raw.direction)||inferTrainDirection(stops);
  const dest=String(raw.dest??raw.destination??raw.end??stops.at(-1)?.station??'').trim();
  const formation=String(raw.formation??raw.formationNo??raw.編成??'').trim();
  return {...raw,no,direction,dest,formation,type:'普通',days,stops};
}
function minuteOfStop(s){return parseMin(s?.time);}
function cloneTrain(t){return JSON.parse(JSON.stringify(t));}
function mergeOmiFragments(list){
  const groups=new Map();
  for(const t of list){
    for(const day of (t.days||['平日'])){
      const d={...t,days:[day],stops:t.stops.map(x=>({...x}))};
      const key=`${day}|${t.no}|${t.direction}`;
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(d);
    }
  }
  const result=[];
  for(const items of groups.values()){
    items.sort((a,b)=>(minuteOfStop(a.stops[0])-minuteOfStop(b.stops[0])));
    const merged=[];
    for(const cur of items){
      let target=merged.at(-1);
      if(target){
        const a=target.stops.at(-1),b=cur.stops[0];
        const ta=minuteOfStop(a),tb=minuteOfStop(b);
        const sameJunction=a&&b&&sameStation(a.station,b.station) && Number.isFinite(ta)&&Number.isFinite(tb) && Math.abs(tb-ta)<=30;
        if(sameJunction){
          const nextStops=cur.stops.slice(1);
          target.stops.push(...nextStops);
          target.dest=cur.dest||target.dest;
          target.formation=target.formation||cur.formation||'';
          continue;
        }
      }
      merged.push(cloneTrain(cur));
    }
    result.push(...merged);
  }
  return result;
}
async function loadOmi(){
  const res=await fetch(OMI_JSON_URL,{cache:'no-store'});
  if(!res.ok)throw new Error(`Omi.json の読み込みに失敗しました (${res.status})`);
  const raw=await res.json();
  let arr=Array.isArray(raw)?raw:(Array.isArray(raw?.trains)?raw.trains:[]);
  if(!arr.length)throw new Error('Omi.json に列車データがありません。');
  TRAINS=mergeOmiFragments(arr.map(x=>normalizeTrain(x)).filter(Boolean));
  if(!TRAINS.length)throw new Error('Omi.json から有効な列車データを作成できませんでした。');
  applyFormationState();
}

function buildScreenRows(){
  const rows=[],push=(st,routeKey,opt={})=>rows.push({st,routeKey,opt:{...opt}});

  for(let i=0;i<main.length;i++){
    const st=main[i],next=main[i+1],prev=main[i-1],opt={};
    if(i===0)opt.cutAbove=true;
    if(i===main.length-1)opt.cutBelow=true;

    // Main-line color assignment; active branch stations follow the source page's
    // multi-route behavior: the station joins the branch color and the branch
    // itself occupies the following section, then the main line fades back in.
    opt.lineTop=prev?COLORS.main:'transparent';
    opt.lineBottom=next?COLORS.main:'transparent';
    opt.stationColor=COLORS.main;

    if(st[0]==='高宮'){
      opt.buttons=[{label:'多賀線',color:COLORS.taga,action:()=>toggleBranch('taga'),active:activeBranches.has('taga')}];
      if(activeBranches.has('taga')){
        opt.lineBottom=COLORS.taga;
        opt.stationColor=COLORS.taga;
      }
    }
    if(st[0]==='八日市'){
      opt.buttons=[{label:'八日市線',color:COLORS.yokaichi,action:()=>toggleBranch('yokaichi'),active:activeBranches.has('yokaichi')}];
      if(activeBranches.has('yokaichi')){
        opt.lineBottom=COLORS.yokaichi;
        opt.stationColor=COLORS.yokaichi;
      }
    }

    push(st,'main',opt);

    if(st[0]==='高宮'&&activeBranches.has('taga')){
      const b=ROUTES.taga.stations.slice(1);
      b.forEach((x,j)=>push(x,'taga',{
        lineTop:COLORS.taga,
        lineBottom:COLORS.taga,
        stationColor:COLORS.taga,
        cutBelow:j===b.length-1,
        breakAfter:j===b.length-1
      }));
      if(next){
        const no={lineTop:'transparent',lineBottom:COLORS.main,stationColor:COLORS.main,fadeUp:true,fadeColor:COLORS.main,breakBefore:true};
        push(next,'main',no);i++;
      }
    }

    if(st[0]==='八日市'&&activeBranches.has('yokaichi')){
      const b=ROUTES.yokaichi.stations.slice(1);
      b.forEach((x,j)=>push(x,'yokaichi',{
        lineTop:COLORS.yokaichi,
        lineBottom:COLORS.yokaichi,
        stationColor:COLORS.yokaichi,
        cutBelow:j===b.length-1,
        breakAfter:j===b.length-1
      }));
      if(next){
        const no={lineTop:'transparent',lineBottom:COLORS.main,stationColor:COLORS.main,fadeUp:true,fadeColor:COLORS.main,breakBefore:true};
        push(next,'main',no);i++;
      }
    }
  }

  // Same post-processing pattern as the source multi-line page: every section
  // boundary is resolved from the actual neighboring rows, so hidden branches
  // do not leave their colors attached to the main line.
  for(let i=0;i<rows.length;i++){
    const r=rows[i],p=rows[i-1],n=rows[i+1];
    const pb=!!r.opt.breakBefore||!!p?.opt?.breakAfter;
    const nb=!!r.opt.breakAfter||!!n?.opt?.breakBefore;
    if(!pb&&p)r.opt.lineTop=screenEdgeColor(p,r);else if(pb||!p)r.opt.lineTop='transparent';
    if(!nb&&n)r.opt.lineBottom=screenEdgeColor(r,n);else if(nb||!n)r.opt.lineBottom='transparent';

    if(r.st[0]==='高宮'&&activeBranches.has('taga')){
      r.opt.lineBottom=COLORS.taga;
      r.opt.stationColor=COLORS.taga;
    }
    if(r.st[0]==='八日市'&&activeBranches.has('yokaichi')){
      r.opt.lineBottom=COLORS.yokaichi;
      r.opt.stationColor=COLORS.yokaichi;
    }
  }
  return rows;
}

    '八日市|新八日市':COLORS.yokaichi

function trainRunsAtMinute(t,minutes){

function mainlineVisualPosition(pair,q){

  content.innerHTML=stationSheetHTML(found.st,currentStationRoute);
  content.querySelectorAll('.station-timetable-direction-tab').forEach(b=>b.addEventListener('click',()=>{stationTimetableDirection=b.dataset.dir;updateStationSheetContent();scrollStationTimetableToNext();}));
  content.querySelectorAll('.station-timetable-row').forEach(b=>b.addEventListener('click',()=>{const t=TRAINS.find(x=>String(x.no)===String(b.dataset.no)&&String(x.direction)===String(b.dataset.dir)&&x.days.includes(currentDay));if(t)openTrainSheet(t,{type:'station-timetable',stationId:currentStationId,direction:stationTimetableDirection,stationName:found.st[0]});}));
}
function scrollStationTimetableToNext(){
  requestAnimationFrame(()=>{
    const wrap=document.querySelector('.station-timetable-wrap');if(!wrap)return;const rows=[...wrap.querySelectorAll('.station-timetable-row')];if(!rows.length)return;
    const now=currentMinutes();let target=rows.find(r=>{const m=parseMin(r.querySelector('.station-timetable-time')?.textContent||'');return Number.isFinite(m)&&m>=now;});if(!target)target=rows[0];if(target)wrap.scrollTop=Math.max(0,target.offsetTop-2);
  });
}
function trainStopListHTML(t){return (t.stops||[]).map(s=>`<div class="station-stop-item"><span class="station-stop-time">${esc(toTimeText(s.time))}</span><span class="station-stop-dot"></span><span class="station-stop-name">${esc(s.station)}</span></div>`).join('');}
function openTrainSheet(base,fromContext=null){
  const t=liveTrain(base);currentTrainNo=t.no;currentTrainDirection=t.direction;previousSheetContext=fromContext&&fromContext.type==='station-timetable'?fromContext:null;setSheetBackVisible(!!previousSheetContext);document.getElementById('sheetHeaderTitle').textContent='列車情報';
  const content=document.getElementById('sheetContent');const form=formationNumber(t.formation);
  content.innerHTML=`<div class="train-card"><img class="train-card-img" src="${esc(trainImageFor(t))}" alt="${esc(t.no)}" onerror="this.onerror=null;this.src='${NOIMAGE_IMG}'"><div class="train-info-main"><div><span class="type-badge hanzomon-local">普通</span><span class="train-title">${esc(t.dest||'')}</span><span class="train-number">${esc(t.no)}</span></div><div class="formation-id">${form?`編成 ${esc(form)}`:'編成未選択'}</div><div class="capacity-info">所定: 普通</div></div></div>
  <div class="formation-edit-box"><div style="font-weight:800;margin-bottom:7px">編成を入力</div><input id="formationInput" value="${esc(form)}" placeholder="例：805"><button type="button" id="formationSaveBtn">登録</button></div>
  <div class="station-stop-list">${trainStopListHTML(t)}</div>`;
  content.querySelector('#formationSaveBtn')?.addEventListener('click',()=>{const v=content.querySelector('#formationInput')?.value||'';const target=TRAINS.find(x=>String(x.no)===String(t.no)&&String(x.direction)===String(t.direction)&&x.days.includes(currentDay));if(target)setFormationForTrain(target,v);updateTrainSheetAfterFormation(target||t);});
  openSheet();
}
function updateTrainSheetAfterFormation(base){
  const t=liveTrain(base||{});const content=document.getElementById('sheetContent');const img=content.querySelector('.train-card-img');if(img){img.src=trainImageFor(t);}const id=content.querySelector('.formation-id');if(id){const form=formationNumber(t.formation);id.textContent=form?`編成 ${form}`:'編成未選択';}renderTrainPositions();
}
function openSheet(){document.getElementById('overlay').style.display='block';document.getElementById('bottomSheet').classList.add('active');}
function closeSheet(){document.getElementById('overlay').style.display='none';document.getElementById('bottomSheet').classList.remove('active');currentStationId=null;currentTrainNo=null;previousSheetContext=null;setSheetBackVisible(false);}
function setSheetBackVisible(v){const b=document.getElementById('sheetBackBtn');if(b)b.classList.toggle('visible',!!v);}
function sheetBack(){if(previousSheetContext?.stationId){currentStationId=previousSheetContext.stationId;currentStationRoute=String(previousSheetContext.stationId).split('::')[0];stationTimetableDirection=previousSheetContext.direction==='up'?'up':'down';previousSheetContext=null;setSheetBackVisible(false);document.getElementById('sheetHeaderTitle').textContent='駅情報';updateStationSheetContent();scrollStationTimetableToNext();}}
function render(){const lc=document.getElementById('lineContainer');lc.innerHTML='<div class="moving-train-layer" id="movingTrainLayer"></div>';buildScreenRows().forEach(r=>lc.appendChild(createRow(r.st,r.routeKey,r.opt)));renderTrainPositions();}
function initControls(){
  const d=new Date();selectedDateKey=todayKey(d);currentDay=scheduleDayForKey(selectedDateKey);updateDayUI();const ti=document.getElementById('timeInput');if(ti)ti.value=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  document.getElementById('dateInput')?.addEventListener('change',e=>setDateValue(e.target.value));
  document.getElementById('timeInput')?.addEventListener('input',()=>{followNow=false;document.getElementById('nowBtn')?.classList.remove('active');renderTrainPositions();});
  document.getElementById('nowBtn')?.addEventListener('click',setNowTime);
  document.getElementById('closeBtn')?.addEventListener('click',closeSheet);document.getElementById('overlay')?.addEventListener('click',closeSheet);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
  setInterval(()=>{if(followNow){const d=new Date();const ti=document.getElementById('timeInput');if(ti)ti.value=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;renderTrainPositions();}},10000);
}
window.addEventListener('resize',()=>renderTrainPositions());window.addEventListener('scroll',()=>renderTrainPositions(),{passive:true});
async function init(){initControls();loadFormationState();try{await loadOmi();render();}catch(e){console.error(e);document.getElementById('lineContainer').innerHTML=`<div style="padding:40px;text-align:center;font-weight:700;color:#c62828;max-width:900px">時刻表データを読み込めませんでした。<br>${esc(e.message||e)}<br><br>GitHubの <b>Omi.json</b> を読み込めませんでした。</div>`;}}
init();
</script>

</body>
