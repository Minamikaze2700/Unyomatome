<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>運用まとめ - 東武アーバンパークライン</title>
<style>
body{
  font-family:sans-serif;
  background:#fff;
  position:relative;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#fff}
h1{
  height:50px;color:#fff;font-weight:500;display:flex;background:#00aeef;
  width:100%;position:fixed;justify-content:center;align-items:center;
  border-bottom:8px solid #1ff020;z-index:100
}
#title img{height:40px;margin-right:10px}
.line{
  position: absolute;left:50%;top:50px;bottom: 0;width:min(16px, 2vw);
  background:#00aeef;transform:translateX(-50%);z-index:-1
}
.station-list{
  padding-top:90px;display:flex;flex-direction:column;
  align-items:center;gap:150px;padding-bottom:60px
}

.station{
  position:relative;
  width:min(400px, 50vw);
  aspect-ratio:400 / 74;
  height:auto;
  border:0;
  background:transparent;
  cursor:pointer;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.35));
  -webkit-tap-highlight-color:transparent;
  container-type:inline-size;
}

.station::before{
  content:"";
  position:absolute;
  inset:0;
  background:#00aeef;
  z-index:0;
}

.station::after{
  content:"";
  position:absolute;
  left:2cqw;
  right:2cqw;
  top:0.75cqw;
  bottom:0.75cqw;
  background:
    linear-gradient(110deg,
      #00aeef 0 1.75cqw,
      #fff 1.75cqw calc(100% - 1.75cqw),
      #00aeef calc(100% - 1.75cqw) 100%);
  clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);
  z-index:1;
}

.label,.major_label{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:82%;
  text-align:center;
  white-space:nowrap;
  z-index:2;
  pointer-events:none;
}
.major_label{
font-weight:500;
}
.jp{line-height:1;white-space:nowrap}
.en{font-size:3.75cqw;margin-top:0.5cqw;white-space:nowrap}

.station:focus-visible{
  outline:3px solid #222;
  outline-offset:5px;
}
.station:active{
  transform:translateY(1px);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));
}

@media(max-width:440px){
  h1{font-size:20px}
}
</style>
</head>
<body>
<h1 id="title"><img src="https://static.tobuspapp.jp/html/operation_tobupo/img/xxxhdpi/pos_icon_nodaline.png" alt="">東武アーバンパークライン</h1>

<script>
document.querySelectorAll(".jp").forEach(e=>{
  const len=[...e.textContent.trim()].length;
  let ls="0";
  if(len<=2){ls=".9em";}
  else if(len===3){ls=".3em";}
  else if(len===4){ls=".0em";}
  else if(len===5){ls=".0em";}
  else if(len===6){ls=".0em";}
  else if(len===7){ls=".0em";}
  else {ls="0";}
  e.style.fontSize="8.75cqw";
  e.style.letterSpacing=ls;
  e.style.paddingLeft=ls;
});
</script>
</body>
</html>
